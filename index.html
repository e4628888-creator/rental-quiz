"x":"消防法施行細則第5條：消防法第13條第1項所定消防防護計畫應包括「防火避難設施之自行檢查：每月至少檢查一次」，檢查結果遇有缺失應報告管理權人立即改善，故選(A)。","b":[{"k":"law","l":"消防法施行細則","r":"第5條第2款","q":"防火避難設施之自行檢查：每月至少檢查一次，檢查結果遇有缺失，應報告管理權人立即改善。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0120002"}],"nt":"簡報未提及消防防護計畫自行檢查頻率。"}},{"id":"08-04-015","c":"08","t":"08-04","n":"15","q":"依據消防法所制定之消防防護計畫中，何種行為應另定消防防護計畫，以監督施工單位用火、用電情形？","o":["申請變更使用執照","申請拆除執照","室內裝修施工","更換防焰窗簾"],"a":"C","ty":"gen","e":{"s":"ok","x":"消防法第13條第3項：建築物遇有增建、改建、修建、變更使用或室內裝修施工致影響原有系統式消防安全設備功能時，管理權人應責由防火管理人另定施工中消防防護計畫；消防防護計畫並應包括用火及用電之監督管理（施行細則第5條第7款）。四選項中屬施工行為者為室內裝修施工，故選(C)。","b":[{"k":"law","l":"消防法","r":"第13條第3項","q":"第一項建築物遇有增建、改建、修建、變更使用或室內裝修施工致影響原有系統式消防安全設備功能時，其管理權人應責由防火管理人另定施工中消防防護計畫。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0120001"},{"k":"law","l":"消防法施行細則","r":"第5條第7款","q":"七、用火及用電之監督管理。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0120002"}],"nt":"現行條文未見題目「以監督施工單位用火、用電情形」之字句，且另定施工中消防防護計畫以「致影響原有系統式消防安全設備功能」為要件；題目結論（室內裝修施工）與現行法一致。"}},{"id":"08-04-016","c":"08","t":"08-04","n":"16","q":"6層樓之公寓大厦年底舉辦跨年晚會，擬舉辦晚會並且邀請火舞舞者以明火表演，應向何機關申請許可？","o":["因未達10層之建築物，免申請","應向建築管理機關申請是內裝修許可","應向主管消防機關申請許可","應向主管環境保護機關申請許可"],"a":"C","ty":"gen","e":{"s":"ok","x":"消防法第14條之1第1項：供公眾使用建築物非經場所之管理權人申請主管機關許可，不得以產生火焰、火花或火星等方式進行表演性質之活動；簡報（建3-3）頁52所列供公眾使用建築物包括六層以上之集合住宅（公寓），故6層公寓大廈之火舞表演應向主管消防機關申請許可，故選(C)。","b":[{"k":"law","l":"消防法","r":"第14條之1第1項","q":"供公眾使用建築物及中央主管機關公告之場所，除其他法令另有規定外，非經場所之管理權人申請主管機關許可，不得使用以產生火焰、火花或火星等方式，進行表演性質之活動。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0120001"},{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－建物與室內裝修管理實務（建3-1～建3-3）","r":"頁碼52（PDF第53頁）","q":"20 六層以上之集合住宅(公寓)。"}]}},{"id":"08-04-017","c":"08","t":"08-04","n":"17","q":"集合住宅建築物依法設置之消防設備，應多久辦理一次消防安全設備檢修及申報作業？","o":["每年","每半年","每季","每2個月"],"a":"A","ty":"gen","e":{"s":"ok","x":"簡報（建3-2）頁29：租賃住宅多屬各類場所消防安全設備設置標準第12條乙類場所第七目（集合住宅、寄宿舍），消防安全檢修申報為每年一次、九月底前；消防安全設備檢修及申報辦法附表一亦列「乙類場所七～九目 每年一次」，故選(A)。","b":[{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－建物與室內裝修管理實務（建3-1～建3-3）","r":"頁碼29（PDF第30頁）","q":"12條所示之乙類場所之第七目(集合住宅、寄宿舍)，所以每年消防安全檢修申報期限為每年一次、九月底前。"},{"k":"law","l":"各類場所消防安全設備設置標準","r":"第12條第2款第7目","q":"（七）集合住宅、寄宿舍、住宿型精神復健機構。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0120029"},{"k":"web","l":"消防安全設備檢修及申報辦法附表一（行政院公報第29卷第37期）","r":"附表一","q":"乙類場所七～九目 每年一次 每年九月底前","u":"https://gazette.nat.gov.tw/EG_FileManager/eguploadpub/eg029037/ch02/type1/gov10/num2/images/Eg01.pdf"}],"nt":"辦法於115-02-25再修正，未能讀取最新附表；依公報版附表及簡報，集合住宅每年檢修申報一次。"}},{"id":"08-04-018","c":"08","t":"08-04","n":"18","q":"未申領使用執照或未依使用執照用途之違規使用場所，應以何用途依據，辦理檢修申報？","o":["依照甲類場所標準","依照當地都市計畫之規定","依照實際用途標準","依照乙類場所標準"],"a":"C","ty":"gen","e":{"s":"ok","x":"簡報（建3-2）頁28所附消防安全設備檢修及申報辦法「各類場所消防安全設備檢修期限及申報備查期限表」備註三：未申領使用執照或未依使用執照用途之違規使用場所，管理權人應以其實際用途辦理檢修申報，故選(C)。","b":[{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－建物與室內裝修管理實務（建3-1～建3-3）","r":"頁碼28（PDF第29頁）","q":"未申領使用執照或未依使用執照用途之違規使用場所，管理權人應以其實際用途，辦理檢修申報。"},{"k":"law","l":"消防安全設備檢修及申報辦法","r":"第8條第3項","q":"於違規使用場所，為該場所現有之消防安全設備。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0120054"}],"nt":"引文為簡報頁28表格圖片（資料來源：全國法規資料庫）之備註三，看圖逐字抄錄。該辦法已於115-02-25修正，檢修期限表現為附表一（PDF附檔 robots 禁止讀取），未能確認現行備註文字；條文本身未見「實際用途」字樣。"}},{"id":"08-04-019","c":"08","t":"08-04","n":"19","q":"建築物依法設置之防火鐵捲門，平常使用應注意何種事項，以維安全？","o":["下方可以停車","永遠常開，不得關閉","下方得放置盆栽","下方保持淨空"],"a":"D","ty":"gen","e":{"s":"ok","x":"內政部建築研究所研究報告摘要引建築物防火避難設施與設備安全檢查報告書F2-1-3：防火捲門者，其下方不得堆置雜物妨害啟降功能；故下方應保持淨空，不可停車或放置盆栽，故選(D)。","b":[{"k":"web","l":"建築防火區劃開口部防火設備檢查機制研究-以防火門安裝與使用為例（內政部建築研究所）","r":"","q":"防火捲門者，其下方不得堆置雜物妨害啟降功能","m":"研究摘要引述建築物防火避難設施與設備安全檢查報告書F2-1-3之檢查內容。","u":"https://www.abri.gov.tw/News_Content_Table.aspx?n=807&s=261057"}],"nt":"簡報未提及防火鐵捲門。"}},{"id":"08-04-020","c":"08","t":"08-04","n":"20","q":"下列何處不得堆積物品，以致妨防火避難行為？","o":["儲藏室","露臺","陽臺","共同走廊"],"a":"D","ty":"neg","e":{"s":"ok","x":"簡報（法5-4）頁148引公寓大廈管理條例第16條第2項：住戶不得於私設通路、防火間隔、樓梯間、共同走廊、防空避難設備等處所堆置雜物；陽臺、露臺、儲藏室不在該項所列，故選(D)。","b":[{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－租賃住宅相關法規與實務（法5-1～法5-5）","r":"頁碼148（PDF第149頁）","q":"住戶不得於私設通路、防火間隔、防火巷弄、開放空間、退縮空地、樓梯間、共同走廊、防空避難設備等處所堆置雜物"},{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－租賃住宅相關法規與實務（法5-1～法5-5）","r":"頁碼130（PDF第131頁）","q":"樓梯間、共同走廊、防空避難設備等處所堆置雜物"}]}},{"id":"08-04-021","c":"08","t":"08-04","n":"21","q":"裝設發電機及蓄電池之處所，因散熱不佳，可透過下列何種方式以求改善散熱？","o":["應加裝通風扇","應加裝自動時控","開口不得小於60平方公分","牆壁可增加通風開口，但仍應考慮須為防火時效構造"],"a":"D","ty":"gen","e":{"s":"unclear","x":"","b":[{"k":"law","l":"建築技術規則建築設備編","r":"第7條之1","q":"緊急電源之供應，採用發電機設備者，發電機室應有適當之進氣及排氣開孔，並應留設維修進出通道；採用蓄電池設備者，蓄電池室應有適當之排氣裝置。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?media=print&pcode=D0070117"}],"f":"簡報（建3-2頁28–38）未提及發電機/蓄電池處所散熱。建築設備編第7條之1僅要求發電機室有適當進氣及排氣開孔、蓄電池室有適當排氣裝置，可部分支持(D)「增加通風開口」，但查無「仍應考慮須為防火時效構造」之依據；且同編第101、102條機械通風量表將蓄電池間列為「自然送風及機械排風」，(A)加裝通風扇亦有依據，無法明確排除。另查工程會緊急供電設備工程品質管理實務、建築設計施工編第241–244條均無相關規定。"}},{"id":"08-04-022","c":"08","t":"08-04","n":"22","q":"屋頂增設夜間照明，照明電力線應距離屋頂避雷導線多少距離以上，以維安全？","o":["1公尺","2公尺","3公尺","5公尺"],"a":"A","ty":"num","e":{"s":"ok","x":"建築技術規則建築設備編第25條第1款：避雷導線須與電力線、電話線、燃氣設備之供氣管路離開一公尺以上（有靜電隔離者除外），故屋頂照明電力線應距避雷導線1公尺以上，故選(A)。","b":[{"k":"law","l":"建築技術規則建築設備編","r":"第25條第1款","q":"避雷導線須與電力線、電話線、燃氣設備之供氣管路離開一公尺以上。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070117"}]}},{"id":"08-04-023","c":"08","t":"08-04","n":"23","q":"消防緊急照明燈應連結緊急電源，容量應可持續動作多久時間以上？","o":["5分鐘","30分鐘","60分鐘","90分鐘"],"a":"B","ty":"num","e":{"s":"ok","x":"設置標準第177條：緊急照明設備應連接緊急電源，緊急電源應使用蓄電池設備，其容量應能使其持續動作三十分鐘以上，故選(B)。","b":[{"k":"law","l":"各類場所消防安全設備設置標準","r":"第177條第1項、第2項","q":"緊急照明設備應連接緊急電源。前項緊急電源應使用蓄電池設備，其容量應能使其持續動作三十分鐘以上。","u":"https://lawplayer.com/act/6437d0bee800e5f0b9302304/20"}],"nt":"同項但書：採蓄電池設備與緊急發電機併設方式時，分別為十分鐘及三十分鐘以上。"}},{"id":"08-04-024","c":"08","t":"08-04","n":"24","q":"裝設換氣設備，換氣風管如果貫穿防火區劃，應在貫穿部位任一側之風管內裝設防火閘門或閘板，應具有多久以上之防火時效？","o":["30分鐘","60分鐘","90分鐘","120分鐘"],"a":"B","ty":"num","e":{"s":"ok","x":"建築技術規則建築設計施工編第85條第1項：貫穿防火區劃牆壁或樓地板之風管，應在貫穿部位任一側之風管內裝設防火閘門或閘板，其與貫穿部位合成之構造，並應具有一小時以上之防火時效，故選(B)。","b":[{"k":"law","l":"建築技術規則建築設計施工編","r":"第85條第1項","q":"貫穿防火區劃牆壁或樓地板之風管，應在貫穿部位任一側之風管內裝設防火閘門或閘板，其與貫穿部位合成之構造，並應具有一小時以上之防火時效。","u":"https://lawplayer.com/act/6437d09ce800e5f0b9301eae/20"}],"nt":"條文係「與貫穿部位合成之構造」具一小時以上防火時效。"}},{"id":"08-04-025","c":"08","t":"08-04","n":"25","q":"高層建築物使用燃氣設備及使用導管瓦斯者，應於哪個地方設置瓦斯緊急遮斷設備？","o":["瓦斯進入端","屋頂","避難層","防災中心"],"a":"D","ty":"gen","e":{"s":"ok","x":"建築技術規則建築設計施工編第259條第1項第4款第6目：高層建築物燃氣設備及使用導管瓦斯者應設置之瓦斯緊急遮斷設備，其顯示裝置及控制應設於防災中心，故選(D)。","b":[{"k":"law","l":"建築技術規則建築設計施工編","r":"第259條第1項第4款第6目","q":"高層建築物左列各種防災設備，其顯示裝置及控制應設於防災中心：","m":"第6目：燃氣設備及使用導管瓦斯者，應設置之瓦斯緊急遮斷設備。","u":"https://lawplayer.com/act/6437d09ce800e5f0b9301eae/60"}]}},{"id":"08-05-001","c":"08","t":"08-05","n":"01","q":"建築技術規則法源基礎與適用範圍為何？","o":["由立法院三讀通過，總統公告施行，全國適用","由內政部訂定，全國適用","由各縣市政府訂定，該縣市適用","由各設備目的事業主管機關訂定發布"],"a":"B","ty":"gen","e":{"s":"ok","x":"建築法第97條：有關建築規劃、設計、施工、構造、設備之建築技術規則，由中央主管建築機關定之；同法第2條第1項：主管建築機關在中央為內政部。故建築技術規則係由內政部依建築法授權訂定之全國性法規命令，故選(B)。","b":[{"k":"law","l":"建築法","r":"第97條","q":"有關建築規劃、設計、施工、構造、設備之建築技術規則，由中央主管建築機關定之，並應落實建構兩性平權環境之政策。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070109"},{"k":"law","l":"建築法","r":"第2條第1項","q":"主管建築機關，在中央為內政部；在直轄市為直轄市政府；在縣（市）為縣（市）政府。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070109"}],"nt":"「全國適用」係因其為中央主管機關訂定之法規命令；條文未逐字寫「全國適用」。"}},{"id":"08-05-002","c":"08","t":"08-05","n":"02","q":"下列哪一項為建築法中對於建築物的定義？","o":["貨櫃","船舶","1層平房","露營車"],"a":"C","ty":"gen","e":{"s":"ok","x":"建築法第4條：建築物為定著於土地上或地面下具有頂蓋、樑柱或牆壁，供個人或公眾使用之構造物或雜項工作物。1層平房定著於土地且有頂蓋、牆壁，屬建築物；貨櫃、船舶、露營車並非定著於土地，故選(C)。","b":[{"k":"law","l":"建築法","r":"第4條","q":"本法所稱建築物，為定著於土地上或地面下具有頂蓋、樑柱或牆壁，供個人或公眾使用之構造物或雜項工作物。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070109"}]}},{"id":"08-05-003","c":"08","t":"08-05","n":"03","q":"建築物除經過地方主管建築機關許可外，非經領得下列哪一種執照，不准接水、接電及使用？","o":["建造執照","雜項執照","拆除執照","使用執照"],"a":"D","ty":"gen","e":{"s":"ok","x":"建築法第73條第1項：建築物非經領得使用執照，不准接水、接電及使用（但直轄市、縣市政府得就特定情形另定接用水電規定），故選(D)。","b":[{"k":"law","l":"建築法","r":"第73條第1項","q":"建築物非經領得使用執照，不准接水、接電及使用。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070109"}]}},{"id":"08-05-004","c":"08","t":"08-05","n":"04","q":"下列何人應維護建築物合法使用與其構造及設備安全？","o":["中央主管機關","地方主管機關","公寓大廈管理服務人員","所有權人及使用人"],"a":"D","ty":"gen","e":{"s":"ok","x":"建築法第77條第1項：建築物所有權人、使用人應維護建築物合法使用與其構造及設備安全，故選(D)。","b":[{"k":"law","l":"建築法","r":"第77條第1項","q":"建築物所有權人、使用人應維護建築物合法使用與其構造及設備安全。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070109"}]}},{"id":"08-05-005","c":"08","t":"08-05","n":"05","q":"下列哪一種建築物，應由建築物所有權人、使用人定期委託中央主管建築機關認可之專業機構或人員檢查簽證？","o":["集合住宅","超過3戶以上之集合住宅","供公眾使用之建築物","出租之建築物"],"a":"C","ty":"gen","ns":1,"e":{"s":"ok","x":"建築法第77條第3項：供公眾使用之建築物，應由建築物所有權人、使用人定期委託中央主管建築機關認可之專業機構或人員檢查簽證，並向當地主管建築機關申報，故選(C)。","b":[{"k":"law","l":"建築法","r":"第77條第3項","q":"供公眾使用之建築物，應由建築物所有權人、使用人定期委託中央主管建築機關認可之專業機構或人員檢查簽證，","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070109"}]}},{"id":"08-05-006","c":"08","t":"08-05","n":"06","q":"6層以上集合住宅之地面1層，若需室內裝修應符合下列何種規定？","o":["6層集合住宅之地面1層不受法令限制","公共眾使用建築物之室內裝修應申請審查許可","室內裝修施工可暫時關閉原有系統式消防安全設備，免訂定消防防護計畫","需與房客磋商"],"a":"B","ty":"gen","e":{"s":"ok","x":"簡報（建3-3）頁52：六層以上之集合住宅(公寓)屬供公眾使用建築物，不因位於地面一層而免除室內裝修規範；頁50：建築法第77條之2，供公眾使用建築物之室內裝修應申請審查許可，故選(B)。","b":[{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－建物與室內裝修管理實務（建3-1～建3-3）","r":"頁碼52（PDF第53頁）","q":"六層以上之集合住宅(公寓)。"},{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－建物與室內裝修管理實務（建3-1～建3-3）","r":"頁碼52（PDF第53頁）","q":"所以都是屬於供公眾使用建築物的範圍"},{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－建物與室內裝修管理實務（建3-1～建3-3）","r":"頁碼50（PDF第51頁）","q":"供公眾使用建築物之室內裝修應申請審查許可"}]}},{"id":"08-05-007","c":"08","t":"08-05","n":"07","q":"6層以上集合住宅之地面1層，若進行室內裝修，應符合下列哪一種規定？","o":["裝修材料應合於建築技術規則之規定","需留意美感","防火門可自行拆除","已有消防警報設備，原有之灑水設備可自行拆除"],"a":"A","ty":"gen","e":{"s":"ok","x":"簡報（建3-3）頁50：建築法第77條之2第1項第2款，建築物室內裝修之裝修材料應合於建築技術規則之規定；同項第3款並規定不得妨害或破壞防火避難設施、消防設備，故(C)(D)錯誤，故選(A)。","b":[{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－建物與室內裝修管理實務（建3-1～建3-3）","r":"頁碼50（PDF第51頁）","q":"裝修材料應合於建築技術規則之規定。"},{"k":"law","l":"建築法","r":"第77條之2第1項第2款","q":"裝修材料應合於建築技術規則之規定。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070109"}]}},{"id":"08-05-008","c":"08","t":"08-05","n":"08","q":"十六層之集合住宅進行室內裝修，應符合下列何者規定？","o":["不得破壞保護民眾隱私權設施","不得使用工業風裝修","裝修應經過鄰居同意","浴缸改變為乾溼分離應經直下層住戶同意"],"a":"A","ty":"gen","e":{"s":"ok","x":"簡報（建3-3）頁50：建築法第77條之2第1項第4款，建築物室內裝修不得妨害或破壞保護民眾隱私權設施；十六層集合住宅屬供公眾使用建築物（頁52），故選(A)。","b":[{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－建物與室內裝修管理實務（建3-1～建3-3）","r":"頁碼50（PDF第51頁）","q":"不得妨害或破壞保護民眾隱私權設施。"},{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－建物與室內裝修管理實務（建3-1～建3-3）","r":"頁碼52（PDF第53頁）","q":"六層以上之集合住宅(公寓)。"}]}},{"id":"08-05-009","c":"08","t":"08-05","n":"09","q":"下列何種為建築法所定義之主要構造？","o":["外牆","承重牆壁","非承重牆壁","天花板"],"a":"B","ty":"gen","e":{"s":"ok","x":"建築法第8條：建築物之主要構造，為基礎、主要樑柱、承重牆壁、樓地板及屋頂之構造，故選(B)。","b":[{"k":"law","l":"建築法","r":"第8條","q":"本法所稱建築物之主要構造，為基礎、主要樑柱、承重牆壁、樓地板及屋頂之構造。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070109"}]}},{"id":"08-05-010","c":"08","t":"08-05","n":"10","q":"公寓大廈住戶進行室內裝修，除應遵守現行法令外，亦應遵守下列何種規定？","o":["房東的規定","代管業者的規定","公寓大廈規約的規定","公寓大廈管理服務人員的規定"],"a":"C","ty":"gen","e":{"s":"ok","x":"簡報（建3-3）頁61：內政部公寓大廈規約範本第二十二條之一訂有「住戶室內裝修遵守之事項」，頁62並說明各公寓大廈多另訂裝修管理規定，故住戶室內裝修除法令外亦應遵守規約，故選(C)。","b":[{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－建物與室內裝修管理實務（建3-1～建3-3）","r":"頁碼61（PDF第62頁）","q":"住戶室內裝修遵守之事項"},{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－建物與室內裝修管理實務（建3-1～建3-3）","r":"頁碼62（PDF第63頁）","q":"唯絕大多數的公寓大廈為了加強管理，可能會有下列若干規定。"}]}},{"id":"08-05-011","c":"08","t":"08-05","n":"11","q":"未依建築法第77條第1項規定維護建築物合法使用與其構造及設備安全者，下列何者並非地方主管建築機關可對所有權人之處分？","o":["罰鍰","限期改善","補辦手續","解除租賃契約"],"a":"D","ty":"gen","e":{"s":"ok","x":"建築法第91條第1項第2款：未依第77條第1項規定維護建築物合法使用與其構造及設備安全者，處所有權人、使用人罰鍰，並限期改善或補辦手續；解除租賃契約非主管建築機關之處分，故選(D)。","b":[{"k":"law","l":"建築法","r":"第91條第1項","m":"有該條各款情形者，處建築物所有權人、使用人新臺幣6萬元以上30萬元以下罰鍰，並限期改善或補辦手續，屆期仍未改善得連續處罰並限期停止使用；第2款即未依第77條第1項規定維護建築物合法使用與其構造及設備安全者。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070109"}]}},{"id":"08-05-012","c":"08","t":"08-05","n":"12","q":"建築法適用地區內，依法應申請當地主管建築機關之審查許可並發給執照方能建築，而擅自建築之建築物稱為？","o":["違法使用","使用違規","越界建築","違章建築"],"a":"D","ty":"gen","e":{"s":"ok","x":"違章建築處理辦法第2條：違章建築為建築法適用地區內，依法應申請當地主管建築機關之審查許可並發給執照方能建築，而擅自建築之建築物，故選(D)。","b":[{"k":"law","l":"違章建築處理辦法","r":"第2條","q":"本辦法所稱之違章建築，為建築法適用地區內，依法應申請當地主管建築機關之審查許可並發給執照方能建築，而擅自建築之建築物。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?PCode=D0070124"}]}},{"id":"08-05-013","c":"08","t":"08-05","n":"13","q":"依建築法規定，強制拆除之建築物均不予補償，其拆除費用由下列何者負擔？","o":["地方主管建築機關","中央主管建築機關","建築物所有人","管理委員會"],"a":"C","ty":"gen","e":{"s":"ok","x":"建築法第96條之1第1項：依本法規定強制拆除之建築物均不予補償，其拆除費用由建築物所有人負擔，故選(C)。","b":[{"k":"law","l":"建築法","r":"第96條之1第1項","q":"依本法規定強制拆除之建築物均不予補償，其拆除費用由建築物所有人負擔。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070109"}]}},{"id":"08-05-014","c":"08","t":"08-05","n":"14","q":"下列何種場所得原則上免設火警探測器？","o":["居室","小孩臥室","廁所","倉庫"],"a":"C","ty":"gen","e":{"s":"ok","x":"各類場所消防安全設備設置標準第116條第3款：洗手間、廁所或浴室得免設探測器，故選(C)。","b":[{"k":"law","l":"各類場所消防安全設備設置標準","r":"第116條第3款","q":"下列處所得免設探測器：……三、洗手間、廁所或浴室。","u":"https://lawplayer.com/act/6437d0bee800e5f0b9302304/13"}]}},{"id":"08-05-015","c":"08","t":"08-05","n":"15","q":"滅火器固定放置於取用方便之明顯處所，並設有下列哪一種顏色標明滅火器字樣之標識？","o":["紅底白字","白底綠字","綠底白字","白底黑字"],"a":"A","ty":"gen","e":{"s":"ok","x":"設置標準第31條第4款：滅火器應固定放置於取用方便之明顯處所，並設有以紅底白字標明滅火器字樣之標識，故選(A)。","b":[{"k":"law","l":"各類場所消防安全設備設置標準","r":"第31條第4款","q":"固定放置於取用方便之明顯處所，並設有以紅底白字標明滅火器字樣之標識，其每字應在二十平方公分以上。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0120029"}],"nt":"同款但書：與室內消防栓箱等併設於箱體內並於箱面標明者，標識顏色不在此限。"}},{"id":"08-05-016","c":"08","t":"08-05","n":"16","q":"消防室內之消防栓箱面顏色應為下列哪一種顏色？","o":["紅色","紅底白字","白底紅字","法無明文規定"],"a":"D","ty":"gen","e":{"s":"ok","x":"設置標準第35條就室內消防栓箱僅規定箱身材質、箱面表面積在0.7平方公尺以上及「消防栓」字樣每字20平方公分以上，未規定箱面顏色（紅色規定僅見於第37條箱上方之啟動表示燈），故選(D)。","b":[{"k":"law","l":"各類場所消防安全設備設置標準","r":"第35條","q":"箱面有明顯而不易脫落之消防栓字樣，每字在二十平方公分以上。","m":"室內消防栓箱：箱身為厚度1.6毫米以上鋼板或同等不燃材料；箱面表面積0.7平方公尺以上；箱面標明消防栓字樣。條文未規定箱面顏色。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0120029"},{"k":"law","l":"各類場所消防安全設備設置標準","r":"第37條第2項第3款","q":"室內消防栓箱上方有紅色啟動表示燈。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0120029"}],"nt":"WebFetch 讀取第34、35條確認未規定箱面顏色。"}},{"id":"08-05-017","c":"08","t":"08-05","n":"17","q":"室內消防栓設備之緊急電源，應使用發電機設備或蓄電池設備，其供電容量應供其有效動作多久時間以上？","o":["10分鐘","30分鐘","60分鐘","90分鐘"],"a":"B","ty":"num","e":{"s":"ok","x":"設置標準第38條第1項：室內消防栓設備之緊急電源，應使用發電機設備或蓄電池設備，其供電容量應供其有效動作三十分鐘以上，故選(B)。","b":[{"k":"law","l":"各類場所消防安全設備設置標準","r":"第38條第1項","q":"室內消防栓設備之緊急電源，應使用發電機設備或蓄電池設備，其供電容量應供其有效動作三十分鐘以上。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0120029"}]}},{"id":"08-05-018","c":"08","t":"08-05","n":"18","q":"緊急電源插座在保護箱上方，應設置哪一種顏色之表示燈？","o":["白色","綠色","黃色","紅色"],"a":"D","ty":"gen","e":{"s":"ok","x":"設置標準第191條第5款：緊急電源插座在保護箱上方設紅色表示燈，故選(D)。","b":[{"k":"law","l":"各類場所消防安全設備設置標準","r":"第191條第5款","q":"緊急電源插座在保護箱上方設紅色表示燈。","u":"https://lawplayer.com/act/6437d0bee800e5f0b9302304/25"}]}},{"id":"08-05-019","c":"08","t":"08-05","n":"19","q":"下列何種設備為防災中心法定應設置之設備？","o":["空調","上網","休息","緊急廣播"],"a":"D","ty":"gen","e":{"s":"ok","x":"建築技術規則建築設計施工編第259條第1項第4款：高層建築物之連絡通信及廣播設備等防災設備，其顯示裝置及控制應設於防災中心，故選(D)。","b":[{"k":"law","l":"建築技術規則建築設計施工編","r":"第259條第1項第4款","q":"高層建築物左列各種防災設備，其顯示裝置及控制應設於防災中心：","m":"所列設備包括電氣電力設備、消防安全設備、排煙及通風設備、昇降及緊急昇降設備、連絡通信及廣播設備、瓦斯緊急遮斷設備等；第2項並列逃生引導廣播功能。","u":"https://lawplayer.com/act/6437d09ce800e5f0b9301eae/60"}],"nt":"條文用語為「連絡通信及廣播設備」。"}},{"id":"08-05-020","c":"08","t":"08-05","n":"20","q":"昇降機出入口處之樓地板面，應與機廂地板面保持平整，其與機廂地板面邊緣之間隙，不得大於幾公分？","o":["1公分","2公分","3公分","4公分"],"a":"D","ty":"neg","e":{"s":"ok","x":"建築技術規則建築設備編第110條第5款：昇降機出入口處之樓地板面，應與機廂地板面保持平整，其與機廂地板面邊緣之間隙，不得大於四公分，故選(D)。","b":[{"k":"law","l":"建築技術規則建築設備編","r":"第110條第5款","q":"昇降機出入口處之樓地板面，應與機廂地板面保持平整，其與機廂地板面邊緣之間隙，不得大於四公分。","u":"https://lawplayer.com/act/6437d09ce800e5f0b9301eb2/21"}]}},{"id":"08-05-021","c":"08","t":"08-05","n":"21","q":"招牌廣告燈設置於屋外者，其電源回路之配線應採用哪一種材質？","o":["膠皮絕緣線","花線","電纜","IV線"],"a":"C","ty":"gen","e":{"s":"ok","x":"建築技術規則建築設備編第14條第2款：招牌廣告燈及樹立廣告燈設置於屋外者，其電源回路之配線應採用電纜，故選(C)。","b":[{"k":"law","l":"建築技術規則建築設備編","r":"第14條第2款","q":"設置於屋外者，其電源回路之配線應採用電纜。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070117"}]}},{"id":"09-01-001","c":"09","t":"09-01","n":"01","q":"供公眾使用的建築物，其室內裝修應依下列何種法規辦理？","o":["建築法","建築物室內裝修管理辦法","建築技術規則建築設計施工編","營造業法"],"a":"B","ty":"gen","e":{"s":"ok","x":"建築物室內裝修管理辦法第2條：供公眾使用建築物及經內政部認定有必要之非供公眾使用建築物，其室內裝修應依本辦法之規定辦理（簡報建3-3頁51同）；該辦法係依建築法第77條之2第4項訂定，故選(B)。","b":[{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－建物與室內裝修管理實務（建3-1～建3-3）","r":"頁碼51（PDF第52頁）","q":"供公眾使用建築物及經內政部認定有必要之非供公眾使用建築物，其室內裝修應依本辦法之規定辦理。"},{"k":"law","l":"建築物室內裝修管理辦法","r":"第2條","q":"供公眾使用建築物及經內政部認定有必要之非供公眾使用建築物，其室內裝修應依本辦法之規定辦理。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?PCode=D0070148"},{"k":"law","l":"建築物室內裝修管理辦法","r":"第1條","q":"本辦法依建築法（以下簡稱本法）第七十七條之二第四項規定訂定之。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?PCode=D0070148"}]}},{"id":"09-01-002","c":"09","t":"09-01","n":"02","q":"依據建築物室內裝修管理辦法規定，所稱室內裝修行為，下列何者正確？","o":["壁紙及地氈","壁布及窗簾","活動隔屏及固定櫥櫃","內部牆面及固著於建物之天花板"],"a":"D","ty":"gen","e":{"s":"ok","x":"辦法第3條：室內裝修指除壁紙、壁布、窗簾、家具、活動隔屏、地氈等之黏貼及擺設外，固著於建築物構造體之天花板裝修、內部牆面裝修等行為（簡報建3-3頁57同）；(A)(B)(C)所列多屬排除項目，故選(D)。","b":[{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－建物與室內裝修管理實務（建3-1～建3-3）","r":"頁碼57（PDF第58頁）","q":"所謂法定的室內裝修範圍指除壁紙、壁布、窗簾、家具、活動隔屏、地氈等之黏貼及擺設外之下列行為"},{"k":"law","l":"建築物室內裝修管理辦法","r":"第3條第1款、第2款","q":"本辦法所稱室內裝修，指除壁紙、壁布、窗簾、家具、活動隔屏、地氈等之黏貼及擺設外之下列行為：一、固著於建築物構造體之天花板裝修。二、內部牆面裝修。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?PCode=D0070148"}]}},{"id":"09-01-003","c":"09","t":"09-01","n":"03","q":"依據建築物室內裝修管理辦法規定，所稱室內裝修行為，下列何者正確？","o":["活動隔屏裝修","高度超過地板面以上1.2公尺固定之隔屏裝修","家具牆變更","壁紙壁布裝修"],"a":"B","ty":"gen","ns":1,"e":{"s":"ok","x":"辦法第3條第3款：高度超過地板面以上一點二公尺固定之隔屏或兼作櫥櫃使用之隔屏裝修屬室內裝修（簡報建3-3頁57同）；活動隔屏、壁紙壁布則明文排除，故選(B)。","b":[{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－建物與室內裝修管理實務（建3-1～建3-3）","r":"頁碼57（PDF第58頁）","q":"高度超過地板面以上一點二公尺固定之隔屏或兼作櫥櫃使用之隔屏裝修"},{"k":"law","l":"建築物室內裝修管理辦法","r":"第3條第3款","q":"三、高度超過地板面以上一點二公尺固定之隔屏或兼作櫥櫃使用之隔屏裝修。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?PCode=D0070148"}]}},{"id":"09-01-004","c":"09","t":"09-01","n":"04","q":"依據建築物室內裝修管理辦法規定，室內裝修從業者之業務範圍，下列何者正確？","o":["取得建築師資格得從事室內裝修設計","依法登記開業之建築師得從事室內裝修設計","依法登記開業之設計師得從事室內裝修施工","營造業得從事室內裝修設計"],"a":"B","ty":"gen","e":{"s":"ok","x":"辦法第5條：依法登記開業之建築師得從事室內裝修設計業務；營造業得從事施工業務；室內裝修業得從事設計或施工。(A)僅取得資格未開業不足，(C)(D)非法定業務範圍，故選(B)。","b":[{"k":"law","l":"建築物室內裝修管理辦法","r":"第5條第1款、第2款","q":"一、依法登記開業之建築師得從事室內裝修設計業務。二、依法登記開業之營造業得從事室內裝修施工業務。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?PCode=D0070148"}]}},{"id":"09-01-005","c":"09","t":"09-01","n":"05","q":"依據建築物室內裝修管理辦法規定，室內裝修從業者之業務範圍，下列何者正確？","o":["室內裝修業得從事室內裝修設計或施工","建築師得從事室內裝修設計","設計師得從事室內裝修施工","營造業得從事室內裝修施工設計"],"a":"A","ty":"gen","e":{"s":"ok","x":"辦法第5條第3款：室內裝修業得從事室內裝修設計或施工之業務；建築師須「依法登記開業」始得從事設計，營造業僅得從事施工，故選(A)。","b":[{"k":"law","l":"建築物室內裝修管理辦法","r":"第5條第3款","q":"三、室內裝修業得從事室內裝修設計或施工之業務。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?PCode=D0070148"},{"k":"law","l":"建築物室內裝修管理辦法","r":"第4條","q":"本辦法所稱室內裝修從業者，指開業建築師、營造業及室內裝修業。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?PCode=D0070148"}]}},{"id":"09-01-006","c":"09","t":"09-01","n":"06","q":"室內裝修業之專業技術人員離職或死亡時，依規定業者應在多久內報請內政部備查？","o":["1個月","2個月","3個月","4個月"],"a":"A","ty":"num","e":{"s":"ok","x":"辦法第12條第1項：專業技術人員離職或死亡時，室內裝修業應於一個月內報請內政部備查，故選(A)。","b":[{"k":"law","l":"建築物室內裝修管理辦法","r":"第12條第1項","q":"專業技術人員離職或死亡時，室內裝修業應於一個月內報請內政部備查。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?PCode=D0070148"}]}},{"id":"09-01-007","c":"09","t":"09-01","n":"07","q":"依據建築物室內裝修管理辦法所稱專業技術人員，是指向內政部辦理登記，從事室內裝修何種技術的人員？","o":["設計技術","營建技術","施工技術","設計或施工技術"],"a":"D","ty":"gen","e":{"s":"ok","x":"辦法第15條：專業技術人員指向內政部辦理登記，從事室內裝修設計或施工之人員，故選(D)。","b":[{"k":"law","l":"建築物室內裝修管理辦法","r":"第15條","q":"本辦法所稱專業技術人員，指向內政部辦理登記，從事室內裝修設計或施工之人員；依其執業範圍可分為專業設計技術人員及專業施工技術人員。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?PCode=D0070148"}]}},{"id":"09-01-008","c":"09","t":"09-01","n":"08","q":"依據建築物室內裝修管理辦法所稱專業技術人員，依其執業範圍可分為哪兩種專業？","o":["專業設計及施工","專業規劃及設計","專業設計及營造","專業設計及裝潢"],"a":"A","ty":"gen","e":{"s":"ok","x":"辦法第15條：專業技術人員依其執業範圍可分為專業設計技術人員及專業施工技術人員，故選(A)。","b":[{"k":"law","l":"建築物室內裝修管理辦法","r":"第15條","q":"依其執業範圍可分為專業設計技術人員及專業施工技術人員。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?PCode=D0070148"}]}},{"id":"09-01-009","c":"09","t":"09-01","n":"09","q":"公寓大廈社區內供公眾使用之建築物，起造人需要從事建築物室內裝修之施工，有關其限制之敘述，下列何者正確？","o":["得視住戶需求而施工","應申請審核圖說，始得施工","應取得許可文件，始得施工","應申請審核圖說及取得許可文件，始得施工"],"a":"D","ty":"gen","e":{"s":"ok","x":"辦法第22條第1項：供公眾使用建築物之室內裝修，起造人、所有權人或使用人應申請審核圖說，審核合格並領得許可文件後，始得施工（簡報建3-3頁53同），故選(D)。","b":[{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－建物與室內裝修管理實務（建3-1～建3-3）","r":"頁碼53（PDF第54頁）","q":"應向直轄市、縣（市）主管建築機關或審查機構申請審核圖說，審核合格並領得直轄市、縣（市）主管建築機關發給之許可文件後，始得施工。"},{"k":"law","l":"建築物室內裝修管理辦法","r":"第22條第1項","m":"供公眾使用建築物或經內政部認定之非供公眾使用建築物之室內裝修，起造人、所有權人或使用人應申請審核圖說，審核合格並領得主管建築機關發給之許可文件後，始得施工。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?PCode=D0070148"}]}},{"id":"09-01-010","c":"09","t":"09-01","n":"10","q":"公寓大廈社區內非供公眾使用之建築物，所有權人需要從事建築物室內裝修之施工，有何限制？","o":["應申請審核圖說及取得許可文件，始得施工","應申請審核圖說，始得施工。","應取得許可文件，始得施工","得視安全需求，始得施工"],"a":"A","ty":"gen","e":{"s":"ok","x":"辦法第22條第1項：經內政部認定之非供公眾使用建築物之室內裝修，所有權人亦應申請審核圖說，審核合格並領得許可文件後始得施工；簡報建3-3頁53並說明集合住宅增設廁所浴室或增設2間以上居室造成分間牆變更者屬之，故選(A)。","b":[{"k":"law","l":"建築物室內裝修管理辦法","r":"第22條第1項","m":"供公眾使用建築物或經內政部認定之非供公眾使用建築物之室內裝修，起造人、所有權人或使用人應申請審核圖說，審核合格並領得許可文件後，始得施工。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?PCode=D0070148"},{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－建物與室內裝修管理實務（建3-1～建3-3）","r":"頁碼53（PDF第54頁）","q":"仍應依法申請建築物室內裝修審查許可"}],"nt":"非供公眾使用建築物僅「經內政部認定有必要」者（簡報頁53所列三種樣態）才須申請審查許可；題目未載此前提，惟選項中僅(A)與第22條程序相符。"}},{"id":"09-01-011","c":"09","t":"09-01","n":"11","q":"公寓大廈社區內供公眾使用之建築物，起造人申請建築物室內裝修審核時，應檢附下列何者圖說文件？","o":["建築物權利證明文件、使用執造及室內裝修平面圖","申請書、使用執造及室內裝修平面圖、室內裝修圖說","申請書、建築物權利證明文件、室內裝修圖說","申請書、建築物權利證明文件、使用執造及室內裝修平面圖、室內裝修圖說"],"a":"D","ty":"gen","e":{"s":"ok","x":"辦法第23條第1項：申請室內裝修審核時，應檢附申請書、建築物權利證明文件、前次核准使用執照平面圖或室內裝修平面圖、室內裝修圖說，僅(D)完整，故選(D)。","b":[{"k":"law","l":"建築物室內裝修管理辦法","r":"第23條第1項","m":"申請室內裝修審核應檢附：一、申請書；二、建築物權利證明文件；三、前次核准使用執照平面圖、室內裝修平面圖或申請建築執照之平面圖（查無者得以建築師簽證之現況圖替代）；四、室內裝修圖說。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?PCode=D0070148"}]}},{"id":"09-01-012","c":"09","t":"09-01","n":"12","q":"依據建築物室內裝修管理辦法規定，室內裝修詳細圖，各部分之尺寸構造及材料的比例尺為多少？","o":["不得小於1/100","不得小於10/100","不得小於1/30","不得小於1/300"],"a":"C","ty":"num","e":{"s":"ok","x":"辦法第24條第5款：裝修詳細圖應載明各部分之尺寸構造及材料，其比例尺不得小於三十分之一，故選(C)。","b":[{"k":"law","l":"建築物室內裝修管理辦法","r":"第24條第5款","q":"五、裝修詳細圖：各部分之尺寸構造及材料，其比例尺不得小於三十分之一。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?PCode=D0070148"}]}},{"id":"09-01-013","c":"09","t":"09-01","n":"13","q":"公寓大廈社區內供公眾使用之通道及樓梯，其室內裝修設計遇消防安全設備，下列何者處置最正確？","o":["得適當修飾遮掩","不破壞就好","不得妨害及破壞","不得妨害"],"a":"C","ty":"gen","e":{"s":"ok","x":"辦法第28條：室內裝修不得妨害或破壞消防安全設備；建築法第77條之2第1項第3款亦規定不得妨害或破壞防火避難設施、消防設備（簡報建3-3頁50），(A)(B)違反規定、(D)不完整，故選(C)。","b":[{"k":"law","l":"建築物室內裝修管理辦法","r":"第28條","m":"室內裝修不得妨害或破壞消防安全設備；圖說涉及消防安全設備變更者，應依消防法規規定辦理，並於施工前取得消防主管機關審核合格文件。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?PCode=D0070148"},{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－建物與室內裝修管理實務（建3-1～建3-3）","r":"頁碼50（PDF第51頁）","q":"不得妨害或破壞防火避難設施、消防設備、防火區劃及主要構造。"}]}},{"id":"09-01-014","c":"09","t":"09-01","n":"14","q":"公寓大廈社區內供公眾使用之建築物，其室內裝修申請審核之圖說涉及消防安全設備變更者，應依下列何種法規進行辦理？","o":["建築法","消防法","建築技術規則","建築物室內裝修管理辦法"],"a":"B","ty":"gen","e":{"s":"ok","x":"辦法第28條：室內裝修申請審核之圖說涉及消防安全設備變更者，應依消防法規規定辦理，並應於施工前取得當地消防主管機關審核合格之文件，故選(B)。","b":[{"k":"law","l":"建築物室內裝修管理辦法","r":"第28條","q":"室內裝修不得妨害或破壞消防安全設備，其申請審核之圖說涉及消防安全設備變更者，應依消防法規規定辦理，","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?PCode=D0070148"}],"nt":"條文用語為「消防法規」。"}},{"id":"09-01-015","c":"09","t":"09-01","n":"15","q":"下列有關室內裝修公司若將登記證供他人從事室內裝修業務，經當地主管建築機關查明屬實後，可能受到之處罰之敘述，何者正確？","o":["報請經濟部廢止室內裝修業登記許可並註銷登記證","報請內政部停止室內裝修業登記許可並撤銷登記證","報請科技部停止室內裝修業登記許可並註銷登記證","報請內政部廢止室內裝修業登記許可並註銷登記證"],"a":"D","ty":"gen","e":{"s":"ok","x":"辦法第36條第1款：室內裝修業將登記證供他人從事室內裝修業務，經當地主管建築機關查明屬實後，報請內政部廢止室內裝修業登記許可並註銷登記證，故選(D)。","b":[{"k":"law","l":"建築物室內裝修管理辦法","r":"第36條第1款","q":"室內裝修業有下列情事之一者，經當地主管建築機關查明屬實後，報請內政部廢止室內裝修業登記許可並註銷登記證：一、登記證供他人從事室內裝修業務。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?PCode=D0070148"}]}},{"id":"09-01-016","c":"09","t":"09-01","n":"16","q":"室內裝修公司受停業處分累計滿三年或受停止換發登記證處分累計3次，經當地主管建築機關查明屬實後，可能受到之處罰，下列何者正確？","o":["報請內政部廢止室內裝修業登記許可並註銷登記證。","報請內政部停止室內裝潢業登記許可並撤銷登記證","報請內政部停止室內裝修業營利許可","報請內政部撤銷室內裝修營利事業登記證"],"a":"A","ty":"gen","e":{"s":"ok","x":"辦法第36條第2款、第3款：室內裝修業受停業處分累計滿三年或受停止換發登記證處分累計三次，經查明屬實後，報請內政部廢止室內裝修業登記許可並註銷登記證，故選(A)。","b":[{"k":"law","l":"建築物室內裝修管理辦法","r":"第36條第2款、第3款","q":"二、受停業處分累計滿三年。三、受停止換發登記證處分累計三次。","m":"上述情事經當地主管建築機關查明屬實後，報請內政部廢止室內裝修業登記許可並註銷登記證。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?PCode=D0070148"}]}},{"id":"09-01-017","c":"09","t":"09-01","n":"17","q":"公寓大廈社區在10層以下樓層及地下室各層，室內裝修之樓地板面積在300平方公尺以下者，其防火牆在防火時效之區劃分隔，應具多少小時以上？","o":["1小時","1.5小時","2小時","2.5小時"],"a":"A","ty":"num","e":{"s":"ok","x":"辦法第33條第1項第1款：十層以下樓層及地下室各層，室內裝修樓地板面積在三百平方公尺以下，且在裝修範圍內以一小時以上防火時效之防火牆、防火門窗區劃分隔者，得適用簡易室內裝修程序（簡報建3-3頁55），故選(A)。","b":[{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－建物與室內裝修管理實務（建3-1～建3-3）","r":"頁碼55（PDF第56頁）","q":"在裝修範圍內以一小時以上防火時效之防火牆、防火門窗區劃分隔"},{"k":"law","l":"建築物室內裝修管理辦法","r":"第33條第1項第1款","q":"一、十層以下樓層及地下室各層，室內裝修之樓地板面積在三百平方公尺以下者。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?PCode=D0070148"}]}},{"id":"09-01-018","c":"09","t":"09-01","n":"18","q":"公寓大廈社區在11層以上樓層，室內裝修之樓地板面積在100平方公尺以下者，其防火牆在防火時效之區劃分隔，應具多少小時以上？","o":["1小時","1.5小時","2小時","2.5小時"],"a":"A","ty":"num","e":{"s":"ok","x":"辦法第33條第1項第2款：十一層以上樓層，室內裝修樓地板面積在一百平方公尺以下，且在裝修範圍內以一小時以上防火時效之防火牆、防火門窗區劃分隔者，得適用簡易室內裝修程序（簡報建3-3頁55），故選(A)。","b":[{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－建物與室內裝修管理實務（建3-1～建3-3）","r":"頁碼55（PDF第56頁）","q":"在裝修範圍內以一小時以上防火時效之防火牆、防火門窗區劃分隔"},{"k":"law","l":"建築物室內裝修管理辦法","r":"第33條第1項第2款","q":"二、十一層以上樓層，室內裝修之樓地板面積在一百平方公尺以下者。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?PCode=D0070148"}]}},{"id":"09-01-019","c":"09","t":"09-01","n":"19","q":"依據建築物室內裝修管理辦法規定，公寓大廈住宅社之防火牆在防火時效之區劃分隔，應具多少小時以上？","o":["0.5小時","1小時","1.5小時","2小時"],"a":"B","ty":"num","e":{"s":"ok","x":"辦法第33條第1項：申請範圍用途為住宅者，在裝修範圍內以一小時以上防火時效之防火牆、防火門窗區劃分隔，且未變更防火避難設施等，得適用簡易室內裝修程序（簡報建3-3頁55），故選(B)。","b":[{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－建物與室內裝修管理實務（建3-1～建3-3）","r":"頁碼55（PDF第56頁）","q":"在裝修範圍內以一小時以上防火時效之防火牆、防火門窗區劃分隔"},{"k":"law","l":"建築物室內裝修管理辦法","r":"第33條第1項","q":"申請室內裝修之建築物，其申請範圍用途為住宅或申請樓層之樓地板面積符合下列規定之一，且在裝修範圍內以一小時以上防火時效之防火牆、防火門窗區劃分隔","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?PCode=D0070148"}]}},{"id":"09-01-020","c":"09","t":"09-01","n":"20","q":"依據建築物室內裝修管理辦法規定，室內裝修圖說應由下列何者署名負責？","o":["開業建築師","開業之專業設計技術人員","開業之專業施工技術人員","開業建築師或專業設計技術人員"],"a":"D","ty":"gen","e":{"s":"ok","x":"辦法第25條：室內裝修圖說應由開業建築師或專業設計技術人員署名負責，故選(D)。","b":[{"k":"law","l":"建築物室內裝修管理辦法","r":"第25條","q":"室內裝修圖說應由開業建築師或專業設計技術人員署名負責。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?PCode=D0070148"}],"nt":"同條但書：分間牆位置變更、增加或減少經審查機構認定涉及公共安全時，應經開業建築師簽證負責。"}},{"id":"09-01-021","c":"09","t":"09-01","n":"21","q":"依據建築物室內裝修管理辦法規定，專業技術人員受委託設計之竣工圖說及書件，經抽查結果與相關法令規定不符，經當地主管建築機關查明屬實後，情節最重之處分為下列何者？","o":["警告","小過","1年以上3年以下停止換發登記證處分","3個月以上1年以下停止執行職務處分"],"a":"C","ty":"gen","ns":1,"e":{"s":"ok","x":"辦法第38條第1款：專業技術人員受委託設計之圖樣、說明書、竣工查驗檢查表等經抽查與相關法令規定不符者，報請內政部視情節輕重予以警告、六個月以上一年以下停止執行職務或一年以上三年以下停止換發登記證處分，最重者為(C)，故選(C)。","b":[{"k":"law","l":"建築物室內裝修管理辦法","r":"第38條第1款","q":"一、受委託設計之圖樣、說明書、竣工查驗合格簽章之檢查表或其他書件經抽查結果與相關法令規定不符。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?PCode=D0070148"},{"k":"law","l":"建築物室內裝修管理辦法","r":"第38條本文","q":"報請內政部視其情節輕重，予以警告、六個月以上一年以下停止執行職務處分或一年以上三年以下停止換發登記證處分","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?PCode=D0070148"}],"nt":"第38條本文引自 lawnotes（第10批 WebFetch 逐字取得）；選項(D)「3個月以上」與現行「六個月以上」不同，且非最重處分。"}},{"id":"09-01-022","c":"09","t":"09-01","n":"22","q":"依據建築物室內裝修管理辦法規定，專業技術人員在10年內受停止執行職務處分累計滿2年，經當地主管建築機關查明屬實後，可報請內政部予以何種處分？","o":["廢止登記許可證","註銷登記證","停止換發登記許可證","廢止登記許可並註銷登記證"],"a":"D","ty":"gen","e":{"s":"ok","x":"建築物室內裝修管理辦法第39條第2款：專業技術人員「十年內受停止執行職務處分累計滿二年」者，當地主管建築機關應查明屬實後，報請內政部「廢止登記許可並註銷登記證」（第38條之警告、停止執行職務、停止換發登記證係其他違規情形之處分），故選(D)。","b":[{"k":"law","l":"建築物室內裝修管理辦法","r":"第39條","q":"專業技術人員有下列情事之一者，當地主管建築機關應查明屬實後，報請內政部廢止登記許可並註銷登記證：","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?PCode=D0070148"},{"k":"law","l":"建築物室內裝修管理辦法","r":"第39條第2款","q":"十年內受停止執行職務處分累計滿二年。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?PCode=D0070148"},{"k":"law","l":"建築物室內裝修管理辦法","r":"第38條","q":"專業技術人員有下列情事之一者，當地主管建築機關應查明屬實後，報請內政部視其情節輕重，予以警告、六個月以上一年以下停止執行職務處分或一年以上三年以下停止換發登記證處分：","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?PCode=D0070148"}],"nt":"簡報（屋況點交）建3-3頁50–60介紹室內裝修管理辦法，但未涉及專業技術人員之懲處條文，故依現行辦法條文作答。"}},{"id":"09-01-023","c":"09","t":"09-01","n":"23","q":"依據建築物室內裝修管理辦法規定，專業技術人員登記證供所受聘之室內裝修業以外使用，經當地主管建築機關查明屬實後，可報請內政部予以何種處分？","o":["廢止登記許可並註銷登記證","廢止登記許可證","註銷登記證","停止換發登記許可證"],"a":"A","ty":"gen","e":{"s":"ok","x":"建築物室內裝修管理辦法第39條第1款：「專業技術人員登記證供所受聘室內裝修業以外使用」者，當地主管建築機關應查明屬實後，報請內政部「廢止登記許可並註銷登記證」，故選(A)。","b":[{"k":"law","l":"建築物室內裝修管理辦法","r":"第39條","q":"專業技術人員有下列情事之一者，當地主管建築機關應查明屬實後，報請內政部廢止登記許可並註銷登記證：","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?PCode=D0070148"},{"k":"law","l":"建築物室內裝修管理辦法","r":"第39條第1款","q":"專業技術人員登記證供所受聘室內裝修業以外使用。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?PCode=D0070148"}],"nt":"簡報（屋況點交）建3-3頁50–60介紹室內裝修管理辦法，但未涉及專業技術人員之懲處條文，故依現行辦法條文作答。"}},{"id":"09-02-001","c":"09","t":"09-02","n":"01","q":"依據建築技術規則，建築面積占基地面積之比率，稱之為？","o":["容積率","建蔽率","空地比","建築基地比率"],"a":"B","ty":"gen","e":{"s":"ok","x":"建築技術規則建築設計施工編第1條第4款：建蔽率為「建築面積占基地面積之比率」，故選(B)。","b":[{"k":"law","l":"建築技術規則建築設計施工編","r":"第1條第4款","q":"建築面積占基地面積之比率。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070115"}],"nt":"簡報未提及建蔽率定義，依法規條文作答。"}},{"id":"09-02-002","c":"09","t":"09-02","n":"02","q":"依據建築技術規則，建築物各層樓地板或其一部分，在該區劃中心線以內之水平投影面積，稱之為？","o":["建築面積","建築開發面積","樓地板面積","總樓地板面積"],"a":"C","ty":"gen","e":{"s":"ok","x":"建築技術規則建築設計施工編第1條第5款：樓地板面積為「建築物各層樓地板或其一部分，在該區劃中心線以內之水平投影面積」，故選(C)。","b":[{"k":"law","l":"建築技術規則建築設計施工編","r":"第1條第5款","q":"建築物各層樓地板或其一部分，在該區劃中心線以內之水平投影面積。但不包括第三款不計入建築面積之部分。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070115"}]}},{"id":"09-02-003","c":"09","t":"09-02","n":"03","q":"依據建築技術規則規定，建築物各層包括地下層、屋頂突出物及夾層等樓地板面積之總和，稱之為下列何者？","o":["建築面積","建築開發面積","樓地板面積","總樓地板面積"],"a":"D","ty":"gen","e":{"s":"ok","x":"建築技術規則建築設計施工編第1條第7款：總樓地板面積為「建築物各層包括地下層、屋頂突出物及夾層等樓地板面積之總和」，故選(D)。","b":[{"k":"law","l":"建築技術規則建築設計施工編","r":"第1條第7款","q":"建築物各層包括地下層、屋頂突出物及夾層等樓地板面積之總和。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070115"}]}},{"id":"09-02-004","c":"09","t":"09-02","n":"04","q":"依據建築技術規則規定，建築面積：建築物外牆中心線或其代替柱中心線以內之最大水平投影面積，稱之為下列何者？","o":["建築面積","建築開發面積","樓地板面積","總樓地板面積"],"a":"A","ty":"gen","e":{"s":"ok","x":"建築技術規則建築設計施工編第1條第3款：「建築面積：建築物外牆中心線或其代替柱中心線以內之最大水平投影面積。」故選(A)。","b":[{"k":"law","l":"建築技術規則建築設計施工編","r":"第1條第3款","q":"建築面積：建築物外牆中心線或其代替柱中心線以內之最大水平投影面積。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070115"}]}},{"id":"09-02-005","c":"09","t":"09-02","n":"05","q":"依據建築技術規則，關於建築物高度之規定，水箱、水塔設於屋頂突出物上高度合計在多少公尺以內，不計入建築面積？","o":["3公尺","5公尺","6公尺","9公尺"],"a":"C","ty":"num","e":{"s":"ok","x":"建築技術規則建築設計施工編第1條第9款（建築物高度）規定屋頂突出物等依所列規定不計入建築物高度，其第2目：水箱、水塔設於屋頂突出物上高度合計在六公尺以內（設於有昇降機通達屋頂之屋頂突出物者為九公尺以內），故選(C)。","b":[{"k":"law","l":"建築技術規則建築設計施工編","r":"第1條第9款本文","q":"建築物高度：自基地地面計量至建築物最高部分之垂直高度。但屋頂突出物或非平屋頂建築物之屋頂，自其頂點往下垂直計量之高度應依下列規定，且不計入建築物高度：","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070115"},{"k":"law","l":"建築技術規則建築設計施工編","r":"第1條第9款第2目","q":"水箱、水塔設於屋頂突出物上高度合計在六公尺以內或設於有昇降機設備通達屋頂之屋頂突出物高度在九公尺以內或設於屋頂面上高度在二點五公尺以內。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070115"}],"nt":"題目稱「不計入建築面積」，但條文（第1條第9款建築物高度）為「不計入建築物高度」；題目開頭已載明「關於建築物高度之規定」，六公尺之數值與條文相符，結論明確。"}},{"id":"09-02-006","c":"09","t":"09-02","n":"06","q":"依據建築技術規則關於夾層之規定，夾於樓地板與天花板間之樓層，且同一樓層內夾層面積之和，未超過該層樓地板面積1/3或100平方公尺者，則視為下列何者？","o":["另一樓層","夾層","居室","夾層居室"],"a":"B","ty":"gen","e":{"s":"ok","x":"建築技術規則建築設計施工編第1條第18款：夾層為「夾於樓地板與天花板間之樓層」，同一樓層內夾層面積之和超過該層樓地板面積三分之一或一百平方公尺者才視為另一樓層；未超過者仍屬夾層，故選(B)。","b":[{"k":"law","l":"建築技術規則建築設計施工編","r":"第1條第18款","q":"夾層：夾於樓地板與天花板間之樓層；同一樓層內夾層面積之和，超過該層樓地板面積三分之一或一百平方公尺者，視為另一樓層。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070115"}]}},{"id":"09-02-007","c":"09","t":"09-02","n":"07","q":"依據建築技術規則關於夾層之規定，夾於樓地板與天花板間之樓層；同一樓層內夾層面積之和，已超過該層樓地板面積1/3或100平方公尺者，則視為下列何者？","o":["另一樓層","夾層","居室","夾層居室"],"a":"A","ty":"gen","e":{"s":"ok","x":"建築技術規則建築設計施工編第1條第18款：同一樓層內夾層面積之和，超過該層樓地板面積三分之一或一百平方公尺者，「視為另一樓層」，故選(A)。","b":[{"k":"law","l":"建築技術規則建築設計施工編","r":"第1條第18款","q":"夾層：夾於樓地板與天花板間之樓層；同一樓層內夾層面積之和，超過該層樓地板面積三分之一或一百平方公尺者，視為另一樓層。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070115"}]}},{"id":"09-02-008","c":"09","t":"09-02","n":"08","q":"依據建築技術規則規定，下列何者為建築物各樓層的直上方無任何頂遮蓋物之平臺？","o":["平臺","露臺","陽臺","景觀平臺"],"a":"B","ty":"gen","e":{"s":"ok","x":"建築技術規則建築設計施工編第1條第20款（露臺及陽臺）：「直上方無任何頂遮蓋物之平臺稱為露臺」，故選(B)。","b":[{"k":"law","l":"建築技術規則建築設計施工編","r":"第1條第20款","q":"直上方無任何頂遮蓋物之平臺稱為露臺，直上方有遮蓋物者稱為陽臺。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070115"}]}},{"id":"09-02-009","c":"09","t":"09-02","n":"09","q":"依據建築技術規則規定，下列何者為建築物各樓層的直上方有遮蓋物者？","o":["平臺","露臺","陽臺","雨遮"],"a":"C","ty":"gen","e":{"s":"ok","x":"建築技術規則建築設計施工編第1條第20款（露臺及陽臺）：直上方無任何頂遮蓋物之平臺稱為露臺，「直上方有遮蓋物者稱為陽臺」，故選(C)。","b":[{"k":"law","l":"建築技術規則建築設計施工編","r":"第1條第20款","q":"直上方無任何頂遮蓋物之平臺稱為露臺，直上方有遮蓋物者稱為陽臺。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070115"}]}},{"id":"09-02-010","c":"09","t":"09-02","n":"10","q":"依據建築技術規則規定，用於分隔住宅單位與住宅單位或住戶與住戶或不同用途區劃間之牆壁，稱之？","o":["隔間牆","分間牆","分戶牆","承重牆"],"a":"C","ty":"gen","e":{"s":"ok","x":"建築技術規則建築設計施工編第1條第24款：分戶牆為「分隔住宅單位與住宅單位或住戶與住戶或不同用途區劃間之牆壁」（第23款分間牆則為分隔建築物內部空間之牆壁），故選(C)。","b":[{"k":"law","l":"建築技術規則建築設計施工編","r":"第1條第24款","q":"分隔住宅單位與住宅單位或住戶與住戶或不同用途區劃間之牆壁。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070115"},{"k":"law","l":"建築技術規則建築設計施工編","r":"第1條第23款","q":"分間牆：分隔建築物內部空間之牆壁。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070115"}]}},{"id":"09-02-011","c":"09","t":"09-02","n":"11","q":"依據建築技術規則規定，下列何者為用於承受本身重量及本身所受地震、風力外並承載及傳導其他外壓力及載重之牆壁？","o":["承重牆","帷幕牆","分戶牆","耐重牆"],"a":"A","ty":"gen","e":{"s":"ok","x":"建築技術規則建築設計施工編第1條第25款：「承重牆：承受本身重量及本身所受地震、風力外並承載及傳導其他外壓力及載重之牆壁。」故選(A)。","b":[{"k":"law","l":"建築技術規則建築設計施工編","r":"第1條第25款","q":"承重牆：承受本身重量及本身所受地震、風力外並承載及傳導其他外壓力及載重之牆壁。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070115"}]}},{"id":"09-02-012","c":"09","t":"09-02","n":"12","q":"依據建築技術規則規定，一般車位之寬度及長度為多少公尺？","o":["寬3公尺、長6公尺","寬3公尺、長5.5公尺","寬2.5公尺、長6.5公尺","寬2.5公尺、長5.5公尺"],"a":"D","ty":"num","e":{"s":"ok","x":"建築技術規則建築設計施工編第60條第1款：每輛停車位為寬二點五公尺，長五點五公尺（停車位角度在三十度以下者長度為六公尺；大客車另有規定），故選(D)。","b":[{"k":"law","l":"建築技術規則建築設計施工編","r":"第60條第1款","q":"每輛停車位為寬二點五公尺，長五點五公尺。但停車位角度在三十度以下者，停車位長度為六公尺。大客車每輛停車位為寬四公尺，長十二點四公尺。","u":"https://lawplayer.com/act/6437d09ce800e5f0b9301eae/section/2.14"}],"nt":"現行條文僅取得非官方轉載（LawPlayer，115-02-23版）。國土管理署網站另有一份較早修正條文對照表顯示本款曾為「寬二‧五公尺，長六公尺」，現行已改為長五點五公尺（30度以下斜角停車位為六公尺），與題庫答案一致。"}},{"id":"09-02-013","c":"09","t":"09-02","n":"13","q":"依據建築技術規則規定，建築物在幾層以上之樓層及各層之樓地板面積在幾平方公尺以上，應設置自動撒水設備？","o":["6樓，90平方公尺","10樓，100平方公尺","11樓，100平方公尺","14樓，150平方公尺"],"a":"C","ty":"num","e":{"s":"ok","x":"建築技術規則建築設計施工編第114條第2款第2目：自動撒水設備應設置於「建築物在第十一層以上之樓層，各層之樓地板面積在一○○平方公尺以上者」；簡報（建3-1）頁25亦稱十一層以上住宅當樓層超過100平方公尺即設有自動撒水設備，故選(C)。","b":[{"k":"law","l":"建築技術規則建築設計施工編","r":"第114條第2款第2目","q":"建築物在第十一層以上之樓層，各層之樓地板面積在一○○平方公尺以上者。","m":"第114條本文「滅火設備之設置依左列規定：」，第2款「自動撒水設備應設置於左列規定之樓層：」。","u":"https://lawplayer.com/act/6437d09ce800e5f0b9301eae/section/4.7"},{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－建物與室內裝修管理實務（建3-1～建3-3）","r":"頁碼25（PDF第26頁）","q":"十一層以上住宅，只要當樓層超過100平方公尺；"}],"nt":"簡報頁25寫「超過100平方公尺」，條文為「一○○平方公尺以上」，用語略異但結論相同。"}},{"id":"09-02-014","c":"09","t":"09-02","n":"14","q":"一般情況，幾層以上之建築物，應至少設置一座以上之昇降機通達避難層？","o":["5層","6層","11層","12層"],"a":"B","ty":"num","e":{"s":"ok","x":"建築技術規則建築設計施工編第55條第1款：「六層以上之建築物，至少應設置一座以上之昇降機通達避難層」（超過十層樓者另應依第106條設置緊急用昇降機），故選(B)。","b":[{"k":"law","l":"建築技術規則建築設計施工編","r":"第55條第1款","q":"一、六層以上之建築物，至少應設置一座以上之昇降機通達避難層。建築物高度超過十層樓，依本編第一百零六條規定，設置可供緊急用之昇降機。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070115"}]}},{"id":"09-02-015","c":"09","t":"09-02","n":"15","q":"建築物有防空避難設備之設計及構造，天花板高度或地板至樑底之高度不得小於幾公尺？","o":["3.1公尺","3公尺","2.8公尺","2.1公尺"],"a":"D","ty":"neg","e":{"s":"ok","x":"建築技術規則建築設計施工編第144條第1款（防空避難設備之設計及構造準則）：天花板高度或地板至梁底之高度不得小於二點一公尺，故選(D)。","b":[{"k":"law","l":"建築技術規則建築設計施工編","r":"第144條第1款","q":"天花板高度或地板至梁底之高度不得小於二點一公尺。","m":"第144條本文「防空避難設備之設計及構造準則規定如下：」。","u":"https://lawplayer.com/act/6437d09ce800e5f0b9301eae/section/6"},{"k":"web","l":"建築技術規則建築設計施工編第一百四十一條、第一百四十二條、第一百四十四條修正草案總說明及條文對照表（內政部國土管理署）","r":"第144條第1款","m":"115年修正之草案對照表中，第144條第1款修正條文與現行條文相同：天花板高度或地板至樑底之高度不得小於二點一公尺。","u":"https://www.nlma.gov.tw/uploads/files/f6d3e6efe4d5b8300685f6f240ce694f.pdf"}],"nt":"第144條於115-02-23修正（6laws.net 載修正發布第140～142、144條；國土管理署執行計畫稱修正附建面積、構造厚度、通風、防火門窗遮煙、照明及緊急電源等），天花板高度2.1公尺未變動。現行條文用字為「梁底」。"}},{"id":"09-03-001","c":"09","t":"09-03","n":"01","q":"某甲向房東承租公寓大廈社區住宅，基於美化視覺想更新室內牆面壁紙，則某甲應如何正確辦理？","o":["這屬室內設計僅須與房東協議好辦理","這屬室內裝修應向主管機關申請辦理","這會影響社區環境需經管委會同意後辦理","這會影響社區環境需經管理負責人同意後辦理"],"a":"A","ty":"case","e":{"s":"ok","x":"建築物室內裝修管理辦法第3條明定壁紙、壁布等之黏貼不屬室內裝修，無須申請審查，僅須與房東（所有權人）協議，故選(A)。","b":[{"k":"law","l":"建築物室內裝修管理辦法","r":"建築物室內裝修管理辦法第3條","m":"室內裝修包括固著於構造體的天花板、內部牆面、高度超過地板面1.2公尺的固定隔屏或兼作櫥櫃之隔屏、分間牆變更；黏貼壁紙壁布、擺設窗簾家具、活動隔屏或地氈等不算。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?PCode=D0070148"}]}},{"id":"09-03-002","c":"09","t":"09-03","n":"02","q":"承租人向房東承租公寓大廈社區住宅，基於區隔室內活動想製作一座活動隔屏，他應如何正確辦理？","o":["這會影響社區環境需經管理負責人同意後辦理","這屬室內裝修應向主管機關申請辦理","這會影響社區環境需經管委會同意後辦理","這屬室內設計僅須與房東協議好辦理"],"a":"D","ty":"case","e":{"s":"ok","x":"建築物室內裝修管理辦法第3條明定活動隔屏之擺設不屬室內裝修，無須申請審查，僅須與房東協議，故選(D)。","b":[{"k":"law","l":"建築物室內裝修管理辦法","r":"建築物室內裝修管理辦法第3條","m":"室內裝修包括固著於構造體的天花板、內部牆面、高度超過地板面1.2公尺的固定隔屏或兼作櫥櫃之隔屏、分間牆變更；黏貼壁紙壁布、擺設窗簾家具、活動隔屏或地氈等不算。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?PCode=D0070148"}]}},{"id":"09-03-003","c":"09","t":"09-03","n":"03","q":"承租人取得房東同意，在客廳製作一個高度1.4公尺之固定隔屏且兼作櫥櫃使用，他應如何正確辦理？","o":["這屬室內設計應請專業公司辦理","這屬室內設計僅須與房東協議好辦理","這屬室內裝修應向主管機關申請辦理","這屬室內裝修應向管理負責人報備"],"a":"C","ty":"case","e":{"s":"ok","x":"建築物室內裝修管理辦法第3條：高度超過地板面1.2公尺之固定隔屏或兼作櫥櫃使用之隔屏屬室內裝修；1.4公尺固定隔屏兼作櫥櫃，依規約範本第22條之1應向主管建築機關申請審查許可，故選(C)。","b":[{"k":"law","l":"建築物室內裝修管理辦法","r":"建築物室內裝修管理辦法第3條","m":"室內裝修包括固著於構造體的天花板、內部牆面、高度超過地板面1.2公尺的固定隔屏或兼作櫥櫃之隔屏、分間牆變更；黏貼壁紙壁布、擺設窗簾家具、活動隔屏或地氈等不算。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?PCode=D0070148"},{"k":"law","l":"公寓大廈規約範本（內政部；含附件六「公寓大廈文件之保管及閱覽管理規定」、附件七「室內裝修工程具結書」）","r":"公寓大廈規約範本第22條之1","m":"固著於構造體的天花板、內部牆面、高度逾1.2公尺的固定或兼作櫥櫃隔屏、分間牆變更等室內裝修，須委託合法業者向主管建築機關申請審查許可，取得許可才可施工。","u":"https://www.nlma.gov.tw/uploads/files/64c9e005c5c80aef8f123b5944268e14.pdf"},{"k":"law","l":"建築物室內裝修管理辦法","r":"建築物室內裝修管理辦法第22條","m":"供公眾使用建築物及經內政部認定有必要的非供公眾使用建築物，其室內裝修須由起造人、所有權人或使用人向主管建築機關或審查機構申請審核圖說，取得許可文件後才能施工。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?PCode=D0070148"}]}},{"id":"09-03-004","c":"09","t":"09-03","n":"04","q":"公寓大廈社區9樓住戶，為了增加該樓層走道照明裝置，應經由何者同意後為之？","o":["管理負責人","管理委員會","該樓層住戶","管理負責人或管理委員會"],"a":"D","ty":"gen","e":{"s":"ok","x":"增設走道照明須於共用部分設置管線，依條例第6條第1項第4款應經管理負責人或管理委員會之同意後為之，故選(D)。","b":[{"k":"law","l":"公寓大廈管理條例","r":"公寓大廈管理條例第6條第1項第4款","m":"住戶為維修專有或約定專用部分、或設置管線而必須使用共用部分時，要先取得管理負責人或管理委員會同意。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070118"}]}},{"id":"09-03-005","c":"09","t":"09-03","n":"05","q":"公寓大廈社區承租人，對於居室天花板進行設計與整修，應依何種法規申請辦理？","o":["建築物室內裝修管理辦法","建築技術規則","社區規約","公寓大廈管理條例"],"a":"A","ty":"gen","e":{"s":"ok","x":"建築物室內裝修管理辦法第3條把固定在構造體上的天花板裝修列為室內裝修，應依該辦法申請辦理，故選(A)。","b":[{"k":"law","l":"建築物室內裝修管理辦法","r":"建築物室內裝修管理辦法第3條","m":"室內裝修包括固著於構造體的天花板、內部牆面、高度超過地板面1.2公尺的固定隔屏或兼作櫥櫃之隔屏、分間牆變更；黏貼壁紙壁布、擺設窗簾家具、活動隔屏或地氈等不算。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?PCode=D0070148"},{"k":"law","l":"建築物室內裝修管理辦法","r":"建築物室內裝修管理辦法第22條","m":"供公眾使用建築物及經內政部認定有必要的非供公眾使用建築物，其室內裝修須由起造人、所有權人或使用人向主管建築機關或審查機構申請審核圖說，取得許可文件後才能施工。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?PCode=D0070148"}]}},{"id":"09-03-006","c":"09","t":"09-03","n":"06","q":"公寓大廈社區1樓承租人經營美容美髮業，基於調整室內動線，對於原本固著於建築物構造體之分間牆變更裝修，應依何種法規辦理？","o":["建築技術規則","建築物室內裝修管理辦法","公寓大廈管理條例","社區規約"],"a":"B","ty":"gen","e":{"s":"ok","x":"建築物室內裝修管理辦法第3條將分間牆變更列為室內裝修，應依該辦法辦理，故選(B)。","b":[{"k":"law","l":"建築物室內裝修管理辦法","r":"建築物室內裝修管理辦法第3條","m":"室內裝修包括固著於構造體的天花板、內部牆面、高度超過地板面1.2公尺的固定隔屏或兼作櫥櫃之隔屏、分間牆變更；黏貼壁紙壁布、擺設窗簾家具、活動隔屏或地氈等不算。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?PCode=D0070148"},{"k":"law","l":"建築物室內裝修管理辦法","r":"建築物室內裝修管理辦法第22條","m":"供公眾使用建築物及經內政部認定有必要的非供公眾使用建築物，其室內裝修須由起造人、所有權人或使用人向主管建築機關或審查機構申請審核圖說，取得許可文件後才能施工。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?PCode=D0070148"}]}},{"id":"09-03-007","c":"09","t":"09-03","n":"07","q":"某甲向房東承租8樓住宅，她父母年齡已達70歲，經洽房東同意，希望在住家陽台及窗戶設置防墜設施，下列敘述何者正確？","o":["須經管委會同意之後施做","須經區分所有權人會議決議之後施做","符合公寓大廈管理條例相關規定可施做","符合建築技術規則相關規定可施做"],"a":"C","ty":"case","e":{"s":"ok","x":"條例第8條第2項：家中有65歲以上老人的住戶，可在外牆開口部或陽臺裝設不妨礙逃生、也不突出外牆面的防墜設施；父母已70歲，符合規定可施做，故選(C)。","b":[{"k":"law","l":"公寓大廈管理條例","r":"公寓大廈管理條例第8條第2項","m":"住戶家中有12歲以下兒童或65歲以上老人時，外牆開口部或陽臺可裝設不妨礙逃生、不突出外牆面的防墜設施；設置理由消失且不符前項限制時，應改善或回復原狀。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070118"}]}},{"id":"09-03-008","c":"09","t":"09-03","n":"08","q":"住戶基於家中有12歲以下兒童及高齡老人，在住家陽台設置防墜設施，主要依何種法令規範？","o":["建築法","建築技術規則","公寓大廈管理條例","建築物室內裝修管理辦法"],"a":"C","ty":"gen","e":{"s":"ok","x":"陽臺防墜設施之設置要件規定於公寓大廈管理條例第8條第2項（家中有12歲以下兒童或65歲以上老人），故選(C)。","b":[{"k":"law","l":"公寓大廈管理條例","r":"公寓大廈管理條例第8條第2項","m":"住戶家中有12歲以下兒童或65歲以上老人時，外牆開口部或陽臺可裝設不妨礙逃生、不突出外牆面的防墜設施；設置理由消失且不符前項限制時，應改善或回復原狀。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070118"}]}},{"id":"09-03-009","c":"09","t":"09-03","n":"09","q":"住戶基於家中有12歲以下兒童，在住家陽台設置鐵鋁窗，除應依法令規定辦理外，仍應受何種規定之約束？","o":["應符合該公寓大廈規約規定或區分所有權人會議之決議","應符合社區管委會之決議","應符合建築法規範","應符合住戶生活公約之規範"],"a":"A","ty":"gen","e":{"s":"ok","x":"條例第8條第1項：設置鐵鋁窗除應依法令辦理外，若社區規約已有規定或區權會已有決議並經報備，即應受其限制；防墜設施之例外（第2項）不含鐵鋁窗，故選(A)。","b":[{"k":"law","l":"公寓大廈管理條例","r":"公寓大廈管理條例第8條第1項","m":"周圍上下、外牆面、樓頂平臺及非專有的防空避難設備，變更構造、顏色或設廣告物、鐵鋁窗等，除依法令辦理外，規約或區權會決議已有規定並向直轄市、縣（市）主管機關報備者，須受其限制。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070118"},{"k":"law","l":"公寓大廈管理條例","r":"公寓大廈管理條例第8條第2項","m":"住戶家中有12歲以下兒童或65歲以上老人時，外牆開口部或陽臺可裝設不妨礙逃生、不突出外牆面的防墜設施；設置理由消失且不符前項限制時，應改善或回復原狀。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070118"}]}},{"id":"09-03-010","c":"09","t":"09-03","n":"10","q":"住戶為避免家中寵物跑出屋外，自行在門廳前走廊設置柵欄，應由下列何者制止？","o":["同樓層受影響住戶","管理維護公司","管理負責人或管理委員會","社區保全員"],"a":"C","ty":"gen","e":{"s":"ok","x":"條例第16條第2項禁止於共同走廊設置柵欄；依同條第5項，住戶違反時由管理負責人或管理委員會予以制止，故選(C)。","b":[{"k":"law","l":"公寓大廈管理條例","r":"公寓大廈管理條例第16條第2項","m":"住戶不可在樓梯間、共同走廊、私設通路、防火巷弄、退縮空地、開放空間等處堆放雜物、設柵欄門扇、營業使用、違規設廣告物或私設路障；開放空間等另有經核准範圍內的例外。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070118"},{"k":"law","l":"公寓大廈管理條例","r":"公寓大廈管理條例第16條第5項","m":"住戶違反本條前四項規定時，管理負責人或管理委員會應予制止或依規約處理；不遵從者，可報請直轄市、縣（市）主管機關處理。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070118"}]}},{"id":"09-03-011","c":"09","t":"09-03","n":"11","q":"住戶為避免家中1歲幼兒跑出屋外，自行在門廳前走廊設置柵欄，應由下列何者制止？","o":["同樓層受影響住戶","管理維護公司","社區保全員","管理負責人或管理委員會"],"a":"D","ty":"gen","e":{"s":"ok","x":"條例第16條第2項禁止於共同走廊設置柵欄；依同條第5項，住戶違反時由管理負責人或管理委員會予以制止，故選(D)。","b":[{"k":"law","l":"公寓大廈管理條例","r":"公寓大廈管理條例第16條第2項","m":"住戶不可在樓梯間、共同走廊、私設通路、防火巷弄、退縮空地、開放空間等處堆放雜物、設柵欄門扇、營業使用、違規設廣告物或私設路障；開放空間等另有經核准範圍內的例外。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070118"},{"k":"law","l":"公寓大廈管理條例","r":"公寓大廈管理條例第16條第5項","m":"住戶違反本條前四項規定時，管理負責人或管理委員會應予制止或依規約處理；不遵從者，可報請直轄市、縣（市）主管機關處理。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070118"}]}},{"id":"09-03-012","c":"09","t":"09-03","n":"12","q":"住戶進行室內浴室裝修選用之給水管，應以何種材料製成？","o":["不燃材料","耐燃材料","耐水材料","耐用材料"],"a":"A","ty":"gen","e":{"s":"unclear","x":"","b":[],"f":"查到最接近的規定為建築技術規則建築設計施工編第205條（地下建築物之各種管路應以不燃材料製作），但該條屬第十一章地下建築物，不適用一般住戶室內裝修，查無直接適用之依據。","nt":"【2026-10-24簡報複查】查屋況點交頁50–66（室內裝修），並搜尋「不燃材料／耐燃／給水管／管路」：簡報沒有給水管材料規定；國土管理署規約範本PDF也沒有「不燃材料」或「給水管」，維持 unclear。"}},{"id":"09-03-013","c":"09","t":"09-03","n":"13","q":"住戶進行室內配電管及通風管裝修，應選用何種材料製成？","o":["耐燃材料","不燃材料","耐水材料","耐用材料"],"a":"B","ty":"gen","e":{"s":"unclear","x":"","b":[],"f":"查到最接近的規定為建築技術規則建築設計施工編第205條（地下建築物之各種管路應以不燃材料製作），但該條屬第十一章地下建築物，不適用一般住戶室內裝修，查無直接適用之依據。","nt":"【2026-10-24簡報複查】查屋況點交頁50–66，並搜尋「不燃材料／配電管／通風管」：簡報沒有配電管或通風管材料規定；規約範本PDF也沒有相關文字，維持 unclear。"}},{"id":"09-03-014","c":"09","t":"09-03","n":"14","q":"社區管委會進行室內裝修，經地下通道之通風管路及標示設施更新，應選用何種材料製成？","o":["耐燃材料","不燃材料","耐熱材料","耐用材料"],"a":"B","ty":"gen","e":{"s":"ok","x":"建築技術規則建築設計施工編第204條規定地下通道等之標示設施應為不燃材料，第205條規定各類管路應以不燃材料製造，故選(B)。","b":[{"k":"law","l":"建築技術規則建築設計施工編第十一章地下建築物（LawPlayer轉載）","r":"建築技術規則建築設計施工編第204條","m":"地下建築物的地下使用單元隔間、天花板、地下通道、樓梯等的底材與表面材，以及標示設施、廣告物等，都應採用不燃材料。","u":"https://lawplayer.com/act/6437d09ce800e5f0b9301eae/49"},{"k":"law","l":"建築技術規則建築設計施工編第十一章地下建築物（LawPlayer轉載）","r":"建築技術規則建築設計施工編第205條","m":"地下建築物的配電管、給水管、瓦斯管與其他各種管路，都要用不燃材料製作；管路穿過防火區劃時，貫穿處與區劃合成的構造須有2小時以上防火時效。","u":"https://lawplayer.com/act/6437d09ce800e5f0b9301eae/49"}]}},{"id":"09-03-015","c":"09","t":"09-03","n":"15","q":"承租人經得房東同意，將二樓住宅鋁窗進行修建，基於施工安全，工作人員利用鐵板設置圍籬，其高度應在幾公尺以上？","o":["1.2公尺","1.4公尺","1.6公尺","1.8公尺"],"a":"D","ty":"num","e":{"s":"ok","x":"建築技術規則建築設計施工編第152條：修建等施工場所四周須以鐵板或木板等合適材料圍設1.8公尺以上的圍籬，故選(D)。","b":[{"k":"law","l":"建築技術規則建築設計施工編第八章施工安全措施（LawPlayer轉載）","r":"建築技術規則建築設計施工編第152條","m":"建築物新建、增建、改建、修建或拆除時，施工場所四周要以鐵板或木板等合適材料圍設1.8公尺以上圍籬或同等防護設施；周圍環境無礙公共安全及觀瞻者可免設。","u":"https://lawplayer.com/act/6437d09ce800e5f0b9301eae/41"}]}},{"id":"09-03-016","c":"09","t":"09-03","n":"16","q":"承租人基於店面日式風格，室內裝修時也將1樓門邊之消防安全設備加上木質外框，這行為違反下列何種法令？","o":["建築法","建築技術規則","建築物室內裝修管理辦法","公寓大廈管理條例"],"a":"C","ty":"gen","e":{"s":"ok","x":"建築物室內裝修管理辦法第28條禁止室內裝修妨礙或破壞消防安全設備，以木框包覆消防安全設備即違反該辦法，故選(C)。","b":[{"k":"law","l":"建築物室內裝修管理辦法","r":"建築物室內裝修管理辦法第28條","m":"室內裝修不可妨礙或破壞消防安全設備；圖說涉及消防設備變更時，須依消防法規辦理並於施工前取得消防主管機關審核合格文件。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?PCode=D0070148"}]}},{"id":"09-03-017","c":"09","t":"09-03","n":"17","q":"住戶將1樓住宅中的居室，改做機械室及從事簡易維修工作，這行為違反下列何種法令？","o":["消防法","土地法","建築技術規則","建築物室內裝修管理辦法"],"a":"C","ty":"gen","e":{"s":"unclear","x":"","b":[],"f":"建築技術規則建築設計施工編第1條第19款僅定義機械室不視為居室，查無將居室改作機械室即違反該規則之明文，無法以可引用依據支持題庫答案(C)。","nt":"【2026-10-24簡報複查】查屋況點交頁3、7、50–66，並搜尋「機械室／居室」：頁3只引建築技術規則居室定義前段，沒有機械室不視為居室的部分；頁7說應依使用執照用途使用，否則依建築法第73條辦理，沒有明說將居室改為機械室違反建築技術規則，維持 unclear。"}},{"id":"09-03-018","c":"09","t":"09-03","n":"18","q":"依據建築技術規則之定義，下列何種材料屬於不燃材料？","o":["玻璃纖維、礦棉","柏油、金屬材料","木絲水泥板","石膏板"],"a":"A","ty":"gen","e":{"s":"ok","x":"建築技術規則建築設計施工編第1條第28款所列不燃材料包括玻璃纖維、礦棉；柏油屬耐水材料，木絲水泥板屬耐火板，石膏板屬耐燃材料，故選(A)。","b":[{"k":"law","l":"建築技術規則建築設計施工編","r":"建築技術規則建築設計施工編第1條第28款","m":"不燃材料舉例：混凝土、磚（含空心磚）、瓦與石料、鋼鐵和鋁、玻璃及玻璃纖維、礦棉、陶瓷品、砂漿、石灰，及經認定達耐燃一級的材料。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070115"},{"k":"law","l":"建築技術規則建築設計施工編","r":"建築技術規則建築設計施工編第1條第27款","m":"耐水材料舉例：磚與石料、人造石、混凝土、柏油（含其製品）、陶瓷品、玻璃、金屬材料及塑膠製品，以及耐水性相近的其他材料。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070115"},{"k":"law","l":"建築技術規則建築設計施工編","r":"建築技術規則建築設計施工編第1條第29款","m":"耐火板舉例：木絲水泥板與耐燃石膏板，另含經認定達耐燃二級的材料。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070115"},{"k":"law","l":"建築技術規則建築設計施工編","r":"建築技術規則建築設計施工編第1條第30款","m":"耐燃材料舉例：石膏板，以及耐燃合板、耐燃纖維板與耐燃塑膠板，另含經認定達耐燃三級的材料。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070115"}]}},{"id":"09-03-019","c":"09","t":"09-03","n":"19","q":"依據建築技術規則之定義，下列何種材料屬於耐火材料？","o":["金屬材料","耐燃石膏板","塑膠板","木料合板"],"a":"B","ty":"gen","e":{"s":"ok","x":"建築技術規則建築設計施工編第1條第29款所列耐火板包括耐燃石膏板；金屬材料屬耐水材料（第27款），塑膠板、木料合板均非耐火板，故選(B)。","b":[{"k":"law","l":"建築技術規則建築設計施工編","r":"建築技術規則建築設計施工編第1條第29款","m":"耐火板舉例：木絲水泥板與耐燃石膏板，另含經認定達耐燃二級的材料。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070115"},{"k":"law","l":"建築技術規則建築設計施工編","r":"建築技術規則建築設計施工編第1條第27款","m":"耐水材料舉例：磚與石料、人造石、混凝土、柏油（含其製品）、陶瓷品、玻璃、金屬材料及塑膠製品，以及耐水性相近的其他材料。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070115"}],"nt":"題目所稱「耐火材料」，規則用語為「耐火板」。"}},{"id":"09-03-020","c":"09","t":"09-03","n":"20","q":"依據建築技術規則之定義，下列何種材料屬於耐水材料？","o":["木絲水泥板","石膏板","耐燃合板","磚、石料"],"a":"D","ty":"gen","e":{"s":"ok","x":"建築技術規則建築設計施工編第1條第27款所列耐水材料包括磚、石料；木絲水泥板屬耐火板，石膏板、耐燃合板屬耐燃材料，故選(D)。","b":[{"k":"law","l":"建築技術規則建築設計施工編","r":"建築技術規則建築設計施工編第1條第27款","m":"耐水材料舉例：磚與石料、人造石、混凝土、柏油（含其製品）、陶瓷品、玻璃、金屬材料及塑膠製品，以及耐水性相近的其他材料。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070115"},{"k":"law","l":"建築技術規則建築設計施工編","r":"建築技術規則建築設計施工編第1條第29款","m":"耐火板舉例：木絲水泥板與耐燃石膏板，另含經認定達耐燃二級的材料。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070115"},{"k":"law","l":"建築技術規則建築設計施工編","r":"建築技術規則建築設計施工編第1條第30款","m":"耐燃材料舉例：石膏板，以及耐燃合板、耐燃纖維板與耐燃塑膠板，另含經認定達耐燃三級的材料。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070115"}]}},{"id":"09-03-021","c":"09","t":"09-03","n":"21","q":"依據建築技術規則之定義，下列何種材料屬於耐燃材料？","o":["石膏板","塑膠板","木料合板","窗簾"],"a":"A","ty":"gen","e":{"s":"ok","x":"建築技術規則建築設計施工編第1條第30款所列耐燃材料包括石膏板（塑膠板須為耐燃塑膠板、合板須為耐燃合板），故選(A)。","b":[{"k":"law","l":"建築技術規則建築設計施工編","r":"建築技術規則建築設計施工編第1條第30款","m":"耐燃材料舉例：石膏板，以及耐燃合板、耐燃纖維板與耐燃塑膠板，另含經認定達耐燃三級的材料。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070115"}]}},{"id":"09-03-022","c":"09","t":"09-03","n":"22","q":"住戶基於建立店面風格，室內裝修時將1樓門柱邊之消防安全設備加上美麗玻璃纖維框架，這行為違反下列何種法令？","o":["建築法","建築技術規則","建築物室內裝修管理辦法","公寓大廈社區規約"],"a":"C","ty":"gen","e":{"s":"ok","x":"建築物室內裝修管理辦法第28條禁止室內裝修妨礙或破壞消防安全設備，於消防安全設備加裝框架即違反該辦法，故選(C)。","b":[{"k":"law","l":"建築物室內裝修管理辦法","r":"建築物室內裝修管理辦法第28條","m":"室內裝修不可妨礙或破壞消防安全設備；圖說涉及消防設備變更時，須依消防法規辦理並於施工前取得消防主管機關審核合格文件。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?PCode=D0070148"}]}},{"id":"09-03-023","c":"09","t":"09-03","n":"23","q":"住戶將鞋櫃、腳踏車或金爐等雜物放置於樓梯間，管理負責人經制止而不遵從者，縣(市)政府主管機關得處多少罰鍰？","o":["10,000以上30,000以下","20,000以上100,000以下","40,000以上200,000以下","30,000以上300,000以下"],"a":"C","ty":"num","ns":1,"e":{"s":"ok","x":"於樓梯間堆置雜物違反條例第16條第2項，依第49條第1項處新臺幣4萬元以上20萬元以下罰鍰，故選(C)。","b":[{"k":"law","l":"公寓大廈管理條例","r":"公寓大廈管理條例第16條第2項","m":"住戶不可在樓梯間、共同走廊、私設通路、防火巷弄、退縮空地、開放空間等處堆放雜物、設柵欄門扇、營業使用、違規設廣告物或私設路障；開放空間等另有經核准範圍內的例外。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070118"},{"k":"law","l":"公寓大廈管理條例","r":"公寓大廈管理條例第49條第1項","m":"違反第5條、經制止仍違反第8條第1項或第9條第2項、擅自變更專有或約定專用之使用、違反第16條第2項或第3項等行為，處新臺幣4萬元以上20萬元以下罰鍰。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070118"}]}},{"id":"09-03-024","c":"09","t":"09-03","n":"24","q":"承租人基於自身營業使用，將置物櫃或雜物放置於一樓共同走廊，造成住戶碰撞絆倒受重傷，縣(市)政府主管機關得處多久刑期？","o":["3個月以上3年以下有期徒刑","6個月以上5年以下有期徒刑","6個月以上6年以下有期徒刑","5個月以上7年以下有期徒刑"],"a":"B","ty":"num","ns":1,"e":{"s":"ok","x":"有營業使用事實之住戶於共同走廊堆置雜物違反條例第16條第2項，依第49條第2項致人重傷者處6個月以上5年以下有期徒刑，故選(B)。","b":[{"k":"law","l":"公寓大廈管理條例","r":"公寓大廈管理條例第16條第2項","m":"住戶不可在樓梯間、共同走廊、私設通路、防火巷弄、退縮空地、開放空間等處堆放雜物、設柵欄門扇、營業使用、違規設廣告物或私設路障；開放空間等另有經核准範圍內的例外。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070118"},{"k":"law","l":"公寓大廈管理條例","r":"公寓大廈管理條例第49條第2項","m":"有營業使用事實的住戶犯第1項第3款或第4款行為，致人死亡處1年以上7年以下有期徒刑，得併科100萬至500萬元罰金；致重傷處6個月以上5年以下，得併科50萬至250萬元罰金。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070118"}],"nt":"刑罰係由法院判處，題目稱主管機關得處刑期之用語不精確，不影響答案。"}},{"id":"09-03-025","c":"09","t":"09-03","n":"25","q":"住戶擅自更改家中浴室排水管路，造成樓下住戶天花板滲水，管理負責人經制止而不遵從，也不願改善，縣(市)政府主管機關得處多少金額罰鍰？","o":["10,000以上30,000以下","20,000以上100,000以下","30,000以上300,000以下","40,000以上200,000以下"],"a":"D","ty":"num","ns":1,"e":{"s":"ok","x":"擅改浴室排水管路致樓下滲水，屬對專有部分之利用妨害建築物正常使用（條例第5條），依第49條第1項處新臺幣4萬元以上20萬元以下罰鍰，故選(D)。","b":[{"k":"law","l":"公寓大廈管理條例","r":"公寓大廈管理條例第5條","m":"區分所有權人利用專有部分時，不可妨害建築物正常使用，也不可違反全體區分所有權人的共同利益。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070118"},{"k":"law","l":"公寓大廈管理條例","r":"公寓大廈管理條例第49條第1項","m":"違反第5條、經制止仍違反第8條第1項或第9條第2項、擅自變更專有或約定專用之使用、違反第16條第2項或第3項等行為，處新臺幣4萬元以上20萬元以下罰鍰。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070118"}],"nt":"題目未指明違反條文，本題解依選項金額對應第49條第1項第1款（違反第5條）說明。"}},{"id":"09-03-026","c":"09","t":"09-03","n":"26","q":"承租人於1樓的退縮空地設置路邊廣告物，造成住戶碰撞絆倒受重傷，縣(市)政府主管機關得處予罰則，下列何者正確？","o":["處3個月以上3年以下有期徒刑，得併科新臺幣30萬元以上100萬元以下罰金。","處6個月以上5年以下有期徒刑，得併科新臺幣50萬元以上250萬元以下罰金。","處6個月以上7年以下有期徒刑，得併科新臺幣30萬元以上150萬元以下罰金。","處6個月以上5年以下有期徒刑，得併科新臺幣40萬元以上200萬元以下罰金。"],"a":"B","ty":"num","ns":1,"e":{"s":"ok","x":"承租人為營業於退縮空地違規設置廣告物，違反條例第16條第2項；依第49條第2項致人重傷者處6個月以上5年以下有期徒刑，得併科新臺幣50萬元以上250萬元以下罰金，故選(B)。","b":[{"k":"law","l":"公寓大廈管理條例","r":"公寓大廈管理條例第16條第2項","m":"住戶不可在樓梯間、共同走廊、私設通路、防火巷弄、退縮空地、開放空間等處堆放雜物、設柵欄門扇、營業使用、違規設廣告物或私設路障；開放空間等另有經核准範圍內的例外。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070118"},{"k":"law","l":"公寓大廈管理條例","r":"公寓大廈管理條例第49條第2項","m":"有營業使用事實的住戶犯第1項第3款或第4款行為，致人死亡處1年以上7年以下有期徒刑，得併科100萬至500萬元罰金；致重傷處6個月以上5年以下，得併科50萬至250萬元罰金。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070118"}]}},{"id":"10-01-001","c":"10","t":"10-01","n":"01","q":"下列哪一項為租賃住宅服務業提供的服務？","o":["售屋資訊","代收包裹服務","住宅修繕保險服務","協助租屋契約公證"],"a":"D","ty":"gen","e":{"s":"ok","x":"租屋服務事業認定及獎勵辦法第2條第1款：租屋服務事業應領有租賃住宅服務業登記證；第3條第6款明定其服務項目包括「協助租屋契約公證」。售屋資訊、代收包裹、修繕保險均非所列項目，故選(D)。","b":[{"k":"law","l":"租屋服務事業認定及獎勵辦法","r":"租屋服務事業認定及獎勵辦法第2條第1款","q":"一、領有租賃住宅服務業登記證，且營業項目登記含租賃住宅包租業、租賃住宅代管業。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070252"},{"k":"law","l":"租屋服務事業認定及獎勵辦法","r":"租屋服務事業認定及獎勵辦法第3條第6款","q":"六、協助租屋契約公證。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070252"}],"nt":"依據為住宅法授權之租屋服務事業（須為租賃住宅服務業）服務項目。"}},{"id":"10-01-002","c":"10","t":"10-01","n":"02","q":"關於不動產仲介經紀業、代管業及包租業的敘述，下列何者正確？","o":["仲介業為一次性服務，代管業與包租業屬於連續性服務","代管業與包租業均為受託管理性質","包租業僅負責管理，並不涉及承租及轉租行為","仲介業務與代管業務的法律責任完全相同"],"a":"A","ty":"gen","e":{"s":"ok","x":"不動產經紀業管理條例第4條第5款：仲介業務係從事租賃之居間或代理，以促成個別交易為內容；條例第3條第4至6款之代管業、包租業則經營收租與押金管理、日常修繕維護等租賃住宅管理業務，屬租期內持續提供之服務。包租業係承租並轉租（B、C錯），故選(A)。","b":[{"k":"law","l":"不動產經紀業管理條例","r":"不動產經紀業管理條例第4條第5款","q":"五、仲介業務︰指從事不動產買賣、互易、租賃之居間或代理業務。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060066"},{"k":"law","l":"租賃住宅市場發展及管理條例","r":"條例第3條第5款","q":"五、租賃住宅包租業（以下簡稱包租業）：指承租租賃住宅並轉租，及經營該租賃住宅管理業務（以下簡稱包租業務）之公司。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060125"},{"k":"law","l":"租賃住宅市場發展及管理條例","r":"條例第3條第6款","q":"六、租賃住宅管理業務：指租賃住宅之屋況與設備點交、收租與押金管理、日常修繕維護、糾紛協調處理及其他與租賃住宅管理有關之事項。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060125"}],"nt":"「一次性／連續性」為依業務定義之歸納，法條無此用語。"}},{"id":"10-01-003","c":"10","t":"10-01","n":"03","q":"依照《租賃住宅市場發展及管理條例》，租賃住宅管理人員的積極資格包括以下哪一項？","o":["需具備不動產經紀人資格","必須經過全國聯合會舉辦的資格訓練並測驗合格","需通過專業倫理考核，由內政部直接核發證書","需在政府機關登記滿一年後才可執業"],"a":"B","ty":"gen","e":{"s":"ok","x":"條例第26條第1項：經參加全國聯合會舉辦租賃住宅管理人員資格訓練並測驗合格者，於一年內登錄及領有證書，始得充任租賃住宅管理人員，故選(B)。","b":[{"k":"law","l":"租賃住宅市場發展及管理條例","r":"條例第26條第1項","q":"經參加全國聯合會舉辦租賃住宅管理人員資格訓練並測驗合格者，應於取得合格證明之日起一年內向中央主管機關或其指定之機關（構）、團體、學校登錄及領有租賃住宅管理人員證書，始得充任租賃住宅管理人員。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060125"}]}},{"id":"10-01-004","c":"10","t":"10-01","n":"04","q":"依據《租賃住宅市場發展及管理條例》，租賃住宅管理人員不適宜從事以下哪種行為？","o":["提供租客完整的租賃契約資訊，並協助解釋條款","依據市場行情，協助業主訂定合理租金","以不當手段引導租客轉換租賃服務業者","為確保交易安全，協助租客進行租金補助申請"],"a":"C","ty":"gen","e":{"s":"ok","x":"租賃住宅服務業倫理規範第24條：租賃住宅管理人員及從業人員不得惡意驅使當事人轉換其他租服業，損害當事人之權益；以不當手段引導租客轉換業者即屬之，故選(C)。","b":[{"k":"law","l":"租賃住宅服務業倫理規範（中華民國租賃住宅服務商業同業公會全國聯合會）","r":"倫理規範第24條","q":"租賃住宅管理人員及從業人員不得惡意驅使當事人轉換其他租服業，損害當事人之權益。","u":"https://rentalh.org.tw/public/upimgs/%E7%A7%9F%E8%B3%83%E4%BD%8F%E5%AE%85%E6%9C%8D%E5%8B%99%E6%A5%AD%E5%80%AB%E7%90%86%E8%A6%8F%E7%AF%84.pdf"}],"nt":"題目稱依條例，實際依據為全國聯合會訂定之倫理規範。"}},{"id":"10-01-005","c":"10","t":"10-01","n":"05","q":"王先生是一名租賃住宅管理人員，某天一位房東李太太請他幫忙，要求他在租屋廣告上標示「全新裝潢」，但實際上房屋已有10年以上的使用歷史，部分天花板甚至有滲水問題。李太太表示：「這些問題租客來看時可能不會特別注意，先租出去比較重要。」請問王先生若依照李太太的要求，可能違反哪項政府規範？","o":["違反不動產估價師法","違反租賃住宅市場發展及管理條例","違反消費者保護法","違反公平交易法"],"a":"B","ty":"case","e":{"s":"ok","x":"條例第13條第1項：出租人提供之租賃住宅廣告內容應與事實相符；將屋齡逾10年且有滲水之房屋標示「全新裝潢」，即違反本條例規定，故選(B)。","b":[{"k":"law","l":"租賃住宅市場發展及管理條例","r":"條例第13條第1項","q":"出租人提供之租賃住宅廣告內容應與事實相符。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060125"},{"k":"law","l":"租賃住宅服務業倫理規範（中華民國租賃住宅服務商業同業公會全國聯合會）","r":"倫理規範第26條","q":"不得有虛偽、詐欺、作誇大不實之宣傳，或以不實廣告及其他足致他人誤信方式招攬業務。","u":"https://rentalh.org.tw/public/upimgs/%E7%A7%9F%E8%B3%83%E4%BD%8F%E5%AE%85%E6%9C%8D%E5%8B%99%E6%A5%AD%E5%80%AB%E7%90%86%E8%A6%8F%E7%AF%84.pdf"}],"nt":"不實廣告亦可能涉及消保法、公平交易法，題庫答案取條例第13條。"}},{"id":"10-01-006","c":"10","t":"10-01","n":"06","q":"李先生是某租賃公司的業務主管，他發現競爭對手公司提供的租屋代管費率較低，為了吸引更多業主合作，李先生在社交媒體上發表一則貼文，稱競爭對手公司「服務品質低劣，管理不善」，但他並無實際證據支持這項說法。請問他的行為可能違反哪一項專業倫理原則？","o":["市場公平競爭原則","服務收費透明原則","住宅租賃管理責任","確保租賃標的品質"],"a":"A","ty":"gen","e":{"s":"ok","x":"倫理規範第12條第1款、第6款：租服業應維護產業秩序與公平競爭，不得以毀損他人名譽或信用為目的陳述、散布其他租服業爭議事件，或為其他足以毀損同業商譽之行為（公平交易法第24條亦禁止散布損害他人營業信譽之不實情事），屬市場公平競爭原則，故選(A)。","b":[{"k":"law","l":"租賃住宅服務業倫理規範（中華民國租賃住宅服務商業同業公會全國聯合會）","r":"倫理規範第12條第1項","q":"租服業之間應相互尊重，維護產業秩序與公平競爭，不得有下列各款惡性競爭之行為:","u":"https://rentalh.org.tw/public/upimgs/%E7%A7%9F%E8%B3%83%E4%BD%8F%E5%AE%85%E6%9C%8D%E5%8B%99%E6%A5%AD%E5%80%AB%E7%90%86%E8%A6%8F%E7%AF%84.pdf"},{"k":"law","l":"租賃住宅服務業倫理規範（中華民國租賃住宅服務商業同業公會全國聯合會）","r":"倫理規範第12條第6款","q":"六、 其他足以毀損同業商譽或信用之行為。","u":"https://rentalh.org.tw/public/upimgs/%E7%A7%9F%E8%B3%83%E4%BD%8F%E5%AE%85%E6%9C%8D%E5%8B%99%E6%A5%AD%E5%80%AB%E7%90%86%E8%A6%8F%E7%AF%84.pdf"},{"k":"law","l":"公平交易法","r":"公平交易法第24條","q":"事業不得為競爭之目的，而陳述或散布足以損害他人營業信譽之不實情事。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=J0150002"}]}},{"id":"10-01-007","c":"10","t":"10-01","n":"07","q":"黃先生是一名房屋仲介，近日他協助一位視障租客陳先生租房。簽約時，房東要求在租賃契約中加註「租客需自行負責所有室內修繕費用」，但未清楚解釋該條款的內容。陳先生以為這只是一般租約內容，便簽署了契約。入住後，他發現冷氣無法運作，向房東反應卻被告知需自費修繕。請問黃先生在這個過程中，可能涉及以下哪種不當行為？","o":["隱瞞重要租賃條款，違反資訊揭露義務","違反不動產經紀業管理條例，提供不實價格資訊","違反政府租金補助法規，未協助租客申請補助","違反房東的所有權責，未提醒房東負擔維修責任"],"a":"A","ty":"case","e":{"s":"ok","x":"倫理規範第17條：從業人員應傳遞當事人明確、合法之租賃條款；條例第8條第2項亦要求簽約前說明修繕項目及範圍。未解釋「租客自行負責所有室內修繕費用」條款即讓視障租客簽約，屬隱瞞重要條款、違反資訊揭露義務，故選(A)。","b":[{"k":"law","l":"租賃住宅服務業倫理規範（中華民國租賃住宅服務商業同業公會全國聯合會）","r":"倫理規範第17條","q":"租賃住宅管理人員及從業人員應傳遞當事人明確、合法之租賃條款和透明之管理費用","u":"https://rentalh.org.tw/public/upimgs/%E7%A7%9F%E8%B3%83%E4%BD%8F%E5%AE%85%E6%9C%8D%E5%8B%99%E6%A5%AD%E5%80%AB%E7%90%86%E8%A6%8F%E7%AF%84.pdf"},{"k":"law","l":"租賃住宅市場發展及管理條例","r":"條例第8條第2項","q":"出租人應於簽訂租賃契約前，向承租人說明由出租人負責修繕項目及範圍，並提供有修繕必要時之聯絡方式。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060125"}],"nt":"題目行為人為房屋仲介，依倫理規範第29條涉經紀業範疇另適用不動產經紀業相關規範。"}},{"id":"10-01-008","c":"10","t":"10-01","n":"08","q":"李小姐是一名租客，她在入住一間租賃住宅三個月後，發現房屋內的電線老舊，經常發生跳電問題，影響日常生活。她多次向房東反映，但房東遲遲未處理。請問租賃業者應該如何協助？","o":["告知自行聘請電工修繕，然後向房東索取修繕費","停止繳納租金，直到房東修理電線為止","良好溝通即時回應問題","告知接受現狀，並自費購買穩壓設備解決問題"],"a":"C","ty":"case","e":{"s":"ok","x":"倫理規範第22條：從業人員應與當事人保持良好溝通，及時回應疑慮及問題，確保任一方瞭解租賃標的狀態與問題處理進度；出租人依條例第8條第1項亦應保持住宅合於居住使用，故選(C)。","b":[{"k":"law","l":"租賃住宅服務業倫理規範（中華民國租賃住宅服務商業同業公會全國聯合會）","r":"倫理規範第22條","q":"租賃住宅管理人員及從業人員應與當事人保持良好溝通，及時回應疑慮及問題，確保任一方瞭解租賃標的狀態與問題處理進度。","u":"https://rentalh.org.tw/public/upimgs/%E7%A7%9F%E8%B3%83%E4%BD%8F%E5%AE%85%E6%9C%8D%E5%8B%99%E6%A5%AD%E5%80%AB%E7%90%86%E8%A6%8F%E7%AF%84.pdf"},{"k":"law","l":"租賃住宅市場發展及管理條例","r":"條例第8條第1項","q":"出租人應以合於所約定居住使用之租賃住宅，交付承租人，並應於租賃期間保持其合於居住使用之狀態。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060125"}]}},{"id":"10-01-009","c":"10","t":"10-01","n":"09","q":"張小姐是一名租賃住宅管理人員，最近一位租客因個人因素想提前解約，但房東要求收取剩餘租期的所有租金作為違約金。張小姐應如何處理？","o":["告知租客只能依房東要求支付全額違約金","協助雙方協商合理的違約金金額，符合公平原則","建議租客直接向房東申請減免，但無需簽署書面協議","要求租客自行找下一位租客接手，否則無法解除租約"],"a":"B","ty":"case","e":{"s":"ok","x":"應記載事項第十四點第2項：任意終止租約之違約金最高不得超過一個月租金額；民法第252條約定違約金過高者法院得酌減。收取剩餘租期全部租金顯失公平，管理人員應協助雙方協商合理金額，故選(B)。","b":[{"k":"law","l":"住宅租賃定型化契約應記載及不得記載事項（內政部）","r":"應記載事項第十四點第2項","q":"一方未為先期通知而逕行終止租約者，應賠償他方最高不得超過一個月租金額之違約金。","u":"https://www.ey.gov.tw/File/43BC094940995CFC?A=C"},{"k":"law","l":"民法","r":"民法第252條","q":"約定之違約金額過高者，法院得減至相當之數額。","u":"https://mojlaw.moj.gov.tw/LawContent.aspx?LSID=FL001351"},{"k":"law","l":"租賃住宅服務業倫理規範（中華民國租賃住宅服務商業同業公會全國聯合會）","r":"倫理規範第8條","q":"任何時候均以當事人最佳利益為優先考量。","u":"https://rentalh.org.tw/public/upimgs/%E7%A7%9F%E8%B3%83%E4%BD%8F%E5%AE%85%E6%9C%8D%E5%8B%99%E6%A5%AD%E5%80%AB%E7%90%86%E8%A6%8F%E7%AF%84.pdf"}]}},{"id":"10-01-010","c":"10","t":"10-01","n":"10","q":"王先生是某租賃公司負責人，他為了提高業績，要求旗下員工優先推薦某些房東支付較高佣金的物件給租客，而非最適合租客需求的房源。這樣的行為是否符合倫理規範？","o":["符合，租賃公司可自行決定房源推薦策略","不符合，應以租客的最佳利益為優先考量","符合，房東願意支付較高佣金是市場行為","不符合，但只要租客不發現，就不會有問題"],"a":"B","ty":"case","e":{"s":"ok","x":"倫理規範第8條：租服業應避免涉及可能引發利益衝突之情況，任何時候均以當事人最佳利益為優先考量；依佣金高低而非租客需求推薦房源不符規範，故選(B)。","b":[{"k":"law","l":"租賃住宅服務業倫理規範（中華民國租賃住宅服務商業同業公會全國聯合會）","r":"倫理規範第8條","q":"租服業應避免涉及可能引發利益衝突之情況，任何時候均以當事人最佳利益為優先考量。","u":"https://rentalh.org.tw/public/upimgs/%E7%A7%9F%E8%B3%83%E4%BD%8F%E5%AE%85%E6%9C%8D%E5%8B%99%E6%A5%AD%E5%80%AB%E7%90%86%E8%A6%8F%E7%AF%84.pdf"}]}},{"id":"10-01-011","c":"10","t":"10-01","n":"11","q":"陳小姐計畫租房，但租賃公司要求她提供身分證影本及存摺明細，且未說明用途。這樣的行為是否合理？","o":["合理，租賃公司有權要求任何資訊","不合理，應依個資法規範取得租客同意","合理，租客應該信任租賃公司","不合理，但租客無權拒絕提供"],"a":"B","ty":"gen","e":{"s":"ok","x":"個資法第19條第1項：非公務機關蒐集個資應有特定目的並符合法定情形（如經當事人同意）；第8條第1項：蒐集時應明確告知蒐集之目的等事項。未說明用途即索取身分證影本及存摺明細不合理，倫理規範第7條亦要求遵守個資法，故選(B)。","b":[{"k":"law","l":"個人資料保護法","r":"個資法第19條第1項","q":"非公務機關對個人資料之蒐集或處理，除第六條第一項所規定資料外，應有特定目的，並符合下列情形之一者：","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?PCode=I0050021"},{"k":"law","l":"個人資料保護法","r":"個資法第19條第1項第5款","q":"五、經當事人同意。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?PCode=I0050021"},{"k":"law","l":"個人資料保護法","r":"個資法第8條第1項","q":"公務機關或非公務機關依第十五條或第十九條規定向當事人蒐集個人資料時，應明確告知當事人下列事項：","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?PCode=I0050021"},{"k":"law","l":"租賃住宅服務業倫理規範（中華民國租賃住宅服務商業同業公會全國聯合會）","r":"倫理規範第7條第1項","q":"租服業應遵守消費者保護法、個人資料保護法等法令，保護當事人權益及隱私","u":"https://rentalh.org.tw/public/upimgs/%E7%A7%9F%E8%B3%83%E4%BD%8F%E5%AE%85%E6%9C%8D%E5%8B%99%E6%A5%AD%E5%80%AB%E7%90%86%E8%A6%8F%E7%AF%84.pdf"}]}},{"id":"10-01-012","c":"10","t":"10-01","n":"12","q":"王先生是一名租賃住宅管理人員，在管理某社區時，房東要求他幫忙篩選租客，不接受年長者與外籍人士。請問王先生應該如何處理？","o":["接受房東要求，按照需求篩選租客","與房東協商，並說明這樣的做法不符合規範","與房東協商，適當篩選部分族群，以減少爭議","完全不回應房東的要求，避免影響合作關係"],"a":"B","ty":"case","e":{"s":"ok","x":"倫理規範第16條：執行業務時不得有一切形式種族歧視之行為；第2條：應恪遵法令及本規範。依族群、國籍等篩選租客不符規範，管理人員應與房東溝通說明，故選(B)。","b":[{"k":"law","l":"租賃住宅服務業倫理規範（中華民國租賃住宅服務商業同業公會全國聯合會）","r":"倫理規範第16條","q":"租服業、租賃住宅管理人員及從業人員執行業務時，不得有一切形式種族歧視之行為。","u":"https://rentalh.org.tw/public/upimgs/%E7%A7%9F%E8%B3%83%E4%BD%8F%E5%AE%85%E6%9C%8D%E5%8B%99%E6%A5%AD%E5%80%AB%E7%90%86%E8%A6%8F%E7%AF%84.pdf"},{"k":"law","l":"租賃住宅服務業倫理規範（中華民國租賃住宅服務商業同業公會全國聯合會）","r":"倫理規範第2條","q":"租服業於執行業務時，應恪遵法令及本規範。","u":"https://rentalh.org.tw/public/upimgs/%E7%A7%9F%E8%B3%83%E4%BD%8F%E5%AE%85%E6%9C%8D%E5%8B%99%E6%A5%AD%E5%80%AB%E7%90%86%E8%A6%8F%E7%AF%84.pdf"}],"nt":"倫理規範第16條明文為種族歧視；年齡歧視無直接條文。"}},{"id":"10-01-013","c":"10","t":"10-01","n":"13","q":"林先生發現租賃住宅市場競爭激烈，為了吸引客戶，他決定提供租金補助申請服務，並誘導租客與房東簽訂虛假租約，以獲取政府補助。這樣的行為是否合法？","o":["合法，只要租客與房東同意即可","不合法，屬於誘導虛假契約申請補助","合法，政府租金補助本來就該讓更多人受益","不合法，但只要沒被查到就沒問題"],"a":"B","ty":"case","e":{"s":"ok","x":"倫理規範第27條：不得誘使當事人以訂定虛假委託代管或租賃契約方式申請政府各項補助；以詐術取得補助並可能涉刑法第339條詐欺罪，故選(B)。","b":[{"k":"law","l":"租賃住宅服務業倫理規範（中華民國租賃住宅服務商業同業公會全國聯合會）","r":"倫理規範第27條","q":"租服業、租賃住宅管理人員及從業人員不得誘使當事人以訂定虛假委託代管或租賃契約方式申請政府各項補助。","u":"https://rentalh.org.tw/public/upimgs/%E7%A7%9F%E8%B3%83%E4%BD%8F%E5%AE%85%E6%9C%8D%E5%8B%99%E6%A5%AD%E5%80%AB%E7%90%86%E8%A6%8F%E7%AF%84.pdf"},{"k":"law","l":"中華民國刑法","r":"刑法第339條第2項","q":"以前項方法得財產上不法之利益或使第三人得之者，亦同。","u":"https://mojlaw.moj.gov.tw/LawContent.aspx?LSID=FL001424&lawNumber=296&TypeSort=2"}]}},{"id":"10-01-014","c":"10","t":"10-01","n":"14","q":"某租賃公司在廣告中標榜：「選擇我們的服務，租金保證最低，不滿意可隨時退款。」然而，實際上該公司無法確保所有租金皆為最低，且未提供退款機制。這樣的廣告是否符合規範？","o":["符合，廣告內容屬於行銷手法，無需完全履行","符合，只要沒有客戶投訴，就不算違規","不符合，這屬於虛偽或誇大不實的廣告宣傳","不符合，但只要能吸引客戶，就沒有問題"],"a":"C","ty":"gen","e":{"s":"ok","x":"倫理規範第26條：不得作誇大不實之宣傳，或以不實廣告招攬業務；公平交易法第21條第1項亦禁止於廣告為虛偽不實或引人錯誤之表示。標榜「租金保證最低、可隨時退款」而無法兌現，屬虛偽誇大不實廣告，故選(C)。","b":[{"k":"law","l":"租賃住宅服務業倫理規範（中華民國租賃住宅服務商業同業公會全國聯合會）","r":"倫理規範第26條","q":"租服業、租賃住宅管理人員及從業人員不得有虛偽、詐欺、作誇大不實之宣傳，或以不實廣告及其他足致他人誤信方式招攬業務。","u":"https://rentalh.org.tw/public/upimgs/%E7%A7%9F%E8%B3%83%E4%BD%8F%E5%AE%85%E6%9C%8D%E5%8B%99%E6%A5%AD%E5%80%AB%E7%90%86%E8%A6%8F%E7%AF%84.pdf"},{"k":"law","l":"公平交易法","r":"公平交易法第21條第1項","q":"為虛偽不實或引人錯誤之表示或表徵。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=J0150002"}]}},{"id":"10-01-015","c":"10","t":"10-01","n":"15","q":"王先生是一名租賃住宅管理人員，他的公司為了提高業績，要求他向租客收取額外的「合約管理費」，但未向租客提供正式收據。這樣的行為是否符合倫理規範？","o":["符合，只要租客同意支付即可","不符合，租服業不得隨意收取額外費用","符合，租服業可以自行決定收費項目","不符合，但只要租客未提出異議，就無問題"],"a":"B","ty":"case","e":{"s":"ok","x":"倫理規範第21條：不得利用業務之便，巧立名目額外收取其他費用；第17條亦要求傳遞透明之管理費用。額外收取「合約管理費」且不開收據，不符規範，故選(B)。","b":[{"k":"law","l":"租賃住宅服務業倫理規範（中華民國租賃住宅服務商業同業公會全國聯合會）","r":"倫理規範第21條","q":"租賃住宅管理人員及從業人員不得利用業務之便，巧立名目額外收取其他費用","u":"https://rentalh.org.tw/public/upimgs/%E7%A7%9F%E8%B3%83%E4%BD%8F%E5%AE%85%E6%9C%8D%E5%8B%99%E6%A5%AD%E5%80%AB%E7%90%86%E8%A6%8F%E7%AF%84.pdf"},{"k":"law","l":"租賃住宅服務業倫理規範（中華民國租賃住宅服務商業同業公會全國聯合會）","r":"倫理規範第17條","q":"租賃住宅管理人員及從業人員應傳遞當事人明確、合法之租賃條款和透明之管理費用","u":"https://rentalh.org.tw/public/upimgs/%E7%A7%9F%E8%B3%83%E4%BD%8F%E5%AE%85%E6%9C%8D%E5%8B%99%E6%A5%AD%E5%80%AB%E7%90%86%E8%A6%8F%E7%AF%84.pdf"}]}},{"id":"10-01-016","c":"10","t":"10-01","n":"16","q":"王先生透過某租賃住宅服務業的包租業務承租一間公寓。根據規定，該租賃住宅服務業應在簽訂轉租契約後多久內向主管機關申報登錄該案件的實際資訊？","o":["10日內","15日內","30日內","60日內"],"a":"C","ty":"num","e":{"s":"ok","x":"條例第34條第2項：包租業之租賃住宅轉租案件，應於簽訂轉租契約之日起三十日內，向直轄市、縣（市）主管機關申報登錄成交案件實際資訊，故選(C)。","b":[{"k":"law","l":"租賃住宅市場發展及管理條例","r":"條例第34條第2項","q":"包租業之租賃住宅轉租案件，應於簽訂轉租契約之日起三十日內，向直轄市、縣（市）主管機關申報登錄成交案件實際資訊（以下簡稱申報登錄資訊）。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060125"}]}},{"id":"10-01-017","c":"10","t":"10-01","n":"17","q":"李小姐是某租賃住宅服務業的管理人員，今天有房客來要求索取押金退還證明。根據法規，該文件應由誰簽章？","o":["任何租賃住宅服務業人員","房東","租賃住宅服務業的專任租賃住宅管理人員","房客本人"],"a":"C","ty":"case","e":{"s":"ok","x":"條例第32條第6款：退還租金、押金證明應由租賃住宅服務業指派專任租賃住宅管理人員簽章，故選(C)。","b":[{"k":"law","l":"租賃住宅市場發展及管理條例","r":"條例第32條","q":"下列文件應由租賃住宅服務業指派專任租賃住宅管理人員簽章：","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060125"},{"k":"law","l":"租賃住宅市場發展及管理條例","r":"條例第32條第6款","q":"六、退還租金、押金證明。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060125"}]}},{"id":"10-01-018","c":"10","t":"10-01","n":"18","q":"張先生經營的租賃住宅服務業，為了符合規定，他應在營業處所的明顯處張貼哪些文件？","o":["登記證、會員證書、租賃住宅管理人員證書、代管費用收取基準及方式","代管費用收取基準及方式、租賃住宅標的現況確認書、租賃契約書、登記證","租賃住宅管理人員證書、租賃住宅標的現況確認書、租金收據、退還租金證明","登記證、租賃契約書、屋況點交證明文件、租金收據"],"a":"A","ty":"gen","e":{"s":"ok","x":"條例第33條第1項：營業處所明顯之處及網站應揭示登記證、同業公會會員證書、租賃住宅管理人員證書、代管費用收取基準及方式，故選(A)。","b":[{"k":"law","l":"租賃住宅市場發展及管理條例","r":"條例第33條第1項","q":"租賃住宅服務業應於營業處所明顯之處及其網站，揭示下列文件資訊：","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060125"},{"k":"law","l":"租賃住宅市場發展及管理條例","r":"條例第33條第1項第1款","q":"一、登記證。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060125"},{"k":"law","l":"租賃住宅市場發展及管理條例","r":"條例第33條第1項第2款","q":"二、同業公會會員證書。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060125"},{"k":"law","l":"租賃住宅市場發展及管理條例","r":"條例第33條第1項第3款","q":"三、租賃住宅管理人員證書。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060125"},{"k":"law","l":"租賃住宅市場發展及管理條例","r":"條例第33條第1項第4款","q":"四、代管費用收取基準及方式。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060125"}]}},{"id":"10-01-019","c":"10","t":"10-01","n":"19","q":"某租賃住宅服務業被主管機關要求提供受託管理的租賃住宅資訊，該業者可以怎麼做？","o":["拒絕提供，因為涉及公司商業機密","只提供部分資訊，隱藏租金數據","提供相關資訊，並不得規避、妨礙或拒絕","拒絕提供，並向法院申請停止調查"],"a":"C","ty":"gen","e":{"s":"ok","x":"條例第34條第1項：租賃住宅服務業應將受託管理、承租或轉租租賃住宅之相關資訊提供主管機關；第35條：主管機關檢查其業務時，不得規避、妨礙或拒絕，故選(C)。","b":[{"k":"law","l":"租賃住宅市場發展及管理條例","r":"條例第34條第1項","q":"租賃住宅服務業應於訂定契約之日起三十日內，將其受託管理、承租或轉租租賃住宅之相關資訊，提供直轄市、縣（市）主管機關。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060125"},{"k":"law","l":"租賃住宅市場發展及管理條例","r":"條例第35條","q":"主管機關檢查租賃住宅服務業之業務，租賃住宅服務業不得規避、妨礙或拒絕。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060125"}]}},{"id":"10-01-020","c":"10","t":"10-01","n":"20","q":"租賃住宅服務業者若要開始營業，應在完成公司登記後多久內繳存營業保證金並申請租賃住宅服務業登記？","o":["3個月內","6個月內","9個月內","12個月內"],"a":"B","ty":"num","e":{"s":"ok","x":"條例第19條第2項：租賃住宅服務業應於完成公司登記後六個月內繳存營業保證金、置租賃住宅管理人員及加入同業公會，申請租賃住宅服務業登記並領得登記證後始得營業，故選(B)。","b":[{"k":"law","l":"租賃住宅市場發展及管理條例","r":"條例第19條第2項","q":"租賃住宅服務業應於完成公司登記後六個月內繳存營業保證金、置租賃住宅管理人員及加入登記所在地之同業公會","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060125"}]}},{"id":"10-01-021","c":"10","t":"10-01","n":"21","q":"關於租賃住宅管理人員的僱用規定，下列何者正確？","o":["租賃住宅服務業應至少僱用一名專任租賃住宅管理人員","同一名租賃住宅管理人員可以同時受僱於兩家以上租賃住宅服務業","只有包租業才需要僱用租賃住宅管理人員，代管業則不需要","取得租賃住宅管理人員資格後，即可永久擔任該職位，無須換證"],"a":"A","ty":"gen","ns":1,"e":{"s":"ok","x":"條例第25條第2項：租賃住宅服務業應置專任租賃住宅管理人員至少一人；第3項：專任人員不得同時受僱於二家以上（B錯）；第26條第2項：證書有效期限四年須換證（D錯），故選(A)。","b":[{"k":"law","l":"租賃住宅市場發展及管理條例","r":"條例第25條第2項","q":"租賃住宅服務業應置專任租賃住宅管理人員至少一人","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060125"},{"k":"law","l":"租賃住宅市場發展及管理條例","r":"條例第25條第3項","q":"前項專任租賃住宅管理人員，不得同時受僱於二家以上租賃住宅服務業。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060125"},{"k":"law","l":"租賃住宅市場發展及管理條例","r":"條例第26條第2項","q":"前項證書有效期限為四年","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060125"}]}},{"id":"10-01-022","c":"10","t":"10-01","n":"22","q":"代管業在執行租賃住宅管理業務時，應符合下列哪項規定？","o":["可在未與委託人簽訂契約的情況下開始管理租賃住宅","可將管理業務轉委託給其他代管業執行","須與委託人簽訂委託管理租賃住宅契約後，才可執行業務","可在未與委託人簽訂契約的情況下開始刊登出租資訊"],"a":"C","ty":"gen","e":{"s":"ok","x":"條例第28條第1項：代管業應與委託人簽訂委託管理租賃住宅契約書後，始得執行租賃住宅管理業務；第2項：不得委託他代管業執行（B錯），故選(C)。","b":[{"k":"law","l":"租賃住宅市場發展及管理條例","r":"條例第28條第1項","q":"代管業應與委託人簽訂委託管理租賃住宅契約書後，始得執行租賃住宅管理業務。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060125"},{"k":"law","l":"租賃住宅市場發展及管理條例","r":"條例第28條第2項","q":"前項代管業不得委託他代管業執行租賃住宅管理業務。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060125"}]}},{"id":"10-01-023","c":"10","t":"10-01","n":"23","q":"包租業與次承租人簽訂租賃契約書時，應提供下列文件？","o":["住宅租賃標的現況確認書","房屋稅單","出租人同意出租之書面文件","出租人收入證明"],"a":"A","ty":"gen","e":{"s":"ok","x":"條例第29條第2項：包租業與次承租人簽訂租賃契約書時，應提供住宅租賃標的現況確認書及經出租人同意「轉租」之書面文件，故選(A)。","b":[{"k":"law","l":"租賃住宅市場發展及管理條例","r":"條例第29條第2項","q":"包租業與次承租人簽訂租賃契約書時，應提供住宅租賃標的現況確認書及前項經出租人同意轉租之書面文件","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060125"}]}},{"id":"10-01-024","c":"10","t":"10-01","n":"24","q":"承租人與出租人發生租賃爭議時，應如何處理？","o":["必須先提起民事訴訟","可向直轄市或縣（市）政府申請調處，且免繳調處費用","只能透過仲裁程序解決，無法向政府單位申請調處","承租人只能自行解決，不得尋求第三方協助"],"a":"B","ty":"gen","e":{"s":"ok","x":"條例第16條：住宅租賃爭議，出租人或承租人得向直轄市或縣（市）政府申請調處，並免繳調處費用，故選(B)。","b":[{"k":"law","l":"租賃住宅市場發展及管理條例","r":"條例第16條","q":"住宅租賃爭議，出租人或承租人得向直轄市或縣（市）政府申請調處，並免繳調處費用。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060125"}]}},{"id":"10-01-025","c":"10","t":"10-01","n":"25","q":"小李想要經營租賃住宅服務業，但他曾因經濟困難而被法院依《消費者債務清理條例》裁定開始清算程序，目前尚未復權。根據《租賃住宅市場發展及管理條例》第20條，小李是否可以擔任租賃住宅服務業的負責人？","o":["可以，因為清算程序不影響負責人資格","可以，只要經主管機關特別許可","不可以，因為尚未復權","不可以，除非已經開始執行租賃業務"],"a":"C","ty":"gen","e":{"s":"ok","x":"條例第20條第1項第3款：經法院依消費者債務清理條例裁定開始清算程序，尚未復權者，不得充任租賃住宅服務業之負責人，故選(C)。","b":[{"k":"law","l":"租賃住宅市場發展及管理條例","r":"條例第20條第1項","q":"有下列情形之一者，不得充任租賃住宅服務業之負責人","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060125"},{"k":"law","l":"租賃住宅市場發展及管理條例","r":"條例第20條第1項第3款","q":"三、經法院依消費者債務清理條例裁定開始清算程序，尚未復權。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060125"}]}},{"id":"10-01-026","c":"10","t":"10-01","n":"26","q":"租賃住宅服務業應指派專任租賃住宅管理人員簽章的文件，包括以下哪一項？","o":["屋況與附屬設備點交證明文件","租金補貼申請文件","房屋稅完稅證明","租金之實價登錄分析文件"],"a":"A","ty":"gen","e":{"s":"ok","x":"條例第32條第4款：屋況與附屬設備點交證明文件應由租賃住宅服務業指派專任租賃住宅管理人員簽章，故選(A)。","b":[{"k":"law","l":"租賃住宅市場發展及管理條例","r":"條例第32條","q":"下列文件應由租賃住宅服務業指派專任租賃住宅管理人員簽章：","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060125"},{"k":"law","l":"租賃住宅市場發展及管理條例","r":"條例第32條第4款","q":"四、屋況與附屬設備點交證明文件。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060125"}]}},{"id":"10-01-027","c":"10","t":"10-01","n":"27","q":"小張是一名租賃住宅管理人員，負責協助房東與房客簽訂租賃契約。在處理租賃糾紛時，小張發現房東希望透過合約中的某些條款來規避法律責任，而房客則因缺乏法律知識未察覺其中問題。此時，小張應如何處理，才能符合《租賃住宅服務業倫理規範》的要求？","o":["直接順從房東的要求，因為房東是主要委託人","主動協助房客修改不合理條款，完全站在房客立場處理","公正處理，確保租賃雙方的權益，並提供專業建議","讓房東與房客自行協商，不介入糾紛"],"a":"C","ty":"case","e":{"s":"ok","x":"倫理規範第8條要求以當事人最佳利益為優先，條例第3條第12款之服務當事人包括委託人及承租人；第17條、第18條要求傳遞明確、合法之租賃條款並確保契約遵循法律標準。面對規避法律責任之條款，應公正處理並提供專業建議，故選(C)。","b":[{"k":"law","l":"租賃住宅服務業倫理規範（中華民國租賃住宅服務商業同業公會全國聯合會）","r":"倫理規範第8條","q":"任何時候均以當事人最佳利益為優先考量。","u":"https://rentalh.org.tw/public/upimgs/%E7%A7%9F%E8%B3%83%E4%BD%8F%E5%AE%85%E6%9C%8D%E5%8B%99%E6%A5%AD%E5%80%AB%E7%90%86%E8%A6%8F%E7%AF%84.pdf"},{"k":"law","l":"租賃住宅市場發展及管理條例","r":"條例第3條第12款","q":"十二、租賃住宅服務當事人：指代管業服務之委託人及承租人，或包租業服務之出租人及次承租人。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060125"},{"k":"law","l":"租賃住宅服務業倫理規範（中華民國租賃住宅服務商業同業公會全國聯合會）","r":"倫理規範第17條","q":"租賃住宅管理人員及從業人員應傳遞當事人明確、合法之租賃條款和透明之管理費用","u":"https://rentalh.org.tw/public/upimgs/%E7%A7%9F%E8%B3%83%E4%BD%8F%E5%AE%85%E6%9C%8D%E5%8B%99%E6%A5%AD%E5%80%AB%E7%90%86%E8%A6%8F%E7%AF%84.pdf"},{"k":"law","l":"租賃住宅服務業倫理規範（中華民國租賃住宅服務商業同業公會全國聯合會）","r":"倫理規範第18條","q":"確保租賃契約和交易方式均遵循相關法律標準。","u":"https://rentalh.org.tw/public/upimgs/%E7%A7%9F%E8%B3%83%E4%BD%8F%E5%AE%85%E6%9C%8D%E5%8B%99%E6%A5%AD%E5%80%AB%E7%90%86%E8%A6%8F%E7%AF%84.pdf"}]}},{"id":"10-01-028","c":"10","t":"10-01","n":"28","q":"某租賃服務公司A的業務員小王發現競爭對手B公司近期業績很好，為了打擊對手，他故意散播B公司的負面消息，並在社群媒體上匿名發布指控B公司涉嫌違規的訊息。請問小王的行為違反了哪項規範？","o":["合理競爭，因為市場競爭本來就很激烈","違反公平競爭原則，因為故意散播不實訊息損害他人商譽","只要沒有直接誹謗，就不算違規","屬於正常的商業行為，沒有違反相關規範"],"a":"B","ty":"gen","e":{"s":"ok","x":"倫理規範第12條第1款：不得以毀損他人名譽或信用為目的，陳述、散布其他租服業所涉爭議事件，利用第三人為之者亦同；公平交易法第24條亦禁止散布損害他人營業信譽之不實情事，故選(B)。","b":[{"k":"law","l":"租賃住宅服務業倫理規範（中華民國租賃住宅服務商業同業公會全國聯合會）","r":"倫理規範第12條第1款","q":"以毀損他人之名譽或信用為目的，陳述、散布其他租服業所涉爭議事件。利用第三人為之者，亦同。","u":"https://rentalh.org.tw/public/upimgs/%E7%A7%9F%E8%B3%83%E4%BD%8F%E5%AE%85%E6%9C%8D%E5%8B%99%E6%A5%AD%E5%80%AB%E7%90%86%E8%A6%8F%E7%AF%84.pdf"},{"k":"law","l":"公平交易法","r":"公平交易法第24條","q":"事業不得為競爭之目的，而陳述或散布足以損害他人營業信譽之不實情事。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=J0150002"}]}},{"id":"10-01-029","c":"10","t":"10-01","n":"29","q":"租賃住宅管理人員小張受雇於X公司，近日在與客戶洽談時，為了增加成交機會，他謊稱自己是來自知名租賃公司Y，並展示一張非正式的識別證明。這樣的行為是否符合《租賃住宅服務業倫理規範》的規範？","o":["不符合規定，從業人員應明確出示所屬公司之證明，不得冒用他人名義","只要客戶不追究，這樣的行為沒有問題","為了促成交易，這樣的做法是可接受的","這只是銷售手法的一種，不影響實際服務品質"],"a":"A","ty":"gen","e":{"s":"ok","x":"倫理規範第23條：執行業務時須明確出示所屬公司之相關證明，不得冒用第三人名義欺瞞當事人，故選(A)。","b":[{"k":"law","l":"租賃住宅服務業倫理規範（中華民國租賃住宅服務商業同業公會全國聯合會）","r":"倫理規範第23條","q":"租賃住宅管理人員及從業人員於執行業務同時，須明確出示所屬公司之相關證明，不得冒用第三人名義欺瞞當事人。","u":"https://rentalh.org.tw/public/upimgs/%E7%A7%9F%E8%B3%83%E4%BD%8F%E5%AE%85%E6%9C%8D%E5%8B%99%E6%A5%AD%E5%80%AB%E7%90%86%E8%A6%8F%E7%AF%84.pdf"}]}},{"id":"10-01-030","c":"10","t":"10-01","n":"30","q":"小美是一名租賃業務員，負責管理房東與房客的個人資料。某天，她接到一家裝修公司的請求，希望獲取租客的聯絡方式，以便提供裝修優惠方案。小美應如何處理，才符合租賃住宅服務業的倫理規範？","o":["只要裝修公司提供合作計畫，小美就可以分享資料","事先徵求租客同意後，才能提供其個人資料給第三方","只提供部分資料，例如租客的姓名與聯絡方式，不算違規","直接提供租客資料，因為這對租客有潛在好處"],"a":"B","ty":"case","e":{"s":"ok","x":"個資法第20條第1項：非公務機關利用個資應於蒐集之特定目的必要範圍內為之，特定目的外利用須符合但書情形（如經當事人同意）；倫理規範第7條亦要求遵守個資法。提供租客聯絡方式予裝修公司行銷，應事先取得租客同意，故選(B)。","b":[{"k":"law","l":"個人資料保護法","r":"個資法第20條第1項","q":"非公務機關對個人資料之利用，除第六條第一項所規定資料外，應於蒐集之特定目的必要範圍內為之。但有下列情形之一者，得為特定目的外之利用：","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?PCode=I0050021"},{"k":"law","l":"個人資料保護法","r":"個資法第20條第1項第6款","q":"六、經當事人同意。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?PCode=I0050021"},{"k":"law","l":"租賃住宅服務業倫理規範（中華民國租賃住宅服務商業同業公會全國聯合會）","r":"倫理規範第7條第1項","q":"租服業應遵守消費者保護法、個人資料保護法等法令，保護當事人權益及隱私","u":"https://rentalh.org.tw/public/upimgs/%E7%A7%9F%E8%B3%83%E4%BD%8F%E5%AE%85%E6%9C%8D%E5%8B%99%E6%A5%AD%E5%80%AB%E7%90%86%E8%A6%8F%E7%AF%84.pdf"}]}},{"id":"10-01-031","c":"10","t":"10-01","n":"31","q":"王先生是一名租賃住宅管理人員，負責管理房東與房客的租賃契約。某日，房東希望將原先租金從18,000元提高到20,000元，並請王先生修改合約內容。但房客不同意，王先生卻仍私自修改租賃契約，並要求房客依照新的租金支付。請問，王先生的行為是否適當？","o":["不適當，租賃契約內容須雙方同意，不可私自更改","適當，租賃管理人員可根據市場變動調整租金","視情況而定，若市場價格上漲，租金應跟著調整","只要房東要求，租賃管理人員有權修改契約內容"],"a":"A","ty":"case","e":{"s":"ok","x":"民法第153條第1項：當事人互相表示意思一致，契約始成立，變更契約內容亦須雙方合意；倫理規範第20條：從業人員應嚴格遵循契約條款，不隨意更改或違背協議。房客不同意仍私自修改租金，不適當，故選(A)。","b":[{"k":"law","l":"民法","r":"民法第153條第1項","q":"當事人互相表示意思一致者，無論其為明示或默示，契約即為成立。","u":"https://mojlaw.moj.gov.tw/LawContent.aspx?LSID=FL001351"},{"k":"law","l":"租賃住宅服務業倫理規範（中華民國租賃住宅服務商業同業公會全國聯合會）","r":"倫理規範第20條","q":"租賃住宅管理人員及從業人員應嚴格遵循租賃契約之條款和約定，不隨意更改或違背協議。","u":"https://rentalh.org.tw/public/upimgs/%E7%A7%9F%E8%B3%83%E4%BD%8F%E5%AE%85%E6%9C%8D%E5%8B%99%E6%A5%AD%E5%80%AB%E7%90%86%E8%A6%8F%E7%AF%84.pdf"}]}},{"id":"10-01-032","c":"10","t":"10-01","n":"32","q":"某甲開設房屋仲介行銷公司，對於租賃事宜有多年經驗，今受大樓社區住戶鄰居委託，代為管理其出租住宅及收取租賃之租金、押金、相關費用，此種行為樣態係屬？","o":["代表房東管理之性質","代理房東管理之性質","二房東包租管理之性質","房仲管理之性質"],"a":"B","ty":"case","e":{"s":"ok","x":"條例第3條第4款、第6款：受出租人之委託經營收租與押金管理等租賃住宅管理業務者為代管業務，即受託代理房東管理之性質；包租係承租並轉租（第5款），與本題不同，故選(B)。","b":[{"k":"law","l":"租賃住宅市場發展及管理條例","r":"條例第3條第4款","q":"四、租賃住宅代管業（以下簡稱代管業）：指受出租人之委託，經營租賃住宅管理業務（以下簡稱代管業務）之公司。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060125"},{"k":"law","l":"租賃住宅市場發展及管理條例","r":"條例第3條第6款","q":"六、租賃住宅管理業務：指租賃住宅之屋況與設備點交、收租與押金管理、日常修繕維護、糾紛協調處理及其他與租賃住宅管理有關之事項。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060125"}],"nt":"仲介公司經營代管業務須依條例第19條申請租賃住宅服務業登記，否則依第36條處罰。"}},{"id":"10-01-033","c":"10","t":"10-01","n":"33","q":"阿翰是一位資深的租賃住宅管理人員，在「A公司」服務多年，與許多房東和房客都建立了不錯的關係。最近，他的朋友開設了一家新的租賃住宅服務公司「B公司」，並承諾給予更高的獎金。阿翰為了賺取更高的佣金，便開始向他管理的房客和房東暗示：「A公司最近的服務品質下滑了，我有很多朋友都轉到『B公司』，那邊的服務比較到位，要不要我幫你們介紹過去？現在轉換還有優惠喔！」上述阿翰的行為，可能違反了下列哪一項從業人員的規定？","o":["未依規定揭露租賃住宅的相關資訊。","未在規定時限內提供租賃契約給當事人審閱。","惡意驅使當事人轉換至其他租賃住宅服務業，損害當事人權益。","未經當事人同意，洩露其個人資料。"],"a":"C","ty":"case","e":{"s":"ok","x":"倫理規範第24條：租賃住宅管理人員及從業人員不得惡意驅使當事人轉換其他租服業，損害當事人之權益；阿翰為賺取獎金貶損原公司並引導客戶轉至B公司即屬之，故選(C)。","b":[{"k":"law","l":"租賃住宅服務業倫理規範（中華民國租賃住宅服務商業同業公會全國聯合會）","r":"倫理規範第24條","q":"租賃住宅管理人員及從業人員不得惡意驅使當事人轉換其他租服業，損害當事人之權益。","u":"https://rentalh.org.tw/public/upimgs/%E7%A7%9F%E8%B3%83%E4%BD%8F%E5%AE%85%E6%9C%8D%E5%8B%99%E6%A5%AD%E5%80%AB%E7%90%86%E8%A6%8F%E7%AF%84.pdf"}]}},{"id":"10-01-034","c":"10","t":"10-01","n":"34","q":"林小姐想成立租賃住宅服務公司，她在準備申請文件時需要確定自己的經營模式。諮詢政府單位後，她了解到租賃住宅服務業專業職能可以分為哪兩種類型？","o":["代管業與仲介業","包租業與代銷業","代管業與包租業","經紀業與租賃業"],"a":"C","ty":"gen","e":{"s":"ok","x":"條例第3條第3款：租賃住宅服務業指租賃住宅代管業及租賃住宅包租業，故選(C)。","b":[{"k":"law","l":"租賃住宅市場發展及管理條例","r":"條例第3條第3款","q":"三、租賃住宅服務業：指租賃住宅代管業及租賃住宅包租業。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060125"}]}},{"id":"10-01-035","c":"10","t":"10-01","n":"35","q":"小明是一位新進的租賃住宅管理人員，第一次與房東洽談代管業務。根據規定，他應該採取什麼行動？","o":["先與房東建立信任關係，之後再找機會出示證明。","口頭告知房東自己的姓名及公司名稱。","主動向房東出示所屬公司的相關證明文件。","只提供名片給房東，名片上印有公司名稱。"],"a":"C","ty":"case","e":{"s":"ok","x":"倫理規範第23條：租賃住宅管理人員於執行業務同時，須明確出示所屬公司之相關證明，故應主動向房東出示，故選(C)。","b":[{"k":"law","l":"租賃住宅服務業倫理規範（中華民國租賃住宅服務商業同業公會全國聯合會）","r":"倫理規範第23條","q":"租賃住宅管理人員及從業人員於執行業務同時，須明確出示所屬公司之相關證明","u":"https://rentalh.org.tw/public/upimgs/%E7%A7%9F%E8%B3%83%E4%BD%8F%E5%AE%85%E6%9C%8D%E5%8B%99%E6%A5%AD%E5%80%AB%E7%90%86%E8%A6%8F%E7%AF%84.pdf"}]}},{"id":"10-01-036","c":"10","t":"10-01","n":"36","q":"張先生是一名租賃住宅管理人員，他去年取得專業證書後開始執業。當他在整理公司文件時，注意到自己的證書有效期限及換證規定，請問下列敘述何者正確？","o":["有效期限為2年，期滿前3個月內應辦理換證","有效期限為3年，期滿前6個月內應辦理換證","有效期限為4年，期滿前3個月內應辦理換證","有效期限為4年，期滿前6個月內應辦理換證"],"a":"D","ty":"num","e":{"s":"ok","x":"條例第26條第2項：租賃住宅管理人員證書有效期限為四年，期滿前六個月內應檢附換證訓練合格證明重新辦理登錄及換證，故選(D)。","b":[{"k":"law","l":"租賃住宅市場發展及管理條例","r":"條例第26條第2項","q":"前項證書有效期限為四年，期滿前六個月內，租賃住宅管理人員應檢附其於最近二年內參加全國聯合會舉辦換證訓練並測驗合格之證明文件，向中央主管機關或其指定之機關（構）、團體、學校重新辦理登錄及換證。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060125"}]}},{"id":"10-01-037","c":"10","t":"10-01","n":"37","q":"趙先生擁有5戶出租住宅，自「租賃住宅市場發展及管理條例」實施後，他擔心自己需要額外申請證照或成立公司才能繼續出租。關於實施後的個人房東，下列敘述何者正確？","o":["個人房東自行經營自有房屋出租管理，違反租賃住宅市場發展及管理條例規範","個人房東自行經營自有房屋出租管理，並無違反租賃住宅市場發展及管理條例規範","個人房東必須取得租賃住宅管理人員證書才能出租自有房屋","個人房東必須成立租賃住宅服務業才能出租自有房屋"],"a":"B","ty":"case","e":{"s":"ok","x":"條例第3條第4、5款之代管業、包租業係受出租人委託或承租轉租而經營租賃住宅管理業務之公司；第19條第1項之許可及第36條之處罰對象為經營代管或包租業務者。個人房東自行管理自有住宅出租，非屬代管或包租業務，無違反條例，故選(B)。","b":[{"k":"law","l":"租賃住宅市場發展及管理條例","r":"條例第3條第4款","q":"四、租賃住宅代管業（以下簡稱代管業）：指受出租人之委託，經營租賃住宅管理業務（以下簡稱代管業務）之公司。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060125"},{"k":"law","l":"租賃住宅市場發展及管理條例","r":"條例第19條第1項","q":"經營租賃住宅服務業者，應向直轄市、縣（市）主管機關申請許可","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060125"},{"k":"law","l":"租賃住宅市場發展及管理條例","r":"條例第36條","q":"非租賃住宅服務業而經營代管業務或包租業務者，由直轄市、縣（市）主管機關禁止其營業","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060125"}]}},{"id":"10-01-038","c":"10","t":"10-01","n":"38","q":"小李是租賃住宅服務業者的一員，最近接到一位承租人的投訴，表示自己在網路上看到的租屋廣告與實際狀況不符，包含屋齡、樓層與面積的資訊都有誤。他詢問主管，這樣的情況是否有法律責任？","o":["若承租人因信賴該廣告受損，出租人應獨自承擔賠償責任，與刊登媒體無關。","若媒體業者明知廣告內容不實，則須與出租人共同承擔連帶賠償責任。","廣告主若為租賃住宅服務業者，則無需在廣告中註明業者名稱。","只要出租人與承租人達成協議，出租人可以事先約定免除損害賠償責任。"],"a":"B","ty":"neg","e":{"s":"ok","x":"條例第13條第2項：受託刊登廣告之媒體經營者明知或可得而知廣告之面積、屋齡、樓層別及法定用途與事實不符者，就承租人因信賴廣告所受損害與出租人負連帶賠償責任，且不得預先約定限制或拋棄（D錯）；第4項廣告主為租服業者應註明名稱（C錯），故選(B)。","b":[{"k":"law","l":"租賃住宅市場發展及管理條例","r":"條例第13條第2項","q":"受託刊登租賃住宅廣告之媒體經營者明知或可得而知廣告之租賃住宅面積、屋齡、樓層別及法定用途與事實不符者，就承租人因信賴該廣告所受之損害與出租人負連帶賠償責任；其損害賠償責任，不得預先約定限制或拋棄。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060125"},{"k":"law","l":"租賃住宅市場發展及管理條例","r":"條例第13條第4項","q":"第一項及第二項廣告主為租賃住宅服務業者，應註明租賃住宅服務業者名稱。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060125"}]}},{"id":"10-01-039","c":"10","t":"10-01","n":"39","q":"阿明未申請租賃住宅服務業登記，私下經營代管與包租業務，結果遭租客檢舉。主管機關調查後，確認阿明違法經營，準備開罰並要求停業。依《租賃住宅市場發展及管理條例》主管機關可如何處罰？","o":["禁止營業，處4萬至20萬元罰鍰，限期改正，否則按次處罰，情節重大可勒令歇業。","直接沒收所有租賃所得，並追溯五年內的交易紀錄。","若已簽約，契約仍有效，主管機關不得介入。","願意補辦登記者，可免除罰鍰並繼續經營。"],"a":"A","ty":"case","e":{"s":"ok","x":"條例第36條：非租賃住宅服務業而經營代管或包租業務者，由主管機關禁止其營業，處新臺幣四萬元以上二十萬元以下罰鍰並限期改正，屆期未改正按次處罰，情節重大得勒令歇業，故選(A)。","b":[{"k":"law","l":"租賃住宅市場發展及管理條例","r":"條例第36條","q"
