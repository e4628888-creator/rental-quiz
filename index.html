A)。","b":[{"k":"law","l":"住宅包租契約應約定及不得約定事項（內政部）","r":"應約定事項第七點第1項","q":"本租賃住宅係供轉租作居住使用，包租業不得變更用途。","u":"https://la.hl.gov.tw/Upload/202406211536262510621.pdf"},{"k":"law","l":"住宅包租契約應約定及不得約定事項（內政部）","r":"應約定事項第五點(二)(三)","m":"水費、電費均得勾選「由出租人負擔」「由包租業負擔」或其他。","u":"https://la.hl.gov.tw/Upload/202406211536262510621.pdf"},{"k":"law","l":"住宅包租契約應約定及不得約定事項（內政部）","r":"應約定事項第六點第2項","m":"租賃雙方同意辦理公證者，公證費及公證代辦費得約定由出租人、包租業或雙方平均負擔。","u":"https://la.hl.gov.tw/Upload/202406211536262510621.pdf"}]}},{"id":"05-01-008","c":"05","t":"05-01","n":"08","q":"住宅包租契約應約定及不得約定事項中，關於「租賃期間」規定至少需幾日以上？","o":["30日","20日","10日","5日"],"a":"A","ty":"neg","e":{"s":"ok","x":"住宅包租契約應約定事項第二點：租賃期間「不得少於三十日」，故選(A)。","b":[{"k":"law","l":"住宅包租契約應約定及不得約定事項（內政部）","r":"應約定事項第二點","q":"租賃期間自民國 年 月 日起至民國 年 月 日止。(租賃期間不得少於三十日)","u":"https://la.hl.gov.tw/Upload/202406211536262510621.pdf"}]}},{"id":"05-01-009","c":"05","t":"05-01","n":"09","q":"住宅包租契約應約定事項規定中，下列哪一項費用是不得約定由包租業負擔？","o":["租賃期間之社區管理費","租賃期間之房屋稅","租賃期間之水電費","公證費"],"a":"B","ty":"neg","e":{"s":"ok","x":"住宅包租契約應約定事項第六點第1項第1款：「租賃住宅之房屋稅、地價稅，由出租人負擔。」至於管理費、水電費（第五點）及公證費（第六點第2項）均得約定由包租業負擔，故選(B)。","b":[{"k":"law","l":"住宅包租契約應約定及不得約定事項（內政部）","r":"應約定事項第六點第1項第1款","q":"(一)租賃住宅之房屋稅、地價稅，由出租人負擔。","u":"https://la.hl.gov.tw/Upload/202406211536262510621.pdf"},{"k":"law","l":"住宅包租契約應約定及不得約定事項（內政部）","r":"應約定事項第五點(一)至(三)","m":"管理費、水費、電費均得勾選「由出租人負擔」或「由包租業負擔」。","u":"https://la.hl.gov.tw/Upload/202406211536262510621.pdf"},{"k":"law","l":"住宅包租契約應約定及不得約定事項（內政部）","r":"應約定事項第六點第2項","m":"公證費、公證代辦費得約定由出租人、包租業或租賃雙方平均負擔。","u":"https://la.hl.gov.tw/Upload/202406211536262510621.pdf"}]}},{"id":"05-01-010","c":"05","t":"05-01","n":"10","q":"下列何種屬包租業租賃住宅管理人員的正確行為？","o":["要出租的房子還沒裝潢好，可以先用其他間的照片作為廣告使用","租賃契約沒有連帶保證人可以自行填載房客法定代理人的姓名年籍上去","租約到期後，房客一直不搬走，可以會同里長和警察強行開門","租約屆滿30天前，提早提醒房客是否要續約"],"a":"D","ty":"gen","e":{"s":"ok","x":"簡報（實2-1）頁19提醒「應注意租屋期限，進行定期換約」，以免租約到期忘記換約而變成不定期租賃，故於租約屆滿前提醒房客是否續約屬正確作為；(A)違反租賃條例第13條廣告內容應與事實相符（簡報法5-1頁9）；(B)擅自填載他人姓名年籍，涉及刑法第210條偽造私文書；(C)擅自進入、強制排除房客可能構成刑法強制罪（簡報法5-5頁178），應循法院強制執行等程序處理，故選(D)。","b":[{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－租賃管理與糾紛實務（實2-1～實2-2）","r":"頁碼19（PDF第20頁）","q":"應注意租屋期限，進行定期換約。許多房東忽略此點，在房屋租約到期時忘記與房客換約，導致契約變成不定期租賃契約。"},{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－租賃住宅相關法規與實務（法5-1～法5-5）","r":"頁碼9（PDF第10頁）","q":"出租人提供之租賃住宅廣告內容應與事實相符。"},{"k":"law","l":"中華民國刑法","r":"第210條","q":"偽造、變造私文書，足以生損害於公眾或他人者，處五年以下有期徒刑。","u":"https://mojlaw.moj.gov.tw/LawContent.aspx?LSID=FL001424&lawNumber=210&TypeSort=2"},{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－租賃住宅相關法規與實務（法5-1～法5-5）","r":"頁碼178（PDF第179頁）","q":"房東擅自進入房客房間清空物品，為了避免房客再行進入，於是便將門鎖更換，此舉妨害房客行使租賃之權利，同樣會構成刑法上的強制罪。"},{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－租賃管理與糾紛實務（實2-1～實2-2）","r":"頁碼20（PDF第21頁）","q":"公證的好處係代表此契約已被法院認可，一旦任何一方有違反公證強制執行條款之行為，即可向法院申請強制執行"}],"nt":"資料未規定須於租約屆滿「30天前」提醒，選項(D)之30天為情境描述；本題以其他三項明顯不當、(D)符合簡報「定期換約」之提醒為據。"}},{"id":"05-01-011","c":"05","t":"05-01","n":"11","q":"住宅包租契約應約定及不得約定事項中，關於「使用租賃住宅之限制」，下列敘述何者有誤？","o":["租賃標的僅供轉租作居住使用，包租業不得變更用途","包租業向出租人承租房屋之後，得改變使用用途","包租業轉租租賃標的或經出租人同意提供他人使用者，應督促承租人或使用人應遵循公寓大廈規約","出租人將房屋出租給包租業進行轉租行為，須提供轉租同意書給包租業"],"a":"B","ty":"neg","e":{"s":"ok","x":"住宅包租契約應約定事項第七點第1項：「本租賃住宅係供轉租作居住使用，包租業不得變更用途。」故(B)稱包租業承租後得改變使用用途有誤；(C)見同點第3項，(D)見第十點第1項第2款出租人應提供轉租同意書，故選(B)。","b":[{"k":"law","l":"住宅包租契約應約定及不得約定事項（內政部）","r":"應約定事項第七點第1項","q":"本租賃住宅係供轉租作居住使用，包租業不得變更用途。","u":"https://la.hl.gov.tw/Upload/202406211536262510621.pdf"},{"k":"law","l":"住宅包租契約應約定及不得約定事項（內政部）","r":"應約定事項第七點第3項","q":"包租業轉租本租賃住宅或經出租人同意提供他人使用者，應督促次承租人或使用人遵守公寓大廈規約或其他住戶應遵行事項","u":"https://la.hl.gov.tw/Upload/202406211536262510621.pdf"},{"k":"law","l":"住宅包租契約應約定及不得約定事項（內政部）","r":"應約定事項第十點第1項第2款","q":"(二)應於簽訂本契約時，提供同意本租賃標的之全部或一部轉租之同意書，並載明租賃標的範圍、租賃期間及得終止本契約之事由。","u":"https://la.hl.gov.tw/Upload/202406211536262510621.pdf"}]}},{"id":"05-01-012","c":"05","t":"05-01","n":"12","q":"住宅包租契約應約定及不得約定事項中，關於「修繕」的敘述下列何者有誤？","o":["租賃住宅或附屬設備損壞時，應由包租業負責修繕及費用","出租人為修繕租賃住宅所為之必要行為，包租業不得拒絕","租賃住宅之修繕費用，經約定由出租人負擔者，當出租人未履行義務，包租業得於租金中扣除","租賃住宅或附屬設備損壞時，修繕費用得視情形由出租人與包租業約定負擔方式"],"a":"A","ty":"neg","e":{"s":"ok","x":"住宅包租契約應約定事項第八點第1項：損壞時「應由包租業負責修繕，其修繕費用，得由租賃雙方視損壞性質及責任歸屬，另行約定負擔方式」，並非一律由包租業負擔費用，故(A)有誤；(C)見同點第2項，(D)見同點第1項；簡報（實2-1）頁8亦載「費用負擔另行約定」，故選(A)。","b":[{"k":"law","l":"住宅包租契約應約定及不得約定事項（內政部）","r":"應約定事項第八點第1項","q":"租賃住宅或附屬設備損壞時，應由包租業負責修繕，其修繕費用，得由租賃雙方視損壞性質及責任歸屬，另行約定負擔方式。","u":"https://la.hl.gov.tw/Upload/202406211536262510621.pdf"},{"k":"law","l":"住宅包租契約應約定及不得約定事項（內政部）","r":"應約定事項第八點第2項","q":"前項約定由出租人負擔修繕費用者，包租業得請求出租人償還其費用或於第三點約定之租金中扣除。","u":"https://la.hl.gov.tw/Upload/202406211536262510621.pdf"},{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－租賃管理與糾紛實務（實2-1～實2-2）","r":"頁碼8（PDF第9頁）","q":"屋況損壞應由包租業負責修繕，費用負擔另行約定。"}]}},{"id":"05-01-013","c":"05","t":"05-01","n":"13","q":"住宅包租應約定及不得約定事項中，下列何者不是簽署契約書時之必要附件？","o":["租賃標的現況確認書","出租人同意轉租範圍、租賃期間及終止租約事由確認書","包租契約委託管理書","出租人負擔修繕費用之項目及範圍確認書"],"a":"C","ty":"neg","e":{"s":"ok","x":"住宅包租契約應約定事項所附附件為附件一「租賃標的現況確認書」（第一點(二)3）、附件二「出租人同意轉租範圍、租賃期間及終止租約事由確認書」及附件三「出租人負擔修繕費用之項目及範圍確認書」（第十點第2項），並無「包租契約委託管理書」，故選(C)。","b":[{"k":"law","l":"住宅包租契約應約定及不得約定事項（內政部）","r":"應約定事項第十點第2項","q":"前項第二款、第四款之同意轉租及負擔修繕費用之項目、範圍，如附件二「出租人同意轉租範圍、租賃期間及終止租約事由確認書」及附件三「出租人負擔修繕費用之項目及範圍確認書」。","u":"https://la.hl.gov.tw/Upload/202406211536262510621.pdf"},{"k":"law","l":"住宅包租契約應約定及不得約定事項（內政部）","r":"應約定事項第一點(二)3","q":"□有□無附屬設備，若有，除另有附屬設備清單外，詳如後附租賃標的現況確認書（如附件一）。","u":"https://la.hl.gov.tw/Upload/202406211536262510621.pdf"}]}},{"id":"05-01-014","c":"05","t":"05-01","n":"14","q":"下列何者非屬住宅包租應約定及不得約定事項之「出租人之義務及責任」？","o":["出租人出示有權出租該租賃標的之身分證明文件","出租人得要求包租業提供篩選承租人入住標準","出租人應於簽約時提供同意本租賃標的轉租之同意書","出租人應於將合於居住狀態之租賃標的交付包租業，並於租賃期間保持其合於居住狀態"],"a":"B","ty":"neg","e":{"s":"ok","x":"住宅包租契約應約定事項第十點第1項所定出租人義務為：出示有權出租之證明文件及身分證明文件、簽約時提供轉租同意書、交付並於租期中保持合於居住使用之租賃住宅、說明由出租人負擔修繕費用之項目及範圍；並無「要求包租業提供篩選承租人入住標準」，故選(B)。","b":[{"k":"law","l":"住宅包租契約應約定及不得約定事項（內政部）","r":"應約定事項第十點第1項第1款","q":"(一)應出示有權出租本租賃住宅之證明文件及國民身分證或其他足資證明身分之文件，供包租業核對。","u":"https://la.hl.gov.tw/Upload/202406211536262510621.pdf"},{"k":"law","l":"住宅包租契約應約定及不得約定事項（內政部）","r":"應約定事項第十點第1項第2款","q":"(二)應於簽訂本契約時，提供同意本租賃標的之全部或一部轉租之同意書，並載明租賃標的範圍、租賃期間及得終止本契約之事由。","u":"https://la.hl.gov.tw/Upload/202406211536262510621.pdf"},{"k":"law","l":"住宅包租契約應約定及不得約定事項（內政部）","r":"應約定事項第十點第1項第3款","q":"(三)應以合於所約定居住使用之租賃住宅，交付包租業，並於租賃期間保持其合於居住使用之狀態。","u":"https://la.hl.gov.tw/Upload/202406211536262510621.pdf"}]}},{"id":"05-01-015","c":"05","t":"05-01","n":"15","q":"下列就住宅包租契約應約定及不得約定事項「包租業之義務及責任」之敘述，何者有誤？","o":["包租業應提供租賃住宅服務業登記證影本，供出租人核對","包租業與次承租人簽訂轉租契約時，不得逾出租人同意轉租之範圍與租賃期間","包租業應於簽訂轉租契約後30日內，將相關資料口頭告知出租人","包租業應執行日常修繕維護並製作紀錄，供出租人查詢或調閱"],"a":"C","ty":"neg","e":{"s":"ok","x":"住宅包租契約應約定事項第十一點第1項第4款：包租業應於簽訂轉租契約後三十日內「以書面」將轉租相關資料通知出租人，並非口頭告知，故(C)有誤；(A)(B)(D)分見同項第1、3、5款，故選(C)。","b":[{"k":"law","l":"住宅包租契約應約定及不得約定事項（內政部）","r":"應約定事項第十一點第1項第4款","q":"(四)應於簽訂轉租契約後三十日內，以書面將轉租標的範圍、租賃期間、次承租人之姓名及其通訊地址等相關資料通知出租人。","u":"https://la.hl.gov.tw/Upload/202406211536262510621.pdf"},{"k":"law","l":"住宅包租契約應約定及不得約定事項（內政部）","r":"應約定事項第十一點第1項第1款","q":"(一)應出示租賃住宅服務業登記證影本，供出租人核對。","u":"https://la.hl.gov.tw/Upload/202406211536262510621.pdf"},{"k":"law","l":"住宅包租契約應約定及不得約定事項（內政部）","r":"應約定事項第十一點第1項第3款","q":"(三)與次承租人簽訂轉租契約時，不得逾出租人同意轉租之標的範圍及租賃期間。","u":"https://la.hl.gov.tw/Upload/202406211536262510621.pdf"},{"k":"law","l":"住宅包租契約應約定及不得約定事項（內政部）","r":"應約定事項第十一點第1項第5款","q":"(五)應執行日常修繕維護並製作紀錄，提供出租人查詢或取閱。","u":"https://la.hl.gov.tw/Upload/202406211536262510621.pdf"}]}},{"id":"05-01-016","c":"05","t":"05-01","n":"16","q":"住宅包租契約應約定及不得約定事項規定，包租業簽訂轉租契約後，應於幾日內通知出租人？","o":["1日","5日","10日","30日"],"a":"D","ty":"neg","e":{"s":"ok","x":"住宅包租契約應約定事項第十一點第1項第4款：包租業應於簽訂轉租契約後「三十日內」，以書面將轉租標的範圍、租賃期間、次承租人姓名及通訊地址等通知出租人，故選(D)。","b":[{"k":"law","l":"住宅包租契約應約定及不得約定事項（內政部）","r":"應約定事項第十一點第1項第4款","q":"(四)應於簽訂轉租契約後三十日內，以書面將轉租標的範圍、租賃期間、次承租人之姓名及其通訊地址等相關資料通知出租人。","u":"https://la.hl.gov.tw/Upload/202406211536262510621.pdf"}]}},{"id":"05-01-017","c":"05","t":"05-01","n":"17","q":"住宅包租契約應約定及不得約定事項，下列何者非屬「包租業之義務及責任」？","o":["包租業應盡善良管理人責任","包租業應於收受出租人有關費用或文件時，開立統一發票或收據","包租業應負擔出租人房屋稅及地價稅","不得轉讓出租人同意轉租之權利及其管理業務"],"a":"C","ty":"neg","e":{"s":"ok","x":"住宅包租契約應約定事項第六點第1項第1款規定房屋稅、地價稅由出租人負擔，非包租業之義務；(A)(B)(D)分見第十一點第1項第2、6、8款，故選(C)。","b":[{"k":"law","l":"住宅包租契約應約定及不得約定事項（內政部）","r":"應約定事項第六點第1項第1款","q":"(一)租賃住宅之房屋稅、地價稅，由出租人負擔。","u":"https://la.hl.gov.tw/Upload/202406211536262510621.pdf"},{"k":"law","l":"住宅包租契約應約定及不得約定事項（內政部）","r":"應約定事項第十一點第1項第2款","q":"(二)應以善良管理人之注意，保管、使用、收益租賃住宅。","u":"https://la.hl.gov.tw/Upload/202406211536262510621.pdf"},{"k":"law","l":"住宅包租契約應約定及不得約定事項（內政部）","r":"應約定事項第十一點第1項第6款","q":"(六)應於收受出租人之有關費用或文件時，開立統一發票或掣給收據。","u":"https://la.hl.gov.tw/Upload/202406211536262510621.pdf"},{"k":"law","l":"住宅包租契約應約定及不得約定事項（內政部）","r":"應約定事項第十一點第1項第8款","q":"(八)不得轉讓出租人同意轉租權利及其管理業務。","u":"https://la.hl.gov.tw/Upload/202406211536262510621.pdf"}]}},{"id":"05-01-018","c":"05","t":"05-01","n":"18","q":"下列何者不是住宅包租契約應約定及不得約定事項中，關於租賃標的現況確認書應該確認的範圍？","o":["有無做過海砂屋檢測","有無做過輻射屋檢測","有無發生過兇殺案","有無他人在租屋處生病死亡"],"a":"D","ty":"neg","e":{"s":"ok","x":"住宅包租契約附件一租賃標的現況確認書第6、7項確認有無做過輻射屋檢測及混凝土中水溶性氯離子含量（海砂屋）檢測，第8項確認專有部分是否曾發生「兇殺、自殺、一氧化碳中毒或其他非自然死亡」之情事；他人因病死亡屬自然死亡，不在確認範圍，故選(D)。","b":[{"k":"law","l":"住宅包租契約應約定及不得約定事項（內政部）","r":"附件一租賃標的現況確認書第8項","q":"本租賃住宅（專有部分）是否曾發生兇殺、自殺、一氧化碳中毒或其他非自然死亡之情事：","u":"https://la.hl.gov.tw/Upload/202406211536262510621.pdf"},{"k":"law","l":"住宅包租契約應約定及不得約定事項（內政部）","r":"附件一租賃標的現況確認書第6項","q":"□有□無曾經做過輻射屋檢測？若有，請檢附檢測證明文件。","u":"https://la.hl.gov.tw/Upload/202406211536262510621.pdf"},{"k":"law","l":"住宅包租契約應約定及不得約定事項（內政部）","r":"附件一租賃標的現況確認書第7項","q":"□有□無曾經做過混凝土中水溶性氯離子含量檢測(例如海砂屋檢測事項)；若有檢測結果：_________。","u":"https://la.hl.gov.tw/Upload/202406211536262510621.pdf"}]}},{"id":"05-01-019","c":"05","t":"05-01","n":"19","q":"依住宅包租契約應約定及不得約定事項，租賃之一方得提前終止租約，但違約金數額不得超過相當於幾個月的月租金？","o":["2個月","1個月","3個月","不得約定違約金"],"a":"B","ty":"neg","e":{"s":"ok","x":"住宅包租契約應約定事項第十三點第2項：「一方未為先期通知而逕行終止租約者，應賠償他方最高不得超過一個月租金額之違約金。」簡報（實2-1）頁8亦同，故選(B)。","b":[{"k":"law","l":"住宅包租契約應約定及不得約定事項（內政部）","r":"應約定事項第十三點第2項","q":"依約定得終止租約者，租賃之一方應至少於終止前一個月通知他方。一方未為先期通知而逕行終止租約者，應賠償他方最高不得超過一個月租金額之違約金。","u":"https://la.hl.gov.tw/Upload/202406211536262510621.pdf"},{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－租賃管理與糾紛實務（實2-1～實2-2）","r":"頁碼8（PDF第9頁）","q":"如約定可以提前終止租約，但沒有提前通知，最高賠償金額不得超過1個月。"}]}},{"id":"05-01-020","c":"05","t":"05-01","n":"20","q":"下列有關住宅包租契約應約定及不得約定事項中，對於包租業義務的敘述，何者有誤？","o":["應出示租賃住宅服務業登記證影本，供出租人核對","應以善良管理人之注意，保管、使用、收益租賃住宅","應於簽訂本契約時，提供同意本租賃標的之全部或一部分轉租之同意書，並載明租賃標的範圍、租賃期間及得終止本契約之事由","應於簽訂轉租契約後30日內，以書面將轉租標的範圍、租賃期間、次承租人之姓名及其通訊住址等相關資料通知出租人"],"a":"C","ty":"neg","e":{"s":"ok","x":"「應於簽訂本契約時，提供同意本租賃標的之全部或一部轉租之同意書…」係住宅包租契約應約定事項第十點第1項第2款「出租人」之義務，非包租業義務，故(C)有誤；(A)(B)(D)分見第十一點第1項第1、2、4款，故選(C)。","b":[{"k":"law","l":"住宅包租契約應約定及不得約定事項（內政部）","r":"應約定事項第十點第1項第2款","q":"(二)應於簽訂本契約時，提供同意本租賃標的之全部或一部轉租之同意書，並載明租賃標的範圍、租賃期間及得終止本契約之事由。","u":"https://la.hl.gov.tw/Upload/202406211536262510621.pdf"},{"k":"law","l":"住宅包租契約應約定及不得約定事項（內政部）","r":"應約定事項第十一點第1項第1款","q":"(一)應出示租賃住宅服務業登記證影本，供出租人核對。","u":"https://la.hl.gov.tw/Upload/202406211536262510621.pdf"},{"k":"law","l":"住宅包租契約應約定及不得約定事項（內政部）","r":"應約定事項第十一點第1項第2款","q":"(二)應以善良管理人之注意，保管、使用、收益租賃住宅。","u":"https://la.hl.gov.tw/Upload/202406211536262510621.pdf"},{"k":"law","l":"住宅包租契約應約定及不得約定事項（內政部）","r":"應約定事項第十一點第1項第4款","q":"(四)應於簽訂轉租契約後三十日內，以書面將轉租標的範圍、租賃期間、次承租人之姓名及其通訊地址等相關資料通知出租人。","u":"https://la.hl.gov.tw/Upload/202406211536262510621.pdf"}]}},{"id":"05-01-021","c":"05","t":"05-01","n":"21","q":"下列有關住宅包租契約應約定及不得約定事項中，對於包租業義務的敘述，何者有誤？","o":["得轉讓出租人同意轉租權利及其管理業務","應於收受出租人之有關費用或文件時，開立統一發票或掣給收據","應配合出租人申請減徵稅捐需要，提供相關證明","應於出租人有因修繕之必要行為時，通知次承租人配合辦理"],"a":"A","ty":"neg","e":{"s":"ok","x":"住宅包租契約應約定事項第十一點第1項第8款：包租業「不得轉讓出租人同意轉租權利及其管理業務」，故(A)有誤；(B)(C)分見同項第6、7款，故選(A)。","b":[{"k":"law","l":"住宅包租契約應約定及不得約定事項（內政部）","r":"應約定事項第十一點第1項第8款","q":"(八)不得轉讓出租人同意轉租權利及其管理業務。","u":"https://la.hl.gov.tw/Upload/202406211536262510621.pdf"},{"k":"law","l":"住宅包租契約應約定及不得約定事項（內政部）","r":"應約定事項第十一點第1項第6款","q":"(六)應於收受出租人之有關費用或文件時，開立統一發票或掣給收據。","u":"https://la.hl.gov.tw/Upload/202406211536262510621.pdf"},{"k":"law","l":"住宅包租契約應約定及不得約定事項（內政部）","r":"應約定事項第十一點第1項第7款","q":"(七)應配合出租人申請減徵稅捐需要，提供相關證明。","u":"https://la.hl.gov.tw/Upload/202406211536262510621.pdf"}],"nt":"選項(D)之文字未見於包租契約應約定事項第十一點（該點僅8款）；惟本題問何者有誤，(A)與第8款明文相反。"}},{"id":"05-01-022","c":"05","t":"05-01","n":"22","q":"請問下列何者為租賃住宅包租業之定義？","o":["承租租賃住宅並轉租及經營該租賃住宅管理業務之公司","委託經營租賃管理業務之公司","從事不動產買賣、互易之居間業務之公司","受起造人或建築業之委託，負責企劃並代理銷售不動產之業務之公司"],"a":"A","ty":"gen","e":{"s":"ok","x":"簡報（法5-1）頁4引租賃條例第3條第5款：包租業「指承租租賃住宅並轉租，及經營該租賃住宅管理業務（以下簡稱包租業務）之公司」；(B)為第4款代管業之定義，故選(A)。","b":[{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－租賃住宅相關法規與實務（法5-1～法5-5）","r":"頁碼4（PDF第5頁）","q":"五、租賃住宅包租業（以下簡稱包租業）：指承租租賃住宅並轉租，及經營該租賃住宅管理業務（以下簡稱包租業務）之公司。"},{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－租賃住宅相關法規與實務（法5-1～法5-5）","r":"頁碼4（PDF第5頁）","q":"四、租賃住宅代管業（以下簡稱代管業）：指受出租人之委託，經營租賃住宅管理業務（以下簡稱代管業務）之公司。"},{"k":"law","l":"租賃住宅市場發展及管理條例","r":"第3條第5款","q":"租賃住宅包租業（以下簡稱包租業）：指承租租賃住宅並轉租，及經營該租賃住宅管理業務（以下簡稱包租業務）之公司。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060125"}]}},{"id":"05-01-023","c":"05","t":"05-01","n":"23","q":"下列有關住宅包租契約應約定及不得約定事項中出租人提前終止租約事由的敘述，何者有誤？","o":["包租業擅自將本租賃標的出借或以其他轉租以外之方式供他人使用，經出租人阻止仍繼續為之","次承租人毀損租賃住宅或附屬設備，經包租業催告修繕仍不為修繕或相當之賠償","包租業把出租人同意轉租權利及其管理業務轉讓予第三人，經出租人阻止仍繼續為之。","包租業擅自進行室內裝修。"],"a":"B","ty":"neg","e":{"s":"ok","x":"住宅包租契約應約定事項第十六點第1項第6款係「包租業」毀損租賃住宅或附屬設備，經「出租人」定相當期限催告修繕仍不為修繕或賠償時，出租人得提前終止租約；(B)所述次承租人毀損並經包租業催告，非該點所定事由；(A)(C)(D)分見同項第5、12、8款，故選(B)。","b":[{"k":"law","l":"住宅包租契約應約定及不得約定事項（內政部）","r":"應約定事項第十六點第1項第6款","q":"(六)包租業毀損租賃住宅或附屬設備，經出租人定相當期限催告修繕仍不為修繕或相當之賠償。","u":"https://la.hl.gov.tw/Upload/202406211536262510621.pdf"},{"k":"law","l":"住宅包租契約應約定及不得約定事項（內政部）","r":"應約定事項第十六點第1項第5款","q":"(五)包租業違反第七點第二項規定，未經出租人同意，擅自將本租賃住宅以出借或轉租以外之其他方式供他人使用，經出租人阻止仍繼續為之。","u":"https://la.hl.gov.tw/Upload/202406211536262510621.pdf"},{"k":"law","l":"住宅包租契約應約定及不得約定事項（內政部）","r":"應約定事項第十六點第1項第12款","q":"(十二)包租業違反第十一點第一項第八款規定，將出租人同意轉租權利及其管理業務轉讓予第三人，經出租人阻止仍繼續為之。","u":"https://la.hl.gov.tw/Upload/202406211536262510621.pdf"},{"k":"law","l":"住宅包租契約應約定及不得約定事項（內政部）","r":"應約定事項第十六點第1項第8款","q":"(八)包租業違反第九點第一項規定，未經出租人同意，擅自進行室內裝修，經出租人阻止仍繼續為之。","u":"https://la.hl.gov.tw/Upload/202406211536262510621.pdf"}]}},{"id":"05-01-024","c":"05","t":"05-01","n":"24","q":"下列何者不是住宅包租契約應約定事項中，契約應記載的當事人及相關人員基本資料？","o":["出租人之姓名(名稱)、統一編號或身分證明文件編號、戶籍地址、通訊地址、聯絡電話。","包租業之公司名稱、代表人姓名、統一編號、登記證字號、營業地址、聯絡電話、電子郵件信箱。","租賃住宅管理人員之姓名、證書字號、通訊地址、聯絡電話、電子郵件信箱。","出租人同居人之姓名(名稱)、統一編號或身分證明文件編號、戶籍地址、通訊地址、聯絡電話、電子郵件信箱。"],"a":"D","ty":"neg","e":{"s":"ok","x":"住宅包租契約應約定事項第二十三點（簡報實2-1頁5同）：契約應記載出租人、包租業及租賃住宅管理人員之基本資料，並不包括出租人同居人，故選(D)。","b":[{"k":"law","l":"住宅包租契約應約定及不得約定事項（內政部）","r":"應約定事項第二十三點(一)","q":"（一）出租人之姓名(名稱)、戶籍地址、通訊地址、聯絡電話。","u":"https://la.hl.gov.tw/Upload/202406211536262510621.pdf"},{"k":"law","l":"住宅包租契約應約定及不得約定事項（內政部）","r":"應約定事項第二十三點(二)","q":"（二）包租業之公司名稱、代表人姓名、統一編號、登記證字號、營業地址、聯絡電話、電子郵件信箱。","u":"https://la.hl.gov.tw/Upload/202406211536262510621.pdf"},{"k":"law","l":"住宅包租契約應約定及不得約定事項（內政部）","r":"應約定事項第二十三點(三)","q":"（三）租賃住宅管理人員之姓名、證書字號、通訊地址、聯絡電話、電子郵件信箱。","u":"https://la.hl.gov.tw/Upload/202406211536262510621.pdf"},{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－租賃管理與糾紛實務（實2-1～實2-2）","r":"頁碼5（PDF第6頁）","q":"二三.當事人及相關人員基本資料"}],"nt":"選項(A)所列「統一編號或身分證明文件編號」「電子郵件信箱」未見於現行第二十三點(一)出租人資料，惟不影響本題答案。"}},{"id":"05-01-025","c":"05","t":"05-01","n":"25","q":"下列何者不是住宅包租契約中的不得約定事項內容？","o":["不得約定本契約之通知，僅以電話方式為之。","不得約定違反強制或禁止規定。","不得約定出租人須繳回契約書。","不得約定拋棄審閱期"],"a":"D","ty":"neg","e":{"s":"ok","x":"簡報（實2-1）頁5所列住宅包租契約不得約定事項共七點，包括不得約定出租人須繳回契約書、通知僅以電話方式為之、違反強制或禁止規定等；並無「不得約定拋棄審閱期」，現行文本亦無契約審閱期間之規定，故選(D)。","b":[{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－租賃管理與糾紛實務（實2-1～實2-2）","r":"頁碼5（PDF第6頁）","q":"不得約定出租人須繳回契約書。"},{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－租賃管理與糾紛實務（實2-1～實2-2）","r":"頁碼5（PDF第6頁）","q":"七. 不得約定違反強制或禁止規定。"},{"k":"law","l":"住宅包租契約應約定及不得約定事項（內政部）","r":"不得約定事項第六點","q":"六、不得約定本契約之通知，僅以電話方式為之。","u":"https://la.hl.gov.tw/Upload/202406211536262510621.pdf"},{"k":"law","l":"住宅包租契約應約定及不得約定事項（內政部）","r":"不得約定事項第五點","q":"五、不得約定出租人須繳回契約書。","u":"https://la.hl.gov.tw/Upload/202406211536262510621.pdf"},{"k":"law","l":"住宅包租契約應約定及不得約定事項（內政部）","r":"不得約定事項第七點","q":"七、不得約定違反強制或禁止規定。","u":"https://la.hl.gov.tw/Upload/202406211536262510621.pdf"},{"k":"law","l":"住宅包租契約應約定及不得約定事項（內政部）","r":"全文","m":"不得約定事項僅一至七點（廣告、次承租人遷入戶籍、稅費轉嫁、瑕疵擔保、繳回契約書、通知方式、強制或禁止規定），全文無「審閱」或「審閱期間」字樣。","u":"https://la.hl.gov https://www.ey.gov.tw/File/8886942C80253779?A=C"},{"k":"law","l":"住宅轉租定型化契約應記載及不得記載事項（內政部）","r":"附件一租賃標的現況確認書第8項","q":"本租賃住宅（專有部分）是否曾發生兇殺、自殺、一氧化碳中毒或其他非自然死亡之情事：","u":"https://www.ey.gov.tw/File/8886942C80253779?A=C"},{"k":"law","l":"住宅轉租定型化契約應記載及不得記載事項（內政部）","r":"附件一租賃標的現況確認書","m":"共12項：違建、建物型態及格局、停車位、消防設施、滲漏水、輻射屋檢測、海砂屋檢測、非自然死亡、供排水、公寓大廈規約、管理委員會及管理費、附屬設備；無嫌惡設施項目。","u":"https://www.ey.gov.tw/File/8886942C80253779?A=C"}]}},{"id":"05-02-003","c":"05","t":"05-02","n":"03","q":"下列何者非屬住宅轉租定型化契約應記載及不得記載事項中，關於停車位記載情形？","o":["停車位種類及編號","他項權利之登記","使用時間","平面式或機械式"],"a":"B","ty":"neg","e":{"s":"ok","x":"住宅轉租定型化契約應記載事項第二點(二)2車位記載汽車停車位種類及編號（平面式或機械式）及使用時間；「有無設定他項權利」屬第二點(一)5租賃住宅標示事項，非停車位記載內容，故選(B)。","b":[{"k":"law","l":"住宅轉租定型化契約應記載及不得記載事項（內政部）","r":"應記載事項第二點(二)2","q":"地上(下）第__層□平面式停車位□機械式停車位，編號第__號。","u":"https://www.ey.gov.tw/File/8886942C80253779?A=C"},{"k":"law","l":"住宅轉租定型化契約應記載及不得記載事項（內政部）","r":"應記載事項第二點(二)2","m":"車位項下依序記載(1)汽車停車位種類及編號、(2)機車停車位、(3)使用時間（全日、日間、夜間、其他）。","u":"https://www.ey.gov.tw/File/8886942C80253779?A=C"},{"k":"law","l":"住宅轉租定型化契約應記載及不得記載事項（內政部）","r":"應記載事項第二點(一)5","q":"□有□無設定他項權利，若有，權利種類： 。","u":"https://www.ey.gov.tw/File/8886942C80253779?A=C"}]}},{"id":"05-02-004","c":"05","t":"05-02","n":"04","q":"下列何者是住宅轉租定型化契約應記載及不得記載事項附件租賃標的現況確認書中，所謂的凶宅？","o":["在屋主產權持有期間，租屋處發生兇殺案，被害者死於租屋處大樓的樓梯間","租屋處所處公寓大廈鄰居跳樓身亡，死於社區中庭","在屋主產權持有期間，租屋處有人上吊自殺","在屋主產權持有期間，租屋處樓上有人死亡，為運送屍體而經過出租處內"],"a":"C","ty":"neg","e":{"s":"ok","x":"住宅轉租定型化契約附件一現況確認書第8項確認「本租賃住宅（專有部分）是否曾發生兇殺、自殺、一氧化碳中毒或其他非自然死亡之情事」，並區分原出租人產權持有期間；(C)產權持有期間租屋處內有人上吊自殺屬之；(A)死於大樓樓梯間、(B)死於社區中庭均非專有部分內，(D)僅運送遺體經過屋內，故選(C)。","b":[{"k":"law","l":"住宅轉租定型化契約應記載及不得記載事項（內政部）","r":"附件一租賃標的現況確認書第8項","q":"本租賃住宅（專有部分）是否曾發生兇殺、自殺、一氧化碳中毒或其他非自然死亡之情事：","u":"https://www.ey.gov.tw/File/8886942C80253779?A=C"},{"k":"law","l":"住宅轉租定型化契約應記載及不得記載事項（內政部）","r":"附件一租賃標的現況確認書第8項(1)","q":"(1)包租業確認原出租人於產權持有期間□有□無曾發生上列情事。","u":"https://www.ey.gov.tw/File/8886942C80253779?A=C"}]}},{"id":"05-02-005","c":"05","t":"05-02","n":"05","q":"有關住宅轉租定型化契約應記載及不得記載事項之規定，下列何種行為較不妥適？","o":["租約雖然沒有記載不得禁止房客不得申請租金補貼，但是包租業口頭說明租約記載之租金是房客未聲請租金補貼的價錢，將來如果房客申請租金補貼，要再多繳租金","包租業評估租金時，應該要將相關的稅費及支出與附近租賃市場租金行情一併納入考量","為了避免兩造糾紛，租約採公證方式為之","為了避免房客日後檢舉，包租業應誠實申報稅捐"],"a":"A","ty":"neg","e":{"s":"ok","x":"住宅轉租定型化契約不得記載事項第十點：「不得約定承租人不得申請租金補貼。」應記載事項第四點並規定包租業於租賃期間不得藉任何理由要求調漲租金；(A)以口頭方式使申請租金補貼之房客須多繳租金，實質限制承租人申請租金補貼並變相調漲租金，最不妥適；(C)公證為第七點得約定之事項，故選(A)。","b":[{"k":"law","l":"住宅轉租定型化契約應記載及不得記載事項（內政部）","r":"不得記載事項第十點","q":"不得約定承租人不得申請租金補貼。","u":"https://www.ey.gov.tw/File/8886942C80253779?A=C"},{"k":"law","l":"住宅轉租定型化契約應記載及不得記載事項（內政部）","r":"應記載事項第四點第1項","q":"包租業於租賃期間亦不得藉任何理由要求調漲租金。","u":"https://www.ey.gov.tw/File/8886942C80253779?A=C"},{"k":"law","l":"住宅轉租定型化契約應記載及不得記載事項（內政部）","r":"應記載事項第七點第2項","m":"租賃雙方同意辦理公證者，公證費及公證代辦費得約定由包租業、承租人或雙方平均負擔。","u":"https://www.ey.gov.tw/File/8886942C80253779?A=C"}],"nt":"不得記載事項第十點於113-11-21修正，現行文字如上。選項(B)(D)未見於應記載事項，屬一般妥適作法之敘述。"}},{"id":"05-02-006","c":"05","t":"05-02","n":"06","q":"住宅轉租定型化契約應記載及不得記載事項中，下列何者非屬租賃標的應記載事項？","o":["主建物","有無查封登記","有無預告登記","有無設定他項權利"],"a":"C","ty":"neg","e":{"s":"ok","x":"住宅轉租定型化契約應記載事項第二點(一)租賃住宅標示包括主建物（第2目(1)）、有無設定他項權利（第5目）及有無查封登記（第6目），未列「預告登記」，故選(C)。","b":[{"k":"law","l":"住宅轉租定型化契約應記載及不得記載事項（內政部）","r":"應記載事項第二點(一)2(1)","q":"主建物面積：__層__平方公尺，__層__平方公尺，__層__平方公尺共計__平方公尺，用途__。","u":"https://www.ey.gov.tw/File/8886942C80253779?A=C"},{"k":"law","l":"住宅轉租定型化契約應記載及不得記載事項（內政部）","r":"應記載事項第二點(一)5","q":"□有□無設定他項權利，若有，權利種類： 。","u":"https://www.ey.gov.tw/File/8886942C80253779?A=C"},{"k":"law","l":"住宅轉租定型化契約應記載及不得記載事項（內政部）","r":"應記載事項第二點(一)6","q":"□有□無查封登記。","u":"https://www.ey.gov.tw/File/8886942C80253779?A=C"}]}},{"id":"05-02-007","c":"05","t":"05-02","n":"07","q":"住宅轉租定型化契約應記載及不得記載事項中，關於「押金約定」的數額不得超過相當於幾個月租金？","o":["3個月","1個月","2個月","6個月"],"a":"C","ty":"neg","e":{"s":"ok","x":"住宅轉租定型化契約應記載事項第五點第1項：押金「最高不得超過二個月租金之總額」；簡報（實2-1）頁8轉租契約重點亦同，故選(C)。","b":[{"k":"law","l":"住宅轉租定型化契約應記載及不得記載事項（內政部）","r":"應記載事項第五點第1項","q":"押金由租賃雙方約定為___個月租金，金額為 元整(最高不得超過二個月租金之總額)。","u":"https://www.ey.gov.tw/File/8886942C80253779?A=C"},{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－租賃管理與糾紛實務（實2-1～實2-2）","r":"頁碼8（PDF第9頁）","q":"最高不得超過2個月租金，契約消滅後應返還押金或抵充債務後賸餘押金。"}]}},{"id":"05-02-008","c":"05","t":"05-02","n":"08","q":"住宅轉租定型化契約應記載及不得記載事項中，有關租賃標的之標示應參詳下列哪一個選項？","o":["點交設備清單","租賃標的現況確認書","廣告資料","委託書"],"a":"B","ty":"neg","e":{"s":"ok","x":"住宅轉租定型化契約應記載事項第二點租賃標的(二)3：附屬設備「詳如後附租賃標的現況確認書（如附件一）」；第十一點(五)並規定包租業應製作租賃標的現況確認書，簽約時以該確認書及本契約向承租人解說，故選(B)。","b":[{"k":"law","l":"住宅轉租定型化契約應記載及不得記載事項（內政部）","r":"應記載事項第二點(二)3","q":"租賃附屬設備：□有□無附屬設備，若有，除另有附屬設備清單外，詳如後附租賃標的現況確認書（如附件一）。","u":"https://www.ey.gov.tw/File/8886942C80253779?A=C"},{"k":"law","l":"住宅轉租定型化契約應記載及不得記載事項（內政部）","r":"應記載事項第十一點(五)","q":"(五)應製作租賃標的現況確認書(如附件一)，並於簽訂本契約時，以該確認書及本契約向承租人解說。","u":"https://www.ey.gov.tw/File/8886942C80253779?A=C"}],"nt":"應記載事項原文係就租賃標的之附屬設備指明「詳如後附租賃標的現況確認書」，未見「租賃標的之標示應參詳…」之逐字文句；四選項中僅現況確認書為第二點租賃標的所指定之附件。"}},{"id":"05-02-009","c":"05","t":"05-02","n":"09","q":"住宅轉租定型化契約應記載及不得記載事項中，下列關於「修繕」之敘述何者有誤？","o":["租賃住宅或租賃附屬設備損壞時，不論任何情況應由包租業負責修繕及費用","包租業為修繕租賃住宅所為之必要行為，承租人不得拒絕","包租業若未期限內修繕應修繕之設備，承租人得自行修繕，並自租金扣除修繕費用","包租業於修繕期間，致租賃標的全部或一部不能居住使用者，承租人得請求包租業扣除該期間全部或一部之租金"],"a":"A","ty":"neg","e":{"s":"ok","x":"住宅轉租定型化契約應記載事項第九點第1項：損壞由包租業負責修繕，「但其損壞係可歸責於承租人之事由者，不在此限」，並非不論任何情況均由包租業負責，故(A)有誤；(B)(C)(D)分見同點第3、2、4項，故選(A)。","b":[{"k":"law","l":"住宅轉租定型化契約應記載及不得記載事項（內政部）","r":"應記載事項第九點第1項","q":"租賃住宅或附屬設備損壞時，應由包租業負責修繕。但其損壞係可歸責於承租人之事由者，不在此限。","u":"https://www.ey.gov.tw/File/8886942C80253779?A=C"},{"k":"law","l":"住宅轉租定型化契約應記載及不得記載事項（內政部）","r":"應記載事項第九點第2項","q":"前項由包租業負責修繕者，承租人得定相當期限催告修繕，如包租業未於承租人所定相當期限內修繕時，承租人得自行修繕，並請求包租業償還其費用或於第四點約定之租金中扣除。","u":"https://www.ey.gov.tw/File/8886942C80253779?A=C"},{"k":"law","l":"住宅轉租定型化契約應記載及不得記載事項（內政部）","r":"應記載事項第九點第3項","q":"包租業為修繕租賃住宅所為之必要行為，應於相當期間先期通知，承租人無正當理由不得拒絕。","u":"https://www.ey.gov.tw/File/8886942C80253779?A=C"},{"k":"law","l":"住宅轉租定型化契約應記載及不得記載事項（內政部）","r":"應記載事項第九點第4項","q":"前項包租業於修繕期間，致租賃住宅全部或一部不能居住使用者，承租人得請求包租業扣除該期間全部或一部之租金。","u":"https://www.ey.gov.tw/File/8886942C80253779?A=C"},{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－租賃管理與糾紛實務（實2-1～實2-2）","r":"頁碼8（PDF第9頁）","q":"屋況損害除可歸責於租客外，應由包租業負責修繕。"}]}},{"id":"05-02-010","c":"05","t":"05-02","n":"10","q":"依照住宅轉租定型化契約應約定及不得約定事項規定，雙方得提前終止租約。但其違約金數額不得超過相當於幾個月的月租金？","o":["2個月","1個月","3個月","不得約定違約金"],"a":"B","ty":"neg","e":{"s":"ok","x":"住宅轉租定型化契約應記載事項第十四點第2項：「一方未為先期通知而逕行終止租約者，應賠償他方最高不得超過一個月租金額之違約金。」簡報（實2-1）頁8亦同，故選(B)。","b":[{"k":"law","l":"住宅轉租定型化契約應記載及不得記載事項（內政部）","r":"應記載事項第十四點第2項","q":"依約定得終止租約者，租賃之一方應至少於終止前一個月通知他方。一方未為先期通知而逕行終止租約者，應賠償他方最高不得超過一個月租金額之違約金。","u":"https://www.ey.gov.tw/File/8886942C80253779?A=C"},{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－租賃管理與糾紛實務（實2-1～實2-2）","r":"頁碼8（PDF第9頁）","q":"如約定可以提前終止租約，但沒有提前通知，最高賠償金額不得超過1個月。"}],"nt":"題目所稱「住宅轉租定型化契約應約定及不得約定事項」，正式名稱為「應記載及不得記載事項」。"}},{"id":"05-02-011","c":"05","t":"05-02","n":"11","q":"下列何者非屬住宅轉租定型化契約的應記載事項？","o":["門牌","車位","附屬建物用途","格局"],"a":"D","ty":"neg","e":{"s":"ok","x":"住宅轉租定型化契約應記載事項第二點(一)租賃住宅標示記載門牌（第1目）、附屬建物用途（第2目(2)）及車位（第4目），未列「格局」，故選(D)。","b":[{"k":"law","l":"住宅轉租定型化契約應記載及不得記載事項（內政部）","r":"應記載事項第二點(一)1","q":"無門牌者，其房屋稅籍編號： 或其位置略圖。","m":"門牌及基地坐落地號；無門牌者記載房屋稅籍編號或位置略圖。","u":"https://www.ey.gov.tw/File/8886942C80253779?A=C"},{"k":"law","l":"住宅轉租定型化契約應記載及不得記載事項（內政部）","r":"應記載事項第二點(一)2(2)","q":"附屬建物用途__，面積__平方公尺。","u":"https://www.ey.gov.tw/File/8886942C80253779?A=C"},{"k":"law","l":"住宅轉租定型化契約應記載及不得記載事項（內政部）","r":"應記載事項第二點(一)4","q":"車位：□有（汽車停車位 個、機車停車位 個）□無。","u":"https://www.ey.gov.tw/File/8886942C80253779?A=C"}],"nt":"「格局」未列於第二點(一)租賃住宅標示，但附件一現況確認書第2項有「建物現況格局」確認欄，第二點(二)1租賃範圍亦提及「租賃住宅位置格局示意圖」；本題選項(A)(B)(C)均為租賃住宅標示項目，依此解讀答案為(D)。"}},{"id":"05-02-012","c":"05","t":"05-02","n":"12","q":"下列有關住宅轉租定型化契約應記載及不得記載事項中，關於室內裝修的敘述何者有誤？","o":["經包租業同意室內裝修者，承租人應依相關法令規定辦理，且不得損害原有建築之結構安全","室內裝修所需費用，一定要由包租業負擔","承租人經包租業同意裝修者，其裝修增設部分若有損壞，由承租人修繕並負擔費用","承租人返還租賃住宅時，雙方可以約定應負責回復原狀或現況返還"],"a":"B","ty":"neg","e":{"s":"ok","x":"住宅轉租定型化契約應記載事項第十點：承租人有室內裝修需要，應經包租業同意並依法令辦理且不得損害原有建築結構之安全；經同意裝修之增設部分損壞由承租人負責修繕；返還時得約定回復原狀或現況返還；並無裝修費用一定由包租業負擔之規定，故選(B)。","b":[{"k":"law","l":"住宅轉租定型化契約應記載及不得記載事項（內政部）","r":"應記載事項第十點第1項","q":"承租人有室內裝修之需要，應經包租業同意並依相關法令規定辦理，且不得損害原有建築結構之安全。","u":"https://www.ey.gov.tw/File/8886942C80253779?A=C"},{"k":"law","l":"住宅轉租定型化契約應記載及不得記載事項（內政部）","r":"應記載事項第十點第2項","q":"承租人經包租業同意裝修者，其裝修增設部分若有損壞，由承租人負責修繕。","u":"https://www.ey.gov.tw/File/8886942C80253779?A=C"},{"k":"law","l":"住宅轉租定型化契約應記載及不得記載事項（內政部）","r":"應記載事項第十點第3項","q":"第一項情形，承租人返還租賃住宅時，□應負責回復原狀□現況返還□其他 。","u":"https://www.ey.gov.tw/File/8886942C80253779?A=C"}]}},{"id":"05-02-013","c":"05","t":"05-02","n":"13","q":"下列何者非屬住宅轉租定型化契約應記載中，租賃標的之應記載事項？","o":["專有部分之使用時間","專有部分之權利範圍","專有部分之面積","專有部分之建號"],"a":"A","ty":"neg","e":{"s":"ok","x":"住宅轉租定型化契約應記載事項第二點(一)2：專有部分應記載「建號 ，權利範圍 ，面積」；「使用時間」僅見於第二點(二)2車位之記載，非專有部分應記載事項，故選(A)。","b":[{"k":"law","l":"住宅轉租定型化契約應記載及不得記載事項（內政部）","r":"應記載事項第二點(一)2","q":"專有部分建號 ，權利範圍 ，面積共計 平方公尺。","u":"https://www.ey.gov.tw/File/8886942C80253779?A=C"},{"k":"law","l":"住宅轉租定型化契約應記載及不得記載事項（內政部）","r":"應記載事項第二點(二)2(3)","m":"車位之使用時間：全日、日間、夜間或其他。","u":"https://www.ey.gov.tw/File/8886942C80253779?A=C"}]}},{"id":"05-02-014","c":"05","t":"05-02","n":"14","q":"下列何者非屬住宅轉租定型化契約應記載及不得記載事項中，租賃標的之應記載事項？","o":["共有部分用途","主建物用途","附屬建物用途","共有部分持分面積"],"a":"A","ty":"neg","e":{"s":"ok","x":"住宅轉租定型化契約應記載事項第二點(一)：主建物及附屬建物均記載用途，共有部分則記載建號、權利範圍及持分面積，並無「共有部分用途」，故選(A)。","b":[{"k":"law","l":"住宅轉租定型化契約應記載及不得記載事項（內政部）","r":"應記載事項第二點(一)2(1)","q":"主建物面積：__層__平方公尺，__層__平方公尺，__層__平方公尺共計__平方公尺，用途__。","u":"https://www.ey.gov.tw/File/8886942C80253779?A=C"},{"k":"law","l":"住宅轉租定型化契約應記載及不得記載事項（內政部）","r":"應記載事項第二點(一)2(2)","q":"附屬建物用途__，面積__平方公尺。","u":"https://www.ey.gov.tw/File/8886942C80253779?A=C"},{"k":"law","l":"住宅轉租定型化契約應記載及不得記載事項（內政部）","r":"應記載事項第二點(一)3","q":"共有部分建號__，權利範圍__，持分面積__平方公尺。","u":"https://www.ey.gov.tw/File/8886942C80253779?A=C"}]}},{"id":"05-02-015","c":"05","t":"05-02","n":"15","q":"下列何者不是住宅轉租定型化契約之不得記載事項？","o":["不得約定廣告僅供參考","不得約定承租人於租屋處不得辦理公司登記","不得約定應由包租業負擔之稅費，轉嫁由承租人負擔","不得約定承租人須繳回契約書"],"a":"B","ty":"neg","e":{"s":"ok","x":"住宅轉租定型化契約不得記載事項第二點不得約定廣告僅供參考、第五點不得約定應由包租業或所有權人負擔之稅賦增加部分由承租人負擔、第七點不得約定承租人須繳回契約書；並無「不得約定承租人不得辦理公司登記」，且應記載事項第八點明定租賃住宅係供居住使用、承租人不得變更用途，故選(B)。","b":[{"k":"law","l":"住宅轉租定型化契約應記載及不得記載事項（內政部）","r":"不得記載事項第二點","q":"不得約定廣告僅供參考。","u":"https://www.ey.gov.tw/File/8886942C80253779?A=C"},{"k":"law","l":"住宅轉租定型化契約應記載及不得記載事項（內政部）","r":"不得記載事項第五點","q":"不得約定應由包租業或租賃住宅所有權人負擔之稅賦，若較出租前增加時，其增加部分由承租人負擔。","u":"https://www.ey.gov.tw/File/8886942C80253779?A=C"},{"k":"law","l":"住宅轉租定型化契約應記載及不得記載事項（內政部）","r":"不得記載事項第七點","q":"不得約定承租人須繳回契約書。","u":"https://www.ey.gov.tw/File/8886942C80253779?A=C"},{"k":"law","l":"住宅轉租定型化契約應記載及不得記載事項（內政部）","r":"應記載事項第八點第1項","q":"本租賃住宅係供居住使用，承租人不得變更用途。","u":"https://www.ey.gov.tw/File/8886942C80253779?A=C"}]}},{"id":"05-02-016","c":"05","t":"05-02","n":"16","q":"住宅轉租定型化契約應記載事項中，下列哪一項費用可讓包租業及承租人自由約定由其中一方負擔？","o":["租賃期間之社區管理費","租賃期間之房屋稅","租賃期間之地價稅","包租業於租賃期間之營業稅"],"a":"A","ty":"gen","e":{"s":"ok","x":"住宅轉租定型化契約應記載事項第六點(一)管理費得勾選由包租業或承租人負擔；第七點(二)營業稅明定由包租業負擔；房屋稅、地價稅依包租契約應約定事項第六點由出租人（所有權人）負擔，不在轉租契約得約定負擔之費用之列，且不得記載事項第五點禁止將其增加部分轉嫁承租人，故選(A)。","b":[{"k":"law","l":"住宅轉租定型化契約應記載及不得記載事項（內政部）","r":"應記載事項第六點(一)","q":"(一)管理費：□由包租業負擔。□由承租人負擔。","u":"https://www.ey.gov.tw/File/8886942C80253779?A=C"},{"k":"law","l":"住宅轉租定型化契約應記載及不得記載事項（內政部）","r":"應記載事項第七點第1項第2款","q":"(二)依營業稅法規定應開立發票報繳之營業稅，由包租業負擔。","u":"https://www.ey.gov.tw/File/8886942C80253779?A=C"},{"k":"law","l":"住宅轉租定型化契約應記載及不得記載事項（內政部）","r":"不得記載事項第五點","q":"不得約定應由包租業或租賃住宅所有權人負擔之稅賦，若較出租前增加時，其增加部分由承租人負擔。","u":"https://www.ey.gov.tw/File/8886942C80253779?A=C"},{"k":"law","l":"住宅包租契約應約定及不得約定事項（內政部）","r":"應約定事項第六點第1項第1款","q":"(一)租賃住宅之房屋稅、地價稅，由出租人負擔。","u":"https://la.hl.gov.tw/Upload/202406211536262510621.pdf"}]}},{"id":"05-02-017","c":"05","t":"05-02","n":"17","q":"下列有關住宅轉租定型化契約應記載及不得記載事項中，對包租業義務的敘述何者有誤？","o":["應出示租賃住宅服務業登記證影本，供承租人核對","應於簽訂本契約時，提供同意本租賃標的之全部或一部分轉租之同意書，並載明租賃標的範圍、租賃期間及得終止本契約之事由","應以合於所約定居住使用之租賃住宅，交付承租人，並於租賃期間保持其合於居住使用之狀態","無須製作租賃標的現況確認書，而是由出租人自行向承租人解說"],"a":"D","ty":"neg","e":{"s":"ok","x":"住宅轉租定型化契約應記載事項第十一點(五)：包租業「應製作租賃標的現況確認書(如附件一)，並於簽訂本契約時，以該確認書及本契約向承租人解說」，故(D)稱無須製作、由出租人自行解說有誤；(A)(C)分見同點(一)(三)，(B)近於同點(二)應提供原出租人同意轉租之書面文件，故選(D)。","b":[{"k":"law","l":"住宅轉租定型化契約應記載及不得記載事項（內政部）","r":"應記載事項第十一點(五)","q":"(五)應製作租賃標的現況確認書(如附件一)，並於簽訂本契約時，以該確認書及本契約向承租人解說。","u":"https://www.ey.gov.tw/File/8886942C80253779?A=C"},{"k":"law","l":"住宅轉租定型化契約應記載及不得記載事項（內政部）","r":"應記載事項第十一點(一)","q":"(一)應出示租賃住宅服務業登記證影本，供承租人核對。","u":"https://www.ey.gov.tw/File/8886942C80253779?A=C"},{"k":"law","l":"住宅轉租定型化契約應記載及不得記載事項（內政部）","r":"應記載事項第十一點(二)","q":"(二)應向承租人提供包租契約之出租人(以下簡稱原出租人)同意轉租之書面文件，並載明其與原出租人之租賃標的範圍、租賃期間及得終止住宅包租契約之事由。","u":"https://www.ey.gov.tw/File/8886942C80253779?A=C"},{"k":"law","l":"住宅轉租定型化契約應記載及不得記載事項（內政部）","r":"應記載事項第十一點(三)","q":"(三)應以合於所約定居住使用之租賃住宅，交付承租人，並於租賃期間保持其合於居住使用之狀態。","u":"https://www.ey.gov.tw/File/8886942C80253779?A=C"}]}},{"id":"05-02-018","c":"05","t":"05-02","n":"18","q":"下列有關住宅轉租定型化契約應記載及不得記載事項包租業義務的敘述，何者有誤？","o":["不論如何，都應該負擔房屋的修繕責任","應於收受出租人之有關費用或文件時，開立統一發票或掣給收據","應配合出租人申請減徵稅捐需要，提供相關證明","應於出租人有因修繕之必要行為時，通知次承租人配合辦理"],"a":"A","ty":"neg","e":{"s":"ok","x":"住宅轉租定型化契約應記載事項第九點第1項：損壞由包租業負責修繕，「但其損壞係可歸責於承租人之事由者，不在此限」，故(A)「不論如何都應負擔修繕責任」有誤，故選(A)。","b":[{"k":"law","l":"住宅轉租定型化契約應記載及不得記載事項（內政部）","r":"應記載事項第九點第1項","q":"租賃住宅或附屬設備損壞時，應由包租業負責修繕。但其損壞係可歸責於承租人之事由者，不在此限。","u":"https://www.ey.gov.tw/File/8886942C80253779?A=C"},{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－租賃管理與糾紛實務（實2-1～實2-2）","r":"頁碼8（PDF第9頁）","q":"屋況損害除可歸責於租客外，應由包租業負責修繕。"}],"nt":"選項(B)(C)(D)之用語（收受出租人費用開立發票、配合出租人申請減徵稅捐、通知次承租人配合修繕）近於住宅包租契約應約定事項之包租業義務；轉租應記載事項第十一點(六)(八)對應為收受承租人費用開立發票、原出租人有修繕必要時先期通知承租人配合。"}},{"id":"05-02-019","c":"05","t":"05-02","n":"19","q":"下列何種行為應適用住宅轉租定型化契約應記載及不得記載事項？","o":["商務中心出租獨立辦公室予公司行號使用","包租業經出租人同意轉租其租賃住宅後，轉租予次承租人居住使用時","大學生在校外租了一層公寓，將使用不到的房間出組給同學使用","為了有效利用店面，將店面騎樓出租予他們營業使用"],"a":"B","ty":"neg","e":{"s":"ok","x":"簡報（實2-1）頁6：轉租係包租業以其租用之住宅全部或一部租與他人居住使用、次承租人支付租金，次承租人僅作居住使用並屬最終使用之消費者，故包租業經出租人同意轉租予次承租人居住使用時，適用住宅轉租定型化契約應記載及不得記載事項；(A)(D)非居住使用，(C)非包租業（公司）所為，故選(B)。","b":[{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－租賃管理與糾紛實務（實2-1～實2-2）","r":"頁碼6（PDF第7頁）","q":"居住使用並不得再轉租，屬最終使"},{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－租賃住宅相關法規與實務（法5-1～法5-5）","r":"頁碼5（PDF第6頁）","q":"九、轉租：指承租租賃住宅，以其全部或一部租與他人居住使用，他人支付租金之租賃行為。"},{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－租賃住宅相關法規與實務（法5-1～法5-5）","r":"頁碼4（PDF第5頁）","q":"五、租賃住宅包租業（以下簡稱包租業）：指承租租賃住宅並轉租，及經營該租賃住宅管理業務（以下簡稱包租業務）之公司。"},{"k":"law","l":"租賃住宅市場發展及管理條例","r":"第3條第9款","q":"轉租：指承租租賃住宅，以其全部或一部租與他人居住使用，他人支付租金之租賃行為。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060125"}]}},{"id":"05-02-020","c":"05","t":"05-02","n":"20","q":"下列有關住宅轉租定型化契約應記載及不得記載事項之電費約定，何者錯誤？","o":["以用電度數計費者，每度電費不得超過該租賃標的電費單「當期每度平均電價」；如公共設施電費未向台灣電力股份有限公司申辦分攤併入租賃標的電費內者，包租業不得額外收取","非以用電度數計費者，包租業所收取之每期電費總金額，不得超過該租賃標的電費單之每期電費總額","約定電費由承租人負擔者，包租業應提供承租人租賃標的之電費資訊。承租人亦得逕向台灣電力股份有限公司申辦查詢租賃期間之有關電費資訊","一度就是十元，無法協商"],"a":"D","ty":"neg","e":{"s":"ok","x":"現行（113-11-21修正）住宅轉租定型化契約應記載事項第六點(三)：以用電度數計費者每度電費不得超過電費單「當期每度平均電價」，非以度數計費者每期總金額不得超過電費單每期電費總額；第十一點(十)並規定包租業應提供電費資訊；(A)(B)(C)均與現行規定相符，(D)不問電費單一律每度十元且不得協商，不符上開計費上限，故選(D)。","b":[{"k":"law","l":"住宅轉租定型化契約應記載及不得記載事項（內政部）","r":"應記載事項第六點(三)","q":"□以用電度數計費者，每度電費不得超過該租賃標的電費單「當期每度平均電價」；如公共設施電費未向台灣電力股份有限公司申辦分攤併入租賃標的電費內者，包租業不得額外收取。","u":"https://www.ey.gov.tw/File/8886942C80253779?A=C"},{"k":"law","l":"住宅轉租定型化契約應記載及不得記載事項（內政部）","r":"應記載事項第六點(三)","q":"□非以用電度數計費者，包租業所收取之每期電費總金額，不得超過該租賃標的電費單之每期電費總額。","u":"https://www.ey.gov.tw/File/8886942C80253779?A=C"},{"k":"law","l":"住宅轉租定型化契約應記載及不得記載事項（內政部）","r":"應記載事項第十一點(十)","q":"(十)依第六點規定約定電費由承租人負擔者，包租業應提供承租人租賃標的之電費資訊。承租人亦得逕向台灣電力股份有限公司申辦查詢租賃期間之有關電費資訊。","u":"https://www.ey.gov.tw/File/8886942C80253779?A=C"}],"nt":"簡報（實2-1）頁8所載為修正前規定「電費不得超過台電公司夏季用電量最高級距之每度金額」；113-11-21已修正為上述現行文字，選項(A)(B)(C)即為現行條文，答案不受影響。"}},{"id":"05-03-001","c":"05","t":"05-03","n":"01","q":"下列何者非屬租賃住宅代管業服務項目？","o":["屋況與設備點交","搬家服務","管理押金","遺留物之處理"],"a":"B","ty":"neg","e":{"s":"ok","x":"租賃住宅委託管理定型化契約應記載事項第五點所列受託人代為管理項目包括屋況與設備點交、管理押金（第八款第3目）、遺留物之處理（第八款第6目）等，並無搬家服務；簡報（實2-1）頁9亦說明代管業務包含屋況與設備點交、收租與押金管理等，故選(B)。","b":[{"k":"law","l":"租賃住宅委託管理定型化契約應記載及不得記載事項（內政部）","r":"應記載事項第五點第1款","q":"(一)屋況與設備點交。","u":"https://www.ey.gov.tw/File/73851B219A5EC2CB?A=C"},{"k":"law","l":"租賃住宅委託管理定型化契約應記載及不得記載事項（內政部）","r":"應記載事項第五點第8款","m":"其他項目（勾選）：收取租金、收取押金、管理押金、墊付相關費用、處理委託管理標的專有部分之共用空間清潔業務、遺留物之處理、租購家具及電器設備。","u":"https://www.ey.gov.tw/File/73851B219A5EC2CB?A=C"},{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－租賃管理與糾紛實務（實2-1～實2-2）","r":"頁碼9（PDF第10頁）","q":"其業務包含租賃住宅之屋況與設備點交、收租與押金管理、日常修繕維護、糾紛協調處理等其他與租賃住宅管理有關之事項。"}]}},{"id":"05-03-002","c":"05","t":"05-03","n":"02","q":"關於租賃住宅委託管理定型化契約應記載及不得記載事項，下列敘述何者正確？","o":["管理期間，受託人為提升服務品質，得委託他代管業執行租賃住宅代管事務","為避免租賃糾紛，出租人與承租人已成立租賃契約者，此一情形，不得委託租賃代管服務業進行租賃住宅代管事務","管理期間，受託人得向承租人代收押金或租金，並於代收日起30日內交付委託人","委託管理標的經租賃契約約定由承租人負責修繕者，不得由受託人代為督促承租人修繕並負修繕費用"],"a":"C","ty":"neg","e":{"s":"ok","x":"租賃住宅委託管理定型化契約應記載事項第九點第1項第7款：代為收取租金或押金者，應於代為收取之日起＿日（不得超過三十日）內交付委託人，故(C)正確；(A)違反同項第11款不得委託他代管業執行；(D)與第七點第2項得由受託人代為督促承租人修繕不符；(B)應記載事項以已有承租人為前提（如第五點第3款向承租人催收租金），並無已成立租賃契約即不得委託之規定，故選(C)。","b":[{"k":"law","l":"租賃住宅委託管理定型化契約應記載及不得記載事項（內政部）","r":"應記載事項第九點第1項第7款","q":"(七)依第五點第八款第一目或第二目規定，代為收取租金或押金者，應按約定交付方式，於代為收取之日起＿日(不得超過三十日)內交付委託人。","u":"https://www.ey.gov.tw/File/73851B219A5EC2CB?A=C"},{"k":"law","l":"租賃住宅委託管理定型化契約應記載及不得記載事項（內政部）","r":"應記載事項第九點第1項第11款","q":"(十一)不得委託他代管業執行租賃住宅管理業務。","u":"https://www.ey.gov.tw/File/73851B219A5EC2CB?A=C"},{"k":"law","l":"租賃住宅委託管理定型化契約應記載及不得記載事項（內政部）","r":"應記載事項第七點第2項","q":"委託管理標的經租賃契約約定由承租人負責修繕及負擔費用者，得由受託人代為督促之；承租人對於應負責修繕之項目或費用有爭執時，受託人應代為協調。","u":"https://www.ey.gov.tw/File/73851B219A5EC2CB?A=C"},{"k":"law","l":"租賃住宅委託管理定型化契約應記載及不得記載事項（內政部）","r":"應記載事項第五點第3款","q":"(三)向承租人催收(繳)租金及相關費用。","u":"https://www.ey.gov.tw/File/73851B219A5EC2CB?A=C"}]}},{"id":"05-03-003","c":"05","t":"05-03","n":"03","q":"依據租賃住宅委託管理定型化契約應記載及不得記載事項規定，當租期屆滿或租賃契約提前終止時，下列何者非屬受託人之責任與義務？","o":["協助結清相關費用","督促承租人遷出戶籍及其他登記","督促承租人將租賃住宅返還委託人","清潔該租賃住宅"],"a":"D","ty":"neg","e":{"s":"ok","x":"租賃住宅委託管理定型化契約應記載事項第十點：租賃關係消滅時，受託人應即結算相關費用，督促承租人將租賃住宅返還委託人，並遷出戶籍或其他登記；並無清潔租賃住宅之義務（清潔屬第五點第八款第5目得另行勾選之共用空間清潔業務），故選(D)。","b":[{"k":"law","l":"租賃住宅委託管理定型化契約應記載及不得記載事項（內政部）","r":"應記載事項第十點第1項","q":"委託管理標的之租賃關係消滅時，受託人應即結算相關費用，督促承租人將租賃住宅返還委託人，並遷出戶籍或其他登記。","u":"https://www.ey.gov.tw/File/73851B219A5EC2CB?A=C"},{"k":"law","l":"租賃住宅委託管理定型化契約應記載及不得記載事項（內政部）","r":"應記載事項第五點第8款第5目","m":"其他項目得勾選「處理委託管理標的專有部分之共用空間清潔業務」。","u":"https://www.ey.gov.tw/File/73851B219A5EC2CB?A=C"}]}},{"id":"05-03-004","c":"05","t":"05-03","n":"04","q":"依據租賃住宅委託管理定型化契約應記載及不得記載事項，關於委託管理標的，下列何者非屬委託管理標的中應記載事項？","o":["格局","門牌","車位","附屬建物用途"],"a":"A","ty":"neg","e":{"s":"ok","x":"租賃住宅委託管理定型化契約應記載事項第二點(一)租賃住宅標示記載門牌（第1目）、附屬建物用途（第2目(2)）及車位（第4目），未列「格局」，故選(A)。","b":[{"k":"law","l":"租賃住宅委託管理定型化契約應記載及不得記載事項（內政部）","r":"應記載事項第二點(一)1","m":"門牌及基地坐落地號；無門牌者記載房屋稅籍編號或位置略圖。","u":"https://www.ey.gov.tw/File/73851B219A5EC2CB?A=C"},{"k":"law","l":"租賃住宅委託管理定型化契約應記載及不得記載事項（內政部）","r":"應記載事項第二點(一)2(2)","q":"(2)附屬建物用途____，面積____平方公尺。","u":"https://www.ey.gov.tw/File/73851B219A5EC2CB?A=C"},{"k":"law","l":"租賃住宅委託管理定型化契約應記載及不得記載事項（內政部）","r":"應記載事項第二點(一)4","q":"4.車位：□有(汽車停車位__個、機車停車位__個)□無。","u":"https://www.ey.gov.tw/File/73851B219A5EC2CB?A=C"}],"nt":"「格局」未列於第二點委託管理標的（租賃住宅標示及委託管理範圍），但附件委託管理標的現況確認書第2項有「建物現況格局」確認欄（https://www.ey.gov.tw/File/B8C759319976C2CB?A=C）；本題選項(B)(C)(D)均為租賃住宅標示項目，依此解讀答案為(A)。"}},{"id":"05-03-005","c":"05","t":"05-03","n":"05","q":"下列有關租賃住宅委託管理定型化契約應記載及不得記載事項，受託人於租賃關係消滅時，督促承租人返還租賃住宅的行為，何者較妥適？","o":["建議出租人聲請調解或調處","房客不理不睬，就在夜間到租屋處大聲敲門叫他出來面對","直接去台電及自來水公司聲請停用租屋處之水、電","房客不接電話，就半夜連續打電話"],"a":"A","ty":"neg","e":{"s":"ok","x":"委託管理應記載事項第十點第1項：租賃關係消滅時，受託人應結算相關費用並督促承租人返還租賃住宅；簡報（法5-5）頁177：房客欠租只是民事糾紛，房東斷水斷電已造成房客無法使用房屋，會觸犯刑法強制罪；簡報（法5-1）頁10：住宅租賃爭議得向直轄市、縣（市）政府申請調處，（實2-2）頁55並說明可透過調解、調處等訴訟外方式解決。故督促返還宜建議出租人循調解或調處等合法途徑處理，故選(A)。","b":[{"k":"law","l":"租賃住宅委託管理定型化契約應記載及不得記載事項（內政部）","r":"應記載事項第十點第1項","q":"委託管理標的之租賃關係消滅時，受託人應即結算相關費用，督促承租人將租賃住宅返還委託人，並遷出戶籍或其他登記。","u":"https://www.ey.gov.tw/File/73851B219A5EC2CB?A=C"},{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－租賃住宅相關法規與實務（法5-1～法5-5）","r":"頁碼177（PDF第178頁）","q":"房客欠租只是民事糾紛，但是房東斷水斷電的行為，已經造成房客無法使用房屋，這樣會觸犯刑法強制罪"},{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－租賃住宅相關法規與實務（法5-1～法5-5）","r":"頁碼10（PDF第11頁）","q":"住宅租賃爭議，出租人或承租人得向直轄市或縣（市）政府申請調處，並免繳調處費用。"},{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－租賃管理與糾紛實務（實2-1～實2-2）","r":"頁碼55（PDF第56頁）","q":"還可以透過「調解」、「調處」或「仲裁」等訴訟以外的方式來解決"}],"nt":"選項(B)(D)夜間敲門、半夜連續來電之騷擾方式，簡報及規範未直接論及；本題解以規範第十點、簡報所述合法處理管道及斷水斷電違法說明。"}},{"id":"05-03-006","c":"05","t":"05-03","n":"06","q":"下列何者非屬租賃住宅委託管理定型化契約應記載及不得記載事項中，委託管理標的之應記載事項？","o":["主建物用途","共有部分用途","附屬建物用途","共有部分持分面積"],"a":"B","ty":"neg","e":{"s":"ok","x":"委託管理應記載事項第二點第(一)款「租賃住宅標示」：主建物記載各層面積及用途、附屬建物記載用途及面積，共有部分則只記載建號、權利範圍及持分面積，並無「共有部分用途」之記載項目，故選(B)。","b":[{"k":"law","l":"租賃住宅委託管理定型化契約應記載及不得記載事項（內政部）","r":"應記載事項第二點第(一)款第2目第(2)小目","q":"(2)附屬建物用途____，面積____平方公尺。","u":"https://www.ey.gov.tw/File/73851B219A5EC2CB?A=C"},{"k":"law","l":"租賃住宅委託管理定型化契約應記載及不得記載事項（內政部）","r":"應記載事項第二點第(一)款第3目","q":"3.共有部分建號__，權利範圍__，持分面積__平方公尺。","u":"https://www.ey.gov.tw/File/73851B219A5EC2CB?A=C"},{"k":"law","l":"租賃住宅委託管理定型化契約應記載及不得記載事項（內政部）","r":"應記載事項第二點第(一)款第2目第(1)小目","m":"主建物應記載各層面積、合計面積及用途。","u":"https://www.ey.gov.tw/File/73851B219A5EC2CB?A=C"}]}},{"id":"05-03-007","c":"05","t":"05-03","n":"07","q":"租賃住宅委託管理定型化契約應記載及不得記載事項中出租人與代管公司的法律關係為何？","o":["承攬","雇傭","委任","租賃"],"a":"C","ty":"neg","e":{"s":"ok","x":"租賃住宅代管業係受出租人之委託經營租賃住宅管理業務之公司（簡報實2-1頁9）；委託管理應記載事項多處以「委任雙方」稱委託人與受託人（如第九點第(七)款但書、第十四點第1項）；民法第528條：稱委任者，謂一方委託他方處理事務，他方允為處理之契約，故出租人與代管公司間為委任關係，故選(C)。","b":[{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－租賃管理與糾紛實務（實2-1～實2-2）","r":"頁碼9（PDF第10頁）","q":"租賃住宅代管業係指受出租人之委託，經營租賃住宅管理業務之公司"},{"k":"law","l":"租賃住宅委託管理定型化契約應記載及不得記載事項（內政部）","r":"應記載事項第十四點第1項","q":"本契約自簽約日起生效，委任雙方各執一份契約正本。","u":"https://www.ey.gov.tw/File/73851B219A5EC2CB?A=C"},{"k":"law","l":"租賃住宅委託管理定型化契約應記載及不得記載事項（內政部）","r":"應記載事項第九點第(七)款但書","q":"但委任雙方另訂有保管約定者，依其約定。","u":"https://www.ey.gov.tw/File/73851B219A5EC2CB?A=C"},{"k":"law","l":"民法","r":"民法第528條","q":"稱委任者，謂當事人約定，一方委託他方處理事務，他方允為處理之契約。","u":"https://mojlaw.moj.gov.tw/LawContent.aspx?LSID=FL001351&lawNumber=528&TypeSort=3"}]}},{"id":"05-03-008","c":"05","t":"05-03","n":"08","q":"租賃委託管理定型化契約應記載及不得記載事項中，下列何者非屬租賃標的記載情形？","o":["有無查封登記","有無預告登記","主建物","有無設定他項權利"],"a":"B","ty":"neg","e":{"s":"ok","x":"委託管理應記載事項第二點第(一)款「租賃住宅標示」須記載主建物、有無設定他項權利及有無查封登記，並無「預告登記」之記載項目，故選(B)。","b":[{"k":"law","l":"租賃住宅委託管理定型化契約應記載及不得記載事項（內政部）","r":"應記載事項第二點第(一)款第5目","q":"5.□有□無設定他項權利，若有，權利種類：______。","u":"https://www.ey.gov.tw/File/73851B219A5EC2CB?A=C"},{"k":"law","l":"租賃住宅委託管理定型化契約應記載及不得記載事項（內政部）","r":"應記載事項第二點第(一)款第6目","q":"6.□有□無查封登記。","u":"https://www.ey.gov.tw/File/73851B219A5EC2CB?A=C"},{"k":"law","l":"租賃住宅委託管理定型化契約應記載及不得記載事項（內政部）","r":"應記載事項第二點第(一)款第2目第(1)小目","m":"主建物應記載各層面積、合計面積及用途。","u":"https://www.ey.gov.tw/File/73851B219A5EC2CB?A=C"}]}},{"id":"05-03-009","c":"05","t":"05-03","n":"09","q":"下列何者非租賃住宅委託管理定型化契約應記載及不得記載事項委託人終止契約事由？","o":["受託人依約應代為糾紛協調處理，經委託人定相當期間催告，屆期仍不處理","受託人違反交付代收租金或押金之約定，經委託人定相當期間催告，屆期仍未交付","受託人委託他代管業執行租賃住宅管理業務","房客因刑案遭通緝失聯"],"a":"D","ty":"neg","e":{"s":"ok","x":"委託管理應記載事項第十一點：委託人得提前終止契約之情形為受託人違反代為協調處理租賃糾紛之規定經催告仍不處理、違反依期限交付代收租金或押金之規定經催告仍不交付、委託他代管業執行管理業務，以及租賃關係消滅、標的滅失、受託人經撤銷或廢止許可或登記；「房客因刑案遭通緝失聯」不在其列，故選(D)。","b":[{"k":"law","l":"租賃住宅委託管理定型化契約應記載及不得記載事項（內政部）","r":"應記載事項第十一點第(一)款","q":"受託人違反第九點第一項第六款代為協調處理租賃糾紛之規定，經委託人定相當期間催告，仍不於期限內處理。","u":"https://www.ey.gov.tw/File/73851B219A5EC2CB?A=C"},{"k":"law","l":"租賃住宅委託管理定型化契約應記載及不得記載事項（內政部）","r":"應記載事項第十一點第(二)款","q":"受託人違反第九點第一項第七款依期限交付代為收取之租金或押金之規定，經委託人定相當期間催告，仍不於期限內交付。","u":"https://www.ey.gov.tw/File/73851B219A5EC2CB?A=C"},{"k":"law","l":"租賃住宅委託管理定型化契約應記載及不得記載事項（內政部）","r":"應記載事項第十一點第(三)款","q":"受託人違反第九點第一項第十一款規定，委託他代管業執行租賃住宅管理業務。","u":"https://www.ey.gov.tw/File/73851B219A5EC2CB?A=C"},{"k":"law","l":"租賃住宅委託管理定型化契約應記載及不得記載事項（內政部）","r":"應記載事項第十一點第(四)至(六)款","m":"委託管理標的之租賃關係消滅；標的全部滅失或一部滅失且存餘部分難以繼續居住；受託人經主管機關撤銷、廢止許可或租賃住宅服務業登記。","u":"https://www.ey.gov.tw/File/73851B219A5EC2CB?A=C"}]}},{"id":"05-03-010","c":"05","t":"05-03","n":"10","q":"關於租賃住宅委託管理定型化契約應記載及不得記載事項，下列敘述何者有誤？","o":["管理期間，受託人不論任何情形都須負擔設備修繕費用。","管理期間，受託人於租期屆滿或租約提前終止時，代為執行屋況及設備點交","管理期間，受託人代為辦理日常修繕維護事務，應製作紀錄提供委託人查詢或取閱","管理期間，受託人代為協調處理租賃糾紛"],"a":"A","ty":"neg","e":{"s":"ok","x":"委託管理應記載事項第七點：租賃契約約定由委託人負責修繕者，得委由受託人修繕，其費用由委託人負擔；約定由承租人負責修繕及負擔費用者，受託人代為督促，故受託人並非「不論任何情形」都須負擔修繕費用；(B)見第九點第(三)款、(C)見第九點第(五)款、(D)見第五點第(五)款，均為正確，故選(A)。","b":[{"k":"law","l":"租賃住宅委託管理定型化契約應記載及不得記載事項（內政部）","r":"應記載事項第七點第1項","q":"委託管理標的經租賃契約約定由委託人負責修繕者，得委由受託人修繕；其費用，由委託人負擔。","u":"https://www.ey.gov.tw/File/73851B219A5EC2CB?A=C"},{"k":"law","l":"租賃住宅委託管理定型化契約應記載及不得記載事項（內政部）","r":"應記載事項第七點第2項","q":"委託管理標的經租賃契約約定由承租人負責修繕及負擔費用者，得由受託人代為督促之；承租人對於應負責修繕之項目或費用有爭執時，受託人應代為協調。","u":"https://www.ey.gov.tw/File/73851B219A5EC2CB?A=C"},{"k":"law","l":"租賃住宅委託管理定型化契約應記載及不得記載事項（內政部）","r":"應記載事項第九點第(三)款","q":"依第五點第一款規定，代為執行屋況與設備點交者，應於租賃期間屆滿或租賃契約提前終止時，先行協助結算相關費用、製作代收代付清單","u":"https://www.ey.gov.tw/File/73851B219A5EC2CB?A=C"},{"k":"law","l":"租賃住宅委託管理定型化契約應記載及不得記載事項（內政部）","r":"應記載事項第九點第(五)款","q":"依第五點第四款或第八款第五目規定，代為辦理日常修繕維護或清潔事務者，應製作執行紀錄，提供委託人查詢或取閱。","u":"https://www.ey.gov.tw/File/73851B219A5EC2CB?A=C"},{"k":"law","l":"租賃住宅委託管理定型化契約應記載及不得記載事項（內政部）","r":"應記載事項第五點第(五)款","q":"糾紛協調處理。","u":"https://www.ey.gov.tw/File/73851B219A5EC2CB?A=C"}]}},{"id":"05-03-011","c":"05","t":"05-03","n":"11","q":"受託人代收押金或租金者，應於代收幾日內，交付委託人？","o":["當日","30日","7日","5日"],"a":"B","ty":"num","e":{"s":"ok","x":"委託管理應記載事項第九點第(七)款：受託人代為收取租金或押金者，應按約定交付方式，於代為收取之日起＿日（不得超過三十日）內交付委託人，故選(B)。","b":[{"k":"law","l":"租賃住宅委託管理定型化契約應記載及不得記載事項（內政部）","r":"應記載事項第九點第(七)款","q":"依第五點第八款第一目或第二目規定，代為收取租金或押金者，應按約定交付方式，於代為收取之日起＿日(不得超過三十日)內交付委託人。","u":"https://www.ey.gov.tw/File/73851B219A5EC2CB?A=C"}],"nt":"規範以空格由雙方約定日數，上限為三十日。"}},{"id":"05-03-012","c":"05","t":"05-03","n":"12","q":"依據租賃住宅委託管理定型化契約應記載及不得記載事項規定，下列何者非屬受託人之責任與義務？","o":["代為糾紛協調處理","依期限交付代收之押金與租金","委託他代管業執行租賃住宅管理業務","應配合委託人申請減徵稅捐需要，提供相關證明。"],"a":"C","ty":"neg","e":{"s":"ok","x":"委託管理應記載事項第九點第(十一)款明定受託人「不得委託他代管業執行租賃住宅管理業務」（違反者委託人依第十一點第(三)款得提前終止）；代為糾紛協調處理（第五點第(五)款）、依期限交付代收之押金租金（第九點第(七)款）、配合申請減徵稅捐提供證明（第九點第(十)款）則屬受託人之責任與義務，故選(C)。","b":[{"k":"law","l":"租賃住宅委託管理定型化契約應記載及不得記載事項（內政部）","r":"應記載事項第九點第(十一)款","q":"不得委託他代管業執行租賃住宅管理業務。","u":"https://www.ey.gov.tw/File/73851B219A5EC2CB?A=C"},{"k":"law","l":"租賃住宅委託管理定型化契約應記載及不得記載事項（內政部）","r":"應記載事項第九點第(十)款","q":"應配合委託人申請減徵稅捐需要，提供相關證明。","u":"https://www.ey.gov.tw/File/73851B219A5EC2CB?A=C"},{"k":"law","l":"租賃住宅委託管理定型化契約應記載及不得記載事項（內政部）","r":"應記載事項第五點第(五)款","q":"糾紛協調處理。","u":"https://www.ey.gov.tw/File/73851B219A5EC2CB?A=C"},{"k":"law","l":"租賃住宅委託管理定型化契約應記載及不得記載事項（內政部）","r":"應記載事項第九點第(七)款","q":"依第五點第八款第一目或第二目規定，代為收取租金或押金者，應按約定交付方式，於代為收取之日起＿日(不得超過三十日)內交付委託人。","u":"https://www.ey.gov.tw/File/73851B219A5EC2CB?A=C"}]}},{"id":"05-03-013","c":"05","t":"05-03","n":"13","q":"下列何者非租賃住宅委託管理定型化契約應記載事項中委託管理標的應記載事項？","o":["專有部分建號","共有部分建號","公有部分建號","車位"],"a":"C","ty":"neg","e":{"s":"ok","x":"委託管理應記載事項第二點第(一)款「租賃住宅標示」應記載專有部分建號、共有部分建號及車位等，並無「公有部分建號」之記載項目，故選(C)。","b":[{"k":"law","l":"租賃住宅委託管理定型化契約應記載及不得記載事項（內政部）","r":"應記載事項第二點第(一)款第2目","q":"2.專有部分建號___，權利範圍___，面積共計___平方公尺。","u":"https://www.ey.gov.tw/File/73851B219A5EC2CB?A=C"},{"k":"law","l":"租賃住宅委託管理定型化契約應記載及不得記載事項（內政部）","r":"應記載事項第二點第(一)款第3目","q":"3.共有部分建號__，權利範圍__，持分面積__平方公尺。","u":"https://www.ey.gov.tw/File/73851B219A5EC2CB?A=C"},{"k":"law","l":"租賃住宅委託管理定型化契約應記載及不得記載事項（內政部）","r":"應記載事項第二點第(一)款第4目","q":"4.車位：□有(汽車停車位__個、機車停車位__個)□無。","u":"https://www.ey.gov.tw/File/73851B219A5EC2CB?A=C"}]}},{"id":"05-03-014","c":"05","t":"05-03","n":"14","q":"下列何者非屬租賃住宅委託管理定型化契約應記載及不得記載事項中，停車位記載情形？","o":["停車位種類及編號","平面式或機械式","他項權利之登記","使用時間"],"a":"C","ty":"neg","e":{"s":"ok","x":"委託管理應記載事項第二點第(二)款「委託管理範圍」之車位，應記載汽車停車位種類及編號（地上（下）層別、平面式或機械式停車位、編號）及使用時間（全日、日間、夜間、其他）；「有無設定他項權利」係第二點第(一)款對租賃住宅標示之記載，非停車位之記載項目，故選(C)。","b":[{"k":"law","l":"租賃住宅委託管理定型化契約應記載及不得記載事項（內政部）","r":"應記載事項第二點第(二)款第2目第(1)小目","m":"車位應記載「汽車停車位種類及編號」：地上(下)第__層□平面式停車位□機械式停車位，編號第__號。","u":"https://www.ey.gov.tw/File/73851B219A5EC2CB?A=C"},{"k":"law","l":"租賃住宅委託管理定型化契約應記載及不得記載事項（內政部）","r":"應記載事項第二點第(二)款第2目（使用時間）","q":"□全日□日間□夜間□其他___。","u":"https://www.ey.gov.tw/File/73851B219A5EC2CB?A=C"},{"k":"law","l":"租賃住宅委託管理定型化契約應記載及不得記載事項（內政部）","r":"應記載事項第二點第(一)款第5目","q":"5.□有□無設定他項權利，若有，權利種類：______。","u":"https://www.ey.gov.tw/File/73851B219A5EC2CB?A=C"}]}},{"id":"05-03-015","c":"05","t":"05-03","n":"15","q":"下列何者非為租賃住宅委託管理定型化契約應記載及不得記載事項中的租賃標的？","o":["套房","雅房","公寓","店面"],"a":"D","ty":"neg","e":{"s":"ok","x":"租賃條例第3條第1款（簡報法5-1頁4）：租賃住宅指以出租供居住使用之建築物；委託管理應記載事項第六點亦明定委託管理標的係供居住使用。套房、雅房、公寓均屬供居住之住宅（簡報法5-5頁176提及租用雅房、套房或整層住宅），店面則屬營業使用，非租賃住宅，故選(D)。","b":[{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－租賃住宅相關法規與實務（法5-1～法5-5）","r":"頁碼4（PDF第5頁）","q":"租賃住宅：指以出租供居住使用之建築物。"},{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－租賃住宅相關法規與實務（法5-1～法5-5）","r":"頁碼176（PDF第177頁）","q":"若是租用雅房或套房者"},{"k":"law","l":"租賃住宅委託管理定型化契約應記載及不得記載事項（內政部）","r":"應記載事項第六點","m":"委託管理標的係供居住使用；承租人如變更用途、違法使用或存放爆炸性、易燃性物品等，受託人應予制止並向委託人報告、提出處理建議。","u":"https://www.ey.gov.tw/File/73851B219A5EC2CB?A=C"},{"k":"law","l":"租賃住宅市場發展及管理條例","r":"第3條第1款","q":"租賃住宅：指以出租供居住使用之建築物。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060125"}]}},{"id":"05-03-016","c":"05","t":"05-03","n":"16","q":"下列就租賃住宅委託管理定型化契約應記載及不得記載事項委託管理期間的報酬的記載何者正確？","o":["受託人的報酬最高上限為月租金的6%","受託人的報酬最高上限為月租金的5%","受託人的報酬最高上限為月租金的10%","沒有上限的規範"],"a":"D","ty":"neg","e":{"s":"ok","x":"委託管理應記載事項第四點：報酬由雙方約定為委託管理標的月租金額百分之＿＿或新臺幣＿元，僅規定受託人於委託管理期間非有正當理由不得要求調漲報酬，並未訂定報酬上限，故選(D)。","b":[{"k":"law","l":"租賃住宅委託管理定型化契約應記載及不得記載事項（內政部）","r":"應記載事項第四點第1項","m":"委託人應按月或按期給付報酬，報酬為月租金額百分之＿＿或新臺幣＿元（空格由雙方填寫），非有正當理由不得拖延或拒絕；受託人於委託管理期間非有正當理由亦不得要求調漲報酬。條文未設報酬比例上限。","u":"https://www.ey.gov.tw/File/73851B219A5EC2CB?A=C"}]}},{"id":"05-03-017","c":"05","t":"05-03","n":"17","q":"下列何者不是租賃住宅委託管理定型化契約應記載及不得記載事項的委託管理項目？","o":["屋況與設備點交","居住者身分之確認","房客欠租時，以業者名義向法院聲請對房客發支付命令","向承租人催收(繳)租金及相關費用"],"a":"C","ty":"neg","e":{"s":"ok","x":"委託管理應記載事項第五點所列受託人代為管理項目為屋況與設備點交、居住者身分之確認、向承租人催收(繳)租金及相關費用、日常修繕維護、糾紛協調處理、結算相關費用、租賃關係消滅時督促返還等，並無以業者名義向法院聲請支付命令之項目，故選(C)。","b":[{"k":"law","l":"租賃住宅委託管理定型化契約應記載及不得記載事項（內政部）","r":"應記載事項第五點第(一)款","q":"屋況與設備點交。","u":"https://www.ey.gov.tw/File/73851B219A5EC2CB?A=C"},{"k":"law","l":"租賃住宅委託管理定型化契約應記載及不得記載事項（內政部）","r":"應記載事項第五點第(二)款","q":"居住者身分之確認。","u":"https://www.ey.gov.tw/File/73851B219A5EC2CB?A=C"},{"k":"law","l":"租賃住宅委託管理定型化契約應記載及不得記載事項（內政部）","r":"應記載事項第五點第(三)款","q":"向承租人催收(繳)租金及相關費用。","u":"https://www.ey.gov.tw/File/73851B219A5EC2CB?A=C"},{"k":"law","l":"租賃住宅委託管理定型化契約應記載及不得記載事項（內政部）","r":"應記載事項第五點第(四)至(八)款","m":"日常修繕維護事項、糾紛協調處理、結算相關費用、租賃關係消滅時督促承租人返還租賃住宅並遷出戶籍，及得勾選之收取租金押金、管理押金、墊付費用、共用空間清潔、遺留物處理、租購家具電器等。","u":"https://www.ey.gov.tw/File/73851B219A5EC2CB?A=C"}]}},{"id":"05-03-018","c":"05","t":"05-03","n":"18","q":"下列有關租賃住宅委託管理定型化契約應記載及不得記載事項委託人義務的敘述，何者有誤？","o":["委託人負責修繕者，得委由受託人修繕;其費用不得約定由委託人負擔","據實提供附件之委託管理標的現況確認書相關資訊，並確保合於租賃契約所約定居住使用之狀態","應出示有權委託管理本租賃住宅之證明文件、國民身分證或其他足資證明身分之文件供核對","同意受託人代收租金、押金者，並應提供交付之方式"],"a":"A","ty":"neg","e":{"s":"ok","x":"委託管理應記載事項第七點第1項：租賃契約約定由委託人負責修繕者，得委由受託人修繕，其費用「由委託人負擔」，(A)稱不得約定由委託人負擔有誤；(B)為第八點第1項、(C)(D)為第八點第2項之規定，故選(A)。","b":[{"k":"law","l":"租賃住宅委託管理定型化契約應記載及不得記載事項（內政部）","r":"應記載事項第七點第1項","q":"委託管理標的經租賃契約約定由委託人負責修繕者，得委由受託人修繕；其費用，由委託人負擔。","u":"https://www.ey.gov.tw/File/73851B219A5EC2CB?A=C"},{"k":"law","l":"租賃住宅委託管理定型化契約應記載及不得記載事項（內政部）","r":"應記載事項第八點第1項","q":"委託人應據實提供附件之委託管理標的現況確認書相關資訊，並確保合於租賃契約所約定居住使用之狀態。","u":"https://www.ey.gov.tw/File/73851B219A5EC2CB?A=C"},{"k":"law","l":"租賃住宅委託管理定型化契約應記載及不得記載事項（內政部）","r":"應記載事項第八點第2項","q":"簽訂本契約時，委託人應出示有權委託管理本租賃住宅之證明文件、國民身分證或其他足資證明身分之文件，供受託人核對；如有同意受託人代為收取租金、押金者，並應提供交付之方式。","u":"https://www.ey.gov.tw/File/73851B219A5EC2CB?A=C"}]}},{"id":"05-03-019","c":"05","t":"05-03","n":"19","q":"下列有關租賃住宅委託管理定型化契約應記載及不得記載事項受託人義務的敘述，何者有誤？","o":["租賃關係消滅，督促承租人返還租賃住宅，但承租人置之不理，得逕行斷水斷電","租賃關係消滅，督促承租人返還租賃住宅時，仍應依照法律規定為之","租賃關係消滅，督促承租人返還租賃住宅，並結算相關費用","向承租人催收(繳)租金及相關費用"],"a":"A","ty":"neg","e":{"s":"ok","x":"委託管理應記載事項第十點第1項：租賃關係消滅時，受託人應結算相關費用並督促承租人返還租賃住宅（(C)正確），第五點第(三)款受託人代為向承租人催收(繳)租金及相關費用（(D)正確）；簡報（法5-5）頁177：房客欠租只是民事糾紛，房東斷水斷電已造成房客無法使用房屋，會觸犯刑法強制罪，故督促返還仍應依法為之，不得逕行斷水斷電，故選(A)。","b":[{"k":"law","l":"租賃住宅委託管理定型化契約應記載及不得記載事項（內政部）","r":"應記載事項第十點第1項","q":"委託管理標的之租賃關係消滅時，受託人應即結算相關費用，督促承租人將租賃住宅返還委託人，並遷出戶籍或其他登記。","u":"https://www.ey.gov.tw/File/73851B219A5EC2CB?A=C"},{"k":"law","l":"租賃住宅委託管理定型化契約應記載及不得記載事項（內政部）","r":"應記載事項第五點第(三)款","q":"向承租人催收(繳)租金及相關費用。","u":"https://www.ey.gov.tw/File/73851B219A5EC2CB?A=C"},{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－租賃住宅相關法規與實務（法5-1～法5-5）","r":"頁碼177（PDF第178頁）","q":"房客欠租只是民事糾紛，但是房東斷水斷電的行為，已經造成房客無法使用房屋，這樣會觸犯刑法強制罪"}]}},{"id":"05-04-001","c":"05","t":"05-04","n":"01","q":"住宅租賃定型化契約應記載及不得記載事項中，下列哪一項費用，出租人及承租人不得自由約定由其中一方負擔？","o":["租賃期間之社區管理費","租賃期間之房屋稅","租賃期間之水電費","公證費"],"a":"B","ty":"neg","e":{"s":"ok","x":"住宅租賃應記載事項第七點第(一)款：租賃住宅之房屋稅、地價稅由出租人負擔（不得記載事項第五點並禁止將出租人負擔之稅賦增加部分轉由承租人負擔）；管理費、水電費依第六點勾選由出租人或承租人負擔，公證費依第七點第(二)款勾選負擔方式，故選(B)。","b":[{"k":"law","l":"住宅租賃定型化契約應記載及不得記載事項（內政部）","r":"應記載事項第七點第(一)款","q":"租賃住宅之房屋稅、地價稅由出租人負擔。","u":"https://www.ey.gov.tw/File/43BC094940995CFC?A=C"},{"k":"law","l":"住宅租賃定型化契約應記載及不得記載事項（內政部）","r":"不得記載事項第五點","q":"不得記載應由出租人負擔之稅賦，若較出租前增加時，其增加部分由承租人負擔。","u":"https://www.ey.gov.tw/File/43BC094940995CFC?A=C"},{"k":"law","l":"住宅租賃定型化契約應記載及不得記載事項（內政部）","r":"應記載事項第六點第(一)至(三)款","m":"管理費、水費、電費均以勾選方式約定「由出租人負擔」或「由承租人負擔」（或其他）。","u":"https://www.ey.gov.tw/File/43BC094940995CFC?A=C"},{"k":"law","l":"住宅租賃定型化契約應記載及不得記載事項（內政部）","r":"應記載事項第七點第(二)款","m":"雙方同意辦理公證者，公證費得勾選由出租人負擔、由承租人負擔、由租賃雙方平均負擔或其他。","u":"https://www.ey.gov.tw/File/43BC094940995CFC?A=C"}],"nt":"簡報（實2-2）頁44引最高法院判例謂民法第427條稅捐負擔非強制規定，係就一般租約而言；本題問定型化契約應記載事項，依第七點第(一)款房屋稅由出租人負擔。"}},{"id":"05-04-002","c":"05","t":"05-04","n":"02","q":"住宅租賃定型化契約應記載及不得記載事項中，下列何者非屬房屋租賃標的應記載事項？","o":["有無預告登記","有無查封登記","主建物","有無設定他項權利"],"a":"A","ty":"neg","e":{"s":"ok","x":"住宅租賃應記載事項第二點第(一)款「租賃住宅標示」須記載主建物、有無設定他項權利及有無查封登記，並無「預告登記」之記載項目，故選(A)。","b":[{"k":"law","l":"住宅租賃定型化契約應記載及不得記載事項（內政部）","r":"應記載事項第二點第(一)款第5目","q":"5、□有□無設定他項權利，若有，權利種類：_______。","u":"https://www.ey.gov.tw/File/43BC094940995CFC?A=C"},{"k":"law","l":"住宅租賃定型化契約應記載及不得記載事項（內政部）","r":"應記載事項第二點第(一)款第6目","q":"6、□有□無查封登記。","u":"https://www.ey.gov.tw/File/43BC094940995CFC?A=C"},{"k":"law","l":"住宅租賃定型化契約應記載及不得記載事項（內政部）","r":"應記載事項第二點第(一)款第2目第(1)小目","m":"應記載主建物面積（各層面積、合計）及用途；全文無「預告登記」字樣。","u":"https://www.ey.gov.tw/File/43BC094940995CFC?A=C"}]}},{"id":"05-04-003","c":"05","t":"05-04","n":"03","q":"依據住宅租賃定型化契約應記載及不得記載事項中契約如經公證者，下列何事項不是得逕為強制執行事項？","o":["承租人如於租期屆滿後不返還租賃住宅","承租人未依約給付之欠繳租金、費用及出租人或租賃標的所有權人代繳之管理費，或違約時應支付之金額","出租人如於租期屆滿或本契約終止時，應返還之全部或一部押金","出租人提前終止租約後，承租人不願搬離者"],"a":"D","ty":"neg","e":{"s":"ok","x":"住宅租賃應記載事項第二十一點第2項：契約經公證者，雙方得同意公證書載明逕受強制執行之事項為承租人於租期屆滿後不返還租賃住宅、承租人欠繳之租金費用及代繳之管理費或違約時應支付之金額、出租人於租期屆滿或契約終止時應返還之押金；並不包括「出租人提前終止租約後承租人不願搬離」，故選(D)。","b":[{"k":"law","l":"住宅租賃定型化契約應記載及不得記載事項（內政部）","r":"應記載事項第二十一點第2項第1款","q":"□一、承租人如於租期屆滿後不返還租賃住宅。","u":"https://www.ey.gov.tw/File/43BC094940995CFC?A=C"},{"k":"law","l":"住宅租賃定型化契約應記載及不得記載事項（內政部）","r":"應記載事項第二十一點第2項第2款","m":"承租人未依約給付之欠繳租金、費用及出租人或租賃住宅所有權人代繳之管理費，或違約時應支付之金額。","u":"https://www.ey.gov.tw/File/43BC094940995CFC?A=C"},{"k":"law","l":"住宅租賃定型化契約應記載及不得記載事項（內政部）","r":"應記載事項第二十一點第2項第3款","q":"□三、出租人如於租期屆滿或本契約終止時，應返還承租人之全部或一部押金。","u":"https://www.ey.gov.tw/File/43BC094940995CFC?A=C"},{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－租賃管理與糾紛實務（實2-1～實2-2）","r":"頁碼20（PDF第21頁）","q":"一旦任何一方有違反公證強制執行條款之行為，即可向法院申請強制執行"}]}},{"id":"05-04-004","c":"05","t":"05-04","n":"04","q":"住宅租賃定型化契約應記載及不得記載事項中，下列非屬事項規定之「使用房屋之限制」？","o":["承租人不得於屋內飼養寵物","房屋係供住宅使用，非經出租人同意，不得變更用途","承租人不得違法使用或存放有爆炸性或易燃性物品，影響公共安全","出租人同意轉租者，承租人應提示出租人同意轉租之證明文件。"],"a":"A","ty":"neg","e":{"s":"ok","x":"住宅租賃應記載事項第八點（使用租賃住宅之限制）：租賃住宅供居住使用不得變更用途、不得違法使用或存放爆炸性或易燃性物品、轉租應經出租人同意並出具同意書供向次承租人提示，並無禁止飼養寵物之規定；簡報（實2-1）頁21亦將「可否飼養寵物」列為雙方應另於契約載明之特別約定事項，故選(A)。","b":[{"k":"law","l":"住宅租賃定型化契約應記載及不得記載事項（內政部）","r":"應記載事項第八點第1項","q":"本租賃住宅係供居住使用，承租人不得變更用途。","u":"https://www.ey.gov.tw/File/43BC094940995CFC?A=C"},{"k":"law","l":"住宅租賃定型化契約應記載及不得記載事項（內政部）","r":"應記載事項第八點第2項","q":"承租人同意遵守公寓大廈規約或其他住戶應遵行事項，不得違法使用、存放有爆炸性或易燃性物品。","u":"https://www.ey.gov.tw/File/43BC094940995CFC?A=C"},{"k":"law","l":"住宅租賃定型化契約應記載及不得記載事項（內政部）","r":"應記載事項第八點第4項","q":"前項出租人同意轉租者，應出具同意書(如附件二)載明同意轉租之範圍、期間及得終止本契約之事由，供承租人轉租時向次承租人提示。","u":"https://www.ey.gov.tw/File/43BC094940995CFC?A=C"},{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－租賃管理與糾紛實務（實2-1～實2-2）","r":"頁碼21（PDF第22頁）","q":"如可否飼養寵物、可否開放異性入內"}],"nt":"現行第八點標題為「使用租賃住宅之限制」，第1項為「承租人不得變更用途」，與選項(B)「非經出租人同意，不得變更用途」用語略有不同，不影響本題答案。"}},{"id":"05-04-005","c":"05","t":"05-04","n":"05","q":"住宅租賃定型化契約應記載及不得記載事項中，下列哪一項費用，出租人及承租人得自由約定由其中一方負擔？","o":["房屋稅","地價稅","所得稅","公證費"],"a":"D","ty":"neg","e":{"s":"ok","x":"住宅租賃應記載事項第七點：第(一)款房屋稅、地價稅明定由出租人負擔；第(二)款公證費則列有由出租人、承租人、雙方平均負擔或其他等選項供雙方約定；所得稅係出租人就租金收入所生之租賃所得（簡報法5-2頁76），規範未列為得約定由一方負擔之費用，故選(D)。","b":[{"k":"law","l":"住宅租賃定型化契約應記載及不得記載事項（內政部）","r":"應記載事項第七點第(一)款","q":"租賃住宅之房屋稅、地價稅由出租人負擔。","u":"https://www.ey.gov.tw/File/43BC094940995CFC?A=C"},{"k":"law","l":"住宅租賃定型化契約應記載及不得記載事項（內政部）","r":"應記載事項第七點第(二)款","m":"雙方同意辦理公證者，公證費得勾選由出租人負擔、由承租人負擔、由租賃雙方平均負擔或其他。","u":"https://www.ey.gov.tw/File/43BC094940995CFC?A=C"},{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－租賃住宅相關法規與實務（法5-1～法5-5）","r":"頁碼76（PDF第77頁）","q":"租賃所得是指在中華民國境內，出租財產的租金所得"}],"nt":"第七點第(三)款另有「其他稅費及其支付方式」空白欄，規範未就所得稅另作明文。"}},{"id":"05-04-006","c":"05","t":"05-04","n":"06","q":"下列何者非屬住宅租賃定型化契約應記載及不得記載事項中車位記載情形？","o":["停車位種類及編號","平面式或機械式","使用時間","他項權利之登記"],"a":"D","ty":"neg","e":{"s":"ok","x":"住宅租賃應記載事項第二點第(二)款「租賃範圍」之車位，應記載汽車停車位種類及編號（地上（下）層別、平面式或機械式停車位、編號）及使用時間（全日、日間、夜間、其他）；「有無設定他項權利」係第二點第(一)款租賃住宅標示之記載，非車位之記載項目，故選(D)。","b":[{"k":"law","l":"住宅租賃定型化契約應記載及不得記載事項（內政部）","r":"應記載事項第二點第(二)款第2目第(1)小目","m":"車位（如無則免填）：(1)汽車停車位種類及編號：地上(下）第__層□平面式停車位□機械式停車位，編號第__號。","u":"https://www.ey.gov.tw/File/43BC094940995CFC?A=C"},{"k":"law","l":"住宅租賃定型化契約應記載及不得記載事項（內政部）","r":"應記載事項第二點第(二)款第2目（使用時間）","q":"□全日□日間□夜間□其他___。","u":"https://www.ey.gov.tw/File/43BC094940995CFC?A=C"},{"k":"law","l":"住宅租賃定型化契約應記載及不得記載事項（內政部）","r":"應記載事項第二點第(一)款第5目","q":"5、□有□無設定他項權利，若有，權利種類：_______。","u":"https://www.ey.gov.tw/File/43BC094940995CFC?A=C"}]}},{"id":"05-04-007","c":"05","t":"05-04","n":"07","q":"下列何者非屬住宅租賃定型化契約應記載及不得記載事項中租賃住宅標的應記載事項？","o":["門牌","附屬建物用途","格局","車位"],"a":"C","ty":"neg","e":{"s":"ok","x":"住宅租賃應記載事項第二點第(一)款「租賃住宅標示」應記載門牌、專有部分建號及主建物、附屬建物用途與面積、共有部分、車位等，未將「格局」列為標示項目，故選(C)。","b":[{"k":"law","l":"住宅租賃定型化契約應記載及不得記載事項（內政部）","r":"應記載事項第二點第(一)款第2目第(2)小目","q":"(2)附屬建物用途__，面積__平方公尺。","u":"https://www.ey.gov.tw/File/43BC094940995CFC?A=C"},{"k":"law","l":"住宅租賃定型化契約應記載及不得記載事項（內政部）","r":"應記載事項第二點第(一)款第4目","q":"4、車位：□有（汽車停車位__個、機車停車位__個）□無。","u":"https://www.ey.gov.tw/File/43BC094940995CFC?A=C"},{"k":"law","l":"住宅租賃定型化契約應記載及不得記載事項（內政部）","r":"應記載事項第二點第(一)款第1目","m":"應記載門牌（縣市、鄉鎮市區、街路、段巷弄號樓），無門牌者記載房屋稅籍編號或位置略圖。","u":"https://www.ey.gov.tw/File/43BC094940995CFC?A=C"}],"nt":"「格局」僅見於第二點第(二)款租賃範圍所附「租賃住宅位置格局示意圖」（標註租賃範圍用）及附件一現況確認書第2項「建物現況格局」，非第二點第(一)款之標示項目。"}},{"id":"05-04-008","c":"05","t":"05-04","n":"08","q":"住宅租賃定型化契約應記載及不得記載事項中租賃住宅返還之規定，下列何者有誤？","o":["租期屆滿或租賃契約終止時，出租人應結算相關費用，承租人應即將租賃住宅返還出租人並遷出戶籍或其他登記","租賃住宅之返還，應由租賃雙方共同完成屋況及附屬設備之點交手續。租賃之一方未會同點交，經他方定相當期限催告仍不會同者，視為完成點交","承租人未依第一項規定返還租賃住宅時，出租人除按日向承租人請求未返還房屋期間之相當月租金額外，並得請求相當月租金額計算之違約金(未足1個月者，以日租金折算)至返還為止","承租人未如期返還租賃住宅所應賠償的違約金，不得由押金中抵扣"],"a":"D","ty":"neg","e":{"s":"ok","x":"住宅租賃應記載事項第十五點第4項：承租人未返還租賃住宅所生之相當月租金額及違約金，與未繳清之租金、相關費用，出租人得由押金中抵充，不足並得請求給付，故(D)「不得由押金中抵扣」有誤；(A)(B)(C)分別為第十五點第1、2、3項之規定，故選(D)。","b":[{"k":"law","l":"住宅租賃定型化契約應記載及不得記載事項（內政部）","r":"應記載事項第十五點第4項","q":"前項金額與承租人未繳清之租金及第六點約定之相關費用，出租人得由第五點第一項規定之押金中抵充，如有不足，並得向承租人請求給付不足之金額或費用。","u":"https://www.ey.gov.tw/File/43BC094940995CFC?A=C"},{"k":"law","l":"住宅租賃定型化契約應記載及不得記載事項（內政部）","r":"應記載事項第十五點第2項","q":"前項租賃之一方未會同點交，經他方定相當期限催告仍不會同者，視為完成點交。","u":"https://www.ey.gov.tw/File/43BC094940995CFC?A=C"},{"k":"law","l":"住宅租賃定型化契約應記載及不得記載事項（內政部）","r":"應記載事項第十五點第3項","m":"承租人未依第一項返還租賃住宅時，出租人應即明示不以不定期限繼續契約，並得請求未返還期間之相當月租金額，及相當月租金額計算之違約金（未足一個月者以日租金折算）至返還為止。","u":"https://www.ey.gov.tw/File/43BC094940995CFC?A=C"}]}},{"id":"05-04-009","c":"05","t":"05-04","n":"09","q":"住宅租賃定型化契約應記載及不得記載事項中，關於「任意終止租約之約定」之規定，下列何者有誤？","o":["契約於期限屆滿前，租賃雙方得協議是否得提前終止租約","依約定得終止租約者，租賃之一方應於期限內通知他方。一方未先期通知而逕自終止租約者，應賠償他方最高2個月租金額之違約金","承租人應賠償之違約金得由押金扣抵","租期屆滿前，依第2項終止租約者，出租人已預收之租金應返還予承租人"],"a":"B","ty":"neg","e":{"s":"ok","x":"住宅租賃應記載事項第十四點第2項（簡報實2-1頁30同引）：一方未為先期通知而逕行終止租約者，應賠償他方「最高不得超過一個月租金額」之違約金，(B)稱最高2個月有誤；(A)(C)(D)分別符合第十四點第1、3、4項，故選(B)。","b":[{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－租賃管理與糾紛實務（實2-1～實2-2）","r":"頁碼30（PDF第31頁）","q":"一方未為先期通知而逕行終止租約者，應賠償他方最高不得超過一個月租金額之違約金。"},{"k":"law","l":"住宅租賃定型化契約應記載及不得記載事項（內政部）","r":"應記載事項第十四點第2項","q":"一方未為先期通知而逕行終止租約者，應賠償他方最高不得超過一個月租金額之違約金。","u":"https://www.ey.gov.tw/File/43BC094940995CFC?A=C"},{"k":"law","l":"住宅租賃定型化契約應記載及不得記載事項（內政部）","r":"應記載事項第十四點第3項","q":"前項承租人應賠償之違約金，得由第五點第一項規定之押金中抵充，如有不足，並得向承租人請求給付不足之金額。","u":"https://www.ey.gov.tw/File/43BC094940995CFC?A=C"}],"nt":"選項(D)「依第2項終止租約者」，現行第十四點第4項文字為「依第一項終止租約者」，不影響答案。"}},{"id":"05-04-010","c":"05","t":"05-04","n":"10","q":"住宅租賃定型化契約應記載及不得記載事項中，關於「任意終止租約」之規定，下列何者有誤？","o":["契約於期限屆滿前，租賃雙方得協議是否得提前終止租約","依約定得終止租約者，租賃之一方應於期限內通知他方。一方未先期通知而逕自終止租約者，應賠償他方最高1個月租金額之違約金","承租人應賠償之違約金不得由押金扣抵","租期屆滿前，依第2項終止租約者，出租人已預收之租金應返還予承租人"],"a":"C","ty":"neg","e":{"s":"ok","x":"住宅租賃應記載事項第十四點第3項（簡報實2-1頁30同引）：承租人應賠償之違約金「得由」押金中抵充，不足並得向承租人請求，(C)稱不得由押金扣抵有誤；(A)(B)(D)分別符合第十四點第1、2、4項，故選(C)。","b":[{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－租賃管理與糾紛實務（實2-1～實2-2）","r":"頁碼30（PDF第31頁）","q":"前項承租人應賠償之違約金，得由第五點第一項規定之押金中抵充，如有不足，並得向承租人請求給付不足之金額。"},{"k":"law","l":"住宅租賃定型化契約應記載及不得記載事項（內政部）","r":"應記載事項第十四點第3項","q":"前項承租人應賠償之違約金，得由第五點第一項規定之押金中抵充，如有不足，並得向承租人請求給付不足之金額。","u":"https://www.ey.gov.tw/File/43BC094940995CFC?A=C"},{"k":"law","l":"住宅租賃定型化契約應記載及不得記載事項（內政部）","r":"應記載事項第十四點第2項","q":"一方未為先期通知而逕行終止租約者，應賠償他方最高不得超過一個月租金額之違約金。","u":"https://www.ey.gov.tw/File/43BC094940995CFC?A=C"}],"nt":"選項(D)「依第2項終止租約者」，現行第十四點第4項文字為「依第一項終止租約者」，不影響答案。"}},{"id":"05-04-011","c":"05","t":"05-04","n":"11","q":"依據住宅租賃定型化契約應記載及不得記載事項，關於「押金」的數額不得超過相當於幾個月租金？","o":["1個月","2個月","3個月","6個月"],"a":"B","ty":"neg","e":{"s":"ok","x":"住宅租賃應記載事項第五點第1項：押金由雙方約定，最高不得超過二個月租金之總額；租賃條例第7條亦規定押金不得逾二個月之租金總額（簡報實2-2頁39），故選(B)。","b":[{"k":"law","l":"住宅租賃定型化契約應記載及不得記載事項（內政部）","r":"應記載事項第五點第1項","q":"押金由租賃雙方約定為 個月租金，金額為 元整(最高不得超過二個月租金之總額)。承租人應於簽訂本契約之同時給付出租人。","u":"https://www.ey.gov.tw/File/43BC094940995CFC?A=C"},{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－租賃管理與糾紛實務（實2-1～實2-2）","r":"頁碼39（PDF第40頁）","q":"依照租賃住宅市場發展及管理條例第七條規定，押金之金額，不得逾二個月之租金總額。"}]}},{"id":"05-04-012","c":"05","t":"05-04","n":"12","q":"住宅租賃定型化契約應記載及不得記載事項中，下列哪一項費用，可以由出租人及承租人自由約定由其中一方負擔？","o":["租賃期間之社區管理費","租賃期間之房屋稅","租賃期間之地價稅","出租人於租賃期間所衍生之所得稅"],"a":"A","ty":"neg","e":{"s":"ok","x":"住宅租賃應記載事項第六點第(一)款：管理費得勾選由出租人負擔或由承租人負擔；第七點第(一)款房屋稅、地價稅則明定由出租人負擔；所得稅係出租人就租金收入所生之租賃所得（簡報法5-2頁76），規範未列為得約定由一方負擔之費用，故選(A)。","b":[{"k":"law","l":"住宅租賃定型化契約應記載及不得記載事項（內政部）","r":"應記載事項第六點第(一)款","m":"管理費：□由出租人負擔□由承租人負擔（並記載租賃住宅、停車位每月金額）；因不可歸責於雙方之事由致費用增加者，承租人就增加部分以負擔百分之十為限。","u":"https://www.ey.gov.tw/File/43BC094940995CFC?A=C"},{"k":"law","l":"住宅租賃定型化契約應記載及不得記載事項（內政部）","r":"應記載事項第七點第(一)款","q":"租賃住宅之房屋稅、地價稅由出租人負擔。","u":"https://www.ey.gov.tw/File/43BC094940995CFC?A=C"},{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－租賃住宅相關法規與實務（法5-1～法5-5）","r":"頁碼76（PDF第77頁）","q":"租賃所得是指在中華民國境內，出租財產的租金所得"}]}},{"id":"05-04-013","c":"05","t":"05-04","n":"13","q":"依據住宅租賃定型化契約應記載及不得記載事項中，出租人於房屋交付後，承租人占有中，縱將其所有權讓與第三人，本契約對於受讓人仍繼續存在，但如本契約未經公證，其期限逾幾年即不適用？","o":["2年","3年","4年","5年"],"a":"D","ty":"neg","e":{"s":"ok","x":"住宅租賃應記載事項第十六點：出租人於租賃住宅交付後、承租人占有中縱將所有權讓與第三人，契約對受讓人仍繼續存在；但契約如未經公證，其期限逾五年者，不適用之（同民法第425條，簡報法5-2頁67），故選(D)。","b":[{"k":"law","l":"住宅租賃定型化契約應記載及不得記載事項（內政部）","r":"應記載事項第十六點第1項","q":"出租人於租賃住宅交付後，承租人占有中，縱將其所有權讓與第三人，本契約對於受讓人仍繼續存在。","u":"https://www.ey.gov.tw/File/43BC094940995CFC?A=C"},{"k":"law","l":"住宅租賃定型化契約應記載及不得記載事項（內政部）","r":"應記載事項第十六點第3項","q":"本契約如未經公證，其期限逾五年者，不適用前二項之規定。","u":"https://www.ey.gov.tw/File/43BC094940995CFC?A=C"},{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－租賃住宅相關法規與實務（法5-1～法5-5）","r":"頁碼67（PDF第68頁）","q":"前項規定，於未經公證之不動產租賃契約，其期限逾五年或未定期限者，不適用之。"}]}},{"id":"05-04-014","c":"05","t":"05-04","n":"14","q":"依據住宅租賃定型化契約應記載及不得記載事項中，出租人得因承租人遲付租金之總額達幾個月之金額，且經出租人催告仍不為支付之情形，出租人得終止租約？","o":["1個月","2個月","3個月","4個月"],"a":"B","ty":"neg","e":{"s":"ok","x":"住宅租賃應記載事項第十七點第1項第(二)款：承租人遲付租金之總額達二個月之租金額，經出租人定相當期限催告仍不為支付者，出租人得提前終止租約（簡報實2-2頁34同列），故選(B)。","b":[{"k":"law","l":"住宅租賃定型化契約應記載及不得記載事項（內政部）","r":"應記載事項第十七點第1項第(二)款","q":"承租人遲付租金之總額達二個月之租金額，經出租人定相當期限催告，仍不為支付。","u":"https://www.ey.gov.tw/File/43BC094940995CFC?A=C"},{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－租賃管理與糾紛實務（實2-1～實2-2）","r":"頁碼34（PDF第35頁）","q":"(二)承租人遲付租金之總額達二個月之租金額，經出租人定相當期限催告，仍不為支付。"}]}},{"id":"05-04-015","c":"05","t":"05-04","n":"15","q":"依據住宅租賃定型化契約應記載及不得記載事項中，有關提前終止之規定，如果雙方勾選於租約屆滿前不得任意終止租約，下列敘述何者有誤？","o":["房客要提前終止時，房東可以拒絕","房東要提前終止時，房客可以拒絕","房客可以主張抵扣兩個月押金後逕行終止租約","雖然不得單方面任意終止，但是租賃雙方可以另外協議違約金後合意終止"],"a":"C","ty":"neg","e":{"s":"ok","x":"住宅租賃應記載事項第十四點第1項（簡報實2-1頁30同引）：除依第十七點、第十八點得提前終止外，雙方勾選「不得」任意終止租約者，任一方均不得單方任意終止，另一方自可拒絕；押金抵充違約金（第十四點第3項）係以約定「得」終止為前提，故承租人不得主張以押金抵扣後逕行終止，故選(C)。","b":[{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－租賃管理與糾紛實務（實2-1～實2-2）","r":"頁碼30（PDF第31頁）","q":"本契約於期限屆滿前，除依第十七點及第十八點規定得提前終止租約外，租賃雙方□得□不得任意終止租約。"},{"k":"law","l":"住宅租賃定型化契約應記載及不得記載事項（內政部）","r":"應記載事項第十四點第1項","q":"本契約於期限屆滿前，除依第十七點及第十八點規定得提前終止租約外，租賃雙方□得□不得任意終止租約。","u":"https://www.ey.gov.tw/File/43BC094940995CFC?A=C"},{"k":"law","l":"住宅租賃定型化契約應記載及不得記載事項（內政部）","r":"應記載事項第十四點第3項","q":"前項承租人應賠償之違約金，得由第五點第一項規定之押金中抵充，如有不足，並得向承租人請求給付不足之金額。","u":"https://www.ey.gov.tw/File/43BC094940995CFC?A=C"}]}},{"id":"05-04-016","c":"05","t":"05-04","n":"16","q":"依據住宅租賃定型化契約應記載及不得記載事項中，有關提前終止之規定，如果雙方勾選於租約屆滿前得任意終止租約，下列敘述何者有誤？","o":["房客要提前終止時，只要在終止前一個月告知，就不用給付違約金","房客要提前終止時，如果沒在終止前一個月告知，就需要給付最高一個月的違約金","既然約定可以提前終止，房客要終止的話，房東不能拒絕","既然約定可以提前終止，就不需要給付違約金"],"a":"D","ty":"neg","e":{"s":"ok","x":"住宅租賃應記載事項第十四點第2項（簡報實2-1頁30同引）：約定得任意終止者，一方應至少於終止前一個月通知他方，未先期通知而逕行終止者，應賠償最高不超過一個月租金額之違約金；故即使約定得提前終止，未依期通知仍須給付違約金，(D)有誤，故選(D)。","b":[{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－租賃管理與糾紛實務（實2-1～實2-2）","r":"頁碼30（PDF第31頁）","q":"依前項約定得終止租約者，租賃之一方應至少於終止前一個月通知他方。"},{"k":"law","l":"住宅租賃定型化契約應記載及不得記載事項（內政部）","r":"應記載事項第十四點第2項","q":"依前項約定得終止租約者，租賃之一方應至少於終止前一個月通知他方。","u":"https://www.ey.gov.tw/File/43BC094940995CFC?A=C"},{"k":"law","l":"住宅租賃定型化契約應記載及不得記載事項（內政部）","r":"應記載事項第十四點第2項後段","q":"一方未為先期通知而逕行終止租約者，應賠償他方最高不得超過一個月租金額之違約金。","u":"https://www.ey.gov.tw/File/43BC094940995CFC?A=C"}]}},{"id":"05-04-017","c":"05","t":"05-04","n":"17","q":"依據住宅租賃定型化契約應記載及不得記載事項中，有關提前終止之規定，如果雙方勾選於租約屆滿前得任意終止租約，下列敘述何者有誤？","o":["只有房客終止才需要給付違約金，房東提前終止的話，不需要給付違約金","房客要提前終止時，如果沒在終止前一個月告知，就需要給付最高一個月的違約金","既然約定可以提前終止，房東要終止的話，房客不能拒絕","房東要提前終止時，只要在終止前一個月告知，就不用給付違約金"],"a":"A","ty":"neg","e":{"s":"ok","x":"住宅租賃應記載事項第十四點第2項（簡報實2-1頁30同引）：「租賃之一方」應至少於終止前一個月通知他方，「一方」未為先期通知而逕行終止者應賠償他方違約金，出租人與承租人同受規範，故(A)稱房東提前終止不需給付違約金有誤，故選(A)。","b":[{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－租賃管理與糾紛實務（實2-1～實2-2）","r":"頁碼30（PDF第31頁）","q":"一方未為先期通知而逕行終止租約者，應賠償他方最高不得超過一個月租金額之違約金。"},{"k":"law","l":"住宅租賃定型化契約應記載及不得記載事項（內政部）","r":"應記載事項第十四點第2項","q":"依前項約定得終止租約者，租賃之一方應至少於終止前一個月通知他方。","u":"https://www.ey.gov.tw/File/43BC094940995CFC?A=C"},{"k":"law","l":"住宅租賃定型化契約應記載及不得記載事項（內政部）","r":"應記載事項第十四點第2項後段","q":"一方未為先期通知而逕行終止租約者，應賠償他方最高不得超過一個月租金額之違約金。","u":"https://www.ey.gov.tw/File/43BC094940995CFC?A=C"}]}},{"id":"05-04-018","c":"05","t":"05-04","n":"18","q":"依據住宅租賃定型化契約應記載及不得記載事項中，有關提前終止之規定，如果雙方勾選於租約屆滿前得任意終止租約，下列敘述何者有誤？","o":["既然約定得提前終止租約，就代表任一方可以不附任何理由的終止，只是會因為通知的時期而有違約金之處罰","房東可以約定，不管何時通知，只要提前終止租約，就要給付最高一個月之違約金","既然約定可以提前終止，房東要終止的話，房客不能拒絕","房東要提前終止時，只要在終止前一個月告知，就不用給付違約金"],"a":"B","ty":"neg","e":{"s":"ok","x":"住宅租賃應記載事項第十四點第2項：約定得任意終止者，僅於「未為先期通知」而逕行終止時，才應賠償最高一個月租金額之違約金；依消保法第17條第4項（簡報法5-3頁100），違反公告應記載事項之定型化契約條款無效，故房東不得約定不論何時通知皆須給付違約金，(B)有誤，故選(B)。","b":[{"k":"law","l":"住宅租賃定型化契約應記載及不得記載事項（內政部）","r":"應記載事項第十四點第2項","q":"依前項約定得終止租約者，租賃之一方應至少於終止前一個月通知他方。","u":"https://www.ey.gov.tw/File/43BC094940995CFC?A=C"},{"k":"law","l":"住宅租賃定型化契約應記載及不得記載事項（內政部）","r":"應記載事項第十四點第2項後段","q":"一方未為先期通知而逕行終止租約者，應賠償他方最高不得超過一個月租金額之違約金。","u":"https://www.ey.gov.tw/File/43BC094940995CFC?A=C"},{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－租賃住宅相關法規與實務（法5-1～法5-5）","r":"頁碼100（PDF第101頁）","q":"違反第一項公告之定型化契約，其定型化契約條款無效。"}]}},{"id":"05-04-019","c":"05","t":"05-04","n":"19","q":"下列有關住宅租賃定型化契約應記載及不得記載事項之電費約定，何種錯誤？","o":["以用電度數計費者，每度電費不得超過該租賃標的電費單「當期每度平均電價」；如公共設施電費未向台灣電力股份有限公司申辦分攤併入租賃標的電費內者，包租業不得額外收取","非以用電度數計費者，包租業所收取之每期電費總金額，不得超過該租賃標的電費單之每期電費總額","約定電費由承租人負擔者，包租業應提供承租人租賃標的之電費資訊。承租人亦得逕向台灣電力股份有限公司申辦查詢租賃期間之有關電費資訊","一度就是十元，無法協商"],"a":"D","ty":"neg","e":{"s":"ok","x":"住宅租賃應記載事項第六點第(三)款：以用電度數計費者，每度電費不得超過該租賃標的電費單「當期每度平均電價」，公共設施電費未申辦分攤者不得額外收取；非以度數計費者，每期電費總金額不得超過電費單之每期電費總額；第十一點第4項並應提供電費資訊。故不得片面固定「一度十元、無法協商」，故選(D)。","b":[{"k":"law","l":"住宅租賃定型化契約應記載及不得記載事項（內政部）","r":"應記載事項第六點第(三)款","q":"□以用電度數計費者，每度電費不得超過該租賃標的電費單「當期每度平均電價」；","u":"https://www.ey.gov.tw/File/43BC094940995CFC?A=C"},{"k":"law","l":"住宅租賃定型化契約應記載及不得記載事項（內政部）","r":"應記載事項第六點第(三)款","q":"□非以用電度數計費者，出租人所收取之每期電費總金額，不得超過該租賃標的電費單之每期電費總額。","u":"https://www.ey.gov.tw/File/43BC094940995CFC?A=C"},{"k":"law","l":"住宅租賃定型化契約應記載及不得記載事項（內政部）","r":"應記載事項第十一點第4項","q":"依第六點規定約定電費由承租人負擔者，出租人應提供承租人租賃標的之電費資訊。","u":"https://www.ey.gov.tw/File/43BC094940995CFC?A=C"}],"nt":"選項用「包租業」，係住宅轉租定型化契約之用語；住宅租賃定型化契約第六點、第十一點相同規定之主體為「出租人」。簡報（實2-1）頁15、18（111年教材）所載為「不超過台電夏月及非夏月最高級距每度金額」之舊標準，現行第六點經113-07-08修正為「當期每度平均電價」，本題選項係依現行標準。"}},{"id":"05-04-020","c":"05","t":"05-04","n":"20","q":"下列有關住宅租賃定型化契約應記載及不得記載事項之電費約定，何種錯誤？","o":["以用電度數計費者，每度電費不得超過該租賃標的電費單「當期每度平均電價」；如公共設施電費未向台灣電力股份有限公司申辦分攤併入租賃標的電費內者，包租業不得額外收取","為了計算方便，獨立套房裝設各自的電表，每度收取8元，就算超過當期每度平均電價也沒關係","約定電費由承租人負擔者，包租業應提供承租人租賃標的之電費資訊。承租人亦得逕向台灣電力股份有限公司申辦查詢租賃期間之有關電費資訊","非以用電度數計費者，包租業所收取之每期電費總金額，不得超過該租賃標的電費單之每期電費總額"],"a":"B","ty":"neg","e":{"s":"ok","x":"住宅租賃應記載事項第六點第(三)款：以用電度數計費者，每度電費不得超過該租賃標的電費單「當期每度平均電價」，故(B)每度收取8元而超過當期每度平均電價亦無妨之說法有誤；(A)(C)(D)與第六點第(三)款、第十一點第4項相符，故選(B)。","b":[{"k":"law","l":"住宅租賃定型化契約應記載及不得記載事項（內政部）","r":"應記載事項第六點第(三)款","q":"□以用電度數計費者，每度電費不得超過該租賃標的電費單「當期每度平均電價」；","u":"https://www.ey.gov.tw/File/43BC094940995CFC?A=C"},{"k":"law","l":"住宅租賃定型化契約應記載及不得記載事項（內政部）","r":"應記載事項第六點第(三)款","q":"如公共設施電費未向台灣電力股份有限公司申辦分攤併入租賃標的電費內者，出租人不得額外收取。","u":"https://www.ey.gov.tw/File/43BC094940995CFC?A=C"},{"k":"law","l":"住宅租賃定型化契約應記載及不得記載事項（內政部）","r":"應記載事項第十一點第4項","q":"承租人亦得逕向台灣電力股份有限公司申辦查詢租賃期間之有關電費資訊。","u":"https://www.ey.gov.tw/File/43BC094940995CFC?A=C"}],"nt":"選項用「包租業」，係住宅轉租定型化契約之用語；住宅租賃定型化契約相同規定之主體為「出租人」。現行「當期每度平均電價」標準係113-07-08修正，簡報（111年教材）頁15、18仍載舊標準（夏月及非夏月最高級距每度金額）。"}},{"id":"05-04-021","c":"05","t":"05-04","n":"21","q":"下列哪些租賃關係不適用住宅租賃定型化契約應記載及不得記載事項？","o":["房東出租辦公室","社會住宅","房東出租給學生居住","房東出租給未成年人居住"],"a":"A","ty":"neg","e":{"s":"ok","x":"租賃條例第3條第1款（簡報法5-1頁4）：租賃住宅指以出租供居住使用之建築物，住宅租賃應記載事項第八點亦規定租賃住宅係供居住使用；社會住宅租賃契約依行政院消保處107年6月4日函仍受房屋（住宅）租賃定型化契約應記載及不得記載事項規範，出租給學生或未成年人居住亦屬住宅租賃；辦公室則非供居住使用，故選(A)。","b":[{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－租賃住宅相關法規與實務（法5-1～法5-5）","r":"頁碼4（PDF第5頁）","q":"租賃住宅：指以出租供居住使用之建築物。"},{"k":"law","l":"住宅租賃定型化契約應記載及不得記載事項（內政部）","r":"應記載事項第八點第1項","q":"本租賃住宅係供居住使用，承租人不得變更用途。","u":"https://www.ey.gov.tw/File/43BC094940995CFC?A=C"},{"k":"web","l":"行政院消費者保護處107年6月4日院臺消保字第1070020024號函（社會住宅租賃契約適用房屋租賃定型化契約應記載及不得記載事項）","r":"說明五","q":"租賃契約仍受「房屋租賃定型化契約應記載及不得記載事項」規範。","u":"https://www.ey.gov.tw/Page/24C4B877E850ED4E/ac9a343e-520c-4b73-a959-dc0e3c935137"}]}},{"id":"05-04-022","c":"05","t":"05-04","n":"22","q":"下列哪些項目是租賃住宅市場發展及管理條例明文規定押金擔保之範圍？","o":["處理遺留物責任","租金之給付","水、電費","管理費"],"a":"A","ty":"gen","e":{"s":"ok","x":"租賃條例第3條第13款（簡報法5-1頁5）：押金指承租人為擔保租賃住宅之損害賠償行為及處理遺留物責任，預為支付之金錢，故條例明文之押金擔保範圍包括處理遺留物責任，故選(A)。","b":[{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－租賃住宅相關法規與實務（法5-1～法5-5）","r":"頁碼5（PDF第6頁）","q":"押金：指承租人為擔保租賃住宅之損害賠償行為及處理遺留物責任，"},{"k":"law","l":"租賃住宅市場發展及管理條例","r":"第3條第13款","q":"押金：指承租人為擔保租賃住宅之損害賠償行為及處理遺留物責任，預為支付之金錢。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060125"}],"nt":"住宅租賃應記載事項第五點第2項另約定押金得抵充欠租等債務，但租賃條例第3條第13款定義僅明列損害賠償行為及處理遺留物責任。"}},{"id":"05-04-023","c":"05","t":"05-04","n":"23","q":"下列有關住宅租賃定型化契約應記載及不得記載事項中，如果房客欠租且終止租約後仍拒絕搬遷，通常情況中，哪一項不是房東可以主張的權利？","o":["請求相當月租金額之違約金","請求相當月租金額之不當得利","訴請房客返還房屋","請求精神賠償"],"a":"D","ty":"neg","e":{"s":"ok","x":"住宅租賃應記載事項第十五點第3項：承租人未返還租賃住宅時，出租人得請求相當月租金額及相當月租金額計算之違約金；簡報（法5-1）頁57–58判決：租期屆滿後拒不返還，出租人得依民法第767條、第455條請求騰空遷讓返還房屋，並依第179條請求相當租金之不當得利；民法第195條非財產上損害賠償限於侵害身體、健康、名譽等人格法益，房客欠租拒遷通常不生精神賠償請求權，故選(D)。","b":[{"k":"law","l":"住宅租賃定型化契約應記載及不得記載事項（內政部）","r":"應記載事項第十五點第3項","m":"承租人未依第一項返還租賃住宅時，出租人應即明示不以不定期限繼續契約，並得請求未返還期間之相當月租金額，及相當月租金額計算之違約金（未足一個月者以日租金折算）至返還為止。","u":"https://www.ey.gov.tw/File/43BC094940995CFC?A=C"},{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－租賃住宅相關法規與實務（法5-1～法5-5）","r":"頁碼57（PDF第58頁）","q":"求為判命被告騰空遷讓返還系爭房屋，及按月給付相當租金之不當得利2萬元。"},{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－租賃住宅相關法規與實務（法5-1～法5-5）","r":"頁碼58（PDF第59頁）","q":"次按無法律上之原因而受利益，致他人受損害者，應返還其利益。"},{"k":"law","l":"民法","r":"民法第195條第1項","q":"不法侵害他人之身體、健康、名譽、自由、信用、隱私、貞操，或不法侵害其他人格法益而情節重大者，被害人雖非財產上之損害，亦得請求賠償相當之金額。","u":"https://mojlaw.moj.gov.tw/LawContent.aspx?LSID=FL001351&lawNumber=184&TypeSort=4"},{"k":"law","l":"民法","r":"民法第18條第2項","q":"前項情形，以法律有特別規定者為限，得請求損害賠償或慰撫金。","u":"https://mojlaw.moj.gov.tw/LawContent.aspx?LSID=FL001351&lawNumber=6&TypeSort=3"}]}},{"id":"05-04-024","c":"05","t":"05-04","n":"24","q":"下列哪些租賃關係不適用住宅租賃定型化契約應記載及不得記載事項？","o":["民宿","社會住宅","房東出租給學生居住","房東出租給未成年人居住"],"a":"A","ty":"neg","e":{"s":"ok","x":"租賃條例第4條第1款（簡報法5-1頁5）：供休閒或旅遊為目的之租賃住宅不適用該條例；住宅租賃應記載事項規範供居住使用之住宅租賃（第八點）。民宿係供旅遊住宿，非住宅租賃；社會住宅依行政院消保處107年6月4日函仍受定型化契約應記載事項規範，出租給學生、未成年人居住亦屬住宅租賃，故選(A)。","b":[{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－租賃住宅相關法規與實務（法5-1～法5-5）","r":"頁碼5（PDF第6頁）","q":"不適用本條例之租賃住宅：(第4條)一、供休閒或旅遊為目的。"},{"k":"law","l":"租賃住宅市場發展及管理條例","r":"第4條第1款","q":"供休閒或旅遊為目的。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060125"},{"k":"law","l":"住宅租賃定型化契約應記載及不得記載事項（內政部）","r":"應記載事項第八點第1項","q":"本租賃住宅係供居住使用，承租人不得變更用途。","u":"https://www.ey.gov.tw/File/43BC094940995CFC?A=C"},{"k":"web","l":"行政院消費者保護處107年6月4日院臺消保字第1070020024號函（社會住宅租賃契約適用房屋租賃定型化契約應記載及不得記載事項）","r":"說明五","q":"租賃契約仍受「房屋租賃定型化契約應記載及不得記載事項」規範。","u":"https://www.ey.gov.tw/Page/24C4B877E850ED4E/ac9a343e-520c-4b73-a959-dc0e3c935137"}]}},{"id":"05-04-025","c":"05","t":"05-04","n":"25","q":"下列哪些租賃關係適用住宅租賃定型化契約應記載及不得記載事項？","o":["民宿","AIRBNB","飯店","房東出租給未成年人居住"],"a":"D","ty":"neg","e":{"s":"ok","x":"租賃條例第4條第1款（簡報法5-1頁5）：供休閒或旅遊為目的者不適用，民宿、AIRBNB短租及飯店均屬旅遊住宿，非住宅租賃；簡報（實2-1）頁19：未成年人租屋經法定代理人同意，或屬日常生活所必需（如求學學生）者，租約仍然有效，故出租給未成年人居住屬住宅租賃，適用應記載事項，故選(D)。","b":[{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－租賃住宅相關法規與實務（法5-1～法5-5）","r":"頁碼5（PDF第6頁）","q":"不適用本條例之租賃住宅：(第4條)一、供休閒或旅遊為目的。"},{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－租賃管理與糾紛實務（實2-1～實2-2）","r":"頁碼19（PDF第20頁）","q":"但如事實足以認定，租屋是該未成年人日常生活所必需（例如求學中的學生），縱使未得法定代理人同意，租約仍然有效。"},{"k":"law","l":"租賃住宅市場發展及管理條例","r":"第4條第1款","q":"供休閒或旅遊為目的。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060125"}]}},{"id":"05-04-026","c":"05","t":"05-04","n":"26","q":"下列哪些租賃關係適用住宅租賃定型化契約應記載及不得記載事項？","o":["工廠租賃","寺廟香客中心","飯店","大學宿舍"],"a":"D","ty":"neg","e":{"s":"ok","x":"行政院消保處107年6月1日函：各大專校院與學生間所訂立之宿舍租賃契約，不論BOT或大學自營，出租人均屬企業經營者，有房屋（住宅）租賃定型化契約應記載及不得記載事項之適用；工廠非供居住使用（租賃條例第3條第1款），飯店等旅遊住宿則屬第4條第1款之休閒旅遊目的，故選(D)。","b":[{"k":"web","l":"行政院消費者保護處107年6月1日院臺消保字第1070019770號函（各大專校院與學生間所訂立之宿舍租賃契約有「房屋租賃定型化契約應記載及不得記載事項」之適用）","r":"","q":"其租賃契約仍有「房屋租賃定型化契約應記載及不得記載事項」相關規定之適用。","m":"大學以BOT方式或自行經營學生宿舍，出租人均屬消保法上之企業經營者，學生承租自住為消費者，宿舍租賃契約適用該應記載及不得記載事項。","u":"https://www.ey.gov.tw/Page/24C4B877E850ED4E/205b30b8-ce65-4aaa-99db-7e3ed9730938"},{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－租賃住宅相關法規與實務（法5-1～法5-5）","r":"頁碼4（PDF第5頁）","q":"租賃住宅：指以出租供居住使用之建築物。"},{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－租賃住宅相關法規與實務（法5-1～法5-5）","r":"頁碼5（PDF第6頁）","q":"不適用本條例之租賃住宅：(第4條)一、供休閒或旅遊為目的。"}],"nt":"寺廟香客中心之性質，資料未直接論及；本題以大學宿舍有明文函釋適用為據。"}},{"id":"05-04-027","c":"05","t":"05-04","n":"27","q":"下列關於住宅租賃定型化契約應記載及不得記載事項之效力，下列敘述何者錯誤？","o":["租約條款違反公告之定型化契約，其違反之條款無效","中央主管機關公告應記載之事項，雖未記載於定型化契約，仍構成契約之內容","租約一旦違反不得記載事項，整部租約都是無效。","租約雖然違反不得記載事項，但除去該部分，契約亦可成立者，該契約之其他部分，仍為有效。"],"a":"C","ty":"neg","e":{"s":"ok","x":"簡報（法5-3）頁99–100：違反公告之定型化契約條款無效（消保法第17條第4項），公告應記載事項未記載仍構成契約內容（同條第5項）；條款一部無效，除去該部分契約亦可成立者，其他部分仍為有效，僅對當事人一方顯失公平者才全部無效（消保法第16條），故(C)「整部租約都無效」有誤，故選(C)。","b":[{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－租賃住宅相關法規與實務（法5-1～法5-5）","r":"頁碼100（PDF第101頁）","q":"違反第一項公告之定型化契約，其定型化契約條款無效。"},{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－租賃住宅相關法規與實務（法5-1～法5-5）","r":"頁碼100（PDF第101頁）","q":"中央主管機關公告應記載之事項，雖未記載於定型化契約，仍構成契約之內容"},{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－租賃住宅相關法規與實務（法5-1～法5-5）","r":"頁碼99（PDF第100頁）","q":"除去該部分，契約亦可成立者，該契約之其他部分，仍為有效。但對當事人之一方顯失公平者，該契約全部無效(消保16)。"}]}},{"id":"05-04-028","c":"05","t":"05-04","n":"28","q":"住宅租賃定型化契約應記載及不得記載事項中，如果出租人移轉租屋處之所有權予受讓人，何種情形下，房客不得對該受讓人主張租約之效力？","o":["租約期限未滿五年","租約經公證","租約未經公證，且租期逾五年","租期10年但租約經公證"],"a":"C","ty":"neg","e":{"s":"ok","x":"住宅租賃應記載事項第十六點第3項：契約如未經公證，其期限逾五年者，不適用買賣不破租賃（對受讓人繼續存在）之規定（同民法第425條第2項，簡報法5-2頁67），故選(C)。","b":[{"k":"law","l":"住宅租賃定型化契約應記載及不得記載事項（內政部）","r":"應記載事項第十六點第3項","q":"本契約如未經公證，其期限逾五年者，不適用前二項之規定。","u":"https://www.ey.gov.tw/File/43BC094940995CFC?A=C"},{"k":"law","l":"住宅租賃定型化契約應記載及不得記載事項（內政部）","r":"應記載事項第十六點第1項","q":"出租人於租賃住宅交付後，承租人占有中，縱將其所有權讓與第三人，本契約對於受讓人仍繼續存在。","u":"https://www.ey.gov.tw/File/43BC094940995CFC?A=C"},{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－租賃住宅相關法規與實務（法5-1～法5-5）","r":"頁碼67（PDF第68頁）","q":"前項規定，於未經公證之不動產租賃契約，其期限逾五年或未定期限者，不適用之。"}]}},{"id":"05-04-029","c":"05","t":"05-04","n":"29","q":"住宅租賃定型化契約應記載及不得記載事項中，下列何者不是出租人提前終止事由？","o":["房客申請租金補貼","出租人為重新建築而必要收回","承租人積欠管理費或其他應負擔之費用達二個月之租金額，經出租人定相當期限催告，仍不為支付","承租人擅自變更用途，經出租人阻止仍繼續為之"],"a":"A","ty":"neg","e":{"s":"ok","x":"住宅租賃應記載事項第十七點第1項列出租人得提前終止之事由，包括為重新建築而必要收回、承租人積欠管理費等達二個月租金額經催告仍不支付、擅自變更用途經阻止仍繼續為之等；房客申請租金補貼並非終止事由，不得記載事項第十點且明定不得記載承租人不得申請租金補貼，故選(A)。","b":[{"k":"law","l":"住宅租賃定型化契約應記載及不得記載事項（內政部）","r":"應記載事項第十七點第1項第(一)款","q":"出租人為重新建築而必要收回。","u":"https://www.ey.gov.tw/File/43BC094940995CFC?A=C"},{"k":"law","l":"住宅租賃定型化契約應記載及不得記載事項（內政部）","r":"應記載事項第十七點第1項第(三)款","q":"承租人積欠管理費或其他應負擔之費用達二個月之租金額，經出租人定相當期限催告，仍不為支付。","u":"https://www.ey.gov.tw/File/43BC094940995CFC?A=C"},{"k":"law","l":"住宅租賃定型化契約應記載及不得記載事項（內政部）","r":"應記載事項第十七點第1項第(四)款","q":"承租人違反第八點第一項規定，擅自變更用途，經出租人阻止仍繼續為之。","u":"https://www.ey.gov.tw/File/43BC094940995CFC?A=C"},{"k":"law","l":"住宅租賃定型化契約應記載及不得記載事項（內政部）","r":"不得記載事項第十點","q":"不得記載承租人不得申請租金補貼。","u":"https://www.ey.gov.tw/File/43BC094940995CFC?A=C"}],"nt":"不得記載事項第十點係112-06-14公告修正增訂，晚於簡報（111年）。"}},{"id":"05-04-030","c":"05","t":"05-04","n":"30","q":"住宅租賃定型化契約應記載及不得記載事項中，下列出租人提前終止事由何項需要在終止前三個月通知？","o":["承租人擅自將租賃住宅轉租或轉讓租賃權予他人","出租人為重新建築而必要收回","承租人積欠管理費或其他應負擔之費用達二個月之租金額，經出租人定相當期限催告，仍不為支付","承租人擅自變更用途，經出租人阻止仍繼續為之"],"a":"B","ty":"neg","e":{"s":"ok","x":"住宅租賃應記載事項第十七點第2項（簡報實2-2頁34同列）：出租人依第1項第(一)款「為重新建築而必要收回」終止者，應於終止前三個月以書面通知；擅自轉租、積欠費用、擅自變更用途等事由則於終止前三十日通知，故選(B)。","b":[{"k":"law","l":"住宅租賃定型化契約應記載及不得記載事項（內政部）","r":"應記載事項第十七點第2項第(一)款","q":"(一)依前項第一款規定終止者，於終止前三個月。","u":"https://www.ey.gov.tw/File/43BC094940995CFC?A=C"},{"k":"law","l":"住宅租賃定型化契約應記載及不得記載事項（內政部）","r":"應記載事項第十七點第1項第(一)款","q":"出租人為重新建築而必要收回。","u":"https://www.ey.gov.tw/File/43BC094940995CFC?A=C"},{"k":"law","l":"住宅租賃定型化契約應記載及不得記載事項（內政部）","r":"應記載事項第十七點第2項第(二)款","q":"(二)依前項第二款至第四款、第六款至第九款規定終止者，於終止前三十日。","u":"https://www.ey.gov.tw/File/43BC094940995CFC?A=C"},{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－租賃管理與糾紛實務（實2-1～實2-2）","r":"頁碼34（PDF第35頁）","q":"(一)依前項第一款規定終止者，於終止前三個月。"}]}},{"id":"05-04-031","c":"05","t":"05-04","n":"31","q":"住宅租賃定型化契約應記載及不得記載事項中，承租人提前終止事由中，因疾病、意外產生有長期療養之需要而需終止時，需檢附何項書面證明？","o":["學校或工作單位請假證明","醫師診斷證明","因為是發生車禍，所以要提供車禍發生之現場照片","三等親之切結書"],"a":"B","ty":"neg","e":{"s":"ok","x":"住宅租賃應記載事項第十八點第1項第(四)款：承租人因疾病、意外產生有長期療養之需要者得提前終止租約，第2項應於終止前三十日檢附相關事證以書面通知；簡報（實2-1）頁15：房客因疾病、意外而有長期療養需要，經醫療機構出具6個月以上診斷證明者，可主張提前終止租約，故應檢附醫師診斷證明，故選(B)。","b":[{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－租賃管理與糾紛實務（實2-1～實2-2）","r":"頁碼15（PDF第16頁）","q":"房客如因疾病、意外而有長期療養的需要，經醫療機構出具6個月以上診斷證明者，可主張提前終止租約"},{"k":"law","l":"住宅租賃定型化契約應記載及不得記載事項（內政部）","r":"應記載事項第十八點第1項第(四)款","q":"(四)承租人因疾病、意外產生有長期療養之需要。","u":"https://www.ey.gov.tw/File/43BC094940995CFC?A=C"},{"k":"law","l":"住宅租賃定型化契約應記載及不得記載事項（內政部）","r":"應記載事項第十八點第2項","q":"承租人依前項各款規定提前終止租約者，應於終止前三十日，檢附相關事證，以書面通知出租人。但前項第三款前段其情況危急者，得不先期通知。","u":"https://www.ey.gov.tw/File/43BC094940995CFC?A=C"}],"nt":"現行規範第十八點僅規定「檢附相關事證」，未明文「診斷證明」；114-04-18修正第十八點僅刪除第1項序文「致難以繼續居住」文字（配合租賃條例112年修正第11條），第(四)款及第2項未修正，不影響本題答案。"}},{"id":"05-04-032","c":"05","t":"05-04","n":"32","q":"下列何項不是住宅租賃定型化契約應記載及不得記載事項可採之履行契約通知方式？","o":["郵寄","口頭","電子郵件","即時通訊軟體以文字顯示方式"],"a":"B","ty":"neg","e":{"s":"ok","x":"住宅租賃應記載事項第二十點：雙方通知以郵寄為之，並得約定以電子郵件信箱、手機簡訊或即時通訊軟體以文字顯示方式為之；不得記載事項第八點並禁止約定通知僅以電話方式為之，口頭通知不在可採方式之列，故選(B)。","b":[{"k":"law","l":"住宅租賃定型化契約應記載及不得記載事項（內政部）","r":"應記載事項第二十點第1項","m":"除契約另有約定外，租賃雙方相互間之通知，以郵寄為之者，應以契約所記載之地址為準。","u":"https://www.ey.gov.tw/File/43BC094940995CFC?A=C"},{"k":"law","l":"住宅租賃定型化契約應記載及不得記載事項（內政部）","r":"應記載事項第二十點第3項","m":"前述通知得經雙方約定以□電子郵件信箱□手機簡訊□即時通訊軟體以文字顯示方式為之。","u":"https://www.ey.gov.tw/File/43BC094940995CFC?A=C"},{"k":"law","l":"住宅租賃定型化契約應記載及不得記載事項（內政部）","r":"不得記載事項第八點","q":"不得記載本契約之通知，僅以電話方式為之。","u":"https://www.ey.gov.tw/File/43BC094940995CFC?A=C"}]}},{"id":"05-04-033","c":"05","t":"05-04","n":"33","q":"下列何項租屋標的之情況，不是住宅租賃定型化契約應記載及不得記載事項租賃標的現況確認書之房東應告知事項？","o":["前房客在租屋處上吊自殺","前房客在租屋處內燒炭自殺","前房客在陽台跳樓自殺，死亡於社區中庭","租屋處有人病死身亡"],"a":"D","ty":"neg","e":{"s":"ok","x":"住宅租賃應記載事項附件一現況確認書第8項：應告知租賃住宅（專有部分）是否曾發生兇殺、自殺、一氧化碳中毒或其他非自然死亡之情事；簡報（實2-2）頁36：凶宅指專有部分（含主建物及附屬建物）曾發生凶殺或自殺等非自然死亡，及在專有部分有求死行為致死者，家中病逝則不算凶宅。上吊、燒炭及自陽台跳樓均屬在租屋處之自殺行為，病死則屬自然死亡，非應告知事項，故選(D)。","b":[{"k":"law","l":"住宅租賃定型化契約應記載及不得記載事項（內政部）","r":"附件一租賃標的現況確認書第8項","q":"本租賃住宅（專有部分）是否曾發生兇殺、自殺、一氧化碳中毒或其他非自然死亡之情事：","u":"https://www.ey.gov.tw/File/43BC094940995CFC?A=C"},{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－租賃管理與糾紛實務（實2-1～實2-2）","r":"頁碼36（PDF第37頁）","q":"曾發生凶殺或自殺等非自然死亡的事實，及在專有部分有求死行為致死；但不包括在專有部分遭砍殺而陳屍他處的行為。"},{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－租賃管理與糾紛實務（實2-1～實2-2）","r":"頁碼36（PDF第37頁）","q":"甚至於家中病逝許久或是吸毒暴斃都不能算是凶宅"}],"nt":"簡報頁36說明係引用內政部2008年函釋之凶宅定義；陽台跳樓死亡於中庭，依該頁「在專有部分有求死行為致死」及附圖（發生地為自家之非自然死亡會被認定為凶宅）判斷。"}},{"id":"05-04-034","c":"05","t":"05-04","n":"34","q":"下列何項租屋標的之情況，是住宅租賃定型化契約應記載及不得記載事項租賃標的現況確認書之房東應告知事項？","o":["因為天氣寒冷，所以前房客在租屋處緊閉門窗開熱水器洗澡，又沒有安裝強制排氣設施，因而一氧化碳中毒死亡","前房客在租屋處因電線走火漏電而不幸觸電身亡","租屋處對面發生過兇殺案，兇手曾經拖著裝有屍體的行李箱經過租屋處前之走廊","租屋處有人病死身亡"],"a":"A","ty":"neg","e":{"s":"ok","x":"住宅租賃應記載事項附件一現況確認書第8項：應告知租賃住宅（專有部分）是否曾發生兇殺、自殺、「一氧化碳中毒」或其他非自然死亡之情事，前房客在租屋處一氧化碳中毒死亡屬明文列舉之應告知事項；租屋處對面之兇殺案非發生於專有部分，病死依簡報（實2-2）頁36不算凶宅，故選(A)。","b":[{"k":"law","l":"住宅租賃定型化契約應記載及不得記載事項（內政部）","r":"附件一租賃標的現況確認書第8項","q":"本租賃住宅（專有部分）是否曾發生兇殺、自殺、一氧化碳中毒或其他非自然死亡之情事：","u":"https://www.ey.gov.tw/File/43BC094940995CFC?A=C"},{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－租賃管理與糾紛實務（實2-1～實2-2）","r":"頁碼36（PDF第37頁）","q":"甚至於家中病逝許久或是吸毒暴斃都不能算是凶宅"}],"nt":"選項(B)在租屋處觸電意外死亡，依確認書「其他非自然死亡」之文義亦可能屬應告知事項，資料未明確排除；題庫答案(A)為確認書明文列舉之一氧化碳中毒。"}},{"id":"05-04-035","c":"05","t":"05-04","n":"35","q":"租屋處如之前曾發生前房客在租屋處內燒炭自殺，但是房東知情卻故意隱匿而不告知，房客知道可以主張何種權利？","o":["主張民事詐欺，撤銷租賃之意思表示","主張租金全免","主張去祭改之法事費用","主張是因為住到凶宅才會被公司資遣，並進一步主張工資的損失"],"a":"A","ty":"case","e":{"s":"ok","x":"住宅租賃應記載事項附件一現況確認書第8項要求告知專有部分是否曾發生自殺等非自然死亡之情事，不得記載事項第六點並禁止免除或限制出租人故意不告知之瑕疵擔保責任；房東明知燒炭自殺情事而故意隱匿，房客係被詐欺而為承租之意思表示，依民法第92條第1項得撤銷其意思表示，故選(A)。","b":[{"k":"law","l":"民法","r":"民法第92條第1項","q":"因被詐欺或被脅迫而為意思表示者，表意人得撤銷其意思表示。但詐欺係由第三人所為者，以相對人明知其事實或可得而知者為限，始得撤銷之。","u":"https://mojlaw.moj.gov.tw/LawContent.aspx?LSID=FL001351&lawNumber=86&TypeSort=3"},{"k":"law","l":"住宅租賃定型化契約應記載及不得記載事項（內政部）","r":"附件一租賃標的現況確認書第8項","q":"本租賃住宅（專有部分）是否曾發生兇殺、自殺、一氧化碳中毒或其他非自然死亡之情事：","u":"https://www.ey.gov.tw/File/43BC094940995CFC?A=C"},{"k":"law","l":"住宅租賃定型化契約應記載及不得記載事項（內政部）","r":"不得記載事項第六點","q":"不得記載免除或限制民法上出租人故意不告知之瑕疵擔保責任。","u":"https://www.ey.gov.tw/File/43BC094940995CFC?A=C"}]}},{"id":"06-01-001","c":"06","t":"06-01","n":"01","q":"除當地鄉鎮市區公所調解委員會可協助承租人進行租賃糾紛調解外，下列哪一單位也可協助企業經營者為出租人之租賃糾紛?","o":["公平交易委員會","消費者服務中心","勞資爭議調解委員會","警察局"],"a":"B","ty":"gen","e":{"s":"ok","x":"租賃條例第5條第1項規定住宅租賃之出租人與承租人間視為消費關係、適用消保法；消保法第43條第1項及第42條第1項，消費者得向直轄市、縣（市）政府設置之消費者服務中心申訴，故選(B)。","b":[{"k":"law","l":"租賃住宅市場發展及管理條例","r":"條例第5條第1項","m":"住宅租賃契約的出租人與承租人之間視為消費關係，適用消費者保護法相關規定。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060125"},{"k":"law","l":"消費者保護法","r":"消保法第43條第1項","m":"發生消費爭議時，消費者可向企業經營者、消保團體或消費者服務中心（含分中心）提出申訴。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=J0170001"},{"k":"law","l":"消費者保護法","r":"消保法第42條第1項","m":"直轄市、縣（市）政府應設置消費者服務中心，負責消費者諮詢服務、教育宣導及申訴等事項。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=J0170001"}]}},{"id":"06-01-002","c":"06","t":"06-01","n":"02","q":"租賃契約消滅之返還，需雙方共同完成點交，依租賃住宅市場發展及管理條例規定，點交後尚有遺留物，出租人該如何處理?","o":["出租人可以直接視為自己的物品處理","出租人無須催告，視為廢棄物","經出租人定相當期限催告仍不取回，視為拋棄其所有權，處理費用從押金扣","出租人無須催告，依契約直接視為廢棄物，處理費用從押金扣"],"a":"C","ty":"gen","e":{"s":"ok","x":"依內政部公告之住宅租賃定型化契約應記載事項第19點，點交後仍有遺留物時，出租人應定相當期限催告承租人取回，逾期不取回視為拋棄所有權，處理費用得先由押金抵充，故選(C)。","b":[{"k":"law","l":"住宅租賃定型化契約應記載及不得記載事項（內政部）","r":"住宅租賃定型化契約應記載事項第19點","m":"租賃關係消滅並完成點交後仍有遺留物，除另有約定外，出租人應定相當期限催告承租人取回，逾期不取回視為拋棄所有權；處理費用可先由押金抵充，不足再向承租人請求。","u":"https://www.ey.gov.tw/File/43BC094940995CFC?A=C"}],"nt":"題幹稱「依租賃住宅市場發展及管理條例規定」，但遺留物處理之具體規定見於住宅租賃定型化契約應記載及不得記載事項，非條例本文。"}},{"id":"06-01-003","c":"06","t":"06-01","n":"03","q":"租賃住宅市場發展及管理條例的中央主管機關為下列何者?","o":["經濟部","內政部","教育部","衛福部"
