？","o":["樓高50公尺以上建築物","樓高20公尺以上建築物","樓高30公尺以上建築物","樓高40公尺以上建築物"],"a":"A","ty":"num","ns":1,"e":{"s":"ok","x":"建築技術規則建築設計施工編第227條：「本章所稱高層建築物，係指高度在五十公尺或樓層在十六層以上之建築物。」故高度50公尺以上屬法定高層建築物，故選(A)。","b":[{"k":"law","l":"建築技術規則建築設計施工編","r":"第227條","q":"本章所稱高層建築物，係指高度在五十公尺或樓層在十六層以上之建築物。","u":"https://lawplayer.com/act/6437d09ce800e5f0b9301eae/57"}],"nt":"題目僅問高度；法定定義另含「樓層在十六層以上」。"}},{"id":"07-02-002","c":"07","t":"07-02","n":"02","q":"高層建築物住宅內有使用瓦斯燃燒器具的廚房，需要考慮下列何種法定事項？","o":["需要考慮動線良好","需要半小時防火門防火時效區劃","需要1小時防火門防火時效區劃","可規劃開放式廚房"],"a":"C","ty":"gen","e":{"s":"ok","x":"建築技術規則建築設計施工編第243條第2項：高層建築物設有燃氣設備時，應集中設置並設瓦斯漏氣自動警報設備，且與其他部分應以具「一小時以上防火時效」之牆壁、防火門窗等防火設備及樓地板予以區劃分隔，故選(C)。","b":[{"k":"law","l":"建築技術規則建築設計施工編","r":"第243條第2項","q":"高層建築物設有燃氣設備時，應將燃氣設備集中設置，並設置瓦斯漏氣自動警報設備，且與其他部分應以具一小時以上防火時效之牆壁、防火門窗等防火設備及該層防火構造之樓地板予以區劃分隔。","u":"https://lawplayer.com/act/6437d09ce800e5f0b9301eae/59"}]}},{"id":"07-02-003","c":"07","t":"07-02","n":"03","q":"依據地籍測量實施規則規定，建物第一次測量，應測繪建物位置圖及其平面圖，且登記機關於測量完竣後，應發給下列哪一種文件？","o":["建照執照","使用執照","建物測量成果圖","房屋權狀"],"a":"C","ty":"gen","e":{"s":"ok","x":"地籍測量實施規則第282條：「建物第一次測量，應測繪建物位置圖及其平面圖。登記機關於測量完竣後，應發給建物測量成果圖。」故選(C)。","b":[{"k":"law","l":"地籍測量實施規則","r":"第282條","q":"建物第一次測量，應測繪建物位置圖及其平面圖。登記機關於測量完竣後，應發給建物測量成果圖。","u":"https://laws.gov.taipei/law/LawSearch/LawExport/FL003219?type=0"}]}},{"id":"07-02-004","c":"07","t":"07-02","n":"04","q":"下列何者為建物測量成果圖之面積單位？","o":["平方公尺","公分","公尺","坪數"],"a":"A","ty":"gen","e":{"s":"ok","x":"地籍測量實施規則第276條第3項：「建物面積之單位為平方公尺」；簡報（建3-1）頁11亦載建物登記都是以平方公尺登記，坪數為面積乘以0.3025，故建物測量成果圖之面積單位為平方公尺，故選(A)。","b":[{"k":"law","l":"地籍測量實施規則","r":"第276條第3項","q":"建物面積之單位為平方公尺，平方公尺以下記載至第二位，第三位以下四捨五入。","u":"https://laws.gov.taipei/law/LawSearch/LawExport/FL003219?type=0"},{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－建物與室內裝修管理實務（建3-1～建3-3）","r":"頁碼11（PDF第12頁）","q":"建物登記都是以平方公尺登記，民眾一般所稱坪數，為面積乘以0.3025後即為坪數。"}]}},{"id":"07-02-005","c":"07","t":"07-02","n":"05","q":"建物測量成果圖附屬建築物中常見陽臺，下何者為陽臺應保持之樣貌？","o":["屬於主建物中的一部分，可隨意使用","應保持立面透空","可任意加設鐵窗","可加設立窗防止潑雨"],"a":"B","ty":"gen","e":{"s":"ok","x":"地籍測量實施規則第273條第1項第3款：依建築技術規則檢討設置之陽臺「以附屬建物辦理測量」，非主建物；簡報（建3-1）頁12、頁40指出陽台外推屬違章建築、陽臺外推加設窗戶易致熱水器燃燒不完全，臺北市違章建築處理規則第10條亦將陽臺加窗列為違建（拍照列管或查報拆除）。故陽臺不得任意加設鐵窗或立窗，應保持立面開放透空，故選(B)。","b":[{"k":"law","l":"地籍測量實施規則","r":"第273條第1項第3款","q":"使用執照竣工圖說載有依建築技術規則檢討設置之陽臺者，其突出部分以外緣為界，並以附屬建物辦理測量。","u":"https://laws.gov.taipei/law/LawSearch/LawExport/FL003219?type=0"},{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－建物與室內裝修管理實務（建3-1～建3-3）","r":"頁碼12（PDF第13頁）","q":"可以看出主建物與附屬建物的區別，容易得知陽台是否外推違章建築，"},{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－建物與室內裝修管理實務（建3-1～建3-3）","r":"頁碼40（PDF第41頁）","q":"而瓦斯熱水器可能因為裝設位置錯誤、陽臺外推加設窗戶、熱水器形式錯誤等導致因燃燒不完全引發一氧化碳中毒傷亡事件"},{"k":"law","l":"臺北市違章建築處理規則","r":"第10條第1款","q":"二樓以上之陽臺加窗或一樓陽臺加設之門、窗，未突出外牆或陽臺欄杆外緣，且原有外牆未拆除者。但建造執照所載發照日為中華民國九十五年一月一日以後，其陽臺不計入建蔽率、容積率者，應查報拆除。","m":"第10條序文：「領有使用執照之建築物，陽臺有下列各款情形之一者，應拍照列管：」","u":"https://laws.gov.taipei/Law/LawSearch/LawArticleContent/FL058967"}],"nt":"所查資料未出現「立面透空」一詞；係以陽臺屬附屬建物、陽臺外推或加窗屬違建且影響通風，說明(A)(C)(D)錯誤、(B)正確。簡報頁45另指出陽臺加裝鐵窗可能因堆積雜物、晾衣造成通風不良。"}},{"id":"07-02-006","c":"07","t":"07-02","n":"06","q":"建物測量成果圖載有屋簷或雨遮等突出部分者為建物登記範圍，以下相關規定何者正確？","o":["法無明文規定","107年起不得登記","106年起不得登記","由起造人自行決定"],"a":"B","ty":"gen","e":{"s":"ok","x":"地籍測量實施規則第273條（106-01-09修正施行規定）：107年1月1日前已申請建造執照者，其屋簷、雨遮之測繪依修正前規定辦理；臺北市地政局說明「107年1月1日後申請建造執照之建物，其屋簷、雨遮即無法再測繪及登記」，故選(B)。","b":[{"k":"law","l":"地籍測量實施規則","r":"第273條（末段）","q":"其屋簷、雨遮及地下層之測繪，依本條一百零六年一月九日修正施行前規定辦理。","m":"107年1月1日前已申請建造執照者（或符合都更期限者），其屋簷、雨遮及地下層之測繪，依106-01-09修正施行前規定辦理；反之107年起申請建照者不再測繪登記屋簷、雨遮。","u":"https://laws.gov.taipei/law/LawSearch/LawExport/FL003219?type=0"},{"k":"web","l":"臺北地政電子報〈屋簷雨遮產權測繪登記大變革－邁向實坪制〉（臺北市政府地政局，葉炘）","r":"","q":"107年1月1日後申請建造執照之建物，其屋簷、雨遮即無法再測繪及登記，但陽臺仍屬可登記之標的；","u":"https://epaper.land.gov.taipei/Item/Detail/%E5%B1%8B%E7%B0%B7%E9%9B%A8%E9%81%AE%E7%94%A2%E6%AC%8A%E6%B8%AC%E7%B9%AA%E7%99%BB%E8%A8%98%E5%A4%A7%E8%AE%8A%E9%9D%A9"},{"k":"web","l":"新北市政府市政新聞〈屋簷、雨遮登記新制於107年正式上路囉！〉","r":"","q":"針對107年1月1日後申請建造執照的建物，除了「陽臺」得以附屬建物辦理測繪及登記外，「屋簷」及「雨遮」將無法以附屬建物辦理測繪及登記。","u":"https://www.ntpc.gov.tw/ch/home.jsp?id=28&parentpath=0,6,27&mcustomize=news_view.jsp&dataserno=201712280024"}],"nt":"正確說法為「107年1月1日以後申請建造執照之建物」屋簷、雨遮不得測繪登記；之前已申請建照者仍依舊制。"}},{"id":"07-02-007","c":"07","t":"07-02","n":"07","q":"建物測量成果圖中，有關外牆之規定，下列敘述何者正確？","o":["法無明文規定","牆壁之外緣為界","牆壁之中心為界","牆壁之內緣為界"],"a":"B","ty":"gen","e":{"s":"ok","x":"地籍測量實施規則第273條第1項第1款：建物平面圖測繪邊界「建物以其外牆之外緣為界」，故選(B)。","b":[{"k":"law","l":"地籍測量實施規則","r":"第273條第1項第1款","q":"建物以其外牆之外緣為界。","m":"第273條第1項序文：「建物平面圖測繪邊界依下列規定辦理：」；第2款：兩建物之間有牆壁區隔者，以共用牆壁之中心為界。","u":"https://laws.gov.taipei/law/LawSearch/LawExport/FL003219?type=0"}],"nt":"兩建物間之共用牆壁才以中心為界（第2款）。"}},{"id":"07-02-008","c":"07","t":"07-02","n":"08","q":"建築物使用執照中登載資訊，下列何者為登載資訊？","o":["租金行情","活載重設計值","構造種類","各戶產權登記面積"],"a":"C","ty":"gen","e":{"s":"ok","x":"簡報（建3-1）頁6：從使用執照存根可得知取得使用執照年度、構造樣態、樓高、總樓地板面積及地建號等資訊，所附使用執照存根即有「構造種類 RC造」欄；租金行情、活載重設計值、各戶產權登記面積均非使用執照登載事項，故選(C)。","b":[{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－建物與室內裝修管理實務（建3-1～建3-3）","r":"頁碼6（PDF第7頁）","q":"即可得知取得使用執照年度、構造樣態、樓高、以總樓地板面積以及建物之段、小段、地建號等基本概要資訊。"},{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－建物與室內裝修管理實務（建3-1～建3-3）","r":"頁碼6（PDF第7頁）","q":"構造種類 RC造"}],"nt":"各戶產權登記面積載於建物登記謄本（簡報頁11），非使用執照。"}},{"id":"07-02-009","c":"07","t":"07-02","n":"09","q":"住宅內電氣盤內應有下列何種標示？","o":["屋主電話","包租代管業電話","單線圖說","系統昇位圖說"],"a":"C","ty":"gen","e":{"s":"ok","x":"簡報（建3-1）頁18：電燈分電箱（開關箱）「箱體開啟後會有單線圖以及各斷路器之標示」，頁5設備一覽表電燈分電箱之附屬物亦為「單線圖」，故選(C)。","b":[{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－建物與室內裝修管理實務（建3-1～建3-3）","r":"頁碼18（PDF第19頁）","q":"箱體開啟後會有單線圖以及各斷路器之標示，可以清楚了解各分路用途。"},{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－建物與室內裝修管理實務（建3-1～建3-3）","r":"頁碼5（PDF第6頁）","q":"電燈分電箱 大門入口 單線圖"}]}},{"id":"07-02-010","c":"07","t":"07-02","n":"10","q":"下列有關住宅燃氣器具連接供氣管路之連接管之敘述何者正確？","o":["不得使用橡皮管","橡皮管長度不得超過1.8公尺","橡皮管可以隱蔽在構造體內","橡皮管長度可以超過1.8公尺"],"a":"B","ty":"gen","e":{"s":"ok","x":"建築技術規則建築設備編第79條第5款第6目：燃氣器具連接供氣管路之連接管，得為金屬管或橡皮管，「橡皮管長度不得超過一點八公尺」，並不得隱蔽在構造體內，故選(B)。","b":[{"k":"law","l":"建築技術規則建築設備編","r":"第79條第5款第6目","q":"燃氣器具連接供氣管路之連接管，得為金屬管或橡皮管。橡皮管長度不得超過一點八公尺，並不得隱蔽在構造體內或貫穿樓地板或牆壁。","m":"第79條序文：「燃氣設備之燃氣供給管路，應依下列規定：」","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070117"}]}},{"id":"07-02-011","c":"07","t":"07-02","n":"11","q":"下列何種用電設備應裝設漏電斷路器？","o":["電燈","電腦","衛浴設備用電","電扇"],"a":"C","ty":"gen","e":{"s":"ok","x":"簡報（建3-2）頁43：絕對需要經過漏電斷路器保護之住宅設備有飲水機分路、電熱水器及浴室插座分路、陽臺之插座等；頁39亦載浴室內插座及電能熱水器電源應有漏電斷路器設備，故衛浴設備用電應裝設漏電斷路器，故選(C)。","b":[{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－建物與室內裝修管理實務（建3-1～建3-3）","r":"頁碼43（PDF第44頁）","q":"絕對需要經過漏電斷路器保護之"},{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－建物與室內裝修管理實務（建3-1～建3-3）","r":"頁碼43（PDF第44頁）","q":"及浴室插座分路、陽臺之插座等。"},{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－建物與室內裝修管理實務（建3-1～建3-3）","r":"頁碼39（PDF第40頁）","q":"浴室內插座以及電能熱水器使用之電源應有良好接地以及漏電斷路器設備，以維護用電安全。"}]}},{"id":"07-02-012","c":"07","t":"07-02","n":"12","q":"建築物給水壓力不宜過大，以免損壞器具或配管，造成水損，一般住宅水壓不得超過多少kg/cm2？","o":["3.5kg/cm2","5kg/cm2","1kg/cm2","0.5kg/cm2"],"a":"A","ty":"neg","e":{"s":"ok","x":"簡報（建3-1）頁5設備一覽表：水壓超過3.5kg時設減壓閥；建築物給水排水設備設計技術規範第3.4.6點：建築物一般給水壓力超過3.5kg/cm2之限度時，應設置中間水槽或減壓閥調整給水壓力，故選(A)。","b":[{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－建物與室內裝修管理實務（建3-1～建3-3）","r":"頁碼5（PDF第6頁）","q":"水壓超過3.5kg，當層"},{"k":"web","l":"建築物給水排水設備設計技術規範（內政部國土管理署網站PDF）","r":"","q":"建築物一般給水壓力，超過3.5kg/cm2之限度時，應設置中間水槽或減壓閥等，以調整給水壓力","m":"第3.4.6點。","u":"https://www.nlma.gov.tw/uploads/files/7b5f02739dad0e121f246b4dc1b6006a.pdf"}]}},{"id":"07-02-013","c":"07","t":"07-02","n":"13","q":"住宅瓦斯熱水器安裝位置，為以維護安全，應設置於何處？","o":["門口","走廊","通風不良之陽臺","通風良好之陽臺"],"a":"D","ty":"gen","e":{"s":"ok","x":"簡報（建3-2）頁42引消防法第15條之1：燃氣熱水器應裝設於建築物外牆，或裝設於有開口且與戶外空氣流通之位置；頁40亦指出陽臺外推加設窗戶等會導致燃燒不完全引發一氧化碳中毒。故瓦斯熱水器應設於通風良好之陽臺，故選(D)。","b":[{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－建物與室內裝修管理實務（建3-1～建3-3）","r":"頁碼42（PDF第43頁）","q":"燃氣熱水器應裝設於建築物外牆，或裝設於有開口且與戶外空氣流通之位置；"},{"k":"law","l":"消防法","r":"第15條之1第4項","q":"第一項熱水器應裝設於建築物外牆，或裝設於有開口且與戶外空氣流通之位置；其無法符合者，應裝設熱水器排氣管將廢氣排至戶外。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0120001"}]}},{"id":"07-02-014","c":"07","t":"07-02","n":"14","q":"依照目前法令，高層建築物中，每一住宅空間皆應有下列哪一種消防設備？","o":["避難器具","室內消防栓","撒水設備","排煙設備"],"a":"C","ty":"gen","e":{"s":"ok","x":"簡報（建3-1）頁25：依現行法令，高層建築物無論樓層面積，居室即有消防自動撒水設備；各類場所消防安全設備設置標準第17條第1項第8款亦將「高層建築物」列為應設置自動撒水設備之場所，故選(C)。","b":[{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－建物與室內裝修管理實務（建3-1～建3-3）","r":"頁碼25（PDF第26頁）","q":"或者依據現行法令，高層建築物無論樓層面積，居室即有消防自動撒水設備。"},{"k":"law","l":"各類場所消防安全設備設置標準","r":"第17條第1項第8款","q":"高層建築物。","m":"第17條第1項序文：「下列場所或樓層應設置自動撒水設備：」","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0120029"}]}},{"id":"07-02-015","c":"07","t":"07-02","n":"15","q":"一般而言，幾樓的住宅不可能有緩降機？","o":["2F","6F","10F","11F"],"a":"D","ty":"neg","e":{"s":"ok","x":"各類場所消防安全設備設置標準第25條第1項：建築物「除十一層以上樓層及避難層外」，各樓層應選設滑臺、避難梯、救助袋、緩降機等避難器具；十一層以上樓層不設避難器具，故11F住宅不會有緩降機，故選(D)。","b":[{"k":"law","l":"各類場所消防安全設備設置標準","r":"第25條第1項","q":"建築物除十一層以上樓層及避難層外，各樓層應選設滑臺、避難梯、避難橋、救助袋、緩降機、避難繩索、滑杆或經中央主管機關認可具同等性能之避難器具。但建築物在構造及設施上，並無避難逃生障礙，經中央主管機關認可者，不在此限。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0120029"}],"nt":"條文係規定十一層以上樓層免選設避難器具（非禁止設置），題目「不可能有緩降機」為依此規定之推論；簡報屋況點交建3-1/建3-2未提及避難器具設置樓層。"}},{"id":"07-02-016","c":"07","t":"07-02","n":"16","q":"依現行法令，為避免兒童墜樓意外，十層以上住宅外牆開口窗臺高度應離地多高？","o":["200CM","180CM","120CM","150CM"],"a":"C","ty":"num","e":{"s":"ok","x":"建築技術規則建築設計施工編第45條第5款：建築物使用用途為H-2（住宅）、D-3、F-3組者，外牆設置開啟式窗戶之窗臺高度不得小於1.10公尺；十層以上不得小於1.20公尺，故選(C)。","b":[{"k":"law","l":"建築技術規則建築設計施工編","r":"第45條第5款","q":"建築物使用用途為 H-2、D-3、F-3 組者，外牆設置開啟式窗戶之窗臺高度不得小於一‧一○公尺；十層以上不得小於一‧二○公尺。","m":"同款另列臨接露臺、陽臺、室外走廊、室外樓梯、室內天井，或設有符合規定之欄杆、依第108條規定設置之緊急進口者，不受限制。","u":"https://lawplayer.com/act/6437d09ce800e5f0b9301eae/9"}],"nt":"簡報屋況點交建3-1未提及；條文未寫明立法目的，題目所稱「避免兒童墜樓」未能從條文確認，但高度規定明確。"}},{"id":"07-02-017","c":"07","t":"07-02","n":"17","q":"下列何種住宅之窗簾應使用防燄窗簾？","o":["6F以上之住宅","未具備消防設備之住宅","10F以上之住宅","11F以上之住宅"],"a":"D","ty":"num","ns":1,"e":{"s":"ok","x":"消防法第11條第1項：地面樓層達十一層以上建築物、地下建築物及中央主管機關指定之場所，其管理權人應使用附有防焰標示之窗簾等防焰物品，故11F以上住宅應使用防焰窗簾，故選(D)。","b":[{"k":"law","l":"消防法","r":"第11條第1項","q":"地面樓層達十一層以上建築物、地下建築物及中央主管機關指定之場所，其管理權人應使用附有防焰標示之地毯、窗簾、布幕、展示用廣告板及其他指定之防焰物品。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0120001"}],"nt":"法條以「地面樓層達十一層以上建築物」為準（整棟建築物），非僅指住宅所在樓層。"}},{"id":"07-02-018","c":"07","t":"07-02","n":"18","q":"下列何種場所之用電應經過漏電斷路器？","o":["浴室","主臥房","客廳","書房"],"a":"A","ty":"gen","e":{"s":"ok","x":"簡報（建3-2）頁39：浴室內插座以及電能熱水器使用之電源應有良好接地以及漏電斷路器設備；頁43：浴室插座分路屬絕對需要經過漏電斷路器保護之住宅設備，故選(A)。","b":[{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－建物與室內裝修管理實務（建3-1～建3-3）","r":"頁碼39（PDF第40頁）","q":"浴室內插座以及電能熱水器使用之電源應有良好接地以及漏電斷路器設備，以維護用電安全。"},{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－建物與室內裝修管理實務（建3-1～建3-3）","r":"頁碼43（PDF第44頁）","q":"絕對需要經過漏電斷路器保護之"},{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－建物與室內裝修管理實務（建3-1～建3-3）","r":"頁碼43（PDF第44頁）","q":"及浴室插座分路、陽臺之插座等。"}]}},{"id":"07-02-019","c":"07","t":"07-02","n":"19","q":"下列何種為電氣接地線之顏色？","o":["白色","黑色","黃色","綠色"],"a":"D","ty":"gen","e":{"s":"ok","x":"用戶用電設備裝置規則第27條第6款：個別被覆或絕緣之設備接地導線，其外觀應為綠色或綠色加一條以上之黃色條紋者，故選(D)。","b":[{"k":"law","l":"用戶用電設備裝置規則","r":"第27條第6款","q":"個別被覆或絕緣之設備接地導線，其外觀應為綠色或綠色加一條以上之黃色條紋者。","m":"第27條序文：「接地系統應依下列規定施工:」；第28條亦規定與電路導線共同配裝之接地導線絕緣應為綠色或綠色加黃色條紋。","u":"https://law.moea.gov.tw/LawContent.aspx?id=FL011045"}],"nt":"非官方網站6laws.net 稱本規則於114-05-09全文修正為1014條（部分條文延後施行），但經濟部主管法規共用系統與全國法規資料庫均顯示最新為110-03-17修正，本題依官方系統所載條文。簡報屋況點交建3-1/建3-2未提及接地線顏色。"}},{"id":"07-03-001","c":"07","t":"07-03","n":"01","q":"下列哪一個為廚房突然跳電應先行檢視部分？","o":["是否使用電氣過多或器具故障短路","強制將斷路器復歸繼續使用","查看客廳用電情況","查看是否台電停電"],"a":"A","ty":"gen","e":{"s":"ok","x":"簡報（建3-1）頁18：分路如果用電過載、短路或者漏電，斷路器就可能呈現跳脫狀態，應委請合格電氣技術人員檢修；故廚房跳電應先檢視是否用電過多（過載）或器具故障短路，而非強制復歸，故選(A)。","b":[{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－建物與室內裝修管理實務（建3-1～建3-3）","r":"頁碼18（PDF第19頁）","q":"分路如果用電過載、短路或者漏電，斷路器就可能呈現跳脫狀態(為非關非開乃位於中段)，就應委請合格電氣技術人員檢修；"}]}},{"id":"07-03-002","c":"07","t":"07-03","n":"02","q":"下列何種為更換屋內燈泡時應留意之事項？","o":["關閉電源","保持雙手濕潤","盡量不穿鞋","更換衣服"],"a":"A","ty":"gen","e":{"s":"ok","x":"標準檢驗局臺南分局「一般室內照明用燈具選購與使用指南」：「更換光源或進行清潔維修時須確認為斷電狀態後進行」，故更換燈泡應先關閉電源，故選(A)。","b":[{"k":"web","l":"一般室內照明用燈具選購與使用指南（經濟部標準檢驗局臺南分局 林昆平、蔡孟廷）","r":"","q":"更換光源或進行清潔維修時須確認為斷電狀態後進行，並戴手套以免割傷。","m":"另載安裝筒燈時應先關閉電源，並以驗電筆測試配線回路是否帶電；更換光源前確認光源已冷卻以免燙傷。","u":"https://www.bsmi.gov.tw/wSite/public/Attachment/f1520305099960.pdf"}],"nt":"簡報屋況點交未提及更換燈泡。"}},{"id":"07-03-003","c":"07","t":"07-03","n":"03","q":"冷氣機不冷可從下列何種方式簡易著手處理？","o":["每兩週清洗一次濾網及定期維護","更新冷氣","更換為變頻冷氣","更新排水器"],"a":"A","ty":"gen","e":{"s":"ok","x":"標準檢驗局冷氣機使用指南：「按月清洗濾網，可以增加冷房效果且降低電費支出」；行政院消費者保護會亦建議「每兩週清洗空氣過濾網一次」。故冷氣不冷可先從定期清洗濾網、維護著手，故選(A)。","b":[{"k":"web","l":"標準檢驗局提供民眾空氣調節器(俗稱冷氣機)選購及使用指南（經濟部標準檢驗局）","r":"","q":"按月清洗濾網，可以增加冷房效果且降低電費支出。","u":"https://www.bsmi.gov.tw/wSite/ct?xItem=57828&ctNode=1968&mp=5"},{"k":"web","l":"冷氣機應如何選購、裝設及維護?（行政院消費者保護會－個人及家庭用品類）","r":"","q":"每兩週清洗空氣過濾網一次，避免空氣過濾網太髒，造成電力浪費。","u":"https://cpc.ey.gov.tw/Page/FE9525A02632DF97/1591ef17-b9e8-4d90-bfff-26e2bba2d49a"}],"nt":"簡報屋況點交未提及冷氣濾網；標檢局建議按月、消保會建議每兩週，頻率略有不同，但清洗濾網可增加冷房效果之結論一致。"}},{"id":"07-03-004","c":"07","t":"07-03","n":"04","q":"臥室可用暖色系光源，產生溫暖之感覺，請問色溫低於多少者為暖色系？","o":["7,000K","6,000K","8,000K","5,000K"],"a":"D","ty":"num","e":{"s":"unclear","x":"","b":[{"k":"web","l":"正確選購LED燈泡 節能、安全又環保（經濟部標準檢驗局）","r":"","q":"2700K-3000K：暖黃光，適合家居、臥室等放鬆環境。","m":"同頁：3500K-4100K為中性白光；5000K-6500K為冷白光或日光。","u":"https://www.bsmi.gov.tw/bsmiGIP/wSite/ct?xItem=122829&ctNode=9898&mp=1"}],"f":"標準檢驗局將2700K-3000K列為暖黃光、3500K-4100K為中性白光、5000K-6500K為冷白光，未以「低於5000K」作為暖色系界線（依該分類，3500K-4100K屬中性白光而非暖色）；簡報屋況點交無色溫內容；未找到以5000K為暖色界線之官方資料。題庫答案(D)僅是四選項中最接近者，資料不足以明確支持。"}},{"id":"07-03-005","c":"07","t":"07-03","n":"05","q":"螺旋燈泡規格E27是指下列哪一種規格？","o":["電壓規格","螺口燈頭的直徑","燈泡的直徑","光通量規格"],"a":"B","ty":"gen","e":{"s":"ok","x":"維基百科「Edison screw」說明燈頭代號Exx中「xx indicates the diameter in millimeters as measured across the peaks of the thread on the base」，即E27之27為螺口燈頭直徑（公釐），故選(B)。","b":[{"k":"web","l":"Edison screw（Wikipedia英文版）","r":"","q":"xx indicates the diameter in millimeters as measured across the peaks of the thread on the base (male)","m":"Exx 中之數字為燈頭螺紋外徑（公釐），如E27為27公釐螺口燈頭。","u":"https://en.wikipedia.org/wiki/Edison_screw"}],"nt":"未找到官方（標準檢驗局、CNS）明文說明E27數字意義，僅有維基百科可據；簡報屋況點交未提及。"}},{"id":"07-03-006","c":"07","t":"07-03","n":"06","q":"地震後RC牆裂縫寬度超過多少，需要請專業人員評估？","o":["1公分","0.2公分","2公分","0.5公分"],"a":"B","ty":"num","e":{"s":"ok","x":"臺中市政府都市發展局《地震後房屋結構自行初步檢測簡易手冊》將「RC 牆斜向裂縫，裂縫寬度 0.2 公分以上」「RC 牆水平裂縫寬度 0.2 公分以上」等列為應請專業人員評估之情形，故選(B)。","b":[{"k":"web","l":"地震後房屋結構自行初步檢測簡易手冊（臺中市政府都市發展局編製）","r":"","q":"RC 牆斜向裂縫，裂縫寬度 0.2 公分以上","m":"手冊將RC牆斜向、X形、水平裂縫寬度0.2公分以上列為應請專業人員評估；RC外牆X形裂縫寬度0.2公分以下屬可自行修復。","u":"https://www.ud.taichung.gov.tw/media/214852/62229243871.pdf"}],"nt":"簡報屋況點交未提及震後裂縫判斷。"}},{"id":"07-03-007","c":"07","t":"07-03","n":"07","q":"直接給水系統適合下列哪一種型態建築物？","o":["摩天高樓","平房","高層建築物","6樓以上大樓"],"a":"B","ty":"gen","ns":1,"e":{"s":"ok","x":"建築物給水排水設備設計技術規範第3.1.1點說明：直接給水系統由自來水幹管壓力直接供給用水器具，「適用於一般小規模之建築物」，重力、加壓給水則適用一般或高層建築。平房屬小規模建築物，故選(B)。","b":[{"k":"web","l":"建築物給水排水設備設計技術規範（內政部國土管理署網站PDF）","r":"","q":"直接給水系統：由自來水幹管壓力直接供給建築物內之用水器具給水，適用於一般小規模之建築物","m":"第3.1.1點說明(4)：另重力給水系統於高層建築物需另設中間水槽；加壓泵給水系統適用於無法採用重力給水之高層建築。","u":"https://www.nlma.gov.tw/uploads/files/7b5f02739dad0e121f246b4dc1b6006a.pdf"}],"nt":"簡報屋況點交未提及給水方式分類。"}},{"id":"07-03-008","c":"07","t":"07-03","n":"08","q":"一般而言，大樓住戶專有水表最可能集中設置於下列哪一個位置？","o":["住宅陽臺","住宅浴室","大樓管理室","屋頂平台"],"a":"D","ty":"gen","e":{"s":"ok","x":"簡報（建3-1）頁20水錶位置表：電梯華廈（五樓以上）與大樓之水錶可能位置為「屋頂層」，並附「大樓集中水錶」照片，故大樓住戶水表最可能集中設於屋頂平台，故選(D)。","b":[{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－建物與室內裝修管理實務（建3-1～建3-3）","r":"頁碼20（PDF第21頁）","q":"大樓 屋頂層"},{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－建物與室內裝修管理實務（建3-1～建3-3）","r":"頁碼20（PDF第21頁）","q":"電梯華廈 屋頂層 五樓以上"},{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－建物與室內裝修管理實務（建3-1～建3-3）","r":"頁碼5（PDF第6頁）","q":"水表 屋頂層"}]}},{"id":"07-03-009","c":"07","t":"07-03","n":"09","q":"下列何者是簡易觀察住宅是否給水設備漏水之方式？","o":["雨天觀察","看隔壁是否有壁癌","關閉所有用水設備看水錶是否轉動","看電費是否增加"],"a":"C","ty":"gen","e":{"s":"ok","x":"經濟部水利署節水小撇步：「所有水龍頭緊閉並確定無人用水時，水錶卻仍在轉動，表示屋內或地下水管有漏水。」節水手冊亦載檢查漏水可先關閉家中所有用水器材，檢查水錶指針是否轉動，故選(C)。","b":[{"k":"web","l":"節水小撇步（經濟部水利署全球資訊網）","r":"","q":"所有水龍頭緊閉並確定無人用水時,水錶卻仍在轉動,表示屋內或地下水管有漏水。","m":"節水小撇步(五)第2點。","u":"https://www.wra.gov.tw/cp.aspx?n=3882"},{"k":"web","l":"節水用水技術手冊－家庭用水「家庭節水要點」（經濟部水利署網站PDF）","r":"","q":"檢查漏水可先關閉家中所有用水器材，檢查水錶指針是否轉動，有轉動表示漏水","u":"https://web-ws.wra.gov.tw//001/Upload/oldfile/wcis/content/library/pdf/家庭節水手冊檔案003.pdf"}],"nt":"簡報屋況點交未提及以水錶檢查漏水。"}},{"id":"07-03-010","c":"07","t":"07-03","n":"10","q":"下列何者是簡易觀察住宅是否衛浴排水設備漏水之方式？","o":["排水加入色料觀察","看隔壁是否有壁癌","關閉用水設備看水錶是否轉動","視覺觀察"],"a":"A","ty":"gen","e":{"s":"unclear","x":"","b":[{"k":"web","l":"節水小撇步（經濟部水利署全球資訊網）","r":"","q":"留意與檢查馬桶是否漏水,可將進水三角閥關閉,使用馬桶水箱測漏試劑,觀察水封水是否變色;","m":"節水小撇步(一)第3點：以測漏試劑（色劑）檢查馬桶水箱是否漏水。","u":"https://www.wra.gov.tw/cp.aspx?n=3882"}],"f":"官方資料僅見水利署以「馬桶水箱測漏試劑」觀察水封水是否變色來檢查馬桶水箱（給水止水閥）漏水，未說明以「排水加入色料」檢查衛浴排水設備（排水管）漏水；簡報屋況點交（頁22地板排水）只談排水阻塞測試；臺北自來水事業處FAQ、台灣自來水公司漏水檢查頁（僅圖片無文字）亦無此方法。"}},{"id":"07-03-011","c":"07","t":"07-03","n":"11","q":"住宅給水設備漏水，水費異常之可能原因何者錯誤？","o":["水錶處漏水","馬桶水箱浮球漏水","水龍頭漏水","電氣盤體漏電"],"a":"D","ty":"neg","e":{"s":"ok","x":"臺北自來水事業處說明水費突增原因包括水表問題、抄表問題、竊水及「用戶表後用水設備(含水池、水塔、水栓、馬桶等用水設備)漏水」，均與用水有關；電氣盤體漏電屬電氣問題，與水費無關，故選(D)。","b":[{"k":"web","l":"臺北自來水事業處－常見問答「水費突增原因及如何申請複查?」","r":"","q":"(3)漏水：用戶表後用水設備(含水池、水塔、水栓、馬桶等用水設備)漏水。","m":"另列(1)水表問題：故障快轉、錯裝；(2)抄表問題；(4)竊水。","u":"https://www.water.gov.taipei/News_Content.aspx?n=30E4EDA27F6D9953&s=B4E980116DF054A7"},{"k":"web","l":"台灣自來水公司新聞「水公司呼籲民眾留意家中用水情形 避免水費突增」","r":"","q":"住家常見漏水點有馬桶水箱漏水、水塔浮球或RO濾水器漏水","m":"關閉所有用水設備後，水表指針若仍持續轉動，表示有用水設備漏水。","u":"https://www.water.gov.tw/ch/Subject/Detail/83058?nodeId=712"}],"nt":"選項(A)「水錶處漏水」資料係寫「表後用水設備漏水」及水表問題，用語略異；本題為選錯誤者，(D)電氣盤漏電明顯與水費無關。"}},{"id":"07-03-012","c":"07","t":"07-03","n":"12","q":"住宅給水水龍頭出水變小，可以以何種方式簡易排除？","o":["清潔水龍頭濾網","打電話給自來水公司申請調整水量","更換較大的水龍頭","更換較大的水錶"],"a":"A","ty":"gen","e":{"s":"not_found","x":"","b":[],"f":"簡報屋況點交無水龍頭出水變小之處理。查臺北自來水事業處「用戶家中發現無(缺)水怎麼辦？」及FAQ、台灣自來水公司「漏水(無水)檢查、預防及處理」與第八區「無水簡易自行檢查」、水利署節水小撇步（起波器僅作為節流器）、標準檢驗局燈具/LED指南，均未提到清潔水龍頭濾網；台灣自來水公司漏水檢查子頁僅有圖片無文字。"}},{"id":"07-03-013","c":"07","t":"07-03","n":"13","q":"住宅洗手盆排水速度變慢水，可以以何種方式簡易排除？","o":["清潔排水孔","打電話給自來水公司申請調整水量","更換較大的排水孔","靜置一晚"],"a":"A","ty":"gen","e":{"s":"ok","x":"簡報（建3-1）頁22：排水簡易測試為打開水龍頭使其自然排水（衛浴、陽台、廚房等），如有些微阻塞可使用簡易通管工具DIY處理，大多為毛髮阻塞所致；故洗手盆排水變慢可先清潔排水孔，故選(A)。","b":[{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－建物與室內裝修管理實務（建3-1～建3-3）","r":"頁碼22（PDF第23頁）","q":"如有些微阻塞可使用簡易通管工具DIY處理，大多為毛髮阻塞所致。"}],"nt":"簡報此段標題為「地板排水」，地點含衛浴；用於洗手盆排水阻塞之簡易處理。"}},{"id":"07-03-014","c":"07","t":"07-03","n":"14","q":"無人使用廁所，若有絲絲的聲響，下列何者為最可能之原因？","o":["馬桶浮球故障","水龍頭故障","漏電","燈光故障"],"a":"A","ty":"gen","e":{"s":"unclear","x":"","b":[{"k":"web","l":"臺北自來水事業處－FAQ「一般馬桶漏水原因為何?」","r":"","q":"可能原因包括:止水皮（蓋）變形、進水器故障，止水墊片老化、隙縫塞卡雜質、異物、浮球螺絲位偏","u":"https://www.water.gov.taipei/cp.aspx?n=F28F9731A528DE06"}],"f":"臺北自來水事業處FAQ列馬桶漏水原因含進水器故障、浮球螺絲位偏等，但未提及無人使用時之「絲絲聲響」；水利署節水小撇步、台灣自來水公司網頁亦無聲響判斷。聲響與浮球故障之關聯未見官方資料，簡報屋況點交亦無（頁22之浮球係指冷氣排水器）。"}},{"id":"07-03-015","c":"07","t":"07-03","n":"15","q":"長期無人使用浴室，若有些微臭味，下列何者為可能之原因？","o":["使用廁所後未清潔","水龍頭故障","存水彎水封長期未使用，水乾導致水封破壞","馬桶浮球故障"],"a":"C","ty":"gen","e":{"s":"ok","x":"建築物給水排水設備設計技術規範：水封為存水彎內蓄留之水，「用以防止從排水管來的臭氣、下水廢氣、害蟲等侵入室內」；第4.4.1點說明並指出衛生設備之存水彎常因使用率低而乾涸，造成存水彎破封。故長期未使用之浴室有臭味，可能是存水彎水封乾涸破壞，故選(C)。","b":[{"k":"web","l":"建築物給水排水設備設計技術規範（內政部國土管理署網站PDF）","r":"","q":"水封 存水彎內所蓄留之水，用以防止從排水管來的臭氣、下水廢氣、害蟲等侵入室內者稱之","m":"第1.4點用語定義第33點。","u":"https://www.nlma.gov.tw/uploads/files/7b5f02739dad0e121f246b4dc1b6006a.pdf"},{"k":"web","l":"建築物給水排水設備設計技術規範（內政部國土管理署網站PDF）","r":"","q":"衛生設備之存水彎常因使用率低而乾凅，經常造成存水彎破封而威脅建築物內環境安全","m":"第4.4.1點說明(2)；第4.4.2點並列蒸發作用等為水封喪失原因。","u":"https://www.nlma.gov.tw/uploads/files/7b5f02739dad0e121f246b4dc1b6006a.pdf"}],"nt":"簡報屋況點交未提及存水彎水封。"}},{"id":"07-03-016","c":"07","t":"07-03","n":"16","q":"流理台下方長期潮濕之情形，下列何者為可能之原因？","o":["排水軟管破損","水龍頭故障","存水彎水封因為長期未使用，水乾導致水封破壞","加壓馬達故障"],"a":"A","ty":"gen","e":{"s":"not_found","x":"","b":[],"f":"簡報屋況點交（頁22地板排水、頁5設備一覽表廚具）未提及流理台下方潮濕原因；上網查臺北自來水事業處FAQ、水利署節水小撇步、台灣自來水公司漏水檢查頁，均無「流理台下方長期潮濕—排水軟管破損」之說明；網路搜尋僅得民間業者文章及垃圾網站。"}},{"id":"07-03-017","c":"07","t":"07-03","n":"17","q":"有關空調室外機需要預留排水管之敘述，下列何者正確？","o":["窗型冷氣需要預留排水管","應預留給水管路","冷暖型室外機應預留排水管","自行決定"],"a":"C","ty":"gen","e":{"s":"ok","x":"分離式冷暖氣機安裝說明書：「因為在供熱運轉期間，室外機組會流出廢水，請安裝另外購買的排水管」；Panasonic冷暖氣機使用說明書亦載暖氣除霜時「室外機有水流出（溶霜化水）」。故冷暖型室外機應預留排水管，故選(C)。","b":[{"k":"web","l":"空調機（分離壁掛式）安裝說明書（富士通將軍台灣網站下載）","r":"","q":"因為在供熱運轉期間，室外機組會流出廢水，請安裝另外購買的排水管並連接至市售的 16 mm 軟管。","m":"另載：在供熱運轉時排水會從室外機組流出，因此請將室外機組安裝在排水不受阻礙之處。","u":"https://br.fujitsu-general.com/tw/download/support/aircon/aocg_nocriax_installmanual.pdf"},{"k":"web","l":"分離式冷(暖)氣機使用說明書（Panasonic台灣網站下載）","r":"","q":"室外溫度低，濕度高時，室外機會結霜。","m":"除霜時室外機有水流出（溶霜化水）。","u":"https://pmst.panasonic.com.tw/PSMIOUT/DL/DLFiles/1729/1729_C_26770.pdf"}],"nt":"簡報（建3-1）頁22僅談室內機冷氣排水（預埋排水管或排水器），未提冷暖型室外機；官方網站未查到，依廠商說明書。另臺南市環保局（109-05-21）指出「不論是箱型或分離式冷氣，運轉都會排水」，滴水污染時建議加裝排水管（https://web.tainan.gov.tw/epb/News_Content.aspx?n=15914&s=7673003），故(A)窗型冷氣並非全無排水問題；但本題問室外機，(C)有明確依據。"}},{"id":"07-03-018","c":"07","t":"07-03","n":"18","q":"室內空調冷氣機下方漏水，不使用空調時就沒有漏水，下列何種原因不可能發生？","o":["冷氣排水阻塞","冷氣排水器故障","冷氣排水器濾網阻塞","跳電"],"a":"D","ty":"neg","e":{"s":"ok","x":"簡報（建3-1）頁22：冷氣排水可灌水測試管路是否暢通，外接排水器「常因水垢導致浮球故障」；臺南市環保局亦說明冷氣「運轉都會排水」，且排水管阻塞十分常見。題目所述漏水只在使用空調時發生，屬冷凝水排水不良（排水阻塞、排水器故障或阻塞）；跳電時冷氣無法運轉、不產生冷凝水，不可能是漏水原因，故選(D)。","b":[{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－建物與室內裝修管理實務（建3-1～建3-3）","r":"頁碼22（PDF第23頁）","q":"新大樓大多有預埋冷氣排水管路，可以使用給水軟管徐徐灌入測試是否暢通。"},{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－建物與室內裝修管理實務（建3-1～建3-3）","r":"頁碼22（PDF第23頁）","q":"排水器常因水垢導致浮球故障，可以打開簡易清潔排除故障。"},{"k":"web","l":"臺南市政府環境保護局「炎熱天氣來臨，開冷氣前先檢查冷氣機排水管」","r":"","q":"民眾夏天普遍都要開冷氣，但不論是箱型或分離式冷氣，運轉都會排水","m":"冷氣運轉時會產生冷凝水需排除；入夏後冷氣機排水管劣化、斷裂、阻塞十分常見，應檢查排水管。","u":"https://web.tainan.gov.tw/epb/News_Content.aspx?n=15914&s=7673003"}],"nt":"資料未直接提到「排水器濾網」；(D)跳電不可能造成漏水，係依「冷氣運轉才排水（產生冷凝水）」推論。"}},{"id":"07-03-019","c":"07","t":"07-03","n":"19","q":"某大樓有15層樓，其中2樓住宅長期無人居住，若有正常繳交水費，但整戶無水可用，下列何者為最可能發生的原因？","o":["減壓閥長期未使用，以致閥件卡死","可能管理費未繳，導致被關閉水源","水龍頭陶瓷軸心卡死","跳電"],"a":"A","ty":"gen","e":{"s":"unclear","x":"","b":[{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－建物與室內裝修管理實務（建3-1～建3-3）","r":"頁碼5（PDF第6頁）","q":"水壓超過3.5kg，當層2.2減壓閥管道或往上三個樓層"},{"k":"law","l":"建築物給水排水設備設計技術規範（內政部）","r":"第3.4.6點","q":"建築物一般給水壓力，超過3.5kg/cm2之限度時，應設置中間水槽或減壓閥等，以調整給水壓力。","u":"https://www.nlma.gov.tw/uploads/files/7b5f02739dad0e121f246b4dc1b6006a.pdf"},{"k":"web","l":"自來水全球資訊網「漏水(無水)檢查、預防及處理」（台灣自來水公司）","r":"","m":"無水狀況列有：水表前止水栓被關閉、總出水閥門被關閉或失靈、停水後管內積聚空氣、水管異物堵塞、進水閥（浮球開關）卡住、未繳水費被停水等；未提到減壓閥。","u":"https://www.water.gov.tw/ch/Subject/Detail/788?nodeId=1079"}],"f":"簡報（建3-1）頁5設備表只列減壓閥設於「水壓超過3.5kg」之當層管道或往上三個樓層；建築物給水排水設備設計技術規範3.4.6點只規定水壓超過3.5kg/cm2應設減壓閥。台灣自來水公司「漏水(無水)檢查」頁及第八區處「無水簡易自行檢查」頁列出的無水原因（止水栓或總出水閥門關閉／失靈、欠費拆表、水塔阻塞等）都沒有提到減壓閥。網路搜尋「減壓閥 長期未使用 卡死」找不到官方資料。題庫答案「減壓閥長期未使用以致閥件卡死」沒有明確依據。","nt":"低樓層因水壓高而設減壓閥、閥門失靈可致無水，可作為答案方向，但缺少直接說明。"}},{"id":"07-03-020","c":"07","t":"07-03","n":"20","q":"若15樓大樓的10樓住戶長期無人居住，除了大樓分攤水費之外，專有部分卻有流動水費用產生，下列何者為最可能的原因？","o":["被鄰居偷水","自來水水公司計價錯誤","馬桶浮球故障，以致無法自動止水而從溢水管流失，以致持續補充水源耗水","沒繳交電費被停電錶"],"a":"C","ty":"gen","e":{"s":"ok","x":"台灣自來水公司新聞稿：「住家常見漏水點有馬桶水箱漏水、水塔浮球或RO濾水器漏水」，並說明關閉所有用水設備後水表指針若持續轉動，即表示有用水設備漏水。長期無人居住卻持續產生用水度數，最可能是馬桶水箱浮球故障無法止水而持續流失補水，故選(C)。","b":[{"k":"web","l":"台灣自來水公司第七區管理處新聞「水公司呼籲民眾留意家中用水情形 避免水費突增」","r":"","q":"住家常見漏水點有馬桶水箱漏水、水塔浮球或RO濾水器漏水；","m":"收到用水異常通知時，可將所有用水設備關閉後查看水表指針是否再轉動，若持續轉動即表示有用水設備正在漏水，應找合格水電商檢修。","u":"https://www.water.gov.tw/ch/Subject/Detail/83058?nodeId=712"}],"nt":"官方資料只說馬桶水箱是常見漏水點，沒有細述浮球失靈後水從溢水管流失的過程。"}},{"id":"07-03-021","c":"07","t":"07-03","n":"21","q":"房東想要查詢房屋用電資料，可以用何種方式查詢？","o":["詢問大樓管理員","詢問水公司","向大樓管理委員會查詢","台灣電力公司繳費狀況查詢網站"],"a":"D","ty":"case","e":{"s":"ok","x":"簡報（建3-1）頁17：台電電表都標示地址及電號，「使用台灣電力公司電子帳單服務系統，依照電號及戶名就可以查詢當年度用電資訊以及帳單狀態」，故選(D)。","b":[{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－建物與室內裝修管理實務（建3-1～建3-3）","r":"頁碼17（PDF第18頁）","q":"使用台灣電力公司電子帳單服務系統，依照電號及戶名就可以查詢當年度用電資訊以及帳單狀態"}]}},{"id":"07-04-001","c":"07","t":"07-04","n":"01","q":"衛浴瓦斯熱水器燃燒不完全恐發生下列哪一種災害？","o":["瓦斯中毒","一氧化碳中毒","二氧化碳中毒","沼氣中毒"],"a":"B","ty":"gen","e":{"s":"ok","x":"簡報（建3-2）頁40：瓦斯熱水器可能因裝設位置錯誤、陽臺外推加設窗戶等，「導致因燃燒不完全引發一氧化碳中毒傷亡事件」；頁44也說明燃料不完全燃燒會產生無色無味的一氧化碳，故選(B)。","b":[{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－建物與室內裝修管理實務（建3-1～建3-3）","r":"頁碼40（PDF第41頁）","q":"而瓦斯熱水器可能因為裝設位置錯誤、陽臺外推加設窗戶、熱水器形式錯誤等導致因燃燒不完全引發一氧化碳中毒傷亡事件"},{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－建物與室內裝修管理實務（建3-1～建3-3）","r":"頁碼44（PDF第45頁）","q":"一氧化碳中毒主要原因是燃料在密閉或通氣不良的室內燃燒，導致碳氫化合物不完全燃燒，產生無色無味的有毒一氧化碳氣體"}]}},{"id":"07-04-002","c":"07","t":"07-04","n":"02","q":"若瓦斯有臭味，下列何者為臭味發生之原因？","o":["因瓦斯與空氣混合產生化學變化而產生臭氣","因添加臭氣作為警示劑","瓦斯燃燒後產生臭氣","瓦斯與血液中血紅素結合讓人感到臭氣"],"a":"B","ty":"gen","e":{"s":"ok","x":"內政部消防署說明「瓦斯是無色、無味的氣體」，聞到的臭味是「添加在瓦斯裡的臭味劑」；桃園市政府消防局也說明國內家用液化石油氣都添加臭味劑，「一有漏氣即可察覺」，故選(B)。","b":[{"k":"web","l":"內政部消防署全球資訊網專業版「發現瓦斯漏氣 要立刻開抽風機？還是拿電扇吹？」","r":"","q":"瓦斯是無色、無味的氣體","m":"瓦斯本身無色無味，聞到的臭雞蛋味是添加在瓦斯裡的臭味劑。","u":"https://www.nfa.gov.tw/pro/index.php?code=list&flag=detail&ids=113&article_id=546"},{"k":"web","l":"桃園市政府消防局「液化石油氣是什麼」","r":"","q":"液化石油氣本身無色、無味、無毒，目前國內供應家庭使用之液化石油氣皆添加臭味劑，一有漏氣即可察覺。","u":"https://www.tyfd.gov.tw/cht/index.php?act=article&code=detail&ids=153&article_id=1094"}]}},{"id":"07-04-003","c":"07","t":"07-04","n":"03","q":"下列何者為一氧化碳對於人體有危害之原因？","o":["導致血糖升高","一氧化碳與瓦斯結合產生毒氣","導致人體過度亢奮","導致人體組織缺氧"],"a":"D","ty":"gen","e":{"s":"ok","x":"臺中市政府消防局「防範一氧化碳中毒Q&A」：一氧化碳與血紅素的結合力約為氧氣的200倍，會「使血液的攜氧能力降低，造成身體組織無法充足含氧」，也就是導致人體組織缺氧，故選(D)。","b":[{"k":"web","l":"臺中市政府消防局「NOCO將防範CO中毒宣導－防範一氧化碳中毒Q&A」","r":"","q":"使血液的攜氧能力降低，造成身體組織無法充足含氧","m":"一氧化碳與血液中血紅素（氧氣載體）的結合力約為氧氣的200倍，吸入後會取代氧氣與血紅素結合。","u":"https://www.fire.taichung.gov.tw/content/index.asp?Parser=1,4,298,218"}]}},{"id":"07-04-004","c":"07","t":"07-04","n":"04","q":"屋外式瓦斯熱水器應安裝於哪一個適當位置以避免災害發生？","o":["密閉陽台","室內樓梯間","廚房內","外牆"],"a":"D","ty":"gen","e":{"s":"ok","x":"簡報（建3-2）頁42引消防法第15條之1：燃氣熱水器應裝設於建築物外牆，或有開口且與戶外空氣流通之位置；頁44指出屋外式熱水器裝在屋內、加蓋陽臺等通風不良處所是中毒主因。內政部也提醒屋外式熱水器「只能裝在室外通風良好的地方」，密閉陽台、室內樓梯間、廚房內都不適合，故選(D)。","b":[{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－建物與室內裝修管理實務（建3-1～建3-3）","r":"頁碼42（PDF第43頁）","q":"燃氣熱水器應裝設於建築物外牆，或裝設於有開口且與戶外空氣流通之位置"},{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－建物與室內裝修管理實務（建3-1～建3-3）","r":"頁碼44（PDF第45頁）","q":"屋外式熱水器（RF式）安裝在通風不良處所（如屋內、加蓋陽臺等）約占80.38%"},{"k":"law","l":"消防法","r":"第15條之1第4項","q":"第一項熱水器應裝設於建築物外牆，或裝設於有開口且與戶外空氣流通之位置；其無法符合者，應裝設熱水器排氣管將廢氣排至戶外。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0120001"},{"k":"web","l":"內政部新聞「防一氧化碳中毒 消防署提醒：熱水器安裝5原則」","r":"","q":"屋外式熱水器只能裝在室外通風良好的地方，而且不要晾掛大量衣物、加裝窗戶妨礙通風","u":"https://www.moi.gov.tw/News_Content.aspx?n=10&sms=9009&s=256676"}]}},{"id":"07-04-005","c":"07","t":"07-04","n":"05","q":"瓦斯熱水器安裝應由下列哪一種證照人員安裝？","o":["燃氣熱水器及其配管承裝業之合格技術士","甲種電匠","電氣技術人員","水匠"],"a":"A","ty":"gen","e":{"s":"ok","x":"消防法第15條之1第1項：燃氣熱水器及配管之承裝業應申請營業登記後才能營業，而且燃氣熱水器的安裝「非經僱用領有合格證照者，不得為之」；簡報（建3-2）頁42及內政部宣導也都說熱水器要請合格的承裝業技術士施作，故選(A)。","b":[{"k":"law","l":"消防法","r":"第15條之1第1項","q":"使用燃氣之熱水器及配管之承裝業，應向直轄市、縣（市）政府申請營業登記後，始得營業。並自中華民國九十五年二月一日起使用燃氣熱水器之安裝，非經僱用領有合格證照者，不得為之。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0120001"},{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－建物與室內裝修管理實務（建3-1～建3-3）","r":"頁碼42（PDF第43頁）","q":"且目前燃氣熱水器之安裝，應有合格證照者為之。"},{"k":"web","l":"內政部新聞「防一氧化碳中毒 消防署提醒：熱水器安裝5原則」","r":"","q":"都要請合格的承裝業技術士來施作，以確保安全。","u":"https://www.moi.gov.tw/News_Content.aspx?n=10&sms=9009&s=256676"}]}},{"id":"07-04-006","c":"07","t":"07-04","n":"06","q":"下列何者為住宅用火災警報器換電池的時機？","o":["每1個月","每2個月","每季","異常聲響發報時"],"a":"D","ty":"gen","e":{"s":"ok","x":"簡報（建3-2）頁32：「住宅用火災警報器以電池為電源者，於達電壓下限發出提示或聲響時，管理權人即更換電池。」消防署住警器Q&A也說，電池快沒電時警報器會發出「嗶」聲並閃燈，表示要換電池，故選(D)。","b":[{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－建物與室內裝修管理實務（建3-1～建3-3）","r":"頁碼32（PDF第33頁）","q":"住宅用火災警報器以電池為電源者，於達電壓下限發出提示或聲響時，管理權人即更換電池。"},{"k":"web","l":"內政部消防署全球資訊網－住宅用火災警報器－住警器Q&A","r":"","q":"當警報器電池快沒電時，會發生「嗶」的一定間隔的短促音，並且警報燈會閃爍，代表要更換新的電池。","u":"https://www.nfa.gov.tw/cht/index.php?code=list&ids=1083"}]}},{"id":"07-04-007","c":"07","t":"07-04","n":"07","q":"住宅用火災警報器，為了避免警報器本體劣化而影響功能，建議設置超過多久時，最好更換新品？","o":["1年","2年","10年","5年"],"a":"C","ty":"num","e":{"s":"ok","x":"內政部消防署住警器Q&A：「為了避免警報器本體劣化影響功能，建議設置超過10年時，最好更換新品。」故選(C)。","b":[{"k":"web","l":"內政部消防署全球資訊網－住宅用火災警報器－住警器Q&A","r":"","q":"為了避免警報器本體劣化影響功能，建議設置超過10年時，最好更換新品。","m":"位於Q6「住宅用火災警報器平時檢查方法」之警報器本體壽命段落。","u":"https://www.nfa.gov.tw/cht/index.php?code=list&ids=1083"}]}},{"id":"07-04-008","c":"07","t":"07-04","n":"08","q":"住宅總電源斷路器忽然跳脫，下列何種為可能之原因？","o":["台電停電","用電負載超過額定容量","附近打雷","大樓正在測試發電機"],"a":"B","ty":"gen","e":{"s":"ok","x":"簡報（建3-1）頁18：「分路如果用電過載、短路或者漏電，斷路器就可能呈現跳脫狀態」，也就是用電負載超過額定容量時斷路器會跳脫，故選(B)。","b":[{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－建物與室內裝修管理實務（建3-1～建3-3）","r":"頁碼18（PDF第19頁）","q":"分路如果用電過載、短路或者漏電，斷路器就可能呈現跳脫狀態"}],"nt":"簡報講的是電燈分電箱各分路斷路器，題目問總電源斷路器；兩者跳脫原因相同（過載）。"}},{"id":"07-04-009","c":"07","t":"07-04","n":"09","q":"廚房多為大功率電器產品，且容易為潮濕區域，下列何種作為可強化用電安全？","o":["加裝小夜燈","插座上加裝漏電斷路器","使用110V電壓代替220V電壓","使用具備USB充電功能之插座"],"a":"B","ty":"gen","e":{"s":"ok","x":"用戶用電設備裝置規則第87條第2項第7款：住宅場所陽台插座分路及「距離廚房水槽外緣一‧八米範圍內之插座分路」，應裝設漏電斷路器；簡報（建3-2）頁39、43也強調浴室、陽臺插座等用電處要有漏電斷路器保護，故選(B)。","b":[{"k":"law","l":"用戶用電設備裝置規則（原：屋內線路裝置規則）","r":"第87條第2項第7款","q":"住宅場所陽台之插座分路及距離廚房水槽外緣一‧八米範圍內之插座分路。","m":"第87條第2項：符合所列規定之用電設備、器具或線路，應在其電路上或設備、器具外之適當位置裝設漏電斷路器。","u":"https://lawplayer.com/act/6437d1ade800e5f0b9304146/7"},{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－建物與室內裝修管理實務（建3-1～建3-3）","r":"頁碼39（PDF第40頁）","q":"浴室內插座以及電能熱水器使用之電源應有良好接地以及漏電斷路器設備，以維護用電安全。"},{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－建物與室內裝修管理實務（建3-1～建3-3）","r":"頁碼43（PDF第44頁）","q":"及浴室插座分路、陽臺之插座等。"}]}},{"id":"07-04-010","c":"07","t":"07-04","n":"10","q":"住宅內火警探測器亮起紅燈時，表示下列哪一種狀況？","o":["瓦斯外洩警報","一氧化碳警報","該火警分區線路斷線","該探測器動作中"],"a":"D","ty":"gen","e":{"s":"ok","x":"簡報（建3-2）頁30的照片「裝設於天花板且動作樣態」，顯示警報器動作時亮紅燈；火警探測器製造商的產品說明也寫明「監視時綠燈閃爍，動作時紅燈恆亮」。所以探測器亮紅燈表示該探測器正在動作，故選(D)。","b":[{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－建物與室內裝修管理實務（建3-1～建3-3）","r":"頁碼30（PDF第31頁）","q":"裝設於天花板且動作樣態"},{"k":"web","l":"中美防火企業「CM-WT32L 光電式偵煙探測器附監視燈」產品頁","r":"","q":"主體採雙色LED設計，監視時綠燈閃爍，動作時紅燈恆亮，容易判別探測器是否正常運作。","u":"https://www.chungmei.net/cht/products.php?func=p_detail&p_id=11&pc_parent=4"}],"nt":"簡報頁30照片中警報器亮紅燈（看圖確認），圖說為「裝設於天花板且動作樣態」；頁23另說明探測器動作或斷線時由受信總機得知。"}},{"id":"07-04-011","c":"07","t":"07-04","n":"11","q":"有關室內裝修是否可以使用公共的消防緊急用電，下列何者正確？","o":["應經管理委員會同意即可使用","可使用，但不得作為溶劑噴漆使用","可任意使用","禁止使用"],"a":"D","ty":"gen","e":{"s":"unclear","x":"","b":[{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－建物與室內裝修管理實務（建3-1～建3-3）","r":"頁碼50（PDF第51頁）","q":"裝修材料應合於建築技術規則之規定。"}],"f":"三份簡報搜尋「緊急用電」「緊急電源」「發電機」都沒有結果；簡報頁50只引用建築法第77條之2（室內裝修不得妨害或破壞消防設備等）。網路上查到各類場所消防安全設備設置標準第191條（緊急電源插座：保護箱標示「緊急電源插座」字樣、上方設紅色表示燈、專用回路不得設漏電斷路器）；公寓大廈規約範本附件七「室內裝修工程具結書」沒有用電規定。這些資料都沒有明文禁止室內裝修使用公共消防緊急用電，找不到能直接支持「禁止使用」的依據。","nt":"第191條取自臺北市法規查詢系統附件 https://www.laws.taipei.gov.tw/lawatt/Law/A040040130000400-20130501-191000-001.pdf"}},{"id":"07-04-012","c":"07","t":"07-04","n":"12","q":"購買延長線應認明有哪一種安全標章以維護安全？","o":["節能標章","商品安全標章","環保標章","綠色標章"],"a":"B","ty":"gen","e":{"s":"ok","x":"經濟部標準檢驗局「使用延長線有撇步」：「選購延長線時應選擇有『商品安全標章』之商品」，商品本體也應標示額定電壓、電流及容量，故選(B)。","b":[{"k":"web","l":"經濟部標準檢驗局「【安全商品 安全使用】使用延長線有撇步」","r":"","q":"一、選購延長線時應選擇有「商品安全標章」之商品，商品本體亦應標示額定電壓（如 110 伏特(V)）、電流（如 15 安培(A)）及容量（如 1650 瓦(W)），並確實按額定負載容量使用。","u":"https://www.bsmi.gov.tw/bsmiGIP/wSite/public/Data/f1433985047916.pdf"},{"k":"web","l":"經濟部標準檢驗局「經濟部標準檢驗局公布市售『延長線』商品檢測結果」","r":"","q":"提醒消費者選購『延長線』時應購買有貼附商品檢驗標識之合格商品","u":"https://www.bsmi.gov.tw/wSite/ct?xItem=100159&ctNode=9685&mp=1"}],"nt":"標準檢驗局較新的新聞稿（2022年）用「商品檢驗標識」一詞，題目沿用「商品安全標章」的舊稱。"}},{"id":"07-04-013","c":"07","t":"07-04","n":"13","q":"住戶內部客廳之消防撒水頭滲漏水，應做下列哪一種維修處置？","o":["關閉火警自動警報設備","關閉火警自動廣播設備","關閉瓦斯開關","關閉當戶或當樓層制水閥並進行檢修"],"a":"D","ty":"gen","e":{"s":"ok","x":"簡報（建3-1）頁25：住宅撒水設備設有「各戶消防撒水閘閥開關」（照片），室內裝修時也不得任意關閉撒水閥件。撒水頭滲漏是撒水管路的問題，應關閉當戶或當樓層的撒水制水閥後再檢修，與火警自動警報、廣播設備或瓦斯無關，故選(D)。","b":[{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－建物與室內裝修管理實務（建3-1～建3-3）","r":"頁碼25（PDF第26頁）","q":"各戶消防撒水閘閥開關"},{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－建物與室內裝修管理實務（建3-1～建3-3）","r":"頁碼25（PDF第26頁）","q":"同時室內裝修行為中，亦不得將撒水閥件任意關閉。"}],"nt":"簡報只有撒水閘閥的照片和位置（頁5設備表列撒水閥件在大門入口處或當樓層梯間），沒有逐字寫出撒水頭漏水時的處理步驟；檢修完成後仍應恢復開啟（頁25不得任意關閉）。"}},{"id":"07-04-014","c":"07","t":"07-04","n":"14","q":"陶瓷臉盆就安全性而言，下列哪一種樣式安全係數較高？","o":["檯面式","壁掛式","支架式","不附檯面壁掛式"],"a":"A","ty":"gen","e":{"s":"ok","x":"經濟部標準檢驗局《消費商品選購及使用手冊》洗臉盆一節：不清楚牆面承受力或牆面是輕隔間時，應一律使用檯面式洗面盆；壁掛式洗面盆則「應使用支柱支撐以增加其穩固性」。可見檯面式的安全性比壁掛式（含支架式、不附檯面壁掛式）高，故選(A)。","b":[{"k":"web","l":"經濟部標準檢驗局《消費商品選購及使用手冊》","r":"","q":"壁掛式洗面盆應使用支柱支撐以增加其穩固性，支柱應有實際支撐之作用。","m":"洗臉盆一節另載：如無法瞭解牆面承受力之大小或牆面使用輕隔間之情況下，應一律使用（檯）面式洗面盆；並應定期檢查螺栓是否銹蝕鬆脫、瓷盆是否龜裂。","u":"https://www.bsmi.gov.tw/wSite/public/Data/f1328863375689.pdf"}],"nt":"WebFetch 從PDF擷取的原句是「…應一律使用面式洗面盆。」，經再次詢問確認擷取文字中「面式」前沒有「檯／台」字，研判是PDF文字層缺字；依文義及上下句（壁掛式應加支柱）判斷應為「檯面式」。"}},{"id":"07-04-015","c":"07","t":"07-04","n":"15","q":"衛浴設備應選用有下列哪一種標示的產品，以維護使用安全？","o":["出廠證明","正字標記或商品檢驗標識的產品","工地主任驗收合格證明","環保節能標章"],"a":"B","ty":"gen","e":{"s":"ok","x":"經濟部標準檢驗局《消費商品選購及使用手冊》洗臉盆一節提醒「選購貼有『商品安全標章』之產品」；標準檢驗局也呼籲消費者不要購買沒有「商品檢驗標識」的商品。所以衛浴設備應選用有檢驗合格標示的產品，故選(B)。","b":[{"k":"web","l":"經濟部標準檢驗局《消費商品選購及使用手冊》","r":"","q":"選購貼有『商品安全標章』之產品，並詳閱說明書及警告標示。","m":"位於洗臉盆一節。","u":"https://www.bsmi.gov.tw/wSite/public/Data/f1328863375689.pdf"},{"k":"web","l":"經濟部標準檢驗局「如何辨識經標準檢驗局檢驗合格之商品？」","r":"","q":"經本局檢驗合格之商品應標貼商品檢驗標識如附圖:","m":"呼籲消費者不購買無「商品檢驗標識」商品、不購買不合理之低價商品、不向商家購買來路不明之商品。","u":"https://www.bsmi.gov.tw/bsmiGIP/wSite/ct?xItem=109539&ctNode=9925&mp=111"}],"nt":"找到的資料支持選項(B)中的「商品檢驗標識」（舊稱商品安全標章）；沒有另外找到針對衛浴設備提到「正字標記」的官方說明。"}},{"id":"07-04-016","c":"07","t":"07-04","n":"16","q":"一般而言，大樓住戶廚房內壁面插座為紅色，下列何者為此插座之用途？","o":["供火警發生時緊急用電","台電停電時，此插座由大樓發電機供電，可供冰箱使用","屬於消防火警自動警報設備","屬於消防自動廣播設備"],"a":"B","ty":"gen","e":{"s":"ok","x":"簡報（建3-1）頁5設備表列出「緊急插座」常見位置在廚房；台電說明大樓為了電梯及緊急照明供電備有緊急發電機，「住家的紅色插座則大多設置在廚房內」，停電時由緊急發電機供電，故選(B)。","b":[{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－建物與室內裝修管理實務（建3-1～建3-3）","r":"頁碼5（PDF第6頁）","q":"緊急插座廚房"},{"k":"web","l":"自由時報「家裡有『紅色插座』嗎？網友好奇用途 台電解惑」","r":"","q":"有些大樓住戶在家中發現紅色插座，是因為大樓為了電梯及緊急照明供電，備有緊急發電機，住家的紅色插座則大多設置在廚房內。","m":"台電表示：不同建商機制各有不同，有些大樓的紅色插座平時沒有供電，有些則有，但在停電時都是由緊急發電機來供電。","u":"https://news.ltn.com.tw/news/life/breakingnews/3648129"}],"nt":"資料沒有提到「可供冰箱使用」；簡報頁5的設備表是表格文字，引文為表格欄位連續文字。"}},{"id":"07-04-017","c":"07","t":"07-04","n":"17","q":"若發生浴缸排水堵塞或水流很慢之情形，一般而言，浴缸排水清潔維修口都位於下列哪一位置？","o":["浴缸側邊立面有清潔維修口","需要拆除浴缸","需要至樓下拆除排水管","清潔口與馬桶清潔口共用"],"a":"A","ty":"gen","e":{"s":"unclear","x":"","b":[{"k":"law","l":"建築物給水排水設備設計技術規範（內政部）","r":"第4.4.5點","q":"存水彎裝置應附有清潔口或可以拆卸之構造，得以隨時排除排水阻塞之情況。但埋設於地下而附有過濾網者，得免設清潔口。","u":"https://www.nlma.gov.tw/uploads/files/7b5f02739dad0e121f246b4dc1b6006a.pdf"}],"f":"三份簡報都沒有浴缸、臉盆、清潔口、存水彎的內容。建築物給水排水設備設計技術規範4.4.5點只規定存水彎應附清潔口或可拆卸構造，沒有說浴缸的清潔維修口在浴缸側邊立面（規範第4.5節「清潔口」本文因PDF文字只讀到約3萬字被截斷，讀不到）；內政部建研所《集合住宅同層排水法制化與技術規範修訂之研究》也沒有提到浴缸檢修口位置；網路搜尋只看到業者文章。找不到能支持「浴缸側邊立面有清潔維修口」的官方資料。"}},{"id":"07-04-018","c":"07","t":"07-04","n":"18","q":"臉盆排水堵塞或水流很慢，一般而言，臉盆排水清潔口都位於哪裡？","o":["臉盆下方存水彎旁有清潔維修口","需要拆除浴缸","需要至樓下拆除排水管","清潔口與馬桶清潔口共用"],"a":"A","ty":"gen","e":{"s":"ok","x":"建築物給水排水設備設計技術規範4.4.5點：「存水彎裝置應附有清潔口或可以拆卸之構造，得以隨時排除排水阻塞之情況。」臉盆排水的存水彎就在臉盆下方，所以清潔維修口在臉盆下方存水彎旁，故選(A)。","b":[{"k":"law","l":"建築物給水排水設備設計技術規範（內政部）","r":"第4.4.5點","q":"存水彎裝置應附有清潔口或可以拆卸之構造，得以隨時排除排水阻塞之情況。","u":"https://www.nlma.gov.tw/uploads/files/7b5f02739dad0e121f246b4dc1b6006a.pdf"}],"nt":"規範沒有特別點名臉盆，「臉盆存水彎在臉盆下方」是依構造判斷。"}},{"id":"07-04-019","c":"07","t":"07-04","n":"19","q":"大樓屋頂平台偶有聞到臭味，且臭味來自頂樓平台排氣墩，則此排氣墩屬於哪下列哪一種？","o":["室內消防栓排氣","消防排煙排氣系統","排水通氣","給水通氣"],"a":"C","ty":"gen","e":{"s":"ok","x":"建築物給水排水設備設計技術規範4.3.6點：「排水立管之上部，應以伸頂通氣管向上延伸，並向大氣開放」；4.3.8點：貫穿屋頂的通氣管應伸出屋面15公分以上，向大氣開放。屋頂平台冒臭味的排氣墩就是排水系統的伸頂通氣管，故選(C)。","b":[{"k":"law","l":"建築物給水排水設備設計技術規範（內政部）","r":"第4.3.6點第(2)款","q":"排水立管之上部，應以伸頂通氣管向上延伸，並向大氣開放。","u":"https://www.nlma.gov.tw/uploads/files/7b5f02739dad0e121f246b4dc1b6006a.pdf"},{"k":"law","l":"建築物給水排水設備設計技術規範（內政部）","r":"第4.3.8點第(1)款","q":"貫穿屋頂之通氣管，應伸出屋面15公分以上，向大氣開放。","u":"https://www.nlma.gov.tw/uploads/files/7b5f02739dad0e121f246b4dc1b6006a.pdf"}]}},{"id":"07-05-001","c":"07","t":"07-05","n":"01","q":"原設計無消防設備之住宅，為加強安全，而裝設住宅用火警報器，下列何種位置不必安裝？","o":["廚房","客廳","小孩臥房","浴室"],"a":"D","ty":"gen","e":{"s":"ok","x":"簡報（建3-2）頁30：住宅用火災警報器應裝在寢室、廚房、樓梯，以及符合條件時的走廊；頁24建議五樓以下的早期建築物「可於每個居室安裝」。依建築技術規則建築設計施工編第1條第19款，浴室不算居室；消防署住警器Q&A也把浴室列為潮濕、容易誤報而應避免安裝的地方，所以浴室不必安裝，故選(D)。","b":[{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－建物與室內裝修管理實務（建3-1～建3-3）","r":"頁碼30（PDF第31頁）","q":"寢室、旅館客房或其他供就寢用之居室（以下簡稱寢室）。"},{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－建物與室內裝修管理實務（建3-1～建3-3）","r":"頁碼30（PDF第31頁）","q":"非屬前三款規定且任一樓層有超過七平方公尺之居室達五間以上者，設於走廊；無走廊者，設於樓梯。"},{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－建物與室內裝修管理實務（建3-1～建3-3）","r":"頁碼24（PDF第25頁）","q":"如果租賃住宅屬於早期未設置消防安全設備之五樓下建築物，建議可於每個居室安裝。"},{"k":"law","l":"建築技術規則建築設計施工編","r":"第1條第19款","q":"門廳、走廊、樓梯間、衣帽間、廁所盥洗室、浴室、儲藏室、機械室、車庫等不視為居室。","m":"居室：供居住、工作、集會、娛樂、烹飪等使用之房間，均稱居室。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070115"},{"k":"web","l":"內政部消防署全球資訊網－住宅用火災警報器－住警器Q&A","r":"","q":"潮濕或油煙重的區域（如浴室、直接在爐灶上方）：可能影響偵測效果或造成誤報。","m":"位於Q1，列為避免安裝之位置。","u":"https://www.nfa.gov.tw/cht/index.php?code=list&ids=1083"}],"nt":"依住宅用火災警報器設置辦法，客廳也不是強制裝設的區域；但簡報建議每個居室都裝，而客廳屬居室、浴室不屬居室，所以答案是浴室。"}},{"id":"07-05-002","c":"07","t":"07-05","n":"02","q":"原設計無消防設備之住宅，為加強安全，裝設住宅用火警警報器，下列敘述何者正確？","o":["五金行可購買不必消防署個別認可標示品","應盡量安裝於居室中心","應緊鄰出風口","警報器下端距離天花板或樓板30公分以內"],"a":"B","ty":"gen","e":{"s":"ok","x":"簡報（建3-1）頁24、（建3-2）頁31：住宅用火災警報器「以裝置於居室中心為原則」。同頁也規定要距離出風口1.5公尺以上（(C)錯），警報器下端距天花板或樓板「六十公分以內」（不是(D)的30公分）；頁24宣導圖則提醒要買有內政部消防署個別認可合格標示的產品（(A)錯），故選(B)。","b":[{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－建物與室內裝修管理實務（建3-1～建3-3）","r":"頁碼24（PDF第25頁）","q":"以裝置於居室中心為原則。"},{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－建物與室內裝修管理實務（建3-1～建3-3）","r":"頁碼24（PDF第25頁）","q":"距離出風口一點五公尺以上。"},{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－建物與室內裝修管理實務（建3-1～建3-3）","r":"頁碼24（PDF第25頁）","q":"警報器下端距離天花板或樓板六十公分以內。"},{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－建物與室內裝修管理實務（建3-1～建3-3）","r":"頁碼24（PDF第25頁）","q":"購買住宅用火災警報器前，要注意產品是否張貼內政部消防署個別認可合格標示，為保障全家人生命財產，切勿購買未張貼合格標示之產品。"},{"k":"web","l":"內政部消防署全球資訊網－住宅用火災警報器－住警器Q&A","r":"","q":"裝設地點應距離牆面或樑60公分以上之位置，並以裝置居室中心為原則。","u":"https://www.nfa.gov.tw/cht/index.php?code=list&ids=1083"}]}},{"id":"07-05-003","c":"07","t":"07-05","n":"03","q":"陽臺已加設立窗，而造成通風不良，為了安全，瓦斯熱水器不適用下列何種方法調整以維護安全？","o":["改為強制排氣型","改為電能熱水","改為太陽能熱水器","移至室內安裝"],"a":"D","ty":"neg","e":{"s":"ok","x":"簡報（建3-2）頁45：陽臺加裝窗戶的，建議改裝半密閉強制排氣式熱水器；同頁消防署宣導圖把「屋外式瓦斯熱水器安裝在室內」列為「很危險」。內政部也提醒屋外式熱水器只能裝在室外通風良好的地方。所以把熱水器移到室內安裝不能維護安全，故選(D)。","b":[{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－建物與室內裝修管理實務（建3-1～建3-3）","r":"頁碼45（PDF第46頁）","q":"陽臺有加裝鐵窗者，亦建議裝設半密閉強制排氣式熱水器。"},{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－建物與室內裝修管理實務（建3-1～建3-3）","r":"頁碼45（PDF第46頁）","q":"屋外式瓦斯熱水器安裝在室內"},{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－建物與室內裝修管理實務（建3-1～建3-3）","r":"頁碼45（PDF第46頁）","q":"加裝窗戶的陽台安裝強制排氣式瓦斯熱水器"},{"k":"web","l":"內政部新聞「防一氧化碳中毒 消防署提醒：熱水器安裝5原則」","r":"","q":"屋外式熱水器只能裝在室外通風良好的地方，而且不要晾掛大量衣物、加裝窗戶妨礙通風","u":"https://www.moi.gov.tw/News_Content.aspx?n=10&sms=9009&s=256676"}],"nt":"頁45宣導圖：「屋外式瓦斯熱水器安裝在室內」列在「很危險」，「加裝窗戶的陽台安裝強制排氣式瓦斯熱水器」列在「安全」（看圖確認）。資料沒有逐一說明(B)電能、(C)太陽能熱水器。"}},{"id":"07-05-004","c":"07","t":"07-05","n":"04","q":"陽臺或露臺欄杆間隙一般而言，大於幾公分即有孩童穿越墜落之虞？","o":["1公分","5公分","10公分","15公分"],"a":"C","ty":"num","e":{"s":"ok","x":"建築技術規則建築設計施工編第38條第2項：H-2組等用途建築物的欄桿「不得設有可供直徑十公分物體穿越之鏤空」；新北市工務局兒童防墜宣導也建議，陽露臺欄杆間隙超過10公分的要加裝防墜圍籬，故選(C)。","b":[{"k":"law","l":"建築技術規則建築設計施工編","r":"第38條第2項","q":"建築物使用用途為 A-1、A-2、B-2、D-2、D-3、F-3、G-2、H-2 組者，前項欄桿不得設有可供直徑十公分物體穿越之鏤空或可供攀爬之水平橫條。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070115"},{"k":"web","l":"新北市政府工務局公寓大廈管理科「公寓大廈兒童防墜安全宣導」","r":"","q":"陽露臺之欄杆間隙或底部與地面間隔超過10公分者，建議加裝","m":"陽(露)臺防墜重點第4點「加裝防墜圍籬」。","u":"https://www.publicwork.ntpc.gov.tw/userfiles/1060600/files/1081127%E7%AC%AC3%E5%A0%82-%E5%85%92%E7%AB%A5%E6%88%96%E8%80%81%E4%BA%BA%E9%98%B2%E5%A2%9C%E5%AE%A3%E5%B0%8E.pdf"}]}},{"id":"07-05-005","c":"07","t":"07-05","n":"05","q":"9樓以下(含9樓)之陽臺或露臺欄杆高度應高於幾公分，以維護其安全？","o":["110公分","115公分","100公分","105公分"],"a":"A","ty":"num","e":{"s":"ok","x":"建築技術規則建築設計施工編第38條第1項：露臺、陽臺等處的欄桿扶手高度不得小於1.10公尺，十層以上不得小於1.20公尺；新北市工務局宣導也寫「九樓(含)以下→至少達110公分」，故選(A)。","b":[{"k":"law","l":"建築技術規則建築設計施工編","r":"第38條第1項","q":"設置於露臺、陽臺、室外走廊、室外樓梯、平屋頂及室內天井部分等之欄桿扶手高度，不得小於一‧一○公尺；十層以上者，不得小於一‧二○公尺。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070115"},{"k":"web","l":"新北市政府工務局公寓大廈管理科「公寓大廈兒童防墜安全宣導」","r":"","q":"九樓(含)以下→至少達110公分；","u":"https://www.publicwork.ntpc.gov.tw/userfiles/1060600/files/1081127%E7%AC%AC3%E5%A0%82-%E5%85%92%E7%AB%A5%E6%88%96%E8%80%81%E4%BA%BA%E9%98%B2%E5%A2%9C%E5%AE%A3%E5%B0%8E.pdf"}]}},{"id":"07-05-006","c":"07","t":"07-05","n":"06","q":"10樓以上(含10樓)之陽臺或露臺欄杆高度應大於幾公分，以維護安全？","o":["110公分","120公分","100公分","105公分"],"a":"B","ty":"num","e":{"s":"ok","x":"建築技術規則建築設計施工編第38條第1項：露臺、陽臺等處的欄桿扶手高度不得小於1.10公尺，「十層以上者，不得小於一‧二○公尺」；新北市工務局宣導也寫「十樓以上→至少達120公分」，故選(B)。","b":[{"k":"law","l":"建築技術規則建築設計施工編","r":"第38條第1項","q":"設置於露臺、陽臺、室外走廊、室外樓梯、平屋頂及室內天井部分等之欄桿扶手高度，不得小於一‧一○公尺；十層以上者，不得小於一‧二○公尺。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070115"},{"k":"web","l":"新北市政府工務局公寓大廈管理科「公寓大廈兒童防墜安全宣導」","r":"","q":"十樓以上→至少達120公分。","u":"https://www.publicwork.ntpc.gov.tw/userfiles/1060600/files/1081127%E7%AC%AC3%E5%A0%82-%E5%85%92%E7%AB%A5%E6%88%96%E8%80%81%E4%BA%BA%E9%98%B2%E5%A2%9C%E5%AE%A3%E5%B0%8E.pdf"}],"nt":"題目寫「應大於」；法規是「不得小於」，即至少120公分。"}},{"id":"07-05-007","c":"07","t":"07-05","n":"07","q":"房屋陽臺或露臺可以以下列何種經費較低的方式以強化安全，防止兒童墜落？","o":["牆內擺設簡易花架或懸掛吊式花盆","貼貼紙","外牆全部修改建","通往陽臺露臺之門窗加裝兒童安全鎖"],"a":"A","ty":"gen","e":{"s":"unclear","x":"","b":[{"k":"web","l":"新北市政府工務局公寓大廈管理科「公寓大廈兒童防墜安全宣導」","r":"","q":"5.避免堆置雜物而提供攀爬的方便性: 如花盆、傢俱、櫃子等，應加以移除","m":"「陽(露)臺防墜重點」第5點。另「頂樓防墜重點」第4點：「增加攀爬難度、減少靠近翻落之危險: 如在牆內擺設懸掛式花盆」；「窗戶防墜重點─水平式推拉窗戶」第1點：設置鋁窗檔塊或兒童安全鎖等，限制窗戶開啟寬度不超過10公分。","u":"https://www.publicwork.ntpc.gov.tw/userfiles/1060600/files/1081127%E7%AC%AC3%E5%A0%82-%E5%85%92%E7%AB%A5%E6%88%96%E8%80%81%E4%BA%BA%E9%98%B2%E5%A2%9C%E5%AE%A3%E5%B0%8E.pdf"}],"f":"簡報沒有陽臺防墜內容。新北市工務局「公寓大廈兒童防墜安全宣導」在「陽(露)臺防墜重點」反而建議把花盆、傢俱、櫃子等可供攀爬的物品移除；「在牆內擺設懸掛式花盆」是列在「頂樓防墜重點」，用來增加攀爬難度；兒童安全鎖則列在窗戶防墜重點。官方資料用在陽臺時和題庫答案(A)方向相反，(D)門窗加裝兒童安全鎖也是低成本的防墜措施，可能有兩個答案，無法明確支持題庫答案(A)。","nt":"題庫答案(A)的用語和新北市宣導「頂樓防墜重點」的「牆內擺設懸掛式花盆」相近，可能出自該處。"}},{"id":"07-05-008","c":"07","t":"07-05","n":"08","q":"某6樓大樓的2樓專有戶，如欲增加衛浴設備或增加隔間，應留意下列哪些作為？","o":["應折抵房租","請房東出資","申請室內裝修","房東房客各出資1/2"],"a":"C","ty":"gen","e":{"s":"ok","x":"簡報（建3-3）頁52：六層以上集合住宅屬於供公眾使用建築物，室內裝修要依法申請審查許可；頁53也說集合住宅任一戶增設廁所或浴室、增設2間以上居室造成分間牆變更的，同樣要申請，而且「未經審核許可不得動工」，故選(C)。","b":[{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－建物與室內裝修管理實務（建3-1～建3-3）","r":"頁碼52（PDF第53頁）","q":"六層以上之集合住宅(公寓)。"},{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－建物與室內裝修管理實務（建3-1～建3-3）","r":"頁碼52（PDF第53頁）","q":"所以都是屬於供公眾使用建築物的範圍"},{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－建物與室內裝修管理實務（建3-1～建3-3）","r":"頁碼53（PDF第54頁）","q":"集合住宅及辦公廳,除建築物之地面層至最上層均屬同一權利主體所有者以外,其任一戶有增設廁所或浴室、增設2間以上之居室造成分間牆之變更者。"},{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－建物與室內裝修管理實務（建3-1～建3-3）","r":"頁碼53（PDF第54頁）","q":"可知室內裝修屬於應事前審核，未經審核許可不得動工。"}]}},{"id":"07-05-009","c":"07","t":"07-05","n":"09","q":"為了家中銀髮族於衛浴空間之使用安全與便利，衛浴可改進或加裝下列何種設備？","o":["WIFI上網","電視","加裝扶手","音響"],"a":"C","ty":"gen","e":{"s":"ok","x":"衛生福利部國民健康署防跌建議「於洗臉盆及馬桶旁加裝扶手」，也建議在浴室與馬桶等處安裝扶手輔助站立，故選(C)。","b":[{"k":"web","l":"衛生福利部「防疫宅在家 防跌要注意~國健署提供防跌妙招」","r":"","q":"於洗臉盆及馬桶旁加裝扶手。","u":"https://www.mohw.gov.tw/cp-5017-61413-1.html"},{"k":"web","l":"衛生福利部「超過3成的長者 常在臥室、客廳跌倒 居家環境安全與肌力是關鍵」","r":"","q":"輔助扶手：樓梯、床邊、浴室與馬桶等安裝扶手輔助站立。","u":"https://www.mohw.gov.tw/cp-5270-70698-1.html"}]}},{"id":"07-05-010","c":"07","t":"07-05","n":"10","q":"為了家中銀髮族於臥室與走廊空間之使用安全與便利，臥室與走廊可改進或加裝下列何種設備？","o":["小夜燈","安裝地毯","加裝家庭劇院","WIFI"],"a":"A","ty":"gen","e":{"s":"ok","x":"衛生福利部國民健康署防跌妙招「注意居家照明是否充足」：「注意室內燈光是否足夠明亮，可加裝小夜燈增加亮度。」並指出室內跌傷地點以臥室最多，故選(A)。","b":[{"k":"web","l":"衛生福利部「防疫宅在家 防跌要注意~國健署提供防跌妙招」","r":"","q":"注意室內燈光是否足夠明亮，可加裝小夜燈增加亮度。","m":"屬「妙招2：注意居家照明是否充足」；同文指出室內跌傷地點第一名為臥室。","u":"https://www.mohw.gov.tw/cp-5017-61413-1.html"}],"nt":"資料是講室內照明的一般建議，沒有特別點名走廊。"}},{"id":"07-05-011","c":"07","t":"07-05","n":"11","q":"若家中有坐輪椅的行動不便者，衛浴空間應以下列何種考量為優先？","o":["美觀","豪華","無障礙空間","通風良好"],"a":"C","ty":"gen","e":{"s":"ok","x":"建築技術規則建築設計施工編第167條：為了方便行動不便者進出及使用建築物，應設置無障礙設施；建築物無障礙設施設計規範504.1也規定無障礙廁所盥洗室要有直徑150公分以上的迴轉空間。家中有輪椅使用者時，衛浴應以無障礙空間為優先，故選(C)。","b":[{"k":"law","l":"建築技術規則建築設計施工編","r":"第167條第1項","q":"為便利行動不便者進出及使用建築物，新建或增建建築物，應依本章規定設置無障礙設施。","u":"https://www.nlma.gov.tw/uploads/files/7ba126b5f2c14971a205aa1826643252.pdf"},{"k":"law","l":"建築物無障礙設施設計規範（內政部）","r":"504.1","q":"無障礙廁所盥洗室應設置直徑150公分以上之迴轉空間，其迴轉空間邊緣20公分範圍內，如符合膝蓋淨容納空間規定者，得納入迴轉空間計算。","u":"https://www.nlma.gov.tw/filesys/file/chinese/publication/law/lawdata/1070820550.pdf"}]}},{"id":"07-05-012","c":"07","t":"07-05","n":"12","q":"如果家中有坐輪椅的行動不便者，廁所中為方便輪椅迴轉，建議預留多少公分之迴轉空間？","o":["150公分","120公分","100公分","90公分"],"a":"A","ty":"num","e":{"s":"ok","x":"建築物無障礙設施設計規範504.1：「無障礙廁所盥洗室應設置直徑150公分以上之迴轉空間」（淋浴間606.2也規定直徑150公分以上），故選(A)。","b":[{"k":"law","l":"建築物無障礙設施設計規範（內政部）","r":"504.1","q":"無障礙廁所盥洗室應設置直徑150公分以上之迴轉空間，其迴轉空間邊緣20公分範圍內，如符合膝蓋淨容納空間規定者，得納入迴轉空間計算。","u":"https://www.nlma.gov.tw/filesys/file/chinese/publication/law/lawdata/1070820550.pdf"},{"k":"law","l":"建築物無障礙設施設計規範（內政部）","r":"606.2","q":"淋浴間內應設置直徑150公分以上之迴轉空間。","u":"https://www.nlma.gov.tw/filesys/file/chinese/publication/law/lawdata/1070820550.pdf"}],"nt":"國土管理署網站另有101-11-16修正版，504.1同樣是直徑150公分；沒有查到108年之後是否再修正。"}},{"id":"07-05-013","c":"07","t":"07-05","n":"13","q":"新增冷氣室內機，出風口應距離偵煙式探測器多少公尺以上？","o":["0.5公尺","1公尺","1.5公尺","0.1公尺"],"a":"C","ty":"num","e":{"s":"ok","x":"各類場所消防安全設備設置標準第115條第1款、第2款：天花板或牆上有出風口時，探測器應距離出風口1.5公尺以上；簡報（建3-2）頁31也寫住宅用火災警報器應「距離出風口一點五公尺以上」，故選(C)。","b":[{"k":"law","l":"各類場所消防安全設備設置標準","r":"第115條第1款","q":"天花板上設有出風口時，除火焰式、差動式分布型及光電式分離型探測器外，應距離該出風口一點五公尺以上。","u":"https://lawplayer.com/act/6437d0bee800e5f0b9302304/13"},{"k":"law","l":"各類場所消防安全設備設置標準","r":"第115條第2款","q":"牆上設有出風口時，應距離該出風口一點五公尺以上。但該出風口距天花板在一公尺以上時，不在此限。","u":"https://lawplayer.com/act/6437d0bee800e5f0b9302304/13"},{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－建物與室內裝修管理實務（建3-1～建3-3）","r":"頁碼31（PDF第32頁）","q":"距離出風口一點五公尺以上。"}]}},{"id":"07-05-014","c":"07","t":"07-05","n":"14","q":"天花板設排氣口或回風口時，偵煙式探測器應裝置於排氣口或回風口周圍多少公尺內？","o":["2公尺","1公尺","3公尺","5公尺"],"a":"B","ty":"num","e":{"s":"ok","x":"各類場所消防安全設備設置標準第115條第3款：「天花板設排氣口或回風口時，偵煙式探測器應裝置於排氣口或回風口周圍一公尺範圍內。」故選(B)。","b":[{"k":"law","l":"各類場所消防安全設備設置標準","r":"第115條第3款","q":"天花板設排氣口或回風口時，偵煙式探測器應裝置於排氣口或回風口周圍一公尺範圍內。","u":"https://lawplayer.com/act/6437d0bee800e5f0b9302304/13"}]}},{"id":"08-01-001","c":"08","t":"08-01","n":"01","q":"下列何者為建築法建築管理的法定立法意旨？","o":["公平","善良社會","健全租屋市場","維護公共交通"],"a":"D","ty":"gen","e":{"s":"ok","x":"建築法第1條：「為實施建築管理，以維護公共安全、公共交通、公共衛生及增進市容觀瞻，特制定本法」，維護公共交通是法定立法意旨之一，故選(D)。","b":[{"k":"law","l":"建築法","r":"第1條","q":"為實施建築管理，以維護公共安全、公共交通、公共衛生及增進市容觀瞻，特制定本法；本法未規定者，適用其他法律之規定。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070109"}]}},{"id":"08-01-002","c":"08","t":"08-01","n":"02","q":"位於新北市板橋區的建築物，地方主管建築機關是哪個政府單位？","o":["內政部","營建署","新北市政府","板橋區公所"],"a":"C","ty":"gen","e":{"s":"ok","x":"建築法第2條第1項：主管建築機關「在中央為內政部；在直轄市為直轄市政府」。新北市是直轄市，所以板橋區建築物的地方主管建築機關是新北市政府，故選(C)。","b":[{"k":"law","l":"建築法","r":"第2條第1項","q":"主管建築機關，在中央為內政部；在直轄市為直轄市政府；在縣（市）為縣（市）政府。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070109"}]}},{"id":"08-01-003","c":"08","t":"08-01","n":"03","q":"位於新北市板橋區的建築物，中央主管建築機關是哪個政府單位？","o":["內政部","營建署","新北市政府","板橋區公所"],"a":"A","ty":"gen","e":{"s":"ok","x":"建築法第2條第1項：主管建築機關「在中央為內政部」，故選(A)。","b":[{"k":"law","l":"建築法","r":"第2條第1項","q":"主管建築機關，在中央為內政部；在直轄市為直轄市政府；在縣（市）為縣（市）政府。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070109"}]}},{"id":"08-01-004","c":"08","t":"08-01","n":"04","q":"下列何為建築技術規則設備編中所定義之建築物設備？","o":["安全梯","招牌廣告","消防","圍牆"],"a":"C","ty":"gen","e":{"s":"ok","x":"建築法第10條所稱建築物設備包括消防設備；建築技術規則建築設備編分章規定電氣、給水排水、消防、燃燒、空調等設備，第三章就是「消防設備」；簡報（建3-1）頁3也說設備編把建築物設備分為電氣、給排水、消防、燃燒、空調、昇降、受信及電話八項，故選(C)。","b":[{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－建物與室內裝修管理實務（建3-1～建3-3）","r":"頁碼3（PDF第4頁）","q":"另參酌建築技術規則設備編，建築物設備具體有區分為電氣、給排水、消防、燃燒、空調、昇降、受信及電話等八項設備。"},{"k":"law","l":"建築法","r":"第10條","q":"本法所稱建築物設備，為敷設於建築物之電力、電信、煤氣、給水、污水、排水、空氣調節、昇降、消防、消雷、防空避難、污物處理及保護民眾隱私權等設備。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070109"},{"k":"law","l":"建築技術規則建築設備編","r":"第三章章名","q":"第 三 章 消防設備","m":"各章：第一章電氣設備、第二章給水排水系統及衛生設備、第三章消防設備、第四章燃燒設備、第五章空氣調節及通風設備（LawAll頁面在第五章中段截斷）。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070117"}]}},{"id":"08-01-005","c":"08","t":"08-01","n":"05","q":"建築物建造完成後之變更使用，應請領哪一種建築執照？","o":["建造執照","雜項執照","使用執照","拆除執照"],"a":"C","ty":"gen","e":{"s":"ok","x":"建築法第28條第3款：「使用執照：建築物建造完成後之使用或變更使用，應請領使用執照。」簡報（建3-1）頁7也說要變更用途時，應依建築法第73條申請使用執照變更，故選(C)。","b":[{"k":"law","l":"建築法","r":"第28條第3款","q":"三、使用執照：建築物建造完成後之使用或變更使用，應請領使用執照。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070109"},{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－建物與室內裝修管理實務（建3-1～建3-3）","r":"頁碼7（PDF第8頁）","q":"原則上應依據使用執照登載用途使用，否則應依循建築法第73條申請使用執照變更或申請免辦理變更使用執照許可。"}]}},{"id":"08-01-006","c":"08","t":"08-01","n":"06","q":"建築物除經過地方主管建築機關許可外，非經領得哪一種建築執照，不准接水、接電及使用？","o":["建造執照","雜項執照","拆除執照","使用執照"],"a":"D","ty":"gen","e":{"s":"ok","x":"建築法第73條第1項：「建築物非經領得使用執照，不准接水、接電及使用。」但書另規定直轄市、縣（市）政府在特定情形（偏遠地區、天然災害等）可另訂接用水電規定，故選(D)。","b":[{"k":"law","l":"建築法","r":"第73條第1項","q":"建築物非經領得使用執照，不准接水、接電及使用。但直轄市、縣（市）政府認有左列各款情事之一者，得另定建築物接用水、電相關規定：","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070109"}]}},{"id":"08-01-007","c":"08","t":"08-01","n":"07","q":"依建築法規定那些人應維護建築物合法使用與其構造及設備安全？","o":["中央主管機關","地方主管機關","公寓大廈管理服務人員","所有權人"],"a":"D","ty":"gen","e":{"s":"ok","x":"建築法第77條第1項：「建築物所有權人、使用人應維護建築物合法使用與其構造及設備安全。」故選(D)。","b":[{"k":"law","l":"建築法","r":"第77條第1項","q":"建築物所有權人、使用人應維護建築物合法使用與其構造及設備安全。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070109"}],"nt":"法條的義務人是所有權人和使用人，選項只列所有權人。"}},{"id":"08-01-008","c":"08","t":"08-01","n":"08","q":"哪一種建築物，應由建築物所有權人、使用人定期委託中央主管建築機關認可之專業機構或人員檢查簽證？","o":["集合住宅","超過3戶以上之集合住宅","供公眾使用之建築物","出租之建築物"],"a":"C","ty":"gen","ns":1,"e":{"s":"ok","x":"建築法第77條第3項：「供公眾使用之建築物，應由建築物所有權人、使用人定期委託中央主管建築機關認可之專業機構或人員檢查簽證」，故選(C)。","b":[{"k":"law","l":"建築法","r":"第77條第3項","q":"供公眾使用之建築物，應由建築物所有權人、使用人定期委託中央主管建築機關認可之專業機構或人員檢查簽證，其檢查簽證結果應向當地主管建築機關申報。非供公眾使用之建築物，經內政部認有必要時亦同。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070109"}]}},{"id":"08-01-009","c":"08","t":"08-01","n":"09","q":"6層以上集合住宅之地面1層室內裝修應符合哪些規定？","o":["裝修材料應合於建築技術規則之規定","需留意美感","得妨害或破壞防火避難設施","得妨害或破壞消防設備"],"a":"A","ty":"gen","e":{"s":"ok","x":"簡報（建3-3）頁52：六層以上集合住宅屬於供公眾使用建築物；建築法第77條之2第1項第2款規定室內裝修「裝修材料應合於建築技術規則之規定」，第3款並規定不得妨害或破壞防火避難設施、消防設備（(C)(D)錯），故選(A)。","b":[{"k":"law","l":"建築法","r":"第77條之2第1項第2款","q":"裝修材料應合於建築技術規則之規定。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070109"},{"k":"law","l":"建築法","r":"第77條之2第1項第3款","q":"不得妨害或破壞防火避難設施、消防設備、防火區劃及主要構造。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070109"},{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－建物與室內裝修管理實務（建3-1～建3-3）","r":"頁碼50（PDF第51頁）","q":"裝修材料應合於建築技術規則之規定。"},{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－建物與室內裝修管理實務（建3-1～建3-3）","r":"頁碼52（PDF第53頁）","q":"六層以上之集合住宅(公寓)。"}]}},{"id":"08-01-010","c":"08","t":"08-01","n":"10","q":"下列何種為建築法所定義之主要構造？","o":["浴缸","承重牆壁","非承重牆壁","天花板"],"a":"B","ty":"gen","e":{"s":"ok","x":"建築法第8條：「本法所稱建築物之主要構造，為基礎、主要樑柱、承重牆壁、樓地板及屋頂之構造。」故選(B)。","b":[{"k":"law","l":"建築法","r":"第8條","q":"本法所稱建築物之主要構造，為基礎、主要樑柱、承重牆壁、樓地板及屋頂之構造。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070109"}]}},{"id":"08-01-011","c":"08","t":"08-01","n":"11","q":"公寓大廈承租人如需要進行室內裝修，需要遵守之下列何種規定？","o":["應經出租人同意之規定","無須經出租人同意之規定","增加窗簾應申請法定室內裝修施工許可。","增加活動隔屏應申請法定室內裝修施工許可"],"a":"A","ty":"gen","e":{"s":"ok","x":"住宅租賃定型化契約應記載事項第十點第1項：「承租人有室內裝修之需要，應經出租人同意並依相關法令規定辦理」。另依簡報（建3-3）頁57，窗簾、活動隔屏的擺設不屬於法定室內裝修範圍，(C)(D)錯，故選(A)。","b":[{"k":"law","l":"住宅租賃定型化契約應記載及不得記載事項（內政部）","r":"應記載事項第十點第1項","q":"承租人有室內裝修之需要，應經出租人同意並依相關法令規定辦理，且不得損害原有建築結構之安全。","u":"https://www.ey.gov.tw/File/43BC094940995CFC?A=C"},{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－建物與室內裝修管理實務（建3-1～建3-3）","r":"頁碼57（PDF第58頁）","q":"所謂法定的室內裝修範圍指除壁紙、壁布、窗簾、家具、活動隔屏、地氈等之黏貼及擺設外之下列行為："}]}},{"id":"08-01-012","c":"08","t":"08-01","n":"12","q":"未依建築法第77條第1項規定維護建築物合法使用與其構造及設備安全者，地方主管建築機關不會對所有權人做何種處分？","o":["罰鍰","限期改善","補辦手續","強制出讓產權"],"a":"D","ty":"gen","e":{"s":"ok","x":"建築法第91條第1項第2款：未依第77條第1項維護建築物合法使用與其構造及設備安全者，處所有權人、使用人罰鍰，並限期改善或補辦手續；屆期未改善可連續處罰、停止使用，必要時停止供水供電、封閉或拆除。法條沒有「強制出讓產權」的處分，故選(D)。","b":[{"k":"law","l":"建築法","r":"第91條第1項本文","q":"有左列情形之一者，處建築物所有權人、使用人、機械遊樂設施之經營者新臺幣六萬元以上三十萬元以下罰鍰，並限期改善或補辦手續","m":"其後接「屆期仍未改善或補辦手續而繼續使用者，得連續處罰，並限期停止其使用。必要時，並停止供水供電、封閉或命其於期限內自行拆除，恢復原狀或強制拆除」。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070109"},{"k":"law","l":"建築法","r":"第91條第1項第2款","q":"未依第七十七條第一項規定維護建築物合法使用與其構造及設備安全者。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070109"}]}},{"id":"08-01-013","c":"08","t":"08-01","n":"13","q":"既存違章建築影響公共安全者，當地主管建築機關應訂定拆除計畫限期拆除；所謂影響公共安全者為下列何種行為？","o":["違章建築住宅用途占用法定空地","露臺增建雨遮","違章建築樓層達2層以上","違章建築樓層達1層以上"],"a":"C","ty":"gen","ns":1,"e":{"s":"ok","x":"違章建築處理辦法第11條之1：既存違章建築影響公共安全的，應訂拆除計畫限期拆除；影響公共安全的範圍包括合法建築物垂直增建違章建築「違章建築樓層達二層以上」。占用法定空地只有「供營業使用」才列入，住宅用途不算（(A)錯），故選(C)。","b":[{"k":"law","l":"違章建築處理辦法","r":"第11條之1第1項","q":"既存違章建築影響公共安全者，當地主管建築機關應訂定拆除計畫限期拆除；不影響公共安全者，由當地主管建築機關分類分期予以列管拆除。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?PCode=D0070124"},{"k":"law","l":"違章建築處理辦法","r":"第11條之1第2項第2款第2目","q":"違章建築樓層達二層以上。","m":"第2項第2款：合法建築物垂直增建違章建築，有占用屋頂避難平臺或違章建築樓層達二層以上之情形之一者；第3款第4目為水平增建「占用法定空地供營業使用」。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?PCode=D0070124"}]}},{"id":"08-01-014","c":"08","t":"08-01","n":"14","q":"一定規模以下之招牌廣告及樹立廣告，得免申請哪一種建築執照？","o":["建照執照","雜項執照","使用執照","拆除執照"],"a":"B","ty":"gen","e":{"s":"ok","x":"建築法第97條之3第1項：一定規模以下之招牌廣告及樹立廣告，得免申請雜項執照；招牌廣告及樹立廣告管理辦法第3條並列出免申請雜項執照之規模，故選(B)。","b":[{"k":"law","l":"建築法","r":"第97條之3第1項","q":"一定規模以下之招牌廣告及樹立廣告，得免申請雜項執照。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070109"},{"k":"law","l":"招牌廣告及樹立廣告管理辦法","r":"第3條","m":"正面式招牌縱長未超過2公尺、側懸式招牌縱長未超過6公尺、地面樹立廣告高度未超過6公尺、屋頂樹立廣告高度未超過3公尺者，免申請雜項執照。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070140"}],"nt":"簡報未提及招牌廣告之執照規定，依法規作答。"}},{"id":"08-01-015","c":"08","t":"08-01","n":"15","q":"建築物變更防火區劃，與原核定使用不合之變更者，應申請變更使用執照。但建築物在一定規模以下之使用變更，不在此限。前項一定規模以下之免辦理變更使用執照相關規定，由誰制定之？","o":["內政部","縣市政府","管理委員會","公寓大廈規約"],"a":"B","ty":"gen","e":{"s":"ok","x":"建築法第73條第2項規定與原核定使用不合之變更應申請變更使用執照，但一定規模以下之使用變更不在此限；同條第3項：前項一定規模以下之免辦理變更使用執照相關規定，由直轄市、縣（市）主管建築機關定之，故選(B)。","b":[{"k":"law","l":"建築法","r":"第73條第3項","q":"前項一定規模以下之免辦理變更使用執照相關規定，由直轄市、縣（市）主管建築機關定之。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070109"},{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－建物與室內裝修管理實務（建3-1～建3-3）","r":"頁碼7（PDF第8頁）","q":"原則上應依據使用執照登載用途使用，否則應依循建築法第73條申請使用執照變更或申請免辦理變更使用執照許可。"}],"nt":"題目選項「縣市政府」指直轄市、縣（市）主管建築機關。"}},{"id":"08-02-001","c":"08","t":"08-02","n":"01","q":"公寓大廈長期管理維護經費來源之一為起造人依造價提撥一定比例或金額，下列何者為造價的定義？","o":["承造人實際承攬總價為造價","房屋總銷售金額為造價","建照執照載明之工程造價","房屋銷售金額扣除土地價金為造價"],"a":"C","ty":"gen","e":{"s":"ok","x":"簡報（法5-4）頁131引公寓大廈管理條例施行細則第5條：起造人按工程造價一定比例提列公共基金，前項工程造價，指經直轄市、縣(市)主管建築機關核發建造執照載明之工程造價，故選(C)。","b":[{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－租賃住宅相關法規與實務（法5-1～法5-5）","r":"頁碼131（PDF第132頁）","q":"前項工程造價，指經直轄市、縣 (市) 主管建築機關核發建造執照載明之工程造價。"},{"k":"law","l":"公寓大廈管理條例施行細則","r":"第5條第2項","q":"前項工程造價，指經直轄市、縣（市）主管建築機關核發建造執照載明之工程造價。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070119"}]}},{"id":"08-02-002","c":"08","t":"08-02","n":"02","q":"為了對公寓大廈進行長期性維護，應設置公共基金，而區分所有權人應依照何種決議繳納之？","o":["區分所有權人會議決議","住戶大會決議","管理委員會決議","管理負責人訂定之"],"a":"A","ty":"gen","e":{"s":"ok","x":"簡報（法5-4）頁130引公寓大廈管理條例第18條第1項：公共基金來源之一為「區分所有權人依區分所有權人會議決議繳納」，故選(A)。","b":[{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－租賃住宅相關法規與實務（法5-1～法5-5）","r":"頁碼130（PDF第131頁）","q":"二、區分所有權人依區分所有權人會議決議繳納。"},{"k":"law","l":"公寓大廈管理條例","r":"第18條第1項第2款","q":"二、區分所有權人依區分所有權人會議決議繳納。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070118"}]}},{"id":"08-02-003","c":"08","t":"08-02","n":"03","q":"建築物電梯設備各種組件應檢討耐用基準年限及定期維護更換，耐用基準年限由下列何者制定之？","o":["起造人","承造人","區分所有權人會議","昇降設備專業廠商"],"a":"D","ty":"gen","e":{"s":"ok","x":"建築物昇降設備設置及檢查管理辦法第3條第4項規定申請竣工檢查時應檢附「昇降設備組件耐用基準參考表」；內政部函附該表說明，由專業廠商考量使用條件填列耐用基準參考年限，接任之專業廠商並得依實際需求重新制定，故選(D)。","b":[{"k":"law","l":"建築物昇降設備設置及檢查管理辦法","r":"第3條第4項、第4條第2項","q":"申請竣工檢查時，應檢附昇降設備組件耐用基準參考表。","m":"專業技術人員應查核耐用基準參考表，已屆耐用基準之組件應於保養紀錄表載明處理情形。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070147"},{"k":"web","l":"建築物昇降設備組件耐用基準參考表（內政部104-10-13內授營建管字第1040814992號函附件，國土管理署網站）","r":"","q":"專業廠商應考量昇降設備使用條件（例如建築物用途、樓層數、使用環境、機種、荷重、速度及使用頻率等）填列耐用基準參考年限。","u":"https://www.nlma.gov.tw/uploads/files/aa81bc343dcf9eeb75b1deb0e3a2111d.pdf"}],"nt":"簡報未提及昇降設備耐用基準，依法規及內政部函作答。"}},{"id":"08-02-004","c":"08","t":"08-02","n":"04","q":"公寓大廈建築物一樓店鋪為方便營業使用，下列有關是否可敲除結構立柱之敘述，何者正確？","o":["應視公寓大廈規約是否禁止","專有部分可以敲除結構","依照公寓大廈管理條例得排除他人干涉","不得任意敲除結構"],"a":"D","ty":"gen","e":{"s":"ok","x":"簡報（法5-4）頁127、130引公寓大廈管理條例：主要樑柱等構造屬共用部分且不得約定專用（第7條），住戶為維護、修繕、裝修等工作時，未經申請主管建築機關核准，不得破壞或變更建築物之主要構造（第16條），故一樓店鋪不得任意敲除結構柱，故選(D)。","b":[{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－租賃住宅相關法規與實務（法5-1～法5-5）","r":"頁碼130（PDF第131頁）","q":"住戶為維護、修繕、裝修或其他類似之工作時，未經申請主管建築機關核准，不得破壞或變更建築物之主要構造。"},{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－租賃住宅相關法規與實務（法5-1～法5-5）","r":"頁碼127（PDF第128頁）","q":"三、公寓大廈基礎、主要樑柱、承重牆壁、樓地板及屋頂之構造。"},{"k":"law","l":"建築法","r":"第8條","q":"本法所稱建築物之主要構造，為基礎、主要樑柱、承重牆壁、樓地板及屋頂之構造。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070109"}]}},{"id":"08-02-005","c":"08","t":"08-02","n":"05","q":"為強化高密度使用集合住宅及住宅安全管理，集合住宅、住宅任一住宅單位（戶）之任一樓層分間為6個以上使用單元（不含客廳及餐廳）或設置10個以上床位之居室者，其使用類組歸屬認定為下列哪一類組？","o":["旅館","不變","辦公室","宿舍"],"a":"D","ty":"gen","e":{"s":"ok","x":"建築物使用類組及變更使用辦法附表二將「集合住宅、住宅任一住宅單位(戶)之任一樓層分間為六個以上使用單元(不含客廳及餐廳)或設置十個以上床位之居室者」與「宿舍」同列為H-1組使用項目；內政部107年令亦明定此類高密度使用住宅歸屬H-1組，即宿舍類組，故選(D)。","b":[{"k":"law","l":"建築物使用類組及變更使用辦法","r":"第2條附表二 H-1組使用項目第1、8目","q":"集合住宅、住宅任一住宅單位(戶)之任一樓層分間為六個以上使用單元(不含客廳及餐廳)或設置十個以上床位之居室者。","m":"H-1組使用項目第1目為「民宿（客房數六間以上）、宿舍、樓地板面積未達五百平方公尺之招待所」，第8目即題述高密度使用住宅。","u":"https://laws.gov.taipei/law/File/0000310088"},{"k":"web","l":"內政部107-04-24台內營字第1070803969號令（臺北市建築師公會轉載）","r":"","m":"高密度使用集合住宅及住宅，其使用類組歸屬建築物使用類組及變更使用辦法第2條所定H-1組，並視為供公眾使用建築物。","u":"https://www.arch.org.tw/Laws/laws_more?id=96d1433d034540f5ae20e5392a31d002"},{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－建物與室內裝修管理實務（建3-1～建3-3）","r":"頁碼9（PDF第10頁）","q":"供特定人短期住宿之場所。"}],"nt":"簡報頁9為使用類組定義表，H-1為供特定人短期住宿之場所、H-2為長期住宿；題目選項「宿舍」對應H-1組。"}},{"id":"08-02-006","c":"08","t":"08-02","n":"06","q":"為增進公寓大廈區分所有權人共同利益，規約可經由區分所有權人制定，在尚未制定之前，規約草約是由下列何者訂定？","o":["起造人於申請建照執照時訂定","由中央主管機關訂定","在區分所有權人會議決議前無法訂定規約草約","由管理服務人訂定"],"a":"A","ty":"gen","e":{"s":"ok","x":"公寓大廈管理條例第56條第1項：公寓大廈之起造人於申請建造執照時，應檢附專有部分、共用部分等標示之詳細圖說及規約草約，故選(A)。","b":[{"k":"law","l":"公寓大廈管理條例","r":"第56條第1項","q":"公寓大廈之起造人於申請建造執照時，應檢附專有部分、共用部分、約定專用部分、約定共用部分標示之詳細圖說及規約草約。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070118"}],"nt":"簡報未提及規約草約，依法規作答。"}},{"id":"08-02-007","c":"08","t":"08-02","n":"07","q":"舊有5層以下公寓可以依照法令鬆綁下合法增設昇降機，該公寓應以何時前領得使用執照才符合法令不計入建築面積與樓地板面積之規定？","o":["中華民國107年2月27日以前","中華民國105年2月27日以前","中華民國104年2月27日以前","中華民國100年2月27日以前"],"a":"D","ty":"num","e":{"s":"outdated","x":"依建築技術規則建築設計施工編第55條舊條文，「中華民國一百年二月二十七日修正生效前領得使用執照之五層以下建築物增設昇降機者」，其增設部分不計入建築面積及各層樓地板面積，故題庫答案為(D)。惟該條已修正（110年7月19日施行），現行適用對象為「一百零二年一月一日修正生效前申請建造執照，並於興建完成後領得使用執照之五層以下建築物」，判斷基準已改為申請建造執照時點。","b":[{"k":"web","l":"建築技術規則建築設計施工編部分條文修正條文（國土管理署網站PDF）","r":"第55條（修正前條文）","q":"本規則中華民國一百年二月二十七日修正生效前領得使用執照之五層以下建築物增設昇降機者","u":"https://www.nlma.gov.tw/uploads/files/305cbaac3427a01f280b509a511349fd.pdf"},{"k":"law","l":"建築技術規則建築設計施工編","r":"第55條","q":"本規則中華民國一百零二年一月一日修正生效前申請建造執照，並於興建完成後領得使用執照之五層以下建築物增設昇降機者，得依下列規定辦理：","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070115"},{"k":"web","l":"內政部新聞（第55條修正，110-07-19施行）","r":"","m":"老舊公寓增設昇降機之適用對象放寬至102年1月1日修正生效前申請建造執照、興建完成後領得使用執照之5層以下建築物。","u":"https://www.moi.gov.tw/News_Content.aspx?n=145&s=221261"}],"f":"題庫答案(D)「100年2月27日以前」依修正前第55條；現行第55條（110-07-19施行）改為「102年1月1日修正生效前申請建造執照，並於興建完成後領得使用執照」，以申請建造執照時點認定，四個選項均非現行規定。"}},{"id":"08-02-008","c":"08","t":"08-02","n":"08","q":"為節約能源，於屋頂設置太陽能熱水系統，其高度應以多少公尺以下者，得免依建築法規定申請雜項執照？","o":["10公尺","6公尺","3公尺","2公尺"],"a":"D","ty":"num","e":{"s":"ok","x":"設置再生能源設施免請領雜項執照標準第4條：設置於建築物屋頂之太陽能熱水系統，其高度為二公尺以下者，得免依建築法規定申請雜項執照，故選(D)。","b":[{"k":"law","l":"設置再生能源設施免請領雜項執照標準","r":"第4條","q":"設置於建築物屋頂之太陽能熱水系統，其高度為二公尺以下者，得免依建築法規定申請雜項執照。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?PCODE=J0130042"}],"nt":"簡報未提及，依法規作答。"}},{"id":"08-02-009","c":"08","t":"08-02","n":"09","q":"招牌廣告及樹立廣告許可期限屆滿後，原雜項使用執照及許可失其效力，應重新申請審查許可或恢復原狀，則有關招牌廣告及樹立廣告許可之有效期限為幾年？","o":["1年","3年","5年","10年"],"a":"C","ty":"num","e":{"s":"ok","x":"招牌廣告及樹立廣告管理辦法第12條：招牌廣告及樹立廣告許可之有效期限為五年，期限屆滿後，原雜項使用執照及許可失其效力，應重新申請審查許可或恢復原狀，故選(C)。","b":[{"k":"law","l":"招牌廣告及樹立廣告管理辦法","r":"第12條","q":"招牌廣告及樹立廣告許可之有效期限為五年，期限屆滿後，原雜項使用執照及許可失其效力，應重新申請審查許可或恢復原狀。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070140"}],"nt":"簡報未提及，依法規作答。"}},{"id":"08-02-010","c":"08","t":"08-02","n":"10","q":"公寓大廈屋頂平台設立廣告除應經循法令申請外，還應得下列何者之同意？","o":["管理委員會","頂樓住戶","頂樓區分所有權人","頂樓承租人"],"a":"C","ty":"gen","e":{"s":"ok","x":"公寓大廈管理條例第33條第2款：公寓大廈外牆面、樓頂平臺設置廣告物等，設置於屋頂者，應經頂層區分所有權人同意，否則區分所有權人會議之決議不生效力，故選(C)。","b":[{"k":"law","l":"公寓大廈管理條例","r":"第33條第2款","q":"設置於屋頂者，應經頂層區分所有權人同意；設置其他樓層者，應經該樓層區分所有權人同意。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070118"},{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－租賃住宅相關法規與實務（法5-1～法5-5）","r":"頁碼127（PDF第128頁）","q":"公寓大廈周圍上下、外牆面、樓頂平臺及不屬專有部分之防空避難設備，其變更構造、顏色、設置廣告物、鐵鋁窗或其他類似之行為，除應依法令規定辦理外"}],"nt":"簡報頁127僅引第8條（樓頂平臺設置廣告物應依法令及規約、區權會決議），頂層區分所有權人同意之規定見條例第33條。"}},{"id":"08-02-011","c":"08","t":"08-02","n":"11","q":"招牌廣告應在明顯處附永久標示，註明廣告燈製造廠名稱、電源電壓及輸入電流，請問下列何者為標示這些資訊之目的？","o":["以備日後檢查之用","驗收計價使用","環保檢查之用","消防檢查之用"],"a":"A","ty":"gen","e":{"s":"ok","x":"建築技術規則建築設備編第14條第4款：招牌廣告燈及樹立廣告燈應在明顯處所附有永久之標示，註明廣告燈製造廠名稱、電源電壓及輸入電流，以備日後檢查之用，故選(A)。","b":[{"k":"law","l":"建築技術規則建築設備編","r":"第14條第4款","q":"應在明顯處所附有永久之標示，註明廣告燈製造廠名稱、電源電壓及輸入電流，以備日後檢查之用。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070117"},{"k":"law","l":"招牌廣告及樹立廣告管理辦法","r":"第7條","q":"招牌廣告及樹立廣告申請審查許可時，其廣告招牌燈之裝設，應依建築技術規則建築設備編第十四條之規定辦理。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070140"}],"nt":"簡報未提及，依法規作答。"}},{"id":"08-02-012","c":"08","t":"08-02","n":"12","q":"有關浴廁天花板淨高原則，不得小於多少公尺？","o":["3公尺","2.5公尺","2.1公尺","1.6公尺"],"a":"C","ty":"neg","e":{"s":"ok","x":"建築技術規則建築設計施工編第32條：天花板淨高度，學校教室不得小於三公尺，其他居室及浴廁不得小於二．一公尺，故選(C)。","b":[{"k":"law","l":"建築技術規則建築設計施工編","r":"第32條第2款","q":"二、其他居室及浴廁不得小於二．一公尺，但高低不同之天花板高度至少應有一半以上大於二．一公尺，其最低處不得小於一．七公尺。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070115"}],"nt":"簡報未提及天花板淨高，依法規作答。"}},{"id":"08-03-001","c":"08","t":"08-03","n":"01","q":"建築物與鄰房規劃設計留設防火間隔(防火巷弄)，規劃設計之目的為何？","o":["阻隔火災延燒","增加採光通風","增加停車空間","增加綠覆率"],"a":"A","ty":"gen","e":{"s":"ok","x":"苗栗縣政府工商發展處說明：留設防火間隔之目的係當發生火災時，阻隔火勢蔓延，藉以逃生避難，非供平時公眾通行之用，以避免影響鄰幢建築物之安全，故選(A)。","b":[{"k":"web","l":"苗栗縣政府工商發展處「防火巷、防火間隔傻傻分不清？建築防災知識報你知!」","r":"","q":"其留設防火間隔之目的係當發生火災時，阻隔火勢蔓延，藉以逃生避難，非供平時公眾通行之用，以避免影響鄰幢建築物之安全。","u":"https://www.miaoli.gov.tw/economic_development/News_Content.aspx?n=1028&s=497634"}],"nt":"簡報未說明防火間隔之目的；國土管理署解釋函（網頁需JavaScript，未能讀取內文）搜尋摘要亦稱「防火間隔之設置旨在阻止火災之延燒」。"}},{"id":"08-03-002","c":"08","t":"08-03","n":"02","q":"公寓大廈與鄰房規劃設計留設防火間隔(防火巷弄)，是否可以約定給鄰近一樓之區分所有權人專用？","o":["可約定專用，但不得違章建築","不可約定專用","應經區分所有權人會議同意方能約定專用","應經規約約定方能約定專用"],"a":"B","ty":"gen","e":{"s":"ok","x":"簡報（法5-4）頁127引公寓大廈管理條例第7條：共用部分不得獨立使用供做專有部分，其為「社區內各巷道、防火巷弄」者，並不得為約定專用部分，故防火間隔（防火巷弄）不可約定給一樓區分所有權人專用，故選(B)。","b":[{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－租賃住宅相關法規與實務（法5-1～法5-5）","r":"頁碼127（PDF第128頁）","q":"公寓大廈共用部分不得獨立使用供做專有部分。其為下列各款者，並不得為約定專用部分(公寓7)："},{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－租賃住宅相關法規與實務（法5-1～法5-5）","r":"頁碼127（PDF第128頁）","q":"二、連通數個專有部分之走廊或樓梯，及其通往室外之通路或門廳；社區內各巷道、防火巷弄。"},{"k":"law","l":"公寓大廈管理條例","r":"第7條第2款","q":"二、連通數個專有部分之走廊或樓梯，及其通往室外之通路或門廳；社區內各巷道、防火巷弄。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070118"}],"nt":"簡報頁130另引條例第16條：住戶不得於防火間隔、防火巷弄等處所堆置雜物、設置柵欄、門扇或營業使用。"}},{"id":"08-03-003","c":"08","t":"08-03","n":"03","q":"火災及地震發生時，是否可以搭乘電梯以利快速疏散？","o":["不可以","可以","僅能搭乘緊急用昇降機","僅能搭乘行動不便電梯"],"a":"A","ty":"gen","e":{"s":"ok","x":"內政部新聞（消防署）：火場以保命求生為首要目標，絕對不可搭乘電梯逃生；中央氣象署地震防護宣導亦提醒地震時請勿使用電梯。故火災及地震時均不可搭乘電梯疏散，故選(A)。","b":[{"k":"web","l":"內政部新聞「火場應變分秒必爭 消防署教你應變逃生及火災預防要訣」","r":"","q":"火場以保命求生為首要目標，不可為了收拾財物或尋找濕毛巾而延誤時間、也絕對不可搭乘電梯逃生、並且切勿躲在浴室。","u":"https://www.moi.gov.tw/News_Content.aspx?n=4&sms=9009&s=335768"},{"k":"web","l":"中央氣象署地震測報中心「地震防護」","r":"","q":"絕對切忌急著衝出，且請勿使用電梯。","u":"https://scweb.cwa.gov.tw/zh-tw/page/intro/11/"},{"k":"web","l":"彰化縣消防局「火災應變要領」","r":"","q":"不可搭乘電梯逃生。","u":"https://www.chfd.gov.tw/form/Details.aspx?Parser=2%2C7%2C65%2C%2C%2C%2C897%2C%2C%2C%2C1"}],"nt":"簡報未提及。"}},{"id":"08-03-004","c":"08","t":"08-03","n":"04","q":"緊急發電機如果無法自動啟動，首先應檢查哪一個單元？","o":["ATS單元","檢查機油","檢查操作開關是否置於手動而非自動","檢查冷卻水"],"a":"C","ty":"gen","e":{"s":"ok","x":"發電機組操作手冊之故障診斷「發電機不起動」列第1項原因為「選擇開關自動/手動置於手動」，處理方式為將選擇開關置於自動；故緊急發電機無法自動啟動時，應先檢查操作開關是否置於手動而非自動，故選(C)。","b":[{"k":"web","l":"發電機組操作手冊（衛生福利部彰化醫院網站「電力設備系統操作手冊」所附廠商手冊）","r":"故障診斷 三、發電機不起動","q":"1.選擇開關自動/ 手動置於手動。 1.將選擇開關置於自動。","u":"https://chnh.mohw.gov.tw/df_ufiles/057/%E9%9B%BB%E5%8A%9B%E8%A8%AD%E5%82%99%E7%B3%BB%E7%B5%B1%E6%93%8D%E4%BD%9C%E6%89%8B%E5%86%8A.pdf"}],"nt":"簡報及營建署住宅使用維護手冊均未提及緊急發電機故障排除；本題依據為廠商操作手冊，來源層級較低。"}},{"id":"08-03-005","c":"08","t":"08-03","n":"05","q":"不銹鋼水龍頭可以用哪一種家庭隨手可得物品，簡單又安全的擦拭，恢復光亮？","o":["沐浴乳","粗糙菜瓜布","牙膏","針車油"],"a":"C","ty":"gen","e":{"s":"ok","x":"內政部營建署《住宅使用維護與延壽手冊》（衛生設備）：不銹鋼龍頭平日可用牙膏擦拭以增添光亮，故選(C)。","b":[{"k":"web","l":"住宅使用維護與延壽手冊（內政部營建署指導、財團法人台灣建築中心編製）","r":"參、設備篇","q":"不銹鋼龍頭平日可用牙膏擦拭以增添光亮","u":"https://www.nlma.gov.tw/uploads/files/1f866ffdb939621e06d53e63431cc012.pdf"}],"nt":"簡報未提及。"}},{"id":"08-03-006","c":"08","t":"08-03","n":"06","q":"陶瓷馬桶不適合使用哪一種清潔方式？","o":["滾燙的熱水","刷子","海綿","中性清潔劑"],"a":"A","ty":"gen","e":{"s":"ok","x":"內政部營建署《住宅使用維護與延壽手冊》：清潔馬桶時千萬不可使用熱水，以免馬桶裂開造成意外傷害，故選(A)。","b":[{"k":"web","l":"住宅使用維護與延壽手冊（內政部營建署指導、財團法人台灣建築中心編製）","r":"參、設備篇","q":"清潔馬桶時千萬不可使用熱水，以免馬桶裂開造成意外傷害。","u":"https://www.nlma.gov.tw/uploads/files/1f866ffdb939621e06d53e63431cc012.pdf"}],"nt":"簡報未提及。"}},{"id":"08-03-007","c":"08","t":"08-03","n":"07","q":"熱水器與瓦斯管連接處，可以用何種簡單安全方式檢查是否有瓦斯漏氣？","o":["使用打火機觀察火焰是否變大","使用火柴觀察火焰是否變大","觀察熱水溫度是否有變化","使用肥皂水泡沫檢查"],"a":"D","ty":"gen","e":{"s":"ok","x":"內政部營建署《住宅使用維護與延壽手冊》（瓦斯）：可以肥皂泡塗於檢查處，如有漏氣，會形成氣泡；以打火機、火柴檢查反而有引燃危險，故選(D)。","b":[{"k":"web","l":"住宅使用維護與延壽手冊（內政部營建署指導、財團法人台灣建築中心編製）","r":"參、設備篇第8章瓦斯","q":"另外也可以肥皂泡塗於檢查處，如有漏氣，會形成氣泡","u":"https://www.nlma.gov.tw/uploads/files/1f866ffdb939621e06d53e63431cc012.pdf"},{"k":"web","l":"住宅使用維護與延壽手冊（同上）","r":"參、設備篇第8章瓦斯","q":"切忌點火，不可打開電燈與一切電器開關，也不應以風扇、抽風機、排油煙機排除瓦斯。","u":"https://www.nlma.gov.tw/uploads/files/1f866ffdb939621e06d53e63431cc012.pdf"}],"nt":"簡報未提及。"}},{"id":"08-03-008","c":"08","t":"08-03","n":"08","q":"浴室用電能熱水器，裝設漏電斷路器的目的為？","o":["節能減碳","防止感電","防止竊電","保持恆溫"],"a":"B","ty":"gen","e":{"s":"ok","x":"簡報（建3-2）頁43以浴室漏電致淋浴觸電死亡為例，指出電熱水器及浴室插座分路絕對需要經漏電斷路器保護；營建署《住宅使用維護與延壽手冊》亦載「為防人員觸電意外，務必裝設漏電斷路器」，故其目的為防止感電，故選(B)。","b":[{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－建物與室內裝修管理實務（建3-1～建3-3）","r":"頁碼43（PDF第44頁）","q":"絕對需要經過漏電斷路器保護之住宅設備有：飲水機分路、電熱水器及浴室插座分路、陽臺之插座等。"},{"k":"web","l":"住宅使用維護與延壽手冊（內政部營建署指導、財團法人台灣建築中心編製）","r":"參、設備篇","q":"為防人員觸電意外，務必裝設漏電斷路器，並妥善接好接地線。","u":"https://www.nlma.gov.tw/uploads/files/1f866ffdb939621e06d53e63431cc012.pdf"}],"nt":"簡報頁43標題為「感電災例」。"}},{"id":"08-03-009","c":"08","t":"08-03","n":"09","q":"插座中有較長與較短的孔，較長的孔稱為？","o":["中性極","長邊極","火線極","導電極"],"a":"A","ty":"gen","e":{"s":"ok","x":"家用兩孔插座之插座孔一長一短，短的是火線、長的是中性線（中性極），故選(A)。","b":[{"k":"web","l":"找師傅「台灣家用插座及插頭的型式及使用」","r":"","q":"兩個長方形的插座孔會有一長一短，短的是火線而長的是中性線。","u":"https://www.945.com.tw/articles/detail/306"}],"nt":"該文並提醒實際配線未必依此規則，應以電錶量測為準。簡報及營建署住宅使用維護手冊均未提及插座長短孔之極性。"}},{"id":"08-03-010","c":"08","t":"08-03","n":"10","q":"附有接地極的插座，接地極的功能為何？","o":["用電安全","用電平衡","防止相序錯亂","防止竊電"],"a":"A","ty":"gen","e":{"s":"ok","x":"簡報（建3-2）頁39：浴室內插座及電能熱水器之電源應有良好接地及漏電斷路器設備，以維護用電安全；營建署手冊亦指僅用轉接插頭不能達到接地保護功能，故接地極之功能為用電安全，故選(A)。","b":[{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－建物與室內裝修管理實務（建3-1～建3-3）","r":"頁碼39（PDF第40頁）","q":"浴室內插座以及電能熱水器使用之電源應有良好接地以及漏電斷路器設備，以維護用電安全。"},{"k":"web","l":"住宅使用維護與延壽手冊（內政部營建署指導、財團法人台灣建築中心編製）","r":"參、設備篇第5章強電類","q":"若僅使用轉接插頭，並不能達到接地保護功能。","u":"https://www.nlma.gov.tw/uploads/files/1f866ffdb939621e06d53e63431cc012.pdf"}]}},{"id":"08-03-011","c":"08","t":"08-03","n":"11","q":"疑似瓦斯漏氣時，應如何處置？","o":["開燈檢查","開啟電風扇加強換氣","用打火機加強局部照明","開啟窗戶"],"a":"D","ty":"gen","e":{"s":"ok","x":"內政部營建署《住宅使用維護與延壽手冊》：聞到瓦斯味，先開窗通風，再關閉瓦斯錶前及熱水器並通知瓦斯公司；切忌點火，不可打開電燈與一切電器開關，也不應以風扇、抽風機排除瓦斯，故選(D)。","b":[{"k":"web","l":"住宅使用維護與延壽手冊（內政部營建署指導、財團法人台灣建築中心編製）","r":"參、設備篇第8章瓦斯","q":"聞到瓦斯味，先開窗通風，接著關閉瓦斯錶前及熱水器，並通知瓦斯公司處理。","u":"https://www.nlma.gov.tw/uploads/files/1f866ffdb939621e06d53e63431cc012.pdf"},{"k":"web","l":"住宅使用維護與延壽手冊（同上）","r":"參、設備篇第8章瓦斯","q":"切忌點火，不可打開電燈與一切電器開關，也不應以風扇、抽風機、排油煙機排除瓦斯。","u":"https://www.nlma.gov.tw/uploads/files/1f866ffdb939621e06d53e63431cc012.pdf"}],"nt":"簡報未提及瓦斯漏氣處置。"}},{"id":"08-03-012","c":"08","t":"08-03","n":"12","q":"瓦斯爐火焰呈現哪一種顏色，表示燃燒不完全，有一氧化碳產生疑慮？","o":["內焰淡青色","外焰藍紫色","火焰頂端淡黃色","火焰頂端藍紫色"],"a":"C","ty":"gen","e":{"s":"ok","x":"營建署《住宅使用維護與延壽手冊》：正常火焰內焰淡青、外焰紫藍色；火焰頂端呈淡黃色、火勢柔弱，易形成不完全燃燒。簡報（建3-2）頁44並說明碳氫化合物不完全燃燒會產生有毒一氧化碳，故選(C)。","b":[{"k":"web","l":"住宅使用維護與延壽手冊（內政部營建署指導、財團法人台灣建築中心編製）","r":"參、設備篇第8章瓦斯","q":"頂端呈淡黃色，火勢柔弱，易形成不完全燃燒","u":"https://www.nlma.gov.tw/uploads/files/1f866ffdb939621e06d53e63431cc012.pdf"},{"k":"web","l":"住宅使用維護與延壽手冊（同上）","r":"參、設備篇第8章瓦斯","q":"內外焰分明，內焰淡青、外焰紫藍色，火勢強、燃燒穩定","u":"https://www.nlma.gov.tw/uploads/files/1f866ffdb939621e06d53e63431cc012.pdf"},{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－建物與室內裝修管理實務（建3-1～建3-3）","r":"頁碼44（PDF第45頁）","q":"導致碳氫化合物不完全燃燒，產生無色無味的有毒一氧化碳氣體"}]}},{"id":"08-03-013","c":"08","t":"08-03","n":"13","q":"設置燃氣器具之室內裝修材料，應達耐燃幾級以上？","o":["4級","3級","2級","目前並無規定"],"a":"C","ty":"num","e":{"s":"ok","x":"建築技術規則建築設備編第80條第2項第2款：設置燃氣器具之室內裝修材料，應達耐燃二級以上，故選(C)。","b":[{"k":"law","l":"建築技術規則建築設備編","r":"第80條第2項第2款","q":"設置燃氣器具之室內裝修材料，應達耐燃二級以上。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070117"}],"nt":"簡報未提及燃氣器具周邊裝修材料等級。"}},{"id":"08-03-014","c":"08","t":"08-03","n":"14","q":"火災的形成有三個要素，可燃性物質、氧氣及熱源。室內裝修採用防火材料是為了減少哪一種物質？","o":["可燃性物質及氧氣混合物","可燃性物質","氧氣","熱源"],"a":"B","ty":"gen","e":{"s":"ok","x":"內政部消防署《防火宣導及教學指引》以「木材製裝潢（可燃物）、瓦斯爐火（熱源）及空氣中氧氣（助燃物）」說明燃燒要素，只要讓要素不同時存在即可防止燃燒；室內裝修改採防火材料，即是減少裝潢所構成之可燃性物質，故選(B)。","b":[{"k":"web","l":"內政部消防署《防火宣導及教學指引》（電子書）第12頁","r":"","q":"家中可以看到木材製裝潢 ( 可燃物 )、瓦斯爐火 ( 熱源 ) 及空氣中氧氣 ( 助燃物 )，","u":"https://ebook.nfa.gov.tw/1110106/files/basic-html/page12.html"},{"k":"web","l":"內政部消防署《防火宣導及教學指引》（電子書）第11頁","r":"","q":"能與空氣中的氧或其他氧化劑產生燃燒化學反應之物質。","m":"可燃物之定義。","u":"https://ebook.nfa.gov.tw/1110106/files/basic-html/page11.html"}],"nt":"資料明示裝潢屬可燃物；「防火材料係為減少可燃物」為據此之直接推論，未見逐字相同之官方說法。"}},{"id":"08-03-015","c":"08","t":"08-03","n":"15","q":"下列哪一種物品能使初期火災的微小火源沒有擴大延燒的機會，也就是消防法中的主要立法意旨？","o":["防焰物品","耐燃裝修材料","火警自動警報","滅火器"],"a":"A","ty":"gen","e":{"s":"ok","x":"桃園市政府消防局說明：防焰物品的目的，在於防止微小火源擴大，使燃燒初期之火勢受到抑制而不會繼續擴大蔓延燃燒；消防法第11條即規定一定場所應使用附有防焰標示之防焰物品，故選(A)。","b":[{"k":"web","l":"桃園市政府消防局「防焰物品」","r":"","q":"防焰物品的目的，在於防止微小火源擴大，使燃燒初期之火勢受到抑制而不會繼續擴大蔓延燃燒","u":"https://www.tyfd.gov.tw/cht/index.php?act=article&code=detail&ids=149&article_id=442"},{"k":"law","l":"消防法","r":"第11條第1項","q":"地面樓層達十一層以上建築物、地下建築物及中央主管機關指定之場所，其管理權人應使用附有防焰標示之地毯、窗簾、布幕、展示用廣告板及其他指定之防焰物品。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0120001"}],"nt":"簡報頁60僅提及11層以上建築物窗簾、地毯應附防焰標示，未說明防焰之目的。"}},{"id":"08-03-016","c":"08","t":"08-03","n":"16","q":"下列何種物品並非消防法中所規範之防焰物品？","o":["窗簾","布幕","地毯","壁紙"],"a":"D","ty":"gen","e":{"s":"ok","x":"消防法第11條第1項所定防焰物品為地毯、窗簾、布幕、展示用廣告板及其他指定之防焰物品；新北市政府消防局說明，壁紙、壁布、地板等構築於建築物構造體者，非屬消防法所規範之防焰對象物，故選(D)。","b":[{"k":"law","l":"消防法","r":"第11條第1項","q":"其管理權人應使用附有防焰標示之地毯、窗簾、布幕、展示用廣告板及其他指定之防焰物品。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0120001"},{"k":"web","l":"新北市政府消防局「消防安全」（防焰物品）","r":"","q":"非屬上列所規定之物品，如壁紙、壁布、地板等構築於建築物構造體者","m":"此類物品及傢飾布、床單、被套等，非屬消防法所規範之防焰對象物。","u":"https://www.fire.ntpc.gov.tw/PageDoc/Detail?fid=26&id=987"},{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－建物與室內裝修管理實務（建3-1～建3-3）","r":"頁碼60（PDF第61頁）","q":"窗簾與地毯都需要依據消防法第11條規定，應使用附有防焰標示"}]}},{"id":"08-03-017","c":"08","t":"08-03","n":"17","q":"下列何種物品為消防法中所規範之防焰物品？","o":["展示用廣告板","傢飾布","高層建築物使用之床單","被套"],"a":"A","ty":"gen","e":{"s":"ok","x":"消防法第11條第1項明列展示用廣告板為應附防焰標示之防焰物品；新北市政府消防局說明，傢飾布、床單、被套等物品非屬消防法所規範之防焰對象物，故選(A)。","b":[{"k":"law","l":"消防法","r":"第11條第1項","q":"其管理權人應使用附有防焰標示之地毯、窗簾、布幕、展示用廣告板及其他指定之防焰物品。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0120001"},{"k":"web","l":"新北市政府消防局「消防安全」（防焰物品）","r":"","q":"或傢飾布、床單、被套等物品，則非屬消防法所規範之防焰對象物。","u":"https://www.fire.ntpc.gov.tw/PageDoc/Detail?fid=26&id=987"}]}},{"id":"08-03-018","c":"08","t":"08-03","n":"18","q":"防焰物品不得以哪一種方式表示防焰標章？","o":["防焰證明附於租賃契約中","張貼於防焰物品","縫製於防焰物品","鑲釘於防焰物品"],"a":"A","ty":"neg","e":{"s":"ok","x":"簡報（建3-3）頁60：防焰標示應採張貼、縫製、鑲釘或懸掛等方式，標示於各防焰物品或其材料本體上顯著處；附於租賃契約中並非標示於物品本體，故選(A)。","b":[{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－建物與室內裝修管理實務（建3-1～建3-3）","r":"頁碼60（PDF第61頁）","q":"防焰標示應採張貼、縫製、鑲釘或懸掛等方式，標示於各防焰物品或其材料本體上顯著處，非常容易目視檢視。"}]}},{"id":"08-03-019","c":"08","t":"08-03","n":"19","q":"老人族群在建築物火災避難逃生中可說是高危險的族群。盡量讓年紀較大或行動不便之長者，居住在哪種房間以強化安全？","o":["選擇居住越高樓層越安全","選擇居住低樓層且靠近逃生出口的房間。","選擇遠離安全梯的房間","選擇鄰近電梯的房間"],"a":"B","ty":"gen","e":{"s":"ok","x":"基隆市消防局「老人防火安全小常識」：年紀大或行動不便者，應居住靠近逃生出口的房間；且火災時不可搭乘電梯逃生（內政部消防署宣導），故不宜以鄰近電梯或高樓層為選擇，故選(B)。","b":[{"k":"web","l":"基隆市消防局「老人防火安全小常識」","r":"","q":"年紀大或行動不便者，應居住靠近逃生出口的房間","u":"https://www.klfd.klcg.gov.tw/tw/klfd1/2097-106525.html"},{"k":"web","l":"內政部新聞「火場應變分秒必爭 消防署教你應變逃生及火災預防要訣」","r":"","q":"也絕對不可搭乘電梯逃生","u":"https://www.moi.gov.tw/News_Content.aspx?n=4&sms=9009&s=335768"}],"nt":"來源明載「靠近逃生出口」，未明載「低樓層」；(B)為唯一符合之選項。"}},{"id":"08-04-001","c":"08","t":"08-04","n":"01","q":"下列何種並非高層建築物防災中心設置目的？","o":["提供建築物中央空調","顯示各種防災設備","控制各種防災設備","災難發生時之指揮中心"],"a":"A","ty":"gen","e":{"s":"ok","x":"建築技術規則建築設計施工編第259條：高層建築物之電氣、消防安全、排煙及通風、昇降、通信廣播、燃氣等防災設備，其顯示裝置及控制應設於防災中心；內政部建築研究所研究亦指防災中心供相關人員於災害時進行救災應變的指揮與管控作業。條文所列並無提供中央空調之功能，故選(A)。","b":[{"k":"law","l":"建築技術規則建築設計施工編","r":"第259條第1項第4款","q":"高層建築物左列各種防災設備，其顯示裝置及控制應設於防災中心：","m":"所列設備為電氣電力、消防安全、排煙及通風、昇降及緊急昇降、連絡通信及廣播、燃氣及瓦斯緊急遮斷設備等；全條未提及空調。","u":"https://lawplayer.com/act/6437d09ce800e5f0b9301eae/60"},{"k":"web","l":"內政部建築研究所「建築物防災中心設置規範之研究」摘要","r":"","q":"以便相關人員得以在適度防護下，進行救災應變的指揮與管控作業。","u":"https://www.abri.gov.tw/News_Content_Table.aspx?n=807&s=38687"}],"nt":"簡報未提及防災中心。"}},{"id":"08-04-002","c":"08","t":"08-04","n":"02","q":"為維護建築物使用安全，集合住宅中，樓梯高度超過多少公分就應設置扶手？","o":["30公分","60公分","90公分","100公分"],"a":"D","ty":"num","e":{"s":"ok","x":"建築技術規則建築設計施工編第36條：樓梯內兩側均應裝設扶手，但「樓梯高度在一公尺以下者得免裝設扶手」；故樓梯高度超過100公分即應設置扶手，故選(D)。","b":[{"k":"law","l":"建築技術規則建築設計施工編","r":"第36條第2款","q":"樓梯高度在一公尺以下者得免裝設扶手。","m":"第36條本文：樓梯內兩側均應裝設距梯級鼻端高度七十五公分以上之扶手。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070115"}],"nt":"簡報未提及樓梯扶手。"}},{"id":"08-04-003","c":"08","t":"08-04","n":"03","q":"下列何種為消防設備？","o":["滅火器","緊急進口","緊急用昇降機","太陽能發電"],"a":"A","ty":"gen","e":{"s":"ok","x":"各類場所消防安全設備設置標準第7條將消防安全設備分為滅火、警報、避難逃生、消防搶救上必要設備等，第8條第1款滅火設備為「滅火器、消防砂」；簡報（建3-2）頁26亦稱滅火器為大樓公設中非常常見的消防設備。緊急進口、緊急用昇降機屬建築防火避難設施，太陽能發電非消防設備，故選(A)。","b":[{"k":"law","l":"各類場所消防安全設備設置標準","r":"第7條、第8條第1款","q":"一、滅火器、消防砂。","m":"第7條：各類場所消防安全設備為滅火設備、警報設備、避難逃生設備、消防搶救上之必要設備及其他經中央主管機關認定者；第8條第1款滅火設備為滅火器、消防砂。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0120029"},{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－建物與室內裝修管理實務（建3-1～建3-3）","r":"頁碼26（PDF第27頁）","q":"在大樓公設中也是非常常見的消防設備，兼具了低廉成本、方便有效的特性。"}],"nt":"緊急進口、緊急用昇降機不在設置標準第7條消防安全設備種類內（屬建築技術規則規範之防火避難設施），此點為依第7條列舉範圍之推論。"}},{"id":"08-04-004","c":"08","t":"08-04","n":"04","q":"建築物公共安全檢查簽證及申報辦法是依據哪一種法律由內政部訂定發布？","o":["消費者保護法","建築法","公寓大廈管理條例","消防法"],"a":"B","ty":"gen","e":{"s":"ok","x":"建築物公共安全檢查簽證及申報辦法第1條：本辦法依建築法第77條第5項規定訂定之，故選(B)。","b":[{"k":"law","l":"建築物公共安全檢查簽證及申報辦法","r":"第1條","q":"本辦法依建築法（以下簡稱本法）第七十七條第五項規定訂定之。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070149"}],"nt":"簡報未提及本辦法之法源。"}},{"id":"08-04-005","c":"08","t":"08-04","n":"05","q":"建築物公共安全檢查簽證申報自民國85年實施至今，最新相關內容修正為增加建築物附設防空避難設備檢查，自何時開始生效?","o":["民國113年1月1日","民國114年7月1日","尚未生效，仍待討論","內政部授權各縣市政府公布生效時間"],"a":"B","ty":"gen","e":{"s":"ok","x":"內政部114年4月17日台內國字第1140802916號令修正發布建築物公共安全檢查申報書表格式，增訂「F2-6建築物附建防空避難設備檢查表」，將建築物附建防空避難設備納入公共安全檢查及申報，並自114年7月1日生效，故選(B)。","b":[{"k":"web","l":"彰化縣政府建設處「內政部自114年7月1日起將「防空避難設備」納入公共安全檢查申報項目」","r":"","q":"為推動防空避難設施稽查整合作業，內政部公布114年7月1日起將建築物附建防空避難設備納入公共安全檢查及申報","u":"https://www.chcg.gov.tw/DTO/economic/07other/other01_con.aspx?cate_id=6354&data_id=27549&topsn=6353"},{"k":"web","l":"桃園市政府建築管理處公告","r":"","q":"並自114年7月1日生效","m":"公告：「建築物公共安全檢查申報相關書表格式」之F1-1申報書、F2-6建築物附建防空避難設備檢查表，函轉內政部114年4月17日台內國字第1140802916號令修正發布，並自114年7月1日生效。","u":"https://oba.tycg.gov.tw/News_Content.aspx?n=8678&s=1558992"}],"nt":"全國法規資料庫所載辦法本文為111-12-28修正版，條文無「防空避難」字樣；114年7月1日生效者為內政部修正之申報書表格式（防空避難設備檢查表）。"}},{"id":"08-04-006","c":"08","t":"08-04","n":"06","q":"建築物為公寓大廈者，建築物公共安全檢查申報得由誰代為申報？","o":["其管理委員會主任委員或管理負責人","村里長","建築物公共安全檢查公司","消防公司"],"a":"A","ty":"gen","e":{"s":"ok","x":"建築物公共安全檢查簽證及申報辦法第4條第2項：建築物為公寓大廈者，得由其管理委員會主任委員或管理負責人代為申報，故選(A)。","b":[{"k":"law","l":"建築物公共安全檢查簽證及申報辦法","r":"第4條第2項","q":"前項建築物為公寓大廈者，得由其管理委員會主任委員或管理負責人代為申報。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070149"}],"nt":"簡報未提及。"}},{"id":"08-04-007","c":"08","t":"08-04","n":"07","q":"辦理建築物防火避難設施及設備安全標準檢查之各檢查項目，應按哪一種用途檢查簽證及申報？","o":["實際現況用途","使用執照登載用途","建照執照登載用途","建物所有權狀登載用途"],"a":"A","ty":"gen","e":{"s":"ok","x":"建築物公共安全檢查簽證及申報辦法附表一備註一：辦理建築物公共安全檢查之各檢查項目，應按實際現況用途檢查簽證及申報，故選(A)。","b":[{"k":"web","l":"臺中市政府都市發展局《建築物公共安全檢查簽證及申報宣導手冊》（轉載辦法附表一）","r":"附表一備註一","q":"一、辦理建築物公共安全檢查之各檢查項目，應按實際現況用途檢查簽證及申報。","u":"https://www.taichung.gov.tw/media/267947/310179441871.pdf"}],"nt":"簡報未提及。"}},{"id":"08-04-008","c":"08","t":"08-04","n":"08","q":"依據「建築物公共安全檢查簽證及申報辦法」之規定，集合住宅建築物樓層達16層，辦理檢查簽證及申報之頻率為何？","o":["依照當地主管建築機關公告","每年1次","每2年1次","每4年1次"],"a":"C","ty":"num","e":{"s":"ok","x":"建築物公共安全檢查簽證及申報辦法附表一：H-2組（集合住宅）16層以上或建築物高度在50公尺以上者，每2年1次辦理檢查簽證及申報，故選(C)。","b":[{"k":"web","l":"臺中市政府都市發展局《建築物公共安全檢查簽證及申報宣導手冊》（轉載辦法附表一）","r":"附表一 H-2組","q":"16 層以上或 建築物高度在 50 公尺以上 每 2 年 1 次 1 月 1 日至 3 月 31 日止（第 1 季）","u":"https://www.taichung.gov.tw/media/267947/310179441871.pdf"}],"nt":"同表：H-2組8層以上未達16層且高度未達50公尺者每3年1次。"}},{"id":"08-04-009","c":"08","t":"08-04","n":"09","q":"依據「建築物公共安全檢查簽證及申報辦法」之規定，集合住宅建築物，辦理檢查簽證及申報之時間為第幾季？","o":["第1季","第2季","第3季","第4季"],"a":"A","ty":"num","e":{"s":"ok","x":"建築物公共安全檢查簽證及申報辦法附表一：H-2組集合住宅（16層以上者每2年1次、8層以上未達16層者每3年1次）之檢查及申報期間均為1月1日至3月31日止（第1季），故選(A)。","b":[{"k":"web","l":"臺中市政府都市發展局《建築物公共安全檢查簽證及申報宣導手冊》（轉載辦法附表一）","r":"附表一 H-2組","q":"16 層以上或 建築物高度在 50 公尺以上 每 2 年 1 次 1 月 1 日至 3 月 31 日止（第 1 季）","m":"8層以上未達16層且高度未達50公尺者，每3年1次，期間亦為1月1日至3月31日止（第1季）。","u":"https://www.taichung.gov.tw/media/267947/310179441871.pdf"}]}},{"id":"08-04-010","c":"08","t":"08-04","n":"10","q":"住宅大門老舊更新，基於防火安全考量，應注意何種事項？","o":["外觀華麗","價格實惠","多段鎖匙","應選用與原大門同等以上防火時效產品"],"a":"D","ty":"gen","ns":1,"e":{"s":"unclear","x":"","b":[{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－建物與室內裝修管理實務（建3-1～建3-3）","r":"頁碼50（PDF第51頁）","q":"3.不得妨害或破壞防火避難設施、消防設備、防火區劃及主要構造。"},{"k":"web","l":"新北市三峽區公所 防災宣導-消防常識","r":"","q":"防火門可以暫時將火災所產生的煙與熱阻隔於防火門外，以確保安全梯內成為無火、煙危害的安全空間。","u":"https://www.sanxia.ntpc.gov.tw/home.jsp?id=83a06160854808fb&act=be4f48068b2b0031&dataserno=6eb1a24fc1d91140b4c10247e4a60541"}],"f":"簡報頁50（建築法第77條之2：室內裝修不得妨害或破壞防火區劃）、頁55（以一小時以上防火時效之防火門窗區劃分隔）及消防宣導資料僅說明防火門／防火區劃之功能；另查內政部92.7.15函、建研所簡訊第90期、標準檢驗局「選購防火門-解讀關鍵密碼」，均未見「住宅大門更新應選用與原大門同等以上防火時效產品」之明文。(D)雖為唯一與防火相關之選項，但屬推論，依規則不寫題解。"}},{"id":"08-04-011","c":"08","t":"08-04","n":"11","q":"消防法中對於依法令或契約對各該場所有實際支配管理權者，稱為？","o":["防火管理人","管理權人","管理負責人","管理委員會"],"a":"B","ty":"gen","e":{"s":"ok","x":"簡報（建3-2）頁29及消防法第2條：管理權人係指依法令或契約對各該場所有實際支配管理權者；其屬法人者，為其負責人，故選(B)。","b":[{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－建物與室內裝修管理實務（建3-1～建3-3）","r":"頁碼29（PDF第30頁）","q":"而管理權人乃依照消防法第2條所示，係指依法令或契約對各該場所有實際支配管理權者；其屬法人者，為其負責人。"},{"k":"law","l":"消防法","r":"第2條","q":"本法所稱管理權人係指依法令或契約對各該場所有實際支配管理權者；其屬法人者，為其負責人。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0120001"}]}},{"id":"08-04-012","c":"08","t":"08-04","n":"12","q":"依各類場所消防安全設備設置標準設置之消防安全設備，其裝置、檢修應由具下列哪一種資格證照為之？","o":["防火管理人","公寓大廈管理服務人","公寓大廈管理服務人技術類","消防設備師或消防設備士"],"a":"D","ty":"gen","e":{"s":"amended","x":"消防法第7條第1項：依各類場所消防安全設備設置標準設置之消防安全設備，其設計、監造應由消防設備師為之；其測試、檢修應由消防設備師或消防設備士為之。簡報（建3-2）頁29亦指管理權人應委託消防設備師或消防設備士定期檢修消防安全設備，故選(D)。","b":[{"k":"law","l":"消防法","r":"第7條第1項","q":"依各類場所消防安全設備設置標準設置之消防安全設備，其設計、監造應由消防設備師為之；其測試、檢修應由消防設備師或消防設備士為之。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0120001"},{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－建物與室內裝修管理實務（建3-1～建3-3）","r":"頁碼29（PDF第30頁）","q":"其管理權人應委託第八條所規定之消防設備師或消防設備士，定期檢修消防安全設備，"}],"f":"題目用語「裝置、檢修」；現行消防法第7條第1項（同條第2項提及112-05-30修正條文）為「設計、監造」由消防設備師、「測試、檢修」由消防設備師或消防設備士為之，全法未再規定「裝置」由何人為之。檢修應由消防設備師或士為之之結論不變。"}},{"id":"08-04-013","c":"08","t":"08-04","n":"13","q":"經中央主管機關公告應實施認可之消防機具、器材及設備，非經登錄認可及附加認可標示，可以設置使用限制，下列敘述何者較為適宜？","o":["不得使用，但可以銷售","不可以使用，但可以陳列","不得銷售、陳列或設置使用","僅能陳列，不得銷售以及設置使用"],"a":"C","ty":"gen","e":{"s":"ok","x":"消防法第12條第1項：經中央主管機關公告應實施認可之消防機具、器材及設備，非經登錄機構之認可並附加認可標示者，不得銷售、陳列或設置使用，故選(C)。","b":[{"k":"law","l":"消防法","r":"第12條第1項","q":"經中央主管機關公告應實施認可之消防機具、器材及設備，非經中央主管機關所登錄機構之認可，並附加認可標示者，不得銷售、陳列或設置使用。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0120001"}],"nt":"簡報未提及消防器材認可，依法規作答。"}},{"id":"08-04-014","c":"08","t":"08-04","n":"14","q":"依據消防法所制定之消防防護計畫，防火避難設施之自行檢查:每月至少檢查幾次？","o":["1次","2次","3次","4次"],"a":"A","ty":"num","e":{"s":"ok",
