:"非租賃住宅服務業而經營代管業務或包租業務者，由直轄市、縣（市）主管機關禁止其營業，並處公司負責人、商業負責人、有限合夥負責人或行為人新臺幣四萬元以上二十萬元以下罰鍰，並限期改正；屆期未改正者，按次處罰；情節重大者並得勒令歇業。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060125"}]}},{"id":"10-01-040","c":"10","t":"10-01","n":"40","q":"根據《租賃住宅服務業倫理規範》，租服業應當協助政府健全租賃住宅管理制度，下列何者為佳？","o":["僱用具備租賃住宅管理人員資格或具備一定專業知識者","透過媒體批評政府租賃政策的不完善之處","只需在官方網站上公告相關政策及時令，不必實際執行","主要由政府單位負責管理，租服業無須參與"],"a":"A","ty":"gen","e":{"s":"ok","x":"倫理規範第4條：租服業應全力協助政府健全租賃住宅管理制度，僱用具備租賃住宅管理人員資格或具備一定專業知識者從事包租及代管業務，故選(A)。","b":[{"k":"law","l":"租賃住宅服務業倫理規範（中華民國租賃住宅服務商業同業公會全國聯合會）","r":"倫理規範第4條","q":"租服業應全力協助政府健全租賃住宅管理制度，僱用具備租賃住宅管理人員資格或具備一定專業知識者從事包租業務及代管業務。","u":"https://rentalh.org.tw/public/upimgs/%E7%A7%9F%E8%B3%83%E4%BD%8F%E5%AE%85%E6%9C%8D%E5%8B%99%E6%A5%AD%E5%80%AB%E7%90%86%E8%A6%8F%E7%AF%84.pdf"}]}},{"id":"10-01-041","c":"10","t":"10-01","n":"41","q":"依據租服業倫理規範，租服業在提供服務時應秉持何種精神？","o":["以最高價格獲取最大利潤為目標","以誠信為基礎並注重服務品質","盡量降低成本，即使可能影響租賃管理品質","以降低市場競爭為核心，以便提高服務費"],"a":"B","ty":"gen","e":{"s":"ok","x":"倫理規範第5條：租服業應秉持誠信精神並注重服務品質，故選(B)。","b":[{"k":"law","l":"租賃住宅服務業倫理規範（中華民國租賃住宅服務商業同業公會全國聯合會）","r":"倫理規範第5條","q":"租服業應秉持誠信精神並注重服務品質。","u":"https://rentalh.org.tw/public/upimgs/%E7%A7%9F%E8%B3%83%E4%BD%8F%E5%AE%85%E6%9C%8D%E5%8B%99%E6%A5%AD%E5%80%AB%E7%90%86%E8%A6%8F%E7%AF%84.pdf"}]}},{"id":"10-01-042","c":"10","t":"10-01","n":"42","q":"租服業在市場競爭中的秩序，下列何者為是？","o":["只要不涉及法律問題，即可使用他人商業機密","尊重同業之智慧財產與營業秘密","透過降低價格吸引客戶，即使可能造成惡性競爭","收購其他租服業以壟斷市場"],"a":"B","ty":"gen","e":{"s":"ok","x":"倫理規範第6條：租服業應尊重同業之智慧財產與營業秘密，維護租賃管理市場紀律，故選(B)。","b":[{"k":"law","l":"租賃住宅服務業倫理規範（中華民國租賃住宅服務商業同業公會全國聯合會）","r":"倫理規範第6條","q":"租服業應尊重同業之智慧財產與營業秘密，維護租賃管理市場紀律，共同塑造良好經營環境。","u":"https://rentalh.org.tw/public/upimgs/%E7%A7%9F%E8%B3%83%E4%BD%8F%E5%AE%85%E6%9C%8D%E5%8B%99%E6%A5%AD%E5%80%AB%E7%90%86%E8%A6%8F%E7%AF%84.pdf"}]}},{"id":"10-01-043","c":"10","t":"10-01","n":"43","q":"租服業在處理當事人個人資料時，應如何確保合法與安全？","o":["只要當事人未提出異議，就可以持續使用其個人資料","遵守個人資料保護法，並確保個資處理方式符合法令規範","將所有當事人資料存放於雲端，無須任何額外安全措施","只需在簽約時告知當事人個資使用方式，不需後續管理"],"a":"B","ty":"gen","e":{"s":"ok","x":"倫理規範第7條第1項：租服業應遵守消費者保護法、個人資料保護法等法令，確保處理和保管個人資料方式之合法及安全，故選(B)。","b":[{"k":"law","l":"租賃住宅服務業倫理規範（中華民國租賃住宅服務商業同業公會全國聯合會）","r":"倫理規範第7條第1項","q":"租服業應遵守消費者保護法、個人資料保護法等法令，保護當事人權益及隱私，確保處理和保管個人資料方式之合法及安全。","u":"https://rentalh.org.tw/public/upimgs/%E7%A7%9F%E8%B3%83%E4%BD%8F%E5%AE%85%E6%9C%8D%E5%8B%99%E6%A5%AD%E5%80%AB%E7%90%86%E8%A6%8F%E7%AF%84.pdf"}]}},{"id":"10-01-044","c":"10","t":"10-01","n":"44","q":"租服業應如何處理相關的利益衝突事件？","o":["允許從業人員接受供應商或委託人提供的獎勵，以維繫合作關係","只需在發生利益衝突時才採取行動","任何時候均應以當事人最佳利益為優先考量","主要考量公司利益，當事人利益可視情況而定"],"a":"C","ty":"gen","e":{"s":"ok","x":"倫理規範第8條：租服業應避免涉及可能引發利益衝突之情況，任何時候均以當事人最佳利益為優先考量，故選(C)。","b":[{"k":"law","l":"租賃住宅服務業倫理規範（中華民國租賃住宅服務商業同業公會全國聯合會）","r":"倫理規範第8條","q":"租服業應避免涉及可能引發利益衝突之情況，任何時候均以當事人最佳利益為優先考量。","u":"https://rentalh.org.tw/public/upimgs/%E7%A7%9F%E8%B3%83%E4%BD%8F%E5%AE%85%E6%9C%8D%E5%8B%99%E6%A5%AD%E5%80%AB%E7%90%86%E8%A6%8F%E7%AF%84.pdf"}]}},{"id":"10-01-045","c":"10","t":"10-01","n":"45","q":"租服業在業務運營中應如何兼顧社會及環境因素？","o":["確保公司發展優先，環境與社會責任可由政府管理","只需考量企業獲利，不必考慮環境與社會責任","以最低成本經營，即使對環境可能產生負面影響","採取永續經營之做法，為社區和環境做出積極貢獻"],"a":"D","ty":"gen","e":{"s":"ok","x":"倫理規範第9條：租服業在業務運營中應考慮社會及環境因素，採取永續經營之做法，為社區和環境做出積極的貢獻，故選(D)。","b":[{"k":"law","l":"租賃住宅服務業倫理規範（中華民國租賃住宅服務商業同業公會全國聯合會）","r":"倫理規範第9條","q":"租服業在業務運營中應考慮社會及環境因素，採取永續經營之做法，為社區和環境做出積極的貢獻。","u":"https://rentalh.org.tw/public/upimgs/%E7%A7%9F%E8%B3%83%E4%BD%8F%E5%AE%85%E6%9C%8D%E5%8B%99%E6%A5%AD%E5%80%AB%E7%90%86%E8%A6%8F%E7%AF%84.pdf"}]}},{"id":"10-01-046","c":"10","t":"10-01","n":"46","q":"租服業在聘任租賃住宅管理人員及從業人員時，應特別注意哪些事項？","o":["允許從業人員在未經公司同意的情況下私自接案","只要具備相關經驗，即可不考慮誠信問題","以最低薪資聘僱人員，降低營運成本","應重視品行及誠信，並避免聘用有不良紀錄者"],"a":"D","ty":"gen","e":{"s":"ok","x":"倫理規範第10條：租服業聘任或委任租賃住宅管理人員及從業人員應重視品行及誠信，並注意有無條例第20條第4款、第5款情形（如曾犯詐欺等罪），故選(D)。","b":[{"k":"law","l":"租賃住宅服務業倫理規範（中華民國租賃住宅服務商業同業公會全國聯合會）","r":"倫理規範第10條","q":"租服業聘任或委任租賃住宅管理人員及從業人員應重視品行及誠信，並注意有無租賃住宅市場發展及管理條例第 20 條第 4 款、第 5 款情形。","u":"https://rentalh.org.tw/public/upimgs/%E7%A7%9F%E8%B3%83%E4%BD%8F%E5%AE%85%E6%9C%8D%E5%8B%99%E6%A5%AD%E5%80%AB%E7%90%86%E8%A6%8F%E7%AF%84.pdf"}]}},{"id":"10-01-047","c":"10","t":"10-01","n":"47","q":"租服業在管理租賃住宅時，應如何履行善良管理人責任？","o":["妥善管理當事人之租賃住宅標的","只需確保房東的利益，租客的需求可視情況而定","只要不違法，即可自由決定如何管理","主要關注租賃合約，其他問題不屬於租服業責任"],"a":"A","ty":"gen","e":{"s":"ok","x":"倫理規範第11條：租服業應盡善良管理人責任，妥善管理當事人之租賃住宅標的，故選(A)。","b":[{"k":"law","l":"租賃住宅服務業倫理規範（中華民國租賃住宅服務商業同業公會全國聯合會）","r":"倫理規範第11條","q":"租服業應盡善良管理人責任，妥善管理當事人之租賃住宅標的。","u":"https://rentalh.org.tw/public/upimgs/%E7%A7%9F%E8%B3%83%E4%BD%8F%E5%AE%85%E6%9C%8D%E5%8B%99%E6%A5%AD%E5%80%AB%E7%90%86%E8%A6%8F%E7%AF%84.pdf"}]}},{"id":"10-01-048","c":"10","t":"10-01","n":"48","q":"下列何種行為屬於惡性競爭，不符合租服業倫理規範？","o":["以不正當方式影響委託人終止其他租服業的管理服務","透過提供優質服務來提升市場競爭力","合法使用廣告來提升品牌影響力","在遵守法規的前提下，提供客戶更具吸引力的租賃方案"],"a":"A","ty":"gen","e":{"s":"ok","x":"倫理規範第12條第2款：租服業管理服務期限未屆滿，以不正當方式使委託人終止租服業之管理服務，屬惡性競爭行為，故選(A)。","b":[{"k":"law","l":"租賃住宅服務業倫理規範（中華民國租賃住宅服務商業同業公會全國聯合會）","r":"倫理規範第12條第2款","q":"租服業管理服務期限未屆滿，以不正當方式使委託人終止租服業之管理服務。","u":"https://rentalh.org.tw/public/upimgs/%E7%A7%9F%E8%B3%83%E4%BD%8F%E5%AE%85%E6%9C%8D%E5%8B%99%E6%A5%AD%E5%80%AB%E7%90%86%E8%A6%8F%E7%AF%84.pdf"}]}},{"id":"10-01-049","c":"10","t":"10-01","n":"49","q":"租服業在對當事人說明業務服務內容時，應避免何種行為？","o":["提供完整且清楚的業務說明","蓄意隱瞞或誤導當事人，以獲取更高的服務費","依據法令要求，誠實告知所有費用與服務條件","讓當事人充分了解租賃流程，以確保其權益"],"a":"B","ty":"gen","e":{"s":"ok","x":"倫理規範第13條：租服業應依法令規定對當事人說明業務服務內容，不得有蓄意曚蔽欺罔之行為，故選(B)。","b":[{"k":"law","l":"租賃住宅服務業倫理規範（中華民國租賃住宅服務商業同業公會全國聯合會）","r":"倫理規範第13條","q":"租服業應依法令規定對當事人說明業務服務內容，不得有蓄意曚蔽欺罔之行為。","u":"https://rentalh.org.tw/public/upimgs/%E7%A7%9F%E8%B3%83%E4%BD%8F%E5%AE%85%E6%9C%8D%E5%8B%99%E6%A5%AD%E5%80%AB%E7%90%86%E8%A6%8F%E7%AF%84.pdf"}]}},{"id":"10-01-050","c":"10","t":"10-01","n":"50","q":"租賃住宅管理人員在執行業務時，應秉持何種態度確保住宅安全與維護？","o":["盡力而為，若時間允許才處理","善良管理人責任，並提供準確、完整的資訊及管理服務","主要負責租賃契約的簽訂，不需特別關注住宅安全","可視個人專業背景決定是否負責安全維護"],"a":"B","ty":"gen","e":{"s":"ok","x":"倫理規範第15條：租賃住宅管理人員及從業人員應秉於善良管理人之責任，確保住宅安全及維護，並以誠實及誠信之態度提供準確、完整資訊及管理服務，故選(B)。","b":[{"k":"law","l":"租賃住宅服務業倫理規範（中華民國租賃住宅服務商業同業公會全國聯合會）","r":"倫理規範第15條","q":"租賃住宅管理人員及從業人員應秉於善良管理人之責任，確保住宅安全及維護，並以誠實及誠信之態度提供準確、完整資訊及管理服務。","u":"https://rentalh.org.tw/public/upimgs/%E7%A7%9F%E8%B3%83%E4%BD%8F%E5%AE%85%E6%9C%8D%E5%8B%99%E6%A5%AD%E5%80%AB%E7%90%86%E8%A6%8F%E7%AF%84.pdf"}]}},{"id":"10-01-051","c":"10","t":"10-01","n":"51","q":"租賃住宅管理人員在提供租賃服務時，下列何者屬於不當行為？","o":["在租賃契約中詳細載明租賃條款及管理費用","恪守誠信原則，不得收取額外費用或不正當利益","於執行業務時，提供透明資訊並確保雙方權益","以不實廣告誇大物件條件，吸引租客簽約"],"a":"D","ty":"gen","e":{"s":"ok","x":"倫理規範第26條：不得作誇大不實之宣傳，或以不實廣告及其他足致他人誤信方式招攬業務；以不實廣告誇大物件條件吸引租客屬不當行為，故選(D)。","b":[{"k":"law","l":"租賃住宅服務業倫理規範（中華民國租賃住宅服務商業同業公會全國聯合會）","r":"倫理規範第26條","q":"租服業、租賃住宅管理人員及從業人員不得有虛偽、詐欺、作誇大不實之宣傳，或以不實廣告及其他足致他人誤信方式招攬業務。","u":"https://rentalh.org.tw/public/upimgs/%E7%A7%9F%E8%B3%83%E4%BD%8F%E5%AE%85%E6%9C%8D%E5%8B%99%E6%A5%AD%E5%80%AB%E7%90%86%E8%A6%8F%E7%AF%84.pdf"}]}},{"id":"10-01-052","c":"10","t":"10-01","n":"52","q":"根據租賃住宅服務業倫理規範，租賃住宅管理人員應如何確保租賃契約的合法性？","o":["參考市場行情自行調整租賃條款","依據租賃法規訂立契約，並確保符合中華民國法律標準","只需獲得租客口頭同意，即可變更契約內容","在雙方合意的情況下，可不經法律規範修改契約條款"],"a":"B","ty":"gen","e":{"s":"ok","x":"倫理規範第18條：租賃住宅管理人員及從業人員應遵守中華民國之法律規定，確保租賃契約和交易方式均遵循相關法律標準，故選(B)。","b":[{"k":"law","l":"租賃住宅服務業倫理規範（中華民國租賃住宅服務商業同業公會全國聯合會）","r":"倫理規範第18條","q":"租賃住宅管理人員及從業人員應遵守中華民國之法律規定，確保租賃契約和交易方式均遵循相關法律標準。","u":"https://rentalh.org.tw/public/upimgs/%E7%A7%9F%E8%B3%83%E4%BD%8F%E5%AE%85%E6%9C%8D%E5%8B%99%E6%A5%AD%E5%80%AB%E7%90%86%E8%A6%8F%E7%AF%84.pdf"}]}},{"id":"10-01-053","c":"10","t":"10-01","n":"53","q":"下列關於租賃住宅管理人員及從業人員之敘述，何者正確？","o":["可利用業務機會，向租客收取額外費用以提高服務品質","應遵守個人資料保護法，確保當事人資訊不被濫用","可在未經租客同意的情況下，將租賃資訊提供給第三方","只需負責租賃契約的訂立，不需確保租賃標的的維護"],"a":"B","ty":"gen","e":{"s":"ok","x":"倫理規範第18條：管理人員及從業人員應遵守中華民國之法律規定；第7條第1項要求遵守個人資料保護法、確保個資處理合法及安全，第25條並禁止不當利用當事人個資，故選(B)。","b":[{"k":"law","l":"租賃住宅服務業倫理規範（中華民國租賃住宅服務商業同業公會全國聯合會）","r":"倫理規範第18條","q":"租賃住宅管理人員及從業人員應遵守中華民國之法律規定","u":"https://rentalh.org.tw/public/upimgs/%E7%A7%9F%E8%B3%83%E4%BD%8F%E5%AE%85%E6%9C%8D%E5%8B%99%E6%A5%AD%E5%80%AB%E7%90%86%E8%A6%8F%E7%AF%84.pdf"},{"k":"law","l":"租賃住宅服務業倫理規範（中華民國租賃住宅服務商業同業公會全國聯合會）","r":"倫理規範第7條第1項","q":"租服業應遵守消費者保護法 const fmtDur = ms => { const s = Math.max(0, Math.round(ms / 1000)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60; return (h ? h + ':' + pad(m) : m) + ':' + pad(x); };

function allocate(total, weights) { // 最大餘數法
  const sum = weights.reduce((a, b) => a + b, 0); if (!sum) return weights.map(() => 0);
  const raw = weights.map(w => w / sum * total), base = raw.map(Math.floor);
  let rest = total - base.reduce((a, b) => a + b, 0);
  raw.map((r, i) => [r - base[i], i]).sort((a, b) => b[0] - a[0]).forEach(([, i]) => { if (rest > 0) { base[i]++; rest--; } });

function totals() {
  let seen = 0, a = 0, c = 0; for (const id in S.qs) { const r = S.qs[id]; if (r.a) { seen++; a += r.a; c += r.c; } }

}
function groupStat(ids) { let seen = 0, a = 0, c = 0, w = 0; ids.forEach(id => { const r = S.qs[id]; if (r && r.a) { seen++; a += r.a; c += r.c; if (inWrong(id)) w++; } }); return { n: ids.length, seen, a, c, w, acc: pct(c, a) }; }
function smartPick(ids, n) {
  const now = Date.now();
  const scored = ids.map(id => {
    const r = S.qs[id]; let s;
    if (!r || !r.a) s = 500 + Math.random() * 100;
    else if (inWrong(id)) s = 1000 + r.w * 30 - (now - r.lw) / 864e5 + Math.random() * 20;
    else s = Math.min(400, (now - r.lt) / 864e5 * 8) + (r.a ? (1 - r.c / r.a) * 200 : 0) + Math.random() * 30;
    return [s, id];

  return scored.sort((a, b) => b[0] - a[0]).slice(0, n).map(x => x[1]);

   <div class="small muted" id="pInfo"></div>

  const upd = () => {

function poolFor(sel) {

function rangeName(sel) {

/* ========== 練習進行 ========== */
function startSession(ids, title, mode = 'answer') {
  if (!ids.length) { toast('沒有符合的題目'); return; }
  S.session = { ids, i: 0, ans: {}, title, mode, ord: {}, start: Date.now() };
  if (S.settings.shuffle && mode === 'answer') ids.forEach(id => S.session.ord[id] = displayOrder(QM.get(id), true));
  save(true); go('#/session');
}
function vSession() {

function sessionSummary() {

function enableSwipe(elm, onLeft, onRight) {
  let x0 = null, y0 = null;
  elm.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, { passive: true });
  elm.addEventListener('touchend', e => {
    if (x0 === null) return; const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0; x0 = null;
    if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.6) { dx < 0 ? onLeft() : onRight(); window.scrollTo(0, 0); }
  }, { passive: true });
}

function examPlan(cfg) {
  const sel = new Set(cfg.topics), cs = CATS.filter(c => c.topics.some(t => sel.has(t.id)));
  const avail = cs.map(c => Q.filter(q => q.c === c.id && sel.has(q.t)).length);
  let ns;
  if (cfg.alloc === 'custom') ns = cs.map((c, i) => Math.min(avail[i], cfg.custom[c.id] != null ? cfg.custom[c.id] : 10));
  else if (cfg.alloc === 'even') { ns = allocate(Math.min(cfg.n, avail.reduce((a, b) => a + b, 0)), cs.map(() => 1)); // 平均後不足者重分配
    for (let k = 0; k < 5; k++) { let over = 0; ns = ns.map((n, i) => { if (n > avail[i]) { over += n - avail[i]; return avail[i]; } return n; }); if (!over) break; const room = ns.map((n, i) => avail[i] - n); const add = allocate(over, room); ns = ns.map((n, i) => n + add[i]); } }
  else ns = allocate(Math.min(cfg.n, avail.reduce((a, b) => a + b, 0)), avail);
  return cs.map((c, i) => ({ cid: c.id, n: ns[i] }));
}
function pickFrom(ids, n, src) {
  if (src === 'smart') return smartPick(ids, n);
  if (src === 'wrong') { const w = shuffle(ids.filter(inWrong)); return w.concat(shuffle(ids.filter(id => !inWrong(id)))).slice(0, n); }
  if (src === 'new') { const a = shuffle(ids.filter(id => !(S.qs[id] && S.qs[id].a))); return a.concat(shuffle(ids.filter(id => S.qs[id] && S.qs[id].a))).slice(0, n); }
  return shuffle(ids).slice(0, n);
}
function startExam(cfg) {
  const sel = new Set(cfg.topics); let ids = [];
  examPlan(cfg).forEach(p => {
    if (!p.n) return;
    const c = CM.get(p.cid), ts = c.topics.filter(t => sel.has(t.id)), tn = allocate(p.n, ts.map(t => TOPIC_Q.get(t.id).length));
    ts.forEach((t, i) => { ids = ids.concat(pickFrom(TOPIC_Q.get(t.id), tn[i], cfg.src)); });
  });
  if (!ids.length) { toast('範圍內沒有題目'); return; }
  const c = JSON.parse(JSON.stringify(cfg)); delete c.key;
  S.settings.examTpl = c;
  S.exam = { cfg: c, ids, ans: {}, mk: {}, i: 0, start: Date.now(), deadline: cfg.min ? Date.now() + cfg.min * 60000 : 0, ord: {} };
  if (S.settings.shuffle) ids.forEach(id => S.exam.ord[id] = displayOrder(QM.get(id), true));
  save(true); go('#/run');
}

    else t.textContent = '⏱ ' + fmtDur(Date.now() - ex.start);
  };
  tick(); examTick = setInterval(tick, 1000);
}
function submitExam() {
  const ex = S.exam; if (!ex) return;
  let correct = 0; const per = {};
  ex.ids.forEach(id => {
    const q = QM.get(id), a = ex.ans[id]; per[q.c] = per[q.c] || [0, 0]; per[q.c][1]++;
    if (a && record(id, a)) { correct++; per[q.c][0]++; }
  });
  const score = Math.round(correct / ex.ids.length * 1000) / 10;
  const res = { t: Date.now(), cfg: ex.cfg, ids: ex.ids, ans: ex.ans, ord: ex.ord, correct, total: ex.ids.length, score, pass: score >= ex.cfg.pass, per, dur: Date.now() - ex.start };
  S.exams.unshift(res); if (S.exams.length > 60) S.exams.length = 60;
  S.exam = null; save(true); go('#/result/0');
}

function vSearch() {

function hl(text, words) { let h = esc(text); words.forEach(w => { if (!w) return; const re = new RegExp(esc(w).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi'); h = h.replace(re, m => `<mark>${m}</mark>`); }); return h; }
function runSearch() {
  if (!SIDX) buildIndex();
  const words = SR.kw.trim().toLowerCase().split(/\s+/).filter(Boolean);
  const res = Q.filter(q => {
    if (SR.cat && q.c !== SR.cat) return false;
    if (SR.topic && q.t !== SR.topic) return false;
    const s = q.e ? q.e.s : '';
    if (SR.st === 'ok' && s !== 'ok') return false;
    if (SR.st === 'chg' && !(s === 'amended' || s === 'outdated')) return false;
    if (SR.st === 'todo' && !(s === 'unclear' || s === 'not_found')) return false;
    const r = S.qs[q.id];
    if (SR.mine === 'wrong' && !inWrong(q.id)) return false;
    if (SR.mine === 'everw' && !(r && r.w)) return false;
    if (SR.mine === 'bm' && !S.bm[q.id]) return false;
    if (SR.mine === 'note' && !S.notes[q.id]) return false;
    if (SR.mine === 'new' && r && r.a) return false;
    if (words.length) { const ix = SIDX.get(q.id); return words.every(w => ix.includes(w)); }
    return true;
  });
  const box = $('#sres');
  if (!res.length) { box.innerHTML = '<div class="empty">找不到符合的題目</div>'; return; }

    (res.length > SR.shown ? `<button class="btn block" id="more">再顯示 30 題（剩 ${res.length - SR.shown}）</button>` : '');
  box.querySelectorAll('[data-open]').forEach(b => b.onclick = () => {
    const card = b.closest('[data-id]'), q = QM.get(card.dataset.id), d = card.querySelector('.detail');
    const render = () => { d.innerHTML = `<div class="opts" style="margin-top:10px">${q.o.map((v, i) => `<div class="opt locked ${'ABCD'[i] === q.a ? 'right' : ''}"><span class="k">${'ABCD'[i]}</span><span class="v">${hl(v, words)}</span></div>`).join('')}</div>${explHTML(q)}${qActions(q)}`; bindQActions(d, q, render); };
    if (d.classList.contains('hide')) { render(); d.classList.remove('hide'); b.textContent = '收合'; } else { d.classList.add('hide'); b.textContent = '看選項與詳解'; }
  });
  const m = $('#more'); if (m) m.onclick = () => { SR.shown += 30; runSearch(); };
  $('#sPractice').onclick = () => startSession(res.map(q => q.id), '查詢結果' + (SR.kw ? '：' + SR.kw.slice(0, 10) : ''));
}

$('#btnSettings').onclick = () => {
  const s = S.settings;
  modal(`<h2 style="margin-top:0">設定</h2>
    <div class="field"><span class="lbl">字體大小</span>${segHTML('fs', [['s', '小'], ['m', '中'], ['l', '大'], ['xl', '特大']], s.fs)}</div>
    <div class="field"><span class="lbl">外觀</span>${segHTML('theme', [['auto', '跟隨系統'], ['light', '淺色'], ['dark', '深色']], s.theme)}</div>
    <div class="field"><span class="lbl">錯題本：連續答對幾次後自動移出</span>${segHTML('clearN', [['1', '1 次'], ['2', '2 次'], ['3', '3 次'], ['99', '不自動移出']], s.clearN)}</div>
    <label class="ck"><input type="checkbox" id="sAuto" ${s.autoNext ? 'checked' : ''}>練習時答對自動跳下一題</label>
    <label class="ck"><input type="checkbox" id="sShuf" ${s.shuffle ? 'checked' : ''}>選項順序隨機（「以上皆是」等題目維持原順序；正式考試答案位置固定，建議熟練後再開）</label>
    <div class="small muted" style="margin-top:10px">題庫：${esc(DB.meta.title)}（${esc(DB.meta.source)}）共 ${Q.length} 題；題解更新 ${esc(DB.meta.updated)}。題解依據來自訓練簡報、法規與主管機關資料；標示「題解待補」的題目以題庫答案為準。</div>
    <button class="btn block primary" style="margin-top:14px" id="sClose">完成</button>`, (m, close) => {
    bindSeg(m, 'fs', v => { s.fs = v; applySettings(); save(); });
    bindSeg(m, 'theme', v => { s.theme = v; applySettings(); save(); });
    bindSeg(m, 'clearN', v => { s.clearN = +v; save(); });
    m.querySelector('#sAuto').onchange = e => { s.autoNext = e.target.checked; save(); };
    m.querySelector('#sShuf').onchange = e => { s.shuffle = e.target.checked; save(); };
    m.querySelector('#sClose').onclick = () => { close(); route(); };
  });
};
/* 鍵盤（電腦） */
document.addEventListener('keydown', e => {
  if (/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName) || document.querySelector('.modal')) return;
  const k = e.key.toUpperCase(), map = { '1': 0, '2': 1, '3': 2, '4': 3, A: 0, B: 1, C: 2, D: 3 };
  if (k in map) { const b = document.querySelectorAll('#qc .opt:not(.locked)')[map[k]]; if (b) b.click(); }
  else if (e.key === 'ArrowRight') { const b = $('#next') || $('#skip'); if (b && !b.disabled) b.click(); }
  else if (e.key === 'ArrowLeft') { const b = $('#prev'); if (b && !b.disabled) b.click(); }
});
window.addEventListener('beforeunload', e => { if (S.exam) { save(true); } });
applySettings();
cloudBoot();
route();
</script>
</body>
</html>
