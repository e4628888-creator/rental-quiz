ame":"屋況設備點交及故障排除實務","topics":[{"id":"07-01","code":"一","name":"概論"},{"id":"07-02","code":"二","name":"各類設備點交實務"},{"id":"07-03","code":"三","name":"各類設備故障排除實務"},{"id":"07-04","code":"四","name":"各類設備管理維護實務"},{"id":"07-05","code":"五","name":"設備補充及功能提升評估"}]},{"id":"08","code":"捌","name":"建築物設備管理維護實務","topics":[{"id":"08-01","code":"一","name":"概論"},{"id":"08-02","code":"二","name":"建築物管理維護技術及企劃"},{"id":"08-03","code":"三","name":"集合住宅住戶使用維護手冊範本"},{"id":"08-04","code":"四","name":"建築物防火避難設施及消防設備維護"},{"id":"08-05","code":"五","name":"建築物設備設置標準及維護"}]},{"id":"09","code":"玖","name":"室內裝修相關法規","topics":[{"id":"09-01","code":"一","name":"建築物室內裝修管理辦法"},{"id":"09-02","code":"二","name":"建築物技術規則建築設計施工編"},{"id":"09-03","code":"三","name":"公寓大廈管理條例社區規約條款"}]},{"id":"10","code":"拾","name":"專業倫理規範","topics":[{"id":"10-01","code":"","name":"專業倫理規範"}]}],"qs":[{"id":"01-01-001","c":"01","t":"01-01","n":"01","q":"依租賃住宅市場發展及管理條例之規定，租賃住宅係指以出租供下列何者使用之建築物？","o":["居住使用","辦公使用","餐廳使用","店鋪使用"],"a":"A","ty":"gen","e":{"s":"ok","x":"第3條第1款定義「租賃住宅」為以出租供「居住使用」之建築物，故選(A)。","b":[{"k":"law","l":"租賃住宅市場發展及管理條例","r":"第3條第1款","q":"一、租賃住宅：指以出租供居住使用之建築物。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060125"}]}},{"id":"01-01-002","c":"01","t":"01-01","n":"02","q":"依租賃住宅市場發展及管理條例之規定，下列何者屬租賃住宅服務業？","o":["公寓大廈管理維護公司","租賃住宅代管業","不動產經紀業","不動產代銷業"],"a":"B","ty":"gen","e":{"s":"ok","x":"第3條第3款：租賃住宅服務業指「代管業」及「包租業」。公寓大廈管理維護公司、不動產經紀業、代銷業皆非屬之，故選(B)。","b":[{"k":"law","l":"租賃住宅市場發展及管理條例","r":"第3條第3款","q":"三、租賃住宅服務業：指租賃住宅代管業及租賃住宅包租業。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060125"}]}},{"id":"01-01-003","c":"01","t":"01-01","n":"03","q":"依租賃住宅市場發展及管理條例之規定，下列何者屬租賃住宅服務業？","o":["不動產經紀業","不動產代銷業","租賃住宅包租業","公寓大廈管理維護公司"],"a":"C","ty":"gen","e":{"s":"ok","x":"第3條第3款：租賃住宅服務業指代管業及「包租業」，選項中僅租賃住宅包租業屬之，故選(C)。","b":[{"k":"law","l":"租賃住宅市場發展及管理條例","r":"第3條第3款","q":"三、租賃住宅服務業：指租賃住宅代管業及租賃住宅包租業。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060125"}]}},{"id":"01-01-004","c":"01","t":"01-01","n":"04","q":"依租賃住宅市場發展及管理條例之規定，受出租人之委託，經營租賃住宅管理業務之公司，下列何者正確？","o":["不動產經紀業","不動產代銷業","租賃住宅包租業","租賃住宅代管業"],"a":"D","ty":"gen","e":{"s":"ok","x":"第3條第4款：受出租人之委託，經營租賃住宅管理業務之公司為「租賃住宅代管業」，故選(D)。","b":[{"k":"law","l":"租賃住宅市場發展及管理條例","r":"第3條第4款","q":"四、租賃住宅代管業（以下簡稱代管業）：指受出租人之委託，經營租賃住宅管理業務（以下簡稱代管業務）之公司。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060125"}]}},{"id":"01-01-005","c":"01","t":"01-01","n":"05","q":"依租賃住宅市場發展及管理條例之規定，承租租賃住宅並轉租，及經營該租賃住宅管理業務之公司，下列何者正確？","o":["租賃住宅包租業","租賃住宅代管業","不動產經紀業","不動產代銷業"],"a":"A","ty":"gen","e":{"s":"ok","x":"第3條第5款：承租租賃住宅並轉租，及經營該租賃住宅管理業務之公司為「租賃住宅包租業」，故選(A)。","b":[{"k":"law","l":"租賃住宅市場發展及管理條例","r":"第3條第5款","q":"五、租賃住宅包租業（以下簡稱包租業）：指承租租賃住宅並轉租，及經營該租賃住宅管理業務（以下簡稱包租業務）之公司。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060125"}]}},{"id":"01-01-006","c":"01","t":"01-01","n":"06","q":"依租賃住宅市場發展及管理條例之規定，租賃住宅服務業依法設置從事代管業務或包租業務之人員，下列何者正確？","o":["租賃住宅經紀人員","租賃住宅仲介人員","租賃住宅管理人員","租賃住宅管理公司"],"a":"C","ty":"gen","e":{"s":"ok","x":"第3條第8款：租賃住宅服務業依本條例所置從事代管業務或包租業務之人員，稱「租賃住宅管理人員」，故選(C)。","b":[{"k":"law","l":"租賃住宅市場發展及管理條例","r":"第3條第8款","q":"八、租賃住宅管理人員：指租賃住宅服務業依本條例規定所置從事代管業務或包租業務之人員。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060125"}]}},{"id":"01-01-007","c":"01","t":"01-01","n":"07","q":"依租賃住宅市場發展及管理條例之規定，承租租賃住宅，以其全部或一部租與他人居住使用，他人支付租金之租賃行為，下列何者正確？","o":["包租","代租","承租","轉租"],"a":"D","ty":"gen","e":{"s":"ok","x":"第3條第9款：承租租賃住宅，以其全部或一部租與他人居住使用，他人支付租金之租賃行為，稱「轉租」，故選(D)。","b":[{"k":"law","l":"租賃住宅市場發展及管理條例","r":"第3條第9款","q":"九、轉租：指承租租賃住宅，以其全部或一部租與他人居住使用，他人支付租金之租賃行為。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060125"}]}},{"id":"01-01-008","c":"01","t":"01-01","n":"08","q":"依租賃住宅市場發展及管理條例之規定，以其租用之住宅全部或一部租與他人居住者，下列何者正確？","o":["轉租人","包租人","代租人","承租人"],"a":"A","ty":"gen","e":{"s":"ok","x":"第3條第10款：以其租用之住宅全部或一部租與他人居住者，稱「轉租人」，故選(A)。","b":[{"k":"law","l":"租賃住宅市場發展及管理條例","r":"第3條第10款","q":"十、轉租人：指以其租用之住宅全部或一部租與他人居住者。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060125"}]}},{"id":"01-01-009","c":"01","t":"01-01","n":"09","q":"依租賃住宅市場發展及管理條例之規定，支付租金租用他人承租之租賃住宅供居住使用者，下列何者正確？","o":["次代租人","次承租人","次轉租人","次包租人"],"a":"B","ty":"gen","e":{"s":"ok","x":"第3條第11款：支付租金租用他人承租之租賃住宅供居住使用者，稱「次承租人」，故選(B)。","b":[{"k":"law","l":"租賃住宅市場發展及管理條例","r":"第3條第11款","q":"十一、次承租人：指支付租金租用他人承租之租賃住宅供居住使用者。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060125"}]}},{"id":"01-01-010","c":"01","t":"01-01","n":"10","q":"依租賃住宅市場發展及管理條例之規定，承租人為擔保租賃住宅之損害賠償行為及處理遺留物責任，預為支付之金錢，其名稱下列何者正確？","o":["保證金","訂金","租金","押金"],"a":"D","ty":"gen","e":{"s":"ok","x":"第3條第13款：承租人為擔保損害賠償行為及處理遺留物責任，預為支付之金錢，稱「押金」，故選(D)。","b":[{"k":"law","l":"租賃住宅市場發展及管理條例","r":"第3條第13款","q":"十三、押金：指承租人為擔保租賃住宅之損害賠償行為及處理遺留物責任，預為支付之金錢。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060125"}]}},{"id":"01-01-011","c":"01","t":"01-01","n":"11","q":"不適用租賃住宅市場發展及管理條例規定之租賃住宅，下列何者正確？","o":["供休閒或旅遊為目的之住宅","由出租人自行經營管理之住宅","供居住使用之住宅","租賃期間超過30日之住宅"],"a":"A","ty":"neg","e":{"s":"ok","x":"第4條第1款：供休閒或旅遊為目的之租賃住宅不適用本條例，故選(A)。出租人自行經營管理、租期超過30日之居住用住宅仍適用。","b":[{"k":"law","l":"租賃住宅市場發展及管理條例","r":"第4條第1款","q":"一、供休閒或旅遊為目的。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060125"}]}},{"id":"01-01-012","c":"01","t":"01-01","n":"12","q":"某甲將其住宅出租予某乙，其租賃期間至少幾日，始適用租賃住宅市場發展及管理條例之規定？","o":["60日","30日","20日","10日"],"a":"B","ty":"num","e":{"s":"ok","x":"第4條第4款：租賃期間未達30日者不適用本條例，反之租期至少30日始適用，故選(B)。","b":[{"k":"law","l":"租賃住宅市場發展及管理條例","r":"第4條第4款","q":"四、租賃期間未達三十日。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060125"}]}},{"id":"01-01-013","c":"01","t":"01-01","n":"13","q":"依租賃住宅市場發展及管理條例之規定，某甲將其住宅出租予某乙，該住宅租賃契約條款，違反住宅租賃契約應約定及不得約定事項之法律效果，下列何者正確？","o":["無效","得撤銷","不成立","效力未定"],"a":"A","ty":"neg","e":{"s":"amended","x":"違反應約定及不得約定事項之契約條款，其效力為「無效」，故選(A)。","b":[{"k":"law","l":"租賃住宅市場發展及管理條例（112-02-08修正前條文）","r":"修正前第5條","q":"非具消費關係之租賃契約條款，違反第一項應約定及不得約定事項者，無效","u":"https://6laws.net/6law/law/租賃住宅市場發展及管理條例.htm"},{"k":"law","l":"租賃住宅市場發展及管理條例","r":"現行第5條第5項","q":"第二項之住宅包租契約條款，違反該項應約定及不得約定事項者，無效","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060125"}],"f":"112年2月8日修正後，第5條第1項改為租賃契約出租人及承租人間「視為具消費關係」，適用消費者保護法；原「非具消費關係之租賃契約」應約定及不得約定事項之規定，已改為規範「住宅包租契約」（包租業與出租人間）。題目用語為修正前條文，法律效果（無效／仍構成契約內容）相同。"}},{"id":"01-01-014","c":"01","t":"01-01","n":"14","q":"依租賃住宅市場發展及管理條例之規定，非具消費關係之租賃契約條款，應約定事項而未記載於契約者，下列何者正確？","o":["未構成契約之內容","仍構成契約之內容","不生效力","無效"],"a":"B","ty":"gen","e":{"s":"amended","x":"應約定事項未記載於契約者，「仍構成契約之內容」，故選(B)。","b":[{"k":"law","l":"租賃住宅市場發展及管理條例（112-02-08修正前條文）","r":"修正前第5條","q":"該應約定事項未記載於契約者，仍構成契約之內容","u":"https://6laws.net/6law/law/租賃住宅市場發展及管理條例.htm"},{"k":"law","l":"租賃住宅市場發展及管理條例","r":"現行第5條第5項","q":"該應約定事項未記載於契約者，仍構成契約之內容；其為口頭約定者，亦同。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060125"}],"f":"112年2月8日修正後，第5條第1項改為租賃契約出租人及承租人間「視為具消費關係」，適用消費者保護法；原「非具消費關係之租賃契約」應約定及不得約定事項之規定，已改為規範「住宅包租契約」（包租業與出租人間）。題目用語為修正前條文，法律效果（無效／仍構成契約內容）相同。"}},{"id":"01-01-015","c":"01","t":"01-01","n":"15","q":"依租賃住宅市場發展及管理條例之規定，某甲將其住宅出租予某乙，其應約定事項僅以口頭約定，未記載於契約，其法律效果，下列何者正確？","o":["不生效力","無效","仍構成契約之內容","未構成契約之內容"],"a":"C","ty":"case","e":{"s":"amended","x":"應約定事項僅以口頭約定、未記載於契約者，亦「仍構成契約之內容」，故選(C)。","b":[{"k":"law","l":"租賃住宅市場發展及管理條例（112-02-08修正前條文）","r":"修正前第5條","q":"該應約定事項未記載於契約者，仍構成契約之內容；其為口頭約定者，亦同。","u":"https://6laws.net/6law/law/租賃住宅市場發展及管理條例.htm"},{"k":"law","l":"租賃住宅市場發展及管理條例","r":"現行第5條第5項","q":"該應約定事項未記載於契約者，仍構成契約之內容；其為口頭約定者，亦同。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060125"}],"f":"112年2月8日修正後，第5條第1項改為租賃契約出租人及承租人間「視為具消費關係」，適用消費者保護法；原「非具消費關係之租賃契約」應約定及不得約定事項之規定，已改為規範「住宅包租契約」（包租業與出租人間）。題目用語為修正前條文，法律效果（無效／仍構成契約內容）相同。"}},{"id":"01-01-016","c":"01","t":"01-01","n":"16","q":"依租賃住宅市場發展及管理條例之規定，租賃契約條款，一部無效或不構成契約內容之一部，除去該部分，契約亦可成立者，該契約其他部分之法律效力，下列何者正確？","o":["部分無效","全部無效","部分有效","仍為有效"],"a":"D","ty":"gen","e":{"s":"amended","x":"契約條款一部無效，除去該部分契約亦可成立者，其他部分「仍為有效」（但對當事人一方顯失公平者全部無效），故選(D)。","b":[{"k":"law","l":"租賃住宅市場發展及管理條例","r":"第5條第6項","q":"住宅包租契約條款，一部無效或不構成契約內容之一部，除去該部分，契約亦可成立者，該契約之其他部分，仍為有效。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060125"},{"k":"law","l":"租賃住宅市場發展及管理條例","r":"第5條第6項但書","q":"但對當事人之一方顯失公平者，該契約全部無效。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060125"}],"f":"112年修正後本項主詞為「住宅包租契約條款」（修正前為「租賃契約條款」），規範內容相同。"}},{"id":"01-01-017","c":"01","t":"01-01","n":"17","q":"依租賃住宅市場發展及管理條例之規定，某甲將其住宅出租予某乙，每月租金10,000元，某甲得向某乙收取之押金總額，下列何者正確？","o":["不得逾10,000元","不得逾20,000元","不得逾30,000元","不得逾40,000元"],"a":"B","ty":"num","e":{"s":"ok","x":"押金不得逾2個月租金總額；月租10,000元×2＝20,000元，故選(B)。","b":[{"k":"law","l":"租賃住宅市場發展及管理條例","r":"第7條第1項","q":"押金之金額，不得逾二個月之租金總額。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060125"}]}},{"id":"01-01-018","c":"01","t":"01-01","n":"18","q":"依租賃住宅市場發展及管理條例之規定，出租人將租賃住宅交付承租人後，於租賃期間對於租賃住宅品質，下列何者正確？","o":["保持室內空氣新鮮","保持室內溼度適宜","保持室內溫度適宜","保持合於居住使用之狀態"],"a":"D","ty":"gen","e":{"s":"ok","x":"出租人應於租賃期間保持租賃住宅「合於居住使用之狀態」，故選(D)。","b":[{"k":"law","l":"租賃住宅市場發展及管理條例","r":"第8條第1項","q":"並應於租賃期間保持其合於居住使用之狀態。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060125"}]}},{"id":"01-01-019","c":"01","t":"01-01","n":"19","q":"依租賃住宅市場發展及管理條例之規定，租賃住宅應由出租人負責修繕之項目，如出租人未於承租人所定適當期限內修繕，下列何者正確？","o":["承租人僅得自行自費雇工修繕","承租人得自行修繕，並請求出租人償還其費用","承租人應自行修繕","承租人不得自行修繕"],"a":"B","ty":"gen","e":{"s":"ok","x":"出租人未於承租人所定適當期限內修繕，承租人得自行修繕並請求出租人償還費用（或於租金中扣除），故選(B)。","b":[{"k":"law","l":"租賃住宅市場發展及管理條例","r":"第8條第3項","q":"如出租人未於承租人所定適當期限內修繕，承租人得自行修繕並請求出租人償還其費用或於約定之租金中扣除。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060125"}]}},{"id":"01-01-020","c":"01","t":"01-01","n":"20","q":"依租賃住宅市場發展及管理條例之規定，出租人對於修繕租賃住宅所為之必要行為，下列何者正確？","o":["承租人得有條件拒絕","承租人得有條件接受","承租人不得拒絕","承租人得拒絕"],"a":"C","ty":"gen","e":{"s":"ok","x":"出租人為修繕租賃住宅所為之必要行為，承租人「不得拒絕」，故選(C)。","b":[{"k":"law","l":"租賃住宅市場發展及管理條例","r":"第8條第4項","q":"出租人為修繕租賃住宅所為之必要行為，承租人不得拒絕。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060125"}]}},{"id":"01-01-021","c":"01","t":"01-01","n":"21","q":"依租賃住宅市場發展及管理條例之規定，轉租人簽訂轉租契約時，應向次承租人提供之文件，下列何者正確？","o":["同意轉租書面文件","建物所有權狀影本","使用執照影本","建物測量成果圖影本"],"a":"A","ty":"gen","e":{"s":"ok","x":"轉租人簽訂轉租契約時，應向次承租人提供出租人「同意轉租之書面文件」，故選(A)。","b":[{"k":"law","l":"租賃住宅市場發展及管理條例","r":"第9條第2項","q":"轉租人簽訂轉租契約時，應向次承租人提供前項同意轉租之書面文件","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060125"}]}},{"id":"01-01-022","c":"01","t":"01-01","n":"22","q":"依租賃住宅市場發展及管理條例之規定，轉租人應於簽訂轉租契約後幾日內，以書面通知出租人?","o":["至多10日內","至多20日內","至多30日內","至多60日內"],"a":"C","ty":"num","e":{"s":"ok","x":"轉租人應於簽訂轉租契約後30日內以書面通知出租人，故選(C)。","b":[{"k":"law","l":"租賃住宅市場發展及管理條例","r":"第9條第3項","q":"轉租人應於簽訂轉租契約後三十日內，以書面通知出租人。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060125"}]}},{"id":"01-01-023","c":"01","t":"01-01","n":"23","q":"依租賃住宅市場發展及管理條例之規定，承租人未經出租人書面同意，將租賃住宅轉租於他人，出租人提前終止租賃契約，應依規定期限，檢附相關事證，以書面通知承租人，下列何者正確？","o":["終止契約前至少30日","終止契約前至少7日","終止契約前至少半個月","終止契約前至少2個月"],"a":"A","ty":"num","e":{"s":"ok","x":"承租人未經書面同意轉租屬第10條第1項第3款，依同條第2項第1款，出租人應於終止前30日以書面通知，故選(A)。","b":[{"k":"law","l":"租賃住宅市場發展及管理條例","r":"第10條第1項第3款","q":"三、承租人未經出租人書面同意，將租賃住宅轉租於他人。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060125"},{"k":"law","l":"租賃住宅市場發展及管理條例","r":"第10條第2項第1款","q":"一、依前項第一款至第三款及第五款規定終止者，於終止前三十日。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060125"}]}},{"id":"01-01-024","c":"01","t":"01-01","n":"24","q":"依租賃住宅市場發展及管理條例之規定，承租人死亡，繼承人得主張終止租賃契約。繼承人依規定提前終止租賃契約者，且出租人不得要求任何賠償，應依規定期限，檢附相關事證，以書面通知出租人，下列何者正確？","o":["終止契約前至少7日","終止契約前至少20日","終止契約前至少30日","終止契約前至少2個月"],"a":"C","ty":"neg","e":{"s":"ok","x":"承租人死亡，繼承人得主張終止；依第11條第3項，應於終止前30日檢附事證以書面通知出租人，故選(C)。","b":[{"k":"law","l":"租賃住宅市場發展及管理條例","r":"第11條第2項","q":"承租人死亡，繼承人得主張終止租賃契約。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060125"},{"k":"law","l":"租賃住宅市場發展及管理條例","r":"第11條第3項","q":"承租人依第一項各款或其繼承人依前項提前終止租賃契約者，應於終止前三十日，檢附相關事證，以書面通知出租人。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060125"}]}},{"id":"01-01-025","c":"01","t":"01-01","n":"25","q":"依租賃住宅市場發展及管理條例之規定，住宅承租人因病，有長期療養之需要時。欲在出租人不得要求任何賠償條件下，提前終止租賃契約，其診斷證明之療養時程，下列何者正確？","o":["至少1個月以上","至少2個月以上","至少3個月以上","至少6個月以上"],"a":"D","ty":"neg","ns":1,"e":{"s":"ok","x":"因長期療養提前終止（第11條第1項第1款），施行細則第3條規定應檢附療養時程需6個月以上之診斷證明，故選(D)。","b":[{"k":"law","l":"租賃住宅市場發展及管理條例","r":"第11條第1項第1款","q":"一、因疾病、意外產生有長期療養之需要。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060125"},{"k":"law","l":"租賃住宅市場發展及管理條例施行細則","r":"施行細則第3條","q":"為設立有案醫療機構出具療養時程需六個月以上之診斷證明。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060126"}]}},{"id":"01-01-026","c":"01","t":"01-01","n":"26","q":"依租賃住宅市場發展及管理條例之規定，住宅租賃契約消滅時，租賃住宅之返還點交後尚有遺留物，除租賃當事人另有約定外，經出租人定相當期限催告，承租人仍不取回時，下列何者正確？","o":["仍擁有其所有權","視為拋棄其所有權","其所有權歸屬未定","其所有權視為滅失"],"a":"B","ty":"gen","e":{"s":"ok","x":"點交後之遺留物，經出租人定相當期限催告仍不取回時，「視為拋棄其所有權」，故選(B)。","b":[{"k":"law","l":"租賃住宅市場發展及管理條例","r":"第12條第2項","q":"經出租人定相當期限催告仍不取回時，視為拋棄其所有權","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060125"}]}},{"id":"01-01-027","c":"01","t":"01-01","n":"27","q":"依租賃住宅市場發展及管理條例之規定，住宅租賃契約消滅時，租賃住宅之返還點交後尚有遺留物，除租賃當事人另有約定外，經出租人定相當期限催告，承租人仍不取回時，遺留物所需處理費用，下列何者正確？","o":["出租人自行負擔","不得由押金扣除","得由押金扣除","不得請求承租人給付"],"a":"C","ty":"gen","e":{"s":"ok","x":"遺留物所需處理費用「得由押金扣除」，不足者出租人得請求承租人給付，故選(C)。","b":[{"k":"law","l":"租賃住宅市場發展及管理條例","r":"第12條第2項","q":"其所需處理費用，得由押金扣除，不足者，出租人得請求承租人給付。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060125"}]}},{"id":"01-01-028","c":"01","t":"01-01","n":"28","q":"依租賃住宅市場發展及管理條例之規定，出租人提供之租賃住宅廣告內容，下列何者正確？","o":["正確性由受託刊登媒體經營者負責","正確性由出租人負責，與他人無關","得約定僅供參考","應與事實相符"],"a":"D","ty":"gen","e":{"s":"ok","x":"出租人提供之租賃住宅廣告內容應與事實相符，故選(D)。","b":[{"k":"law","l":"租賃住宅市場發展及管理條例","r":"第13條第1項","q":"出租人提供之租賃住宅廣告內容應與事實相符。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060125"}]}},{"id":"01-01-029","c":"01","t":"01-01","n":"29","q":"依租賃住宅市場發展及管理條例之規定，受託刊登租賃住宅廣告之媒體經營者明知或可得而知廣告之租賃住宅面積、屋齡、樓層別及法定用途與事實不符者，就承租人因信賴該廣告所受之損害，下列何者正確？","o":["與出租人負連帶賠償責任","與出租人各負責一半賠償責任","與出租人均無關","出租人負責全部賠償責任"],"a":"A","ty":"gen","e":{"s":"ok","x":"媒體經營者明知或可得而知廣告之面積、屋齡、樓層別及法定用途不實者，就承租人所受損害與出租人「負連帶賠償責任」，故選(A)。","b":[{"k":"law","l":"租賃住宅市場發展及管理條例","r":"第13條第2項","q":"就承租人因信賴該廣告所受之損害與出租人負連帶賠償責任","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060125"}]}},{"id":"01-01-030","c":"01","t":"01-01","n":"30","q":"依租賃住宅市場發展及管理條例之規定，受託刊登租賃住宅廣告之媒體經營者明知或可得而知廣告之租賃住宅面積、屋齡、樓層別及法定用途與事實不符者，就承租人因信賴該廣告所受之損害與出租人負連帶賠償責任；其損害賠償責任，下列何者正確？","o":["基於契約自由原則，得自行約定","不得預先約定限制或拋棄","得約定限由出租人負擔","得約定限由刊登者負擔"],"a":"B","ty":"gen","e":{"s":"ok","x":"該損害賠償責任「不得預先約定限制或拋棄」，故選(B)。","b":[{"k":"law","l":"租賃住宅市場發展及管理條例","r":"第13條第2項","q":"其損害賠償責任，不得預先約定限制或拋棄。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060125"}]}},{"id":"01-01-031","c":"01","t":"01-01","n":"31","q":"依租賃住宅市場發展及管理條例之規定，承租人向直轄市或縣（市）政府申請住宅租賃爭議調處，其調處費用，下列何者正確？","o":["繳交3成調處費用","免繳調處費用","繳交全額調處費用","繳交一半調處費用"],"a":"B","ty":"gen","e":{"s":"ok","x":"住宅租賃爭議向直轄市或縣（市）政府申請調處，「免繳調處費用」，故選(B)。","b":[{"k":"law","l":"租賃住宅市場發展及管理條例","r":"第16條","q":"住宅租賃爭議，出租人或承租人得向直轄市或縣（市）政府申請調處，並免繳調處費用。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060125"}]}},{"id":"01-01-032","c":"01","t":"01-01","n":"32","q":"依租賃住宅市場發展及管理條例之規定，個人住宅所有權人將住宅出租予包租業轉租，契約約定供居住使用多少期間，始得減徵租金所得稅，下列何者正確？","o":["至少3年以上","至少2年以上","至少1年以上","至少半年以上"],"a":"C","ty":"num","ns":1,"e":{"s":"ok","x":"個人住宅所有權人委託代管或出租予包租業轉租，契約約定供居住使用「1年以上」者，得減徵租金所得稅，故選(C)。","b":[{"k":"law","l":"租賃住宅市場發展及管理條例","r":"第17條第1項","q":"個人住宅所有權人將住宅委託代管業或出租予包租業轉租，契約約定供居住使用一年以上者，得依下列規定減徵租金所得稅：","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060125"}]}},{"id":"01-01-033","c":"01","t":"01-01","n":"33","q":"依租賃住宅市場發展及管理條例之規定，住宅出租期間，每屋每月租金收入得免納綜合所得稅之金額，下列何者正確？","o":["不超過新臺幣2,000元","不超過新臺幣3,000元","不超過新臺幣5,000元","不超過新臺幣6,000元"],"a":"D","ty":"num","e":{"s":"ok","x":"每屋每月租金收入不超過新臺幣6,000元部分，免納綜合所得稅，故選(D)。","b":[{"k":"law","l":"租賃住宅市場發展及管理條例","r":"第17條第1項第1款","q":"一、出租期間每屋每月租金收入不超過新臺幣六千元部分，免納綜合所得稅。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060125"}]}},{"id":"01-01-034","c":"01","t":"01-01","n":"34","q":"依租賃住宅市場發展及管理條例之規定，租賃住宅每屋每月租金收入超過新臺幣6,000元至20,000元之部分，其租金所得必要損耗及費用之減除標準，下列何者正確？","o":["53%","47%","43%","57%"],"a":"A","ty":"num","e":{"s":"ok","x":"每屋每月租金收入超過6,000元至20,000元部分，必要損耗及費用依該部分租金收入53%計算，故選(A)。","b":[{"k":"law","l":"租賃住宅市場發展及管理條例","r":"第17條第1項第2款第1目","q":"（一）每屋每月租金收入超過新臺幣六千元至二萬元部分，依該部分租金收入百分之五十三計算。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060125"}]}},{"id":"01-01-035","c":"01","t":"01-01","n":"35","q":"依租賃住宅市場發展及管理條例之規定，某人有一住宅出租3年，其每月租金收入新臺幣10,000元整，期間委託租代管業管理，某人1年應列認租金申報綜合所得稅金額，下列何者正確？","o":["(10,000-6,000)*53%*12＝25,440元","(10,000-6,000)*47%*12＝22,560元","10,000*47%*12＝56,400元","10,000*53%*12＝63,600元"],"a":"B","ty":"num","e":{"s":"ok","x":"6,000元以下免稅；超過部分4,000元減除53%必要費用後，應列所得為47%。全年：(10,000－6,000)×47%×12＝22,560元，故選(B)。","b":[{"k":"law","l":"租賃住宅市場發展及管理條例","r":"第17條第1項第1款","q":"一、出租期間每屋每月租金收入不超過新臺幣六千元部分，免納綜合所得稅。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060125"},{"k":"law","l":"租賃住宅市場發展及管理條例","r":"第17條第1項第2款第1目","q":"（一）每屋每月租金收入超過新臺幣六千元至二萬元部分，依該部分租金收入百分之五十三計算。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060125"}]}},{"id":"01-01-036","c":"01","t":"01-01","n":"36","q":"依租賃住宅市場發展及管理條例之規定，租賃住宅每屋每月租金收入超過新臺幣20,000元部分，其應列認租金申報綜合所得稅金額，下列何者正確？","o":["免納綜合所得稅","依該部分租金收入53%計算","按所得稅法相關法令規定","依該部分租金收入47%計算"],"a":"C","ty":"gen","e":{"s":"ok","x":"每屋每月租金收入超過20,000元部分，依所得稅法相關法令規定之減除標準計算，故選(C)。","b":[{"k":"law","l":"租賃住宅市場發展及管理條例","r":"第17條第1項第2款第2目","q":"（二）每屋每月租金收入超過新臺幣二萬元部分，依該部分租金收入按所得稅法相關法令規定之減除標準計算。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060125"}]}},{"id":"01-01-037","c":"01","t":"01-01","n":"37","q":"依租賃住宅市場發展及管理條例之規定，某人有一住宅出租3年，每月租金收入新臺幣20,000元整，期間委託租代管業管理，某人1年應申報綜合所得稅金額，下列何者正確？","o":["20,000*53%*12＝127,200元","20,000*47%*12＝112,800元","(20,000-6,000)*53%*12＝89,040元","(20,000-6,000)*47%*12＝78,960元"],"a":"D","ty":"num","e":{"s":"ok","x":"6,000元以下免稅；6,000～20,000元部分減除53%費用，應列所得47%。全年：(20,000－6,000)×47%×12＝78,960元，故選(D)。","b":[{"k":"law","l":"租賃住宅市場發展及管理條例","r":"第17條第1項第1款","q":"一、出租期間每屋每月租金收入不超過新臺幣六千元部分，免納綜合所得稅。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060125"},{"k":"law","l":"租賃住宅市場發展及管理條例","r":"第17條第1項第2款第1目","q":"（一）每屋每月租金收入超過新臺幣六千元至二萬元部分，依該部分租金收入百分之五十三計算。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060125"}]}},{"id":"01-01-038","c":"01","t":"01-01","n":"38","q":"依租賃住宅市場發展及管理條例施行細則之規定，個人住宅所有權人將住宅出租予包租業轉租，得減徵租金所得稅，其租賃契約書約定之租賃期間，下列何者正確？","o":["應達1年以上","應達9個月以上","應達6個月以上","應達3個月以上"],"a":"A","ty":"num","ns":1,"e":{"s":"ok","x":"施行細則第4條第2款：出租予包租業者，租賃契約書約定之租賃期間須達1年以上，故選(A)。","b":[{"k":"law","l":"租賃住宅市場發展及管理條例施行細則","r":"施行細則第4條第2款","q":"二、個人住宅所有權人出租予租賃住宅包租業者：簽訂租賃契約書約定之租賃期間達一年以上。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060126"}]}},{"id":"01-01-039","c":"01","t":"01-01","n":"39","q":"依租賃住宅市場發展及管理條例之規定，租賃住宅服務業者向直轄市、縣（市）主管機關申請許可後，多久期間內應辦妥公司登記；屆期未辦妥公司登記者，由直轄市、縣（市）主管機關廢止其許可，下列何者正確？","o":["至多9個月內","至多6個月內","至多3個月內","至多1個月內"],"a":"C","ty":"num","e":{"s":"ok","x":"申請許可後3個月內應辦妥公司登記，屆期未辦妥者廢止許可，故選(C)。","b":[{"k":"law","l":"租賃住宅市場發展及管理條例","r":"第19條第1項","q":"並於許可後三個月內辦妥公司登記；屆期未辦妥公司登記者，由直轄市、縣（市）主管機關廢止其許可。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060125"}]}},{"id":"01-01-040","c":"01","t":"01-01","n":"40","q":"依租賃住宅市場發展及管理條例之規定，租賃住宅服務業應於完成公司登記後，多久期間內繳存營業保證金、置租賃住宅管理人員及加入登記所在地之同業公會，檢附有關證明文件向直轄市、縣（市）主管機關申請租賃住宅服務業登記並領得登記證後，始得營業，下列何者正確？","o":["至多1個月內","至多2個月內","至多3個月內","至多6個月內"],"a":"D","ty":"num","e":{"s":"ok","x":"完成公司登記後6個月內應繳存營業保證金、置管理人員、加入同業公會並申請登記，故選(D)。","b":[{"k":"law","l":"租賃住宅市場發展及管理條例","r":"第19條第2項","q":"租賃住宅服務業應於完成公司登記後六個月內繳存營業保證金、置租賃住宅管理人員及加入登記所在地之同業公會","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060125"}]}},{"id":"01-01-041","c":"01","t":"01-01","n":"41","q":"依租賃住宅市場發展及管理條例之規定，租賃住宅服務業領得登記證後多久期間未開始營業，直轄市、縣（市）主管機關得註銷其登記證，下列何者正確？","o":["逾1個月","逾3個月","逾6個月","逾9個月"],"a":"C","ty":"num","e":{"s":"ok","x":"領得登記證後逾6個月未開始營業者，由主管機關廢止其登記並註銷登記證，故選(C)。","b":[{"k":"law","l":"租賃住宅市場發展及管理條例","r":"第19條第5項","q":"租賃住宅服務業或其分設營業處所於領得登記證後逾六個月未開始營業或自行停止營業連續六個月以上者，由直轄市、縣（市）主管機關廢止其登記並註銷其登記證。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060125"}],"nt":"現行條文用語為「廢止其登記並註銷其登記證」；期間（逾6個月）與答案一致。"}},{"id":"01-01-042","c":"01","t":"01-01","n":"42","q":"依租賃住宅市場發展及管理條例之規定，代管業及包租業組織商業團體之業別，下列何者正確？","o":["以租賃住宅代管商業為之","以租賃住宅包租商業為之","以租賃房屋服務商業為之","以租賃住宅服務商業為之"],"a":"D","ty":"gen","e":{"s":"ok","x":"代管業及包租業組織商業團體，應以「租賃住宅服務商業」之業別為之，不得依業務性質分別組織，故選(D)。","b":[{"k":"law","l":"租賃住宅市場發展及管理條例","r":"第19條第7項","q":"代管業及包租業組織商業團體，應以租賃住宅服務商業之業別為之，不得依其業務性質分別組織。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060125"}]}},{"id":"01-01-043","c":"01","t":"01-01","n":"43","q":"依租賃住宅市場發展及管理條例之規定，租賃住宅服務業營業後，所置租賃住宅管理人員異動時，應於異動之日起多少期間內，造具名冊報請直轄市、縣（市）主管機關備查，下列何者正確？","o":["不得逾60日","不得逾30日","不得逾20日","不得逾10日"],"a":"B","ty":"num","e":{"s":"ok","x":"所置租賃住宅管理人員異動者，應於異動之日起30日內造具名冊報請備查，故選(B)。","b":[{"k":"law","l":"租賃住宅市場發展及管理條例","r":"第21條第3項","q":"所置租賃住宅管理人員異動者，應於異動之日起三十日內，造具名冊報請直轄市、縣（市）主管機關備查。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060125"}]}},{"id":"01-01-044","c":"01","t":"01-01","n":"44","q":"依租賃住宅市場發展及管理條例施行細則之規定，租賃住宅服務業或其分設營業處所經直轄市、縣（市）主管機關准予停業登記者，於登記停業期間內，下列何者正確？","o":["非重新辦理商業登記，不得有營業行為","非經註銷停業登記，不得有營業行為","辦理復業登記與營業行為，可同時進行","非經辦妥復業登記，不得有營業行為"],"a":"D","ty":"gen","e":{"s":"ok","x":"經准予停業登記者，於登記停業期間內，「非經辦妥復業登記，不得有營業行為」，故選(D)。","b":[{"k":"law","l":"租賃住宅市場發展及管理條例施行細則","r":"施行細則第16條第3項","q":"於登記停業期間內，非經辦妥復業登記，不得有營業行為。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060126"}]}},{"id":"01-01-045","c":"01","t":"01-01","n":"45","q":"依租賃住宅市場發展及管理條例之規定，租賃住宅服務業擔任營業保證基金管理委員會委員之人數比例上限，下列何者正確？","o":["2/5","1/5","1/4","1/3"],"a":"A","ty":"num","e":{"s":"ok","x":"基金管理委員會委員由租賃住宅服務業擔任者，人數不得超過委員總數之五分之二，故選(A)。","b":[{"k":"law","l":"租賃住宅市場發展及管理條例","r":"第22條第3項","q":"前項基金管理委員會委員，由租賃住宅服務業擔任者，其人數不得超過委員總數之五分之二。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060125"}]}},{"id":"01-01-046","c":"01","t":"01-01","n":"46","q":"依租賃住宅市場發展及管理條例之規定，租賃住宅服務業繳存之營業保證金不足時，全國聯合會應通知租賃住宅服務業者應於幾月內補足，下列何者正確？","o":["半個月","1個月","2個月","3個月"],"a":"B","ty":"num","e":{"s":"ok","x":"營業保證金低於規定額度時，全國聯合會應通知業者於1個月內補足，故選(B)。","b":[{"k":"law","l":"租賃住宅市場發展及管理條例","r":"第22條第5項","q":"全國聯合會應通知租賃住宅服務業者於一個月內補足","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060125"}]}},{"id":"01-01-047","c":"01","t":"01-01","n":"47","q":"依租賃住宅市場發展及管理條例之規定，租賃住宅服務業因合併或變更組織型態時，其所繳存之營業保證金，下列何者正確？","o":["應重新申請","應辦理退回","應隨之移轉","應請取取回"],"a":"C","ty":"gen","e":{"s":"ok","x":"因合併或變更組織型態時，所繳存之營業保證金「應隨之移轉」，故選(C)。","b":[{"k":"law","l":"租賃住宅市場發展及管理條例","r":"第23條第2項","q":"租賃住宅服務業因合併或變更組織型態時，其所繳存之營業保證金應隨之移轉。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060125"}]}},{"id":"01-01-048","c":"01","t":"01-01","n":"48","q":"依租賃住宅市場發展及管理條例之規定，租賃住宅服務業僱用從事代管業務及包租業務之人員，應具備何種資格？","o":["租賃住宅管理人員","租賃住宅仲介人員","租賃住宅代銷人員","租賃住宅經紀人"],"a":"A","ty":"gen","e":{"s":"ok","x":"租賃住宅服務業應僱用具備「租賃住宅管理人員」資格者從事代管及包租業務，故選(A)。","b":[{"k":"law","l":"租賃住宅市場發展及管理條例","r":"第25條第1項","q":"租賃住宅服務業應僱用具備租賃住宅管理人員資格者從事代管業務及包租業務。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060125"}]}},{"id":"01-01-049","c":"01","t":"01-01","n":"49","q":"依租賃住宅市場發展及管理條例之規定，租賃住宅服務業應設置幾位專任租賃住宅管理人員？","o":["至少4人","至少1人","至少2人","至少3人"],"a":"B","ty":"num","e":{"s":"ok","x":"租賃住宅服務業應置專任租賃住宅管理人員至少1人，故選(B)。","b":[{"k":"law","l":"租賃住宅市場發展及管理條例","r":"第25條第2項","q":"租賃住宅服務業應置專任租賃住宅管理人員至少一人","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060125"}]}},{"id":"01-01-050","c":"01","t":"01-01","n":"50","q":"依租賃住宅市場發展及管理條例之規定，租賃住宅服務業每一營業處所，應置幾位專任租賃住宅管理人員？","o":["至少3人","至少2人","至少1人","至少4人"],"a":"C","ty":"num","e":{"s":"ok","x":"分設營業處所者，每一營業處所應置專任租賃住宅管理人員至少1人，故選(C)。","b":[{"k":"law","l":"租賃住宅市場發展及管理條例","r":"第25條第2項","q":"其分設營業處所者，每一營業處所，應置專任租賃住宅管理人員至少一人。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060125"}]}},{"id":"01-01-051","c":"01","t":"01-01","n":"51","q":"依租賃住宅市場發展及管理條例之規定，專任租賃住宅管理人員受僱租賃住宅服務業之家數，下列何者正確？","o":["得同時受僱於4家","得同時受僱於3家","得同時受僱於2家","至多受僱於1家"],"a":"D","ty":"num","e":{"s":"ok","x":"專任租賃住宅管理人員不得同時受僱於2家以上，即至多受僱於1家，故選(D)。","b":[{"k":"law","l":"租賃住宅市場發展及管理條例","r":"第25條第3項","q":"前項專任租賃住宅管理人員，不得同時受僱於二家以上租賃住宅服務業。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060125"}]}},{"id":"01-01-052","c":"01","t":"01-01","n":"52","q":"依租賃住宅市場發展及管理條例之規定，租賃住宅管理人員證書有效期限，下列何者正確？","o":["5年","4年","3年","2年"],"a":"B","ty":"num","e":{"s":"ok","x":"租賃住宅管理人員證書有效期限為4年，故選(B)。","b":[{"k":"law","l":"租賃住宅市場發展及管理條例","r":"第26條第2項","q":"前項證書有效期限為四年","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060125"}]}},{"id":"01-01-053","c":"01","t":"01-01","n":"53","q":"依租賃住宅市場發展及管理條例之規定，租賃住宅管理人員證書有效期限期滿前幾個月內，應重新辦理登錄及換證，下列何者正確？","o":["至多2個月","至多3個月","至多6個月","至多9個月"],"a":"C","ty":"num","e":{"s":"ok","x":"證書期滿前6個月內，應重新辦理登錄及換證，故選(C)。","b":[{"k":"law","l":"租賃住宅市場發展及管理條例","r":"第26條第2項","q":"期滿前六個月內，租賃住宅管理人員應檢附其於最近二年內參加全國聯合會舉辦換證訓練並測驗合格之證明文件","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060125"}]}},{"id":"01-01-054","c":"01","t":"01-01","n":"54","q":"依租賃住宅市場發展及管理條例之規定，包租業與次承租人簽訂租賃契約書後幾日內，將該契約轉租標的範圍、租賃期間及次承租人資訊以書面通知出租人，下列何者正確？","o":["至多21日內","至多30日內","至多14日內","至多7日內"],"a":"B","ty":"num","e":{"s":"ok","x":"包租業應於與次承租人簽訂契約書後30日內，將轉租標的範圍、租賃期間及次承租人資訊以書面通知出租人，故選(B)。","b":[{"k":"law","l":"租賃住宅市場發展及管理條例","r":"第29條第3項","q":"包租業應於前項契約書簽訂後三十日內，將該契約轉租標的範圍、租賃期間及次承租人資訊以書面通知出租人。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060125"}]}},{"id":"01-01-055","c":"01","t":"01-01","n":"55","q":"依租賃住宅市場發展及管理條例之規定，包租業轉租租賃住宅後，出租人提前終止租賃契約者，包租業除應於知悉終止租賃契約之次日起幾日內通知次承租人終止轉租契約，下列何者正確？","o":["至多10日內","至多7日內","至多5日內","至多3日內"],"a":"C","ty":"num","e":{"s":"ok","x":"出租人提前終止租約者，包租業應於知悉之次日起5日內通知次承租人終止轉租契約，故選(C)。","b":[{"k":"law","l":"租賃住宅市場發展及管理條例","r":"第30條第1項","q":"包租業除應於知悉終止租賃契約之次日起五日內通知次承租人終止轉租契約","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060125"}]}},{"id":"01-01-056","c":"01","t":"01-01","n":"56","q":"依租賃住宅市場發展及管理條例之規定，租賃住宅服務業因其受僱人執行業務之故意或過失致租賃住宅服務當事人受損害者，該租賃住宅服務業應負之責任，下列何者正確？","o":["負賠償責任","與受僱人負連帶賠償責任","免負連償責任","負道義賠償責任"],"a":"B","ty":"gen","e":{"s":"ok","x":"因受僱人執行業務之故意或過失致當事人受損害者，租賃住宅服務業應與受僱人「負連帶賠償責任」，故選(B)。","b":[{"k":"law","l":"租賃住宅市場發展及管理條例","r":"第31條第2項","q":"租賃住宅服務業因其受僱人執行業務之故意或過失致租賃住宅服務當事人受損害者，該租賃住宅服務業應與其受僱人負連帶賠償責任。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060125"}]}},{"id":"01-01-057","c":"01","t":"01-01","n":"57","q":"依租賃住宅市場發展及管理條例之規定，被害人對於租賃住宅服務業之爭議，經基金管理委員會調處決議支付時，應向哪一單位請求代為賠償？","o":["當地主管機關","中央主管機關","中華民國租賃住宅服務商業同業公會全國聯合會","當地同業公會"],"a":"C","ty":"gen","e":{"s":"ok","x":"經基金管理委員會調處決議支付者，得向「全國聯合會」（中華民國租賃住宅服務商業同業公會全國聯合會）請求代為賠償，故選(C)。","b":[{"k":"law","l":"租賃住宅市場發展及管理條例","r":"第31條第4項","q":"被害人取得對租賃住宅服務業或其受僱人之執行名義或經基金管理委員會調處決議支付者，得於該租賃住宅服務業繳存營業保證金及提供擔保總額內，向全國聯合會請求代為賠償","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060125"},{"k":"law","l":"租賃住宅市場發展及管理條例","r":"第22條第2項","q":"由中華民國租賃住宅服務商業同業公會全國聯合會（以下簡稱全國聯合會）","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060125"}]}},{"id":"01-01-058","c":"01","t":"01-01","n":"58","q":"依租賃住宅市場發展及管理條例施行細則之規定，租賃住宅服務業收受租賃住宅服務當事人之有關費用或文件者，下列何者正確？","o":["通知主管機關","書面登記","掣給收據","上網登錄"],"a":"C","ty":"gen","e":{"s":"ok","x":"施行細則第27條：收受當事人有關費用或文件者，應「掣給收據」，故選(C)。","b":[{"k":"law","l":"租賃住宅市場發展及管理條例施行細則","r":"施行細則第27條","q":"租賃住宅服務業收受租賃住宅服務當事人之有關費用或文件者，應掣給收據。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060126"}]}},{"id":"01-01-059","c":"01","t":"01-01","n":"59","q":"依租賃住宅市場發展及管理條例之規定，租賃住宅服務業應於每季結束後幾日內，將其受託管理、承租或轉租租賃住宅之相關資訊，提供直轄市、縣（市）主管機關，下列何者正確？","o":["至多3日內","至多7日內","至多10日內","至多15日內"],"a":"D","ty":"num","e":{"s":"outdated","x":"題庫答案(D)「15日內」係依112年修正前第34條「每季結束後十五日內」。","b":[{"k":"law","l":"租賃住宅市場發展及管理條例（112-02-08修正前條文）","r":"修正前第34條第1項","q":"租賃住宅服務業應於每季結束後十五日內，將其受託管理、承租或轉租租賃住宅之相關資訊","u":"https://6laws.net/6law/law/租賃住宅市場發展及管理條例.htm"},{"k":"law","l":"租賃住宅市場發展及管理條例","r":"現行第34條第1項（112-09-01施行）","q":"租賃住宅服務業應於訂定契約之日起三十日內，將其受託管理、承租或轉租租賃住宅之相關資訊，提供直轄市、縣（市）主管機關。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060125"}],"f":"現行第34條已改為「應於訂定契約之日起三十日內」提供資訊（112年2月8日修正公布，112年9月1日施行），已無「每季結束後」之規定。題庫答案與現行法不同，請以考試單位公告為準。"}},{"id":"01-01-060","c":"01","t":"01-01","n":"60","q":"依租賃住宅市場發展及管理條例之規定，主管機關檢查租賃住宅服務業之業務，租賃住宅服務業之行為，下列何者正確？","o":["同意","規避","妨礙","拒絕"],"a":"A","ty":"gen","e":{"s":"ok","x":"主管機關檢查業務時，租賃住宅服務業不得規避、妨礙或拒絕，即應「同意」受檢，故選(A)。","b":[{"k":"law","l":"租賃住宅市場發展及管理條例","r":"第35條","q":"主管機關檢查租賃住宅服務業之業務，租賃住宅服務業不得規避、妨礙或拒絕。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060125"}]}},{"id":"01-01-061","c":"01","t":"01-01","n":"61","q":"依租賃住宅市場發展及管理條例之規定，主管機關檢查租賃住宅服務業之業務時，得查詢或取閱其執行業務有關之紀錄及文件，應保存之年限，下列何者正確？","o":["至少7年","至少5年","至少3年","至少1年"],"a":"B","ty":"num","e":{"s":"ok","x":"施行細則第28條第2項：執行業務有關紀錄及文件應至少保存5年，故選(B)。","b":[{"k":"law","l":"租賃住宅市場發展及管理條例施行細則","r":"施行細則第28條第2項","q":"前項有關紀錄及文件，應至少保存五年，並得以電子檔案保存之。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060126"}]}},{"id":"01-01-062","c":"01","t":"01-01","n":"62","q":"依租賃住宅市場發展及管理條例之規定，非租賃住宅服務業而經營代管業務者，直轄市、縣（市）主管機關得處公司負責人、行為人罰鍰新台幣金額，下列何者正確？","o":["10,000元以上30,000元以下","30,000元以上100,000元以下","40,000元以上200,000元以下","60,000元以上200,000元以下"],"a":"C","ty":"num","ns":1,"e":{"s":"ok","x":"非租賃住宅服務業而經營代管業務者，處公司負責人、行為人等新臺幣4萬元以上20萬元以下罰鍰，故選(C)。","b":[{"k":"law","l":"租賃住宅市場發展及管理條例","r":"第36條","q":"非租賃住宅服務業而經營代管業務或包租業務者，由直轄市、縣（市）主管機關禁止其營業，並處公司負責人、商業負責人、有限合夥負責人或行為人新臺幣四萬元以上二十萬元以下罰鍰","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060125"}]}},{"id":"01-01-063","c":"01","t":"01-01","n":"63","q":"依租賃住宅市場發展及管理條例之規定，租賃住宅服務業廣告內容與事實不符，直轄市、縣（市）主管機關得處罰鍰新臺幣金額，下列何者正確？","o":["3,000元以上10,000元以下","6,000元以上60,000元以下","10,000元以上30,000元以下","10,000元以上50,000元以下"],"a":"D","ty":"num","ns":1,"e":{"s":"ok","x":"廣告內容與事實不符，屬第37條第1款，處1萬元以上5萬元以下罰鍰，故選(D)。","b":[{"k":"law","l":"租賃住宅市場發展及管理條例","r":"第37條序文","q":"處新臺幣一萬元以上五萬元以下罰鍰","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060125"},{"k":"law","l":"租賃住宅市場發展及管理條例","r":"第37條第1款","q":"一、違反第十三條第一項、第四項規定，廣告內容與事實不符或廣告未註明租賃住宅服務業名稱。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060125"}]}},{"id":"01-01-064","c":"01","t":"01-01","n":"64","q":"依租賃住宅市場發展及管理條例之規定，租賃住宅服務業廣告未註明租賃住宅服務業名稱，直轄市、縣（市）主管機關得處罰鍰新臺幣金額，下列何者正確？","o":["10,000元以上50,000元以下","10,000元以上30,000元以下","3,000元以上10,000元以下","6,000元以上60,000元以下"],"a":"A","ty":"num","ns":1,"e":{"s":"ok","x":"廣告未註明租賃住宅服務業名稱，屬第37條第1款，處1萬元以上5萬元以下罰鍰，故選(A)。","b":[{"k":"law","l":"租賃住宅市場發展及管理條例","r":"第37條序文","q":"處新臺幣一萬元以上五萬元以下罰鍰","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060125"},{"k":"law","l":"租賃住宅市場發展及管理條例","r":"第37條第1款","q":"一、違反第十三條第一項、第四項規定，廣告內容與事實不符或廣告未註明租賃住宅服務業名稱。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060125"}]}},{"id":"01-01-065","c":"01","t":"01-01","n":"65","q":"依租賃住宅市場發展及管理條例之規定，租賃住宅服務業分設營業處所未申領登記證即開始營業，直轄市、縣（市）主管機關得處罰鍰新臺幣金額，下列何者正確？","o":["6,000元以上60,000元以下","10,000元以上50,000元以下","30,000元以上60,000元以下","60,000元以上200,000元以下"],"a":"B","ty":"num","ns":1,"e":{"s":"ok","x":"分設營業處所未申領登記證即開始營業，屬第37條第2款，處1萬元以上5萬元以下罰鍰，故選(B)。","b":[{"k":"law","l":"租賃住宅市場發展及管理條例","r":"第37條序文","q":"處新臺幣一萬元以上五萬元以下罰鍰","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060125"},{"k":"law","l":"租賃住宅市場發展及管理條例","r":"第37條第2款","q":"二、違反第十九條第三項規定，分設營業處所未申領登記證即開始營業。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060125"}]}},{"id":"01-01-066","c":"01","t":"01-01","n":"66","q":"依租賃住宅市場發展及管理條例之規定，租賃住宅服務業未於期限內補足營業保證金，直轄市、縣（市）主管機關得處罰鍰新臺幣金額，下列何者正確？","o":["3,000元以上10,000元以下","6,000元以上60,000元以下","10,000元以上50,000元以下","30,000元以上60,000元以下"],"a":"C","ty":"num","ns":1,"e":{"s":"ok","x":"未於期限內補足營業保證金，屬第37條第3款，處1萬元以上5萬元以下罰鍰，故選(C)。","b":[{"k":"law","l":"租賃住宅市場發展及管理條例","r":"第37條序文","q":"處新臺幣一萬元以上五萬元以下罰鍰","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060125"},{"k":"law","l":"租賃住宅市場發展及管理條例","r":"第37條第3款","q":"三、違反第二十二條第五項規定，未於期限內補足營業保證金。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060125"}]}},{"id":"01-01-067","c":"01","t":"01-01","n":"67","q":"依租賃住宅市場發展及管理條例之規定，租賃住宅服務業僱用未具備租賃住宅管理人員資格者從事業務，直轄市、縣（市）主管機關得處罰鍰新臺幣金額，下列何者正確？","o":["60,000元以上200,000元以下","50,000元以上200,000元以下","30,000元以上100,000元以下","10,000元以上50,000元以下"],"a":"D","ty":"num","ns":1,"e":{"s":"ok","x":"僱用未具備租賃住宅管理人員資格者從事業務，屬第37條第4款，處1萬元以上5萬元以下罰鍰，故選(D)。","b":[{"k":"law","l":"租賃住宅市場發展及管理條例","r":"第37條序文","q":"處新臺幣一萬元以上五萬元以下罰鍰","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060125"},{"k":"law","l":"租賃住宅市場發展及管理條例","r":"第37條第4款","q":"四、違反第二十五條第一項規定，僱用未具備租賃住宅管理人員資格者從事業務。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060125"}]}},{"id":"01-01-068","c":"01","t":"01-01","n":"68","q":"依租賃住宅市場發展及管理條例之規定，代管業未簽訂委託管理租賃住宅契約書即執行業務，直轄市、縣（市）主管機關得處罰鍰新臺幣金額，下列何者正確？","o":["10,000元以上50,000元以下","10,000 上100,000元以下","40,000元以上200,000元以下"],"a":"D","ty":"num","ns":1,"e":{"s":"ok","x":"保全業非屬租賃住宅服務業，經營代管業務者依第36條處公司負責人等新臺幣4萬元以上20萬元以下罰鍰，故選(D)。","b":[{"k":"law","l":"租賃住宅市場發展及管理條例","r":"第36條","q":"非租賃住宅服務業而經營代管業務或包租業務者，由直轄市、縣（市）主管機關禁止其營業，並處公司負責人、商業負責人、有限合夥負責人或行為人新臺幣四萬元以上二十萬元以下罰鍰","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060125"}]}},{"id":"01-01-106","c":"01","t":"01-01","n":"106","q":"不動產經紀業未具代管業資格者，經營代管業務，依租賃住宅市場發展及管理條例之規定，直轄市、縣（市）主管機關得處公司負責人罰鍰新台幣金額，下列何者正確？","o":["40,000元以上200,000元以下","30,000元以上100,000元以下","20,000元以上50,000元以下","10,000元以上30,000元以下"],"a":"A","ty":"num","ns":1,"e":{"s":"ok","x":"不動產經紀業未具代管業資格（非租賃住宅服務業）而經營代管業務，依第36條處新臺幣4萬元以上20萬元以下罰鍰，故選(A)。","b":[{"k":"law","l":"租賃住宅市場發展及管理條例","r":"第36條","q":"非租賃住宅服務業而經營代管業務或包租業務者，由直轄市、縣（市）主管機關禁止其營業，並處公司負責人、商業負責人、有限合夥負責人或行為人新臺幣四萬元以上二十萬元以下罰鍰","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060125"}]}},{"id":"01-01-107","c":"01","t":"01-01","n":"107","q":"中華民國107年6月27日前已經營代管業務或包租業務之公司，依租賃住宅市場發展及管理條例之規定，得繼續營業期間，下列何者正確？","o":["至多半年","至多1年","至多2年","至多3年"],"a":"C","ty":"num","e":{"s":"ok","x":"依第40條第1項，本條例施行前已經營代管業務或包租業務者，自施行之日起得繼續營業2年，故選(C)。","b":[{"k":"law","l":"租賃住宅市場發展及管理條例","r":"第40條第1項","q":"本條例施行前已經營代管業務或包租業務者，自施行之日起，得繼續營業二年","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060125"}]}},{"id":"01-02-001","c":"01","t":"01-02","n":"01","q":"依租賃住宅服務業資訊提供辦法，租賃住宅代管業與委託人提前終止委託管理契約，應提供直轄市、縣（市）主管機關之資訊，下列何者正確？","o":["提前終止委管契約之違約金","提前終止委管契約書","提前終止委管契約之日期及原因","提前終止委管契約之關係人"],"a":"C","ty":"gen","e":{"s":"ok","x":"資訊提供辦法第2條第2項（簡報（倫理規範）頁43同）：代管業之受託管理契約提前終止時，應提供提前終止之日期及原因，故選(C)。","b":[{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－租賃住宅相關法規與實務（法5-1～法5-5）","r":"頁碼43（PDF第44頁）","q":"前項第二款之契約提前終止時，代管業應提供提前終止之日期及原因。"},{"k":"law","l":"租賃住宅服務業資訊提供辦法","r":"第2條第2項","q":"前項第二款之契約提前終止時，代管業應提供提前終止之日期及原因。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060131&kw=%E7%A7%9F%E8%B3%83"}],"nt":"現行條文與簡報舊版文字相同。"}},{"id":"01-02-002","c":"01","t":"01-02","n":"02","q":"依租賃住宅服務業資訊提供辦法，包租業與出租人提前終止包租契約，應提供直轄市、縣（市）主管機關之資訊，下列何者正確？","o":["提前終止包租契約之違約金","提前終止包租契約之日期及原因","提前終止包租契約書","提前終止包租契約之關係人"],"a":"B","ty":"gen","e":{"s":"ok","x":"資訊提供辦法第3條第2項（簡報（倫理規範）頁43同）：包租契約及轉租契約提前終止時，包租業應提供提前終止之日期及原因，故選(B)。","b":[{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－租賃住宅相關法規與實務（法5-1～法5-5）","r":"頁碼43（PDF第44頁）","q":"前項第二款及第三款之契約提前終止時，包租業應提供提前終止之日期及原因。"},{"k":"law","l":"租賃住宅服務業資訊提供辦法","r":"第3條第2項","q":"前項第二款及第三款之契約提前終止時，包租業應提供提前終止之日期及原因。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060131&kw=%E7%A7%9F%E8%B3%83"}],"nt":"現行條文與簡報舊版文字相同。"}},{"id":"01-02-003","c":"01","t":"01-02","n":"03","q":"租賃住宅代管業應提供之租賃住宅相關資訊，下列何者錯誤?","o":["承租人","租賃層次","租金總額","土地地號"],"a":"D","ty":"neg","e":{"s":"ok","x":"現行資訊提供辦法第2條第1項第1款規定代管業應提供之「受託管理標的租約資訊」包括承租人、租賃層次、租金總額等，並未列「土地地號」，故選(D)。","b":[{"k":"law","l":"租賃住宅服務業資訊提供辦法","r":"第2條第1項第1款","q":"一、受託管理標的租約資訊：承租人、租賃筆棟數、建物門牌、建物型態、出租型態、租賃建物之建號及面積、租賃建物現況格局、總樓層數、租賃層次、租賃契約訂約日期、租賃期間、租金總額","m":"受託管理標的租約資訊另含車位個數、車位租金總額、車位類別、面積、所在樓層、有無電梯、有無管理員、有無管理組織、附屬設備及是否為社會住宅等，均無土地（基地）地號。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060131&kw=%E7%A7%9F%E8%B3%83"}],"nt":"簡報（倫理規範頁43）所載為106年舊版第2條，代管業應提供「建物門牌、基地地號、建物型態、代管範圍及代管面積」；112-06-20修正後已無基地地號，題庫答案係依現行條文。簡報（倫理規範頁43-44）為106年訂定之舊版辦法；本辦法已於112-06-20修正，並依第6條自租賃條例第34條修正施行之日（112-09-01）施行。"}},{"id":"01-02-004","c":"01","t":"01-02","n":"04","q":"租賃住宅服務業應於訂定契約之日起幾日內，將應提供之租賃住宅相關資訊，使用電子憑證以網際網路方式提供直轄市、縣（市）主管機關?","o":["30日","5日","3日","7日"],"a":"A","ty":"num","e":{"s":"ok","x":"現行資訊提供辦法第4條第1項：租賃住宅服務業應於訂定契約之日起三十日內，將應提供之租賃住宅相關資訊，使用電子憑證以網際網路方式提供直轄市、縣（市）主管機關，故選(A)。","b":[{"k":"law","l":"租賃住宅服務業資訊提供辦法","r":"第4條第1項","q":"租賃住宅服務業應於訂定契約之日起三十日內，將前二條規定應提供之租賃住宅相關資訊，使用電子憑證以網際網路方式提供直轄市、縣（市）主管機關。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060131&kw=%E7%A7%9F%E8%B3%83"}],"nt":"簡報（倫理規範頁44）所載舊第4條為「每季結束後十五日內」提供前季資訊，已於112-06-20修正為訂約之日起三十日內（配合租賃條例第34條112-09-01施行之修正）。題目用語即現行規定。簡報（倫理規範頁43-44）為106年訂定之舊版辦法；本辦法已於112-06-20修正，並依第6條自租賃條例第34條修正施行之日（112-09-01）施行。"}},{"id":"01-02-005","c":"01","t":"01-02","n":"05","q":"租賃住宅服務業未於期限內提供相關資訊或提供不實資訊，應依本條例規定，於接獲裁處書及限期改正通知書後幾內改正?","o":["5日","10日","15日","20日"],"a":"C","ty":"num","e":{"s":"ok","x":"現行資訊提供辦法第4條第2項：租賃住宅服務業未於期限內提供相關資訊或提供不實資訊，應依條例第38條第5款規定，於接獲裁處書及限期改正通知書後十五日內改正，故選(C)。","b":[{"k":"law","l":"租賃住宅服務業資訊提供辦法","r":"第4條第2項","q":"租賃住宅服務業未於期限內提供相關資訊或提供不實資訊，應依本條例第三十八條第五款規定，於接獲裁處書及限期改正通知書後十五日內改正；屆期未改正，直轄市、縣（市）主管機關應按次處罰並限期於十五日內改正，至完成改正為止。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060131&kw=%E7%A7%9F%E8%B3%83"}],"nt":"此項為112-06-20修正新增，簡報（倫理規範頁44）舊版無此規定。"}},{"id":"01-02-006","c":"01","t":"01-02","n":"06","q":"租賃住宅服務業未於期限內提供相關資訊或提供不實資訊，經命屆期改正通知書，若仍屆期未改正，直轄市、縣（市）主管機關應按次處罰並限期於幾日內改正，至完成改正為止。","o":["5日","10日","15日","20日"],"a":"C","ty":"num","e":{"s":"ok","x":"現行資訊提供辦法第4條第2項：屆期未改正者，直轄市、縣（市）主管機關應按次處罰並限期於十五日內改正，至完成改正為止，故選(C)。","b":[{"k":"law","l":"租賃住宅服務業資訊提供辦法","r":"第4條第2項","q":"租賃住宅服務業未於期限內提供相關資訊或提供不實資訊，應依本條例第三十八條第五款規定，於接獲裁處書及限期改正通知書後十五日內改正；屆期未改正，直轄市、縣（市）主管機關應按次處罰並限期於十五日內改正，至完成改正為止。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060131&kw=%E7%A7%9F%E8%B3%83"}],"nt":"此項為112-06-20修正新增，簡報（倫理規範頁44）舊版無此規定。"}},{"id":"02-01-001","c":"02","t":"02-01","n":"1","q":"依民法之規定，租賃契約之成立的時點為何？","o":["雙方意思表示一致時","出租人將租賃物交付時","辦理公證時","辦理登記時"],"a":"A","ty":"gen","e":{"s":"ok","x":"民法第153條第1項：當事人互相表示意思一致者，無論明示或默示，契約即為成立；租賃並無應以書面為之始能成立之規定，雙方就房子、租金、租期等重要事項達成合意，租約即成立，不以交付、公證或登記為要件，故選(A)。","b":[{"k":"law","l":"民法","r":"第153條第1項","q":"當事人互相表示意思一致者，無論其為明示或默示，契約即為成立。","u":"https://mojlaw.moj.gov.tw/LawContent.aspx?LSID=FL001351&lawNumber=153&TypeSort=4"},{"k":"law","l":"民法","r":"第421條第1項","q":"稱租賃者，謂當事人約定，一方以物租與他方使用收益，他方支付租金之契約。","u":"https://mojlaw.moj.gov.tw/LawContent.aspx?LSID=FL001351&lawNumber=421&TypeSort=3"},{"k":"web","l":"「租屋為免糾紛，仍以書面立約為妥」法治宣導文章（法務部所屬機關網站 tnc.moj.gov.tw）","r":"","q":"租賃在法律上並無應以書面為之始能成立的規定，所以雙方如果對於房子、租金、租期等重要事項已經達成合意，則房屋租賃契約即可認為成立生效。","u":"https://www.tnc.moj.gov.tw/media/129010/3121517321683.pdf"}]}},{"id":"02-01-002","c":"02","t":"02-01","n":"2","q":"依民法之規定，租賃契約之性質，屬於何者?","o":["要物契約","要式契約","非典型契約","諾成契約"],"a":"D","ty":"gen","e":{"s":"ok","x":"民法第421條第1項：租賃係當事人約定一方以物租與他方使用收益、他方支付租金之契約，依第153條第1項意思表示一致即成立，不以交付租賃物（要物）或一定方式（要式）為要件，且為民法債編明定之契約類型；法律百科亦說明民法規定租賃為「諾成契約」、「不要式契約」，故選(D)。","b":[{"k":"law","l":"民法","r":"第421條第1項","q":"稱租賃者，謂當事人約定，一方以物租與他方使用收益，他方支付租金之契約。","u":"https://mojlaw.moj.gov.tw/LawContent.aspx?LSID=FL001351&lawNumber=421&TypeSort=3"},{"k":"law","l":"民法","r":"第153條第1項","q":"當事人互相表示意思一致者，無論其為明示或默示，契約即為成立。","u":"https://mojlaw.moj.gov.tw/LawContent.aspx?LSID=FL001351&lawNumber=153&TypeSort=4"},{"k":"web","l":"法律百科（Legispedia）問答：三年的土地租賃契約，未簽合約，對方也不退錢","r":"","q":"我國《民法》規定租賃為「諾成契約」、「不要式契約」，但法律有特別規定為「要式契約」者，則從其規定。","u":"https://www.legis-pedia.com/QA/question/3213"}],"nt":"民法第422條規定逾一年之不動產租賃應以字據訂立，但未以字據訂立者僅視為不定期租賃，契約仍有效。"}},{"id":"02-01-003","c":"02","t":"02-01","n":"3","q":"某甲將房屋出租與某乙，但未約定租金應付多少，依民法之規定，該租賃契約的效力為何?","o":["成立且生效","成立未生效","不成立","效力未定"],"a":"C","ty":"case","e":{"s":"ok","x":"民法第421條第1項：租賃以一方以物租與他方使用收益、他方支付租金為內容，租金為租賃契約必要之點；第153條規定當事人意思一致契約始成立（第2項僅於必要之點意思一致時推定成立），未約定租金即對必要之點未意思一致，契約不成立（臺北市政府法規委員會函亦謂對必要之點－租金意思不一致，契約似無法成立），故選(C)。","b":[{"k":"law","l":"民法","r":"第421條第1項","q":"稱租賃者，謂當事人約定，一方以物租與他方使用收益，他方支付租金之契約。","u":"https://mojlaw.moj.gov.tw/LawContent.aspx?LSID=FL001351&lawNumber=421&TypeSort=3"},{"k":"law","l":"民法","r":"第153條第2項","q":"當事人對於必要之點，意思一致，而對於非必要之點，未經表示意思者，推定其契約為成立，關於該非必要之點，當事人意思不一致時，法院應依其事件之性質定之。","u":"https://mojlaw.moj.gov.tw/LawContent.aspx?LSID=FL001351&lawNumber=153&TypeSort=4"},{"k":"web","l":"臺北市政府法規委員會95.06.14北市法三字第09531603000號函","r":"","q":"當事人對於必要之點 -租金，意思不一致，契約似無法成立","m":"個案（土地租賃租金調整）函釋，引民法第153條說明租金為租賃契約必要之點，未意思一致則契約無法成立。","u":"https://laws.gov.taipei/Law/Interpretation/Content/FE001166"}]}},{"id":"02-01-004","c":"02","t":"02-01","n":"4","q":"某甲口頭約定將房屋出租與某乙，並經雙方合意，但某乙卻遲遲未支付租金與擔保金，依民法之規定，該租賃契約的效力為何?","o":["成立且生效","成立未生效","不成立","效力未定"],"a":"A","ty":"case","e":{"s":"ok","x":"民法第153條第1項：意思表示一致契約即成立；租賃並無應以書面為之始能成立之規定，雙方就重要事項達成合意即可認為成立生效；支付租金係契約成立後承租人依第439條應履行之義務，未付租金及擔保金不影響契約之成立與生效，故選(A)。","b":[{"k":"law","l":"民法","r":"第153條第1項","q":"當事人互相表示意思一致者，無論其為明示或默示，契約即為成立。","u":"https://mojlaw.moj.gov.tw/LawContent.aspx?LSID=FL001351&lawNumber=153&TypeSort=4"},{"k":"web","l":"「租屋為免糾紛，仍以書面立約為妥」法治宣導文章（法務部所屬機關網站 tnc.moj.gov.tw）","r":"","q":"租賃在法律上並無應以書面為之始能成立的規定，所以雙方如果對於房子、租金、租期等重要事項已經達成合意，則房屋租賃契約即可認為成立生效。","u":"https://www.tnc.moj.gov.tw/media/129010/3121517321683.pdf"},{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－租賃住宅相關法規與實務（法5-1～法5-5）","r":"頁碼69（PDF第70頁）","q":"承租人應依約定日期，支付租金。"}]}},{"id":"02-01-005","c":"02","t":"02-01","n":"5","q":"依民法之規定，某乙向某甲表達承租房屋之要約，經數次書信往返的洽商，某甲認為已經達到可以簽約的程度，但在發出承諾簽約之通知前，卻收到某乙已先發函向某甲表達不租的意思表示，試問，該租賃契約有無成立?","o":["成立","未生效","因要約撤回先時到達而失效","效力未定"],"a":"C","ty":"case","e":{"s":"unclear","x":"","b":[{"k":"law","l":"民法","r":"第95條第1項","q":"非對話而為意思表示者，其意思表示，以通知達到相對人時，發生效力。但撤回之通知，同時或先時到達者，不在此限。","u":"https://mojlaw.moj.gov.tw/LawContent.aspx?LSID=FL001351&lawNumber=86&TypeSort=3"},{"k":"law","l":"民法","r":"第154條第1項","q":"契約之要約人，因要約而受拘束。但要約當時預先聲明不受拘束，或依其情形或事件之性質，可認當事人無受其拘束之意思者，不在此限。","u":"https://mojlaw.moj.gov.tw/LawContent.aspx?LSID=FL001351&lawNumber=153&TypeSort=4"},{"k":"law","l":"民法","r":"第155條","q":"要約經拒絕者，失其拘束力。","u":"https://mojlaw.moj.gov.tw/LawContent.aspx?LSID=FL001351&lawNumber=153&TypeSort=4"}],"f":"簡報（倫理規範頁66-70民法摘錄）未涉要約、承諾及撤回。民法第95條第1項但書僅於「撤回之通知同時或先時到達」（相對於該意思表示）時使意思表示不生效力；第154條第1項規定要約人因要約而受拘束。題目情境為乙之要約已到達甲並經數次書信往返後才發函表示不租，依條文此時已非「撤回先時到達」，要約原則上仍拘束乙（或往返洽商中之新要約另依第155條因拒絕而失效）；甲尚未承諾故契約未成立固無疑，但題庫答案(C)「因要約撤回先時到達而失效」之理由與條文不盡相符，無法明確支持。"}},{"id":"02-01-006","c":"02","t":"02-01","n":"6","q":"依民法之規定，某甲之妻某乙擬將某甲的房屋委託代管業代為管理，但某甲疑似有精神障礙或其他心智缺陷，致不能為意思表示或受意思表示已經法院為監護之宣告，試問，應該由誰與代管業簽訂契約？","o":["由監護人代為簽約","由某甲簽約，應經輔助人同意","由某甲簽約","由某乙簽約"],"a":"A","ty":"neg","e":{"s":"ok","x":"民法第15條：受監護宣告之人無行為能力；第76條：無行為能力人由法定代理人代為意思表示；第1110條受監護宣告之人應置監護人，依第1113條準用第1098條第1項，監護人為受監護人之法定代理人，故應由監護人代為簽約，故選(A)。","b":[{"k":"law","l":"民法","r":"第15條","q":"受監護宣告之人，無行為能力。","u":"https://mojlaw.moj.gov.tw/LawContent.aspx?LSID=FL001351&lawNumber=6&TypeSort=3"},{"k":"law","l":"民法","r":"第76條","q":"無行為能力人由法定代理人代為意思表示，並代受意思表示。","u":"https://mojlaw.moj.gov.tw/LawContent.aspx?LSID=FL001351&lawNumber=75&TypeSort=3"},{"k":"law","l":"民法","r":"第1110條","q":"受監護宣告之人應置監護人。","u":"https://mojlaw.moj.gov.tw/LawContent.aspx?LSID=FL001351&lawNumber=1110&TypeSort=3"},{"k":"law","l":"民法","r":"第1113條","q":"成年人之監護，除本節有規定者外，準用關於未成年人監護之規定。","u":"https://mojlaw.moj.gov.tw/LawContent.aspx?LSID=FL001351&lawNumber=1110&TypeSort=3"},{"k":"law","l":"民法","r":"第1098條第1項","q":"監護人於監護權限內，為受監護人之法定代理人。","u":"https://mojlaw.moj.gov.tw/LawContent.aspx?LSID=FL001351&lawNumber=1091&TypeSort=3"}]}},{"id":"02-01-007","c":"02","t":"02-01","n":"7","q":"依民法之規定，某甲家人擬將某甲的房屋委託代管業代為管理，但某甲疑似有精神障礙或其他心智缺陷，致不能為意思表示或受意思表示之虞，但法院僅裁定為輔助之宣告，試問，應該由誰與代管業簽訂契約？","o":["甲之父母","某甲簽約，應經輔助人同意","某甲簽約即可","某甲的配偶"],"a":"B","ty":"neg","e":{"s":"ok","x":"民法第15條之2第1項第5款：受輔助宣告之人為不動產等重要財產之處分、設定負擔、買賣、租賃或借貸時，應經輔助人同意；受輔助宣告之人係由本人為法律行為、僅須得輔助人同意（與受監護宣告之人由監護人代為不同），父母或配偶並無代簽權限，故選(B)。","b":[{"k":"law","l":"民法","r":"第15條之2第1項","q":"受輔助宣告之人為下列行為時，應經輔助人同意。但純獲法律上利益，或依其年齡及身分、日常生活所必需者，不在此限：","u":"https://mojlaw.moj.gov.tw/LawContent.aspx?LSID=FL001351&lawNumber=6&TypeSort=3"},{"k":"law","l":"民法","r":"第15條之2第1項第5款","q":"為不動產、船舶、航空器、汽車或其他重要財產之處分、設定負擔、買賣、租賃或借貸。","u":"https://mojlaw.moj.gov.tw/LawContent.aspx?LSID=FL001351&lawNumber=6&TypeSort=3"},{"k":"law","l":"民法","r":"第1113條之1第1項","q":"受輔助宣告之人，應置輔助人。","u":"https://mojlaw.moj.gov.tw/LawContent.aspx?LSID=FL001351&lawNumber=1110&TypeSort=3"}],"nt":"委託代管係為將房屋出租，屬第15條之2第1項第5款所列不動產租賃相關之重要財產行為；如未能涵蓋，法院亦得依同項第7款指定應經同意之行為。"}},{"id":"02-01-008","c":"02","t":"02-01","n":"8","q":"依民法之規定，某甲是經法院裁定為監護宣告或輔助之宣告之人，試問，某甲擬將房屋出租，簽訂契約時應檢附甚麼證件，下列之敘述何者為正確？","o":["監護宣告或輔助宣告裁定書","判決確定證明","印鑑證明與印鑑章相符即可","經法院公證即可"],"a":"A","ty":"case","e":{"s":"not_found","x":"","b":[],"f":"簡報（倫理規範頁12、66-71；糾紛處理頁19-21身分確認、頁48-52篩選房客與公證應備文件）僅提及確認身分、未成年人應得法定代理人同意、公證時應備身分證、印章、授權書、印鑑證明等，未提及受監護或輔助宣告人簽約應檢附裁定書；民法第14條至第15條之2、第1110條、第1113條之1僅規定宣告與監護人／輔助人之設置，未規定簽約應附文件；網路搜尋（法律百科、內政部國土管理署租屋服務事業注意事項等）亦未找到說明應檢附「監護宣告或輔助宣告裁定書」之官方資料。"}},{"id":"02-01-009","c":"02","t":"02-01","n":"9","q":"依民法之規定，某甲是所有權人，授權某乙為代理人，委託仲介公司某丙居間媒合，將房屋出租與丁，依民法之規定，應該以誰的名義為出租人?","o":["甲","乙","丙","視授權契約而定"],"a":"A","ty":"case","e":{"s":"ok","x":"民法第103條第1項：代理人於代理權限內，以本人名義所為之意思表示，直接對本人發生效力；乙為甲之代理人、丙僅受託居間媒合，租賃契約應以本人即所有權人甲之名義為出租人，故選(A)。","b":[{"k":"law","l":"民法","r":"第103條第1項","q":"代理人於代理權限內，以本人名義所為之意思表示，直接對本人發生效力。","u":"https://mojlaw.moj.gov.tw/LawContent.aspx?LSID=FL001351&lawNumber=103&TypeSort=3"}]}},{"id":"02-01-010","c":"02","t":"02-01","n":"10","q":"依民法之規定，某甲想承租房屋，對方不是房屋所有權人，卻自稱已獲得授權之代理人，試問，某甲要簽租賃契約前，最好要求該代理人檢附何種證明文件以證實其代理權?","o":["口頭即為有效","一般授權書","授權書經公證","檢附印鑑證明"],"a":"C","ty":"neg","e":{"s":"unclear","x":"","b":[{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－租賃管理與糾紛實務（實2-1～實2-2）","r":"頁碼52（PDF第53頁）","q":"授權書(房東親自簽名並蓋"},{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－租賃管理與糾紛實務（實2-1～實2-2）","r":"頁碼52（PDF第53頁）","q":"2.房東印鑑證明一份"},{"k":"web","l":"第二期租屋服務事業辦理承租民間住宅並轉租或媒合承出租及其他服務注意事項（內政部108-04-18內授營土字第1080806953號函訂定）","r":"說明","q":"如出租人因故無法親自與租屋服務事業或承租人簽訂租賃契約，得授權代理人檢附出租人之印鑑證明代為簽約。","u":"https://www.nlma.gov.tw/uploads/files/b0bd53cba25febb3d25599daa9091931.pdf"}],"f":"簡報（糾紛處理頁51-52公證請求手續）僅列授權第三人代辦時應備「授權書（房東親自簽名並蓋印鑑章）」及「房東印鑑證明」；內政部108年租屋服務事業注意事項亦稱出租人得授權代理人檢附出租人之印鑑證明代為簽約；民法第103條僅規定代理效力。均未見以「授權書經公證」為證實代理權最佳文件之依據，現有資料反較接近選項(D)，無法明確支持題庫答案(C)。"}},{"id":"02-01-011","c":"02","t":"02-01","n":"11","q":"依民法之規定，代管業者之代管期間屆滿未即時返還租賃房屋，構成無因管理，且違反本人明示或可得推知之意思時，如對於委託人發生損害，是否應負賠償責任?","o":["有過失，即應負責賠償","有重大過失，應負責賠償","有故意，才要賠償","雖無過失，亦應負責賠償"],"a":"D","ty":"gen","e":{"s":"ok","x":"民法第174條第1項：管理人違反本人明示或可得推知之意思，而為事務之管理者，對於因其管理所生之損害，雖無過失，亦應負賠償之責，故選(D)。","b":[{"k":"law","l":"民法","r":"第174條第1項","q":"管理人違反本人明示或可得推知之意思，而為事務之管理者，對於因其管理所生之損害，雖無過失，亦應負賠償之責。","u":"https://mojlaw.moj.gov.tw/LawContent.aspx?LSID=FL001351&lawNumber=172&TypeSort=4"}]}},{"id":"02-01-012","c":"02","t":"02-01","n":"12","q":"依民法規定，租賃契約簽訂前支付定金，與租賃契約有何關聯?","o":["推定其契約成立","視為其契約成立","確定其契約成立","推定其契約生效"],"a":"A","ty":"gen","e":{"s":"ok","x":"民法第248條（簡報（倫理規範）頁66）：訂約當事人之一方，由他方受有定金時，推定其契約成立，故選(A)。","b":[{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－租賃住宅相關法規與實務（法5-1～法5-5）","r":"頁碼66（PDF第67頁）","q":"訂約當事人之一方，由他方受有定金時，推定其契約成立。"},{"k":"law","l":"民法","r":"第248條","q":"訂約當事人之一方，由他方受有定金時，推定其契約成立。","u":"https://mojlaw.moj.gov.tw/LawContent.aspx?LSID=FL001351&lawNumber=245-1&TypeSort=4"}]}},{"id":"02-01-013","c":"02","t":"02-01","n":"13","q":"依民法之規定，某甲擬將整棟房屋租給專業的的包租業者某乙，竟刻意隱匿該屋曾經發生火災致死事件，雖然某乙在簽約前獲知此事，導致簽約不成，試問，某乙為準備事前調查及商議訂約，並預為準備進行包租作業等損害，可否向甲請求賠償?","o":["不可，契約未成立","可以，甲應負責","非消費關係，甲不需負責","包租業自應負調查責任，甲不需負責"],"a":"B","ty":"case","e":{"s":"ok","x":"民法第245條之1第1項第1款：契約未成立時，當事人為準備或商議訂立契約，就訂約有重要關係之事項惡意隱匿或為不實說明者，對於非因過失而信契約能成立致受損害之他方負賠償責任（締約上過失）；甲刻意隱匿凶宅事實致簽約不成，乙得請求賠償，故選(B)。","b":[{"k":"law","l":"民法","r":"第245條之1第1項","q":"契約未成立時，當事人為準備或商議訂立契約而有左列情形之一者，對於非因過失而信契約能成立致受損害之他方當事人，負賠償責任：","u":"https://mojlaw.moj.gov.tw/LawContent.aspx?LSID=FL001351&lawNumber=245-1&TypeSort=4"},{"k":"law","l":"民法","r":"第245條之1第1項第1款","q":"一、就訂約有重要關係之事項，對他方之詢問，惡意隱匿或為不實之說明者。","u":"https://mojlaw.moj.gov.tw/LawContent.aspx?LSID=FL001351&lawNumber=245-1&TypeSort=4"},{"k":"law","l":"民法","r":"第245條之1第1項第3款","q":"其他顯然違反誠實及信用方法者。","u":"https://mojlaw.moj.gov.tw/LawContent.aspx?LSID=FL001351&lawNumber=245-1&TypeSort=4"}],"nt":"第1款文義以「對他方之詢問」惡意隱匿為要件；題目未述及詢問，另可依第3款「其他顯然違反誠實及信用方法者」說明。"}},{"id":"02-01-014","c":"02","t":"02-01","n":"14","q":"依民法之規定，從事租賃管理服務的代管業某甲，於簽訂受託代管契約之前，出租人特別交代，將來的租金全部作為支付小三作生活費，並要求某甲保密，嗣後因條件談不攏無法簽約，但因某甲僱員不慎洩漏上述秘密，試問，某乙可否向甲請求賠償?","o":["不可，契約未成立","屬準備或商議訂約致所受損害，甲應該負責","非消費關係，甲不需負責","需經妨礙秘密罪判決確定，甲才需負責"],"a":"B","ty":"case","e":{"s":"ok","x":"民法第245條之1第1項第2款：契約未成立時，當事人為準備或商議訂約而知悉他方之秘密，經他方明示應予保密，而因故意或重大過失洩漏者，對他方負賠償責任；此責任以契約未成立為前提，不以消費關係或刑事判決確定為要件，故選(B)。","b":[{"k":"law","l":"民法","r":"第245條之1第1項","q":"契約未成立時，當事人為準備或商議訂立契約而有左列情形之一者，對於非因過失而信契約能成立致受損害之他方當事人，負賠償責任：","u":"https://mojlaw.moj.gov.tw/LawContent.aspx?LSID=FL001351&lawNumber=245-1&TypeSort=4"},{"k":"law","l":"民法","r":"第245條之1第1項第2款","q":"二、知悉或持有他方之秘密，經他方明示應予保密，而因故意或重大過失洩漏之者。","u":"https://mojlaw.moj.gov.tw/LawContent.aspx?LSID=FL001351&lawNumber=245-1&TypeSort=4"}],"nt":"第2款以「故意或重大過失」洩漏為要件，題目稱「僱員不慎洩漏」，題庫答案係以本條為據。題目末句「某乙」應指出租人。"}},{"id":"02-01-015","c":"02","t":"02-01","n":"15","q":"依民法之規定，包租業為訂定包租契約而預先擬訂之契約條款，有以下何種情形，該部分約定，仍為有效?","o":["免除或減輕包租業責任者","使拋棄權利或限制其行使權利者","加重出租人之責任者","租賃期間不得任意終止"],"a":"D","ty":"gen","e":{"s":"ok","x":"民法第247條之1：依當事人一方預定用於同類契約之條款而訂定之契約，約定免除或減輕預定條款當事人之責任、加重他方當事人之責任、使他方當事人拋棄權利或限制其行使權利，按其情形顯失公平者，該部分約定無效；選項(A)(B)(C)即屬該條所列情形，「租賃期間不得任意終止」則不在其列，仍為有效，故選(D)。","b":[{"k":"law","l":"民法","r":"第247條之1","q":"依照當事人一方預定用於同類契約之條款而訂定之契約，為左列各款之約定，按其情形顯失公平者，該部分約定無效：","m":"各款為：一、免除或減輕預定契約條款之當事人之責任者；二、加重他方當事人之責任者；三、使他方當事人拋棄權利或限制其行使權利者；四、其他於他方當事人有重大不利益者。","u":"https://mojlaw.moj.gov.tw/LawContent.aspx?LSID=FL001351&lawNumber=245-1&TypeSort=4"},{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－租賃住宅相關法規與實務（法5-1～法5-5）","r":"頁碼70（PDF第71頁）","q":"租賃定有期限者，其租賃關係，於期限屆滿時消滅。"}],"nt":"定期租賃依民法第450條第1項於期限屆滿時消滅，約定租期內不得任意終止與民法規定相符。"}},{"id":"02-01-016","c":"02","t":"02-01","n":"16","q":"依民法之規定，某甲簽訂租賃契約後，發現所租的房屋有嚴重瑕疵，想要向出租人表達不租該房屋的意思，該用什麼方式，才可以使該租賃契約溯及簽訂時失其效力?","o":["終止契約","撤銷契約","解除契約","撤回契約"],"a":"C","ty":"case","e":{"s":"ok","x":"民法第347條：買賣之規定於買賣以外之有償契約準用之；第359條：物有瑕疵而出賣人應負擔保責任者，買受人得解除契約；第259條：契約解除時，當事人雙方負回復原狀之義務，即契約效力溯及消滅；終止依第263條僅準用第258、260條而無回復原狀，僅向將來失效，故選(C)。","b":[{"k":"law","l":"民法","r":"第347條","q":"本節規定，於買賣契約以外之有償契約準用之。但為其契約性質所不許者，不在此限。","u":"https://mojlaw.moj.gov.tw/LawContent.aspx?LSID=FL001351&lawNumber=345&TypeSort=3"},{"k":"law","l":"民法","r":"第359條","q":"買賣因物有瑕疵，而出賣人依前五條之規定，應負擔保之責者，買受人得解除其契約或請求減少其價金。但依情形，解除契約顯失公平者，買受人僅得請求減少價金。","u":"https://mojlaw.moj.gov.tw/LawContent.aspx?LSID=FL001351&lawNumber=345&TypeSort=3"},{"k":"law","l":"民法","r":"第259條","q":"契約解除時，當事人雙方回復原狀之義務，除法律另有規定或契約另有訂定外，依左列之規定：","u":"https://mojlaw.moj.gov.tw/LawContent.aspx?LSID=FL001351&lawNumber=245-1&TypeSort=4"},{"k":"law","l":"民法","r":"第263條","q":"第二百五十八條及第二百六十條之規定，於當事人依法律之規定終止契約者準用之。","u":"https://mojlaw.moj.gov.tw/LawContent.aspx?LSID=FL001351&lawNumber=245-1&TypeSort=4"}],"nt":"民法條文未直接使用「溯及」二字，係以第259條回復原狀說明解除之溯及效力。撤銷依第114條第1項亦「視為自始無效」，惟須有第88條（錯誤）、第92條（詐欺、脅迫）等撤銷意思表示之原因；就租賃物之瑕疵，民法所定救濟為解除契約（第347條準用第359條）或依第424條終止。"}},{"id":"02-01-017","c":"02","t":"02-01","n":"17","q":"依民法之規定，某甲以口頭約定向某乙承租房屋，除言明每月租金多寡外，並為約定租金應如何支付，試問，某甲應付之租金，應以何地為清償地?","o":["租賃房屋所在地","承租人之承租前之住所地","出租人營業處所","出租人之住所地"],"a":"A","ty":"case","e":{"s":"unclear","x":"","b":[{"k":"law","l":"民法","r":"第314條","q":"清償地，除法律另有規定或契約另有訂定，或另有習慣，或得依債之性質或其他情形決定者外，應依左列各款之規定：","m":"第1款：以給付特定物為標的者，於訂約時其物所在地為之；第2款：其他之債，於債權人之住所地為之。","u":"https://mojlaw.moj.gov.tw/LawContent.aspx?LSID=FL001351&lawNumber=309&TypeSort=4"},{"k":"law","l":"民法","r":"第314條第2款","q":"二、其他之債，於債權人之住所地為之。","u":"https://mojlaw.moj.gov.tw/LawContent.aspx?LSID=FL001351&lawNumber=309&TypeSort=4"}],"f":"簡報（倫理規範頁66-70）未涉清償地。民法第314條：清償地除法律另有規定、契約另有訂定、另有習慣或得依債之性質或其他情形決定者外，給付特定物者於訂約時其物所在地、其他之債於債權人住所地為之。租金為金錢債務，依第2款應於債權人（出租人）之住所地清償，與選項(D)相符，與題庫答案(A)「租賃房屋所在地」不符；未查得以租賃物所在地為租金清償地之法規、函釋或習慣依據。題目「並為約定」疑為「並未約定」之誤。"}},{"id":"02-01-018","c":"02","t":"02-01","n":"18","q":"依民法之規定，未訂立字據的不動產租賃契約，其約定租賃期限，只要超過多久以上者，即依法視為不定期限之租賃？","o":["逾10年","逾5年","逾3年","逾1年"],"a":"D","ty":"num","e":{"s":"ok","x":"民法第422條（簡報（倫理規範）頁66）：不動產之租賃契約，其期限逾一年者，應以字據訂立之，未以字據訂立者，視為不定期限之租賃，故選(D)。","b":[{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－租賃住宅相關法規與實務（法5-1～法5-5）","r":"頁碼66（PDF第67頁）","q":"不動產之租賃契約，其期限逾一年者，應以字據訂立之，未以字據訂立者，視為不定期限之租賃。"},{"k":"law","l":"民法","r":"第422條","q":"不動產之租賃契約，其期限逾一年者，應以字據訂立之，未以字據訂立者，視為不定期限之租賃。","u":"https://mojlaw.moj.gov.tw/LawContent.aspx?LSID=FL001351&lawNumber=421&TypeSort=3"}]}},{"id":"02-01-019","c":"02","t":"02-01","n":"19","q":"依民法之規定，出租人以違章建築並違規隔間後經承租人合意訂定租賃契約，該租賃契約是否合法?","o":["不合法","須經主管機關許可使用","合法","須具有適居性，才合法"],"a":"C","ty":"gen","e":{"s":"ok","x":"民法第421條第1項：租賃為當事人約定一方以物租與他方使用收益、他方支付租金之契約；法律百科說明違章建築雖未經政府核可，性質仍為建築物，有權處分之人確實可將其出租，未被舉報、拆除前租賃契約仍有效存在，故雙方合意訂定之租約為合法有效，故選(C)。","b":[{"k":"law","l":"民法","r":"第421條第1項","q":"稱租賃者，謂當事人約定，一方以物租與他方使用收益，他方支付租金之契約。","u":"https://mojlaw.moj.gov.tw/LawContent.aspx?LSID=FL001351&lawNumber=421&TypeSort=3"},{"k":"web","l":"法律百科（Legispedia）文章：違章建築可以出租嗎？房東、房客要注意什麼事項？","r":"","q":"有權處分違章建築的人（除了原始起造人，也包含之後透過買賣、繼承等方式取得事實上處分權的人），確實可以將違章建築出租。","m":"違章建築性質仍為建築物；未被舉報、拆除前，租賃契約仍有效存在。","u":"https://www.legis-pedia.com/article/878/pdf"}]}},{"id":"02-01-020","c":"02","t":"02-01","n":"20","q":"依民法之規定，承租人於租賃期間發現該租賃物屬於俗稱的輻射屋，出租人雖於訂約時已告知該瑕疵，但承租人嗣後恐危及自己或家人之安全或健康時，試問，承租人可以作何主張？","o":["請求降低租金","解除契約","請求違約金及損害賠償","終止契約"],"a":"D","ty":"gen","e":{"s":"ok","x":"民法第424條（簡報（倫理規範）頁66）：租賃物為房屋，如有瑕疵危及承租人或其同居人之安全或健康時，承租人雖於訂約時已知其瑕疵，或已拋棄終止契約之權利，仍得終止契約，故選(D)。","b":[{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－租賃住宅相關法規與實務（法5-1～法5-5）","r":"頁碼66（PDF第67頁）","q":"租賃物為房屋或其他供居住之處所者，如有瑕疵，危及承租人或其同居人之安全或健康時，承租人雖於訂約時已知其瑕疵，或已拋棄其終止契約之權利，仍得終止契約。"},{"k":"law","l":"民法","r":"第424條","q":"租賃物為房屋或其他供居住之處所者，如有瑕疵，危及承租人或其同居人之安全或健康時，承租人雖於訂約時已知其瑕疵，或已拋棄其終止契約之權利，仍得終止契約。","u":"https://mojlaw.moj.gov.tw/LawContent.aspx?LSID=FL001351&lawNumber=421&TypeSort=3"}]}},{"id":"02-01-021","c":"02","t":"02-01","n":"21","q":"依民法之規定，出租人將不動產出租於承租人，且期間未逾五年，不動產交付後，出租人卻將其所有權讓與第三人，對承租人之影響如何？","o":["租賃契約同時終止","承租人可主張優先購權","租賃契約對於受讓人仍繼續存在","經受讓人同意始可繼續存在"],"a":"C","ty":"gen","e":{"s":"ok","x":"民法第425條第1項（簡報（倫理規範）頁67）：出租人於租賃物交付後，承租人占有中，縱將其所有權讓與第三人，其租賃契約對於受讓人仍繼續存在（買賣不破租賃）；本題租期未逾五年，不受同條第2項排除，故選(C)。","b":[{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－租賃住宅相關法規與實務（法5-1～法5-5）","r":"頁碼67（PDF第68頁）","q":"出租人於租賃物交付後，縱將其所有權讓與第三人，其租賃契約，對於受讓人，仍繼續存在。"},{"k":"law","l":"民法","r":"第425條第1項","q":"出租人於租賃物交付後，承租人占有中，縱將其所有權讓與第三人，其租賃契約，對於受讓人仍繼續存在。","u":"https://mojlaw.moj.gov.tw/LawContent.aspx?LSID=FL001351&lawNumber=421&TypeSort=3"},{"k":"law","l":"民法","r":"第425條第2項","q":"前項規定，於未經公證之不動產租賃契約，其期限逾五年或未定期限者，不適用之。","u":"https://mojlaw.moj.gov.tw/LawContent.aspx?LSID=FL001351&lawNumber=421&TypeSort=3"}],"nt":"簡報（倫理規範頁67）所載第425條第1項漏列「承租人占有中」要件，現行條文如上。"}},{"id":"02-01-022","c":"02","t":"02-01","n":"22","q":"依民法之規定，出租人與承租人訂定五年以上或未定期限租賃契約，將其所有權讓與第三人，該租賃契約在何種情形下，不得適用買賣不破租賃之規定？","o":["未經公證","未經認證","未經律師見證","未經地政士簽證"],"a":"A","ty":"neg","e":{"s":"ok","x":"民法第425條第2項（簡報（倫理規範）頁67）：買賣不破租賃之規定，於未經公證之不動產租賃契約，其期限逾五年或未定期限者，不適用之，故選(A)。","b":[{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－租賃住宅相關法規與實務（法5-1～法5-5）","r":"頁碼67（PDF第68頁）","q":"前項規定，於未經公證之不動產租賃契約，其期限逾五年或未定期限者，不適用之。"},{"k":"law","l":"民法","r":"第425條第2項","q":"前項規定，於未經公證之不動產租賃契約，其期限逾五年或未定期限者，不適用之。","u":"https://mojlaw.moj.gov.tw/LawContent.aspx?LSID=FL001351&lawNumber=421&TypeSort=3"}],"nt":"題目稱「五年以上」，條文為「逾五年」。"}},{"id":"02-01-023","c":"02","t":"02-01","n":"23","q":"依民法之規定，下列何種情形，在租賃關係存續中，承租人不得以「買賣不破租賃」主張該租賃契約仍繼續存在?","o":["租賃房屋未交付前出租人已移轉房屋所有權","未經公證超過5年的定期租賃契約","不定期租賃契約","承租房屋交付後，出租人移轉房屋所有權"],"a":"A","ty":"neg","e":{"s":"unclear","x":"","b":[{"k":"law","l":"民法","r":"第425條第1項","q":"出租人於租賃物交付後，承租人占有中，縱將其所有權讓與第三人，其租賃契約，對於受讓人仍繼續存在。","u":"https://mojlaw.moj.gov.tw/LawContent.aspx?LSID=FL001351&lawNumber=421&TypeSort=3"},{"k":"law","l":"民法","r":"第425條第2項","q":"前項規定，於未經公證之不動產租賃契約，其期限逾五年或未定期限者，不適用之。","u":"https://mojlaw.moj.gov.tw/LawContent.aspx?LSID=FL001351&lawNumber=421&TypeSort=3"}],"f":"民法第425條第1項以「租賃物交付後、承租人占有中」為要件，選項(A)租賃房屋未交付前已移轉所有權，固不得主張買賣不破租賃；但同條第2項規定未經公證之不動產租賃契約期限逾五年或未定期限者不適用之，選項(B)「未經公證超過5年的定期租賃契約」同樣不得主張（選項(C)不定期租賃若未經公證亦同）。依條文本題有多個選項符合題意，無法僅說明(A)為唯一正確答案。"}},{"id":"02-01-024","c":"02","t":"02-01","n":"24","q":"某甲擬將房屋出租，擔心租期屆滿後，房屋返還發生糾紛，簽訂租賃契約時應尋求甚麼保障，較實惠又安全?","o":["辦理履約保證","投保履約保險","得逕付強制執行的公證","要求增加保證人"],"a":"C","ty":"case","e":{"s":"ok","x":"公證法第13條第1項第3款：租用建築物定有期限並應於期限屆滿時交還者，公證書載明應逕受強制執行時，得依該證書執行；簡報（糾紛處理）頁20：租約已公證，房客到期不搬時即可立刻請法院強制執行，節省很多時間與成本，故選(C)。","b":[{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－租賃管理與糾紛實務（實2-1～實2-2）","r":"頁碼20（PDF第21頁）","q":"若租約已進行公證，即可立刻請法院強制執行，請房客遷出，節省很多時間與成本。"},{"k":"law","l":"公證法","r":"第13條第1項第3款","q":"三、租用或借用建築物或其他工作物，定有期限並應於期限屆滿時交還者。","m":"第13條第1項本文：當事人請求公證人就所列法律行為作成之公證書，載明應逕受強制執行者，得依該證書執行之。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=B0010010"}]}},{"id":"02-01-025","c":"02","t":"02-01","n":"25","q":"依民法之規定，租賃期間內的相關稅費負擔規定，下列敘述何者正確？","o":["房屋稅、地價稅由出租人負擔","一切稅捐，由承租人負擔","修繕義務由承租人負擔","出租人必要之保存行為，費用由承租人負擔"],"a":"A","ty":"gen","e":{"s":"ok","x":"民法第427條（簡報（倫理規範）頁67）：就租賃物應納之一切稅捐，由出租人負擔，房屋稅、地價稅即由出租人負擔；第429條修繕原則上亦由出租人負擔，故選(A)。","b":[{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－租賃住宅相關法規與實務（法5-1～法5-5）","r":"頁碼67（PDF第68頁）","q":"就租賃物應納之一切稅捐，由出租人負擔。"},{"k":"law","l":"民法","r":"第427條","q":"就租賃物應納之一切稅捐，由出租人負擔。","u":"https://mojlaw.moj.gov.tw/LawContent.aspx?LSID=FL001351&lawNumber=421&TypeSort=3"},{"k":"law","l":"民法","r":"第429條第1項","q":"租賃物之修繕，除契約另有訂定或另有習慣外，由出租人負擔。","u":"https://mojlaw.moj.gov.tw/LawContent.aspx?LSID=FL001351&lawNumber=421&TypeSort=3"}]}},{"id":"02-01-026","c":"02","t":"02-01","n":"26","q":"依民法之規定，租賃房屋之修繕義務，原則上由何者負擔?","o":["承租人修繕","出租人負擔","雙方共同負擔","自然耗損，由出租人負擔"],"a":"B","ty":"gen","e":{"s":"ok","x":"民法第429條第1項（簡報（倫理規範）頁67）：租賃物之修繕，除契約另有訂定或另有習慣外，由出租人負擔，故選(B)。","b":[{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－租賃住宅相關法規與實務（法5-1～法5-5）","r":"頁碼67（PDF第68頁）","q":"租賃物之修繕，除契約另有訂定或另有習慣外，由出租人負擔"},{"k":"law","l":"民法","r":"第429條第1項","q":"租賃物之修繕，除契約另有訂定或另有習慣外，由出租人負擔。","u":"https://mojlaw.moj.gov.tw/LawContent.aspx?LSID=FL001351&lawNumber=421&TypeSort=3"}]}},{"id":"02-01-027","c":"02","t":"02-01","n":"27","q":"承租人於租賃房屋中增設隔間並裝設空調設備，出租人知情且不反對，租期屆滿時，出租人應該如何償還？","o":["無需償還","以增設時之價額償還","以現存之價額償還","要求取回，並回復原狀"],"a":"C","ty":"gen","e":{"s":"ok","x":"民法第431條第1項（簡報（倫理規範）頁68）：承租人就租賃物支出有益費用，因而增加該物之價值，出租人知其情事而不為反對之表示者，於租賃關係終止時應償還其費用，但以其現存之增價額為限，故選(C)。","b":[{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－租賃住宅相關法規與實務（法5-1～法5-5）","r":"頁碼68（PDF第69頁）","q":"如出租人知其情事而不為反對之表示，於租賃關係終止時，應償還其費用，但以其現存之增價額為限。"},{"k":"law","l":"民法","r":"第431條第1項","q":"承租人就租賃物支出有益費用，因而增加該物之價值者，如出租人知其情事而不為反對之表示，於租賃關係終止時，應償還其費用。但以其現存之增價額為限。","u":"https://mojlaw.moj.gov.tw/LawContent.aspx?LSID=FL001351&lawNumber=421&TypeSort=3"}]}},{"id":"02-01-028","c":"02","t":"02-01","n":"28","q":"依民法規定，承租人在租賃期間使用租賃房屋時，應負有何種程度的注意義務？","o":["應盡普通人之注意","應盡與處理自己事務為同一之注意","應盡善良管理人之注意","應盡企業經營者之注意"],"a":"C","ty":"gen","e":{"s":"ok","x":"民法第432條第1項（簡報（倫理規範）頁68）：承租人應以善良管理人之注意，保管租賃物，故選(C)。","b":[{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－租賃住宅相關法規與實務（法5-1～法5-5）","r":"頁碼68（PDF第69頁）","q":"承租人應以善良管理人之注意，保管租賃物。"},{"k":"law","l":"民法","r":"第432條第1項","q":"承租人應以善良管理人之注意，保管租賃物，租賃物有生產力者，並應保持其生產力。","u":"https://mojlaw.moj.gov.tw/LawContent.aspx?LSID=FL001351&lawNumber=421&TypeSort=3"}]}},{"id":"02-01-029","c":"02","t":"02-01","n":"29","q":"某甲承租房屋，包括電視機一台，租賃期間因其兄的小孩在客廳嬉戲，不慎打破電視機的螢幕，誰應負損害賠償責任？","o":["出租人","承租人之兄","承租人","承租人之兄的小孩"],"a":"C","ty":"case","e":{"s":"ok","x":"民法第433條（簡報（倫理規範）頁68）：因承租人之同居人或承租人允許為租賃物之使用、收益之第三人應負責之事由，致租賃物毀損、滅失者，承租人負損害賠償責任；其兄之小孩係經承租人允許在屋內之人，故由承租人負責，故選(C)。","b":[{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－租賃住宅相關法規與實務（法5-1～法5-5）","r":"頁碼68（PDF第69頁）","q":"因承租人之同居人，或因承租人允許為租賃物之使用、收益之第三人，應負責之事由，致租賃物毀損、滅失者，承租人負損害賠償責任。"},{"k":"law","l":"民法","r":"第433條","q":"因承租人之同居人或因承租人允許為租賃物之使用、收益之第三人應負責之事由，致租賃物毀損、滅失者，承租人負損害賠償責任。","u":"https://mojlaw.moj.gov.tw/LawContent.aspx?LSID=FL001351&lawNumber=421&TypeSort=3"}]}},{"id":"02-01-030","c":"02","t":"02-01","n":"30","q":"承租人承租房屋，於租賃期間因使用不慎導致失火而毀損，試問，依民法規定承租人在何種情況下，應對於出租人負損害賠償責任？","o":["有過失，就要負責","需有故意才應負責","無過失，也要負責","重大過失，才要負責"],"a":"D","ty":"gen","e":{"s":"ok","x":"民法第434條（簡報（倫理規範）頁68）：租賃物因承租人之重大過失，致失火而毀損、滅失者，承租人對於出租人負損害賠償責任，故選(D)。","b":[{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－租賃住宅相關法規與實務（法5-1～法5-5）","r":"頁碼68（PDF第69頁）","q":"租賃物因承租人之重大過失致失火而毀損、滅失者，承租人對於出租人負損害賠償責任。"},{"k":"law","l":"民法","r":"第434條","q":"租賃物因承租人之重大過失，致失火而毀損、滅失者，承租人對於出租人負損害賠償責任。","u":"https://mojlaw.moj.gov.tw/LawContent.aspx?LSID=FL001351&lawNumber=421&TypeSort=3"}]}},{"id":"02-01-031","c":"02","t":"02-01","n":"31","q":"依民法規定，承租人於租賃期間內遲延或拒付租金，出租人得主張終止租賃契約的條件，下列敘述何者正確？","o":["限期催告，承租人逾期不付，得終止契約","遲付租金之總額，未達2個月之租額，仍得終止契約","約定於每期開始時支付租金者，並應於遲延給付逾2個月時，始得終止契約","遲付租金達2個月之租額，無須限期催告，即得終止租賃契約"],"a":"C","ty":"num","e":{"s":"ok","x":"民法第440條（簡報（倫理規範）頁69）：承租人遲付租金，出租人須定相當期限催告；租賃物為房屋者，遲付租金總額非達二個月之租額不得終止，其租金約定於每期開始時支付者，並應於遲延給付逾二個月時，始得終止契約，故(A)(B)(D)均不完整或錯誤，故選(C)。","b":[{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－租賃住宅相關法規與實務（法5-1～法5-5）","r":"頁碼69（PDF第70頁）","q":"其租金約定於每期開始時支付者，並應於遲延給付逾二個月時，始得終止契約。"},{"k":"law","l":"民法","r":"第440條第1項","q":"承租人租金支付有遲延者，出租人得定相當期限，催告承租人支付租金，如承租人於其期限內不為支付，出租人得終止契約。","u":"https://mojlaw.moj.gov.tw/LawContent.aspx?LSID=FL001351&lawNumber=421&TypeSort=3"},{"k":"law","l":"民法","r":"第440條第2項","q":"租賃物為房屋者，遲付租金之總額，非達二個月之租額，不得依前項之規定，終止契約。其租金約定於每期開始時支付者，並應於遲延給付逾二個月時，始得終止契約。","u":"https://mojlaw.moj.gov.tw/LawContent.aspx?LSID=FL001351&lawNumber=421&TypeSort=3"}],"nt":"簡報頁69第440條第2項前段作「非達兩期之租額」，現行條文為「非達二個月之租額」。"}},{"id":"02-01-032","c":"02","t":"02-01","n":"32","q":"依民法之規定，房屋租賃契約簽訂後，因其價值之昇降，當事人得聲請法院增減其租金，此種情形只適用何種契約？","o":["定期租賃契約","不定期租賃","5年以上之租賃契約","租地建屋"],"a":"B","ty":"gen","ns":1,"e":{"s":"ok","x":"民法第442條（簡報（倫理規範）頁69）：租賃物為不動產者，因其價值之昇降，當事人得聲請法院增減其租金，但其租賃定有期限者，不在此限，故僅適用於不定期租賃，故選(B)。","b":[{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－租賃住宅相關法規與實務（法5-1～法5-5）","r":"頁碼69（PDF第70頁）","q":"租賃物為不動產者，因其價值之昇降，當事人得聲請法院增減其租金。但其租賃定有期限者，不在此限。"},{"k":"law","l":"民法","r":"第442條","q":"租賃物為不動產者，因其價值之昇降，當事人得聲請法院增減其租金。但其租賃定有期限者，不在此限。","u":"https://mojlaw.moj.gov.tw/LawContent.aspx?LSID=FL001351&lawNumber=421&TypeSort=3"}]}},{"id":"02-01-033","c":"02","t":"02-01","n":"33","q":"依民法之規定，承租人於租賃期間內將房屋轉租他人，下列敘述，何者為正確？","o":["非經出租人承諾，不得轉租","除有反對之約定外，可以轉租","違反禁止轉租之契約，無效","可向次承租人請求返還"],"a":"B","ty":"gen","e":{"s":"ok","x":"民法第443條第1項（簡報（倫理規範）頁69）：承租人非經出租人承諾，不得將租賃物轉租於他人；但租賃物為房屋者，除有反對之約定外，承租人得將其一部分轉租於他人，故選(B)。","b":[{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－租賃住宅相關法規與實務（法5-1～法5-5）","r":"頁碼69（PDF第70頁）","q":"但租賃物為房屋者，除有反對之約定外，承租人得將其一部分轉租於他人。"},{"k":"law","l":"民法","r":"第443條第1項","q":"承租人非經出租人承諾，不得將租賃物轉租於他人。但租賃物為房屋者，除有反對之約定外，承租人得將其一部分轉租於他人。","u":"https://mojlaw.moj.gov.tw/LawContent.aspx?LSID=FL001351&lawNumber=421&TypeSort=3"}],"nt":"但書僅許房屋「一部分」轉租；選項(A)係一般租賃物之原則。違反者依同條第2項（簡報頁69）出租人得終止契約，選項(C)「無效」與此不符。"}},{"id":"02-01-034","c":"02","t":"02-01","n":"34","q":"依民法之規定，承租人於租賃期間內將房屋轉租他人，如因次承租人之故意或過失損壞相關設施，出租人向誰請求賠償?","o":["次承租人與承租人負連帶賠償責任","次承租人","由法院判定","承租人。"],"a":"D","ty":"gen","e":{"s":"ok","x":"民法第444條（簡報（倫理規範）頁69）：承租人依法轉租者，其與出租人間之租賃關係仍為繼續；因次承租人應負責之事由所生之損害，承租人負賠償責任，故選(D)。","b":[{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－租賃住宅相關法規與實務（法5-1～法5-5）","r":"頁碼69（PDF第70頁）","q":"因次承租人應負責之事由所生之損害，承租人負賠償責任。"},{"k":"law","l":"民法","r":"第444條第2項","q":"因次承租人應負責之事由所生之損害，承租人負賠償責任。","u":"https://mojlaw.moj.gov.tw/LawContent.aspx?LSID=FL001351&lawNumber=421&TypeSort=3"}]}},{"id":"02-01-035","c":"02","t":"02-01","n":"35","q":"依民法之規定，某甲將房屋出租予某乙，某乙又將房屋轉租某丙，租期未屆滿前某乙因積欠房租，經某甲主張終止租賃契約後，某丙仍繼續使用房屋，試問，某甲得以何種理由向某丙請求返還房屋？","o":["無權占有","轉租賃契約同時終止","竊占","侵權行為"],"a":"A","ty":"case","e":{"s":"ok","x":"民法第767條第1項：所有人對於無權占有其所有物者，得請求返還之（簡報（倫理規範）頁57判決亦引此條）；轉租時依第444條第1項出租人僅與承租人乙有租賃關係，甲乙租約終止後丙已無得對抗甲之占有權源，甲得以無權占有為由請求返還，故選(A)。","b":[{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－租賃住宅相關法規與實務（法5-1～法5-5）","r":"頁碼57（PDF第58頁）","q":"所有人對於無權占有或 侵奪其所有物者，得請求返還之。"},{"k":"law","l":"民法","r":"第767條第1項","q":"所有人對於無權占有或侵奪其所有物者，得請求返還之。對於妨害其所有權者，得請求除去之。有妨害其所有權之虞者，得請求防止之。","u":"https://mojlaw.moj.gov.tw/LawContent.aspx?LSID=FL001351&lawNumber=765&TypeSort=3"},{"k":"law","l":"民法","r":"第444條第1項","q":"承租人依前條之規定，將租賃物轉租於他人者，其與出租人間之租賃關係，仍為繼續。","u":"https://mojlaw.moj.gov.tw/LawContent.aspx?LSID=FL001351&lawNumber=421&TypeSort=3"}]}},{"id":"02-01-036","c":"02","t":"02-01","n":"36","q":"依民法之規定，出租人就租賃契約所生之債權，對於承租人之物置於該租賃房屋內者，有留置權，但承租人擬取去時，出租人如何救濟？下列敘述何者為正確?","o":["聲請法院處理","向警察局報案","向地政機關申請為必要之處置","可以不聲請法院逕行阻止其取去"],"a":"D","ty":"gen","e":{"s":"ok","x":"民法第445條第1項：不動產出租人就租賃契約所生之債權，對承租人置於該不動產之物有留置權；第447條第1項：出租人有提出異議權者，得不聲請法院，逕行阻止承租人取去其留置物，故選(D)。","b":[{"k":"law","l":"民法","r":"第445條第1項","q":"不動產之出租人，就租賃契約所生之債權，對於承租人之物置於該不動產者，有留置權。但禁止扣押之物，不在此限。","u":"https://mojlaw.moj.gov.tw/LawContent.aspx?LSID=FL001351&lawNumber=421&TypeSort=3"},{"k":"law","l":"民法","r":"第447條第1項","q":"出租人有提出異議權者，得不聲請法院，逕行阻止承租人取去其留置物；如承租人離去租賃之不動產者，並得占有其物。","u":"https://mojlaw.moj.gov.tw/LawContent.aspx?LSID=FL001351&lawNumber=421&TypeSort=3"}],"nt":"簡報（倫理規範頁66-70）未摘錄第445至448條。依第446條第2項，承租人因執行業務取去、取去適於通常生活關係或所留之物足以擔保租金者，出租人不得提出異議。"}},{"id":"02-01-037","c":"02","t":"02-01","n":"37","q":"依民法關於租賃契約的期限，最長不得超過幾年？","o":["10年","15年","20年","30年"],"a":"C","ty":"neg","e":{"s":"ok","x":"民法第449條第1項（簡報（倫理規範）頁70）：租賃契約之期限，不得逾二十年，逾二十年者，縮短為二十年，故選(C)。","b":[{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－租賃住宅相關法規與實務（法5-1～法5-5）","r":"頁碼70（PDF第71頁）","q":"租賃契約之期限，不得逾二十年。逾二十年者，縮短為二十年。"},{"k":"law","l":"民法","r":"第449條第1項","q":"租賃契約之期限，不得逾二十年。逾二十年者，縮短為二十年。","u":"https://mojlaw.moj.gov.tw/LawContent.aspx?LSID=FL001351&lawNumber=421&TypeSort=3"}],"nt":"同條另規定期限得更新，租用基地建築房屋者不適用二十年限制。"}},{"id":"02-01-038","c":"02","t":"02-01","n":"38","q":"依民法之規定，租賃契約定有期限者，該租賃契約於何時，租賃關係即歸消滅?","o":["房屋點交時","期限屆滿時","房屋搬遷時","押金返還時"],"a":"B","ty":"gen","e":{"s":"ok","x":"民法第450條第1項（簡報（倫理規範）頁70）：租賃定有期限者，其租賃關係，於期限屆滿時消滅，故選(B)。","b":[{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－租賃住宅相關法規與實務（法5-1～法5-5）","r":"頁碼70（PDF第71頁）","q":"租賃定有期限者，其租賃關係，於期限屆滿時消滅。"},{"k":"law","l":"民法","r":"第450條第1項","q":"租賃定有期限者，其租賃關係，於期限屆滿時消滅。","u":"https://mojlaw.moj.gov.tw/LawContent.aspx?LSID=FL001351&lawNumber=421&TypeSort=3"}]}},{"id":"02-01-039","c":"02","t":"02-01","n":"39","q":"依民法之規定(不考慮特別法規定)，未定有期限的租賃契約，除有有利於承租人之習慣者外，何時可以終止租賃契約?","o":["承租人他遷時","承租人另有住宅時","隨時終止契約","積欠1個月租金時"],"a":"C","ty":"gen","e":{"s":"ok","x":"民法第450條第2項（簡報（倫理規範）頁70）：未定期限者，各當事人得隨時終止契約，但有利於承租人之習慣者，從其習慣，故選(C)。","b":[{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－租賃住宅相關法規與實務（法5-1～法5-5）","r":"頁碼70（PDF第71頁）","q":"未定期限者，各當事人得隨時終止契約。但有利於承租人之習慣者，從其習慣。"},{"k":"law","l":"民法","r":"第450條第2項","q":"未定期限者，各當事人得隨時終止契約。但有利於承租人之習慣者，從其習慣。","u":"https://mojlaw.moj.gov.tw/LawContent.aspx?LSID=FL001351&lawNumber=421&TypeSort=3"}],"nt":"題目限定不考慮特別法；如考慮土地法第100條，出租人收回房屋受有限制（見02-01-040）。"}},{"id":"02-01-040","c":"02","t":"02-01","n":"40","q":"依民法之規定(應一併考慮土地法規定)，未定有期限的租賃契約，除有有利於承租人之習慣者外，何時可以終止租賃契約?","o":["承租人他遷時","應符合土地法有特別規定","隨時終止契約","積欠1個月租金時"],"a":"B","ty":"gen","e":{"s":"ok","x":"土地法第100條（簡報（倫理規範）頁71，條旨「不定期租賃收回房屋之限制」）：出租人非因該條所列情形之一（如收回自住或重新建築、承租人積欠租金除擔保金抵償外達二個月以上等），不得收回房屋，故一併考慮土地法時，出租人須符合土地法之特別規定始得終止，故選(B)。","b":[{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－租賃住宅相關法規與實務（法5-1～法5-5）","r":"頁碼71（PDF第72頁）","q":"出租人非因左列情形之一，不得收回房屋："},{"k":"law","l":"土地法","r":"第100條","q":"出租人非因左列情形之一，不得收回房屋。","m":"所列情形：一、出租人收回自住或重新建築時；二、承租人違反民法第443條第1項規定轉租；三、承租人積欠租金額，除擔保金抵償外，達二個月以上；四、以房屋供違反法令之使用；五、違反租賃契約；六、損壞出租人之房屋或附著財物而不為相當之賠償。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060001"}]}},{"id":"02-01-041","c":"02","t":"02-01","n":"41","q":"某甲與某乙有未定有期限的租賃契約，每3個月付租金一次，出租人想要終止租賃契約時，至少應在多久前先期通知?","o":["1個月前","2個月前","3個月前","6個月前"],"a":"C","ty":"num","e":{"s":"unclear","x":"","b":[{"k":"law","l":"民法","r":"第450條第3項","q":"前項終止契約，應依習慣先期通知。但不動產之租金，以星期、半個月或一個月定其支付之期限者，出租人應以曆定星期、半個月或一個月之末日為契約終止期，並應至少於一星期、半個月或一個月前通知之。","u":"https://mojlaw.moj.gov.tw/LawContent.aspx?LSID=FL001351&lawNumber=421&TypeSort=3"}],"f":"民法第450條第3項（簡報倫理規範頁70同）：未定期限租賃之終止應「依習慣先期通知」，但書僅就租金以星期、半個月或一個月為支付期限者，規定出租人應至少於一星期、半個月或一個月前通知。以三個月為支付期者，條文未規定應於三個月前通知，而係依習慣；簡報與網路搜尋（法務部主管法規系統、判決及法律網站）均未查得「三個月前通知」之明確依據。"}},{"id":"02-01-042","c":"02","t":"02-01","n":"42","q":"依民法規定，下列何者非屬不定期限之租賃?","o":["租期超過5年，未辦理公證","租期屆滿後，承租人仍繼續居住，出租人不即表示反對","租期逾1年，未訂立字據","租賃契約並未訂定期限"],"a":"A","ty":"neg","e":{"s":"ok","x":"民法第422條、第450條第2項、第451條（簡報（倫理規範）頁66、70）：期限逾一年未以字據訂立之不動產租賃、未定期限之租賃、租期屆滿後承租人仍為使用收益而出租人不即表示反對者，均為（或視為）不定期租賃；第425條第2項「未經公證、期限逾五年」僅使買賣不破租賃不適用，並不使租約成為不定期，故選(A)。","b":[{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－租賃住宅相關法規與實務（法5-1～法5-5）","r":"頁碼66（PDF第67頁）","q":"未以字據訂立者，視為不定期限之租賃。"},{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－租賃住宅相關法規與實務（法5-1～法5-5）","r":"頁碼70（PDF第71頁）","q":"視為以不定期限繼續契約。"},{"k":"law","l":"民法","r":"第425條第2項","q":"前項規定，於未經公證之不動產租賃契約，其期限逾五年或未定期限者，不適用之。","u":"https://mojlaw.moj.gov.tw/LawContent.aspx?LSID=FL001351&lawNumber=421&TypeSort=3"},{"k":"law","l":"民法","r":"第451條","q":"租賃期限屆滿後，承租人仍為租賃物之使用收益，而出租人不即表示反對之意思者，視為以不定期限繼續契約。","u":"https://mojlaw.moj.gov.tw/LawContent.aspx?LSID=FL001351&lawNumber=421&TypeSort=3"}]}},{"id":"02-01-043","c":"02","t":"02-01","n":"43","q":"依民法規定，原定有租賃期限之契約，下列何者不會變成「視為以不定期限繼續契約」?","o":["租期屆滿後承租人仍繼續居住房屋","出租人不即表示反對","雙方並未另訂有期限之租賃契約","雙方租期屆滿後另訂租賃契約"],"a":"D","ty":"neg","e":{"s":"ok","x":"民法第451條（簡報（倫理規範）頁70）：租賃期限屆滿後，承租人仍為租賃物之使用收益，而出租人不即表示反對之意思者，視為以不定期限繼續契約；選項(A)(B)(C)為該條之構成情形，雙方於租期屆滿後另訂租賃契約者，則依新契約定其關係，不生視為不定期繼續之效果，故選(D)。","b":[{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－租賃住宅相關法規與實務（法5-1～法5-5）","r":"頁碼70（PDF第71頁）","q":"租賃期限屆滿後，承租人仍為租賃物之使用收益，而出租人不即表示反對之意思者，視為以不定期限繼續契約。"},{"k":"law","l":"民法","r":"第451條","q":"租賃期限屆滿後，承租人仍為租賃物之使用收益，而出租人不即表示反對之意思者，視為以不定期限繼續契約。","u":"https://mojlaw.moj.gov.tw/LawContent.aspx?LSID=FL001351&lawNumber=421&TypeSort=3"}]}},{"id":"02-01-044","c":"02","t":"02-01","n":"44","q":"依民法之規定，某甲向某乙房租房屋，租期屆滿後，承租人仍為租賃物之使用收益，而出租人不即表示反對之意思者，而依法視為以不定期限繼續契約。某乙後悔拒不按月收取租金，試問，某甲應如何處理?","o":["可以不付","寄存於警察局","提存於法院","為某為受益人信託於金融機構"],"a":"C","ty":"case","e":{"s":"ok","x":"民法第234條：債權人對於已提出之給付拒絕受領者，負遲延責任；第326條：債權人受領遲延者，清償人得將其給付物為債權人提存之；第327條：提存應於清償地之法院提存所為之，故出租人拒收租金時，承租人應將租金提存於法院，故選(C)。","b":[{"k":"law","l":"民法","r":"第234條","q":"債權人對於已提出之給付，拒絕受領或不能受領者，自提出時起，負遲延責任。","u":"https://mojlaw.moj.gov.tw/LawContent.aspx?LSID=FL001351&lawNumber=229&TypeSort=4"},{"k":"law","l":"民法","r":"第326條","q":"債權人受領遲延，或不能確知孰為債權人而難為給付者，清償人得將其給付物，為債權人提存之。","u":"https://mojlaw.moj.gov.tw/LawContent.aspx?LSID=FL001351&lawNumber=326&TypeSort=4"},{"k":"law","l":"民法","r":"第327條","q":"提存應於清償地之法院提存所為之。","u":"https://mojlaw.moj.gov.tw/LawContent.aspx?LSID=FL001351&lawNumber=326&TypeSort=4"}]}},{"id":"02-01-045","c":"02","t":"02-01","n":"45","q":"依民法之規定，某甲向某乙承租房屋，租期屆滿後，某甲他遷不知去向。導致某乙無法將押金返還某甲，試問，下列敘述何者正確?","o":["可以沒收","提存於警察局","提存於法院提存所","提存於法院公證處"],"a":"C","ty":"case","e":{"s":"ok","x":"民法第326條：債權人受領遲延，或不能確知孰為債權人而難為給付者，清償人得將給付物為債權人提存；第327條第1項：提存應於清償地之法院提存所為之。承租人他遷不知去向而不能受領押金之返還（第234條：債權人不能受領者負遲延責任），出租人應將押金提存於法院提存所，不得沒收，亦非提存於警察局或公證處，故選(C)。","b":[{"k":"law","l":"民法","r":"第326條","q":"債權人受領遲延，或不能確知孰為債權人而難為給付者，清償人得將其給付物，為債權人提存之。","u":"https://mojlaw.moj.gov.tw/LawContent.aspx?LSID=FL001351&lawNumber=326&TypeSort=4"},{"k":"law","l":"民法","r":"第327條","q":"提存應於清償地之法院提存所為之。","u":"https://mojlaw.moj.gov.tw/LawContent.aspx?LSID=FL001351&lawNumber=326&TypeSort=4"},{"k":"law","l":"民法","r":"第234條","q":"債權人對於已提出之給付，拒絕受領或不能受領者，自提出時起，負遲延責任。","u":"https://mojlaw.moj.gov.tw/LawContent.aspx?LSID=FL001351&lawNumber=229&TypeSort=4"}],"nt":"簡報（倫理規範頁66–70）未收錄提存規定，依民法現行條文作答。"}},{"id":"02-01-046","c":"02","t":"02-01","n":"46","q":"某甲向某乙承租房屋，以一年為期並按月付租，但租賃契約約定如某乙兒子回國時，雙方同意提前終止租約，試問，某甲要提前終止租約時，至少應在多久前通知某乙?","o":["1星期前","半個月前","由某甲自行決定","1個月前"],"a":"D","ty":"case","e":{"s":"ok","x":"民法第453條：定有期限之租賃契約，如約定當事人之一方於期限屆滿前得終止契約者，其終止應依第450條第3項之規定先期通知；第450條第3項：不動產租金以一個月定其支付期限者，應至少於一個月前通知。本題租約按月付租並約定得提前終止，故至少應於1個月前通知，故選(D)。","b":[{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－租賃住宅相關法規與實務（法5-1～法5-5）","r":"頁碼70（PDF第71頁）","q":"定有期限之租賃契約，如約定當事人之一方於期限屆滿前，得終止契約者，其終止契約，應依第四百五十條第三項之規定，先期通知。"},{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－租賃住宅相關法規與實務（法5-1～法5-5）","r":"頁碼70（PDF第71頁）","q":"但不動產之租金，以星期、半個月或一個月定其支付之期限者，出租人應以曆定星期、半個月或一個月之末日為契約終止期，並應至少於一星期、半個月或一個月前通知之。"},{"k":"law","l":"民法","r":"第453條","q":"定有期限之租賃契約，如約定當事人之一方於期限屆滿前，得終止契約者，其終止契約，應依第四百五十條第三項之規定，先期通知。","u":"https://mojlaw.moj.gov.tw/LawContent.aspx?LSID=FL001351&lawNumber=421&TypeSort=3"},{"k":"law","l":"民法","r":"第450條第3項","q":"前項終止契約，應依習慣先期通知。但不動產之租金，以星期、半個月或一個月定其支付之期限者，出租人應以曆定星期、半個月或一個月之末日為契約終止期，並應至少於一星期、半個月或一個月前通知之。","u":"https://mojlaw.moj.gov.tw/LawContent.aspx?LSID=FL001351&lawNumber=421&TypeSort=3"},{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－租賃管理與糾紛實務（實2-1～實2-2）","r":"頁碼21（PDF第22頁）","q":"提前終止租約，除應於一個月前通知外"}],"nt":"第450條第3項但書文字以「出租人」為主詞，題庫係依第453條（約定當事人一方得提前終止者，應依第450條第3項先期通知）作答；簡報（糾紛處理）頁21亦建議提前終止租約應於一個月前通知。"}},{"id":"02-01-047","c":"02","t":"02-01","n":"47","q":"某甲與某乙有定有一年為期限的租賃契約，租賃期間發生下列不得已的事由，依民法規定，下列何者可以主張提前終止租賃契約?","o":["承租人死亡","承租人長期住院","承租人因公司調職到他縣市","承租人家中變故"],"a":"A","ty":"neg","e":{"s":"ok","x":"民法第452條：承租人死亡者，租賃契約雖定有期限，其繼承人仍得終止契約（但應依第450條第3項先期通知）。長期住院、調職、家中變故均非民法租賃節所定得提前終止定期租約之事由，故選(A)。","b":[{"k":"law","l":"民法","r":"第452條","q":"承租人死亡者，租賃契約雖定有期限，其繼承人仍得終止契約。但應依第四百五十條第三項之規定，先期通知。","u":"https://mojlaw.moj.gov.tw/LawContent.aspx?LSID=FL001351&lawNumber=421&TypeSort=3"},{"k":"law","l":"民法","r":"債編第二章第五節租賃（第421條至第463條之1）","m":"本節關於承租人方面得終止契約之規定為第424條、第430條、第435條、第436條、第450條第2項、第452條、第453條，未有因疾病住院、工作調職或家庭變故得提前終止定期租約之規定。","u":"https://mojlaw.moj.gov.tw/LawContent.aspx?LSID=FL001351&lawNumber=421&TypeSort=3"}],"nt":"簡報（倫理規範頁66–70）未收錄民法第452條。另租賃條例第11條（簡報倫理規範頁8）就住宅租賃另定承租人因疾病、意外有長期療養需要等得提前終止之情形，惟本題限定依民法。"}},{"id":"02-01-048","c":"02","t":"02-01","n":"48","q":"依約定或法律規定可提前終止租賃契約者，承租人依規定終止時，倘出租人收取之租金，尚有終止後始到期部分，是否應予返還?","o":["抵充違約金","予以沒收","應返還","加倍返還"],"a":"C","ty":"gen","e":{"s":"ok","x":"民法第454條：租賃契約依第452條（承租人死亡）、第453條（約定得提前終止）規定終止時，如終止後始到期之租金，出租人已預先受領者，應返還之，故選(C)。","b":[{"k":"law","l":"民法","r":"第454條","q":"租賃契約，依前二條之規定終止時，如終止後始到期之租金，出租人已預先受領者，應返還之。","u":"https://mojlaw.moj.gov.tw/LawContent.aspx?LSID=FL001351&lawNumber=421&TypeSort=3"}],"nt":"簡報（倫理規範頁66–70）未收錄民法第454條。"}},{"id":"02-01-049","c":"02","t":"02-01","n":"49","q":"依民法規定，出租人就租賃物所受損害對於承租人之賠償請求權，其請求權時效為幾年？","o":["1年","2年","5年","15年"],"a":"B","ty":"num","e":{"s":"ok","x":"民法第456條第1項：出租人就租賃物所受損害對於承租人之賠償請求權，因二年間不行使而消滅（簡報倫理規範頁70同），故選(B)。","b":[{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－租賃住宅相關法規與實務（法5-1～法5-5）","r":"頁碼70（PDF第71頁）","q":"均因二年間不行使而消滅"},{"k":"law","l":"民法","r":"第456條第1項","q":"出租人就租賃物所受損害對於承租人之賠償請求權，承租人之償還費用請求權及工作物取回權，均因二年間不行使而消滅。","u":"https://mojlaw.moj.gov.tw/LawContent.aspx?LSID=FL001351&lawNumber=421&TypeSort=3"}]}},{"id":"02-01-050","c":"02","t":"02-01","n":"50","q":"依民法之規定，承租人之償還費用請求權及工作物取回權之請求權時效為幾年？","o":["1年","2年","5年","15年"],"a":"B","ty":"num","e":{"s":"ok","x":"民法第456條第1項：承租人之償還費用請求權及工作物取回權，均因二年間不行使而消滅（簡報倫理規範頁70同），故選(B)。","b":[{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－租賃住宅相關法規與實務（法5-1～法5-5）","r":"頁碼70（PDF第71頁）","q":"均因二年間不行使而消滅"},{"k":"law","l":"民法","r":"第456條第1項","q":"出租人就租賃物所受損害對於承租人之賠償請求權，承租人之償還費用請求權及工作物取回權，均因二年間不行使而消滅。","u":"https://mojlaw.moj.gov.tw/LawContent.aspx?LSID=FL001351&lawNumber=421&TypeSort=3"}]}},{"id":"02-01-051","c":"02","t":"02-01","n":"51","q":"依民法規定，出租人就租賃物所受損害對於承租人之賠償請求權時效，從何時起算？","o":["自租賃關係終止時起算","自受損害時起算","自受租賃物返還時起算","自受受損害時起算30日起算"],"a":"C","ty":"gen","e":{"s":"ok","x":"民法第456條第2項：出租人損害賠償請求權之二年時效，於出租人自受租賃物返還時起算，故選(C)。","b":[{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－租賃住宅相關法規與實務（法5-1～法5-5）","r":"頁碼70（PDF第71頁）","q":"前項期間，於出租人，自受租賃物返還時"},{"k":"law","l":"民法","r":"第456條第2項","q":"前項期間，於出租人，自受租賃物返還時起算。於承租人，自租賃關係終止時起算。","u":"https://mojlaw.moj.gov.tw/LawContent.aspx?LSID=FL001351&lawNumber=421&TypeSort=3"}],"nt":"簡報頁70將「起算」誤植為「地算」，現行條文為「自受租賃物返還時起算」。"}},{"id":"02-01-052","c":"02","t":"02-01","n":"52","q":"依民法規定，承租人之償還費用請求權及工作物取回權之請求權時效，從何時起算？","o":["自租賃關係終止時起算","自請求之日起算","自租賃物返還時起算","自請求日後30日起算"],"a":"A","ty":"gen","e":{"s":"ok","x":"民法第456條第2項：承租人之償還費用請求權及工作物取回權之二年時效，於承租人自租賃關係終止時起算，故選(A)。","b":[{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－租賃住宅相關法規與實務（法5-1～法5-5）","r":"頁碼70（PDF第71頁）","q":"於承租人，自租賃關係終止時起算"},{"k":"law","l":"民法","r":"第456條第2項","q":"前項期間，於出租人，自受租賃物返還時起算。於承租人，自租賃關係終止時起算。","u":"https://mojlaw.moj.gov.tw/LawContent.aspx?LSID=FL001351&lawNumber=421&TypeSort=3"}]}},{"id":"02-01-053","c":"02","t":"02-01","n":"53","q":"依民法規定，下列何者非屬承租人可以終止租賃契約?","o":["危及安全或健康之瑕疵","出租人逾期不修繕","第三人主張權利，但不影響承租人使用","房屋部分滅失，存餘部分不能達租賃之目的"],"a":"C","ty":"neg","e":{"s":"ok","x":"簡報（倫理規範）頁66–68所載民法：房屋有危及安全或健康之瑕疵得終止（第424條）、出租人經催告逾期不修繕得終止（第430條）、一部滅失而存餘部分不能達租賃目的得終止（第435條第2項）；第三人主張權利須「致不能為約定之使用、收益」始準用終止（第436條），不影響承租人使用者不得據以終止，故選(C)。","b":[{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－租賃住宅相關法規與實務（法5-1～法5-5）","r":"頁碼66（PDF第67頁）","q":"危及承租人或其同居人之安全或健康時，承租人雖於訂約時已知其瑕疵，或已拋棄其終止契約之權利，仍得終止契約。"},{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－租賃住宅相關法規與實務（法5-1～法5-5）","r":"頁碼67（PDF第68頁）","q":"如出租人於其期限內不為修繕者，承租人得終止契約或自行修繕而請求出租人償還其費用，或於租金中扣除之。"},{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－租賃住宅相關法規與實務（法5-1～法5-5）","r":"頁碼68（PDF第69頁）","q":"承租人就其存餘部分不能達租賃之目的者，得終止契約。"},{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－租賃住宅相關法規與實務（法5-1～法5-5）","r":"頁碼68（PDF第69頁）","q":"於承租人因第三人就租賃物主張權利，致不能為約定之使用、收益者，準用之。"}]}},{"id":"02-01-054","c":"02","t":"02-01","n":"54","q":"依民法規定，下列何者出租人不得終止租賃契約?","o":["承租人違反使用、收益之規定","承租人酗酒鬧事","承租人遲付租金","承租人違反轉租規定"],"a":"B","ty":"neg","e":{"s":"ok","x":"簡報（倫理規範）頁68–69所載民法：承租人違反約定方法使用收益，經出租人阻止仍繼續者得終止（第438條第2項）；遲付租金經催告仍不支付者得終止（第440條）；違反規定轉租者得終止（第443條第2項）。「酗酒鬧事」非民法所定出租人終止事由，故選(B)。","b":[{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－租賃住宅相關法規與實務（法5-1～法5-5）","r":"頁碼68（PDF第69頁）","q":"經出租人阻止而仍繼續為之者，出租人得終止契約。"},{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－租賃住宅相關法規與實務（法5-1～法5-5）","r":"頁碼69（PDF第70頁）","q":"如承租人於其期限內不為支付，出租人得終止契約。"},{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－租賃住宅相關法規與實務（法5-1～法5-5）","r":"頁碼69（PDF第70頁）","q":"承租人違反前項規定，將租賃物轉租於他人者，出租人得終止契約。"}]}},{"id":"02-01-055","c":"02","t":"02-01","n":"55","q":"依民法關於租賃契約的期限，最長不得超過20年，下列何種情形，可不受此限制？","o":["以押租金取代租金","依租賃住宅市場發展及管理條例之包租契約","法院判決","房地同屬一人所有，僅將土地或房屋所有權讓與他人"],"a":"D","ty":"neg","e":{"s":"ok","x":"民法第449條第1項：租賃契約之期限不得逾
