er=421&TypeSort=3"}]}},{"id":"02-01-062","c":"02","t":"02-01","n":"62","q":"依民法規定(不考慮特別法規定)，在租用基地建築房屋的關係下，基地出賣時，下列何者有優先承買之權?","o":["基地之典權人","土地抵押權人","基地承租人","地上權人"],"a":"C","ty":"gen","e":{"s":"ok","x":"民法第426條之2第1項：租用基地建築房屋，出租人出賣基地時，承租人（基地承租人）有依同樣條件優先承買之權，故選(C)。","b":[{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－租賃住宅相關法規與實務（法5-1～法5-5）","r":"頁碼67（PDF第68頁）","q":"租用基地建築房屋，出租人出賣基地時，承租人有依同樣條件"},{"k":"law","l":"民法","r":"第426條之2第1項","q":"租用基地建築房屋，出租人出賣基地時，承租人有依同樣條件優先承買之權。承租人出賣房屋時，基地所有人有依同樣條件優先承買之權。","u":"https://mojlaw.moj.gov.tw/LawContent.aspx?LSID=FL001351&lawNumber=421&TypeSort=3"}],"nt":"簡報頁67本句漏「優」字；題目已限定不考慮特別法（如土地法第104條）。"}},{"id":"02-01-063","c":"02","t":"02-01","n":"63","q":"依民法規定，在租用基地建築房屋的關係下，房屋或基地單獨出售，依法通知優先承買權人，優先承買權人於通知達到後至少多少日內未以書面表示承買者，視為放棄?","o":["5日","7日","15日","10日"],"a":"D","ty":"num","e":{"s":"ok","x":"民法第426條之2第2項：出賣人應將出賣條件以書面通知優先承買權人，優先承買權人於通知達到後十日內未以書面表示承買者，視為放棄，故選(D)。","b":[{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－租賃住宅相關法規與實務（法5-1～法5-5）","r":"頁碼67（PDF第68頁）","q":"優先承買權人於通知達到後十日內未以書面表示承買者，視為放棄。"},{"k":"law","l":"民法","r":"第426條之2第2項","q":"前項情形，出賣人應將出賣條件以書面通知優先承買權人。優先承買權人於通知達到後十日內未以書面表示承買者，視為放棄。","u":"https://mojlaw.moj.gov.tw/LawContent.aspx?LSID=FL001351&lawNumber=421&TypeSort=3"}]}},{"id":"02-01-064","c":"02","t":"02-01","n":"64","q":"依民法規定，在租用基地建築房屋的關係下，房屋或基地單獨出售，未依法通知優先承買權人時，所有權完成已登記完畢，優先承買權人如何主張?","o":["訴請法院判決塗銷所有權移轉登記","向出賣人請求損害賠償","向買受人請求損害賠償","已完成登記，無法做任何主張"],"a":"A","ty":"gen","e":{"s":"ok","x":"民法第426條之2第3項：出賣人未以書面通知優先承買權人而為所有權之移轉登記者，不得對抗優先承買權人；法務部107年10月4日法律字第10703514840號函說明此優先購買權具相對之物權效力，優先購買權人得請求法院確認優先購買權存在及塗銷該項登記，並協同辦理所有權移轉登記，故選(A)。","b":[{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－租賃住宅相關法規與實務（法5-1～法5-5）","r":"頁碼67（PDF第68頁）","q":"出賣人未以書面通知優先承買權人而為所有權之移轉登記者，不得對抗優先承買權人。"},{"k":"law","l":"民法","r":"第426條之2第3項","q":"出賣人未以書面通知優先承買權人而為所有權之移轉登記者，不得對抗優先承買權人。","u":"https://mojlaw.moj.gov.tw/LawContent.aspx?LSID=FL001351&lawNumber=421&TypeSort=3"},{"k":"web","l":"法務部107年10月4日法律字第10703514840號函（法務部主管法規查詢系統－相關行政函釋）","r":"","q":"優先購買權人自得請求法院確認優先購買權存在及塗銷該項登記，並協同辦理所有權移轉登記","m":"土地法第104條及民法第426條之2所定之優先購買權具有相對之物權效力；出賣人未通知優先購買權人而與第三人訂約者，其契約或因買賣而為之所有權移轉登記不得對抗優先購買權人（函內引最高法院97年度台上字第2219號判決）。","u":"https://mojlaw.moj.gov.tw/LawContentExShow.aspx?id=FE316911&type=e"}]}},{"id":"02-02-001","c":"02","t":"02-02","n":"01","q":"依所得稅法規定，個人於中華民國境內之財產因租賃而取得之租金，係屬來源所得的一種，應課徵何種類型的所得稅?","o":["營利事業所得稅","綜合所得稅","房地合一所得稅","租金所得稅"],"a":"B","ty":"gen","e":{"s":"ok","x":"所得稅法第8條第5款：在中華民國境內之財產因租賃而取得之租金屬中華民國來源所得；第2條第1項：有中華民國來源所得之個人，應就其所得課徵綜合所得稅，故選(B)。","b":[{"k":"law","l":"所得稅法","r":"所得稅法第8條第5款","q":"五、在中華民國境內之財產因租賃而取得之租金。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0340003"},{"k":"law","l":"所得稅法","r":"所得稅法第2條第1項","q":"凡有中華民國來源所得之個人，應就其中華民國來源之所得，依本法規定，課徵綜合所得稅。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0340003"}]}},{"id":"02-02-002","c":"02","t":"02-02","n":"02","q":"某甲在我國境內無住所，依所得稅法規定，其課稅年度內在我國境內居留合計滿幾天，始得認定為境內居住之個人?","o":["200天","163天","183天","240天"],"a":"C","ty":"num","e":{"s":"ok","x":"所得稅法第7條第2項第2款：在中華民國境內無住所，而於一課稅年度內在境內居留合計滿一百八十三天者，為中華民國境內居住之個人，故選(C)。","b":[{"k":"law","l":"所得稅法","r":"所得稅法第7條第2項第2款","q":"二、在中華民國境內無住所，而於一課稅年度內在中華民國境內居留合計滿一百八十三天者。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0340003"}]}},{"id":"02-02-003","c":"02","t":"02-02","n":"03","q":"依所得稅法規定，我國境內房屋出租而取得之租金，屬於何種所得?","o":["來源所得","營利所得","就源所得","扣繳所得"],"a":"A","ty":"gen","e":{"s":"ok","x":"所得稅法第8條第5款：在中華民國境內之財產因租賃而取得之租金，屬「中華民國來源所得」，故選(A)。","b":[{"k":"law","l":"所得稅法","r":"所得稅法第8條","q":"本法稱中華民國來源所得，係指左列各項所得：","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0340003"},{"k":"law","l":"所得稅法","r":"所得稅法第8條第5款","q":"五、在中華民國境內之財產因租賃而取得之租金。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0340003"}]}},{"id":"02-02-004","c":"02","t":"02-02","n":"04","q":"依租賃住宅市場發展及管理條例規定，個人住宅所有權人將住宅委託代管業或出租予包租業轉租，契約約定供居住使用1年以上者，其每戶每月租金收入，按何者規定課徵所得稅?","o":["新臺幣1萬元以下免徵","新臺幣6千元以下免徵","依所得稅法規定","一律免徵"],"a":"B","ty":"gen","e":{"s":"ok","x":"租賃住宅市場發展及管理條例第17條第1項第1款：個人住宅所有權人將住宅委託代管業或出租予包租業轉租、約定供居住使用一年以上者，出租期間每屋每月租金收入不超過新臺幣六千元部分，免納綜合所得稅，故選(B)。","b":[{"k":"law","l":"租賃住宅市場發展及管理條例","r":"條例第17條第1項","q":"個人住宅所有權人將住宅委託代管業或出租予包租業轉租，契約約定供居住使用一年以上者，得依下列規定減徵租金所得稅：","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060125"},{"k":"law","l":"租賃住宅市場發展及管理條例","r":"條例第17條第1項第1款","q":"一、出租期間每屋每月租金收入不超過新臺幣六千元部分，免納綜合所得稅。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060125"}],"nt":"條文用語為「每屋每月」，題目作「每戶每月」。第17條第2項另定實施年限五年、行政院得延長一次，延長情形未於本批查證。"}},{"id":"02-02-005","c":"02","t":"02-02","n":"05","q":"依租賃住宅市場發展及管理條例規定，出租人將住宅出租委託代管業或出租予包租業轉租1年以上，其租金在一定金額以下免徵，其超過部分，其必要損耗及費用之減除未能提具確實證據者，如何計算其租金收入，下列敘述何者正確?","o":["超過新臺幣6千元至2萬元部分按43%計算","超過新臺幣6千元至2萬元部分按53%計算","超過新臺幣6千元至2萬元部分減半","超過新臺幣2萬元部分按60%計算"],"a":"B","ty":"num","e":{"s":"ok","x":"條例第17條第1項第2款第1目：每屋每月租金收入超過新臺幣六千元至二萬元部分，住宅所有權人未能提具確實證據者，其必要損耗及費用依該部分租金收入百分之五十三計算，故選(B)。","b":[{"k":"law","l":"租賃住宅市場發展及管理條例","r":"條例第17條第1項第2款","q":"二、出租期間每屋每月租金收入超過新臺幣六千元部分，其租金所得必要損耗及費用之減除，住宅所有權人未能提具確實證據者，依下列方式認列：","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060125"},{"k":"law","l":"租賃住宅市場發展及管理條例","r":"條例第17條第1項第2款第1目","q":"（一）每屋每月租金收入超過新臺幣六千元至二萬元部分，依該部分租金收入百分之五十三計算。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060125"}]}},{"id":"02-02-006","c":"02","t":"02-02","n":"06","q":"依所得稅法第14條第1項第5類規定，下列何種收入非租賃所得?","o":["財產出租之租金所得","財產出典典價經運用之所得","土地設定地上權取得之權利金","著作權之版權收入"],"a":"D","ty":"gen","e":{"s":"ok","x":"所得稅法第14條第1項第5類：財產出租之租金、財產出典典價經運用之所得屬租賃所得，設定定期地上權取得之所得視為租賃所得；著作權供他人使用而取得者則屬「權利金所得」，非租賃所得，故選(D)。","b":[{"k":"law","l":"所得稅法","r":"所得稅法第14條第1項第5類","q":"第五類：租賃所得及權利金所得：凡以財產出租之租金所得，財產出典典價經運用之所得或專利權、商標權、著作權、秘密方法及各種特許權利，供他人使用而取得之權利金所得：","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0340003"},{"k":"law","l":"所得稅法","r":"所得稅法第14條第1項第5類第2款","q":"二、設定定期之永佃權及地上權取得之各種所得，視為租賃所得。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0340003"}]}},{"id":"02-02-007","c":"02","t":"02-02","n":"07","q":"依所得稅法規定，財產租賃所得之計算，以全年租賃收入減除何者之餘額為所得額?","o":["40%","50%","實際必要損耗及費用","60%"],"a":"C","ty":"num","e":{"s":"ok","x":"所得稅法第14條第1項第5類第1款：財產租賃所得之計算，以全年租賃收入減除必要損耗及費用後之餘額為所得額，故選(C)。","b":[{"k":"law","l":"所得稅法","r":"所得稅法第14條第1項第5類第1款","q":"一、財產租賃所得及權利金所得之計算，以全年租賃收入或權利金收入，減除必要損耗及費用後之餘額為所得額。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0340003"}]}},{"id":"02-02-008","c":"02","t":"02-02","n":"08","q":"依所得稅法規定，設定定期之地上權取得之各種所得，視為下列那一類所得？","o":["利息所得","財產交易所得","租賃所得","營利所得"],"a":"C","ty":"gen","e":{"s":"ok","x":"所得稅法第14條第1項第5類第2款：設定定期之永佃權及地上權取得之各種所得，視為租賃所得，故選(C)。","b":[{"k":"law","l":"所得稅法","r":"所得稅法第14條第1項第5類第2款","q":"二、設定定期之永佃權及地上權取得之各種所得，視為租賃所得。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0340003"}]}},{"id":"02-02-009","c":"02","t":"02-02","n":"09","q":"依所得稅法規定，於下列何種情形，稽徵機關不得參照當地一般租金調整設算租賃收入？","o":["未申報房屋出典之典價","約定之租金顯較當地一般租金為低","房屋無償借與二親等親屬經營餐廳","房屋無償借與他人供住宅使用且已提出法院公證書"],"a":"D","ty":"neg","e":{"s":"ok","x":"所得稅法第14條第1項第5類第4款：將財產借與他人使用，除經查明確係無償且非供營業或執行業務者使用外，應參照當地一般租金計算租賃收入；施行細則第88條規定無償借用須訂約、經二人證明並辦竣公證，故無償供住宅使用並已提出公證書者，不得設算租金，故選(D)。","b":[{"k":"law","l":"所得稅法","r":"所得稅法第14條第1項第5類第4款","q":"四、將財產借與他人使用，除經查明確係無償且非供營業或執行業務者使用外，應參照當地一般租金情況，計算租賃收入，繳納所得稅。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0340003"},{"k":"law","l":"所得稅法施行細則","r":"所得稅法施行細則第88條","q":"將財產無償借與他人使用者，應由雙方當事人訂立無償借用契約，經雙方當事人以外之二人證明確係無償借用，並依公證法之規定辦竣公證。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0340004"}],"nt":"選項A（出典典價）依第5類第3款係按一年期存款利率設算；B依第5款、C（供營業）依第4款均得設算。"}},{"id":"02-02-010","c":"02","t":"02-02","n":"10","q":"依所得稅法規定，某甲將房屋無償出借於好友某乙供營業使用，應否課徵所得稅，下列敘述何者正確?","o":["照當地一般租金情況計算租賃收入繳納所得稅","無償使用，免納所得稅","照當地一般營業狀況計算租賃收入繳納所得稅","經查明確係無償者，免徵"],"a":"A","ty":"case","e":{"s":"ok","x":"所得稅法第14條第1項第5類第4款：財產借與他人使用，僅「確係無償且非供營業或執行業務者使用」始免計租賃收入；供好友營業使用，應參照當地一般租金情況計算租賃收入繳納所得稅，故選(A)。","b":[{"k":"law","l":"所得稅法","r":"所得稅法第14條第1項第5類第4款","q":"四、將財產借與他人使用，除經查明確係無償且非供營業或執行業務者使用外，應參照當地一般租金情況，計算租賃收入，繳納所得稅。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0340003"}]}},{"id":"02-02-011","c":"02","t":"02-02","n":"11","q":"依所得稅法規定，某甲經營長生養生村，乙一次性支付數百萬押租金，入住期間免按月支付租金，並約定入住者死亡或一定期間屆滿終止契約後無息返還押租金，試問，應以何者設算租賃收入?","o":["按郵政儲金匯業局之1年期存款利率","按當地銀行業通行之1年期存款利率","照郵政儲金2年期定期儲金固定利率","依法定利率"],"a":"B","ty":"num","e":{"s":"ok","x":"所得稅法第14條第1項第5類第3款：財產出租收有押金或任何款項類似押金者，應就各該款項按當地銀行業通行之一年期存款利率計算租賃收入；一次支付之押租金即屬之，故選(B)。","b":[{"k":"law","l":"所得稅法","r":"所得稅法第14條第1項第5類第3款","q":"三、財產出租，收有押金或任何款項類似押金者，或以財產出典而取得典價者，均應就各該款項按當地銀行業通行之一年期存款利率，計算租賃收入。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0340003"}]}},{"id":"02-02-012","c":"02","t":"02-02","n":"12","q":"出租房屋而收取之押金或任何款項類似押金者，應依規定設算其租賃收入，於每年辦理結算申報時，應由誰辦理申報?","o":["代管業代為扣繳","銀行代為扣繳","承租人自行計算申報","出租人自行計算申報"],"a":"D","ty":"gen","e":{"s":"ok","x":"押金依所得稅法第14條第1項第5類第3款設算之租賃收入，屬出租人（取得所得者）之租賃所得；依第71條第1項，納稅義務人應於每年五月一日起至五月三十一日止自行辦理結算申報，故由出租人自行計算申報，故選(D)。","b":[{"k":"law","l":"所得稅法","r":"所得稅法第14條第1項第5類第3款","q":"三、財產出租，收有押金或任何款項類似押金者，或以財產出典而取得典價者，均應就各該款項按當地銀行業通行之一年期存款利率，計算租賃收入。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0340003"},{"k":"law","l":"所得稅法（第71條、第73條）","r":"所得稅法第71條第1項","q":"納稅義務人應於每年五月一日起至五月三十一日止，填具結算申報書，向該管稽徵機關，申報其上一年度內構成綜合所得總額或營利事業收入總額之項目及數額","u":"https://web.law.ntpc.gov.tw/Scripts/FLAWDOC02.aspx?rtype=H&RCODE2=B0160016&RNO=71"}]}},{"id":"02-02-013","c":"02","t":"02-02","n":"13","q":"依所得稅法規定，納稅義務人、配偶及受扶養直系親屬在中華民國境內租屋供自住且非供營業或執行業務使用者，其所支付之租金，每一申報戶每年之特別列舉扣除額上限是多少?","o":["12萬元","18萬元","24萬元","36萬元"],"a":"B","ty":"num","e":{"s":"amended","x":"所得稅法第17條第1項第2款第3目之8：自113年1月1日起，納稅義務人、配偶及受扶養直系親屬在境內租屋供自住且非供營業或執行業務使用者，其租金（減除政府補助部分）每一申報戶每年扣除數額以十八萬元為限，故選(B)。","b":[{"k":"law","l":"所得稅法","r":"所得稅法第17條第1項第2款第3目之8","q":"8.房屋租金支出特別扣除：自中華民國一百十三年一月一日起，納稅義務人、配偶及受扶養直系親屬在中華民國境內租屋供自住且非供營業或執行業務使用者，","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0340003"},{"k":"law","l":"所得稅法","r":"所得稅法第17條第1項第2款第3目之8","q":"其所支付之租金減除接受政府補助部分，每一申報戶每年扣除數額以十八萬元為限。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0340003"}],"f":"房屋租金支出自113年1月1日起由列舉扣除額改列為「特別扣除額」，上限18萬元；題目「特別列舉扣除額」為新舊用語混用，答案18萬元與現行法相同。"}},{"id":"02-02-014","c":"02","t":"02-02","n":"14","q":"依所得稅法規定，納稅義務人、配偶及受扶養直系親屬在中華民國境內租屋，需具備何種條件，其所支付之租金，得採列舉扣除額申報?","o":["供自住且執行業務使用者","供自住兼供營業者","供自住且非供營業或執行業務使用者，","供營業或執行業務使用者"],"a":"C","ty":"gen","e":{"s":"amended","x" awAll.aspx?pcode=G0340102"},{"k":"law","l":"房屋稅條例","r":"房屋稅條例第4條第2項","q":"前項代繳之房屋稅，在其應負擔部分以外之稅款，對於其他共有人有求償權。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0340102"},{"k":"law","l":"房屋稅條例","r":"房屋稅條例第4條第3項","q":"如屬出租，應由承租人負責代繳，抵扣房租。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0340102"}],"nt":"條文所稱「代繳」係指現住人或使用人代繳，求償對象為共有人；選項B「部分共有人代繳」之表述與條文用語不同。"}},{"id":"02-03-005","c":"02","t":"02-03","n":"05","q":"依房屋稅條例規定，房屋為信託財產者，於信託關係存續中，以何者為房屋稅納稅義務人?","o":["自益信託之委託人","受託人","他益信託之受益人","受益人2人以上者，準用共有房屋之規定"],"a":"B","ty":"gen","ns":1,"e":{"s":"ok","x":"房屋稅條例第4條第5項：房屋為信託財產者，於信託關係存續中，以受託人為房屋稅之納稅義務人，故選(B)。","b":[{"k":"law","l":"房屋稅條例","r":"房屋稅條例第4條第5項","q":"房屋為信託財產者，於信託關係存續中，以受託人為房屋稅之納稅義務人。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0340102"}]}},{"id":"02-03-006","c":"02","t":"02-03","n":"06","q":"依房屋稅條例之規定，房屋供自住或公益出租人出租使用者，房屋稅的稅率是多少？","o":["1%","1.2%","1.5%","3%"],"a":"B","ty":"num","e":{"s":"ok","x":"房屋稅條例第5條第1項第1款第1目：住家用房屋供自住、公益出租人出租使用者，為其房屋現值百分之一點二，故選(B)。","b":[{"k":"law","l":"房屋稅條例","r":"房屋稅條例第5條第1項第1款第1目","q":"（一）供自住、公益出租人出租使用或以土地設定地上權之使用權房屋並供該使用權人自住使用者，為其房屋現值百分之一點二。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0340102"}]}},{"id":"02-03-007","c":"02","t":"02-03","n":"07","q":"依房屋稅條例之規定，有關俗稱囤房稅稅率之敘述，下列何者最為正確?","o":["最低不得少於其房屋現值百分之一點五，最高不得超過百分之二點四","最低不得少於其房屋現值百分之二，最高不得超過百分之三點六","最低不得少於其房屋現值百分之二，最高不得超過百分之四點八","最低不少於其房屋現值百分之一點五，最高不超過百分之四點八"],"a":"D","ty":"num","e":{"s":"ok","x":"房屋稅條例第5條第1項第1款第2目至第4目（非自住住家用房屋，即俗稱囤房稅）稅率：出租達一般租金標準或繼承共有者1.5%～2.4%、起造人待銷售房屋2%～3.6%、其他住家用房屋2%～4.8%，整體最低1.5%、最高4.8%，故選(D)。","b":[{"k":"law","l":"房屋稅條例","r":"房屋稅條例第5條第1項第1款第2目","q":"（二）前目以外，出租申報租賃所得達所得稅法第十四條第一項第五類規定之當地一般租金標準者或繼承取得之共有房屋，最低不得少於其房屋現值百分之一點五，最高不得超過百分之二點四。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0340102"},{"k":"law","l":"房屋稅條例","r":"房屋稅條例第5條第1項第1款第3目","q":"（三）起造人持有使用執照所載用途為住家用之待銷售房屋，於起課房屋稅二年內，最低不得少於其房屋現值百分之二，最高不得超過百分之三點六。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0340102"},{"k":"law","l":"房屋稅條例","r":"房屋稅條例第5條第1項第1款第4目","q":"（四）其他住家用房屋，最低不得少於其房屋現值百分之二，最高不得超過百分之四點八。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0340102"}],"nt":"題目問「最為正確」，D為第2目至第4目稅率之整體範圍；C僅為第4目稅率。"}},{"id":"02-03-008","c":"02","t":"02-03","n":"08","q":"依房屋稅條例之規定，非供自住或公益出租人出租使用之房屋，其訂定差別稅率(俗稱囤房稅)之基準為何?","o":["持有房屋棟數","持有房屋面積","持有房屋戶數","持有房屋樓層數"],"a":"C","ty":"gen","e":{"s":"ok","x":"房屋稅條例第5條第2項：直轄市及縣（市）政府應依第1項第1款第2目至第4目，按納稅義務人全國總持有應稅房屋戶數或其他合理需要，分別訂定差別稅率，故選(C)。","b":[{"k":"law","l":"房屋稅條例","r":"房屋稅條例第5條第2項","q":"直轄市及縣（市）政府應依前項第一款第二目至第四目規定，按各該目納稅義務人全國總持有應稅房屋戶數或其他合理需要，分別訂定差別稅率；","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0340102"}]}},{"id":"02-03-009","c":"02","t":"02-03","n":"09","q":"依房屋稅條例規定，有關房屋稅之稅率，下列敘述何者錯誤？","o":["全國單一自住且房屋現值在一定金額以下者為1%","以土地設定地上權之使用權房屋並供該使用權人自住使用者，為其房屋現值1.2%","出租房屋最低不得少於其房屋現值1.5%，最高不得超過2.4%","房屋供地政士事務所使用者，最低不得少於其房屋現值3%，最高不得超過5%"],"a":"C","ty":"neg","e":{"s":"ok","x":"房屋稅條例第5條第1項第1款第2目：1.5%～2.4%之稅率限於「出租申報租賃所得達當地一般租金標準者」或繼承取得之共有房屋，非一切出租房屋均適用（其他住家用房屋依第4目為2%～4.8%），C錯誤；A、B見第1目及但書，D自由職業事務所屬非住家用3%～5%，故選(C)。","b":[{"k":"law","l":"房屋稅條例","r":"房屋稅條例第5條第1項第1款第2目","q":"（二）前目以外，出租申報租賃所得達所得稅法第十四條第一項第五類規定之當地一般租金標準者或繼承取得之共有房屋，最低不得少於其房屋現值百分之一點五，最高不得超過百分之二點四。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0340102"},{"k":"law","l":"房屋稅條例","r":"房屋稅條例第5條第1項第1款第4目","q":"（四）其他住家用房屋，最低不得少於其房屋現值百分之二，最高不得超過百分之四點八。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0340102"},{"k":"law","l":"房屋稅條例","r":"房屋稅條例第5條第1項第1款第1目但書","q":"但本人、配偶及未成年子女於全國僅持有一戶房屋，供自住且房屋現值在一定金額以下者，為其房屋現值百分之一。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0340102"},{"k":"law","l":"房屋稅條例","r":"房屋稅條例第5條第1項第2款","q":"二、非住家用房屋：供營業、私人醫院、診所或自由職業事務所使用者，最低不得少於其房屋現值百分之三，最高不得超過百分之五；","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0340102"}],"nt":"地政士事務所屬自由職業事務所為本題解之涵攝。"}},{"id":"02-03-010","c":"02","t":"02-03","n":"10","q":"依房屋稅條例規定，下列有關自住使用之住家用房屋適用1%計徵房屋稅之要件，何者錯誤?","o":["無出租或供營業情形","房屋所有人本人、配偶或直系親屬於該屋辦竣戶籍登記","房屋所有人本人、配偶及未成年子女於全國僅持有一戶房屋且房屋現值在一定金額以下","房屋所有人本人、配偶或直系親屬實際居住使用"],"a":"C","ty":"neg","e":{"s":"unclear","x":"","b":[],"f":"依房屋稅條例第5條第1項第1款第1目但書，1%稅率要件即「本人、配偶及未成年子女於全國僅持有一戶房屋，供自住且房屋現值在一定金額以下」，與選項C內容相符；A、B、D亦為第5條第4項等自住要件。查無依據說明C為何錯誤，題目或答案有疑義。","nt":"【2026-10-24簡報複查】查倫理規範頁75（房屋稅條例第4、5條）：簡報只列第5條住家用自住1.2%稅率，未載1%但書及自住認定要件，無法說明選項(C)為何錯誤；現行第5條但書內容與(C)相符，疑義仍在，維持 unclear。"}},{"id":"02-03-011","c":"02","t":"02-03","n":"11","q":"依房屋稅條例規定，起造人持有使用執照所載用途為住家用之待銷售房屋，於起課房屋稅二年內，其房屋稅之稅率為何?","o":["最低不得少於其房屋現值百分之一點二，最高不得超過百分之二點四","最低不得少於其房屋現值百分之二，最高不得超過百分之三點六","最低不得少於其房屋現值百分之二，最高不得超過百分之四點八","最低不得少於其房屋現值百分之三，最高不得超過百分之五"],"a":"B","ty":"num","e":{"s":"ok","x":"房屋稅條例第5條第1項第1款第3目：起造人持有使用執照所載用途為住家用之待銷售房屋，於起課房屋稅二年內，最低不得少於房屋現值百分之二，最高不得超過百分之三點六，故選(B)。","b":[{"k":"law","l":"房屋稅條例","r":"房屋稅條例第5條第1項第1款第3目","q":"（三）起造人持有使用執照所載用途為住家用之待銷售房屋，於起課房屋稅二年內，最低不得少於其房屋現值百分之二，最高不得超過百分之三點六。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0340102"}]}},{"id":"02-03-012","c":"02","t":"02-03","n":"12","q":"李先生擁有面積300平方公尺的房屋1幢，同時供住家及非住家使用。依現行房屋稅條例之規定，其適用非住家用稅率課徵房屋稅之面積，最低不得少於多少平方公尺？","o":["30平方公尺","50平方公尺","60平方公尺","150平方公尺"],"a":"B","ty":"neg","e":{"s":"ok","x":"房屋稅條例第5條第1項第3款：房屋同時作住家及非住家用者，非住家用課稅面積最低不得少於全部面積六分之一；300平方公尺×1/6＝50平方公尺，故選(B)。","b":[{"k":"law","l":"房屋稅條例","r":"房屋稅條例第5條第1項第3款","q":"三、房屋同時作住家及非住家用者，應以實際使用面積，分別按住家用或非住家用稅率，課徵房屋稅。但非住家用者，課稅面積最低不得少於全部面積六分之一。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0340102"}]}},{"id":"02-03-013","c":"02","t":"02-03","n":"13","q":"依房屋稅條例規定，各直轄市、縣(市)主管稽徵機關辦理房屋標準價格評定之組織名稱為何？","o":["地價評議委員會","不動產評議委員會","不動產仲裁委員會","不動產糾紛調處委員會"],"a":"B","ty":"gen","e":{"s":"ok","x":"房屋稅條例第9條第1項及第11條第1項：房屋標準價格由直轄市或縣（市）政府組織之「不動產評價委員會」評定，選項中以B最相符，故選(B)。","b":[{"k":"law","l":"房屋稅條例","r":"房屋稅條例第9條第1項","q":"本條例所定不動產評價委員會，由直轄市或縣（市）政府組織之；其組織及運作辦法，由財政部定之。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0340102"},{"k":"law","l":"房屋稅條例","r":"房屋稅條例第11條第1項","q":"房屋標準價格，由不動產評價委員會依據下列事項分別評定，並由直轄市、縣（市）政府公告之：","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0340102"}],"nt":"條文名稱為「不動產評價委員會」，選項B作「不動產評議委員會」，一字之差。"}},{"id":"02-03-014","c":"02","t":"02-03","n":"14","q":"依房屋稅條例規定，不動產評價委員會之組成，其中專家學者及民間團體代表，不得少於委員總數多少？任一性別委員，不得少於委員總數多少？","o":["1/3,1/2","1/2,1/3","1/2,1/2","2/3,2/5"],"a":"B","ty":"neg","e":{"s":"ok","x":"房屋稅條例第9條第2項：不動產評價委員會中專家學者及民間團體代表，不得少於委員總數二分之一；任一性別委員，不得少於委員總數三分之一，故選(B)。","b":[{"k":"law","l":"房屋稅條例","r":"房屋稅條例第9條第2項","q":"其中專家學者及民間團體代表，不得少於委員總數二分之一；任一性別委員，不得少於委員總數三分之一。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0340102"}]}},{"id":"02-03-015","c":"02","t":"02-03","n":"15","q":"依房屋稅條例之規定，房屋稅納稅義務人應於房屋移轉完成之日起多少日內檢附有關文件，向當地主管稽徵機關申報房屋稅籍有關事項及使用情形？","o":["10日","15日","30日","60日"],"a":"C","ty":"num","e":{"s":"ok","x":"房屋稅條例第7條第1項：納稅義務人應於房屋建造完成之日起算三十日內申報房屋稅籍有關事項及使用情形；有移轉、承典時亦同，故移轉亦為三十日內，故選(C)。","b":[{"k":"law","l":"房屋稅條例","r":"房屋稅條例第7條第1項","q":"納稅義務人應於房屋建造完成之日起算三十日內檢附有關文件，向當地主管稽徵機關申報房屋稅籍有關事項及使用情形；其有增建、改建或移轉、承典時，亦同。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0340102"}]}},{"id":"02-03-016","c":"02","t":"02-03","n":"16","q":"房屋使用情形變更，致其應納房屋稅額有增減者，下列敘述何者錯誤？","o":["變更致稅額增加者，納稅義務人應於變更之次期房屋稅開徵四十日以前向當地主管稽徵機關申報","變更致稅額減少者，應於每期開徵四十日以前申報","房屋使用情形變更致稅額增加者，自變更之次期開始適用","使用情形變更致稅額增減者，應自變更之日起30日內申報，並於當期適用變更後之相應稅率"],"a":"D","ty":"neg","e":{"s":"ok","x":"房屋稅條例第7條：使用情形變更致稅額增加者，應於變更之次期開徵四十日以前申報，其他應於每期開徵四十日以前申報；致稅額增加者自變更之次期開始適用。選項D「變更之日起30日內申報、當期適用」與規定不符，故選(D)。","b":[{"k":"law","l":"房屋稅條例","r":"房屋稅條例第7條","q":"房屋使用情形變更，除致稅額增加，納稅義務人應於變更之次期房屋稅開徵四十日以前向當地主管稽徵機關申報外，應於每期開徵四十日以前申報；經核定後使用情形未再變更者，以後免再申報。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0340102"},{"k":"law","l":"房屋稅條例","r":"房屋稅條例第7條","q":"房屋使用情形變更致稅額減少，逾期申報者，自申報之次期開始適用；致稅額增加者，自變更之次期開始適用，逾期申報或未申報者，亦同。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0340102"}]}},{"id":"02-03-017","c":"02","t":"02-03","n":"17","q":"下列何者非屬房屋標準價格之評定事項？","o":["房屋建造材料","房屋耐用年數","房屋使用面積","房屋供需概況"],"a":"C","ty":"neg","e":{"s":"ok","x":"房屋稅條例第11條第1項：房屋標準價格依建造材料（種類及等級）、耐用年數及折舊標準、商業交通情形及房屋之供求概況等事項評定，不含房屋使用面積，故選(C)。","b":[{"k":"law","l":"房屋稅條例","r":"房屋稅條例第11條第1項第1款","q":"一、按各種建造材料所建房屋，區分種類及等級。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0340102"},{"k":"law","l":"房屋稅條例","r":"房屋稅條例第11條第1項第2款","q":"二、各類房屋之耐用年數及折舊標準。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0340102"},{"k":"law","l":"房屋稅條例","r":"房屋稅條例第11條第1項第3款","q":"三、按房屋所處街道村里之商業交通情形及房屋之供求概況，並比較各該不同地段實價登錄之不動產交易價格減除土地價格部分，訂定標準。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0340102"}]}},{"id":"02-03-018","c":"02","t":"02-03","n":"18","q":"房屋標準價格多久重行評定一次？","o":["一年","二年","三年","隨申報地價之日期"],"a":"C","ty":"num","e":{"s":"ok","x":"房屋稅條例第11條第2項：房屋標準價格，每三年重行評定一次，故選(C)。","b":[{"k":"law","l":"房屋稅條例","r":"房屋稅條例第11條第2項","q":"前項房屋標準價格，每三年重行評定一次，並應依其耐用年數予以折舊，按年遞減其價格。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0340102"}]}},{"id":"02-03-019","c":"02","t":"02-03","n":"19","q":"依房屋稅條例規定，納稅義務人對於主管稽徵機關評定之房屋現值如有異議，得於接到通知書之日起幾日內，檢附證件，申請重行核計？","o":["10日","15日","30日","60日"],"a":"C","ty":"num","e":{"s":"ok","x":"房屋稅條例第10條第2項：納稅義務人對核計之房屋現值如有異議，得於接到通知書之日起三十日內，檢附證件，申請重行核計，故選(C)。","b":[{"k":"law","l":"房屋稅條例","r":"房屋稅條例第10條第2項","q":"納稅義務人如有異議，得於接到通知書之日起三十日內，檢附證件，申請重行核計。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0340102"}]}},{"id":"02-03-020","c":"02","t":"02-03","n":"20","q":"房屋稅之納稅義務基準日為何？","o":["八月三十一日","二月之末日","四月三十日","七月一日"],"a":"B","ty":"num","e":{"s":"ok","x":"房屋稅條例第6-1條第1項：房屋稅以每年二月之末日為納稅義務基準日，故選(B)。","b":[{"k":"law","l":"房屋稅條例","r":"房屋稅條例第6-1條第1項","q":"房屋稅以每年二月之末日為納稅義務基準日，由當地主管稽徵機關按房屋稅籍資料核定，於每年五月一日起至五月三十一日止一次徵收，其課稅所屬期間為上一年七月一日起至當年六月三十日止。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0340102"}]}},{"id":"02-03-021","c":"02","t":"02-03","n":"21","q":"有關房屋稅之稽徵，下列何者錯誤？","o":["徵收期間為每年五月一日起至五月三十一日止","課稅所屬期間為上一年七月一日起至當年六月三十日止","課稅所屬期間為當年一月一日起至當年十二月三十一日止","納稅義務基準日為每年二月之末日"],"a":"C","ty":"neg","e":{"s":"ok","x":"房屋稅條例第6-1條第1項：房屋稅於每年五月一日起至五月三十一日止一次徵收，課稅所屬期間為上一年七月一日起至當年六月三十日止，納稅義務基準日為二月之末日；C稱課稅所屬期間為當年一月一日至十二月三十一日，錯誤，故選(C)。","b":[{"k":"law","l":"房屋稅條例","r":"房屋稅條例第6-1條第1項","q":"房屋稅以每年二月之末日為納稅義務基準日，由當地主管稽徵機關按房屋稅籍資料核定，於每年五月一日起至五月三十一日止一次徵收，其課稅所屬期間為上一年七月一日起至當年六月三十日止。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0340102"}]}},{"id":"02-03-022","c":"02","t":"02-03","n":"22","q":"房屋新建、增建、改建或拆除，其房屋稅應如何稽徵?","o":["每年三月一日起至六月三十日止新建、增建或改建完成之房屋，該期間之房屋稅併入次期課徵","上一年七月一日起至當年二月末日止拆除之房屋，其當期房屋稅免予課徵","新建房屋，於當期建造完成者，按月比例計課，未滿六個月者不計","改建房屋所核計之房屋現值，納稅義務人如有異議，得於接到通知書之日起十日內，檢附證件，申請重行核計"],"a":"A","ty":"num","e":{"s":"ok","x":"房屋稅條例第6-1條第3項：每年三月一日起至六月三十日止新建、增建或改建完成之房屋，該期間之房屋稅併入次期課徵（A正確）；同項後段拆除前當期房屋稅仍應課徵、第2項未滿一個月者不計、第10條第2項異議期間為三十日，B、C、D皆錯，故選(A)。","b":[{"k":"law","l":"房屋稅條例","r":"房屋稅條例第6-1條第3項","q":"每年三月一日起至六月三十日止新建、增建或改建完成之房屋，該期間之房屋稅併入次期課徵；","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0340102"},{"k":"law","l":"房屋稅條例","r":"房屋稅條例第6-1條第3項","q":"上一年七月一日起至當年二月末日止拆除之房屋，其尚未拆除期間之當期房屋稅仍應課徵。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0340102"},{"k":"law","l":"房屋稅條例","r":"房屋稅條例第6-1條第2項","q":"新建、增建或改建房屋，於當期建造完成者，按月比例計課，未滿一個月者不計；當期拆除者，亦同。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0340102"},{"k":"law","l":"房屋稅條例","r":"房屋稅條例第10條第2項","q":"納稅義務人如有異議，得於接到通知書之日起三十日內，檢附證件，申請重行核計。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0340102"}]}},{"id":"02-03-023","c":"02","t":"02-03","n":"23","q":"有關房屋稅減免之規定，下列敘述何者正確？","o":["住家用房屋現值在新臺幣十萬元以下者免徵","免稅之房屋，全國合計以三戶為限","受重大災害，毀損面積占整棟面積五成以上，必須修復始能使用之房屋免徵","受重大災害，毀損面積占整棟面積三成以上不及七成之房屋減半徵收"],"a":"C","ty":"num","ns":1,"e":{"s":"ok","x":"房屋稅條例第15條第1項第7款：受重大災害，毀損面積占整棟面積五成以上，必須修復始能使用之房屋，免徵房屋稅（C正確）；第9款十萬元以下免徵限屬自然人持有之住家用房屋且全國合計以三戶為限，第2項第4款減半者為三成以上不及五成，故選(C)。","b":[{"k":"law","l":"房屋稅條例","r":"房屋稅條例第15條第1項第7款","q":"七、受重大災害，毀損面積占整棟面積五成以上，必須修復始能使用之房屋。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0340102"},{"k":"law","l":"房屋稅條例","r":"房屋稅條例第15條第1項第9款","q":"九、住家用房屋現值在新臺幣十萬元以下屬自然人持有者，全國合計以三戶為限。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0340102"},{"k":"law","l":"房屋稅條例","r":"房屋稅條例第15條第2項第4款","q":"四、受重大災害，毀損面積占整棟面積三成以上不及五成之房屋。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0340102"}]}},{"id":"02-03-024","c":"02","t":"02-03","n":"24","q":"依房屋稅條例規定，下列公有房屋，何者仍應課徵房屋稅？","o":["政府機關辦公房屋及其員工宿舍","遭他人占用之房舍","農林試驗所所用之房屋","救濟機構之房屋及其員工宿舍"],"a":"B","ty":"gen","e": .aspx?pcode=G0340102"},{"k":"law","l":"房屋稅條例","r":"房屋稅條例第15條第2項第3款","q":"三、農會所有之自用倉庫及檢驗場，經主管機關證明。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0340102"},{"k":"law","l":"房屋稅條例","r":"房屋稅條例第15條第2項第4款","q":"四、受重大災害，毀損面積占整棟面積三成以上不及五成之房屋。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0340102"}]}},{"id":"02-03-027","c":"02","t":"02-03","n":"27","q":"依房屋稅條例規定，私有房屋有下列何種情形，其房屋稅減半徵收？","o":["政府出售之國民住宅","政府出售之合宜住宅","政府配供貧民居住之房屋","政府平價配售之平民住宅"],"a":"D","ty":"gen","e":{"s":"ok","x":"房屋稅條例第15條第2項第1款：政府平價配售之平民住宅，其房屋稅減半徵收，故選(D)。","b":[{"k":"law","l":"房屋稅條例","r":"房屋稅條例第15條第2項","q":"私有房屋有下列情形之一者，其房屋稅減半徵收：","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0340102"},{"k":"law","l":"房屋稅條例","r":"房屋稅條例第15條第2項第1款","q":"一、政府平價配售之平民住宅。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0340102"}]}},{"id":"02-03-028","c":"02","t":"02-03","n":"28","q":"依房屋稅條例規定，私有房屋有下列情形之一者，其房屋稅減半徵收？","o":["完成財團法人登記且經立案之私立學校辦公使用之自有房屋","無償供政府機關公用或供軍用之房屋","受重大災害，毀損面積佔整棟面積3成以上不及5成之房屋","農會所有之倉庫，專供糧政機關儲存公糧，經主管機關證明者"],"a":"C","ty":"gen","ns":1,"e":{"s":"ok","x":"房屋稅條例第15條第2項第4款：受重大災害，毀損面積占整棟面積三成以上不及五成之房屋，減半徵收；私立學校自有房屋、無償供政府機關公用房屋、農會專供儲存公糧之倉庫，依第1項第1、4、10款為免徵，故選(C)。","b":[{"k":"law","l":"房屋稅條例","r":"房屋稅條例第15條第2項第4款","q":"四、受重大災害，毀損面積占整棟面積三成以上不及五成之房屋。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0340102"},{"k":"law","l":"房屋稅條例","r":"房屋稅條例第15條第1項第1款","q":"一、業經立案之私立學校及學術研究機構，完成財團法人登記者，其供校舍或辦公使用之自有房屋。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0340102"},{"k":"law","l":"房屋稅條例","r":"房屋稅條例第15條第1項第4款","q":"四、無償供政府機關公用或供軍用之房屋。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0340102"},{"k":"law","l":"房屋稅條例","r":"房屋稅條例第15條第1項第10款","q":"十、農會所有之倉庫，專供糧政機關儲存公糧，經主管機關證明。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0340102"}]}},{"id":"02-03-029","c":"02","t":"02-03","n":"29","q":"依房屋稅條例規定，納稅義務人未依規定期限申報，因而發生漏稅者，下列述何者正確？","o":["責令補繳並按所漏稅額處以3倍罰鍰","責令補繳並按所漏稅額處以2倍以下罰鍰","按所漏稅額處以2倍以下罰鍰","按所漏稅額處以1倍以下罰鍰"],"a":"B","ty":"num","e":{"s":"ok","x":"房屋稅條例第16條：納稅義務人未依第7條規定期限申報，因而發生漏稅者，除責令補繳應納稅額外，並按所漏稅額處以二倍以下罰鍰，故選(B)。","b":[{"k":"law","l":"房屋稅條例","r":"房屋稅條例第16條","q":"納稅義務人未依第七條規定之期限申報，因而發生漏稅者，除責令補繳應納稅額外，並按所漏稅額處以二倍以下罰鍰。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0340102"}]}},{"id":"02-03-030","c":"02","t":"02-03","n":"30","q":"依房屋稅條例條規定，房屋稅徵收細則之擬訂，應循何種程序?","o":["各直轄市及縣(市)政府訂定，報各縣市議會備查","各直轄市及縣(市)政府訂定，報財政部備查","財政部訂定報行政院備查","各直轄市及縣(市)政府訂定，報內政部備查"],"a":"B","ty":"gen","e":{"s":"ok","x":"房屋稅條例第24條：房屋稅徵收細則，由各直轄市及縣（市）政府依本條例分別訂定，報財政部備查，故選(B)。","b":[{"k":"law","l":"房屋稅條例","r":"房屋稅條例第24條","q":"房屋稅徵收細則，由各直轄市及縣（市）政府依本條例分別訂定，報財政部備查。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0340102"}]}},{"id":"02-04-001","c":"02","t":"02-04","n":"01","q":"依土地稅法規定，以土地為信託財產，信託關係存續中，以何者為地價稅之納稅義務人？","o":["受託人","委託人","受益人","由受託人與受益人推派一人"],"a":"A","ty":"gen","e":{"s":"ok","x":"土地稅法第3-1條第1項：土地為信託財產者，於信託關係存續中，以受託人為地價稅或田賦之納稅義務人，故選(A)。","b":[{"k":"law","l":"土地稅法","r":"土地稅法第3-1條第1項","q":"土地為信託財產者，於信託關係存續中，以受託人為地價稅或田賦之納稅義務人。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0340096"}]}},{"id":"02-04-002","c":"02","t":"02-04","n":"02","q":"依土地稅法規定，以土地為信託財產，信託利益之受益人為委託人者，其地價稅之計算，該土地應與何者在同一直轄市或縣（市）轄區內所有之土地合併計算地價總額？","o":["受託人","委託人","受益人","由受託人與受益人推派一人"],"a":"B","ty":"gen","e":{"s":"ok","x":"土地稅法第3-1條第2項：信託土地應與委託人在同一直轄市或縣（市）轄區內所有之土地合併計算地價總額；受益人為委託人（自益信託）時即與委託人合併計算，故選(B)。","b":[{"k":"law","l":"土地稅法","r":"土地稅法第3-1條第2項","q":"前項土地應與委託人在同一直轄市或縣（市）轄區內所有之土地合併計算地價總額，依第十六條規定稅率課徵地價稅，分別就各該土地地價占地價總額之比例，計算其應納之地價稅。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0340096"}]}},{"id":"02-04-003","c":"02","t":"02-04","n":"03","q":"依土地稅法規定，以土地為信託財產，信託利益之受益人為委託人以外之第三人，且該受益人已確定並享有全部信託利益者，其地價稅之計算，該土地應與何者在同一直轄市或縣（市）轄區內所有之土地合併計算地價總額？","o":["受託人","委託人","受益人","由受託人與受益人推派一人"],"a":"C","ty":"gen","e":{"s":"ok","x":"土地稅法第3-1條第2項但書：信託利益之受益人為非委託人，且受益人已確定並享有全部信託利益（及委託人未保留變更受益人之權利）者，信託土地應與受益人在同一直轄市或縣（市）轄區內所有之土地合併計算地價總額，故選(C)。","b":[{"k":"law","l":"土地稅法","r":"土地稅法第3-1條第2項但書","q":"但信託利益之受益人為非委託人且符合左列各款規定者，前項土地應與受益人在同一直轄市或縣（市）轄區內所有之土地合併計算地價總額：","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0340096"},{"k":"law","l":"土地稅法","r":"土地稅法第3-1條第2項第1款","q":"一、受益人已確定並享有全部信託利益者。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0340096"}]}},{"id":"02-04-004","c":"02","t":"02-04","n":"04","q":"下列何者非屬得指定土地使用人負責代繳其使用部分地價稅之情形?","o":["納稅義務人戶籍不在所在地","權屬不明","無人管理","土地所有權人申請由占有人代繳"],"a":"A","ty":"neg","e":{"s":"ok","x":"土地稅法第4條第1項：得指定土地使用人代繳地價稅之情形為納稅義務人行蹤不明、權屬不明、無人管理、土地所有權人申請由占有人代繳；「戶籍不在所在地」不在其列，故選(A)。","b":[{"k":"law","l":"土地稅法","r":"土地稅法第4條第1項","q":"土地有左列情形之一者，主管稽徵機關得指定土地使用人負責代繳其使用部分之地價稅或田賦：","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0340096"},{"k":"law","l":"土地稅法","r":"土地稅法第4條第1項第1款","q":"一、納稅義務人行蹤不明者。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0340096"},{"k":"law","l":"土地稅法","r":"土地稅法第4條第1項第2款","q":"二、權屬不明者。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0340096"},{"k":"law","l":"土地稅法","r":"土地稅法第4條第1項第3款","q":"三、無人管理者。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0340096"},{"k":"law","l":"土地稅法","r":"土地稅法第4條第1項第4款","q":"四、土地所有權人申請由占有人代繳者。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0340096"}]}},{"id":"02-04-005","c":"02","t":"02-04","n":"05","q":"下列相關人設立戶籍於該地，何者不符自用住宅用地之條件?","o":["配偶","岳父","土地所有權人","兄弟"],"a":"D","ty":"neg","e":{"s":"ok","x":"土地稅法第9條：自用住宅用地須由土地所有權人或其配偶、直系親屬於該地辦竣戶籍登記（施行細則第9條亦將直系姻親如岳父列入適用順序）；兄弟為與己身出於同源之旁系血親（民法第967條第2項），非直系親屬，故選(D)。","b":[{"k":"law","l":"土地稅法","r":"土地稅法第9條","q":"本法所稱自用住宅用地，指土地所有權人或其配偶、直系親屬於該地辦竣戶籍登記，且無出租或供營業用之住宅用地。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0340096"},{"k":"law","l":"土地稅法施行細則","r":"土地稅法施行細則第9條第1項第4款","q":"四、直系姻親之戶籍所在地。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0340097"},{"k":"law","l":"民法","r":"民法第967條第2項","q":"稱旁系血親者，謂非直系血親，而與己身出於同源之血親。","u":"https://mojlaw.moj.gov.tw/LawContent.aspx?LSID=FL001351&lawNumber=967&TypeSort=2"}]}},{"id":"02-04-006","c":"02","t":"02-04","n":"06","q":"下列何者不符自用住宅用地之條件?","o":["違章建築供住宅使用的土地","工業區違規作住宅使用的土地","尚未建築的住宅區土地","商業區作住宅使用的土地"],"a":"C","ty":"neg","e":{"s":"ok","x":"土地稅法第9條所稱自用住宅用地須為「住宅用地」，施行細則第4條並以其土地上之建築改良物屬土地所有權人或其配偶、直系親屬所有者為限；尚未建築之土地無建築改良物，不符條件，故選(C)。","b":[{"k":"law","l":"土地稅法","r":"土地稅法第9條","q":"本法所稱自用住宅用地，指土地所有權人或其配偶、直系親屬於該地辦竣戶籍登記，且無出租或供營業用之住宅用地。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0340096"},{"k":"law","l":"土地稅法施行細則","r":"土地稅法施行細則第4條","q":"本法第九條之自用住宅用地，以其土地上之建築改良物屬土地所有權人或其配偶、直系親屬所有者為限。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0340097"}]}},{"id":"02-04-007","c":"02","t":"02-04","n":"07","q":"下列何者符合自用住宅用地「無出租或供營業用」之條件?","o":["有收租金，未訂書面租約","禁止承租人設立戶籍","訂定借貸使用契約，定期收取使用償金","將外牆出租作廣告使用"],"a":"D","ty":"gen","e":{"s":"ok","x":"財政部「適用自用住宅用地稅率課徵地價稅認定原則」第三點第（二）款第5目第（1）子目：土地所有權人將其房屋外側壁面供他人繪製廣告或懸掛廣告招牌等收取租金，視為無出租或供營業用，故選(D)。","b":[{"k":"law","l":"適用自用住宅用地稅率課徵地價稅認定原則（財政部）","r":"適用自用住宅用地稅率課徵地價稅認定原則第三點（二）5","q":"其他視為無出租或供營業用之情形","u":"https://law-out.mof.gov.tw/LawContent.aspx?media=print&id=GL009505"},{"k":"law","l":"適用自用住宅用地稅率課徵地價稅認定原則（財政部）","r":"適用自用住宅用地稅率課徵地價稅認定原則第三點（二）5（1）","q":"（1）土地所有權人將其房屋外側壁面供他人繪製廣告或懸掛廣告招牌或屋頂搭建廣告鐵架等收取租金。","u":"https://law-out.mof.gov.tw/LawContent.aspx?media=print&id=GL009505"}]}},{"id":"02-04-008","c":"02","t":"02-04","n":"08","q":"某戶房屋除土地所有權人或其配偶、直系親屬外，尚有他人設有戶籍，試問，下列何種情形，會被推定有「出租」?","o":["親友因學區關係而設籍","前屋主出售後戶籍未遷離","親友無償借住，未經公證","二親等旁系血親無償居住使用"],"a":"C","ty":"gen","e":{"s":"not_found","x":"","b":[],"f":"財政部「自用住宅用地地價稅書面審查作業要點」僅規定他人設籍時應填具申明書表明確無租賃事實（三親等內親屬、前所有權人另有規定），未見「推定出租」或以「未經公證」區分之官方依據，無法支持題庫答案C。","nt":"【2026-10-24簡報複查】查倫理規範頁74–80（所得稅、房屋稅、租賃所得），並搜尋「地價稅／自用住宅／設籍／公證／借住」：簡報沒有自用住宅用地他人設籍推定出租的內容；財政部稅務入口網地價稅節稅手冊也沒有提到「推定出租」或「公證」，維持 not_found。"}},{"id":"02-04-009","c":"02","t":"02-04","n":"09","q":"依土地稅法規定，下列土地何者不課徵地價稅?","o":["農舍用地","一般農業區甲種建築用地","山坡地保育區丙種建築用地","都市計畫住宅區"],"a":"A","ty":"neg","e":{"s":"ok","x":"土地稅法第10條第1項第2款：供與農業經營不可分離之農舍等土地屬農業用地；第22條：非都市土地依法編定之農業用地徵收田賦，第14條規定依第22條課徵田賦者即不課地價稅，故農舍用地不課徵地價稅，故選(A)。","b":[{"k":"law","l":"土地稅法","r":"土地稅法第10條第1項第2款","q":"二、供與農業經營不可分離之農舍、畜禽舍、倉儲設備、曬場、集貨場、農路、灌溉、排水及其他農用之土地。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0340096"},{"k":"law","l":"土地稅法","r":"土地稅法第22條第1項","q":"非都市土地依法編定之農業用地或未規定地價者，徵收田賦。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0340096"},{"k":"law","l":"土地稅法","r":"土地稅法第14條","q":"已規定地價之土地，除依第二十二條規定課徵田賦者外，應課徵地價稅。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0340096"}],"nt":"田賦目前停徵；非都市建築用地及都市計畫住宅區土地均應課徵地價稅。"}},{"id":"02-04-010","c":"02","t":"02-04","n":"10","q":"依土地稅法規定，所稱之「規定地價」，係依據下列何種法律規定辦理？","o":["土地法","平均地權條例","土地稅法","不動產估價師法"],"a":"B","ty":"gen","e":{"s":"ok","x":"平均地權條例第13條：本條例施行區域內，未規定地價之土地，應即全面舉辦規定地價；土地稅法第15條第2項所稱依法定程序辦理規定地價即指此，故選(B)。","b":[{"k":"law","l":"平均地權條例","r":"平均地權條例第13條","q":"本條例施行區域內，未規定地價之土地，應即全面舉辦規定地價。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060009"},{"k":"law","l":"土地稅法","r":"土地稅法第15條第2項","q":"前項所稱地價總額，指每一土地所有權人依法定程序辦理規定地價或重新規定地價，經核列歸戶冊之地價總額。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0340096"}]}},{"id":"02-04-011","c":"02","t":"02-04","n":"11","q":"依土地稅法規定，應以何者為課徵地價稅的稅基?","o":["土地市價總額","公告土地現值總額","歸戶之申報地價總額","按土地市價之一定比例計算"],"a":"C","ty":"gen","e":{"s":"ok","x":"土地稅法第15條：地價稅按每一土地所有權人在每一直轄市或縣（市）轄區內之地價總額（經核列歸戶冊之地價總額）計徵；平均地權條例第17條：已規定地價之土地，應按申報地價徵收地價稅，故稅基為歸戶之申報地價總額，故選(C)。","b":[{"k":"law","l":"土地稅法","r":"土地稅法第15條第1項","q":"地價稅按每一土地所有權人在每一直轄市或縣（市）轄區內之地價總額計徵之。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0340096"},{"k":"law","l":"土地稅法","r":"土地稅法第15條第2項","q":"前項所稱地價總額，指每一土地所有權人依法定程序辦理規定地價或重新規定地價，經核列歸戶冊之地價總額。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0340096"},{"k":"law","l":"平均地權條例","r":"平均地權條例第17條第1項","q":"已規定地價之土地，應按申報地價，依法徵收地價稅。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060009"}]}},{"id":"02-04-012","c":"02","t":"02-04","n":"12","q":"依土地稅法規定，下列土地未依法建築使用，何者非被認定為空地所衡量的要素?","o":["道路設施","電力設施","排水設施","瓦斯系統"],"a":"D","ty":"neg","e":{"s":"ok","x":"土地稅法第11條：空地指已完成道路、排水及電力設施，於有自來水地區並已完成自來水系統，而仍未依法建築使用之土地；瓦斯系統不在衡量要素內，故選(D)。","b":[{"k":"law","l":"土地稅法","r":"土地稅法第11條","q":"本法所稱空地，指已完成道路、排水及電力設施，於有自來水地區並已完成自來水系統，而仍未依法建築使用；或雖建築使用，","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0340096"}]}},{"id":"02-04-013","c":"02","t":"02-04","n":"13","q":"依土地稅法規定，土地雖已依法建築使用仍被認定應予增建、改建或重建而視為空地，下列敘述何者正確?","o":["建物價值不及所占基地申報地價10%者","建物之評定現值不及所占基地公告土地現值10%者","建築工程完成未滿1年以上者","經認定危險建築未重建者"],"a":"A","ty":"num","ns":1,"e":{"s":"ok","x":"土地稅法第11條：雖建築使用，而其建築改良物價值不及所占基地申報地價百分之十，且經直轄市或縣（市）政府認定應予增建、改建或重建者，亦屬空地，故選(A)。","b":[{"k":"law","l":"土地稅法","r":"土地稅法第11條","q":"而其建築改良物價值不及所占基地申報地價百分之十，且經直轄市或縣（市）政府認定應予增建、改建或重建之私有及公有非公用建築用地。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0340096"}]}},{"id":"02-04-014","c":"02","t":"02-04","n":"14","q":"依土地稅法規定，凡經直轄市或縣(市)政府核定應徵空地稅之土地，按該宗土地應納空地稅以何種標準課徵?","o":["基本稅額加徵3至5倍","基本稅額加徵2至5倍","基本稅額加徵5至15倍","基本稅額加徵5至10倍"],"a":"B","ty":"num","e":{"s":"ok","x":"土地稅法第21條：經直轄市或縣（市）政府核定應徵空地稅之土地，按該宗土地應納地價稅基本稅額加徵二至五倍之空地稅，故選(B)。","b":[{"k":"law","l":"土地稅法","r":"土地稅法第21條","q":"凡經直轄市或縣（市）政府核定應徵空地稅之土地，按該宗土地應納地價稅基本稅額加徵二至五倍之空地稅。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0340096"}]}},{"id":"02-04-015","c":"02","t":"02-04","n":"15","q":"依土地稅法規定，直轄市或縣(市)主管機關如擬加徵空地稅，其加徵倍數之決定，下列敘述何者正確?","o":["由直轄市或縣(市)主管機關逕行決定","視都市發展情形擬訂，報議會同意","視都市發展情形擬訂，報財政部同意","視都市發展情形擬訂，報行政院核定"],"a":"D","ty":"gen","e":{"s":"ok","x":"土地稅法施行細則第18條：依土地稅法第21條加徵空地稅之倍數，由直轄市或縣（市）主管機關視都市發展情形擬訂，報行政院核定，故選(D)。","b":[{"k":"law","l":"土地稅法施行細則","r":"土地稅法施行細則第18條","q":"依本法第二十一條規定加徵空地稅之倍數，由直轄市或縣（市）主管機關視都市發展情形擬訂，報行政院核定。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0340097"}]}},{"id":"02-04-016","c":"02","t":"02-04","n":"16","q":"某甲於台北市有3筆空地、1筆自用住宅用地；於台中市有1筆自用住宅用地、1筆公共設施保留地；於台南市有2筆商業用地。請問某甲於全國共有幾張地價稅單?","o":["8張","5張","4張","3張"],"a":"D","ty":"num","e":{"s":"ok","x":"土地稅法第15條第1項：地價稅按每一土地所有權人在每一直轄市或縣（市）轄區內之地價總額計徵；某甲土地分布於臺北市、臺中市、臺南市三個轄區，各合併計徵一張，共3張，故選(D)。","b":[{"k":"law","l":"土地稅法","r":"土地稅法第15條第1項","q":"地價稅按每一土地所有權人在每一直轄市或縣（市）轄區內之地價總額計徵之。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0340096"}]}},{"id":"02-04-017","c":"02","t":"02-04","n":"17","q":"依土地稅法規定，個人之地價總額未超過累進起點地價者，地價稅是按基本稅率徵收。試問，基本稅率是多少?","o":["千分之2","千分之5","萬分之10","千分之10"],"a":"D","ty":"num","e":{"s":"ok","x":"土地稅法第16條第1項：地價稅基本稅率為千分之十，地價總額未超過累進起點地價者按基本稅率徵收，故選(D)。","b":[{"k":"law","l":"土地稅法","r":"土地稅法第16條第1項","q":"地價稅基本稅率為千分之十。土地所有權人之地價總額未超過土地所在地直轄市或縣（市）累進起點地價者，其地價稅按基本稅率徵收；","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0340096"}]}},{"id":"02-04-018","c":"02","t":"02-04","n":"18","q":"依土地稅法規定，累進起點地價，是以各該直轄市或縣(市)土地多少面積之平均地價為準?","o":["3公畝","5公畝","7公畝","10公畝"],"a":"C","ty":"num","e":{"s":"ok","x":"土地稅法第16條第2項：累進起點地價，以各該直轄市或縣（市）土地七公畝之平均地價為準，故選(C)。","b":[{"k":"law","l":"土地稅法","r":"土地稅法第16條第2項","q":"前項所稱累進起點地價，以各該直轄市或縣（市）土地七公畝之平均地價為準。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0340096"}]}},{"id":"02-04-019","c":"02","t":"02-04","n":"19","q":"依土地稅法規定，累進起點地價，以各該直轄市或縣(市)土地7公畝之平均地價為準，但不包括部分用地，下列敘述何種用地應計算在內?","o":["工業用地","礦業用地","未使用之公共設施保留地","蓋違建的農業用地"],"a":"D","ty":"neg","e":{"s":"ok","x":"土地稅法第16條第2項：累進起點地價之計算不包括工業用地、礦業用地、農業用地及免稅土地（未使用之公共設施保留地依第19條免徵）；第10條所稱農業用地須「依法」供農業使用，蓋違建之農業用地非依法供農業使用，應計算在內，故選(D)。","b":[{"k":"law","l":"土地稅法","r":"土地稅法第16條第2項","q":"但不包括工業用地、礦業用地、農業用地及免稅土地在內。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0340096"},{"k":"law","l":"土地稅法","r":"土地稅法第19條","q":"其未作任何使用並與使用中之土地隔離者，免徵地價稅。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0340096"},{"k":"law","l":"土地稅法","r":"土地稅法第10條第1項","q":"本法所稱農業用地，指非都市土地或都市土地農業區、保護區範圍內土地，依法供下列使用者︰","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0340096"}],"nt":"蓋違建之農業用地應計入，係依第10條「依法供下列使用」之涵攝及排除法說明。"}},{"id":"02-04-020","c":"02","t":"02-04","n":"20","q":"依土地稅法規定，地價總額超過累進起點地價，其最高邊際稅率是多少?","o":["千分之55","萬分之55","千分之45","萬分之45"],"a":"A","ty":"num","e":{"s":"ok","x":"土地稅法第16條第1項第5款：地價總額超過累進起點地價二十倍以上者，就其超過部分課徵千分之五十五，為最高邊際稅率，故選(A)。","b":[{"k":"law","l":"土地稅法","r":"土地稅法第16條第1項第5款","q":"五、超過累進起點地價二十倍以上者，就其超過部分課徵千分之五十五。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0340096"}]}},{"id":"02-04-021","c":"02","t":"02-04","n":"21","q":"依土地稅法規定，某甲土地符合自用住宅用地，在一定面積以內，其優惠稅率是多少?","o":["千分之2","千分之5","萬分之10","千分之10"],"a":"A","ty":"num","e":{"s":"ok","x":"土地稅法第17條第1項：合於規定之自用住宅用地，其地價稅按千分之二計徵，故選(A)。","b":[{"k":"law","l":"土地稅法","r":"土地稅法第17條第1項","q":"合於左列規定之自用住宅用地，其地價稅按千分之二計徵：","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0340096"}]}},{"id":"02-04-022","c":"02","t":"02-04","n":"22","q":"依土地稅法規定，某甲土地符合自用住宅用地，在多少面積以內，可以按優惠稅率徵收，下列敘述何者為正確?","o":["都市土地3公畝及非都市土地7公畝以內","都市土地7公畝或非都市土地3公畝以內","都市土地3公畝以及非都市土地7公畝以內","都市土地3公畝或非都市土地7公畝以內"],"a":"D","ty":"num","e":{"s":"ok","x":"土地稅法第17條第1項：自用住宅用地優惠稅率適用於都市土地面積未超過三公畝部分，或非都市土地面積未超過七公畝部分，故選(D)。","b":[{"k":"law","l":"土地稅法","r":"土地稅法第17條第1項第1款","q":"一、都市土地面積未超過三公畝部分。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0340096"},{"k":"law","l":"土地稅法","r":"土地稅法第17條第1項第2款","q":"二、非都市土地面積未超過七公畝部分。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0340096"}]}},{"id":"02-04-023","c":"02","t":"02-04","n":"23","q":"依土地稅法規定，下列何者是勞工宿舍?","o":["興建商業設施兼供勞工居住之用","興建辦公室兼供勞工居住之用","興建廠房兼供勞工居住之用","興建之目的專供勞工居住之用"],"a":"D","ty":"gen","e":{"s":"ok","x":"土地稅法施行細則第10條第2項：土地稅法第17條第2項所稱企業或公營事業興建之勞工宿舍，指興建之目的專供勞工居住之用，故選(D)。","b":[{"k":"law","l":"土地稅法施行細則","r":"土地稅法施行細則第10條第2項","q":"本法第十七條第二項所稱企業或公營事業興建之勞工宿舍，指興建之目的專供勞工居住之用。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0340097"}]}},{"id":"02-04-024","c":"02","t":"02-04","n":"24","q":"依土地稅法規定，某甲有4處自用住宅用地均無出租或營業。1戶供父母居住，1戶供成年子女居住；另2戶供自己與配偶及未成年小孩一起居住。在不考慮其他條件下，某甲有幾處可以適用自用住宅用地優惠稅率?","o":["1戶","2戶","3戶","4戶"],"a":"C","ty":"num","e":{"s":"ok","x":"土地稅法第9條：直系親屬（父母、成年子女）設籍之住宅亦得適用；第17條第3項：土地所有權人與其配偶及未成年之受扶養親屬適用自用住宅用地稅率者以一處為限，故自己一家之2戶僅1處適用，合計1＋1＋1＝3戶，故選(C)。","b":[{"k":"law","l":"土地稅法","r":"土地稅法第9條","q":"本法所稱自用住宅用地，指土地所有權人或其配偶、直系親屬於該地辦竣戶籍登記，且無出租或供營業用之住宅用地。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0340096"},{"k":"law","l":"土地稅法","r":"土地稅法第17條第3項","q":"土地所有權人與其配偶及未成年之受扶養親屬，適用第一項自用住宅用地稅率繳納地價稅者，以一處為限。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0340096"}]}},{"id":"02-04-025","c":"02","t":"02-04","n":"25","q":"依土地稅法規定，土地所有權人申請地價稅之自用住宅用地優惠稅率超過一處時，原則應以以土地所有權人擇定之戶籍所在地為準，但土地所有權人未擇定者，應如何擇定?","o":["地價稅額最高者","按土地所有權人、配偶、未成年受扶養親屬戶籍之順序認定","課稅面積最大者","每平方公尺申報地價最高者"],"a":"A","ty":"gen","e":{"s":"ok","x":"土地稅法施行細則第8條第1項：申請超過一處自用住宅用地時，以土地所有權人擇定之戶籍所在地為準；未擇定者，以申請當年之自用住宅用地地價稅額最高者為準，故選(A)。","b":[{"k":"law","l":"土地稅法施行細則","r":"土地稅法施行細則第8條第1項","q":"土地所有權人未擇定者，以申請當年之自用住宅用地地價稅額最高者為準；其稅額相同者，依土地所有權人、配偶、未成年受扶養親屬戶籍所在地之順序適用。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0340097"}]}},{"id":"02-04-026","c":"02","t":"02-04","n":"26","q":"依土地稅法規定，土地所有權人與其配偶或未成年之受扶養親屬分別以其所有土地申請自用住宅用地者，如未共同擇定適用之戶籍所在地，稽徵機關將如何擇定?","o":["土地所有權人","配偶","未成年受扶養親屬","以三者申請當年度之自用住宅用地地價稅最高者為準"],"a":"D","ty":"gen","e":{"s":"ok","x":"土地稅法施行細則第8條第2項：土地所有權人與其配偶或未成年之受扶養親屬分別申請自用住宅用地者，應以共同擇定之戶籍所在地為準；未擇定者，以三者申請當年之自用住宅用地地價稅額最高者為準，故選(D)。","b":[{"k":"law","l":"土地稅法施行細則","r":"土地稅法施行細則第8條第2項","q":"土地所有權人與其配偶或未成年之受扶養親屬分別以所有土地申請自用住宅用地者，應以共同擇定之戶籍所在地為準；","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0340097"},{"k":"law","l":"土地稅法施行細則","r":"土地稅法施行細則第8條第2項","q":"未擇定者，以土地所有權人與其配偶、未成年之受扶養親屬申請當年之自用住宅用地地價稅額最高者為準。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0340097"}]}},{"id":"02-04-027","c":"02","t":"02-04","n":"27","q":"依土地稅法規定，某乙有4戶(不同地點)均無出租或營業，1戶在鄉下老家，偶而回去住但未設籍，另3戶供自己與配偶及未成年的小孩一起居住但僅設籍於1戶，其他2戶也未設籍，試問，某甲可以適用自用住宅用地優惠稅率有幾戶?","o":["1戶","2戶","3戶","4戶"],"a":"A","ty":"num","e":{"s":"ok","x":"土地稅法第9條：自用住宅用地須於該地辦竣戶籍登記，未設籍之老家及另2戶不符；第17條第3項：本人與配偶及未成年子女適用者以一處為限，故僅設籍之1戶可適用，故選(A)。","b":[{"k":"law","l":"土地稅法","r":"土地稅法第9條","q":"本法所稱自用住宅用地，指土地所有權人或其配偶、直系親屬於該地辦竣戶籍登記，且無出租或供營業用之住宅用地。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0340096"},{"k":"law","l":"土地稅法","r":"土地稅法第17條第3項","q":"土地所有權人與其配偶及未成年之受扶養親屬，適用第一項自用住宅用地稅率繳納地價稅者，以一處為限。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0340096"}]}},{"id":"02-04-028","c":"02","t":"02-04","n":"28","q":"依土地稅法規定，為發展經濟，促進土地利用，增進社會福利，對於某種條件之土地得予適當之減免；其減免標準及程序，授權何種機關定之？","o":["直轄市或縣(市)政府","財政部","內政部","行政院"],"a":"D","ty":"gen","e":{"s":"ok","x":"土地稅法第6條：為發展經濟，促進土地利用，增進社會福利，對特定用途土地得予適當之減免；其減免標準及程序，由行政院定之，故選(D)。","b":[{"k":"law","l":"土地稅法","r":"土地稅法第6條","q":"及重劃、墾荒、改良土地者，得予適當之減免；其減免標準及程序，由行政院定之。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0340096"}]}},{"id":"02-04-029","c":"02","t":"02-04","n":"29","q":"依土地稅法規定，下列何種用地不得適用以基本稅率為固定稅率課徵地價稅？","o":["私立動物園用地","寺廟、教堂用地","都市計畫行政區土地","經主管機關核准設置之加油站"],"a":"C","ty":"neg","e":{"s":"ok","x":"土地稅法第18條第1項：按千分之十（基本稅率）計徵地價稅者為工業、礦業用地，私立公園、動物園、體育場所用地，寺廟、教堂用地，經核准設置之加油站等；都市計畫行政區土地不在其列，故選(C)。","b":[{"k":"law","l":"土地稅法","r":"土地稅法第18條第1項","q":"供左列事業直接使用之土地，按千分之十計徵地價稅。但未按目的事業主管機關核定規劃使用者，不適用之：","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0340096"},{"k":"law","l":"土地稅法","r":"土地稅法第18條第1項第2款","q":"二、私立公園、動物園、體育場所用地。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0340096"},{"k":"law","l":"土地稅法","r":"土地稅法第18條第1項第3款","q":"三、寺廟、教堂用地、政府指定之名勝古蹟用地。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0340096"},{"k":"law","l":"土地稅法","r":"土地稅法第18條第1項第4款","q":"四、經主管機關核准設置之加油站及依都市計畫法規定設置之供公眾使用之停車場用地。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0340096"}]}},{"id":"02-04-030","c":"02","t":"02-04","n":"30","q":"都市計畫公共設施保留地，在保留期間未作任何使用並與使用中之土地隔離者，如何課徵地價稅？","o":["千分之2","千分之6","減半","免徵"],"a":"D","ty":"gen","e":{"s":"ok","x":"土地稅法第19條：都市計畫公共設施保留地，其未作任何使用並與使用中之土地隔離者，免徵地價稅，故選(D)。","b":[{"k":"law","l":"土地稅法","r":"土地稅法第19條","q":"其未作任何使用並與使用中之土地隔離者，免徵地價稅。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0340096"}]}},{"id":"02-04-031","c":"02","t":"02-04","n":"31","q":"依土地稅法規定，關於各種用地的適用優惠稅率或免徵地價稅，下列敘述何者正確？","o":["依法核定之工業區土地按千分之6計徵","已辦妥寺廟登記之寺廟，按千分之10計徵","經核准設立之私立公園，免徵","都市計畫公共設施保留地仍為建築使用者，按千分之2"],"a":"B","ty":"num","e":{"s":"ok","x":"土地稅法第18條第1項第3款：寺廟用地按千分之十計徵（B正確）；工業用地、私立公園依同條亦為千分之十而非千分之六或免徵；第19條公共設施保留地仍為建築使用者，除自用住宅用地外按千分之六計徵，故選(B)。","b":[{"k":"law","l":"土地稅法","r":"土地稅法第18條第1項","q":"供左列事業直接使用之土地，按千分之十計徵地價稅。但未按目的事業主管機關核定規劃使用者，不適用之：","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0340096"},{"k":"law","l":"土地稅法","r":"土地稅法第18條第1項第1款","q":"一、工業用地、礦業用地。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0340096"},{"k":"law","l":"土地稅法","r":"土地稅法第18條第1項第3款","q":"三、寺廟、教堂用地、政府指定之名勝古蹟用地。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0340096"},{"k":"law","l":"土地稅法","r":"土地稅法第19條","q":"都市計畫公共設施保留地，在保留期間仍為建築使用者，除自用住宅用地依第十七條之規定外，統按千分之六計徵地價稅；","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0340096"}]}},{"id":"02-04-032","c":"02","t":"02-04","n":"32","q":"依土地稅法規定，每期地價稅，每戶稅額在新台幣多少元以下免予課徵?","o":["50元","100元","150元","200元"],"a":"B","ty":"num","e":{"s":"ok","x":"土地稅法施行細則第3條第2項：每年地價稅，每戶稅額在新臺幣一百元以下者，免予課徵（地價稅每年一期），故選(B)。","b":[{"k":"law","l":"土地稅法施行細則","r":"土地稅法施行細則第3條第2項","q":"每年地價稅，每戶稅額在新臺幣一百元以下者，免予課徵。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0340097"}]}},{"id":"02-04-033","c":"02","t":"02-04","n":"33","q":"依土地稅法規定，地價稅多久徵收一次?","o":["1年2期","1季1期","視政府公告為準","1年1期"],"a":"D","ty":"num","e":{"s":"ok","x":"土地稅法第40條：地價稅以每年八月三十一日為納稅義務基準日，於十一月一日起一個月內一次徵收當年地價稅，即一年一期，故選(D)。","b":[{"k":"law","l":"土地稅法","r":"土地稅法第40條","q":"於十一月一日起一個月內一次徵收當年地價稅。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0340096"}]}},{"id":"02-04-034","c":"02","t":"02-04","n":"34","q":"甲之土地於114年10月1日出售並移轉登記予乙。試問，依土地稅法之規定，114年期的地價稅之納稅義務人為何？","o":["依各自持有月數分別負擔","甲乙協議","甲","乙"],"a":"C","ty":"gen","e":{"s":"ok","x":"土地稅法第40條：地價稅以每年八月三十一日為納稅義務基準日；甲於114年10月1日始移轉登記予乙，基準日時所有權人為甲，故114年期地價稅由甲繳納，故選(C)。","b":[{"k":"law","l":"土地稅法","r":"土地稅法第40條","q":"地價稅以每年八月三十一日為納稅義務基準日，由直轄市或縣（市）主管稽徵機關按照地政機關編送之地價歸戶冊及地籍異動通知資料核定，","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0340096"}]}},{"id":"02-04-035","c":"02","t":"02-04","n":"35","q":"某甲購買房地供作自用住宅用地使用，但在取得產權同時並未申請適用優惠稅率，試問，下列敘述何者正確?","o":["地價稅開徵60日前申請，即可適用","地價稅開徵40日前申請，即可適用","地價稅開徵日前申請，即可適用","逾期申請者，即以一般稅率課徵"],"a":"B","ty":"case","e":{"s":"ok","x":"土地稅法第41條第1項：適用特別稅率之用地，土地所有權人應於每年地價稅開徵四十日前提出申請，逾期申請者，自申請之次年開始適用，故選(B)。","b":[{"k":"law","l":"土地稅法","r":"土地稅法第41條第1項","q":"土地所有權人應於每年地價稅開徵四十日前提出申請，逾期申請者，自申請之次年開始適用。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0340096"}]}},{"id":"02-04-036","c":"02","t":"02-04","n":"36","q":"自用住宅用地，是否每年均需申請適用優惠稅率，試問，下列敘述何者正確?","o":["已核定而用途未變更，以後免再申請","每3年申請1次","每2年申請1次","原因事實消滅，仍免申報"],"a":"A","ty":"gen","e":{"s":"ok","x":"土地稅法第41條：前已核定而用途未變更者，以後免再申請；原因、事實消滅時則應即申報，故選(A)。","b":[{"k":"law","l":"土地稅法","r":"土地稅法第41條第1項","q":"前已核定而用途未變更者，以後免再申請。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0340096"},{"k":"law","l":"土地稅法","r":"土地稅法第41條第2項","q":"適用特別稅率之原因、事實消滅時，應即向主管稽徵機關申報。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0340096"}]}},{"id":"02-04-037","c":"02","t":"02-04","n":"37","q":"依土地稅法規定，主管稽徵機關應於每年地價稅開徵前多少日，將適用特別稅率之有關規定及其申請手續公告週知?","o":["15日前","30日前","60日前","90日前"],"a":"C","ty":"num","e":{"s":"ok","x":"土地稅法第42條：主管稽徵機關應於每年地價稅開徵六十日前，將適用特別稅率之有關規定及其申請手續公告週知，故選(C)。","b":[{"k":"law","l":"土地稅法","r":"土地稅法第42條","q":"主管稽徵機關應於每年地價稅開徵六十日前，將第十七條及第十八條適用特別稅率課徵地價稅之有關規定及其申請手續公告週知。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0340096"}]}},{"id":"02-04-038","c":"02","t":"02-04","n":"38","q":"依土地稅法規定，某甲的土地原適用自用住宅用地之優惠稅率，但經過1年之後，改為營業使用，未向主管機關主動申報，主管機關除會追補稅款外，並得處多少倍以下之罰鍰?","o":["10倍","5倍","2倍","3倍"],"a":"D","ty":"num","e":{"s":"ok","x":"土地稅法第41條第2項：適用特別稅率之原因、事實消滅時應即申報；第54條第1項第1款：未申報而逃稅或減輕稅賦者，除追補應納部分外，處短匿稅額三倍以下之罰鍰，故選(D)。","b":[{"k":"law","l":"土地稅法","r":"土地稅法第41條第2項","q":"適用特別稅率之原因、事實消滅時，應即向主管稽徵機關申報。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0340096"},{"k":"law","l":"土地稅法","r":"土地稅法第54條第1項第1款","q":"逃稅或減輕稅賦者，除追補應納部分外，處短匿稅額或賦額三倍以下之罰鍰。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0340096"}]}},{"id":"02-05-001","c":"02","t":"02-05","n":"01","q":"依所得稅法之規定，財產無償借與他人使用時，下列說明何者為所得稅法之規定?","o":["皆應參照當地一般租金情況，計算租賃收入，繳納所得稅。","除經查明確係無償供營業或執行業務者使用外，皆應參照當地一般租金情況，計算租賃收入，繳納所得稅。","皆應參照當地一般租金情況，計算租賃收入，且不得扣除必要耗損及費用。","無需申報租賃所得及繳納所得稅。"],"a":"B","ty":"gen","e":{"s":"ok","x":"所得稅法第14條第1項第5類第4款：將財產借與他人使用，除經查明確係無償且非供營業或執行業務者使用外，應參照當地一般租金情況計算租賃收入繳納所得稅，故選(B)。","b":[{"k":"law","l":"所得稅法","r":"所得稅法第14條第1項第5類第4款","q":"四、將財產借與他人使用，除經查明確係無償且非供營業或執行業務者使用外，應參照當地一般租金情況，計算租賃收入，繳納所得稅。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0340003"}],"nt":"選項B文字「除經查明確係無償供營業或執行業務者使用外」與條文「確係無償且非供營業或執行業務者使用」略有出入，仍以B最接近條文。"}},{"id":"02-05-002","c":"02","t":"02-05","n":"02","q":"所得稅法有關押金之規定，下列何者正確?","o":["財產出租，收有押金或任何款項類似押金者，均應就各該款項按當地銀行業通行之1年期存款利率，計算租賃收入","財產出租，收有押金或任何款項類似押金者，均應就各該款項按當地銀行業通行之6個月存款利率，計算租賃收入","財產出租，收有押金或任何款項類似押金者，均應就各該款項按當地銀行業通行之1年貸款利率，計算租賃收入","財產出租，收有押金或任何款項類似押金者，均應就各該款項按當地銀行業通行之6個月貸款利率，計算租賃收入"],"a":"A","ty":"num","e":{"s":"ok","x":"所得稅法第14條第1項第5類第3款：財產出租收有押金或任何款項類似押金者，均應就各該款項按當地銀行業通行之一年期存款利率計算租賃收入，故選(A)。","b":[{"k":"law","l":"所得稅法","r":"所得稅法第14條第1項第5類第3款","q":"三、財產出租，收有押金或任何款項類似押金者，或以財產出典而取得典價者，均應就各該款項按當地銀行業通行之一年期存款利率，計算租賃收入。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0340003"}]}},{"id":"02-05-003","c":"02","t":"02-05","n":"03","q":"所得稅法有關租金所得之規定，下列何者正確？","o":["租金所得應由扣繳義務人於給付時，依規定之扣繳率或扣繳辦法，扣取稅款","租金所得應由納稅義務人於收取時，依規定之扣繳率或扣繳辦法，扣取稅款繳至稅局","租金所得稅金應由扣繳義務人負擔並自行扣繳稅款繳至稅局","租金所得應由納稅義務人分離課稅申報租金收入"],"a":"A","ty":"gen","e":{"s":"ok","x":"所得稅法第88條第1項：納稅義務人有該條所列所得（第2款含機關、團體、事業等給付之租金）者，應由扣繳義務人於給付時，依規定之扣繳率或扣繳辦法扣取稅款，故選(A)。","b":[{"k":"law","l":"所得稅法（第88條、第89條，113-08-07修正公布條文）","r":"所得稅法第88條第1項","q":"納稅義務人有下列各類所得者，應由扣繳義務人於給付時，依規定之扣繳率或扣繳辦法，扣取稅款，並依第九十二條規定繳納之：","u":"https://www.president.gov.tw/File/Doc/f8720a47-2578-4f6c-ad44-2508a63a8929"},{"k":"law","l":"所得稅法（第88條、第89條，113-08-07修正公布條文）","r":"所得稅法第88條第1項第2款","q":"二、機關、行政法人、團體、學校、事業、破產財團之破產管理人、執行業務者或信託行為之受託人因管理、處分信託財產所給付之薪資、利息、租金、佣金、權利金、","u":"https://www.president.gov.tw/File/Doc/f8720a47-2578-4f6c-ad44-2508a63a8929"}]}},{"id":"02-05-004","c":"02","t":"02-05","n":"04","q":"依所得稅法之規定，承租人如自然人且為中華民國居住者，請問租金所得之稅額扣繳及申報，下列說明何者較為正確?","o":["由出租方納稅義務人自行扣繳稅款並繳於國庫","自然人承租方非扣繳義務人，無須代出租方扣繳稅款，納稅義務人於所得隔年5月1日至5月31日依租約自行申報租金所得及納稅","納稅義務人該筆所得免稅","自然人承租方依法為扣繳義務人，應依規定期間及扣繳率進行扣繳義務"],"a":"B","ty":"gen","e":{"s":"ok","x":"所得稅法第89條第1項第2款：租金之扣繳義務人為機關、行政法人、團體、學校、事業、破產管理人、執行業務者或受託人，自然人承租人不在其列，無須扣繳；出租人應依第71條第1項於每年五月一日起至五月三十一日止自行結算申報，故選(B)。","b":[{"k":"law","l":"所得稅法（第88條、第89條，113-08-07修正公布條文）","r":"所得稅法第89條第1項第2款","q":"其扣繳義務人為機關、行政法人、團體、學校、事業、破產財團之破產管理人、執行業務者或信託行為之受託人；納稅義務人為取得所得者。","u":"https://www.president.gov.tw/File/Doc/f8720a47-2578-4f6c-ad44-2508a63a8929"},{"k":"law","l":"所得稅法（第71條、第73條）","r":"所得稅法第71條第1項","q":"納稅義務人應於每年五月一日起至五月三十一日止，填具結算申報書，向該管稽徵機關，申報其上一年度內構成綜合所得總額或營利事業收入總額之項目及數額","u":"https://web.law.ntpc.gov.tw/Scripts/FLAWDOC02.aspx?rtype=H&RCODE2=B0160016&RNO=71"}]}},{"id":"02-05-005","c":"02","t":"02-05","n":"05","q":"依所得稅法之規定，扣繳義務人行蹤不明，下列說明何者為所得稅法之規定?","o":["扣繳義務人未履行扣繳責任，稽徵機關不得逕向納稅義務人徵收稅款之","扣繳義務人未履行扣繳責任，納稅義務人無需納稅","扣繳義務人未履行扣繳責任，稽徵機關得逕向納稅義務人徵收收取罰鍰","扣繳義務人未履行扣繳責任，而有行蹤不明或其他情事，致無從追究者，稽徵機關得逕向納稅義務人徵收之"],"a":"D","ty":"gen","e":{"s":"ok","x":"所得稅法第89條第2項：扣繳義務人未履行扣繳責任，而有他遷不明、行蹤不明或其他情事，致無從追究者，稽徵機關得逕向納稅義務人徵收之，故選(D)。","b":[{"k":"law","l":"所得稅法（第88條、第89條，113-08-07修正公布條文）","r":"所得稅法第89條第2項","q":"扣繳義務人未履行扣繳責任，而有他遷不明、行蹤不明或其他情事，致無從追究者，稽徵機關得逕向納稅義務人徵收之。","u":"https://www.president.gov.tw/File/Doc/f8720a47-2578-4f6c-ad44-2508a63a8929"}],"nt":"113-08-07修正後條文增列「他遷不明」，題目選項D為修正前文字，結論相同。"}},{"id":"02-05-006","c":"02","t":"02-05","n":"06","q":"依各類所得扣繳率標準之規定，納稅義務人為中華民國境內居住之個人，有關租金之所得扣繳率下列何者正確?","o":["20%","15%","5%","10%"],"a":"D","ty":"num","e":{"s":"ok","x":"各類所得扣繳率標準第2條第1項第5款：納稅義務人為中華民國境內居住之個人，租金按給付額扣取百分之十，故選(D)。","b":[{"k":"law","l":"各類所得扣繳率標準","r":"各類所得扣繳率標準第2條第1項","q":"納稅義務人如為中華民國境內居住之個人，或在中華民國境內有固定營業場所之營利事業，按下列規定扣繳：","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0340028"},{"k":"law","l":"各類所得扣繳率標準","r":"各類所得扣繳率標準第2條第1項第5款","q":"五、租金按給付額扣取百分之十。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0340028"}]}},{"id":"02-05-007","c":"02","t":"02-05","n":"07","q":"依各類所得扣繳率標準之規定，納稅義務人為非中華民國境內居住之個人，有關租金之所得扣繳率下列何者正確?","o":["20%","15%","5%","10%"],"a":"A","ty":"num","e":{"s":"ok","x":"各類所得扣繳率標準第3條第1項第5款：納稅義務人為非中華民國境內居住之個人，租金按給付額扣取百分之二十，故選(A)。","b":[{"k":"law","l":"各類所得扣繳率標準","r":"各類所得扣繳率標準第3條第1項","q":"納稅義務人如為非中華民國境內居住之個人，或在中華民國境內無固定營業場所之營利事業，按下列規定扣繳：","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0340028"},{"k":"law","l":"各類所得扣繳率標準","r":"各類所得扣繳率標準第3條第1項第5款","q":"五、租金按給付額扣取百分之二十。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0340028"}]}},{"id":"02-05-008","c":"02","t":"02-05","n":"08","q":"依所得稅法及施行細則規定，將財產無償借與他人使用者時，下列說明何者最正確?","o":["應由雙方當事人訂立無償借用契約，經雙方當事人以外之2人證明確係無償借用","無須申報租金收入","只需由雙方當事人訂立無償借用契約以資證明","無需申報租金收入，但出借人需申報贈與"],"a":"A","ty":"gen","e":{"s":"ok","x":"所得稅法施行細則第88條：將財產無償借與他人使用者，應由雙方當事人訂立無償借用契約，經雙方當事人以外之二人證明確係無償借用（並辦竣公證）；選項A最符合，故選(A)。","b":[{"k":"law","l":"所得稅法施行細則","r":"所得稅法施行細則第88條","q":"將財產無償借與他人使用者，應由雙方當事人訂立無償借用契約，經雙方當事人以外之二人證明確係無償借用，並依公證法之規定辦竣公證。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0340004"}],"nt":"現行條文另要求依公證法辦竣公證，選項A未載此要件，但為最正確選項。"}},{"id":"02-05-009","c":"02","t":"02-05","n":"09","q":"依各類所得扣繳率標準規定，中華民國境內居住之個人，其每次應扣繳稅額多少者，扣繳義務人得免辦理扣繳？","o":["每次應扣繳稅額不超過新臺幣1,000元者，免予扣繳","每次應扣繳稅額不超過新臺幣20,000元者，免予扣繳","每次應扣繳稅額不超過新臺幣10,000元者，免予扣繳","每次應扣繳稅額不超過新臺幣2,000元者，免予扣繳"],"a":"D","ty":"num","e":{"s":"ok","x":"各類所得扣繳率標準第13條第1項：中華民國境內居住之個人有第2條規定之所得，扣繳義務人每次應扣繳稅額不超過新臺幣二千元者，免予扣繳，故選(D)。","b":[{"k":"law","l":"各類所得扣繳率標準","r":"各類所得扣繳率標準第13條第1項","q":"中華民國境內居住之個人如有第二條規定之所得，扣繳義務人每次應扣繳稅額不超過新臺幣二千元者，免予扣繳。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0340028"}]}},{"id":"02-05-010","c":"02","t":"02-05","n":"10","q":"依全民健康保險法及相關解釋，租金所得單次給付達多少需扣繳二代健保，下列何者正確?","o":["新臺幣20,000元","新臺幣2,000元","新臺幣5,000元","最低工資"],"a":"A","ty":"num","e":{"s":"ok","x":"全民健康保險扣取及繳納補充保險費辦法第3條第1項第6款將租金收入列為補充保險費之所得類別；第4條第1項：扣費義務人給付該類所得，單次給付金額達新臺幣二萬元者，應扣取補充保險費，故選(A)。","b":[{"k":"law","l":"全民健康保險扣取及繳納補充保險費辦法","r":"補充保費辦法第3條第1項第6款","q":"六、租金收入：指所得稅法第十四條第一項第五類第一款所稱之租賃收入及第二款所稱之租賃所得。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=L0060027"},{"k":"law","l":"全民健康保險扣取及繳納補充保險費辦法","r":"補充保費辦法第4條第1項","q":"扣費義務人給付本法第三十一條第一項各類所得時，其單次給付金額達新臺幣二萬元者，應按規定之補充保險費率扣取補充保險費","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=L0060027"}]}},{"id":"02-05-011","c":"02","t":"02-05","n":"11","q":"依財產租賃必要損耗及費用標準相關規定，中華民國境內居住之個人僅出租土地之收入，必要損耗及費用之規定，下列規定何者較正確?","o":["不得減除該土地當年度繳納之地價稅及當年標準所訂之費用耗損率","得減除當年標準所訂之費用耗損率但不得減除該土地當年度繳納之地價稅","只得減除該土地當年度繳納之地價稅，不得減除當年標準所訂之費用耗損率","得減除該土地當年度繳納之地價稅及當年標準所訂之費用耗損率"],"a":"C","ty":"gen","e":{"s":"ok","x":"財政部114年度財產租賃必要損耗及費用標準第一點：固定資產必要損耗及費用減除百分之四十三，但僅出租土地之收入，僅得減除該土地當年度繳納之地價稅，不得減除百分之四十三，故選(C)。","b":[{"k":"law","l":"一百十四年度財產租賃必要損耗及費用標準（財政部令）","r":"114年度財產租賃必要損耗及費用標準第一點","q":"一、固定資產：必要損耗及費用減除百分之四十三。但僅出租土地之收入，僅得減除該土地當年度繳納之地價稅，不得減除百分之四十三。","u":"https://law-out.mof.gov.tw/LawContent.aspx?id=GL011699"}]}},{"id":"02-05-012","c":"02","t":"02-05","n":"12","q":"依所得稅法及其施行細則相關規定，納稅義務人、配偶及受扶養直系親屬在中華民國境內租屋供自住且非供營業或執行業務使用者，其所支付之租金特別扣除額之規定，下列規定何者較正確?","o":["每一申報戶每年特別扣除額以270,000元為限。但申報有購屋借款利息者，不得扣除","每一個人每年特別扣除額以270,000元為限","每一申報戶每年特別扣除額以180,000元為限。但申報有購屋借款利息者，不得扣除","每一個人每年特別扣除額以120,000元為限"],"a":"C","ty":"num","e":{"s":"amended","x":"所得稅法第17條第1項第2款第3目之8：房屋租金支出特別扣除，每一申報戶每年扣除數額以十八萬元為限（以申報戶而非個人計），故選(C)。","b":[{"k":"law","l":"所得稅法","r":"所得稅法第17條第1項第2款第3目之8","q":"其所支付之租金減除接受政府補助部分，每一申報戶每年扣除數額以十八萬元為限。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0340003"},{"k":"law","l":"所得稅法","r":"所得稅法第17條第1項第2款第3目之8","q":"但納稅義務人、配偶或受扶養直系親屬在中華民國境內有房屋者，不得扣除。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0340003"}],"f":"現行條文（115-09-11修正版）但書為「納稅義務人、配偶或受扶養直系親屬在中華民國境內有房屋者，不得扣除」，並須減除接受政府補助部分；選項C之但書「申報有購屋借款利息者，不得扣除」為修正前規定。18萬元、每一申報戶之結論與現行法相同，仍以C為正確選項。"}},{"id":"02-05-013","c":"02","t":"02-05","n":"13","q":"依所得稅法規定，非中華民國境內居住者之所得申報敘述，下列何者較正確?","o":["在中華民國境內有租賃所得者，其應納所得稅應由扣繳義務人於給付時，依規定之扣繳率扣繳之","於所得年度次年5月1日至5月31日申報租賃所得","依稅局核定稅額繳納之","非中華民國境內居住者，故其所得免稅"],"a":"A","ty":"gen","e":{"s":"ok","x":"所得稅法第73條第1項：非中華民國境內居住之個人，在境內有第88條規定之各項所得者，不適用第71條結算申報規定，其應納所得稅應由扣繳義務人於給付時依規定之扣繳率扣繳之（租金扣繳率依扣繳率標準第3條為百分之二十），故選(A)。","b":[{"k":"law","l":"所得稅法（第71條、第73條）","r":"所得稅法第73條第1項","q":"在中華民國境內有第八十八條規定之各項所得者，不適用第七十一條關於結算申報之規定，","u":"https://web.law.ntpc.gov.tw/Scripts/FLAWDOC02.aspx?rtype=H&RCODE2=B0160016&RNO=71"},{"k":"law","l":"所得稅法（第71條、第73條）","r":"所得稅法第73條第1項","q":"其應納所得稅應由扣繳義務人於給付時，依規定之扣繳率扣繳之；","u":"https://web.law.ntpc.gov.tw/Scripts/FLAWDOC02.aspx?rtype=H&RCODE2=B0160016&RNO=71"},{"k":"law","l":"各類所得扣繳率標準","r":"各類所得扣繳率標準第3條第1項第5款","q":"五、租金按給付額扣取百分之二十。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0340028"}]}},{"id":"02-05-014","c":"02","t":"02-05","n":"14","q":"依所得稅法及施行細則規定，納稅義務人申報機關之說明，下列何者較正確?","o":["營利事業應向其申報時營運所在地之稽徵機關辦理申報","綜合所得稅納稅義務人應向其申報時戶籍所在地稽徵機關辦理申報","營利事業之總機構在中華民國境內，並設有其他固定營業場所者，應由該營利事業之總機構向其申報時營運地之稽徵機關合併辦理申報","國外營利事業在中華民國境內無固定營業場所而有營業代理人者，營業代理人應向其申報時營運地之稽徵機關辦理申報"],"a":"B","ty":"gen","e":{"s":"ok","x":"所得稅法施行細則第49條：綜合所得稅納稅義務人應向其申報時戶籍所在地之稽徵機關辦理申報；營利事業、總機構合併申報及營業代理人均係向「申報時登記地」之稽徵機關申報，非營運地或營運所在地，故選(B)。","b":[{"k":"law","l":"所得稅法施行細則","r":"所得稅法施行細則第49條第1項","q":"綜合所得稅納稅義務人應向其申報時戶籍所在地之稽徵機關辦理申報；營利事業應向其申報時登記地之稽徵機關辦理申報。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0340004"},{"k":"law","l":"所得稅法施行細則","r":"所得稅法施行細則第49條第2項","q":"應由該營利事業之總機構向其申報時登記地之稽徵機關合併辦理申報。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0340004"},{"k":"law","l":"所得稅法施行細則","r":"所得稅法施行細則第49條第3項","q":"營業代理人應向其申報時登記地之稽徵機關辦理申報。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0340004"}]}},{"id":"03-01-001","c":"03","t":"03-01","n":"01","q":"依照消費者保護法及其相關規定，關於消費爭議之調解，當事人不能合意但已甚接近者，調解委員得斟酌一切情形，求兩造利益之平衡，於不違反兩造當事人之主要意思範圍內，依職權提出解決事件之方案，並送達於當事人。當事人若有異議，得於通知送達後幾日之不變期間內提出異議，否則，視為該方案已調解成立？","o":["10日","15日","20日","30日"],"a":"A","ty":"neg","e":{"s":"ok","x":"依消保法第45條之2、第45條之3，調解委員依職權提出的解決方案送達後，當事人可在10日不變期間內異議，逾期未異議即視為依方案成立調解，故選(A)。","b":[{"k":"law","l":"消費者保護法","r":"消保法第45條之2第1項","m":"當事人無法合意但已相當接近時，調解委員可衡酌一切情形、平衡雙方利益，在不違反雙方主要意思下依職權提出解決方案並送達。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=J0170001"},{"k":"law","l":"消費者保護法","r":"消保法第45條之3","m":"當事人對依職權提出的方案，可於送達後10日不變期間內異議；有異議視為調解不成立，逾期未異議則視為依該方案成立調解。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=J0170001"}]}},{"id":"03-01-002","c":"03","t":"03-01","n":"02","q":"依照消費者保護法及其相關規定，企業經營者與消費者訂立定型化契約前，應有多少日內之合理期間，供消費者審閱全部條款內容？","o":["10日","15日","20日","30日"],"a":"D","ty":"num","e":{"s":"ok","x":"消保法第11條之1第1項要求企業經營者在訂定型化契約前，給消費者30日以內的合理期間審閱全部條款，故選(D)。","b":[{"k":"law","l":"消費者保護法","r":"消保法第11條之1第1項","m":"企業經營者在與消費者簽訂定型化契約前，須給予消費者30日以內的合理期間，讓其審閱全部條款。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=J0170001"}]}},{"id":"03-01-003","c":"03","t":"03-01","n":"03","q":"依照消費者保護法及其相關規定，直轄市、縣（市）政府應設置何單位，辦理消費者之諮詢服務、教育宣導及申訴事項？","o":["消費者保護委員會","消費者保護團體","消費者服務中心","消費爭議調解委員會"],"a":"C","ty":"gen","e":{"s":"ok","x":"消保法第42條第1項規定直轄市、縣（市）政府應設消費者服務中心，負責諮詢服務、教育宣導與申訴，故選(C)。","b":[{"k":"law","l":"消費者保護法","r":"消保法第42條第1項","m":"直轄市、縣（市）政府應設置消費者服務中心，負責消費者諮詢服務、教育宣導及申訴等事項。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=J0170001"}]}},{"id":"03-01-004","c":"03","t":"03-01","n":"04","q":"依照消費者保護法及其相關規定，消費者保護團體以自己名義提起消費者保護法第50條之訴訟，其標的價額超過新台幣多少者，超過部分免繳裁判費？","o":["30萬元","50萬元","40萬元","60萬元"],"a":"D","ty":"num","e":{"s":"ok","x":"消保法第52條：消保團體以自己名義提起第50條訴訟，標的價額超過新臺幣60萬元的部分免繳裁判費，故選(D)。","b":[{"k":"law","l":"消費者保護法","r":"消保法第52條","m":"消保團體以自己名義提起第50條訴訟，標的價額超過新臺幣60萬元的部分免繳裁判費。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=J0170001"}]}},{"id":"03-01-005","c":"03","t":"03-01","n":"05","q":"依照消費者保護法及其相關規定，定型化契約條款如有疑義時，應如何處理？","o":["應為有利於企業經營者之解釋","應為有利於消費者之解釋","應由當事人雙方自行協議","應提起消費者爭議調解"],"a":"B","ty":"gen","e":{"s":"ok","x":"消保法第11條第2項：定型化契約條款有疑義時，應作有利於消費者的解釋，故選(B)。","b":[{"k":"law","l":"消費者保護法","r":"消保法第11條第2項","m":"定型化契約條款文義有疑義時，解釋上應偏向對消費者有利。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=J0170001"}]}},{"id":"03-01-006","c":"03","t":"03-01","n":"06","q":"依照消費者保護法及其相關規定，消費者保護團體之設立宗旨為何？","o":["保護消費者權益，推行消費者教育","接受消費者申訴，調解消費爭議","提昇國民消費生活品質","提供消費者資訊諮詢，檢驗商品、服務品質"],"a":"A","ty":"gen","e":{"s":"ok","x":"消保法第27條第2項定消保團體的宗旨為保護消費者權益及推行消費者教育，故選(A)。","b":[{"k":"law","l":"消費者保護法","r":"消保法第27條第2項","m":"消保團體成立目的在於維護消費者權益並推廣消費者教育。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=J0170001"}]}},{"id":"03-01-007","c":"03","t":"03-01","n":"07","q":"依照消費者保護法及其相關規定，建商銷售房屋致使眾多購屋者受害時，得受讓多少人以上之購屋者的損害賠償請求權後，消費者保護團體得以自己名義提起訴訟？","o":["10人","20人","15人","5人"],"a":"B","ty":"num","e":{"s":"ok","x":"消保法第50條第1項：同一原因事件致眾多消費者受害時，消保團體須受讓20人以上的損害賠償請求權，才能以自己名義起訴，故選(B)。","b":[{"k":"law","l":"消費者保護法","r":"消保法第50條第1項","m":"同一原因事件使眾多消費者受害時，消保團體受讓20人以上的損害賠償請求權後，可用自己名義起訴；消費者在言詞辯論終結前可終止讓與並通知法院。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=J0170001"}]}},{"id":"03-01-008","c":"03","t":"03-01","n":"08","q":"依照消費者保護法及其相關規定，當事者接獲消費爭議之調解事件解決方案書時，若未能在送達後幾日內之不變期間提出異議者，則視為已依該方案成立調解？","o":["10日","15日","20日","3日"],"a":"A","ty":"num","e":{"s":"ok","x":"消保法第45條之3：對依職權提出的解決方案，當事人須於送達後10日不變期間內異議，未異議者視為依方案成立調解，故選(A)。","b":[{"k":"law","l":"消費者保護法","r":"消保法第45條之3","m":"當事人對依職權提出的方案，可於送達後10日不變期間內異議；有異議視為調解不成立，逾期未異議則視為依該方案成立調解。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=J0170001"}]}},{"id":"03-01-009","c":"03","t":"03-01","n":"09","q":"依照消費者保護法及其相關規定，關於小額消費爭議之額度，是由何者訂之？","o":["行政院","消費者保護團體","消保官","消費爭議調解委員會"],"a":"A","ty":"gen","e":{"s":"ok","x":"消保法第45條之4第4項規定小額消費爭議的額度由行政院定之，故選(A)。","b":[{"k":"law","l":"消費者保護法","r":"消保法第45條之4第4項","m":"小額消費爭議的金額標準由行政院訂定。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=J0170001"}]}},{"id":"03-01-010","c":"03","t":"03-01","n":"10","q":"依消費者保護法之規定，定型化契約條款如有疑義時，應為有利於何人之解釋？","o":["企業經營者","政府","消費者","消費者保護團體"],"a":"C","ty":"gen","e":{"s":"ok","x":"消保法第11條第2項：定型化契約條款有疑義時，應作有利於消費者的解釋，故選(C)。","b":[{"k":"law","l":"消費者保護法","r":"消保法第11條第2項","m":"定型化契約條款文義有疑義時，解釋上應偏向對消費者有利。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=J0170001"}]}},{"id":"03-01-011","c":"03","t":"03-01","n":"11","q":"依照消費者保護法及其相關規定，企業經營者與消費者訂立定型化契約前，如未能提供合理期間供消費者審閱全部條款內容時，下列何者正確？","o":["其條款無需經消費者之主張，仍構成契約之內容","其條款不構成契約之內容，且消費者亦不得主張該條款構成契約之內容","其條款不構成契約之內容，但消費者得主張該條款仍構成契約之內容","其條款構成契約之內容，但消費者得主張該條款不構成契約之內容"],"a":"C","ty":"gen","e":{"s":"ok","x":"消保法第11條之1第3項：未給予合理審閱期間時，該條款原則上不構成契約內容，但消費者仍可主張其構成契約內容，故選(C)。","b":[{"k":"law","l":"消費者保護法","r":"消保法第11條之1第3項","m":"違反審閱期規定時，相關條款原則上不納入契約內容；但消費者可以主張該條款仍屬契約內容。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=J0170001"}]}},{"id":"03-01-012","c":"03","t":"03-01","n":"12","q":"依照消費者保護法及其相關規定，定型化契約中之定型化契約條款牴觸個別磋商條款之約定時，下列何者正確？","o":["定型化契約中之定型化契約條款牴觸個別磋商條款部分無效","個別磋商條款牴觸定型化契約中之定型化契約條款部分無效","定型化契約中之定型化契約條款牴觸個別磋商條款時，兩者皆無效","定型化契約中之定型化契約條款牴觸個別磋商條款時，兩者皆有效，以有利消費者之條款為主"],"a":"A","ty":"gen","e":{"s":"ok","x":"消保法第15條：定型化契約條款與個別磋商條款牴觸時，牴觸部分的定型化條款無效（個別磋商條款優先），故選(A)。","b":[{"k":"law","l":"消費者保護法","r":"消保法第15條","m":"定型化條款與雙方個別協商的約定互相衝突時，衝突部分的定型化條款無效。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=J0170001"}]}},{"id":"03-01-013","c":"03","t":"03-01","n":"13","q":"依消費者保護法第45條之規定，直轄市、縣（市）政府應設消費爭議調解委員會，並置委員幾名？","o":["5至7名","5至9名","7至21名","15至21名"],"a":"C","ty":"num","e":{"s":"ok","x":"消保法第45條第1項規定消費爭議調解委員會置委員7至21名，故選(C)。","b":[{"k":"law","l":"消費者保護法","r":"消保法第45條第1項","m":"各直轄市與縣（市）政府須設立消費爭議調解委員會，委員人數7至21人。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=J0170001"}]}},{"id":"03-01-014","c":"03","t":"03-01","n":"14","q":"依照消費者保護法及其相關規定，由消費者保護官同意後，得以自己之名義，依消費者保護法提起第50條消費者損害賠償訴訟或第53條不作為訴訟之消費者保護團體，須經許可設立多少年以上？","o":["5年","4年","3年","2年"],"a":"D","ty":"num","e":{"s":"amended","x":"依消保法第49條第1項，消保團體須許可設立2年以上、置有消費者保護專門人員並經行政院評定優良，才能以自己名義提起第50條或第53條訴訟，故選(D)。","b":[{"k":"law","l":"消費者保護法","r":"消保法第49條第1項","m":"消保團體須許可設立2年以上、置有消費者保護專門人員並經行政院評定優良，才可用自己名義提起第50條團體求償訴訟或第53條不作為訴訟。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=J0170001"},{"k":"law","l":"理律法律事務所新知：消費者保護法修正重點（104年修正）","r":"理律新知（第49條修正說明）","m":"104年修法取消消保團體提起團體訴訟須經消費者保護官同意的要件，程序因此簡化。","u":"https://www.leeandli.com/TW/Newsletters/5413.htm"}],"f":"題目仍有「由消費者保護官同意後」用語；104年6月17日修正之第49條已刪除須經消保官同意之要件（依理律新知說明，非官方），現行要件為設立2年以上、置專門人員、經行政院評定優良，年限結論不變。"}},{"id":"03-01-015","c":"03","t":"03-01","n":"15","q":"依消費者保護法所提之訴訟，因企業經營者之故意所致之損害，消費者得請求損害額多少倍以下之懲罰性賠償金？","o":["3倍","5倍","7倍","10倍"],"a":"B","ty":"num","e":{"s":"ok","x":"消保法第51條：因企業經營者故意所致損害，消費者可請求損害額5倍以下懲罰性賠償金，故選(B)。","b":[{"k":"law","l":"消費者保護法","r":"消保法第51條","m":"依本法起訴時，企業經營者故意致損者，可請求損害額5倍以下懲罰性賠償金；重大過失為3倍以下；過失為1倍以下。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=J0170001"}]}},{"id":"03-01-016","c":"03","t":"03-01","n":"16","q":"依消費者保護法規定，企業經營者使用定型化契約者，主管機關得隨時派員查核，倘阻撓調查，依法單次最高將處新臺幣多少萬元以下罰鍰？","o":["10萬元","15萬元","20萬元","30萬元"],"a":"D","ty":"num","e":{"s":"ok","x":"消保法第17條第6項授權主管機關隨時派員查核定型化契約；第57條對規避、妨礙或拒絕此項查核者處新臺幣3萬至30萬元罰鍰（得按次處罰），單次最高30萬元，故選(D)。","b":[{"k":"law","l":"消費者保護法","r":"消保法第17條第6項","m":"企業經營者使用定型化契約時，主管機關可以隨時派員查核。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=J0170001"},{"k":"law","l":"消費者保護法","r":"消保法第57條","m":"對主管機關依第17條第6項、第33條或第38條進行的調查加以規避、妨礙或拒絕者，處新臺幣3萬至30萬元罰鍰，並得按次處罰。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=J0170001"}]}},{"id":"03-01-017","c":"03","t":"03-01","n":"17","q":"依照消費者保護法及其相關規定，所謂「企業經營者為與多數消費者訂立同類契約之用，所提出預先擬定之契約條款」，依消費者保護法規定，係指下列何者？","o":["個別磋商條款","預擬契約條款","定型化契約條款","合意契約條款"],"a":"C","ty":"gen","e":{"s":"ok","x":"消保法第2條第7款：企業經營者為了和多數消費者締結同類契約而事先擬好的條款，即為定型化契約條款，故選(C)。","b":[{"k":"law","l":"消費者保護法","r":"消保法第2條第7款","m":"定型化契約條款：企業經營者為了與多數消費者締結同類契約，事先單方擬好的條款，不限於書面形式。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=J0170001"}]}},{"id":"03-01-018","c":"03","t":"03-01","n":"18","q":"依照消費者保護法及其相關規定，若認為企業經營者提供商品或服務有損害消費者生命、健康之虞者，下列何者為直轄市或縣(市)政府應有的作為？","o":["等有通報再對企業經營者進行調查","應立即進行調查","因檢查結果涉及企業經營者，所以不必公開調查結果","派員秘密調查，因此檢查員不必出示證件"],"a":"B","ty":"gen","e":{"s":"ok","x":"消保法第33條第1項：地方政府認為商品或服務可能損害消費者生命、健康等時，應即進行調查，並得公開調查經過及結果；同條第2項並要求調查人員出示證件，故選(B)。","b":[{"k":"law","l":"消費者保護法","r":"消保法第33條第1項","m":"直轄市、縣（市）政府認為企業經營者的商品或服務可能損害消費者生命、身體、健康或財產時，應即調查，並可在調查完成後公開經過及結果。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=J0170001"},{"k":"law","l":"消費者保護法","r":"消保法第33條第2項","m":"執行調查人員須出示有關證件，可採查詢、通知到場陳述、命提出資料、派員實地調查、就地抽樣檢驗等方式。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=J0170001"}]}},{"id":"03-01-019","c":"03","t":"03-01","n":"19","q":"依消費者保護法之規定，下列敘述何者正確？","o":["從事製造商品之企業經營者，就其市場商品符合當時科技水準合理期待的安全性之事實，負擔舉證責任","消費者因企業經營者過失所致之損害，依本法向法院提起訴訟者，得請求損害額3倍以下之懲罰性賠償金","企業經營者對於消費者因信賴媒體所刊明知或可得而知之不實廣告內容所致之損害，不須負擔損害賠償責任","輸入商品之企業經營者，對於因其所輸入之商品而致消費者的健康受有損害時，其應負之責任為過失責任"],"a":"A","ty":"gen","e":{"s":"ok","x":"消保法第7條之1第1項由企業經營者就其商品已具合理期待安全性負舉證責任，(A)正確；過失的懲罰性賠償僅1倍以下（第51條）、媒體係與企業經營者連帶負責（第23條）、輸入者視同製造者負第7條責任（第9條），(B)(C)(D)皆錯，故選(A)。","b":[{"k":"law","l":"消費者保護法","r":"消保法第7條之1第1項","m":"企業經營者主張其商品或服務已達到當時科技、專業水準所能合理期待的安全性者，由企業經營者就此事實舉證。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=J0170001"},{"k":"law","l":"消費者保護法","r":"消保法第51條","m":"依本法起訴時，企業經營者故意致損者，可請求損害額5倍以下懲罰性賠償金；重大過失為3倍以下；過失為1倍以下。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=J0170001"},{"k":"law","l":"消費者保護法","r":"消保法第23條第1項","m":"媒體業者刊播廣告時明知或應知內容不實者，對因信賴該廣告而受損的消費者，須與企業經營者連帶賠償。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=J0170001"},{"k":"law","l":"消費者保護法","r":"消保法第9條","m":"輸入商品或服務的企業經營者，視同該商品的設計、生產、製造者或服務提供者，須負第7條的製造者責任。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=J0170001"},{"k":"law","l":"消費者保護法","r":"消保法第7條第3項","m":"違反前兩項致消費者或第三人受損，企業經營者須負連帶賠償責任；能證明自己無過失者，法院得減輕其賠償責任（條文未規定得免除）。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=J0170001"}]}},{"id":"03-01-020","c":"03","t":"03-01","n":"20","q":"依照消費者保護法及其相關規定，直轄市、縣（市）政府應設何單位辦理消費者之諮詢服務、教育宣導、申訴等事項？","o":["消費者保護團體","消費爭議調解委員會","消費者服務中心","消費者保護委員會"],"a":"C","ty":"gen","e":{"s":"ok","x":"消保法第42條第1項規定直轄市、縣（市）政府應設消費者服務中心，辦理諮詢服務、教育宣導與申訴等事項，故選(C)。","b":[{"k":"law","l":"消費者保護法","r":"消保法第42條第1項","m":"直轄市、縣（市）政府應設置消費者服務中心，負責消費者諮詢服務、教育宣導及申訴等事項。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=J0170001"}]}},{"id":"03-01-021","c":"03","t":"03-01","n":"21","q":"消費者保護法針對小額消費爭議，請問下列何者正確？","o":["小額消費爭議額度，由行政院定之","當事人一方無正當理由，未到調解者，則調解委員不得進行調解","有關解決方案之送達，可適用公示送達之規定","小額消費爭議額度為100萬元"],"a":"A","ty":"gen","e":{"s":"ok","x":"消保法第45條之4第4項：小額消費爭議額度由行政院定之，(A)正確；同條第1項一方無正當理由不到場時調解委員仍可提出方案、第3項方案送達不適用公示送達，(B)(C)錯，故選(A)。","b":[{"k":"law","l":"消費者保護法","r":"消保法第45條之4第4項","m":"小額消費爭議的金額標準由行政院訂定。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=J0170001"},{"k":"law","l":"消費者保護法","r":"消保法第45條之4第1項","m":"小額消費爭議若一方無正當理由不到場，調解委員可依到場者請求或依職權提出解決方案並送達。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=J0170001"},{"k":"law","l":"消費者保護法","r":"消保法第45條之4第3項","m":"小額消費爭議解決方案的送達，不適用公示送達。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=J0170001"}]}},{"id":"03-01-022","c":"03","t":"03-01","n":"22","q":"依照消費者保護法及其相關規定，企業經營者對於消費者之申訴，應於申訴之日起幾日內妥適處理之？","o":["30日","25日","20日","15日"],"a":"D","ty":"num","e":{"s":"ok","x":"消保法第43條第2項：企業經營者對消費者的申訴，應自申訴之日起15日內妥適處理，故選(D)。","b":[{"k":"law","l":"消費者保護法","r":"消保法第43條第2項","m":"企業經營者應自接到消費者申訴之日起15日內妥適處理。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=J0170001"}]}},{"id":"03-01-023","c":"03","t":"03-01","n":"23","q":"依照消費者保護法及其相關規定，依消費者保護法規定，有關主管機關對於企業經營者提供租賃住宅商品出租予消費者所為之行政監督的敘述，下列何者錯誤？","o":["建商拒絕、規避主管機關之調查，經直轄市政府、縣（市）政府核准者，得命停止營業","主管機關認為確有損害消費者財產之虞者，應命其限期改善或採取其他必要措施","主管機關對消費者有發生重大損害之虞而情況危急時，應即在大眾傳播媒體公告企業經營者之名稱","主管機關認為有損害消費者財產之虞者，應即進行調查並得公開其經過與結果"],"a":"A","ty":"neg","e":{"s":"ok","x":"(A)錯：拒絕、規避調查依消保法第57條處罰鍰，命停止營業依第60條須經中央主管機關認定情節重大，由中央主管機關或行政院為之，並非經地方政府核准；(B)(C)(D)分別見第36條、第37條、第33條第1項，故選(A)。","b":[{"k":"law","l":"消費者保護法","r":"消保法第57條","m":"對主管機關依第17條第6項、第33條或第38條進行的調查加以規避、妨礙或拒絕者，處新臺幣3萬至30萬元罰鍰，並得按次處罰。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=J0170001"},{"k":"law","l":"消費者保護法","r":"消保法第60條","m":"違反本法致商品或服務有危害生命身體健康之虞、影響社會大眾，經中央主管機關認定情節重大者，由中央主管機關或行政院命其停止營業。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=J0170001"},{"k":"law","l":"消費者保護法","r":"消保法第36條","m":"經第33條調查確認商品或服務確有損害或有損害之虞者，地方政府應命企業經營者限期改善、回收或銷燬，必要時得命立即停止製造、經銷或服務等。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=J0170001"},{"k":"law","l":"消費者保護法","r":"消保法第37條","m":"商品或服務對消費者已造成重大損害，或有重大損害之虞且情況危急時，地方政府除前條處置外，須立即透過大眾傳播媒體公布企業經營者名稱、地址及其商品或服務等。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=J0170001"},{"k":"law","l":"消費者保護法","r":"消保法第33條第1項","m":"直轄市、縣（市）政府認為企業經營者的商品或服務可能損害消費者生命、身體、健康或財產時，應即調查，並可在調查完成後公開經過及結果。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=J0170001"}]}},{"id":"03-01-024","c":"03","t":"03-01","n":"24","q":"依照消費者保護法及其相關規定，政府為達成制定消費者保護法之目的，應就某些事項有關之法規及其執行情形，定期檢討、協調、改進之，下列何者不屬之？","o":["維護商品或服務之品質與安全衛生","防止商品或服務損害消費者之生命、身體、健康、財產或其他權益","確保商品或服務之標示，符合法令規定","促進事業品牌形象或商譽維護"],"a":"D","ty":"neg","e":{"s":"ok","x":"消保法第3條第1項所列政府應定期檢討的事項包括品質安全衛生、防止損害消費者權益、標示合法等，並無促進事業品牌形象或商譽維護，故選(D)。","b":[{"k":"law","l":"消費者保護法","r":"消保法第3條第1項","m":"政府應就商品服務品質與安全衛生、防止損害消費者權益、標示廣告度量衡合法、合理價格與包裝、公平交易、扶植消保團體、處理消費爭議、消費者教育與諮詢等事項，定期檢討協調改進法規及執行。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=J0170001"}]}},{"id":"03-01-025","c":"03","t":"03-01","n":"25","q":"依照消費者保護法及其相關規定，企業經營者違反本法第26條規定，未提供必要之包裝，經主管機關通知改正而逾期不改正者，處多少金額罰鍰？","o":["處新臺幣2萬元以上20萬元以下罰鍰","處新臺幣3萬元以上30萬元以下罰鍰","處新臺幣4萬元以上40萬元以下罰鍰","處新臺幣1萬元以上10萬元以下罰鍰"],"a":"A","ty":"num","ns":1,"e":{"s":"ok","x":"消保法第56條：違反第26條包裝規定，經通知改正而逾期不改正者，處新臺幣2萬至20萬元罰鍰，故選(A)。","b":[{"k":"law","l":"消費者保護法","r":"消保法第26條","m":"企業經營者應依商品性質及交易習慣，為防震、防潮、防塵等保存需要妥適包裝，但不得誇張內容或過度包裝。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=J0170001"},{"k":"law","l":"消費者保護法","r":"消保法第56條","m":"違反第24條（標示）、第25條（保證書）或第26條（包裝），經主管機關通知改正而逾期未改者，處新臺幣2萬至20萬元罰鍰。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=J0170001"}]}},{"id":"03-01-026","c":"03","t":"03-01","n":"26","q":"依消費者保護法規定，下列何者不可能為消費爭議調解委員會之委員？","o":["直轄市、縣(市)政府代表","立法委員","消費者保護官","消費者保護團體代表"],"a":"B","ty":"neg","e":{"s":"ok","x":"消保法第45條第2項所定調解委員為政府代表、消保官、消保團體代表、職業團體代表及學者專家，不包括立法委員，故選(B)。","b":[{"k":"law","l":"消費者保護法","r":"消保法第45條第2項","m":"調解委員由政府代表、消保官、消保團體代表、企業經營者所屬或相關職業團體代表及學者專家組成，並由消費者保護官擔任主席。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=J0170001"}]}},{"id":"03-01-027","c":"03","t":"03-01","n":"27","q":"依消費者保護法規定，下列有關企業經營者之敘述何者正確？","o":["企業經營者對消費者或第三人之損害賠償責任，經與消費者個別磋商，得預先約定限制或免除","輸入商品或服務之企業經營者，視為從事經銷之企業經營者","從事經銷之企業經營者，就商品所生之損害，與商品製造者連帶負賠償責任。但對於損害之防免已盡相當之注意，或縱加以相當之注意而仍不免發生損害者，不在此限","從事設計、生產、製造商品或提供服務之企業經營者，違反消費者保護法規定致生損害於消費者，若企業經營者能證明其無過失者，法院得免除其賠償責任"],"a":"C","ty":"gen","e":{"s":"ok","x":"消保法第8條第1項：經銷商與製造者連帶負責，但已盡相當注意或縱盡注意仍不免損害者免責，(C)正確；責任不得預先約定限制或免除（第10條之1）、輸入者視同製造者（第9條）、無過失僅得減輕而非免除（第7條第3項），(A)(B)(D)錯，故選(C)。","b":[{"k":"law","l":"消費者保護法","r":"消保法第8條第1項","m":"經銷商就商品所致損害與設計、生產、製造者連帶負責；但其對防免損害已盡相當注意，或縱盡注意仍無法避免損害者，不負此責。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=J0170001"},{"k":"law","l":"消費者保護法","r":"消保法第10條之1","m":"本節所定企業經營者對消費者或第三人的損害賠償責任，不得以事前約定方式加以限制或免除。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=J0170001"},{"k":"law","l":"消費者保護法","r":"消保法第9條","m":"輸入商品或服務的企業經營者，視同該商品的設計、生產、製造者或服務提供者，須負第7條的製造者責任。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=J0170001"},{"k":"law","l":"消費者保護法","r":"消保法第7條第3項","m":"違反前兩項致消費者或第三人受損，企業經營者須負連帶賠償責任；能證明自己無過失者，法院得減輕其賠償責任（條文未規定得免除）。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=J0170001"}]}},{"id":"03-01-028","c":"03","t":"03-01","n":"28","q":"依照消費者保護法及其相關規定，消費者保護團體依消費者保護法第49條規定提起訴訟。下列敘述何者正確？","o":["應經消費者保護基金會的同意，始得提起該訴訟","如已置有消費者保護專門人員，則可不委任律師代理訴訟","如委任律師代理訴訟，該律師不得請求預付必要費用","消費者保護團體非被害人，但仍得為該訴訟原告"],"a":"D","ty":"gen","e":{"s":"ok","x":"消保法第49條第1項使符合要件的消保團體得以自己名義提起第50條訴訟，故雖非被害人仍可為原告，(D)正確；同條第2項規定應委任律師代理、律師可請求預付必要費用，(B)(C)錯，故選(D)。","b":[{"k":"law","l":"消費者保護法","r":"消保法第49條第1項","m":"消保團體須許可設立2年以上、置有消費者保護專門人員並經行政院評定優良，才可用自己名義提起第50條團體求償訴訟或第53條不作為訴訟。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=J0170001"},{"k":"law","l":"消費者保護法","r":"消保法第49條第2項","m":"消保團體提起上述訴訟應委任律師代理，受任律師可請求預付或償還必要費用。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=J0170001"},{"k":"law","l":"消費者保護法","r":"消保法第50條第1項","m":"同一原因事件使眾多消費者受害時，消保團體受讓20人以上的損害賠償請求權後，可用自己名義起訴；消費者在言詞辯論終結前可終止讓與並通知法院。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=J0170001"}]}},{"id":"03-01-029","c":"03","t":"03-01","n":"29","q":"依照消費者保護法及其相關規定，因同一消費關係而被害之甲、乙、丙，依民事訴訟法之規定，選定甲與乙起訴請求損害賠償，以下敘述何者正確？","o":["此為法定訴訟擔當","甲與乙稱為選定人","甲與乙稱為選定當事人","該訴訟係屬中，同一消費關係之其他被害人丁與戊在法院判決前，均得併案請求賠償"],"a":"C","ty":"gen","e":{"s":"ok","x":"依民事訴訟法第41條，多數有共同利益之人可選定其中一人或數人為全體起訴，被選定之甲、乙即代表全體實施訴訟之選定當事人（丙等推舉者則為選定人）；其他被害人須經法院徵得被選定人同意並公告後，於一定期間內始得併案請求（消保法第54條第1項），故選(C)。","b":[{"k":"law","l":"民事訴訟法","r":"民事訴訟法第41條第1項","m":"多數有共同利益之人，可由其中選定一人或數人為全體起訴或被訴；被推舉者稱被選定人，代表全體實施訴訟。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=B0010001"},{"k":"law","l":"消費者保護法","r":"消保法第54條第1項","m":"同一消費關係的多數被害人依民事訴訟法第41條選定一人或數人起訴後，法院可徵得被選定人同意並公告，讓其他被害人在一定期間內以書狀併案請求賠償。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=J0170001"}],"nt":"條文用語為「被選定人」，「選定當事人」為此制度之通稱；選項(A)「法定訴訟擔當」之錯誤未另引依據。"}},{"id":"03-01-030","c":"03","t":"03-01","n":"30","q":"依照消費者保護法及其相關規定，消費者甲向企業經營者乙提起消費訴訟，下列敘述何者正確？","o":["法院為甲敗訴之判決時，得依職權宣告為減少擔保之假執行。果爾，乙得在判決確定前，聲請法院強制執行甲的財產","法院為乙敗訴之判決時，得依職權宣告為免除擔保之假處分","法院為乙敗訴之判決時，得依職權宣告為減少擔保之假扣押","法院為乙敗訴之判決時，得依職權宣告為免除擔保之假執行。果爾，甲得在判決確定前，聲請法院強制執行乙的財產"],"a":"D","ty":"gen","e":{"s":"ok","x":"消保法第48條第2項：法院為企業經營者乙敗訴之判決時，得依職權宣告減免擔保之假執行；假執行之裁判依強制執行法第4條第1項第2款為執行名義，甲即可於判決確定前聲請強制執行乙之財產，故選(D)。","b":[{"k":"law","l":"消費者保護法","r":"消保法第48條第2項","m":"法院判決企業經營者敗訴時，可依職權宣告減免擔保的假執行。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=J0170001"},{"k":"law","l":"強制執行法","r":"強制執行法第4條第1項第2款","m":"假扣押、假處分、假執行之裁判及其他依民事訴訟法得為強制執行的裁判為執行名義。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=B0010004"}]}},{"id":"03-01-031","c":"03","t":"03-01","n":"31","q":"依照消費者保護法及其相關規定，甲慈善事業的慈善經營方式是以一般價格購買商品後，將其便宜賣給貧困者。貧困者乙向甲便宜購買商品，如因而受有身體上的損害，請問乙主張甲就此應負商品責任，有無理由？","o":["有理由，因為甲應負不完全給付的商品責任","有理由，因為甲反覆為此行為並以此為業","無理由，因為甲的行為並非以營利為目的","無理由，因為人身損害並非商品責任所規範"],"a":"B","ty":"gen","e":{"s":"ok","x":"消保法第2條第2款以經銷商品等「為營業」者為企業經營者，施行細則第2條並明定營業不限於以營利為目的；甲持續以販售商品為其業務，雖不營利仍屬企業經營者，商品致乙身體受損即應依第7條負責，故選(B)。","b":[{"k":"law","l":"消費者保護法","r":"消保法第2條第2款","m":"企業經營者：以設計、生產、製造、輸入、經銷商品或提供服務為其營業之人。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=J0170001"},{"k":"law","l":"消費者保護法施行細則","r":"消保法施行細則第2條","m":"企業經營者定義中的「營業」，範圍不限於追求營利的活動。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?PCode=J0170002"},{"k":"law","l":"消費者保護法","r":"消保法第7條第3項","m":"違反前兩項致消費者或第三人受損，企業經營者須負連帶賠償責任；能證明自己無過失者，法院得減輕其賠償責任（條文未規定得免除）。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=J0170001"},{"k":"law","l":"行政院消費者保護委員會92年9月8日消保法字第0920001130號函（免費電子信箱業者仍屬企業經營者）","r":"消保會92年消保法字第0920001130號函","m":"依施行細則營業不以營利為限，業者提供免費服務雖非營利，仍屬消保法所稱企業經營者。","u":"https://www.ey.gov.tw/Page/24C4B877E850ED4E/0c81c07c-acaf-4e10-add1-639b6a085f94"}],"nt":"選項(B)所稱「反覆為此行為並以此為業」係對「營業」概念之說明；行政院消保會92年消保法字第0920001130號函亦認免費服務業者仍屬企業經營者，但未見官方以「反覆實施」為要件之文字。"}},{"id":"03-01-032","c":"03","t":"03-01","n":"32","q":"依照消費者保護法及其相關規定，設若消費者保護基金會對於同一之原因事件，致使眾多消費者受害時，受讓甲、乙、丙等20位消費者損害賠償請求權後，以自己名義，提起消費訴訟。以下敘述何者正確？","o":["如甲僅有非財產上損害賠償請求權，因該權利具一身專屬性，故不得讓與給消費者保護基金會","該訴訟中，如乙終止讓與損害賠償請求權，消費者保護基金會仍具當事人適格","在該訴訟判決前，丙均得終止讓與損害賠償請求權，並通知法院","消費者保護基金會應將該訴訟結果所得賠償，交付甲、乙、丙等20位消費者，不得扣除訴訟費用"],"a":"B","ty":"gen","e":{"s":"ok","x":"消保法第50條第2項：部分消費者終止讓與致不足20人，不影響消保團體續行訴訟，(B)正確；非財產上損害亦得讓與（第3項）、終止讓與須在言詞辯論終結前（第1項）、交付賠償前可扣除訴訟及律師必要費用（第5項），(A)(C)(D)錯，故選(B)。","b":[{"k":"law","l":"消費者保護法","r":"消保法第50條第2項","m":"部分消費者終止讓與，致人數不足20人時，不影響消保團體繼續實施訴訟。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=J0170001"},{"k":"law","l":"消費者保護法","r":"消保法第50條第3項","m":"可讓與的請求權包括民法第194條、第195條第1項的非財產上損害。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=J0170001"},{"k":"law","l":"消費者保護法","r":"消保法第50條第1項","m":"同一原因事件使眾多消費者受害時，消保團體受讓20人以上的損害賠償請求權後，可用自己名義起訴；消費者在言詞辯論終結前可終止讓與並通知法院。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=J0170001"},{"k":"law","l":"消費者保護法","r":"消保法第50條第5項","m":"消保團體應將訴訟所得賠償扣除訴訟及支付律師的必要費用後，交付讓與請求權的消費者。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=J0170001"}]}},{"id":"03-01-033","c":"03","t":"03-01","n":"33","q":"依消費者保護法規定，下列有關調解之敘述何者正確？","o":["消費爭議調解委員會，由委員互推主席","依消費者保護法第45條之2，有關一般消費爭議經委員會依職權調解提出之解決方案，應經全體調解委員全體同意","當事人對委員會依職權調解之方案，得於送達後15日之不變期間內，提出異議","調解成立者應作成調解書。調解書之作成及效力，準用鄉鎮市調解條例第25條至第29條之規定"],"a":"D","ty":"num","e":{"s":"ok","x":"消保法第46條：調解成立應作成調解書，其作成及效力準用鄉鎮市調解條例第25至29條，(D)正確；主席由消保官擔任（第45條第2項）、方案須經參與調解委員過半數同意（第45條之2第2項）、異議期間為10日（第45條之3），(A)(B)(C)錯，故選(D)。","b":[{"k":"law","l":"消費者保護法","r":"消保法第46條","m":"調解成立時須作成調解書，作成方式與效力準用鄉鎮市調解條例第25至29條。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=J0170001"},{"k":"law","l":"消費者保護法","r":"消保法第45條第2項","m":"調解委員由政府代表、消保官、消保團體代表、企業經營者所屬或相關職業團體代表及學者專家組成，並由消費者保護官擔任主席。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=J0170001"},{"k":"law","l":"消費者保護法","r":"消保法第45條之2第2項","m":"上述方案須經參與調解的委員過半數同意，並載明異議期間及逾期未異議的效果。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=J0170001"},{"k":"law","l":"消費者保護法","r":"消保法第45條之3","m":"當事人對依職權提出的方案，可於送達後10日不變期間內異議；有異議視為調解不成立，逾期未異議則視為依該方案成立調解。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=J0170001"}]}},{"id":"03-01-034","c":"03","t":"03-01","n":"34","q":"依照消費者保護法及其相關規定，甲為廣告主，乙為企業經營者，乙委託甲刊登有關於自家商品的廣告，甲知情乙家商品卻與廣告內容事實不符卻依然刊登其廣告，導致消費者丙因信賴廣告所受損失，以下敘述何者不正確？","o":["乙應確保廣告內容之真實，對消費者所負之義務不得低於廣告之內容","甲只是受乙的委託刊登廣告，因此不必負任何責任","丙因商品而受之損害可向消費者保護團體申訴","若丙向消費者保護團體申訴未受妥適處理時，可向消費爭議調解委員會申請調解"],"a":"B","ty":"neg","e":{"s":"ok","x":"(B)錯：依消保法第23條第1項，刊登廣告者明知廣告內容不實仍刊登，須與企業經營者對信賴廣告而受損的消費者連帶賠償；(A)見第22條，(C)(D)見第43條第1項及第44條，故選(B)。","b":[{"k":"law","l":"消費者保護法","r":"消保法第23條第1項","m":"媒體業者刊播廣告時明知或應知內容不實者，對因信賴該廣告而受損的消費者，須與企業經營者連帶賠償。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=J0170001"},{"k":"law","l":"消費者保護法","r":"消保法第22條第1項","m":"企業經營者應確保廣告真實，對消費者負擔的義務不得少於廣告所示。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=J0170001"},{"k":"law","l":"消費者保護法","r":"消保法第43條第1項","m":"發生消費爭議時，消費者可向企業經營者、消保團體或消費者服務中心（含分中心）提出申訴。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=J0170001"},{"k":"law","l":"消費者保護法","r":"消保法第44條","m":"依第43條申訴後仍未獲妥適處理，消費者可向直轄市或縣（市）的消費爭議調解委員會聲請調解。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=J0170001"}],"nt":"題目稱甲為「廣告主」，但依題意甲係受託刊登廣告之一方，相當於第23條之媒體經營者。"}},{"id":"03-01-035","c":"03","t":"03-01","n":"35","q":"依照消費者保護法及其相關規定，發生消費爭議時，租賃住宅服務業對於消費者之申訴，依消費者保護法之規定，應於申訴之日起幾日內妥適處理之？","o":["5日","10日","15日","20日"],"a":"C","ty":"num","e":{"s":"ok","x":"租賃住宅服務業提供服務，屬消保法之企業經營者；依第43條第2項，企業經營者應自申訴之日起15日內妥適處理消費者申訴，故選(C)。","b":[{"k":"law","l":"消費者保護法","r":"消保法第2條第2款","m":"企業經營者：以設計、生產、製造、輸入、經銷商品或提供服務為其營業之人。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=J0170001"},{"k":"law","l":"消費者保護法","r":"消保法第43條第2項","m":"企業經營者應自接到消費者申訴之日起15日內妥適處理。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=J0170001"}]}},{"id":"03-01-036","c":"03","t":"03-01","n":"36","q":"依照消費者保護法及其相關規定，租賃住宅管理公司因同一原因事件，致使眾多租屋者受害時，依消費者保護法規定，消費者保護團體得受讓多少人以上之購屋者的損害賠償請求權後，以自己名義提起訴訟？","o":["10人","20人","30人","50人"],"a":"B","ty":"num","e":{"s":"ok","x":"消保法第50條第1項：同一原因事件致眾多消費者受害，消保團體受讓20人以上之損害賠償請求權後，可以自己名義起訴，故選(B)。","b":[{"k":"law","l":"消費者保護法","r":"消保法第50條第1項","m":"同一原因事件使眾多消費者受害時，消保團體受讓20人以上的損害賠償請求權後，可用自己名義起訴；消費者在言詞辯論終結前可終止讓與並通知法院。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=J0170001"}],"nt":"題幹前稱「租屋者」、後稱「購屋者」，用語不一致，不影響人數結論。"}},{"id":"03-01-037","c":"03","t":"03-01","n":"37","q":"消費者與租賃住宅管理經營者因商品或服務發生消費爭議時，依消費者保護法之規定，關於爭議的解決方式，下列敘述何者正確？","o":["企業經營者得向租賃住宅管理業經營者、消費者保護團體或消費者服務中心或其分中心申訴","消費者得逕向直轄市或縣（市）消費爭議調解委員會申請調解","調解程序，於直轄市、縣（市）政府或其他適當之處所行之，其程序得不公開","調解委員、列席協同調解人及其他經辦調解事務之人，對於調解事件之內容，應予公開"],"a":"C","ty":"gen","e":{"s":"ok","x":"消保法第45條之1第1項：調解在直轄市、縣（市）政府或其他合適處所進行，程序得不公開，(C)正確；申訴主體為消費者（第43條第1項）、須先申訴未獲妥適處理才可申請調解（第44條）、經辦人員應保密（第45條之1第2項），(A)(B)(D)錯，故選(C)。","b":[{"k":"law","l":"消費者保護法","r":"消保法第45條之1第1項","m":"調解在直轄市、縣（市）政府或其他合適場所進行，程序可不公開。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=J0170001"},{"k":"law","l":"消費者保護法","r":"消保法第43條第1項","m":"發生消費爭議時，消費者可向企業經營者、消保團體或消費者服務中心（含分中心）提出申訴。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=J0170001"},{"k":"law","l":"消費者保護法","r":"消保法第44條","m":"依第43條申訴後仍未獲妥適處理，消費者可向直轄市或縣（市）的消費爭議調解委員會聲請調解。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=J0170001"},{"k":"law","l":"消費者保護法","r":"消保法第45條之1第2項","m":"調解委員、列席協同調解人等經辦人員，對調解事件內容除已公開者外，負保密義務。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=J0170001"}]}},{"id":"03-01-038","c":"03","t":"03-01","n":"38","q":"依消費者保護法之規定，下列有關定型化契約條款之敘述，何者錯誤？","o":["定型化契約中之定型化契約條款牴觸個別磋商條款之約定者，其牴觸部分無效","定型化契約中之條款違反誠信原則，對消費者顯失公平者，無效","定型化契約條款如有疑義時，應本平等互惠之原則解釋","定型化契約條款未經記載於定型化契約中而依正常情形顯非消費者所得預見者，該條款不構成契約之內容"],"a":"C","ty":"neg","e":{"s":"ok","x":"(C)錯：條款有疑義時應作有利於消費者的解釋（消保法第11條第2項），平等互惠則是訂定條款應遵守的原則（第11條第1項）；(A)(B)(D)分別見第15條、第12條第1項、第14條，故選(C)。","b":[{"k":"law","l":"消費者保護法","r":"消保法第11條第2項","m":"定型化契約條款文義有疑義時，解釋上應偏向對消費者有利。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=J0170001"},{"k":"law","l":"消費者保護法","r":"消保法第11條第1項","m":"企業經營者使用的定型化契約條款，應依平等互惠原則訂定。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=J0170001"},{"k":"law","l":"消費者保護法","r":"消保法第15條","m":"定型化條款與雙方個別協商的約定互相衝突時，衝突部分的定型化條款無效。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=J0170001"},{"k":"law","l":"消費者保護法","r":"消保法第12條第1項","m":"定型化契約條款若違背誠信原則、使消費者處於顯失公平的地位，該條款無效。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=J0170001"},{"k":"law"
