,"l":"消費者保護法","r":"消保法第14條","m":"未寫入定型化契約書、依通常情況消費者也無從預料的條款，不成為契約的一部分。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=J0170001"}]}},{"id":"03-01-039","c":"03","t":"03-01","n":"39","q":"依照消費者保護法及其相關規定，關於消費爭議調解委員會的敘述，下列何者正確？","o":["直轄市、縣（市）政府應設消費爭議調解委員會，置委員5至11名","調解程序，於直轄市、縣（市）政府或其他適當之處所行之，其程序應公開","關於消費爭議之調解，當事人不能合意但已甚接近者，調解委員得斟酌一切情形，求兩造利益之平衡，於不違反兩造當事人之主要意思範圍內，依職權提出解決事件之方案，並送達於當事人","當事人對於經參與調解委員過半數同意提出解決事件之方案，得於送達後20日之不變期間內，提出異議"],"a":"C","ty":"gen","e":{"s":"ok","x":"消保法第45條之2第1項：當事人不能合意但已甚接近時，調解委員得在不違反雙方主要意思範圍內依職權提出方案並送達，(C)正確；委員為7至21名（第45條第1項）、程序得不公開（第45條之1第1項）、異議期間為10日（第45條之3），(A)(B)(D)錯，故選(C)。","b":[{"k":"law","l":"消費者保護法","r":"消保法第45條之2第1項","m":"當事人無法合意但已相當接近時，調解委員可衡酌一切情形、平衡雙方利益，在不違反雙方主要意思下依職權提出解決方案並送達。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=J0170001"},{"k":"law","l":"消費者保護法","r":"消保法第45條第1項","m":"各直轄市與縣（市）政府須設立消費爭議調解委員會，委員人數7至21人。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=J0170001"},{"k":"law","l":"消費者保護法","r":"消保法第45條之1第1項","m":"調解在直轄市、縣（市）政府或其他合適場所進行，程序可不公開。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=J0170001"},{"k":"law","l":"消費者保護法","r":"消保法第45條之3","m":"當事人對依職權提出的方案，可於送達後10日不變期間內異議；有異議視為調解不成立，逾期未異議則視為依該方案成立調解。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=J0170001"}]}},{"id":"03-01-040","c":"03","t":"03-01","n":"40","q":"依照消費者保護法及其相關規定，關於定型化契約審閱期的敘述，下列何者正確？","o":["定型化契約條款審閱期如有疑義時，應探求企業經營者之真意，不得拘泥於所用之文字","企業經營者與消費者訂立定型化契約前，應有10日以內之合理期間，供消費者審閱全部條款內容","企業經營者以定型化契約條款使消費者拋棄審閱權利者，雖非無效，但消費者得撤銷其意思表示","違反審閱期規定者，其條款不構成契約之內容。但消費者得主張該條款仍構成契約之內容"],"a":"D","ty":"gen","e":{"s":"ok","x":"消保法第11條之1第3項：違反審閱期規定者條款不構成契約內容，但消費者得主張其仍構成契約內容，(D)正確；條款疑義應作有利消費者解釋（第11條第2項）、審閱期為30日以內（第11條之1第1項）、拋棄審閱權之條款無效（同條第2項），(A)(B)(C)錯，故選(D)。","b":[{"k":"law","l":"消費者保護法","r":"消保法第11條之1第3項","m":"違反審閱期規定時，相關條款原則上不納入契約內容；但消費者可以主張該條款仍屬契約內容。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=J0170001"},{"k":"law","l":"消費者保護法","r":"消保法第11條第2項","m":"定型化契約條款文義有疑義時，解釋上應偏向對消費者有利。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=J0170001"},{"k":"law","l":"消費者保護法","r":"消保法第11條之1第1項","m":"企業經營者在與消費者簽訂定型化契約前，須給予消費者30日以內的合理期間，讓其審閱全部條款。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=J0170001"},{"k":"law","l":"消費者保護法","r":"消保法第11條之1第2項","m":"企業經營者以條款要求消費者放棄上述審閱權者，該條款無效。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=J0170001"}]}},{"id":"03-01-041","c":"03","t":"03-01","n":"41","q":"依消費者保護法規定，下列敘述何者正確？","o":["企業經營者於商品或服務具有危害消費者生命、身體、健康、財產之可能者，未於明顯處為警告標示及緊急處理危險之方法者應負賠償責任。但企業經營者能證明其無過失者，法院得減輕或免除其賠償責任","商品或服務因其後有較佳之商品或服務，得被推定不符合當時科技或專業水準可合理期待之安全性","從事經銷之企業經營者，改裝、分裝商品或變更服務內容者，視為從事設計、生產、製造商品或提供服務之企業經營者","企業經營者對消費者或第三人之損害賠償責任，得預先約定限制但不得約定免除"],"a":"C","ty":"gen","e":{"s":"ok","x":"消保法第8條第2項：經銷商對商品改裝、分裝或變動服務內容時，視同設計、生產、製造或提供服務之企業經營者，(C)正確；無過失時法院僅得減輕（第7條第3項）、不得僅因其後有較佳商品即推定欠缺安全性（第7條之1第2項）、責任不得預先約定限制或免除（第10條之1），(A)(B)(D)錯，故選(C)。","b":[{"k":"law","l":"消費者保護法","r":"消保法第8條第2項","m":"經銷商若對商品加以改裝、分裝，或變動服務內容，即視同第7條的設計、生產、製造者或服務提供者。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=J0170001"},{"k":"law","l":"消費者保護法","r":"消保法第7條第3項","m":"違反前兩項致消費者或第三人受損，企業經營者須負連帶賠償責任；能證明自己無過失者，法院得減輕其賠償責任（條文未規定得免除）。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=J0170001"},{"k":"law","l":"消費者保護法","r":"消保法第7條之1第2項","m":"不能只因日後出現更好的商品或服務，就推定先前的商品或服務欠缺應有的安全性。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=J0170001"},{"k":"law","l":"消費者保護法","r":"消保法第10條之1","m":"本節所定企業經營者對消費者或第三人的損害賠償責任，不得以事前約定方式加以限制或免除。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=J0170001"}]}},{"id":"03-01-042","c":"03","t":"03-01","n":"42","q":"依照消費者保護法及其相關規定，針對臺灣社會發生食品安全問題（如黑心油），消費者得依消費者保護法第50條所定消費者保護團體訴訟（以下簡稱「消保團體訴訟」）尋求救濟。下列敘述何者正確？","o":["多數受害之消費者得申請組成消保團體之組織，以便立即以團體自己名義，逕向法院提起消費者團體損害訴訟","消保團體於受讓20人以上消費者損害賠償請求權，得以自己名義提起訴訟。消費者於言詞辯論終結前，不得終止讓與該損害賠償請求權","消保團體依法提出消保團體訴訟者，應委任律師代理訴訟","消保團體就消費者團體損害賠償訴訟，於扣除訴訟、支付予律師之必要費用以及得向消費者請求之報酬後，將訴訟結果所得之賠償交付該讓與請求權之消費者"],"a":"C","ty":"gen","ns":1,"e":{"s":"ok","x":"消保法第49條第2項：消保團體提起團體訴訟應委任律師代理，(C)正確；須為符合第49條第1項要件之團體始得起訴、消費者於言詞辯論終結前仍可終止讓與（第50條第1項）、不得向消費者請求報酬（第50條第6項），(A)(B)(D)錯，故選(C)。","b":[{"k":"law","l":"消費者保護法","r":"消保法第49條第2項","m":"消保團體提起上述訴訟應委任律師代理，受任律師可請求預付或償還必要費用。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=J0170001"},{"k":"law","l":"消費者保護法","r":"消保法第49條第1項","m":"消保團體須許可設立2年以上、置有消費者保護專門人員並經行政院評定優良，才可用自己名義提起第50條團體求償訴訟或第53條不作為訴訟。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=J0170001"},{"k":"law","l":"消費者保護法","r":"消保法第50條第1項","m":"同一原因事件使眾多消費者受害時，消保團體受讓20人以上的損害賠償請求權後，可用自己名義起訴；消費者在言詞辯論終結前可終止讓與並通知法院。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=J0170001"},{"k":"law","l":"消費者保護法","r":"消保法第50條第6項","m":"消保團體提起本條訴訟，不得向消費者收取報酬。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=J0170001"}]}},{"id":"03-01-043","c":"03","t":"03-01","n":"43","q":"依照消費者保護法及其相關規定，企業經營者於下列違反消費者保護法之情形，何者所適用罰則所定之法定罰鍰額度為最高？","o":["地方政府針對企業經營者提供之商品或服務，經調查認為確有損害消費者身體健康者，命其為限期回收或其他必要處置，而企業經營者拒不遵從者","企業經營者未依商品標示法等法令為商品或服務之標示","企業經營者對消費者保證商品或服務之品質時，未主動出具書面保證書","企業經營者使用定型化契約時，拒絕、規避或阻撓主管機關之派員查核"],"a":"A","ty":"gen","e":{"s":"ok","x":"(A)為違反地方政府依消保法第36條所為命令，依第58條處新臺幣6萬至150萬元；(B)(C)未依法標示或未出具保證書依第56條為2萬至20萬元，(D)拒絕查核依第57條為3萬至30萬元，(A)最高，故選(A)。","b":[{"k":"law","l":"消費者保護法","r":"消保法第36條","m":"經第33條調查確認商品或服務確有損害或有損害之虞者，地方政府應命企業經營者限期改善、回收或銷燬，必要時得命立即停止製造、經銷或服務等。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=J0170001"},{"k":"law","l":"消費者保護法","r":"消保法第58條","m":"違反主管機關依第36條或第38條所為命令者，處新臺幣6萬至150萬元罰鍰，並得按次處罰。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=J0170001"},{"k":"law","l":"消費者保護法","r":"消保法第56條","m":"違反第24條（標示）、第25條（保證書）或第26條（包裝），經主管機關通知改正而逾期未改者，處新臺幣2萬至20萬元罰鍰。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=J0170001"},{"k":"law","l":"消費者保護法","r":"消保法第57條","m":"對主管機關依第17條第6項、第33條或第38條進行的調查加以規避、妨礙或拒絕者，處新臺幣3萬至30萬元罰鍰，並得按次處罰。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=J0170001"}]}},{"id":"03-01-044","c":"03","t":"03-01","n":"44","q":"依消費者保護法規定，關於消費爭議之處理，當事人對於調解委員依職權提出之解決方案若有異議，最遲得於送達後幾日內提出？","o":["7日","10日","15日","20日"],"a":"B","ty":"num","e":{"s":"ok","x":"消保法第45條之3：當事人對調解委員依職權提出之方案，得於送達後10日之不變期間內提出異議，故選(B)。","b":[{"k":"law","l":"消費者保護法","r":"消保法第45條之3","m":"當事人對依職權提出的方案，可於送達後10日不變期間內異議；有異議視為調解不成立，逾期未異議則視為依該方案成立調解。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=J0170001"}]}},{"id":"03-01-045","c":"03","t":"03-01","n":"45","q":"下列何者不是消費者保護法第12條所規定推定定型化契約條款顯失公平之情形？","o":["契約之主要權利或義務，因受條款之限制，致契約之目的難以達成者","條款與其所排除不予適用之任意規定之立法意旨顯相矛盾者","違反平等互惠原則者","契約之主要權利或義務，因受條款之限制，致契約之目的可以達成者"],"a":"D","ty":"neg","e":{"s":"ok","x":"消保法第12條第2項第3款推定顯失公平之情形為主要權利義務受條款限制「致契約目的難以達成」，(D)稱「可以達成」並非該條情形，(A)(B)(C)則分屬同項各款，故選(D)。","b":[{"k":"law","l":"消費者保護法","r":"消保法第12條第2項","m":"推定顯失公平的三種情形：違反平等互惠；條款與被它排除適用的任意規定立法意旨明顯衝突；主要權利義務受條款限制，使契約目的難以實現。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=J0170001"}]}},{"id":"03-01-046","c":"03","t":"03-01","n":"46","q":"下列何者非屬於內政部依消費者保護法之規定所訂定之定型化契約應記載不得記載事項類型？","o":["住宅轉租定型化契約應記載及不得記載事項","租賃住宅委託管理定型化契約應記載及不得記載事項","房屋租賃定型化契約應記載及不得記載事項","住宅包租契約應記載及不得記載事項"],"a":"D","ty":"neg","e":{"s":"ok","x":"房屋租賃、住宅轉租、租賃住宅委託管理之定型化契約應記載及不得記載事項，均係內政部依消保法第17條公告之事項；住宅包租契約則依租賃條例第5條第2項由中央主管機關公告「應約定及不得約定事項」，非消保法之定型化契約應記載事項，故選(D)。","b":[{"k":"law","l":"消費者保護法","r":"消保法第17條第1項","m":"中央主管機關為預防消費糾紛，可選定特定行業擬訂定型化契約應記載或不得記載事項，報請行政院核定後公告。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=J0170001"},{"k":"law","l":"行政院消費者保護處107年6月4日院臺消保字第1070020024號函（社會住宅租賃契約適用房屋租賃定型化契約應記載及不得記載事項）","r":"消保處107年院臺消保字第1070020024號函","m":"說明房屋租賃定型化契約應記載及不得記載事項係內政部依消保法第17條第1項公告，社會住宅租賃契約亦受其規範。","u":"https://www.ey.gov.tw/Page/24C4B877E850ED4E/ac9a343e-520c-4b73-a959-dc0e3c935137"},{"k":"law","l":"住宅轉租定型化契約應記載及不得記載事項（內政部）","r":"住宅轉租定型化契約應記載及不得記載事項","m":"內政部於108年2月23日公告、108年6月1日生效（113年11月21日修正）之定型化契約應記載及不得記載事項。","u":"https://www.ey.gov.tw/File/8886942C80253779?A=C"},{"k":"law","l":"租賃住宅委託管理定型化契約應記載及不得記載事項（內政部）","r":"租賃住宅委託管理定型化契約應記載及不得記載事項","m":"內政部於108年9月5日公告、108年12月1日生效，列於行政院定型化契約應記載及不得記載事項專區。","u":"https://www.ey.gov.tw/Page/DFB720D019CCCB0A/19994068-fc51-4e6a-9dc5-447a8dfe6bf3"},{"k":"law","l":"租賃住宅市場發展及管理條例","r":"條例第5條第2項","m":"包租業與出租人間的住宅包租契約，其應約定及不得約定事項由中央主管機關公告。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060125"}],"nt":"住宅轉租、委託管理二項之公告文件未載明授權條文，係依其列於行政院定型化契約應記載及不得記載事項專區及名稱判斷。"}},{"id":"03-01-047","c":"03","t":"03-01","n":"47","q":"某甲廠商對於某乙消費者之申訴，依消費者保護法規定，應於申訴之日起幾日內妥適處理？","o":["3個月","30日","15日","20日"],"a":"C","ty":"num","e":{"s":"ok","x":"消保法第43條第2項：企業經營者對消費者之申訴，應自申訴之日起15日內妥適處理，故選(C)。","b":[{"k":"law","l":"消費者保護法","r":"消保法第43條第2項","m":"企業經營者應自接到消費者申訴之日起15日內妥適處理。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=J0170001"}]}},{"id":"03-01-048","c":"03","t":"03-01","n":"48","q":"依消費者保護法規定，關於定型化契約之審閱期間，下列敘述何者錯誤？","o":["應有30日以內之合理審閱期間","企業經營者以定型化契約條款使消費者拋棄合理審閱期權利者，無效","違反合理審閱期規定者，該條款無效","中央主管機關得選擇特定行業，參酌定型化契約條款之重要性等事項，公告定型化契約之審閱期間"],"a":"C","ty":"neg","e":{"s":"ok","x":"(C)錯：消保法第11條之1第3項規定違反合理審閱期者，該條款「不構成契約內容」（消費者仍得主張其構成契約內容），而非無效；(A)(B)(D)分別見同條第1、2、4項，故選(C)。","b":[{"k":"law","l":"消費者保護法","r":"消保法第11條之1第3項","m":"違反審閱期規定時，相關條款原則上不納入契約內容；但消費者可以主張該條款仍屬契約內容。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=J0170001"},{"k":"law","l":"消費者保護法","r":"消保法第11條之1第1項","m":"企業經營者在與消費者簽訂定型化契約前，須給予消費者30日以內的合理期間，讓其審閱全部條款。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=J0170001"},{"k":"law","l":"消費者保護法","r":"消保法第11條之1第2項","m":"企業經營者以條款要求消費者放棄上述審閱權者，該條款無效。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=J0170001"},{"k":"law","l":"消費者保護法","r":"消保法第11條之1第4項","m":"中央主管機關可選定特定行業，衡量條款重要性、涉及事項多寡及複雜度等，公告該行業定型化契約的審閱期間。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=J0170001"}]}},{"id":"03-01-049","c":"03","t":"03-01","n":"49","q":"依照消費者保護法及其相關規定，定型化契約中之定型化契約條款牴觸個別磋商條款之約定者，其牴觸部分？","o":["效力未定","無效","構成契約之內容","不得撤銷"],"a":"B","ty":"gen","e":{"s":"ok","x":"消保法第15條：定型化條款與個別磋商的約定互相牴觸時，牴觸的部分無效，故選(B)。","b":[{"k":"law","l":"消費者保護法","r":"消保法第15條","m":"定型化條款與雙方個別協商的約定互相衝突時，衝突部分的定型化條款無效。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=J0170001"}]}},{"id":"03-01-050","c":"03","t":"03-01","n":"50","q":"下列何項原則不屬於消費者保護法中有關定型化契約的基本原則規定？","o":["契約中所用之條款，應本平等互惠之原則","契約條款如有疑義時，應為有利於消費者之解釋原則","契約條款應有價格合理之保證原則","對消費者之損害賠償責任，不得預先約定限制或免除"],"a":"C","ty":"neg","e":{"s":"ok","x":"(A)見消保法第11條第1項、(B)見第11條第2項、(D)見第10條之1；消保法並無要求契約條款須有「價格合理之保證」的規定，故選(C)。","b":[{"k":"law","l":"消費者保護法","r":"消保法第11條第1項","m":"企業經營者使用的定型化契約條款，應依平等互惠原則訂定。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=J0170001"},{"k":"law","l":"消費者保護法","r":"消保法第11條第2項","m":"定型化契約條款文義有疑義時，解釋上應偏向對消費者有利。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=J0170001"},{"k":"law","l":"消費者保護法","r":"消保法第10條之1","m":"本節所定企業經營者對消費者或第三人的損害賠償責任，不得以事前約定方式加以限制或免除。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=J0170001"}]}},{"id":"03-01-051","c":"03","t":"03-01","n":"51","q":"依照消費者保護法及其相關規定，定型化契約中之定型化契約條款牴觸個別磋商條款之約定者，下列何者正確？","o":["個別磋商條款之約定者無效","定型化契約條款無效","定型化契約條款部分無效","定型化契約條款有效"],"a":"B","ty":"gen","e":{"s":"ok","x":"消保法第15條：定型化契約條款與個別磋商條款牴觸時，其牴觸部分無效，亦即該定型化契約條款無效，個別磋商條款仍有效，故選(B)。","b":[{"k":"law","l":"消費者保護法","r":"消保法第15條","m":"定型化條款與雙方個別協商的約定互相衝突時，衝突部分的定型化條款無效。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=J0170001"}],"nt":"條文係規定「其牴觸部分無效」，選項(C)「部分無效」與(B)易混淆，依題庫答案以(B)說明。"}},{"id":"03-01-052","c":"03","t":"03-01","n":"52","q":"依照消費者保護法及其相關規定，企業經營者對於消費者之申訴，其法定之處理期限為多久？","o":["7日","10日","15日","20日"],"a":"C","ty":"num","e":{"s":"ok","x":"消保法第43條第2項：企業經營者對消費者之申訴，應自申訴之日起15日內妥適處理，故選(C)。","b":[{"k":"law","l":"消費者保護法","r":"消保法第43條第2項","m":"企業經營者應自接到消費者申訴之日起15日內妥適處理。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=J0170001"}]}},{"id":"03-01-053","c":"03","t":"03-01","n":"53","q":"有關消費者保護法所稱主管機關，下列何者正確?","o":["行政院消費者保護會","臺中市政府","高雄市消費爭議調解委員會","彰化縣消費者服務中心"],"a":"B","ty":"gen","e":{"s":"ok","x":"消保法第6條：主管機關在中央為目的事業主管機關，在直轄市為直轄市政府、在縣（市）為縣（市）政府；臺中市政府為直轄市政府，屬主管機關，故選(B)。","b":[{"k":"law","l":"消費者保護法","r":"消保法第6條","m":"主管機關分層：中央由各目的事業主管機關擔任，地方則為直轄市政府及縣（市）政府。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=J0170001"}]}},{"id":"03-01-054","c":"03","t":"03-01","n":"54","q":"依照消費者保護法及其相關規定，企業經營者有下列何者情形，處新臺幣15萬元以上150萬元以下罰鍰?","o":["企業經營者提供之商品或服務，經調查認有損害消費者生命、身體、健康或財產，或確有損害之虞","企業經營者提供之商品或服務，對消費者已發生重大損害或有發生重大損害之虞","企業經營者規避、妨礙或拒絕主管機關依第33條規定所為之調查者","企業經營者規避、妨礙或拒絕主管機關依第17條第6項規定所為之調查者"],"a":"B","ty":"gen","e":{"s":"ok","x":"(B)為消保法第37條所定已發生或有發生重大損害之虞且情況危急之情形，依第59條得處新臺幣15萬至150萬元罰鍰，故選(B)。","b":[{"k":"law","l":"消費者保護法","r":"消保法第37條","m":"商品或服務對消費者已造成重大損害，或有重大損害之虞且情況危急時，地方政府除前條處置外，須立即透過大眾傳播媒體公布企業經營者名稱、地址及其商品或服務等。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=J0170001"},{"k":"law","l":"消費者保護法","r":"消保法第59條","m":"有第37條情形（已生或可能發生重大損害且情況危急）者，主管機關除依第36、37條處置外，並得處新臺幣15萬至150萬元罰鍰。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=J0170001"}]}},{"id":"03-01-055","c":"03","t":"03-01","n":"55","q":"依照消費者保護法及其相關規定，企業經營者有下列何者情形，所處罰鍰額度最高?","o":["企業經營者提供之商品或服務，經調查認有損害消費者生命、身體、健康或財產，或確有損害之虞","企業經營者提供之商品或服務，對消費者已發生重大損害或有發生重大損害之虞","企業經營者規避、妨礙或拒絕主管機關依第33條規定所為之調查者","企業經營者規避、妨礙或拒絕主管機關依第十七條第六項規定所為之調查者"],"a":"B","ty":"gen","e":{"s":"ok","x":"(B)屬第37條情形，依消保法第59條得處新臺幣15萬至150萬元；(A)違反第36條命令依第58條為6萬至150萬元，(C)(D)規避調查依第57條為3萬至30萬元，以(B)額度最高，故選(B)。","b":[{"k":"law","l":"消費者保護法","r":"消保法第59條","m":"有第37條情形（已生或可能發生重大損害且情況危急）者，主管機關除依第36、37條處置外，並得處新臺幣15萬至150萬元罰鍰。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=J0170001"},{"k":"law","l":"消費者保護法","r":"消保法第58條","m":"違反主管機關依第36條或第38條所為命令者，處新臺幣6萬至150萬元罰鍰，並得按次處罰。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=J0170001"},{"k":"law","l":"消費者保護法","r":"消保法第57條","m":"對主管機關依第17條第6項、第33條或第38條進行的調查加以規避、妨礙或拒絕者，處新臺幣3萬至30萬元罰鍰，並得按次處罰。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=J0170001"},{"k":"law","l":"消費者保護法","r":"消保法第36條","m":"經第33條調查確認商品或服務確有損害或有損害之虞者，地方政府應命企業經營者限期改善、回收或銷燬，必要時得命立即停止製造、經銷或服務等。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=J0170001"},{"k":"law","l":"消費者保護法","r":"消保法第37條","m":"商品或服務對消費者已造成重大損害，或有重大損害之虞且情況危急時，地方政府除前條處置外，須立即透過大眾傳播媒體公布企業經營者名稱、地址及其商品或服務等。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=J0170001"}],"nt":"(A)(B)上限同為150萬元，(B)下限較高；(A)之罰鍰以違反第36條所為命令為前提。"}},{"id":"03-01-056","c":"03","t":"03-01","n":"56","q":"依照消費者保護法及其相關規定，企業經營者有下列何者情形，處新臺幣6萬元以上150萬元以下罰鍰?","o":["企業經營者提供之商品或服務，經調查認有損害消費者生命、身體、健康或財產，或確有損害之虞","企業經營者提供之商品或服務，對消費者已發生重大損害或有發生重大損害之虞","企業經營者規避、妨礙或拒絕主管機關依第33條規定所為之調查者","企業經營者使用定型化契約，違反中央主管機關公告之應記載或不得記載事項者，經再次令其限期改正而屆期不改正者"],"a":"A","ty":"gen","e":{"s":"ok","x":"(A)為消保法第36條應命限期改善、回收等之情形，企業經營者違反依該條所為命令者，依第58條處新臺幣6萬至150萬元罰鍰，故選(A)。","b":[{"k":"law","l":"消費者保護法","r":"消保法第36條","m":"經第33條調查確認商品或服務確有損害或有損害之虞者，地方政府應命企業經營者限期改善、回收或銷燬，必要時得命立即停止製造、經銷或服務等。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=J0170001"},{"k":"law","l":"消費者保護法","r":"消保法第58條","m":"違反主管機關依第36條或第38條所為命令者，處新臺幣6萬至150萬元罰鍰，並得按次處罰。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=J0170001"}],"nt":"罰鍰以違反第36條所為命令為前提，選項文字僅描述第36條之情形。"}},{"id":"03-01-057","c":"03","t":"03-01","n":"57","q":"依照消費者保護法及其相關規定，企業經營者有下列何者情形，處新臺幣3萬元以上30萬元以下罰鍰?","o":["企業經營者提供之商品或服務，經調查認有損害消費者生命、身體、健康或財產，或確有損害之虞","企業經營者提供之商品或服務，對消費者已發生重大損害或有發生重大損害之虞","企業經營者規避、妨礙或拒絕主管機關依第33條規定所為之調查者","企業經營者使用定型化契約，違反中央主管機關公告之應記載或不得記載事項者，經再次令其限期改正而屆期不改正者"],"a":"C","ty":"gen","e":{"s":"ok","x":"消保法第57條：對主管機關依第33條進行的調查加以規避、妨礙或拒絕者，處新臺幣3萬至30萬元罰鍰，故選(C)。","b":[{"k":"law","l":"消費者保護法","r":"消保法第57條","m":"對主管機關依第17條第6項、第33條或第38條進行的調查加以規避、妨礙或拒絕者，處新臺幣3萬至30萬元罰鍰，並得按次處罰。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=J0170001"}]}},{"id":"03-01-058","c":"03","t":"03-01","n":"58","q":"依照消費者保護法及其相關規定，企業經營者有下列何者情形，處新臺幣5萬元以上50萬元以下罰鍰?","o":["企業經營者提供之商品或服務，經調查認有損害消費者生命、身體、健康或財產，或確有損害之虞","企業經營者提供之商品或服務，對消費者已發生重大損害或有發生重大損害之虞","企業經營者規避、妨礙或拒絕主管機關依第33條規定所為之調查者","企業經營者使用定型化契約，違反中央主管機關公告之應記載或不得記載事項者，經再次令其限期改正而屆期不改正者"],"a":"D","ty":"gen","e":{"s":"ok","x":"消保法第56條之1：違反公告之應記載或不得記載事項，經再次限期改正仍未改正者，處新臺幣5萬至50萬元罰鍰，故選(D)。","b":[{"k":"law","l":"消費者保護法","r":"消保法第56條之1","m":"使用定型化契約違反中央主管機關所公告的應記載或不得記載事項，經限期改正未改者處新臺幣3萬至30萬元；再次限期改正仍未改者，處5萬至50萬元並得按次處罰。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=J0170001"}]}},{"id":"03-01-059","c":"03","t":"03-01","n":"59","q":"依照消費者保護法及其相關規定，企業經營者有下列何者情形，處新臺幣2萬元以上20萬元以下罰鍰?","o":["企業經營者提供之商品或服務，經調查認有損害消費者生命、身體、健康或財產，或確有損害之虞","企業經營者提供之商品或服務，對消費者已發生重大損害或有發生重大損害之虞","企業經營者輸入之商品或服務所附中文標示及說明書，其內容較原產地之標示及說明書簡略者","企業經營者使用定型化契約，違反中央主管機關公告之應記載或不得記載事項者，經再次令其限期改正而屆期不改正者"],"a":"C","ty":"gen","e":{"s":"ok","x":"(C)違反消保法第24條第2項（輸入品中文標示及說明書不得較原產地簡略），依第56條經通知改正而逾期未改者，處新臺幣2萬至20萬元罰鍰，故選(C)。","b":[{"k":"law","l":"消費者保護法","r":"消保法第24條第2項","m":"輸入的商品或服務須附中文標示及說明書，內容不可比原產地版本簡略。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=J0170001"},{"k":"law","l":"消費者保護法","r":"消保法第56條","m":"違反第24條（標示）、第25條（保證書）或第26條（包裝），經主管機關通知改正而逾期未改者，處新臺幣2萬至20萬元罰鍰。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=J0170001"}],"nt":"第56條處罰以經主管機關通知改正而逾期不改正為要件。"}},{"id":"03-01-060","c":"03","t":"03-01","n":"60","q":"依照消費者保護法及其相關規定，下列何種訴訟，須繳交裁判費?","o":["消費者保護團體以自己之名義提起第50條訴訟，其標的價額未超過新臺幣60萬元者","消費者保護團體以自己之名義提起第50條訴訟，其標的價額超過新臺幣60萬元，其超過部分","消費者保護官依本法第53條規定向法院提起之訴訟","消費者保護團體依本法第53條規定向法院提起之訴訟"],"a":"A","ty":"num","e":{"s":"ok","x":"消保法第52條僅就第50條訴訟標的價額超過60萬元部分免繳裁判費，未超過部分仍須繳納；第53條訴訟則免繳裁判費，故選(A)。","b":[{"k":"law","l":"消費者保護法","r":"消保法第52條","m":"消保團體以自己名義提起第50條訴訟，標的價額超過新臺幣60萬元的部分免繳裁判費。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=J0170001"},{"k":"law","l":"消費者保護法","r":"消保法第53條","m":"消保官或消保團體可就企業經營者重大違反本法的行為訴請停止或禁止，此類訴訟免繳裁判費。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=J0170001"}]}},{"id":"03-01-061","c":"03","t":"03-01","n":"61","q":"消費者保護法有關懲罰性賠償金規定，下列何者有誤?","o":["因企業經營者之故意所致之損害，消費者得請求損害額5倍以下之懲罰性賠償金","因企業經營者之重大過失所致之損害，消費者得請求損害額5倍以下之懲罰性賠償金","因企業經營者之重大過失所致之損害，消費者得請求損害額3倍以下之懲罰性賠償金","因企業經營者之過失所致之損害，消費者得請求損害額1倍以下之懲罰性賠償金"],"a":"B","ty":"neg","e":{"s":"ok","x":"消保法第51條：重大過失致損時懲罰性賠償金上限為損害額3倍，(B)稱5倍有誤，故選(B)。","b":[{"k":"law","l":"消費者保護法","r":"消保法第51條","m":"依本法起訴時，企業經營者故意致損者，可請求損害額5倍以下懲罰性賠償金；重大過失為3倍以下；過失為1倍以下。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=J0170001"}]}},{"id":"03-01-062","c":"03","t":"03-01","n":"62","q":"因企業經營者之過失所致之損害，依據消費者保護法，消費者得請求損害額幾倍以下之懲罰性賠償金?","o":["5倍","3倍","2倍","1倍"],"a":"D","ty":"num","e":{"s":"ok","x":"消保法第51條：因企業經營者過失所致之損害，消費者得請求損害額1倍以下之懲罰性賠償金，故選(D)。","b":[{"k":"law","l":"消費者保護法","r":"消保法第51條","m":"依本法起訴時，企業經營者故意致損者，可請求損害額5倍以下懲罰性賠償金；重大過失為3倍以下；過失為1倍以下。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=J0170001"}]}},{"id":"03-01-063","c":"03","t":"03-01","n":"63","q":"消費者保護法有關懲罰性賠償金規定，下列何者正確?","o":["因企業經營者之故意所致之損害，消費者得請求損害額3倍以下之懲罰性賠償金","因企業經營者之重大過失所致之損害，消費者得請求損害額5倍以下之懲罰性賠償金","因企業經營者之重大過失所致之損害，消費者得請求損害額3倍以下之懲罰性賠償金","因企業經營者之過失所致之損害，消費者得請求損害額2倍以下之懲罰性賠償金"],"a":"C","ty":"num","e":{"s":"ok","x":"消保法第51條：故意為5倍以下、重大過失為3倍以下、過失為1倍以下，(C)正確，故選(C)。","b":[{"k":"law","l":"消費者保護法","r":"消保法第51條","m":"依本法起訴時，企業經營者故意致損者，可請求損害額5倍以下懲罰性賠償金；重大過失為3倍以下；過失為1倍以下。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=J0170001"}]}},{"id":"03-01-064","c":"03","t":"03-01","n":"64","q":"消費者保護法有關消費者保護團體之任務，下列何者正確?","o":["接受消費者申訴，調解消費爭議","消費者保護計畫之研擬、修訂及執行成果檢討","消費者保護方案之審議及其執行之推動、聯繫與考核","國內外消費者保護趨勢及其與經濟社會建設有關問題之研究"],"a":"A","ty":"gen","e":{"s":"ok","x":"接受消費者申訴、調解消費爭議為消保法第28條第7款之消保團體任務；(B)(C)(D)為第41條第1項所列行政院推動之消費者保護事務，故選(A)。","b":[{"k":"law","l":"消費者保護法","r":"消保法第28條第7款","m":"消保團體任務之一：受理消費者申訴並調解消費爭議。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=J0170001"},{"k":"law","l":"消費者保護法","r":"消保法第41條第1項","m":"行政院推動消保事務，包括基本政策研擬、消保計畫研擬修訂及成果檢討、方案審議推動考核、國內外消保趨勢研究、教育宣導與消費資訊蒐集提供、部會協調及監督等。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=J0170001"}]}},{"id":"03-01-065","c":"03","t":"03-01","n":"65","q":"關於商品或服務價格之調查、比較、研究、發表，依據消費者保護法規定，係屬下列何者的任務?","o":["消費者保護團體","消費保護官","直轄市、縣(市)政府","行政院消費者保護會"],"a":"A","ty":"gen","e":{"s":"ok","x":"消保法第28條第1款將商品或服務價格的調查、比較、研究及發表列為消保團體任務，故選(A)。","b":[{"k":"law","l":"消費者保護法","r":"消保法第28條第1款","m":"消保團體任務之一：對商品或服務的價格進行調查、比較、研究並發表結果。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=J0170001"}]}},{"id":"03-01-066","c":"03","t":"03-01","n":"66","q":"定期公告消費者保護之執行結果，依據消費者保護法規定，係屬下列何者的任務?","o":["行政院","消費者保護團體","消費者保護官","直轄市、縣(市)政府"],"a":"A","ty":"gen","e":{"s":"ok","x":"消保法第41條第2項：消費者保護之執行結果及有關資料，由行政院定期公告，故選(A)。","b":[{"k":"law","l":"消費者保護法","r":"消保法第41條第2項","m":"消費者保護的執行結果及相關資料，由行政院定期公告。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=J0170001"}]}},{"id":"03-01-067","c":"03","t":"03-01","n":"67","q":"關於消費資訊之諮詢，依據消費者保護法規定，係屬下列何者的任務?","o":["消費者保護團體","消費保護官","直轄市、縣(市)政府","行政院消費者保護會"],"a":"A","ty":"gen","e":{"s":"ok","x":"消保法第28條第4款：消費資訊之諮詢、介紹與報導為消保團體之任務，故選(A)。","b":[{"k":"law","l":"消費者保護法","r":"消保法第28條第4款","m":"消保團體任務之一：提供消費資訊的諮詢、介紹與報導。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=J0170001"}]}},{"id":"03-01-068","c":"03","t":"03-01","n":"68","q":"關於消費者保護之教育宣導、消費資訊之蒐集及提供，依據消費者保護法規定，係屬下列何者的任務?","o":["直轄市、縣(市)政府","行政院","消費者保護官","消費者保護團體"],"a":"B","ty":"gen","e":{"s":"ok","x":"消保法第41條第1項將消保教育宣導及消費資訊的蒐集、提供，列為行政院推動事項，故選(B)。","b":[{"k":"law","l":"消費者保護法","r":"消保法第41條第1項","m":"行政院推動消保事務，包括基本政策研擬、消保計畫研擬修訂及成果檢討、方案審議推動考核、國內外消保趨勢研究、教育宣導與消費資訊蒐集提供、部會協調及監督等。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=J0170001"}]}},{"id":"03-01-069","c":"03","t":"03-01","n":"69","q":"消費者保護刊物之編印，依據消費者保護法規定，係屬下列何者的任務?","o":["消費者保護團體","消費保護官","企業經營者","各產業公會"],"a":"A","ty":"gen","e":{"s":"ok","x":"消保法第28條第5款：消費者保護刊物之編印發行為消保團體之任務，故選(A)。","b":[{"k":"law","l":"消費者保護法","r":"消保法第28條第5款","m":"消保團體任務之一：編印並發行消費者保護刊物。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=J0170001"}]}},{"id":"03-01-070","c":"03","t":"03-01","n":"70","q":"國內外消費者保護趨勢及其與經濟社會建設有關問題之研究，依據消費者保護法規定，係屬下列何者的任務?","o":["直轄市、縣(市)政府","消費者保護團體","行政院","各產業公會"],"a":"C","ty":"gen","e":{"s":"ok","x":"消保法第41條第1項將國內外消保趨勢以及其與經濟社會建設相關問題的研究，列為行政院推動事項，故選(C)。","b":[{"k":"law","l":"消費者保護法","r":"消保法第41條第1項","m":"行政院推動消保事務，包括基本政策研擬、消保計畫研擬修訂及成果檢討、方案審議推動考核、國內外消保趨勢研究、教育宣導與消費資訊蒐集提供、部會協調及監督等。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=J0170001"}]}},{"id":"03-01-071","c":"03","t":"03-01","n":"71","q":"有關消費者意見之調查、分析、歸納之任務，依據消費者保護法規定，係屬下列何者的任務?","o":["消費者保護團體","消費者保護官","各產業公會","中央目的事業主管機關"],"a":"A","ty":"gen","e":{"s":"ok","x":"消保法第28條第6款將消費者意見的調查、分析及歸納列為消保團體任務，故選(A)。","b":[{"k":"law","l":"消費者保護法","r":"消保法第28條第6款","m":"消保團體任務之一：對消費者意見進行調查、分析與歸納。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=J0170001"}]}},{"id":"03-01-072","c":"03","t":"03-01","n":"72","q":"依據消費者保護法規定，下列何者敘述正確?","o":["企業經營者主張其服務於提供時，符合當時科技或專業水準可合理期待之安全性者，應由學術機構負舉證責任","企業經營者主張其服務於提供時，符合當時科技或專業水準可合理期待之安全性者，應負舉證責任","企業經營者主張其服務於提供時，符合當時科技或專業水準可合理期待之安全性者，應由目的事業主管機關負舉證責任","企業經營者主張其服務於提供時，符合當時科技或專業水準可合理期待之安全性者，應由消保官負舉證責任"],"a":"B","ty":"gen","e":{"s":"ok","x":"消保法第7條之1第1項：企業經營者主張其服務已達當時科技或專業水準所能合理期待的安全性時，應由企業經營者自行舉證，故選(B)。","b":[{"k":"law","l":"消費者保護法","r":"消保法第7條之1第1項","m":"企業經營者主張其商品或服務已達到當時科技、專業水準所能合理期待的安全性者，由企業經營者就此事實舉證。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=J0170001"}]}},{"id":"03-01-073","c":"03","t":"03-01","n":"73","q":"建議政府採取適當之消費者保護立法或行政措施，依據消費者保護法規定，係屬下列何者的任務?","o":["消費者保護團體","行政院","各產業公會","中央目的事業主管機關"],"a":"A","ty":"gen","e":{"s":"ok","x":"消保法第28條第9款將向政府建議採行適當消保立法或行政措施列為消保團體任務，故選(A)。","b":[{"k":"law","l":"消費者保護法","r":"消保法第28條第9款","m":"消保團體任務之一：向政府建議採行適當的消費者保護立法或行政措施。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=J0170001"}]}},{"id":"03-01-074","c":"03","t":"03-01","n":"74","q":"企業經營者提供服務時，商品或服務具有危害消費者生命、身體、健康、財產之可能者，依據消費者保護法規定，應如何處置?","o":["應於明顯處為警告標示及緊急處理危險之方法","應為消費者投保意外險","應成立消費者保護基金","應和消費者簽訂意外責任除外切結書"],"a":"A","ty":"gen","e":{"s":"ok","x":"消保法第7條第2項：商品或服務可能危及消費者生命、身體、健康或財產時，企業經營者須在顯眼處作警告標示並說明緊急處理危險的方法，故選(A)。","b":[{"k":"law","l":"消費者保護法","r":"消保法第7條第2項","m":"商品或服務可能危害消費者生命、身體、健康或財產者，應在明顯處標示警告，並說明緊急處理危險的方法。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=J0170001"}]}},{"id":"03-01-075","c":"03","t":"03-01","n":"75","q":"依據消費者保護法規定，企業經營者提供服務時，應如何確保該商品或服務?","o":["符合當時科技或專業水準可合理期待之安全性","符合大眾客觀通常認定之安全性","符合當時科技或專業水準可期待之價值感","符合國內外最新科技標準之品質保證"],"a":"A","ty":"gen","e":{"s":"ok","x":"消保法第7條第1項：企業經營者提供服務時，須確保服務具備當時科技或專業水準下可合理期待的安全性，故選(A)。","b":[{"k":"law","l":"消費者保護法","r":"消保法第7條第1項","m":"提供商品或服務的企業經營者，應確保商品流入市場或服務提供時，具備當時科技或專業水準下可合理期待的安全性。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=J0170001"}]}},{"id":"04-01-001","c":"04","t":"04-01","n":"01","q":"依據公寓大廈管理條例之規定，專有部分是指公寓大廈之一部分為區分所有之標的，且具有何種功能之獨立性？","o":["管理上之獨立性","維護上之獨立性","使用上之獨立性","外觀上之獨立性"],"a":"C","ty":"gen","e":{"s":"ok","x":"條例第3條第3款將專有部分定義為具有使用上獨立性、且可作為區分所有標的之部分，故選(C)。","b":[{"k":"law","l":"公寓大廈管理條例","r":"公寓大廈管理條例第3條第3款","m":"專有部分：公寓大廈中可單獨使用（具使用上獨立性）、並能作為區分所有標的之部分。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070118"}]}},{"id":"04-01-002","c":"04","t":"04-01","n":"02","q":"依據公寓大廈管理條例對「住戶」之定義，包括下列何者？","o":["區分所有權人、承租人及取得停車空間建築物之所有權人","經區分所有權人同意執行租賃事務之承辦人","無合法占有權之占有人","取得停車空間建築物之承租人"],"a":"A","ty":"gen","e":{"s":"ok","x":"條例第3條第8款所稱住戶，包括區分所有權人、承租人、經區分所有權人同意使用專有部分者，以及取得停車空間建築物所有權者，故選(A)。","b":[{"k":"law","l":"公寓大廈管理條例","r":"公寓大廈管理條例第3條第8款","m":"住戶的範圍：區分所有權人、承租人、其他經區分所有權人同意而使用專有部分的人，以及已取得停車空間建築物所有權的人。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070118"}]}},{"id":"04-01-003","c":"04","t":"04-01","n":"03","q":"公寓大廈之住戶基於維護及修繕專有部分及約定專用部分，必須進入使用共用部分，下列敘述何者正確?","o":["得經管理服務人同意後進入使用","得經專業技師鑑定同意後進入使用","得經由維護修繕負責人認定後進入使用","得經管理負責人或管委會同意後進入使用"],"a":"D","ty":"gen","e":{"s":"ok","x":"條例第6條第1項第4款：住戶因維修專有或約定專用部分而必須使用共用部分時，應先經管理負責人或管理委員會同意，故選(D)。","b":[{"k":"law","l":"公寓大廈管理條例","r":"公寓大廈管理條例第6條第1項第4款","m":"住戶為維修專有或約定專用部分、或設置管線而必須使用共用部分時，要先取得管理負責人或管理委員會同意。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070118"}]}},{"id":"04-01-004","c":"04","t":"04-01","n":"04","q":"包租公司基於經營之需要，預計在公寓大廈社區之外牆設置廣告招牌，除應依法令規定辦理之外，下列敘述何者正確?","o":["應依該社區規約或區分所有權人會議決議及向縣市政府主管機關完成報備後辦理","應向社區管委會主委報備後辦理","應向社區管委會完成報備後辦理","應向社區管委會或管理負責人完成報備後辦理"],"a":"A","ty":"gen","e":{"s":"ok","x":"條例第8條第1項：在外牆面設置廣告物，除依法令辦理外，社區規約或區權會決議已有規定並向直轄市、縣（市）主管機關報備者，應受其限制，故選(A)。","b":[{"k":"law","l":"公寓大廈管理條例","r":"公寓大廈管理條例第8條第1項","m":"周圍上下、外牆面、樓頂平臺及非專有的防空避難設備，變更構造、顏色或設廣告物、鐵鋁窗等，除依法令辦理外，規約或區權會決議已有規定並向直轄市、縣（市）主管機關報備者，須受其限制。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070118"}]}},{"id":"04-01-005","c":"04","t":"04-01","n":"05","q":"依據公寓大廈管理條例之規定，該公寓大廈設專有部分之共同壁及樓地板或其內之管線，進行維修之費用應如何負擔?","o":["由管委會協議後認定","由共同壁雙方或樓地板上下方之區分所有權人負擔","由需要維修之住戶負擔","由社區公共基金支付"],"a":"B","ty":"gen","e":{"s":"ok","x":"條例第12條：專有部分的共同壁、樓地板或其內管線維修費用，由共同壁雙方或樓地板上下方的區分所有權人負擔（可歸責一方者由其負擔），故選(B)。","b":[{"k":"law","l":"公寓大廈管理條例","r":"公寓大廈管理條例第12條","m":"專有部分共同壁、樓地板或其內管線的維修費用，由共同壁兩側或樓地板上下方的區分所有權人分擔；修繕原因可歸責於某一方時，由該方負擔。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070118"}]}},{"id":"04-01-006","c":"04","t":"04-01","n":"06","q":"包租公司承租一樓店面且出租營業，依據公寓大廈管理條例之規定，於公寓大廈內依法經營何種行業，應投保公共意外責任保險?","o":["寢具生活用品業","鐘錶眼鏡業","服飾生活用品業","日式料理餐飲業"],"a":"D","ty":"gen","e":{"s":"ok","x":"條例第17條第1項規定在公寓大廈內合法經營餐飲業、瓦斯業、電焊業或其他危險性營業者，須投保公共意外責任保險；日式料理屬餐飲業，故選(D)。","b":[{"k":"law","l":"公寓大廈管理條例","r":"公寓大廈管理條例第17條第1項","m":"住戶在大廈內合法經營餐飲業、瓦斯業、電焊業或其他危險性營業，或存放爆炸性、易燃性物品者，須投保公共意外責任保險。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070118"}]}},{"id":"04-01-007","c":"04","t":"04-01","n":"07","q":"依據公寓大廈管理條例之規定，公寓大廈社區之區分所有權人請求召開臨時會議，應符合何種要求?","o":["全體區分所有權人之請求","區分所有權人1/5以上之請求","區分所有權人提出請求及理由後召開","區分所有權人依據必要性請求召開"],"a":"B","ty":"gen","ns":1,"e":{"s":"ok","x":"條例第25條第2項：經五分之一以上區分所有權人（其區分所有權比例合計亦達五分之一以上）以書面說明目的及理由請求時，應召開臨時會議，故選(B)。","b":[{"k":"law","l":"公寓大廈管理條例","r":"公寓大廈管理條例第25條第2項","m":"臨時會議的召開時機：發生重大事故需及時處理且經管理負責人或管委會請求；或經五分之一以上區分所有權人及其區分所有權比例合計五分之一以上，以書面敘明目的與理由請求。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070118"}]}},{"id":"04-01-008","c":"04","t":"04-01","n":"08","q":"依據公寓大廈管理條例之規定，區分所有權人因故無法出席區分所有權人會議時，得以書面委託代理人出席，下列何者不符合代理人資格?","o":["配偶","代管業者","承租人","包租業"],"a":"B","ty":"neg","e":{"s":"ok","x":"條例第27條第3項限定代理人為配偶、有行為能力之直系血親、其他區分所有權人或承租人；包租業承租住宅後轉租，具承租人身分，代管業者僅受託管理而不承租，不在可受託之列，故選(B)。","b":[{"k":"law","l":"公寓大廈管理條例","r":"公寓大廈管理條例第27條第3項","m":"區分所有權人不能出席時，可書面委託配偶、有行為能力的直系血親、其他區分所有權人或承租人代理；受託比例達全部五分之一以上或受託人數超過五分之一者，超出部分不算入。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070118"},{"k":"law","l":"租賃住宅市場發展及管理條例","r":"租賃住宅市場發展及管理條例第3條第4款","m":"代管業：公司受出租人委託，代為管理出租住宅的業務，本身並不承租。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060125"},{"k":"law","l":"租賃住宅市場發展及管理條例","r":"租賃住宅市場發展及管理條例第3條第5款","m":"包租業：公司先承租住宅、再轉租給他人並負責管理的業務，具有承租人身分。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060125"}]}},{"id":"04-01-009","c":"04","t":"04-01","n":"09","q":"依據公寓大廈管理條例之規定，區分所有權人會議之決議方式，除規約另有規定外，原則上應有出席人數多少比例以上及其區分所有權比例占出席人數區分所有權多少比例以上同意行之?","o":["2/3，2/3","3/4，3/4","2/3，3/4","3/4，2/3"],"a":"C","ty":"num","e":{"s":"ok","x":"條例第31條：除規約另有規定外，區權會決議須區分所有權人及其比例各三分之二以上出席，並經出席人數及比例各四分之三以上同意，故選(C)。","b":[{"k":"law","l":"公寓大廈管理條例","r":"公寓大廈管理條例第31條","m":"區權會的決議，除規約另有規定外，要有三分之二以上區分所有權人及比例出席，並經出席者人數及其比例各四分之三以上同意。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070118"}]}},{"id":"04-01-010","c":"04","t":"04-01","n":"10","q":"依據公寓大廈管理條例之規定，社區管理委員會主任委員之選任，下列敘述何者正確?","o":["任期一任3年","任期兩年","連選得繼續連任","連選得連任1次"],"a":"D","ty":"num","e":{"s":"ok","x":"條例第29條第3項：任期由會議或規約定為1至2年，主任委員連選只得連任一次（一般委員才可連選連任），故選(D)。","b":[{"k":"law","l":"公寓大廈管理條例","r":"公寓大廈管理條例第29條第3項","m":"任期依會議決議或規約定為1至2年；主任委員、管理負責人及負責財務、監察的委員連選只能連任一次，其他委員連選可連任；未規定者任期1年。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070118"}]}},{"id":"04-01-011","c":"04","t":"04-01","n":"11","q":"包租公司欲在公寓大廈社區之樓頂平台，設置廣告物，除應依法令規定辦理外，尚應受何種限制?","o":["經頂層區分所有權人同意","經頂層住戶同意","經社區管委會同意","經社區管理負責人同意"],"a":"A","ty":"gen","e":{"s":"ok","x":"條例第33條第2款：在樓頂平臺（屋頂）設置廣告物，須經頂層區分所有權人同意，否則區權會決議不生效力，故選(A)。","b":[{"k":"law","l":"公寓大廈管理條例","r":"公寓大廈管理條例第33條第2款","m":"區權會決議在外牆面或樓頂平臺設廣告物、強波發射設備等，設於屋頂者要經頂層區分所有權人同意，設於其他樓層者要經該樓層區分所有權人同意，否則不生效力。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070118"}]}},{"id":"04-01-012","c":"04","t":"04-01","n":"12","q":"包租公司欲在公寓大廈社區第三樓層外牆面設置廣告招牌，除應依法令規定辦理外，尚應受何種限制?","o":["經該樓層區分所有權人同意","經該樓層住戶同意","經社區管委會同意","經社區管理負責人同意"],"a":"A","ty":"gen","e":{"s":"ok","x":"條例第33條第2款：在屋頂以外樓層的外牆面設置廣告物，須經該樓層區分所有權人同意，故選(A)。","b":[{"k":"law","l":"公寓大廈管理條例","r":"公寓大廈管理條例第33條第2款","m":"區權會決議在外牆面或樓頂平臺設廣告物、強波發射設備等，設於屋頂者要經頂層區分所有權人同意，設於其他樓層者要經該樓層區分所有權人同意，否則不生效力。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070118"}]}},{"id":"04-01-013","c":"04","t":"04-01","n":"13","q":"公寓大廈社區召開區分所有權人會議，應作成會議紀錄，載明開會經過及決議事項，由誰簽名後，於會後幾日內送達各區分所有權人並公告之?","o":["主委簽名，20日內","主席簽名，20日內","主委簽名，15日內","主席簽名，15日內"],"a":"D","ty":"num","e":{"s":"ok","x":"條例第34條第1項：區權會紀錄由主席簽名，並於會後15日內送達各區分所有權人並公告，故選(D)。","b":[{"k":"law","l":"公寓大廈管理條例","r":"公寓大廈管理條例第34條第1項","m":"區權會應作成會議紀錄寫明開會經過與決議事項，由主席簽名，並在會後15日內送達各區分所有權人並公告。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070118"}]}},{"id":"04-01-014","c":"04","t":"04-01","n":"14","q":"依據公寓大廈管理條例之規定，管理委員會之職務，下列何者正確?","o":["約定私有部分之維修維護","住戶共同事務應興革事項之權利","共有及共用部分之經營及增加收益","管理服務人之委任、僱傭及監督"],"a":"D","ty":"gen","e":{"s":"ok","x":"條例第36條第9款將管理服務人之委任、僱傭及監督列為管委會職務；(B)條文為興革事項之「建議」而非權利，(C)條文為清潔、維護、修繕及一般改良而非經營增加收益，故選(D)。","b":[{"k":"law","l":"公寓大廈管理條例","r":"公寓大廈管理條例第36條第9款","m":"管理服務人的委任、僱傭及監督，是管理委員會的職務之一。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070118"},{"k":"law","l":"公寓大廈管理條例","r":"公寓大廈管理條例第36條","m":"管委會職務包括執行區權會決議、共有及共用部分的清潔維護修繕與一般改良、對住戶共同事務提出興革建議、保管規約圖說等文件、委任僱傭並監督管理服務人等。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070118"}]}},{"id":"04-01-015","c":"04","t":"04-01","n":"15","q":"依據公寓大廈管理條例之規定，社區管理委員會應向何者負責，並向其報告會務?","o":["管委會主委","縣市主管機關及管委會","區分所有權人會議及管委會","區分所有權人會議"],"a":"D","ty":"gen","e":{"s":"ok","x":"條例第39條：管委會須對區分所有權人會議負責，且須向該會議報告會務，故選(D)。","b":[{"k":"law","l":"公寓大廈管理條例","r":"公寓大廈管理條例第39條","m":"管理委員會對區分所有權人會議負責，並應向其報告會務。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070118"}]}},{"id":"04-01-016","c":"04","t":"04-01","n":"16","q":"依據公寓大廈管理條例之規定，公寓大廈管理維護公司應依規定執行業務，下列何者正確？","o":["聘僱一定人數領有地方主管機關核發認可之繼續性從業之管理服務人員","對管理服務人員，負監督考核處份之責","指派管理服務人員積極參與包租及代管事務","應依業務執行規範執行業務"],"a":"D","ty":"gen","e":{"s":"ok","x":"條例第43條要求管理維護公司依業務執行規範執行業務；(A)認可證由中央主管機關核發，(B)條文為負監督考核之責，(C)條文未有包租代管事務，故選(D)。","b":[{"k":"law","l":"公寓大廈管理條例","r":"公寓大廈管理條例第43條","m":"管理維護公司應依規定類別聘僱一定人數、領有中央主管機關認可證的繼續性從業管理服務人員並負監督考核之責，指派其辦理管理維護事務，且依業務執行規範執行業務。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070118"}]}},{"id":"04-01-017","c":"04","t":"04-01","n":"17","q":"受僱於公寓大廈管理維護公司之管理服務人員，應依規定執行業務，下列何者正確?","o":["得將管理服務人員認可證提供他人使用","得同時受聘於二家以上管理維護公司","應參加中央主管機關舉辦或委託相關機構團體舉辦之訓練","應依核准業務類別之外，增加包租業務或代管業務"],"a":"C","ty":"gen","ns":1,"e":{"s":"ok","x":"條例第45條：管理服務人員不得將認可證提供他人使用，並應參加中央主管機關舉辦或委託相關機構、團體辦理之訓練，故選(C)。","b":[{"k":"law","l":"公寓大廈管理條例","r":"公寓大廈管理條例第45條","m":"管理服務人員應依核准的業務類別項目執業，不可把認可證借給他人或使用他人的認可證，並須參加中央主管機關舉辦或委託相關機構、團體辦理的訓練。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070118"}]}},{"id":"04-01-018","c":"04","t":"04-01","n":"18","q":"區分所有權人或住戶違反公寓大廈管理條例第6條規定之住戶應遵守事項，主管機關受理住戶、管理負責人或管委會之請求，經通知限期改善，屆期不改善者，縣市主管機關得處多少罰鍰?","o":["1000元~5000元","1500元~3000元","1500元~10000元","3000元~15000元"],"a":"D","ty":"num","e":{"s":"ok","x":"條例第47條第3款：違反第6條規定，經主管機關通知限期改善而屆期不改善者，處新臺幣3,000元以上15,000元以下罰鍰，故選(D)。","b":[{"k":"law","l":"公寓大廈管理條例","r":"公寓大廈管理條例第47條第3款","m":"區分所有權人或住戶違反第6條，主管機關受理請求並通知限期改善，屆期仍未改善者，處新臺幣3,000元以上15,000元以下罰鍰。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070118"}]}},{"id":"04-01-019","c":"04","t":"04-01","n":"19","q":"公寓大廈社區一樓住戶，基於增加營業使用面積，違反公寓大廈管理條例第16條規定，自行私設路障妨礙出入，主管機關得令其限期改善，屆期不改善者，縣市主管機關得處多少罰鍰?","o":["3萬元~30萬元","4萬元~20萬元","20萬元~50萬元","50萬元~250萬元"],"a":"B","ty":"num","e":{"s":"ok","x":"私設路障妨礙出入違反條例第16條第2項，依第49條第1項處新臺幣4萬元以上20萬元以下罰鍰，故選(B)。","b":[{"k":"law","l":"公寓大廈管理條例","r":"公寓大廈管理條例第16條第2項","m":"住戶不可在樓梯間、共同走廊、私設通路、防火巷弄、退縮空地、開放空間等處堆放雜物、設柵欄門扇、營業使用、違規設廣告物或私設路障；開放空間等另有經核准範圍內的例外。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070118"},{"k":"law","l":"公寓大廈管理條例","r":"公寓大廈管理條例第49條第1項","m":"違反第5條、經制止仍違反第8條第1項或第9條第2項、擅自變更專有或約定專用之使用、違反第16條第2項或第3項等行為，處新臺幣4萬元以上20萬元以下罰鍰。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070118"}]}},{"id":"04-01-020","c":"04","t":"04-01","n":"20","q":"公寓大廈社區住戶於防火巷弄、樓梯間及共同走廊等處所堆置雜物且有營業使用事實，妨礙逃生，因而致人重傷者，得處多久有期徒刑?","o":["3個月以上6年以下","6個月以上5年以下","1年以上5年以下","1年以上7年以下"],"a":"B","ty":"num","ns":1,"e":{"s":"ok","x":"有營業使用事實的住戶於防火巷弄、樓梯間、共同走廊堆置雜物，違反條例第16條第2項（第49條第1項第4款），依第49條第2項致人重傷者處6個月以上5年以下有期徒刑，故選(B)。","b":[{"k":"law","l":"公寓大廈管理條例","r":"公寓大廈管理條例第16條第2項","m":"住戶不可在樓梯間、共同走廊、私設通路、防火巷弄、退縮空地、開放空間等處堆放雜物、設柵欄門扇、營業使用、違規設廣告物或私設路障；開放空間等另有經核准範圍內的例外。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070118"},{"k":"law","l":"公寓大廈管理條例","r":"公寓大廈管理條例第49條第2項","m":"有營業使用事實的住戶犯第1項第3款或第4款行為，致人死亡處1年以上7年以下有期徒刑，得併科100萬至500萬元罰金；致重傷處6個月以上5年以下，得併科50萬至250萬元罰金。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070118"}]}},{"id":"04-01-021","c":"04","t":"04-01","n":"21","q":"某甲的公寓大廈住宅中有12歲以下兒童及65歲以上老人，他自行在外牆開口或陽台加設防墜設施，下列敘述何者正確?","o":["管委會應予勸導及制止","管理負責人應予勸導及制止","住戶的設置理由合乎規定","依據社區規約規範"],"a":"C","ty":"case","e":{"s":"ok","x":"條例第8條第2項：家中有12歲以下兒童或65歲以上老人的住戶，可在外牆開口部或陽臺裝設不妨礙逃生、也不突出外牆面的防墜設施，甲的設置理由合乎規定，故選(C)。","b":[{"k":"law","l":"公寓大廈管理條例","r":"公寓大廈管理條例第8條第2項","m":"住戶家中有12歲以下兒童或65歲以上老人時，外牆開口部或陽臺可裝設不妨礙逃生、不突出外牆面的防墜設施；設置理由消失且不符前項限制時，應改善或回復原狀。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070118"}]}},{"id":"04-01-022","c":"04","t":"04-01","n":"22","q":"公寓大廈管理出現爭議事件時，直轄市、縣(市)政府得組設公寓大廈爭議事件調處委員會，得聘請相關組成人員為何?","o":["中央民意代表及社區發展協會主席","建築師及熱心人士","公寓大廈管理公司主管。","資深專家、學者、建築師、律師、公寓大廈及建築管理主管人員"],"a":"D","ty":"gen","e":{"s":"ok","x":"條例第59條之1：直轄市、縣（市）政府可延聘資深專家、學者、建築師與律師，並指派公寓大廈及建築管理業務主管人員，組成爭議事件調處委員會，故選(D)。","b":[{"k":"law","l":"公寓大廈管理條例","r":"公寓大廈管理條例第59條之1","m":"直轄市、縣（市）政府處理公寓大廈爭議時，可延聘資深專家學者、建築師與律師，另指派公寓大廈及建築管理業務的主管人員，組成爭議事件調處委員會。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070118"}]}},{"id":"04-01-023","c":"04","t":"04-01","n":"23","q":"透天型住宅社區中有多數各自獨立使用之建築物，也有共同使用之設施(例如車道、中庭花園或保全室)，在使用管理及組織管委會的規範，下列何者正確?","o":["準用公寓大廈管理條例之規定","準用公寓大廈社區規約之規定","未在公寓大廈管理條例中規範","準用區分所有權人會議之規範"],"a":"A","ty":"gen","e":{"s":"ok","x":"條例第53條：多數各自獨立使用之建築物，其共同設施使用管理具整體不可分性而成為集居地區者，管理及組織準用本條例，故選(A)。","b":[{"k":"law","l":"公寓大廈管理條例","r":"公寓大廈管理條例第53條","m":"多數各自獨立使用的建築物或公寓大廈，共同設施的使用管理具整體不可分性而成為集居地區者，其管理及組織準用本條例。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070118"}]}},{"id":"04-01-024","c":"04","t":"04-01","n":"24","q":"依據公寓大廈管理條例施行細則，區分所有權人人數之計算，若數人共有一專有部分者，以多少人計?","o":["每一專有部分以1人計","以1人計","以實際共有人數計","按登記人數計"],"a":"B","ty":"gen","e":{"s":"ok","x":"施行細則第3條：已登記者依登記人數計算區分所有權人人數，但數人共有一專有部分者以1人計，故選(B)。","b":[{"k":"law","l":"公寓大廈管理條例施行細則","r":"公寓大廈管理條例施行細則第3條","m":"計算區分所有權人人數時，已登記者依登記人數，但數人共有一專有部分只算1人；未登記者每一專有部分算1人。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070119"}]}},{"id":"04-01-025","c":"04","t":"04-01","n":"25","q":"公寓大廈不得約定專用之共用部分，包括公寓大廈本身所占之地面，其意涵指建築物外牆中心線或其代替中心線以內之?","o":["最大水平範圍","水平投影範圍","最大水平投影範圍","最大水平投影容許範圍"],"a":"C","ty":"neg","e":{"s":"ok","x":"施行細則第4條：公寓大廈本身所占之地面，以外牆中心線（或替代柱中心線）為界，指其內側的最大水平投影範圍，故選(C)。","b":[{"k":"law","l":"公寓大廈管理條例施行細則","r":"公寓大廈管理條例施行細則第4條","m":"條例所稱公寓大廈本身所占地面，以外牆中心線（或替代柱的中心線）為界，指其內側的最大水平投影範圍。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070119"}]}},{"id":"04-01-026","c":"04","t":"04-01","n":"26","q":"承租人向房東承租公寓大廈社區1、2樓店面及住宅，基於擴增室內空間感而拆除分間牆，管理負責人得促請其在幾個月內改善?","o":["3個月","3.5個月","4個月","5個月"],"a":"A","ty":"num","e":{"s":"ok","x":"條例第22條第1項：住戶有違反法令或規約情節重大等情形，由管理負責人或管理委員會促請改善，3個月內仍未改善者，得依區權會決議訴請法院強制遷離，故選(A)。","b":[{"k":"law","l":"公寓大廈管理條例","r":"公寓大廈管理條例第22條第1項","m":"住戶有再度積欠費用達一定比例、受第49條處罰後仍不改善或續犯、其他違反法令或規約情節重大等情形，經促請改善而3個月內仍未改善者，可依區權會決議訴請法院強制遷離。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070118"}],"nt":"題目未指明拆除分間牆所涉條款，本題解依第22條第1項促請改善之3個月期間說明。"}},{"id":"04-01-027","c":"04","t":"04-01","n":"27","q":"依據公寓大廈管理條例，當社區之區分所有權人出現推諉或消極以對，以致無法成立管理委員會及推選管理負責人並辦理報備，則主管機關的規範，下列何者正確?","o":["按每一約定專有部分處區分所有權人新臺幣4-20萬元罰鍰","按每一專有部分處區分所有權人新臺幣4-20萬元罰鍰","按每一住戶處分新臺幣4-20萬元罰鍰","按每一期住戶處分使用權人新臺幣4-20萬元罰鍰"],"a":"B","ty":"num","e":{"s":"ok","x":"條例第49條之1：應成立管理組織而經通知仍未限期成立管委會或推選管理負責人並報備者，由主管機關按每一專有部分處區分所有權人新臺幣4萬元以上20萬元以下罰鍰，故選(B)。","b":[{"k":"law","l":"公寓大廈管理條例","r":"公寓大廈管理條例第49條之1","m":"依第29條之1應成立管理組織的公寓大廈，經通知仍未在期限內成立管委會或推選管理負責人並報備者，按每一專有部分處區分所有權人4萬至20萬元罰鍰，屆期未辦可按次處罰。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070118"}],"nt":"第49條之1係針對依第29條之1經主管機關認定有危險之虞而應成立管理組織之公寓大廈。"}},{"id":"04-02-001","c":"04","t":"04-02","n":"01","q":"政府為改善居民生活環境，並促進市、鎮、鄉街有計畫之均衡發展，特制定何種法律?","o":["公寓大廈管理條例","租賃住宅市場發展及管理條例","都市計畫法","非都市土地使用管制規則"],"a":"C","ty":"gen","e":{"s":"ok","x":"都市計畫法第1條：為改善居民生活環境，並促進市、鎮、鄉街有計畫之均衡發展，特制定本法，故選(C)。","b":[{"k":"law","l":"都市計畫法","r":"第1條","q":"為改善居民生活環境，並促進市、鎮、鄉街有計畫之均衡發展，特制定本法。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070001"}],"nt":"簡報未收錄都市計畫法條文，依全國法規資料庫現行條文作答。"}},{"id":"04-02-002","c":"04","t":"04-02","n":"02","q":"關於都市計畫法之立法宗旨，下列何者正確?","o":["改善都市居民之不動產交易秩序","促進都市產業結構升級","促進市鎮鄉街有計畫之均衡發展","促進市鎮鄉街之繁榮發展"],"a":"C","ty":"gen","e":{"s":"ok","x":"都市計畫法第1條：本法之立法目的為改善居民生活環境，並促進市、鎮、鄉街有計畫之均衡發展，故選(C)。","b":[{"k":"law","l":"都市計畫法","r":"第1條","q":"為改善居民生活環境，並促進市、鎮、鄉街有計畫之均衡發展，特制定本法。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070001"}],"nt":"簡報未收錄都市計畫法條文，依全國法規資料庫現行條文作答。"}},{"id":"04-02-003","c":"04","t":"04-02","n":"03","q":"市鎮計畫應先擬定主要計畫書及主要計畫圖，作為擬定何種計畫之準則?","o":["市(鎮)計畫","鄉街計畫","特定區計畫","細部計畫"],"a":"D","ty":"gen","e":{"s":"ok","x":"都市計畫法第7條第1款：主要計畫係指依第15條所定之主要計畫書及主要計畫圖，作為擬定細部計畫之準則，故選(D)。","b":[{"k":"law","l":"都市計畫法","r":"第7條第1款","q":"主要計畫：係指依第十五條所定之主要計畫書及主要計畫圖，作為擬定細部計畫之準則。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070001"}],"nt":"簡報未收錄都市計畫法條文，依全國法規資料庫現行條文作答。"}},{"id":"04-02-004","c":"04","t":"04-02","n":"04","q":"依據都市計畫法規定所舉辦之公共設施、新市區建設、舊市區更新等實質建設之事業，稱之何種事業?","o":["都市創新事業","都市計畫事業","都市發展事業","新市區建設事業。"],"a":"B","ty":"gen","e":{"s":"ok","x":"都市計畫法第7條第3款：都市計畫事業係指依本法規定所舉辦之公共設施、新市區建設、舊市區更新等實質建設之事業，故選(B)。","b":[{"k":"law","l":"都市計畫法","r":"第7條第3款","q":"都市計畫事業：係指依本法規定所舉辦之公共設施、新市區建設、舊市區更新等實質建設之事業。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070001"}],"nt":"簡報未收錄都市計畫法條文，依全國法規資料庫現行條文作答。"}},{"id":"04-02-005","c":"04","t":"04-02","n":"05","q":"依據都市計畫法規定，都市計畫分為下列哪三種?","o":["市鎮計畫、鄉街計畫、特定事業計畫","市鎮計畫、鄉街計畫、特定區計畫","市鎮計畫、鄉街計畫、更新區計畫","市鎮計畫、鄉街計畫、新市區計畫"],"a":"B","ty":"gen","e":{"s":"ok","x":"都市計畫法第9條：都市計畫分為市（鎮）計畫、鄉街計畫、特定區計畫三種，故選(B)。","b":[{"k":"law","l":"都市計畫法","r":"第9條","q":"都市計畫分為左列三種：一、市（鎮）計畫。二、鄉街計畫。三、特定區計畫。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070001"}],"nt":"簡報未收錄都市計畫法條文，依全國法規資料庫現行條文作答。"}},{"id":"04-02-006","c":"04","t":"04-02","n":"06","q":"依據都市計畫法規定，應擬定市(鎮)計畫，包括下列何者?","o":["鄉街及社區","優先更新地區","縣政府所在地","鄉公所所在地"],"a":"C","ty":"gen","e":{"s":"ok","x":"都市計畫法第10條：應擬定市（鎮）計畫之地方包括首都、直轄市，省會、市，縣政府所在地及縣轄市，鎮等；鄉街、鄉公所所在地非屬之，故選(C)。","b":[{"k":"law","l":"都市計畫法","r":"第10條","q":"下列各地方應擬定市（鎮）計畫：一、首都、直轄市。二、省會、市。三、縣政府所在地及縣轄市。四、鎮。五、其他經內政部或縣（市）政府指定應依本法擬定市（鎮）計畫之地區。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070001"}],"nt":"簡報未收錄都市計畫法條文，依全國法規資料庫現行條文作答。"}},{"id":"04-02-007","c":"04","t":"04-02","n":"07","q":"依據都市計畫法規定，市鎮計畫應先擬定主要計畫，就下列事項分別表明，下列何者正確?","o":["當地工商發展環境分析","行政區域及周邊計畫地區範圍","人口之成長、分布及組成之推計","未來將變更土地使用地區及區位配置"],"a":"C","ty":"gen","e":{"s":"ok","x":"都市計畫法第15條第1項：市鎮計畫應先擬定主要計畫書，就所列事項分別表明，其第3款為「人口之成長、分布、組成、計畫年期內人口與經濟發展之推計」；第2款為「行政區域及計畫地區範圍」（非「周邊」計畫地區範圍），故選(C)。","b":[{"k":"law","l":"都市計畫法","r":"第15條第1項第3款","q":"人口之成長、分布、組成、計畫年期內人口與經濟發展之推計。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070001"},{"k":"law","l":"都市計畫法","r":"第15條第1項第2款","q":"行政區域及計畫地區範圍。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070001"},{"k":"law","l":"都市計畫法","r":"第15條第1項","q":"市鎮計畫應先擬定主要計畫書，並視其實際情形，就左列事項分別表明之：","m":"共十款，第1款為當地自然、社會及經濟狀況之調查與分析，第4款為住宅、商業、工業及其他土地使用之配置等。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070001"}],"nt":"簡報未收錄都市計畫法條文，依全國法規資料庫現行條文作答。"}},{"id":"04-02-008","c":"04","t":"04-02","n":"08","q":"依據都市計畫法規定，細部計畫應以細部計畫書圖就下列事項表明，包括下列何者?","o":["計畫地區產業結構","居住密度及潛在移居人口","重大專案開發","土地使用分區管制"],"a":"D","ty":"gen","e":{"s":"ok","x":"都市計畫法第22條第1項：細部計畫應以細部計畫書及細部計畫圖表明計畫地區範圍、居住密度及容納人口、土地使用分區管制、事業及財務計畫、道路系統、地區性公共設施用地等，故選(D)。","b":[{"k":"law","l":"都市計畫法","r":"第22條第1項","q":"細部計畫應以細部計畫書及細部計畫圖就左列事項表明之：一、計畫地區範圍。二、居住密度及容納人口。三、土地使用分區管制。四、事業及財務計畫。五、道路系統。六、地區性之公共設施用地。七、其他。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070001"}],"nt":"簡報未收錄都市計畫法條文，依全國法規資料庫現行條文作答。"}},{"id":"04-02-009","c":"04","t":"04-02","n":"09","q":"依據都市計畫法規定，都市計畫經發布實施後，不得隨時任意變更。但擬定計畫之機關每多少年內至少應通盤檢討一次?","o":["2年內","2~3年內","3年內或5年內","依據人民建議"],"a":"C","ty":"neg","e":{"s":"ok","x":"都市計畫法第26條第1項：都市計畫經發布實施後，不得隨時任意變更，但擬定計畫之機關每三年內或五年內至少應通盤檢討一次，故選(C)。","b":[{"k":"law","l":"都市計畫法","r":"第26條第1項","q":"都市計畫經發布實施後，不得隨時任意變更。但擬定計畫之機關每三年內或五年內至少應通盤檢討一次，依據發展情況，並參考人民建議作必要之變更。對於非必要之公共設施用地，應變更其使用。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070001"}],"nt":"簡報未收錄都市計畫法條文，依全國法規資料庫現行條文作答。"}},{"id":"04-02-010","c":"04","t":"04-02","n":"10","q":"都市計畫經發布實施後，遇有特殊情事，地方政府應視實際情況迅行變更，但不包括下列何者?","o":["因地震遭受損壞時","因水災風災遭受損壞時","因火災遭受損壞時","因跨國公司直接投資設廠時"],"a":"D","ty":"neg","e":{"s":"ok","x":"都市計畫法第27條第1項第1款：因戰爭、地震、水災、風災、火災或其他重大事變遭受損壞時，地方政府應視實際情況迅行變更；同項各款未列「跨國公司直接投資設廠」，故選(D)。","b":[{"k":"law","l":"都市計畫法","r":"第27條第1項","q":"都市計畫經發布實施後，遇有下列情事之一時，當地直轄市、縣（市）政府或鄉、鎮、縣轄市公所，應視實際情況迅行變更：","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070001"},{"k":"law","l":"都市計畫法","r":"第27條第1項第1款","q":"一、因戰爭、地震、水災、風災、火災或其他重大事變遭受損壞時。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070001"},{"k":"law","l":"都市計畫法","r":"第27條第1項第2款至第4款","m":"第2款為避免重大災害之發生時；第3款為適應國防或經濟發展之需要時；第4款為配合中央、直轄市或縣（市）興建之重大設施時。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070001"}],"nt":"簡報未收錄都市計畫法條文，依全國法規資料庫現行條文作答。第27條第1項第3款為「為適應國防或經濟發展之需要時」，題庫以個別企業投資設廠非該條所列迅行變更事由作答。"}},{"id":"04-02-011","c":"04","t":"04-02","n":"11","q":"依據都市計畫法規定，為保護居住環境，土地及建築物之使用，不得有礙居住之寧靜、安全及衛生，應劃定何種使用區?","o":["保護區","農業區","住宅區","文教區"],"a":"C","ty":"neg","e":{"s":"ok","x":"都市計畫法第34條：住宅區為保護居住環境而劃定，其土地及建築物之使用，不得有礙居住之寧靜、安全及衛生，故選(C)。","b":[{"k":"law","l":"都市計畫法","r":"第34條","q":"住宅區為保護居住環境而劃定，其土地及建築物之使用，不得有礙居住之寧靜、安全及衛生。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070001"}],"nt":"簡報未收錄都市計畫法條文，依全國法規資料庫現行條文作答。"}},{"id":"04-02-012","c":"04","t":"04-02","n":"12","q":"依據都市計畫法規定，都市計畫應依據現在及既往情況，並預計幾年內之發展情形訂定之?","o":["15年","20年","25年","30年"],"a":"C","ty":"num","e":{"s":"ok","x":"都市計畫法第5條：都市計畫應依據現在及既往情況，並預計二十五年內之發展情形訂定之，故選(C)。","b":[{"k":"law","l":"都市計畫法","r":"第5條","q":"都市計畫應依據現在及既往情況，並預計二十五年內之發展情形訂定之。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070001"}],"nt":"簡報未收錄都市計畫法條文，依全國法規資料庫現行條文作答。"}},{"id":"04-02-013","c":"04","t":"04-02","n":"13","q":"依據都市計畫法規定，優先發展區係指係指預計在多少年內必須優先規劃建設發展之都市計畫地區?","o":["3年","5年","10年","15年"],"a":"C","ty":"num","e":{"s":"ok","x":"都市計畫法第7條第4款：優先發展區係指預計在十年內必須優先規劃建設發展之都市計畫地區，故選(C)。","b":[{"k":"law","l":"都市計畫法","r":"第7條第4款","q":"優先發展區：係指預計在十年內必須優先規劃建設發展之都市計畫地區。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070001"}],"nt":"簡報未收錄都市計畫法條文，依全國法規資料庫現行條文作答。"}},{"id":"04-02-014","c":"04","t":"04-02","n":"14","q":"都市計畫地區範圍內，應視實際情況設置公共設施用地，下列何者不屬於公共設施用地項目?","o":["學校","社會住宅","社教機構","社會福利設施"],"a":"B","ty":"neg","e":{"s":"ok","x":"都市計畫法第42條第1項第2款：公共設施用地包括學校、社教機構、社會福利設施等用地；同項各款均未列「社會住宅」，故選(B)。","b":[{"k":"law","l":"都市計畫法","r":"第42條第1項第2款","q":"二、學校、社教機構、社會福利設施、體育場所、市場、醫療衛生機構及機關用地。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070001"},{"k":"law","l":"都市計畫法","r":"第42條第1項","m":"公共設施用地分四款：第1款道路、公園、綠地、廣場、兒童遊樂場、民用航空站、停車場所、河道及港埠用地；第2款學校、社教機構、社會福利設施、體育場所、市場、醫療衛生機構及機關用地；第3款上下水道、郵政、電信、變電所及其他公用事業用地；第4款本章規定之其他公共設施用地。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070001"}],"nt":"簡報未收錄都市計畫法條文，依全國法規資料庫現行條文作答。"}},{"id":"04-02-015","c":"04","t":"04-02","n":"15","q":"都市計畫地區範圍內，應視實際情況設置公共設施用地，下列何者不屬於公共設施用地項目?","o":["購物中心","公園","綠地","兒童遊樂場"],"a":"A","ty":"neg","e":{"s":"ok","x":"都市計畫法第42條第1項第1款：公共設施用地包括公園、綠地、兒童遊樂場等用地；同項各款均未列「購物中心」，故選(A)。","b":[{"k":"law","l":"都市計畫法","r":"第42條第1項第1款","q":"一、道路、公園、綠地、廣場、兒童遊樂場、民用航空站、停車場所、河道及港埠用地。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070001"},{"k":"law","l":"都市計畫法","r":"第42條第1項","m":"公共設施用地分四款：第1款道路、公園、綠地、廣場、兒童遊樂場等；第2款學校、社教機構、社會福利設施、體育場所、市場、醫療衛生機構及機關用地；第3款上下水道、郵政、電信、變電所及其他公用事業用地；第4款本章規定之其他公共設施用地。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070001"}],"nt":"簡報未收錄都市計畫法條文，依全國法規資料庫現行條文作答。"}},{"id":"04-02-016","c":"04","t":"04-02","n":"16","q":"依據都市計畫法規定，有關都市更新之處理方式，下列何者正確?","o":["重建、整建、修護","重建、整建、維護","重建、增建、維護","重建、修建、維護"],"a":"B","ty":"gen","e":{"s":"ok","x":"都市計畫法第64條第1項：都市更新處理方式分為重建、整建、維護三種，故選(B)。","b":[{"k":"law","l":"都市計畫法","r":"第64條第1項","m":"都市更新處理方式分為三種：一、重建；二、整建；三、維護（各款並有定義）。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070001"}],"nt":"簡報未收錄都市計畫法條文，依全國法規資料庫現行條文作答。"}},{"id":"04-02-017","c":"04","t":"04-02","n":"17","q":"依據都市計畫法規定，鄉鎮縣轄市公所取得公共設施保留地之方式，下列何者正確?","o":["協議價購","公私部門聯合開發","市地重劃","都市更新"],"a":"C","ty":"gen","e":{"s":"ok","x":"都市計畫法第48條：公共設施保留地除供公用事業設施之用者外，由該管政府或鄉、鎮、縣轄市公所依徵收、區段徵收、市地重劃方式取得之，故選(C)。","b":[{"k":"law","l":"都市計畫法","r":"第48條","q":"依本法指定之公共設施保留地供公用事業設施之用者，由各該事業機構依法予以徵收或購買；其餘由該管政府或鄉、鎮、縣轄市公所依左列方式取得之：","m":"取得方式為：一、徵收；二、區段徵收；三、市地重劃。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070001"}],"nt":"簡報未收錄都市計畫法條文，依全國法規資料庫現行條文作答。"}},{"id":"04-02-018","c":"04","t":"04-02","n":"18","q":"依據都市計畫法規定，鄉鎮縣轄市公所為審議及研究都市計畫，應分別設置何種委員會辦理?","o":["都市發展委員會","都市計畫委員會","區域發展委員會","區域計畫委員會"],"a":"B","ty":"gen","e":{"s":"ok","x":"都市計畫法第74條第1項：內政部、各級地方政府及鄉、鎮、縣轄市公所為審議及研究都市計畫，應分別設置都市計畫委員會辦理之，故選(B)。","b":[{"k":"law","l":"都市計畫法","r":"第74條第1項","q":"內政部、各級地方政府及鄉、鎮、縣轄市公所為審議及研究都市計畫，應分別設置都市計畫委員會辦理之。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070001"}],"nt":"簡報未收錄都市計畫法條文，依全國法規資料庫現行條文作答。"}},{"id":"04-02-019","c":"04","t":"04-02","n":"19","q":"在都市計畫範圍之農業區，違法採取土石及變更地形，地方政府可對何者處以罰鍰?","o":["周邊土地所有權人","設備租用人","企業管理人","土地、建物所有權人、使用人及管理人"],"a":"D","ty":"gen","e":{"s":"ok","x":"都市計畫法第79條第1項：都市計畫範圍內採取土石、變更地形等違反本法或依本法發布之命令者，當地地方政府或鄉、鎮、縣轄市公所得處其土地或建築物所有權人、使用人或管理人罰鍰，故選(D)。","b":[{"k":"law","l":"都市計畫法","r":"第79條第1項","q":"都市計畫範圍內土地或建築物之使用，或從事建造、採取土石、變更地形，違反本法或內政部、直轄市、縣（市）政府依本法所發布之命令者，當地地方政府或鄉、鎮、縣轄市公所得處其土地或建築物所有權人、使用人或管理人新臺幣六萬元以上三十萬元以下罰鍰，並勒令拆除、改建、停止使用或恢復原狀。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070001"}],"nt":"簡報未收錄都市計畫法條文，依全國法規資料庫現行條文作答。"}},{"id":"04-02-020","c":"04","t":"04-02","n":"20","q":"在都市計畫範圍之農業區，違法任意傾倒營建廢棄物，地方政府可對土地所有權人，處以多少罰鍰?","o":["2萬以上10萬以下","3萬以上10萬以下","6萬以上30萬以下","6萬以上50萬以下"],"a":"C","ty":"num","ns":1,"e":{"s":"ok","x":"都市計畫法第79條第1項：都市計畫範圍內土地之使用違反本法或依本法發布之命令者，得處其土地或建築物所有權人、使用人或管理人新臺幣六萬元以上三十萬元以下罰鍰，故選(C)。","b":[{"k":"law","l":"都市計畫法","r":"第79條第1項","q":"都市計畫範圍內土地或建築物之使用，或從事建造、採取土石、變更地形，違反本法或內政部、直轄市、縣（市）政府依本法所發布之命令者，當地地方政府或鄉、鎮、縣轄市公所得處其土地或建築物所有權人、使用人或管理人新臺幣六萬元以上三十萬元以下罰鍰，並勒令拆除、改建、停止使用或恢復原狀。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070001"}],"nt":"簡報未收錄都市計畫法條文，依全國法規資料庫現行條文作答。"}},{"id":"04-02-021","c":"04","t":"04-02","n":"21","q":"依據非都市土地使用管制規則，非都市土地得依使用性質劃定之土地使用分區，下列何者正確?","o":["城鄉發展區","工商綜合區","風景區、國家公園區","國土保安區、特定事業區"],"a":"C","ty":"gen","e":{"s":"ok","x":"非都市土地使用管制規則第2條：非都市土地得劃定為特定農業、一般農業、工業、鄉村、森林、山坡地保育、風景、國家公園、河川、海域、特定專用等使用分區，故選(C)。","b":[{"k":"law","l":"非都市土地使用管制規則","r":"第2條","q":"非都市土地得劃定為特定農業、一般農業、工業、鄉村、森林、山坡地保育、風景、國家公園、河川、海域、特定專用等使用分區。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?PCODE=D0060013"}],"nt":"簡報未收錄非都市土地使用管制規則條文，依全國法規資料庫現行條文作答。"}},{"id":"04-02-022","c":"04","t":"04-02","n":"22","q":"依據非都市土地使用管制規則，非都市土地得依其使用分區之性質編定用地類別，下列何者正確?","o":["觀光工廠用地","光電廠用地","遊憩、古蹟保存用地","國家公園用地"],"a":"C","ty":"gen","e":{"s":"ok","x":"非都市土地使用管制規則第3條：非都市土地依其使用分區之性質，編定為甲種建築…遊憩、古蹟保存、生態保護、國土保安等使用地，故選(C)。","b":[{"k":"law","l":"非都市土地使用管制規則","r":"第3條","q":"非都市土地依其使用分區之性質，編定為甲種建築、乙種建築、丙種建築、丁種建築、農牧、林業、養殖、鹽業、礦業、窯業、交通、水利、遊憩、古蹟保存、生態保護、國土保安、殯葬、海域、特定目的事業等使用地。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?PCODE=D0060013"}],"nt":"簡報未收錄非都市土地使用管制規則條文，依全國法規資料庫現行條文作答。"}},{"id":"04-02-023","c":"04","t":"04-02","n":"23","q":"依據非都市土地使用管制規則，丙種建築用地之建蔽率及容積率，分別為何?","o":["40％；120％","40％；240％","60％；120％","60％；240％"],"a":"A","ty":"num","e":{"s":"ok","x":"非都市土地使用管制規則第9條第1項第3款：丙種建築用地建蔽率百分之四十、容積率百分之一百二十，故選(A)。","b":[{"k":"law","l":"非都市土地使用管制規則","r":"第9條第1項第3款","q":"三、丙種建築用地︰建蔽率百分之四十。容積率百分之一百二十。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?PCODE=D0060013"}],"nt":"簡報未收錄非都市土地使用管制規則條文，依全國法規資料庫現行條文作答。"}},{"id":"04-02-024","c":"04","t":"04-02","n":"24","q":"辦理非都市土地變更編定時，申請人應擬具興辦事業計畫，計畫範圍內有夾雜第一級環境敏感地區之零星土地，下列何種情況不得納入申請範圍?","o":["基於整體開發規劃之需要","夾雜地同意變更編定為國土保安用地","面積已超過基地開發面積之10%。","夾雜地維持原使用分區及原使用地類別"],"a":"C","ty":"neg","e":{"s":"ok","x":"非都市土地使用管制規則第30條之2：興辦事業計畫範圍內夾雜第一級環境敏感地區之零星土地，須基於整體開發規劃之需要、夾雜地維持原使用分區及使用地類別或同意變更編定為國土保安用地、面積未超過基地開發面積之百分之十，並擬定管理維護措施，始得納入申請範圍；面積已超過10%者不得納入，故選(C)。","b":[{"k":"law","l":"非都市土地使用管制規則","r":"第30條之2","q":"第三十條擬具之興辦事業計畫範圍內有夾雜第一級環境敏感地區之零星土地者，應符合下列各款情形，始得納入申請範圍：","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?PCODE=D0060013"},{"k":"law","l":"非都市土地使用管制規則","r":"第30條之2第1款至第3款","q":"一、基於整體開發規劃之需要。二、夾雜地仍維持原使用分區及原使用地類別，或同意變更編定為國土保安用地。三、面積未超過基地開發面積之百分之十。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?PCODE=D0060013"}],"nt":"簡報未收錄非都市土地使用管制規則條文，依全國法規資料庫現行條文作答。"}},{"id":"04-02-025","c":"04","t":"04-02","n":"25","q":"辦理非都市土地變更編定時，申請人應擬具興辦事業計畫，計畫範圍內有夾雜第1級環境敏感地區之零星土地，其面積未超基地開發面積之多少始得納入申請範圍?","o":["20%","15%","10%","12%"],"a":"C","ty":"num","e":{"s":"ok","x":"非都市土地使用管制規則第30條之2第3款：夾雜第一級環境敏感地區之零星土地，其面積須未超過基地開發面積之百分之十，始得納入申請範圍，故選(C)。","b":[{"k":"law","l":"非都市土地使用管制規則","r":"第30條之2","q":"第三十條擬具之興辦事業計畫範圍內有夾雜第一級環境敏感地區之零星土地者，應符合下列各款情形，始得納入申請範圍：","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?PCODE=D0060013"},{"k":"law","l":"非都市土地使用管制規則","r":"第30條之2第3款","q":"三、面積未超過基地開發面積之百分之十。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?PCODE=D0060013"}],"nt":"簡報未收錄非都市土地使用管制規則條文，依全國法規資料庫現行條文作答。"}},{"id":"04-03-001","c":"04","t":"04-03","n":"01","q":"公寓大廈社區，若要將共用部分及約定共用部分劃設機車停車位，供住戶之機車停放，其相關管理規範應依何種規範?","o":["依區分所有權人會議決議","依起造人之買賣契約","依起造人之買賣契約及分管契約","依管委會決議"],"a":"A","ty":"gen","e":{"s":"ok","x":"依內政部公寓大廈規約範本第2條，共用及約定共用部分可劃設機車停車位，其停車空間使用管理辦法預設由區分所有權人會議決議訂定，故選(A)。","b":[{"k":"law","l":"公寓大廈規約範本（內政部；含附件六「公寓大廈文件之保管及閱覽管理規定」、附件七「室內裝修工程具結書」）","r":"公寓大廈規約範本第2條","m":"共用部分及約定共用部分可劃設機車停車位供住戶停放；停車空間使用管理辦法預設由區分所有權人會議決議訂定，也可勾選授權管理委員會訂定。","u":"https://www.nlma.gov.tw/uploads/files/64c9e005c5c80aef8f123b5944268e14.pdf"}]}},{"id":"04-03-002","c":"04","t":"04-03","n":"02","q":"依據內政部之公寓大廈社區規約範本，下列何者事項應經由區分所有權人會議決議為之?","o":["公寓大廈之門禁安全維護","公寓大廈之重大修繕或改良","公寓大廈之機電設備維護","公寓大廈之安寧整潔"],"a":"B","ty":"gen","e":{"s":"ok","x":"規約範本第7條將公寓大廈之重大修繕或改良列為應經區分所有權人會議決議事項（條例第11條第1項亦同），故選(B)。","b":[{"k":"law","l":"公寓大廈規約範本（內政部；含附件六「公寓大廈文件之保管及閱覽管理規定」、附件七「室內裝修工程具結書」）","r":"公寓大廈規約範本第7條","m":"規約訂定或變更、公寓大廈重大修繕或改良、依法重建、強制遷離或出讓、約定專用或約定共用事項等，列為應經區分所有權人會議決議的事項。","u":"https://www.nlma.gov.tw/uploads/files/64c9e005c5c80aef8f123b5944268e14.pdf"},{"k":"law","l":"公寓大廈管理條例","r":"公寓大廈管理條例第11條第1項","m":"共用部分及相關設施如要拆除，或進行重大修繕、改良，須經區分所有權人會議決議。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070118"}]}},{"id":"04-03-003","c":"04","t":"04-03","n":"03","q":"依據內政部之公寓大廈社區規約範本，若約定專用或約定共用事項的使用變更，應有何種規範?","o":["依管理負責人之意見","依該區分所有權人之意見","依區分所有權人會議決議","依管委會決議"],"a":"C","ty":"gen","e":{"s":"ok","x":"規約範本第7條將約定專用或約定共用事項列為應經區分所有權人會議決議之事項，故選(C)。","b":[{"k":"law","l":"公寓大廈規約範本（內政部；含附件六「公寓大廈文件之保管及閱覽管理規定」、附件七「室內裝修工程具結書」）","r":"公寓大廈規約範本第7條","m":"規約訂定或變更、公寓大廈重大修繕或改良、依法重建、強制遷離或出讓、約定專用或約定共用事項等，列為應經區分所有權人會議決議的事項。","u":"https://www.nlma.gov.tw/uploads/files/64c9e005c5c80aef8f123b5944268e14.pdf"}]}},{"id":"04-03-004","c":"04","t":"04-03","n":"04","q":"依據內政部之公寓大廈社區規約範本，社區管委會組成人數，最多為幾人?","o":["15人","19人","21人","22人"],"a":"C","ty":"num","e":{"s":"unclear","x":"","b":[],"f":"現行規約範本（國土管理署網站版）第11條之委員名額及總人數均留白由社區自行填寫，全文未見管委會最多21人之規定；條例亦未規定人數上限，無法支持題庫答案。","nt":"【2026-10-24簡報複查】查倫理規範頁133–139（規約範本）並搜尋「21人／二十一／委員名額」：簡報沒有委員人數上限；頁136只引條例第29條第2項，說明委員人數依區權會決議或規約定之。國土管理署規約範本PDF及臺北市法規會98年函釋也沒有21人的規定，維持 unclear。"}},{"id":"04-03-005","c":"04","t":"04-03","n":"05","q":"依據內政部之公寓大廈社區規約範本，有關規約、區分所有權人會議記錄、管理委員會會議紀錄、簽名簿、代理出席之委託書等文件，應由何人負責保管?","o":["管理負責人","管理維護公司","管理委員會","管委會主委"],"a":"C","ty":"gen","e":{"s":"ok","x":"規約範本第15條規定規約、區權會及管委會會議紀錄、簽名簿、代理出席委託書等文件由管理委員會負責保管（條例第36條第8款同），故選(C)。","b":[{"k":"law","l":"公寓大廈規約範本（內政部；含附件六「公寓大廈文件之保管及閱覽管理規定」、附件七「室內裝修工程具結書」）","r":"公寓大廈規約範本第15條","m":"規約、區權會與管委會會議紀錄、簽到簿、出席委託書、使用執照謄本、竣工圖說、水電消防機械及管線圖說、申報文件、印鑑等，由管理委員會負責保管。","u":"https://www.nlma.gov.tw/uploads/files/64c9e005c5c80aef8f123b5944268e14.pdf"},{"k":"law","l":"公寓大廈管理條例","r":"公寓大廈管理條例第36條第8款","m":"保管規約、會議紀錄、使用執照謄本、竣工圖說、水電消防機械及管線圖說、會計與財務文件、公安消防申報文件、印鑑等，屬管理委員會的職務。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070118"}]}},{"id":"04-03-006","c":"04","t":"04-03","n":"06","q":"依據內政部之公寓大廈社區規約範本，有關該社區使用執照謄本、竣工圖說、水電消防機械設施之管線圖說等文件，應由何人負責保管?","o":["管理負責人","管理維護公司","管理委員會","管委會主委"],"a":"C","ty":"gen","e":{"s":"ok","x":"規約範本第15條規定使用執照謄本、竣工圖說、水電消防機械設施及管線圖說等由管理委員會負責保管（條例第36條第8款同），故選(C)。","b":[{"k":"law","l":"公寓大廈規約範本（內政部；含附件六「公寓大廈文件之保管及閱覽管理規定」、附件七「室內裝修工程具結書」）","r":"公寓大廈規約範本第15條","m":"規約、區權會與管委會會議紀錄、簽到簿、出席委託書、使用執照謄本、竣工圖說、水電消防機械及管線圖說、申報文件、印鑑等，由管理委員會負責保管。","u":"https://www.nlma.gov.tw/uploads/files/64c9e005c5c80aef8f123b5944268e14.pdf"},{"k":"law","l":"公寓大廈管理條例","r":"公寓大廈管理條例第36條第8款","m":"保管規約、會議紀錄、使用執照謄本、竣工圖說、水電消防機械及管線圖說、會計與財務文件、公安消防申報文件、印鑑等，屬管理委員會的職務。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070118"}]}},{"id":"04-03-007","c":"04","t":"04-03","n":"07","q":"依據內政部之公寓大廈社區規約範本，公寓大廈共用部分不得獨立使用且供做專有部分。其中不得為約定專用部分，下列何者有錯？","o":["公寓大廈本身所占之地面","連通數個專有部分之走廊","通往室外之通路或門廳","社區周邊之巷道或防火巷弄"],"a":"D","ty":"neg","e":{"s":"ok","x":"條例第7條第2款不得約定專用者為「社區內」之各巷道、防火巷弄，而非社區周邊之巷道；(A)(B)(C)均為同條所列，故選(D)。","b":[{"k":"law","l":"公寓大廈管理條例","r":"公寓大廈管理條例第7條第2款","m":"連通數個專有部分的走廊或樓梯、通往室外的通路或門廳，以及社區「內」的各巷道與防火巷弄，都不得約定為專用部分。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070118"},{"k":"law","l":"公寓大廈管理條例","r":"公寓大廈管理條例第7條","m":"共用部分不可獨立作為專有部分；建物所占地面、連通走廊樓梯及通往室外的通路門廳、社區內巷道與防火巷弄、主要構造、違反法令使用限制者等，不得約定專用。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070118"}]}},{"id":"04-03-008","c":"04","t":"04-03","n":"08","q":"依據公寓大廈條例規定，公寓大廈之起造人於申請建造執照時檢附之規約草約，於區分所有權人會議訂定規約前，前項規約草約之效力為何?","o":["視為規約","僅供參考","經承受人簽署同意後視為規約","核發執照時視為規約"],"a":"C","ty":"gen","e":{"s":"ok","x":"條例第56條第2項：起造人申請建照時附具的規約草約，只要承受人簽署同意，在區分所有權人會議正式訂定規約之前，即視同規約，故選(C)。","b":[{"k":"law","l":"公寓大廈管理條例","r":"公寓大廈管理條例第56條第2項","m":"起造人申請建造執照時檢附的規約草約，經承受人簽署同意後，在區權會訂定規約前視同規約。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070118"}]}},{"id":"04-04-001","c":"04","t":"04-04","n":"01","q":"下列何者非公寓大廈行政管理實務，行政事務職能？","o":["住戶創意發想","集體意思表達","事實記錄","訊息傳遞與文件整備"],"a":"A","ty":"neg","e":{"s":"ok","x":"簡報（法5-4）頁140：建築物管理維護業務之行政事務功能分為意思表達、事實記錄、訊息傳遞、文件整備四項，「住戶創意發想」不在其中，故選(A)。","b":[{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－租賃住宅相關法規與實務（法5-1～法5-5）","r":"頁碼140（PDF第141頁）","q":"(一)建築物管理維護業務之行政事務功能 1.意思表達：如住戶意見箱/表、滿意度調查、住戶訴願等。 2.事實記錄：如會議紀錄、違規存證、財務報表、各類表單等。 3.訊息傳遞：如公告、通知、管理規定等 4.文件整備：如檔案保存、管理、移交及備查，向政府報備之 文件。"}],"nt":"題目用「職能」、簡報用「功能」；選項(B)「集體意思表達」對應簡報「意思表達」。先前未使用簡報時標為 not_found，本次依簡報頁140更新。"}},{"id":"04-04-002","c":"04","t":"04-04","n":"02","q":"為發揮公寓大廈行政事務的功能，下列何種作業順序較為妥適？","o":["應用技巧、執行方法、處理程序、觀念認知","觀念認知、處理程序、執行方法、應用技巧","處理程序、執行方法、觀念認知、應用技巧","觀念認知、處理程序、應用技巧、執行方法"],"a":"B","ty":"gen","e":{"s":"not_found","x":"","b":[],"f":"屬公寓大廈行政管理實務教材內容，查無法規、規約範本或主管機關文件可引用之明確依據。","nt":"【2026-10-24簡報複查】查倫理規範頁140–164，並搜尋「觀念認知／處理程序／執行方法／應用技巧」：簡報沒有這四個作業順序；網路搜尋也找不到官方出處，維持 not_found。"}},{"id":"04-04-003","c":"04","t":"04-04","n":"03","q":"會議紀錄、違規存證、財務報表等係屬於公寓大廈管理實務，行政事務的哪種功能？","o":["文件整備","意思表達","事實記錄","訊息傳遞"],"a":"C","ty":"gen","e":{"s":"ok","x":"簡報（法5-4）頁140：行政事務功能之「事實記錄」，例如會議紀錄、違規存證、財務報表、各類表單等，故選(C)。","b":[{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－租賃住宅相關法規與實務（法5-1～法5-5）","r":"頁碼140（PDF第141頁）","q":"2.事實記錄：如會議紀錄、違規存證、財務報表、各類表單等。"}],"nt":"先前未使用簡報時標為 not_found，本次依簡報頁140更新。"}},{"id":"04-04-004","c":"04","t":"04-04","n":"04","q":"租賃管理人員研擬公共住宅管理辦法時，依中央法規標準法規定，法規條文應分條書寫，並於條次下，得再依序細分為哪些項目？","o":["項、款、目","款、項、目","目、款、項","目、項、款"],"a":"A","ty":"gen","e":{"s":"ok","x":"中央法規標準法第8條：法規條文應分條書寫，條次之下得依序細分為項、款、目，故選(A)。","b":[{"k":"law","l":"中央法規標準法","r":"中央法規標準法第8條","m":"法規條文應分條書寫並冠以條次；條次之下可依序再細分為項、款、目，項不冠數字，款以一、二、三，目以（一）、（二）等標示。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=A0030133"}]}},{"id":"04-04-005","c":"04","t":"04-04","n":"05","q":"下列何者，非為區分所有權人名冊應包含之欄位？","o":["身分證字號","姓名或名稱","通訊地址","專有部分面積"],"a":"A","ty":"gen","e":{"s":"ok","x":"規約範本附件六的區分所有權人名冊，欄位包括姓名（名稱）、單位地址與通訊地址、電話傳真、專有部分面積及區分所有權比例，並無身分證字號，故選(A)。","b":[{"k":"law","l":"公寓大廈規約範本（內政部；含附件六「公寓大廈文件之保管及閱覽管理規定」、附件七「室內裝修工程具結書」）","r":"公寓大廈規約範本附件六（文件之保管及閱覽管理規定）","m":"02名冊類的區分所有權人名冊，欄位有：姓名（名稱）、所屬區分所有單位地址、聯絡用通訊地址、電話與傳真、專有部分面積及區分所有權比例。","u":"https://www.nlma.gov.tw/uploads/files/64c9e005c5c80aef8f123b5944268e14.pdf"}]}},{"id":"04-04-006","c":"04","t":"04-04","n":"06","q":"公寓大廈行政管理實務，對於「催告」的要件，下列何者正確？","o":["以簡訊為之","以口頭為之","以書面為之","以通訊軟體為之"],"a":"C","ty":"gen","e":{"s":"ok","x":"規約範本第29條規定管理負責人或管理委員會之催告事項應以書面為之，故選(C)。","b":[{"k":"law","l":"公寓大廈規約範本（內政部；含附件六「公寓大廈文件之保管及閱覽管理規定」、附件七「室內裝修工程具結書」）","r":"公寓大廈規約範本第29條","m":"管理負責人或管理委員會對住戶所為的催告事項，應以書面方式為之。","u":"https://www.nlma.gov.tw/uploads/files/64c9e005c5c80aef8f123b5944268e14.pdf"},{"k":"law","l":"公寓大廈管理條例","r":"公寓大廈管理條例第21條","m":"公共基金或應分擔、應負擔的費用欠繳逾二期或累計達相當金額，經限定合理期間催繳仍不繳者，管理負責人或管理委員會可訴請法院判命給付並加計遲延利息。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070118"}],"nt":"條例第21條僅規定「經定相當期間催告」，未明定催告方式；以書面為之係規約範本之規定。"}},{"id":"04-04-007","c":"04","t":"04-04","n":"07","q":"下列何者，非屬公寓大廈行政管理實務，對於文件保管方式？","o":["裝訂","分置","存放","閱覽"],"a":"D","ty":"neg","e":{"s":"ok","x":"規約範本附件六所定文件保管方式為分類定期裝訂成冊、永久與定期保存文件分置存放等；閱覽係另依申請程序辦理之使用行為，非保管方式，故選(D)。","b":[{"k":"law","l":"公寓大廈規約範本（內政部；含附件六「公寓大廈文件之保管及閱覽管理規定」、附件七「室內裝修工程具結書」）","r":"公寓大廈規約範本附件六（文件之保管及閱覽管理規定）","m":"文件應分類並定期裝訂成冊、指定保管人，電子文件要備份並定期重製，永久與定期保存文件可分開存放；閱覽影印須依申請程序，用畢歸還原位。","u":"https://www.nlma.gov.tw/uploads/files/64c9e005c5c80aef8f123b5944268e14.pdf"}]}},{"id":"04-04-008","c":"04","t":"04-04","n":"08","q":"某社區使用執照編訂100戶門牌，甲先生自有25戶所有權，又接受丁小姐所有之25戶委託書，出席區分所有權人會議，如此關於表決權人數計算方式，下列何者正確？","o":["甲先生的表決權為40戶，區權會總表決人數(分母)為90戶。","甲先生的表決權為40戶，區權會總表決人數(分母)為100戶。","甲先生的表決權為50戶，區權會總表決人數(分母)為90戶。","甲先生的表決權為50戶，區權會總表決人數(分母)為100戶。"],"a":"A","ty":"num","e":{"s":"ok","x":"依條例第27條第2項，甲自有25戶超過全部100戶之五分之一（20戶），超過之5戶不予計算；依第3項，受託丁之25戶亦僅計20戶，故甲表決權為20＋20＝40戶；不予計算之5＋5＝10戶亦不列入總數，分母為100－10＝90戶，故選(A)。","b":[{"k":"law","l":"公寓大廈管理條例","r":"公寓大廈管理條例第27條第2項","m":"任一區分所有權人的區分所有權比例達全部五分之一以上，或其專有部分個數超過總數五分之一者，計算會議出席人數與表決權數時，超出部分都不算入。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070118"},{"k":"law","l":"公寓大廈管理條例","r":"公寓大廈管理條例第27條第3項","m":"區分所有權人不能出席時，可書面委託配偶、有行為能力的直系血親、其他區分所有權人或承租人代理；受託比例達全部五分之一以上或受託人數超過五分之一者，超出部分不算入。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070118"}],"nt":"條文規定超過部分「不予計算」，分母同時扣除10戶係依此規定計算出席人數與表決權數之解讀，條文未就分母另行明文。"}},{"id":"04-04-009","c":"04","t":"04-04","n":"09","q":"下列何者，非為公共住宅社區規約所應規定事項？","o":["禁止住戶飼養動物之特別規定","違反義務之處理方式","財務運作之監督規定","承租戶職業和性別"],"a":"D","ty":"gen","e":{"s":"ok","x":"條例第23條第2項列舉應載明於規約之事項包括禁止飼養動物之特別約定、違反義務之處理方式、財務運作之監督規定等，承租戶職業和性別不在其列，故選(D)。","b":[{"k":"law","l":"公寓大廈管理條例","r":"公寓大廈管理條例第23條第2項","m":"約定專用與約定共用的範圍及使用主體、共用部分使用收益的特別約定、禁止飼養動物、違反義務的處理、財務運作監督、會議人數比例特別約定、糾紛協調程序等，須寫入規約才有效力。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070118"}]}},{"id":"04-04-010","c":"04","t":"04-04","n":"10","q":"下列何者，雖載明於公共住宅社區規約，然亦不生效力之事項？","o":["違反義務之處理方式","約定專用有違法令使用限制之規定者","財務運作之監督規定","禁止住戶飼養動物之特別規定"],"a":"B","ty":"gen","e":{"s":"ok","x":"條例第7條第4款規定約定專用有違法令使用限制者不得約定專用，規約範本注意事項亦說明此類約定縱載明於規約亦不生效力；(A)(C)(D)則為第23條第2項須載明於規約始生效力之事項，故選(B)。","b":[{"k":"law","l":"公寓大廈管理條例","r":"公寓大廈管理條例第7條第4款","m":"若約定專用會違反法令的使用限制，該共用部分即不得約定為專用部分。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070118"},{"k":"law","l":"公寓大廈規約範本（內政部；含附件六「公寓大廈文件之保管及閱覽管理規定」、附件七「室內裝修工程具結書」）","r":"公寓大廈規約範本壹、注意事項","m":"不得約定專用的共用部分（如樓梯、走廊、主要構造）或違反法令的約定，即使寫入規約，也不發生效力。","u":"https://www.nlma.gov.tw/uploads/files/64c9e005c5c80aef8f123b5944268e14.pdf"},{"k":"law","l":"公寓大廈管理條例","r":"公寓大廈管理條例第23條第2項","m":"約定專用與約定共用的範圍及使用主體、共用部分使用收益的特別約定、禁止飼養動物、違反義務的處理、財務運作監督、會議人數比例特別約定、糾紛協調程序等，須寫入規約才有效力。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070118"}]}},{"id":"04-04-011","c":"04","t":"04-04","n":"11","q":"公寓大廈行政管理實務，文件保管的分類計有10類，其中合約書是屬於哪一類？","o":["文書類","規約類","業務類","設備類。"],"a":"C","ty":"gen","e":{"s":"ok","x":"規約範本附件六將文件分為10類，第10類業務類包括管理、保全、租賃、採購等合約書，故選(C)。","b":[{"k":"law","l":"公寓大廈規約範本（內政部；含附件六「公寓大廈文件之保管及閱覽管理規定」、附件七「室內裝修工程具結書」）","r":"公寓大廈規約範本附件六（文件之保管及閱覽管理規定）","m":"管委會保管的文件分為10類：01圖冊、02名冊、03財務、04會議、05證照、06文書、07設備、08財產、09規約、10業務；各類合約書歸入業務類。","u":"https://www.nlma.gov.tw/uploads/files/64c9e005c5c80aef8f123b5944268e14.pdf"}]}},{"id":"04-04-012","c":"04","t":"04-04","n":"12","q":"公寓大廈行政管理實務，文件保管第9類規約類的規約，其保存年限為何？","o":["3年","5年","10年","永久"],"a":"D","ty":"num","e":{"s":"ok","x":"規約範本附件六：第9類規約類（規約及各項管理辦法）之保存年限為永久，故選(D)。","b":[{"k":"law","l":"公寓大廈規約範本（內政部；含附件六「公寓大廈文件之保管及閱覽管理規定」、附件七「室內裝修工程具結書」）","r":"公寓大廈規約範本附件六（文件之保管及閱覽管理規定）","m":"規約類（規約、各項管理辦法）屬永久保存；須定期保存的文件，年限分為10年、5年、3年及1年。","u":"https://www.nlma.gov.tw/uploads/files/64c9e005c5c80aef8f123b5944268e14.pdf"}]}},{"id":"04-04-013","c":"04","t":"04-04","n":"13","q":"下列何者，非為公寓大廈行政管理實務，常用之管理辦法？","o":["裝潢管理辦法","公共設施使用管理辦法","財務收支管理辦法","下水道使用管理收費辦法"],"a":"D","ty":"gen","e":{"s":"not_found","x":"","b":[],"f":"屬公寓大廈行政管理實務教材內容，查無法規、規約範本或主管機關文件可引用之明確依據。","nt":"【2026-10-24簡報複查】查倫理規範頁139–143、屋況點交頁62：只零星提到設施設備管理辦法、特殊規章辦法、財務管理規定、社區裝修管理辦法等，沒有「常用管理辦法」清單，也沒有說明下水道使用管理收費辦法不屬之，維持 not_found。"}},{"id":"04-04-014","c":"04","t":"04-04","n":"14","q":"下列何者，非為公寓大廈行政管理實務，裝潢管理的規範內容？","o":["繳交區分所有權人權狀影本","繳交裝潢施工保證金","圖測審核","違建管制"],"a":"A","ty":"gen","e":{"s":"not_found","x":"","b":[],"f":"屬公寓大廈行政管理實務教材內容，查無法規、規約範本或主管機關文件可引用之明確依據。","nt":"【2026-10-24簡報複查】查屋況點交頁61–65（規約範本第22條之1、某社區裝潢施工申請表、驗退表，看圖確認）：表單列有裝潢保證金、施工設計圖說、區分所有權人同意書，但沒有「違建管制」「圖測審核」，也沒有說明權狀影本不屬裝潢管理規範，維持 not_found。"}},{"id":"04-04-015","c":"04","t":"04-04","n":"15","q":"下列何者，非為社區管理委員會會議記錄，應包括內容？","o":["開會時間","列席人員之介紹","出席人員及列席人員名單","討論事項之經過概要"],"a":"B","ty":"gen","e":{"s":"ok","x":"規約範本第14條：管委會會議紀錄應包括開會時間地點、出席及列席人員名單、討論事項之經過概要及決議內容，未要求列席人員之介紹，故選(B)。","b":[{"k":"law","l":"公寓大廈規約範本（內政部；含附件六「公寓大廈文件之保管及閱覽管理規定」、附件七「室內裝修工程具結書」）","r":"公寓大廈規約範本第14條","m":"管委會會議紀錄應記載開會時間地點、出席及列席人員名單、討論事項經過概要與決議內容，由主席簽名並於會後15日內公告。","u":"https://www.nlma.gov.tw/uploads/files/64c9e005c5c80aef8f123b5944268e14.pdf"}]}},{"id":"04-04-016","c":"04","t":"04-04","n":"16","q":"公寓大廈行政管理實務，文件之保存期限，若為應定期限保存者，下列何者非所訂保存年限?","o":["10年","8年","5年","3年"],"a":"B","ty":"neg","e":{"s":"ok","x":"規約範本附件六所定定期保存年限為10年、5年、3年及1年，無8年，故選(B)。","b":[{"k":"law","l":"公寓大廈規約範本（內政部；含附件六「公寓大廈文件之保管及閱覽管理規定」、附件七「室內裝修工程具結書」）","r":"公寓大廈規約範本附件六（文件之保管及閱覽管理規定）","m":"規約類（規約、各項管理辦法）屬永久保存；須定期保存的文件，年限分為10年、5年、3年及1年。","u":"https://www.nlma.gov.tw/uploads/files/64c9e005c5c80aef8f123b5944268e14.pdf"}]}},{"id":"04-04-017","c":"04","t":"04-04","n":"17","q":"下列何者，非為公寓大廈行政管理文件擬稿人員應具備的基本能力？","o":["文字組織能力","文書處理能力","擬稿要點能力","廣告行銷能力"],"a":"D","ty":"gen","e":{"s":"not_found","x":"","b":[],"f":"屬公寓大廈行政管理實務教材內容，查無法規、規約範本或主管機關文件可引用之明確依據。","nt":"【2026-10-24簡報複查】查倫理規範頁140–146，並搜尋「擬稿／文字組織／文書處理／廣告行銷」：簡報只有頁144一句「文書作業」，沒有擬稿人員基本能力的內容，維持 not_found。"}},{"id":"04-04-018","c":"04","t":"04-04","n":"18","q":"依據公寓大廈管理條例相關規定，區分所有權人會議應作成會議紀錄，載明開會經過及決議事項，並須由何人簽名？","o":["主席","管理委員","總幹事","租賃管理人員"],"a":"A","ty":"gen","e":{"s":"ok","x":"條例第34條第1項：區分所有權人會議須作成紀錄，記明開會經過與決議，並由會議主席簽名，故選(A)。","b":[{"k":"law","l":"公寓大廈管理條例","r":"公寓大廈管理條例第34條第1項","m":"區權會應作成會議紀錄寫明開會經過與決議事項，由主席簽名，並在會後15日內送達各區分所有權人並公告。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070118"}]}},{"id":"04-04-019","c":"04","t":"04-04","n":"19","q":"下列何者非屬公寓大廈行政管理實務，研擬管理辦法草案之主要內容？","o":["管理事項主題","廠商名單","管理事項的構成項目","管理作業程序及應用表單"],"a":"B","ty":"neg","e":{"s":"not_found","x":"","b":[],"f":"屬公寓大廈行政管理實務教材內容，查無法規、規約範本或主管機關文件可引用之明確依據。","nt":"【2026-10-24簡報複查】查倫理規範頁142–143：只有行政事務作業標準架構（作業流程、工作規範、應用表單）及駐點制度，沒有「研擬管理辦法草案主要內容」，也未提廠商名單，不足以支持答案，維持 not_found。"}},{"id":"04-04-020","c":"04","t":"04-04","n":"20","q":"下列何者為公寓大廈行政管理實務，郵件處理作業規範中可代收之郵件？","o":["掛號信件","拆封郵件","兵役通知","信用卡函"],"a":"A","ty":"gen","e":{"s":"not_found","x":"","b":[],"f":"屬公寓大廈行政管理實務教材內容，查無法規、規約範本或主管機關文件可引用之明確依據。","nt":"【2026-10-24簡報複查】查倫理規範頁144（僅一句「郵件處理」），並搜尋「掛號／兵役／信用卡／拆封」：簡報沒有郵件代收規範；網路只找到最高行政法院101年函，談管理員代收送達文書，未區分郵件種類，維持 not_found。"}},{"id":"04-04-021","c":"04","t":"04-04","n":"21","q":"依據公寓大廈管理條例相關規定，管理委員會之職務，對於該社區管理服務人之執業規範，下列何者正確？","o":["監督","升職","進薪","兼任"],"a":"A","ty":"gen","e":{"s":"ok","x":"條例第36條第9款將管理服務人之委任、僱傭及監督列為管理委員會職務，故選(A)。","b":[{"k":"law","l":"公寓大廈管理條例","r":"公寓大廈管理條例第36條第9款","m":"管理服務人的委任、僱傭及監督，是管理委員會的職務之一。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070118"}]}},{"id":"04-04-022","c":"04","t":"04-04","n":"22","q":"下列何者，非屬公寓大廈行政管理實務，安全防災管理維護類之規範？","o":["安全管理作業流程","公共設施清潔維護","安全維護作業流程","緊急事件處理作業流程"],"a":"B","ty":"neg","e":{"s":"ok","x":"簡報（法5-4）頁141引公寓大廈管理服務人管理辦法第15條，將管理維護業務分為一般事務、建築物及基地維護修繕、附屬設施設備檢查修護、「清潔及環境衛生之維持事項」與「安全防災管理維護事項」等類；公共設施清潔維護屬清潔及環境衛生類，而非安全防災管理維護類，故選(B)。","b":[{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－租賃住宅相關法規與實務（法5-1～法5-5）","r":"頁碼141（PDF第142頁）","q":"公寓公廈之清潔及環境衛生之維持事項。"},{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－租賃住宅相關法規與實務（法5-1～法5-5）","r":"頁碼141（PDF第142頁）","q":"公寓大廈及其週圍環境安全防災管理維護事項。"},{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－租賃住宅相關法規與實務（法5-1～法5-5）","r":"頁碼143（PDF第144頁）","q":"(4)清潔及環境衛生之維持事項。"},{"k":"law","l":"公寓大廈管理服務人管理辦法","r":"第15條第1項第4款、第5款","q":"公寓大廈及其週圍環境安全防災管理維護事項。","m":"管理維護公司從事之建築物管理維護業務，第4款為公寓大廈之清潔及環境衛生之維持事項，第5款為公寓大廈及其週圍環境安全防災管理維護事項，兩者分列。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070132"}],"nt":"簡報未逐項列出(A)(C)(D)三種作業流程，但其分類名稱「安全防災管理維護事項」與題目一致，且清潔維護另列為「清潔及環境衛生之維持事項」，足以說明(B)不屬安全防災管理維護類。簡報頁141與條文第4款均作「公寓公廈」（原文如此）。先前標為 not_found，本次依簡報更新。"}},{"id":"04-04-023","c":"04","t":"04-04","n":"23","q":"下列何者，非屬公寓大廈行政管理實務，保管文件類別之第1類圖冊？","o":["建物竣工圖","水電圖說","消防安全設備檢修單","管線圖說"],"a":"C","ty":"neg","e":{"s":"ok","x":"規約範本附件六第1類圖冊包括建物竣工圖、水電圖說、管線圖說等；消防安全設備檢修申報屬第5類證照類，故選(C)。","b":[{"k":"law","l":"公寓大廈規約範本（內政部；含附件六「公寓大廈文件之保管及閱覽管理規定」、附件七「室內裝修工程具結書」）","r":"公寓大廈規約範本附件六（文件之保管及閱覽管理規定）","m":"01圖冊類收錄建物的竣工圖、水電與消防圖說、機械設施及管線圖說等；公共安全檢查及消防安全設備檢修的申報文件則歸05證照類。","u":"https://www.nlma.gov.tw/uploads/files/64c9e005c5c80aef8f123b5944268e14.pdf"}]}},{"id":"04-04-024","c":"04","t":"04-04","n":"24","q":"下列何者非屬公寓大廈管理條例規定，利害關係人於必要時，得請求閱覽或影印之文件？","o":["公共基金餘額","欠繳公共基金與應分攤或其他應負擔費用情形","會計帳簿","管理人員所屬公司員工個資"],"a":"D","ty":"neg","e":{"s":"ok","x":"條例第35條所列利害關係人得請求閱覽或影印者為規約、公共基金餘額、會計帳簿、欠繳費用情形、會議紀錄等，不含管理人員所屬公司員工個資，故選(D)。","b":[{"k":"law","l":"公寓大廈管理條例","r":"公寓大廈管理條例第35條","m":"利害關係人必要時可請求閱覽或影印規約、公共基金餘額、會計憑證帳簿與財務報表、欠繳費用情形、管委會與區權會的會議紀錄，管理負責人或管委會不可拒絕。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070118"}]}},{"id":"04-04-025","c":"04","t":"04-04","n":"25","q":"公寓大廈行政管理實務之文件保管方式，下列何者處理方式較為不妥？","o":["為方便閱覽及作業暫放桌面","電子文件應予備份，並定期重製，以防資料遺失","永久保存與定期保存文件檔案得分置存放","文件檔案應分類定期裝訂成冊"],"a":"A","ty":"gen","e":{"s":"ok","x":"規約範本附件六要求文件分類定期裝訂成冊、電子文件備份重製、永久與定期保存文件得分置存放，閱覽後應歸還原位；暫放桌面不符保管規定，故選(A)。","b":[{"k":"law","l":"公寓大廈規約範本（內政部；含附件六「公寓大廈文件之保管及閱覽管理規定」、附件七「室內裝修工程具結書」）","r":"公寓大廈規約範本附件六（文件之保管及閱覽管理規定）","m":"文件應分類並定期裝訂成冊、指定保管人，電子文件要備份並定期重製，永久與定期保存文件可分開存放；閱覽影印須依申請程序，用畢歸還原位。","u":"https://www.nlma.gov.tw/uploads/files/64c9e005c5c80aef8f123b5944268e14.pdf"}]}},{"id":"04-04-026","c":"04","t":"04-04","n":"26","q":"包含姓名或名稱、區分所有單位地址、通訊地址、電話、傳真、專有部分面積、區分所有權比例等欄位之名冊，其名稱為何？","o":["區分所有權人名冊","住戶名冊","管理委員會名冊","車位使用人名冊"],"a":"A","ty":"gen","e":{"s":"ok","x":"題目所列欄位（姓名或名稱、單位地址、通訊地址、電話、傳真、專有部分面積、區分所有權比例）與規約範本附件六的區分所有權人名冊相同，故選(A)。","b":[{"k":"law","l":"公寓大廈規約範本（內政部；含附件六「公寓大廈文件之保管及閱覽管理規定」、附件七「室內裝修工程具結書」）","r":"公寓大廈規約範本附件六（文件之保管及閱覽管理規定）","m":"02名冊類的區分所有權人名冊，欄位有：姓名（名稱）、所屬區分所有單位地址、聯絡用通訊地址、電話與傳真、專有部分面積及區分所有權比例。","u":"https://www.nlma.gov.tw/uploads/files/64c9e005c5c80aef8f123b5944268e14.pdf"}]}},{"id":"04-04-027","c":"04","t":"04-04","n":"27","q":"下列何者，非屬室內裝修施工戶裝修施工七日前，所須完成手續？","o":["填寫裝潢修工申請書及保證書","查驗工程責任險保單正本","繳交裝潢修施工保證金","繳交裝潢修施工工班名冊"],"a":"D","ty":"neg","e":{"s":"not_found","x":"","b":[],"f":"規約範本第22條之1及附件七室內裝修工程具結書未規定施工七日前應完成之手續（申請書、保證金、責任險、工班名冊等），屬實務教材內容，查無可引用之依據。","nt":"【2026-10-24簡報複查】查屋況點交頁61–65（規約範本第22條之1、裝潢施工申請表、驗退表，看圖確認）及國土管理署規約範本PDF：都沒有「施工七日前」應完成的手續，也沒有工程責任險、工班名冊，維持 not_found。"}},{"id":"04-04-028","c":"04","t":"04-04","n":"28","q":"下列何者，非為公寓大廈管理條例規定社區管理委員會會議決議內容，不得違反之事項？","o":["社區規約","管理委員會會議","區分所有權人會議決議","公寓大廈管理條例"],"a":"B","ty":"neg","e":{"s":"ok","x":"條例第37條限制管委會會議的決議內容不可牴觸條例、規約及區分所有權人會議決議三者，「管理委員會會議」本身不在其列，故選(B)。","b":[{"k":"law","l":"公寓大廈管理條例","r":"公寓大廈管理條例第37條","m":"管理委員會會議所作的決議，內容不可牴觸本條例、規約或區分所有權人會議的決議。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070118"}]}},{"id":"04-05-001","c":"04","t":"04-05","n":"01","q":"朱小姐向房東承租公寓大廈社區住宅，熱心主動擔任管理委員會委員，試問她是否具備合法資格嗎?","o":["視社區規約而定","不具備資格","視房東與承租人協議","具備合法資格"],"a":"D","ty":"case","e":{"s":"ok","x":"條例第29條第5項：不具該專有部分區分所有權人身分的住戶（如承租人），除區權會決議或規約另有規定外，也可被選任為管理委員，朱小姐具備合法資格，故選(D)。","b":[{"k":"law","l":"公寓大廈管理條例","r":"公寓大廈管理條例第29條第5項","m":"不是該專有部分區分所有權人的住戶（例如承租人），除區權會決議或規約另有規定外，也可以被選任或推選為管理委員、主任委員或管理負責人。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070118"}],"nt":"若規約或區權會決議另有限制則從其規定；題庫答案係依條例之原則規定。"}},{"id":"04-05-002","c":"04","t":"04-05","n":"02","q":"洪先生等4位大學生，向房東承租公寓大廈社區住宅，其中2人想擔任管理委員會委員，試問他們具備合法資格嗎?","o":["視社區規約而定","取得房東同意書才具備資格","具備合法資格","不具備合法資格"],"a":"C","ty":"case","e":{"s":"ok","x":"條例第29條第5項：承租人等非區分所有權人之住戶，除區權會決議或規約另有規定外，得被選任為管理委員，故選(C)。","b":[{"k":"law","l":"公寓大廈管理條例","r":"公寓大廈管理條例第29條第5項","m":"不是該專有部分區分所有權人的住戶（例如承租人），除區權會決議或規約另有規定外，也可以被選任或推選為管理委員、主任委員或管理負責人。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070118"}],"nt":"若規約或區權會決議另有限制則從其規定；題庫答案係依條例之原則規定。"}},{"id":"04-05-003","c":"04","t":"04-05","n":"03","q":"承租人向房東承租公寓大廈社區3樓住宅，自行經營銷售寵物食品及寵物美容，未依建築物使用執照核准用途使用，何者應給予制止?","o":["管理負責人或管理委員會","社區清潔員","社區保全員","視雙方協議而定"],"a":"A","ty":"case","e":{"s":"ok","x":"條例第15條：住戶應依使用執照所載用途使用專有部分，違反者由管理負責人或管理委員會予以制止，故選(A)。","b":[{"k":"law","l":"公寓大廈管理條例","r":"公寓大廈管理條例第15條","m":"住戶使用專有及約定專用部分，應符合使用執照記載的用途與規約，不可任意變更；違反時由管理負責人或管理委員會制止，不從者報請直轄市、縣（市）主管機關處理。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070118"}]}},{"id":"04-05-004","c":"04","t":"04-05","n":"04","q":"樓上住戶因維護修繕陽台漏水問題，必須進入樓下承租戶室內勘驗，承租戶是否可拒絕?","o":["不得拒絕","無房東同意則可拒絕","無管委會同意則可拒絕","依漏水嚴重性而定"],"a":"A","ty":"gen","e":{"s":"ok","x":"承租人屬住戶（條例第3條第8款）；依第6條第1項第2款，他住戶因維修專有或約定專用部分必須進入其專有部分時，不得拒絕，故選(A)。","b":[{"k":"law","l":"公寓大廈管理條例","r":"公寓大廈管理條例第3條第8款","m":"住戶的範圍：區分所有權人、承租人、其他經區分所有權人同意而使用專有部分的人，以及已取得停車空間建築物所有權的人。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070118"},{"k":"law","l":"公寓大廈管理條例","r":"公寓大廈管理條例第6條第1項第2款","m":"其他住戶為維修其專有或約定專用部分、或設置管線，必須進入或使用本戶的專有或約定專用部分時，住戶不可拒絕。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070118"}]}},{"id":"04-05-005","c":"04","t":"04-05","n":"05","q":"承租人向房東承租公寓大廈社區一樓店面住宅，經營3C商品銷售與維修，需要加裝監視設備及用到社區共同弱電管道，須經由何者同意?","o":["兩邊住戶同意","社區管理公司同意","管理負責人或管理委員會之同意","弱電系統廠商同意"],"a":"C","ty":"case","e":{"s":"ok","x":"條例第6條第1項第4款：住戶設置管線而必須使用共用部分（社區共同弱電管道）時，應經管理負責人或管理委員會之同意，故選(C)。","b":[{"k":"law","l":"公寓大廈管理條例","r":"公寓大廈管理條例第6條第1項第4款","m":"住戶為維修專有或約定專用部分、或設置管線而必須使用共用部分時，要先取得管理負責人或管理委員會同意。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070118"}]}},{"id":"04-05-006","c":"04","t":"04-05","n":"06","q":"承租人向房東承租公寓大廈社區頂樓住宅，基於居家防竊需要加裝監視設備及用到社區共同弱電管道，須經由何者同意?","o":["管理負責人或管理委員會之同意","社區管理公司同意","同樓層住戶同意","弱電系統廠商同意"],"a":"A","ty":"case","e":{"s":"ok","x":"條例第6條第1項第4款：住戶設置管線而必須使用共用部分（社區共同弱電管道）時，應經管理負責人或管理委員會之同意，故選(A)。","b":[{"k":"law","l":"公寓大廈管理條例","r":"公寓大廈管理條例第6條第1項第4款","m":"住戶為維修專有或約定專用部分、或設置管線而必須使用共用部分時，要先取得管理負責人或管理委員會同意。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070118"}]}},{"id":"04-05-007","c":"04","t":"04-05","n":"07","q":"承租人向房東承租公寓大廈社區1樓店面，對於店面騎樓地板墊高美化，此舉的規範，下列敘述何者正確?","o":["經房東同意及申請主管建築機關核准就可裝修","經管委會同意就可裝修","經房東同意就可裝修","只要未來能恢復原狀就可裝修"],"a":"A","ty":"case","e":{"s":"ok","x":"建築法第43條第2項：騎樓地平面不得與鄰接騎樓高低不一，僅因地勢關係經直轄市、縣（市）主管機關核准者例外；故墊高騎樓地板除須房東同意外，尚須經主管建築機關核准，故選(A)。","b":[{"k":"law","l":"建築法","r":"建築法第43條第2項","m":"設有騎樓的建築物，其騎樓地平面不可與鄰接騎樓高低不一；僅在因地勢關係並經直轄市、縣（市）主管機關核准時例外。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070109"}]}},{"id":"04-05-008","c":"04","t":"04-05","n":"08","q":"承租人向房東承租公寓大廈社區1樓店面，對於店面及樑柱外觀及進行裝修美化，此舉的規範，下列敘述何者正確?","o":["經房東同意就可裝修","經管委會同意就可裝修","經房東同意及申請主管建築機關核准就可裝修","只要未破壞或變更建築物之構造就可裝修"],"a":"C","ty":"case","e":{"s":"ok","x":"樑柱屬建築法第8條之主要構造；條例第16條第3項規定裝修未經主管建築機關核准不得破壞或變更主要構造，故除房東同意外須申請主管建築機關核准，故選(C)。","b":[{"k":"law","l":"建築法","r":"建築法第8條","m":"主要構造涵蓋建築物的基礎、主要樑柱、承重牆、樓地板與屋頂等構造。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070109"},{"k":"law","l":"公寓大廈管理條例","r":"公寓大廈管理條例第16條第3項","m":"住戶進行維護、修繕、裝修等工作時，若未經主管建築機關核准，不可破壞或變更建築物的主要構造。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070118"}]}},{"id":"04-05-009","c":"04","t":"04-05","n":"09","q":"承租人向房東承租公寓大廈社區1、2樓店面及住宅，預計在2樓裝上LED廣告看板，此舉應受到規範，下列敘述何者正確?","o":["應向直轄市、縣（市）主管機關請示","應符合該公寓大廈規約另有規定或區分所有權人會議已有決議","應符合公寓大廈管委會之決議","應符合承租人自由使用收益"],"a":"B","ty":"case","e":{"s":"ok","x":"條例第8條第1項：於外牆面設置廣告物，除依法令辦理外，若社區規約已有規定或區權會已作成決議（並經報備），即應受其限制，故選(B)。","b":[{"k":"law","l":"公寓大廈管理條例","r":"公寓大廈管理條例第8條第1項","m":"周圍上下、外牆面、樓頂平臺及非專有的防空避難設備，變更構造、顏色或設廣告物、鐵鋁窗等，除依法令辦理外，規約或區權會決議已有規定並向直轄市、縣（市）主管機關報備者，須受其限制。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070118"}]}},{"id":"04-05-010","c":"04","t":"04-05","n":"10","q":"承租人向房東承租公寓大廈社區住宅，積欠應繳納之管理費用，若超過幾期管理負責人得催告其給付應繳金額?","o":["0.5期","1期","1.5期","2期"],"a":"D","ty":"num","e":{"s":"ok","x":"條例第21條：應繳費用欠繳逾二期或累計達相當金額，經限期催繳仍不繳納時，管理負責人或管理委員會可訴請法院判命給付，故選(D)。","b":[{"k":"law","l":"公寓大廈管理條例","r":"公寓大廈管理條例第21條","m":"公共基金或應分擔、應負擔的費用欠繳逾二期或累計達相當金額，經限定合理期間催繳仍不繳者，管理負責人或管理委員會可訴請法院判命給付並加計遲延利息。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070118"}]}},{"id":"05-01-001","c":"05","t":"05-01","n":"01","q":"下列有關住宅包租契約應約定及不得約定事項包租業提前終止租約事由的敘述，何者有誤？","o":["租賃住宅或附屬設備損壞，應由出租人負擔修繕費用者，經包租業訂相當期限催告，出租人仍不為支付","租賃住宅因不可歸責於包租業及次承租人之事由致一部滅失，且其存餘部分不能達租賃之目的","租賃住宅含有氯離子0.01kg/m2","因第三人就租賃住宅主張其權利，致次承租人不能為約定之居住使用"],"a":"C","ty":"neg","e":{"s":"ok","x":"住宅包租契約應約定事項第十七點第1項：包租業得提前終止租約之情形為：出租人應負擔之修繕費用經催告仍不於期限內支付、不可歸責之一部滅失致存餘部分不能達租賃目的、有危及次承租人安全或健康之瑕疵、第三人主張權利致次承租人不能為約定之居住使用；「含有氯離子」非所列事由（氯離子僅見於附件一現況確認書之檢測項目），故選(C)。","b":[{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－租賃管理與糾紛實務（實2-1～實2-2）","r":"頁碼5（PDF第6頁）","q":"十七.包租業提前終止租約"},{"k":"law","l":"住宅包租契約應約定及不得約定事項（內政部）","r":"應約定事項第十七點第1項前段","q":"租賃期間有下列情形之一者，包租業得提前終止租約之全部或一部：","u":"https://gazette.nat.gov.tw/EG_FileManager/eguploadpub/eg025035/ch02/type1/gov10/num2/images/AA.pdf"},{"k":"law","l":"住宅包租契約應約定及不得約定事項（內政部）","r":"應約定事項第十七點第1項第1款","q":"租賃住宅或附屬設備損壞，應由出租人負擔修繕費用者，經包租業定相當期限催告，出租人仍不於期限內支付。","u":"https://gazette.nat.gov.tw/EG_FileManager/eguploadpub/eg025035/ch02/type1/gov10/num2/images/AA.pdf"},{"k":"law","l":"住宅包租契約應約定及不得約定事項（內政部）","r":"應約定事項第十七點第1項第2款","q":"租賃住宅因不可歸責於包租業及次承租人之事由致一部滅失，且其存餘部分不能達租賃之目的。","u":"https://gazette.nat.gov.tw/EG_FileManager/eguploadpub/eg025035/ch02/type1/gov10/num2/images/AA.pdf"},{"k":"law","l":"住宅包租契約應約定及不得約定事項（內政部）","r":"應約定事項第十七點第1項第3款","q":"租賃住宅有危及次承租人或其同居人之安全或健康之瑕疵。","u":"https://gazette.nat.gov.tw/EG_FileManager/eguploadpub/eg025035/ch02/type1/gov10/num2/images/AA.pdf"},{"k":"law","l":"住宅包租契約應約定及不得約定事項（內政部）","r":"應約定事項第十七點第1項第4款","q":"因第三人就租賃住宅主張其權利，致次承租人不能為約定之居住使用。","u":"https://gazette.nat.gov.tw/EG_FileManager/eguploadpub/eg025035/ch02/type1/gov10/num2/images/AA.pdf"}]}},{"id":"05-01-002","c":"05","t":"05-01","n":"02","q":"住宅包租契約應約定及不得約定事項之法源為下列何者？","o":["消費者保護法","租賃住宅市場發展及管理條例","不動產經紀業管理條例","公平交易法"],"a":"B","ty":"neg","e":{"s":"ok","x":"簡報（糾紛處理）頁3：非具消費關係之住宅包租契約應約定及不得約定事項，其法源為租賃住宅市場發展及管理條例；現行條例第5條第2項：包租業與出租人間之住宅包租契約，其應約定及不得約定事項，由中央主管機關定之，故選(B)。","b":[{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－租賃管理與糾紛實務（實2-1～實2-2）","r":"頁碼3（PDF第4頁）","q":"非具消費關係的住宅包租契約應約定及不得約定事項"},{"k":"law","l":"租賃住宅市場發展及管理條例","r":"第5條第2項","q":"包租業與出租人間之住宅包租契約，其應約定及不得約定事項，由中央主管機關定之。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060125"}],"nt":"簡報頁3之表格列「法源：租賃住宅市場發展及管理條例」（非消費關係：包租契約、住宅租賃契約）。應約定事項總說明引106年原條文「條例第5條第1項」，112年修正後為第5條第2項。"}},{"id":"05-01-003","c":"05","t":"05-01","n":"03","q":"下列何者不是住宅包租契約中的不得約定事項內容？","o":["不得約定廣告僅供參考","不得約定包租業於租屋處不得辦理公司登記","不得約定應由包租業負擔之稅費，轉嫁由出租人負擔","不得約定出租人須繳回契約書"],"a":"B","ty":"neg","e":{"s":"ok","x":"簡報（糾紛處理）頁5所列住宅包租契約不得約定事項包括：不得約定廣告僅供參考、不得約定應由包租業負擔之稅費轉嫁由出租人負擔、不得約定出租人須繳回契約書等七項，並無「不得約定包租業於租屋處不得辦理公司登記」，故選(B)。","b":[{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－租賃管理與糾紛實務（實2-1～實2-2）","r":"頁碼5（PDF第6頁）","q":"不得約定廣告僅供參考。"},{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－租賃管理與糾紛實務（實2-1～實2-2）","r":"頁碼5（PDF第6頁）","q":"不得約定應由包租業負擔之稅費"},{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－租賃管理與糾紛實務（實2-1～實2-2）","r":"頁碼5（PDF第6頁）","q":"不得約定出租人須繳回契約書。"},{"k":"law","l":"住宅包租契約應約定及不得約定事項（內政部）","r":"不得約定事項第一點至第七點","m":"一、不得約定廣告僅供參考；二、不得約定次承租人不得遷入戶籍；三、不得約定應由包租業負擔之稅費，轉嫁由出租人負擔；四、不得約定免除或限制民法上出租人故意不告知之瑕疵擔保責任；五、不得約定出租人須繳回契約書；六、不得約定本契約之通知，僅以電話方式為之；七、不得約定違反強制或禁止規定。（與簡報頁5相同）","u":"https://gazette.nat.gov.tw/EG_FileManager/eguploadpub/eg025035/ch02/type1/gov10/num2/images/AA.pdf"}]}},{"id":"05-01-004","c":"05","t":"05-01","n":"04","q":"下列何者非住宅包租契約應約定事項中之租賃住宅標的約定事項？","o":["公有部分建號","共有部分建號","專有部分建號","車位"],"a":"A","ty":"neg","e":{"s":"ok","x":"住宅包租契約應約定事項第一點（一）租賃住宅標示：包括門牌、專有部分建號、共有部分建號、車位、有無設定他項權利及查封登記等，並無「公有部分建號」，故選(A)。","b":[{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－租賃管理與糾紛實務（實2-1～實2-2）","r":"頁碼5（PDF第6頁）","q":"1. 租賃住宅標示"},{"k":"law","l":"住宅包租契約應約定及不得約定事項（內政部）","r":"應約定事項第一點（一）2","q":"專有部分建號 ，權利範圍 ，面積共計 平方公尺。","u":"https://gazette.nat.gov.tw/EG_FileManager/eguploadpub/eg025035/ch02/type1/gov10/num2/images/AA.pdf"},{"k":"law","l":"住宅包租契約應約定及不得約定事項（內政部）","r":"應約定事項第一點（一）3","q":"共有部分建號__，權利範圍__，持分面積__平方公尺。","u":"https://gazette.nat.gov.tw/EG_FileManager/eguploadpub/eg025035/ch02/type1/gov10/num2/images/AA.pdf"},{"k":"law","l":"住宅包租契約應約定及不得約定事項（內政部）","r":"應約定事項第一點（一）4","q":"車位：□有（汽車停車位 個、機車停車位 個）□無。","u":"https://gazette.nat.gov.tw/EG_FileManager/eguploadpub/eg025035/ch02/type1/gov10/num2/images/AA.pdf"}]}},{"id":"05-01-005","c":"05","t":"05-01","n":"05","q":"下列何者非屬住宅包租契約應約定及不得約定事項租賃住宅標的應約定事項？","o":["門牌","格局","附屬建物用途","車位"],"a":"B","ty":"neg","e":{"s":"ok","x":"住宅包租契約應約定事項第一點（一）租賃住宅標示：包括門牌、專有部分建號（含主建物及附屬建物用途、面積）、共有部分建號、車位等，並無「格局」項目，故選(B)。","b":[{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－租賃管理與糾紛實務（實2-1～實2-2）","r":"頁碼5（PDF第6頁）","q":"1. 租賃住宅標示"},{"k":"law","l":"住宅包租契約應約定及不得約定事項（內政部）","r":"應約定事項第一點（一）1","m":"門牌（縣市、鄉鎮市區、街路段巷弄號樓，及基地坐落段、小段、地號）；無門牌者，記載房屋稅籍編號或位置略圖。","u":"https://gazette.nat.gov.tw/EG_FileManager/eguploadpub/eg025035/ch02/type1/gov10/num2/images/AA.pdf"},{"k":"law","l":"住宅包租契約應約定及不得約定事項（內政部）","r":"應約定事項第一點（一）2（2）","q":"附屬建物用途__，面積__平方公尺。","u":"https://gazette.nat.gov.tw/EG_FileManager/eguploadpub/eg025035/ch02/type1/gov10/num2/images/AA.pdf"},{"k":"law","l":"住宅包租契約應約定及不得約定事項（內政部）","r":"應約定事項第一點（一）4","q":"車位：□有（汽車停車位 個、機車停車位 個）□無。","u":"https://gazette.nat.gov.tw/EG_FileManager/eguploadpub/eg025035/ch02/type1/gov10/num2/images/AA.pdf"}],"nt":"第一點（二）租賃範圍第1款有「如『租賃住宅位置格局示意圖』標註之租賃範圍」之文字，係租賃範圍之標註方式，非租賃住宅標示之應約定項目。"}},{"id":"05-01-006","c":"05","t":"05-01","n":"06","q":"下列何者非屬住宅包租契約應約定事項中，租賃標的之應約定事項？","o":["專有部分之建號","專有部分之權利範圍","專有部分之面積","專有部分之使用時間"],"a":"D","ty":"neg","e":{"s":"ok","x":"住宅包租契約應約定事項第一點(一)2：租賃住宅標示應載明「專有部分建號 ，權利範圍 ，面積共計 平方公尺」；「使用時間」僅見於同點(二)租賃範圍之車位約定，並非專有部分之應約定事項，故選(D)。","b":[{"k":"law","l":"住宅包租契約應約定及不得約定事項（內政部）","r":"應約定事項第一點(一)2","q":"專有部分建號 ，權利範圍 ，面積共計 平方公尺。","u":"https://gazette.nat.gov.tw/EG_FileManager/eguploadpub/eg025035/ch02/type1/gov10/num2/images/AA.pdf"},{"k":"law","l":"住宅包租契約應約定及不得約定事項（內政部）","r":"應約定事項第一點(二)2","m":"租賃範圍之車位（如無則免填）項下約定汽車停車位種類及編號（平面式或機械式）、機車停車位及使用時間（全日、日間、夜間、其他）。","u":"https://la.hl.gov.tw/Upload/202406211536262510621.pdf"}]}},{"id":"05-01-007","c":"05","t":"05-01","n":"07","q":"包租業者為何種行為，會違反住宅包租契約應約定及不得約定事項？","o":["向出租人包租後，轉租一部分房屋給次承租人作為辦公室使用","簽訂包租契約後以公證之方式為之","響應青銀共居，將房屋分租給年輕人與老年人","向房東表示願意負擔租賃期間之水電費，並記載於租約中"],"a":"A","ty":"neg","e":{"s":"ok","x":"住宅包租契約應約定事項第七點第1項：「本租賃住宅係供轉租作居住使用，包租業不得變更用途。」將部分房屋轉租作辦公室即屬變更用途；辦理公證（第六點第2項公證費約定）、約定由包租業負擔水電費（第五點）均為應約定事項所容許，分租予年輕人與老年人仍屬居住使用，故選(
