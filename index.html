],"a":"B","ty":"gen","e":{"s":"ok","x":"租賃條例第2條：本條例主管機關在中央為內政部，故選(B)。","b":[{"k":"law","l":"租賃住宅市場發展及管理條例","r":"條例第2條","m":"本條例主管機關在中央為內政部，地方為直轄市政府及縣（市）政府。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060125"}]}},{"id":"06-01-004","c":"06","t":"06-01","n":"04","q":"為避免發生租約到期，承租人不搬走或出租人無理由扣留押金等糾紛爭議，下列敘述何者正確?","o":["可請律師當見證人，一同完成簽約，若未履行契約，直接聲請強制執行","可請地政士協助認證，一同完成簽約，若未履行契約，直接聲請強制執行","可至法院或民間公證人公證租約，若未履行契約，直接聲請強制執行","可至律師進行租約認證，若未履行契約，直接聲請強制執行"],"a":"C","ty":"gen","e":{"s":"ok","x":"依公證法第13條第1項，公證書就金錢給付或租用建築物定有期間並應於期滿交還者，載明應逕受強制執行時，得據以執行；公證由法院或民間公證人辦理（第1條），且此種公證書依強制執行法第4條第1項第4款為執行名義，故選(C)。","b":[{"k":"law","l":"公證法","r":"公證法第13條第1項第1款、第3款","m":"公證書就金錢等給付，或就租用建築物定有期間並於期滿交還者，載明應逕受強制執行時，可據以強制執行。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=B0010010"},{"k":"law","l":"公證法","r":"公證法第1條第1項","m":"公證業務由法院公證人或民間公證人辦理。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=B0010010"},{"k":"law","l":"強制執行法","r":"強制執行法第4條第1項第4款","m":"依公證法規定得強制執行的公證書為執行名義。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=B0010004"}]}},{"id":"06-01-005","c":"06","t":"06-01","n":"05","q":"根據租賃住宅市場發展及管理條例中規定，當出租人與承租人發生租屋糾紛爭議時，關於調處機制下列敘述何者正確?","o":["調處成立，等同法院確定判決","出租人與承租人申請調處免繳納費用","承租人申請需要手續費","出租人申請需要作業費用"],"a":"B","ty":"gen","e":{"s":"ok","x":"租賃條例第16條：出租人或承租人就住宅租賃爭議向直轄市、縣（市）政府申請調處者，免繳調處費用，故選(B)。","b":[{"k":"law","l":"租賃住宅市場發展及管理條例","r":"條例第16條","m":"出租人或承租人因住宅租賃發生爭議時，可向直轄市、縣（市）政府申請調處，且不必繳納調處費用。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060125"}]}},{"id":"06-01-006","c":"06","t":"06-01","n":"06","q":"租賃住宅服務業經營所繳交的營業保證金，主要是做為何項擔保之用?","o":["營業保證金是加入租賃住宅服務業全聯會的會費","營業保證金是協助承租人支付欠繳之租金","營業保證金是業者不能履行契約或因其受僱人執行業務之故意或過失致租賃住宅服務當事人受損害人的損害賠償擔保","營業保證金主要是協助租賃雙方支付租賃衍生之費用"],"a":"C","ty":"gen","e":{"s":"ok","x":"依租賃條例第31條，業者因可歸責事由不能履行契約或其受僱人執行業務因故意過失致服務當事人受損時應負賠償責任，被害人並得在業者繳存之營業保證金範圍內請求全聯會代為賠償，故營業保證金為此類損害之賠償擔保，故選(C)。","b":[{"k":"law","l":"租賃住宅市場發展及管理條例","r":"條例第31條第1項","m":"因可歸責於租賃住宅服務業的事由不能履行契約，致服務當事人受損害者，由業者負賠償責任。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060125"},{"k":"law","l":"租賃住宅市場發展及管理條例","r":"條例第31條第2項","m":"業者的受僱人執行業務時因故意或過失使服務當事人受損，業者與受僱人連帶賠償。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060125"},{"k":"law","l":"租賃住宅市場發展及管理條例","r":"條例第31條第4項","m":"被害人取得執行名義或經基金管理委員會調處決議應支付後，可在業者繳存的營業保證金及擔保總額內，向全聯會請求代為賠償。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060125"}]}},{"id":"06-01-007","c":"06","t":"06-01","n":"07","q":"依租賃住宅市場發展及管理條例內容，關於租賃住宅之租金約定規定，下列何者正確?","o":["城市地方房屋之租金，不超過土地及其建築物申報總價年息10%","城市地方房屋之租金，不超過土地及其建築物申報總價年息5%","城市地方房屋之租金，不超過土地及其建築物申報總價年息15%","租金自行約定不受限"],"a":"D","ty":"num","e":{"s":"ok","x":"租賃條例第6條：租金由出租人與承租人約定，不適用土地法第97條（城市房屋租金以申報總價年息10%為限）之規定，故選(D)。","b":[{"k":"law","l":"租賃住宅市場發展及管理條例","r":"條例第6條","m":"租金由出租人與承租人自行約定，排除土地法第97條租金上限規定的適用。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060125"}]}},{"id":"06-01-008","c":"06","t":"06-01","n":"08","q":"何謂租賃住宅市場發展及管理條例所稱之租賃住宅代管業?","o":["與出租人簽訂委託管理租賃住宅契約書後，執行租賃住宅管理業務之業者","與委託人簽訂租賃住宅契約書後，協助委託人將住宅出租之業者","接受承租人之委託，協助出租人進行租賃住宅管理業務之業者","接受政府核定可執行租賃住宅租賃業務的業者"],"a":"A","ty":"gen","e":{"s":"ok","x":"租賃條例第3條第4款：租賃住宅代管業指受出租人之委託，經營租賃住宅管理業務之公司，故選(A)。","b":[{"k":"law","l":"租賃住宅市場發展及管理條例","r":"條例第3條第4款","m":"租賃住宅代管業：接受出租人委託，經營租賃住宅管理業務的公司。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060125"}]}},{"id":"06-01-009","c":"06","t":"06-01","n":"09","q":"租賃住宅市場發展及管理的租賃住宅服務業，若經被害人向租賃住宅服務業全聯會申請調處並確定責任之歸屬後，下列程序何者正確?","o":["由租賃住宅服務業全聯會協助被服務人進行訴訟","由租賃住宅服務業繳存的營業保證金支付代償","由業者直接支付賠償金","由租賃住宅服務業全聯會進行再次協商"],"a":"B","ty":"gen","e":{"s":"ok","x":"租賃條例第31條第3項、第4項：被害人向全聯會請求代為賠償時由基金管理委員會調處，經調處決議應支付者，得在業者繳存之營業保證金及擔保範圍內由全聯會代為賠償，故選(B)。","b":[{"k":"law","l":"租賃住宅市場發展及管理條例","r":"條例第31條第3項","m":"被害人向全國聯合會請求代為賠償時，由全聯會所設的基金管理委員會立即調處。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060125"},{"k":"law","l":"租賃住宅市場發展及管理條例","r":"條例第31條第4項","m":"被害人取得執行名義或經基金管理委員會調處決議應支付後，可在業者繳存的營業保證金及擔保總額內，向全聯會請求代為賠償。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060125"}]}},{"id":"06-01-010","c":"06","t":"06-01","n":"10","q":"因房屋租賃發生爭議，不服調處者，依法得向何機關訴請處理?","o":["立法機關","監察機關","地政機關","司法機關"],"a":"D","ty":"gen","e":{"s":"ok","x":"土地法第101條：因房屋租用發生爭議，得由直轄市或縣（市）地政機關調處，不服調處者得向司法機關訴請處理，故選(D)。","b":[{"k":"law","l":"土地法","r":"土地法第101條","m":"房屋租用爭議可由該管直轄市或縣（市）地政機關調處，不服調處者可向司法機關訴請處理。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060001"}]}},{"id":"06-01-011","c":"06","t":"06-01","n":"11","q":"依租賃住宅市場發展及管理條例法規定，直轄市、縣(市)地政機關為處理租屋相關之糾紛，應設何種委員會?","o":["不動產糾紛調處委員會","不動產糾紛仲裁委員會","不動產糾紛調解委員會","不動產糾紛調查委員會"],"a":"A","ty":"gen","e":{"s":"ok","x":"土地法第34條之2規定直轄市或縣（市）地政機關為處理不動產糾紛應設不動產糾紛調處委員會；其調處辦法第2條並將房屋租用爭議及租賃條例第16條住宅租賃爭議列為調處範圍，故選(A)。","b":[{"k":"law","l":"土地法","r":"土地法第34條之2","m":"直轄市或縣（市）地政機關為處理不動產糾紛，應設不動產糾紛調處委員會，聘地政、營建、法律專業及地方公正人士擔任委員。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060001"},{"k":"law","l":"直轄市縣（市）不動產糾紛調處委員會設置及調處辦法","r":"調處辦法第2條第4款、第8款","m":"可調處的不動產糾紛包括土地法第101條房屋租用爭議及租賃住宅市場發展及管理條例第16條住宅租賃爭議。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0000077"}]}},{"id":"06-01-012","c":"06","t":"06-01","n":"12","q":"出租人與承租人間因租屋發生民事履約爭議時，可依下列何項方式處理?","o":["由當地鄉鎮市區公所調解委員會進行調解","直接報警處理","直接至訴請法院強制執行","由當地鄉鎮市區公所耕地租佃委員會調解"],"a":"A","ty":"gen","e":{"s":"ok","x":"鄉鎮市調解條例第1條：鄉、鎮、市公所設調解委員會辦理民事事件之調解（直轄市、市之區依第35條準用），租屋履約爭議屬民事事件，故選(A)。","b":[{"k":"law","l":"鄉鎮市調解條例","r":"鄉鎮市調解條例第1條","m":"鄉、鎮、市公所應設調解委員會，辦理民事事件及告訴乃論刑事事件的調解。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=I0020003"},{"k":"law","l":"鄉鎮市調解條例","r":"鄉鎮市調解條例第35條第2項","m":"本條例於直轄市及市之區調解委員會準用之。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=I0020003"}]}},{"id":"06-01-013","c":"06","t":"06-01","n":"13","q":"與代管業及包租業者發生糾紛爭議時，除了直轄市、縣(市)政府主管機關外，下列何者亦為可接受申訴的單位?","o":["全國律師公會","金融評議委員會","勞資爭議調解委員會","租賃住宅服務業全聯會"],"a":"D","ty":"gen","e":{"s":"ok","x":"租賃條例第31條第3項：受租賃住宅服務業損害之被害人得向全國聯合會請求代為賠償，由其基金管理委員會調處，故全聯會亦為受理代管業、包租業糾紛之單位，故選(D)。","b":[{"k":"law","l":"租賃住宅市場發展及管理條例","r":"條例第31條第3項","m":"被害人向全國聯合會請求代為賠償時，由全聯會所設的基金管理委員會立即調處。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060125"},{"k":"law","l":"租賃住宅市場發展及管理條例","r":"條例第31條第1項","m":"因可歸責於租賃住宅服務業的事由不能履行契約，致服務當事人受損害者，由業者負賠償責任。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060125"}],"nt":"條文係規定請求代為賠償及調處，題目以「申訴」稱之。"}},{"id":"06-02-001","c":"06","t":"06-02","n":"01","q":"「調解」與「調處」為訴訟以外解決紛爭的機制，下列敘述何者正確?","o":["調解與調處與法院之裁判效力相同","調解與調處雙方達成協議後，等同確定判決","調處委員做成的決議，雙方皆不能再異議","調解雙方達成協議，做成之筆錄，送法院核定等同確定判決"],"a":"D","ty":"gen","e":{"s":"ok","x":"依鄉鎮市調解條例第26條第1項、第27條第2項，調解成立後由公所於10日內送法院審核，經法院核定之民事調解與民事確定判決有同一效力，(D)正確；調處結果不服者仍得於15日內向法院起訴（調處辦法第19條第3項），(A)(B)(C)錯，故選(D)。","b":[{"k":"law","l":"鄉鎮市調解條例","r":"鄉鎮市調解條例第26條第1項","m":"公所應在調解成立後10日內，將調解書及卷證送請管轄法院審核。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=I0020003"},{"k":"law","l":"鄉鎮市調解條例","r":"鄉鎮市調解條例第27條第2項","m":"經法院核定的民事調解與民事確定判決效力相同；核定的刑事調解以給付金錢、代替物或有價證券為標的者，調解書得為執行名義。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=I0020003"},{"k":"law","l":"直轄市縣（市）不動產糾紛調處委員會設置及調處辦法","r":"調處辦法第19條第3項","m":"調處結果以書面通知，不服者應於接到通知後15日內以對造為被告向法院起訴。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0000077"}]}},{"id":"06-02-002","c":"06","t":"06-02","n":"02","q":"「調解」與「和解」都是訴訟以外解決紛爭的機制，下列敘述何者正確?","o":["調解與和解與法院之裁判效力相同","調解與和解均須雙方當事人同意","非告訴乃論的刑事事件不可和解，但可調解","法庭上的任意調解皆由地方法院法官主導"],"a":"B","ty":"gen","e":{"s":"ok","x":"和解為當事人約定互相讓步之契約（民法第736條），調解原則上亦須雙方合意始能成立，鄉鎮市調解並須經當事人同意始得進行（鄉鎮市調解條例第11條），故兩者均須雙方同意；刑事事件之調解以告訴乃論者為限（同條例第1條），(C)錯，故選(B)。","b":[{"k":"law","l":"民法","r":"民法第736條","m":"和解是當事人約定互相讓步，以終止或防止爭執的契約。","u":"https://mojlaw.moj.gov.tw/LawContent.aspx?LSID=FL001351&lawNumber=736&TypeSort=3"},{"k":"law","l":"司法院全球資訊網－業務綜覽－民事－民事調解","r":"司法院民事調解說明","m":"法院調解原則上經雙方合意成立（財產權爭議另有法官依職權提方案、未異議即視為成立之例外）；調解成立者與法院確定判決同效力，有執行力，不得就同一爭議再起訴。","u":"https://www.judicial.gov.tw/tw/cp-1448-56928-185b3-1.html"},{"k":"law","l":"鄉鎮市調解條例","r":"鄉鎮市調解條例第11條","m":"聲請調解時，民事事件須經當事人同意，告訴乃論刑事事件須經被害人同意，才可進行調解。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=I0020003"},{"k":"law","l":"鄉鎮市調解條例","r":"鄉鎮市調解條例第1條","m":"鄉、鎮、市公所應設調解委員會，辦理民事事件及告訴乃論刑事事件的調解。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=I0020003"}]}},{"id":"06-02-003","c":"06","t":"06-02","n":"03","q":"出租人與承租人間因租屋發生爭議時，可依下列何種方式處理?","o":["直接訴請法院強制執行","由當地鄉鎮市區公所調解委員會進行仲裁","由當地鄉鎮市區公所調解委員會進行調解","由當地鄉鎮市區公所耕地租佃委員會調解"],"a":"C","ty":"gen","e":{"s":"ok","x":"鄉鎮市調解條例第1條：鄉、鎮、市公所調解委員會辦理民事事件之調解（區調解委員會依第35條準用），租屋爭議屬民事事件，且係「調解」而非仲裁，故選(C)。","b":[{"k":"law","l":"鄉鎮市調解條例","r":"鄉鎮市調解條例第1條","m":"鄉、鎮、市公所應設調解委員會，辦理民事事件及告訴乃論刑事事件的調解。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=I0020003"},{"k":"law","l":"鄉鎮市調解條例","r":"鄉鎮市調解條例第35條第2項","m":"本條例於直轄市及市之區調解委員會準用之。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=I0020003"}]}},{"id":"06-02-004","c":"06","t":"06-02","n":"04","q":"出租人因租賃住宅委託管理業者之員工服務不佳，及未處理好委任事項而發生糾紛爭議，應依下列何種方式解決?","o":["業者得向直轄市、縣(市)政府消費者服務中心申訴","出租人得向直轄市、縣(市)政府主管機關或全聯會申請調處","出租人得向直轄市、縣(市)政府勞工局申請調處","業者可向直轄市、縣(市)政府勞工局申請調處"],"a":"B","ty":"gen","e":{"s":"ok","x":"租賃條例第31條第2項、第3項：代管業之受僱人執行業務致服務當事人（出租人）受損時，業者應連帶賠償，被害人得向全聯會請求代為賠償並由其基金管理委員會調處；同條例第14條第1項並由主管機關提供租賃糾紛處理，故選(B)。","b":[{"k":"law","l":"租賃住宅市場發展及管理條例","r":"條例第31條第2項","m":"業者的受僱人執行業務時因故意或過失使服務當事人受損，業者與受僱人連帶賠償。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060125"},{"k":"law","l":"租賃住宅市場發展及管理條例","r":"條例第31條第3項","m":"被害人向全國聯合會請求代為賠償時，由全聯會所設的基金管理委員會立即調處。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060125"},{"k":"law","l":"租賃住宅市場發展及管理條例","r":"條例第14條第1項","m":"主管機關可推動住宅租賃專業服務、發展服務產業，並提供住宅租賃糾紛處理及諮詢等事務。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060125"}],"nt":"條例第16條之調處限於出租人與承租人間之住宅租賃爭議；出租人與代管業間向主管機關「申請調處」之明文依據未查得，係以第14條糾紛處理機制說明。"}},{"id":"06-02-005","c":"06","t":"06-02","n":"05","q":"哪個地方單位設有調解委員會?","o":["鄉鎮市區公所","直轄市(縣)政府市(縣)議會","鄉鎮市區民代表會","里長的服務中心"],"a":"A","ty":"gen","e":{"s":"ok","x":"鄉鎮市調解條例第1條：鄉、鎮、市公所應設調解委員會（直轄市及市之區依第35條準用），故選(A)。","b":[{"k":"law","l":"鄉鎮市調解條例","r":"鄉鎮市調解條例第1條","m":"鄉、鎮、市公所應設調解委員會，辦理民事事件及告訴乃論刑事事件的調解。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=I0020003"},{"k":"law","l":"鄉鎮市調解條例","r":"鄉鎮市調解條例第35條第2項","m":"本條例於直轄市及市之區調解委員會準用之。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=I0020003"}]}},{"id":"06-02-006","c":"06","t":"06-02","n":"06","q":"房東甲因在土城的租屋賠償與房客乙已有調解成立案件，現又因戶籍在基隆的乙在板橋不小心撞傷了甲，其損害賠償調解，下列敘述何者正確?","o":["屬不同之案件可受理，須在板橋或基隆區公所申請","屬不同之案件可受理，須在土城區公所申請","有調解過，不論案件皆不得受理","需隔半年方能申請"],"a":"A","ty":"case","e":{"s":"ok","x":"撞傷屬與前租屋賠償不同之新事件，前案之核定效力僅及於同一事件（鄉鎮市調解條例第27條第1項）；依第13條，兩造不在同一鄉鎮市時，民事事件由他造（乙）住所地基隆、刑事事件由他造住居所地或犯罪地板橋之調解委員會調解，故選(A)。","b":[{"k":"law","l":"鄉鎮市調解條例","r":"鄉鎮市調解條例第27條第1項","m":"調解經法院核定後，當事人就同一事件不得再行起訴、告訴或自訴。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=I0020003"},{"k":"law","l":"鄉鎮市調解條例","r":"鄉鎮市調解條例第13條","m":"兩造住同一鄉鎮市者由該地調解；不同者，民事由他造住所、居所、營業所或事務所所在地，刑事由他造住居所或犯罪地的調解委員會調解；兩造及受理委員會同意者亦可。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=I0020003"}]}},{"id":"06-02-007","c":"06","t":"06-02","n":"07","q":"調解委員是由哪些人組合擔任的且可以作成判決嗎?","o":["調解委員是由檢察官來擔任，但調解委員並不是法官，不能作成判決","調解委員是由當地具有法律或其他專業知識及具備信用與聲望的公正人士來擔任，調解委員立場卓越超然，當然可以作成判決","調解委員是由各地法官來擔任，調解委員是法官，故可以作成判決","調解委員是由當地具有法律或其他專業知識及具備信用與聲望的公正人士來擔任，調解委員並不是法官，不能作成判決"],"a":"D","ty":"gen","e":{"s":"ok","x":"鄉鎮市調解條例第3條第1項：調解委員由鄉鎮市長遴選當地具法律或其他專業知識、信望良好之公正人士聘任，並非法官；調解成立後須送法院審核，經核定始與確定判決同一效力（第26條、第27條），調解委員不能作成判決，故選(D)。","b":[{"k":"law","l":"鄉鎮市調解條例","r":"鄉鎮市調解條例第3條第1項","m":"調解委員由鄉鎮市長遴選當地具法律或其他專業知識、信望良好的公正人士，經地方法院及地檢署審查後聘任，任期4年。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=I0020003"},{"k":"law","l":"鄉鎮市調解條例","r":"鄉鎮市調解條例第26條第1項","m":"公所應在調解成立後10日內，將調解書及卷證送請管轄法院審核。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=I0020003"},{"k":"law","l":"鄉鎮市調解條例","r":"鄉鎮市調解條例第27條第2項","m":"經法院核定的民事調解與民事確定判決效力相同；核定的刑事調解以給付金錢、代替物或有價證券為標的者，調解書得為執行名義。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=I0020003"}]}},{"id":"06-02-008","c":"06","t":"06-02","n":"08","q":"「調解」、「和解」與「調處」為訴訟以外解決紛爭的機制，若一方未出席，哪一種可依專業或法令規定做成決議?","o":["調解與調處","調處","調解","和解與調處"],"a":"B","ty":"gen","e":{"s":"ok","x":"調處辦法第19條第1項：一造經二次通知仍不到場時，調處委員會應依現有資料及到場當事人陳述作成調處結果；鄉鎮市調解則於當事人不到場時視為調解不成立（鄉鎮市調解條例第20條），和解亦須雙方合意（民法第736條），故選(B)。","b":[{"k":"law","l":"直轄市縣（市）不動產糾紛調處委員會設置及調處辦法","r":"調處辦法第19條第1項","m":"當事人試行協議不成，或一造經二次通知仍不到場時，委員會應依現有資料及到場當事人陳述作成調處結果。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0000077"},{"k":"law","l":"鄉鎮市調解條例","r":"鄉鎮市調解條例第20條","m":"當事人無正當理由於調解期日不到場，視為調解不成立；但委員會認為仍有成立希望者，可另定期日。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=I0020003"},{"k":"law","l":"民法","r":"民法第736條","m":"和解是當事人約定互相讓步，以終止或防止爭執的契約。","u":"https://mojlaw.moj.gov.tw/LawContent.aspx?LSID=FL001351&lawNumber=736&TypeSort=3"}]}},{"id":"06-02-009","c":"06","t":"06-02","n":"09","q":"下列何項單位可以進行調解?(甲)商業仲裁委員(乙)法院(丙)當地鄉鎮市區公所(丁)屬消費爭議者，可至直轄市或縣（市）消費爭議調解委員會","o":["甲丙","甲乙丙","乙丙丁","甲丁"],"a":"C","ty":"gen","e":{"s":"ok","x":"法院得依民事訴訟法第403條進行強制調解或受理起訴前之調解聲請（乙）；鄉鎮市區公所設調解委員會（丙，鄉鎮市調解條例第1條、第35條）；消費爭議得向直轄市或縣（市）消費爭議調解委員會申請調解（丁，消保法第44條）。（甲）仲裁機構依仲裁法辦理的是「仲裁」：須先有書面仲裁協議（仲裁法第1條第1項），仲裁判斷與法院確定判決有同一效力（第37條第1項），屬裁決而非調解，故題庫將甲排除，故選(C)。","b":[{"k":"law","l":"司法院全球資訊網－業務綜覽－民事－民事調解","r":"司法院民事調解說明","m":"民事訴訟法第403條所列事件須先經法院調解，當事人也可在起訴前向法院聲請調解，由法官或司法事務官指定調解委員主持。","u":"https://www.judicial.gov.tw/tw/cp-1448-56928-185b3-1.html"},{"k":"law","l":"鄉鎮市調解條例","r":"鄉鎮市調解條例第1條","m":"鄉、鎮、市公所應設調解委員會，辦理民事事件及告訴乃論刑事事件的調解。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=I0020003"},{"k":"law","l":"鄉鎮市調解條例","r":"鄉鎮市調解條例第35條第2項","m":"本條例於直轄市及市之區調解委員會準用之。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=I0020003"},{"k":"law","l":"消費者保護法","r":"消保法第44條","m":"依第43條申訴後仍未獲妥適處理，消費者可向直轄市或縣（市）的消費爭議調解委員會聲請調解。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=J0170001"},{"k":"law","l":"仲裁法","r":"第1條第1項","q":"有關現在或將來之爭議，當事人得訂立仲裁協議，約定由仲裁人一人或單數之數人成立仲裁庭仲裁之。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=I0020001"},{"k":"law","l":"仲裁法","r":"第37條第1項","q":"仲裁人之判斷，於當事人間，與法院之確定判決，有同一效力。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=I0020001"},{"k":"law","l":"仲裁法","r":"第45條第1項","q":"未依本法訂立仲裁協議者，仲裁機構得依當事人之聲請，經他方同意後，由雙方選定仲裁人進行調解。調解成立者，由仲裁人作成調解書。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=I0020001"}],"nt":"爭議提醒：仲裁法第45條規定，未訂仲裁協議時，仲裁機構經雙方同意也可由仲裁人進行調解，故嚴格而言甲並非完全不能調解；本題依題庫答案作答，記法為「仲裁＝裁決，不是調解」。"}},{"id":"06-02-010","c":"06","t":"06-02","n":"10","q":"租賃住宅包租業者與次承租人因服務不佳，未處理好出租事項而發生糾紛爭議，關於爭議的解決方式下列敘述何者正確?","o":["委管業者可向直轄市、縣(市)政府勞工局申請調處","包租業得向直轄市、縣(市)政府消費者服務中心申訴","次承租人得向直轄市、縣(市)政府主管機關或全聯會申請調處","承租人可向直轄市、縣(市)政府勞工局申請調處"],"a":"C","ty":"gen","e":{"s":"ok","x":"包租業轉租住宅予次承租人，雙方為住宅租賃之出租人與承租人，得依租賃條例第16條向直轄市、縣（市）政府申請調處；受業者損害之被害人亦得依第31條第3項向全聯會請求代為賠償並由其基金管理委員會調處，故選(C)。","b":[{"k":"law","l":"租賃住宅市場發展及管理條例","r":"條例第16條","m":"出租人或承租人因住宅租賃發生爭議時，可向直轄市、縣（市）政府申請調處，且不必繳納調處費用。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060125"},{"k":"law","l":"租賃住宅市場發展及管理條例","r":"條例第31條第3項","m":"被害人向全國聯合會請求代為賠償時，由全聯會所設的基金管理委員會立即調處。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060125"}],"nt":"包租業對次承租人居於轉租出租人地位，係依題意涵攝。"}},{"id":"06-02-011","c":"06","t":"06-02","n":"11","q":"房客乙在台北市萬華區承租房屋，租約到期返還後，房東甲遲遲不退還押金，乙至萬華區公所申請調解，調解成立後甲應於10日內返還押金給乙。但1個月過去，甲仍未返還，乙該如何處理?","o":["甲仍未給付，乙只能重新提出返還押金之訴訟","乙可依調解成立後的法院核定函，直接找房東甲家中強制執行甲的財產","乙可依調解成立後的法院核定函，重新提出返還押金之訴訟","乙可依經法院核定之調解書，至法院聲請強制執行，無須再重新訴訟"],"a":"D","ty":"case","e":{"s":"ok","x":"鄉鎮市調解條例第27條：調解經法院核定後，當事人就該事件不得再行起訴，且經法院核定之民事調解與民事確定判決有同一之效力；此核定之調解書屬強制執行法第4條第1項第6款「其他依法律之規定，得為強制執行名義者」，乙得持經法院核定之調解書向法院聲請強制執行，無須另行起訴。(B)不得自行至房東家中執行，(C)不得就同一事件再行起訴，且「核定函」僅為通知核定之公文，執行名義是經法院核定（法官簽名並蓋法院印信）之調解書，故選(D)。","b":[{"k":"law","l":"鄉鎮市調解條例","r":"鄉鎮市調解條例第27條第2項","m":"經法院核定的民事調解與民事確定判決效力相同；核定的刑事調解以給付金錢、代替物或有價證券為標的者，調解書得為執行名義。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=I0020003"},{"k":"law","l":"鄉鎮市調解條例","r":"第26條","m":"調解成立後10日內，公所將調解書及卷證送法院審核；法院核定時由法官簽名並蓋法院印信，發還公所送達當事人。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=I0020003"},{"k":"law","l":"強制執行法","r":"第4條第1項第6款","q":"六、其他依法律之規定，得為強制執行名義者。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=B0010004"}],"nt":"強制執行法依據原寫第1款（確定判決），2026-10-24 更正為第6款。"}},{"id":"06-02-012","c":"06","t":"06-02","n":"12","q":"戶籍基隆的房客甲於106年4月1日對房東乙因修繕不履行，造成甲之物品毀損爭議，至租屋處土城區公所申請調解，當日達成和解且法院核定確定，雙方同意賠償金額一萬元。106年5月1日乙深感不服賠償金額，再次至土城區公所再提調解，土城區公所的處理方式為何?","o":["仍可受理，再開一次調解會議","因土城區已經受理過，要去基隆申請就可以受理","已隔一個月，土城區可受理","調解成立，且法院核定，不得再以同事件申請"],"a":"D","ty":"case","e":{"s":"ok","x":"鄉鎮市調解條例第27條：調解經法院核定後，當事人就該事件不得再行起訴、告訴或自訴，且其民事調解與確定判決有同一效力，乙不得就同一事件再行爭執，故選(D)。","b":[{"k":"law","l":"鄉鎮市調解條例","r":"鄉鎮市調解條例第27條第1項","m":"調解經法院核定後，當事人就同一事件不得再行起訴、告訴或自訴。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=I0020003"},{"k":"law","l":"鄉鎮市調解條例","r":"鄉鎮市調解條例第27條第2項","m":"經法院核定的民事調解與民事確定判決效力相同；核定的刑事調解以給付金錢、代替物或有價證券為標的者，調解書得為執行名義。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=I0020003"}]}},{"id":"06-02-013","c":"06","t":"06-02","n":"13","q":"甲君於萬華區承租房屋，因工作不順欠繳租金5個月，房東乙君履催未果，只好至萬華區公所申請調解，甲君心生理虧，不敢出席。請問調解會議應如何處理?","o":["調解委員開立不成立證明，乙君僅能至法院另提返還房屋及給付租金訴訟","乙君可依調解不成立證明送法院核定，直接至甲君家中強制執行財產","乙君可依調解不成立後的法院核定函，重新提出返還房屋之訴訟","乙君可依調解成立後的法院核定函，至法院請強制執行，無須再重新訴訟"],"a":"A","ty":"case","e":{"s":"ok","x":"鄉鎮市調解條例第20條：當事人無正當理由於調解期日不到場，視為調解不成立；調解不成立時當事人可請求發給調解不成立證明書（第30條第1項），乙仍須另向法院起訴請求返還房屋及給付租金，故選(A)。","b":[{"k":"law","l":"鄉鎮市調解條例","r":"鄉鎮市調解條例第20條","m":"當事人無正當理由於調解期日不到場，視為調解不成立；但委員會認為仍有成立希望者，可另定期日。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=I0020003"},{"k":"law","l":"鄉鎮市調解條例","r":"鄉鎮市調解條例第30條第1項","m":"調解不成立時，當事人可請調解委員會發給調解不成立證明書。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=I0020003"}]}},{"id":"06-02-014","c":"06","t":"06-02","n":"14","q":"若不服消保官依職權提出的消費爭議調解方案，應於幾天內提出異議?","o":["10天","7天","15天","30天"],"a":"A","ty":"num","e":{"s":"ok","x":"消保法第45條之3：當事人對調解委員依職權提出之解決方案，得於送達後10日之不變期間內提出異議，故選(A)。","b":[{"k":"law","l":"消費者保護法","r":"消保法第45條之3","m":"當事人對依職權提出的方案，可於送達後10日不變期間內異議；有異議視為調解不成立，逾期未異議則視為依該方案成立調解。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=J0170001"},{"k":"law","l":"消費者保護法","r":"消保法第45條之2第1項","m":"當事人無法合意但已相當接近時，調解委員可衡酌一切情形、平衡雙方利益，在不違反雙方主要意思下依職權提出解決方案並送達。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=J0170001"},{"k":"law","l":"消費者保護法","r":"消保法第45條第2項","m":"調解委員由政府代表、消保官、消保團體代表、企業經營者所屬或相關職業團體代表及學者專家組成，並由消費者保護官擔任主席。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=J0170001"}],"nt":"依第45條之2，方案由調解委員依職權提出（委員會主席為消保官），題目稱「消保官依職權提出」。"}},{"id":"06-02-015","c":"06","t":"06-02","n":"15","q":"消費者與企業經營者因租屋問題發生消費爭議，申請調解時其受理及程序進行等事項，由下列何者定之?","o":["消費爭議調解委員會","消費保護團體","公平交易委員會","行政院"],"a":"D","ty":"gen","e":{"s":"ok","x":"消保法第44條之1：消費爭議調解事件之受理、程序進行及其他相關事項之辦法，由行政院定之，故選(D)。","b":[{"k":"law","l":"消費者保護法","r":"消保法第44條之1","m":"消費爭議調解事件的受理、程序進行等事項之辦法，由行政院訂定。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=J0170001"}]}},{"id":"06-02-016","c":"06","t":"06-02","n":"16","q":"因房屋租賃發生民事履約爭議，而調解破局時，接下來得如何處理?","o":["報警處理","監察機關","立法機關","法院聲請訴訟"],"a":"D","ty":"gen","e":{"s":"ok","x":"鄉鎮市調解條例第30條第1項：調解不成立時當事人得請求發給調解不成立證明書，爭議仍未解決者須循司法途徑向法院起訴；土地法第101條亦規定房屋租用爭議不服調處者向司法機關訴請處理，故選(D)。","b":[{"k":"law","l":"鄉鎮市調解條例","r":"鄉鎮市調解條例第30條第1項","m":"調解不成立時，當事人可請調解委員會發給調解不成立證明書。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=I0020003"},{"k":"law","l":"土地法","r":"土地法第101條","m":"房屋租用爭議可由該管直轄市或縣（市）地政機關調處，不服調處者可向司法機關訴請處理。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060001"}],"nt":"「調解不成立後向法院起訴」未查得直接明文，以調解不成立證明書及土地法第101條之司法救濟說明。"}},{"id":"06-02-017","c":"06","t":"06-02","n":"17","q":"定型化契約條款如有疑義時，應如何處理?","o":["應為有利於企業經營者之解釋","應為有利於消費者之解釋","應由當事人雙方自行協議","應提起消費者爭議調解"],"a":"B","ty":"gen","e":{"s":"ok","x":"消保法第11條第2項：定型化契約條款如有疑義，應作有利於消費者之解釋，故選(B)。","b":[{"k":"law","l":"消費者保護法","r":"消保法第11條第2項","m":"定型化契約條款文義有疑義時，解釋上應偏向對消費者有利。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=J0170001"}]}},{"id":"06-02-018","c":"06","t":"06-02","n":"18","q":"依鄉鎮市調解條例規定調解成立後，作成調解書並於10日內，將調解書送請法院審核，在經法院核定後，其調解具有下列的效力?","o":["民事部分，可以再行起訴","經法院核定之「民」事調解，與民事確定判決有同一之效力，所以可以作為執行名義，如債務人不履行時，可以聲請強制執行","經法院核定之「刑」事調解，如果是給付金錢或有價證券時，該調解書具有執行名義，如債務人不履行時，不可以聲請強制執行","刑事部分，就可以再行告訴或自訴"],"a":"B","ty":"gen","e":{"s":"ok","x":"鄉鎮市調解條例第26條第1項：公所應於調解成立後10日內將調解書送法院審核；第27條第2項：經法院核定之民事調解與民事確定判決有同一效力，可作為執行名義聲請強制執行，故選(B)。","b":[{"k":"law","l":"鄉鎮市調解條例","r":"鄉鎮市調解條例第26條第1項","m":"公所應在調解成立後10日內，將調解書及卷證送請管轄法院審核。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=I0020003"},{"k":"law","l":"鄉鎮市調解條例","r":"鄉鎮市調解條例第27條第2項","m":"經法院核定的民事調解與民事確定判決效力相同；核定的刑事調解以給付金錢、代替物或有價證券為標的者，調解書得為執行名義。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=I0020003"},{"k":"law","l":"強制執行法","r":"第4條第1項第6款","q":"六、其他依法律之規定，得為強制執行名義者。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=B0010004"}],"nt":"核定調解書之執行名義依據為強制執行法第4條第1項第6款（原誤列第1款，2026-10-24 更正）。"}},{"id":"06-02-019","c":"06","t":"06-02","n":"19","q":"依消費者保護法之規定，下列關於租屋定型化契約之敘述，何者正確?","o":["簽訂租屋定型化契約，應有3日以上審閱期","主管機關所公告的定型化契約範本，具備法律強制拘束力","企業經營者於定型化契約中約定免除或限制賠償責任","違反中央主管機關所公告之定型化約不得記載事項，其定型化契約全部無效"],"a":"A","ty":"gen","ns":1,"e":{"s":"ok","x":"內政部公告之住宅租賃定型化契約應記載事項第1點規定契約審閱期間至少3日，(A)正確；違反公告之應記載或不得記載事項者，僅該條款無效，其餘部分依消保法第16條認定仍可有效，(D)錯，故選(A)。","b":[{"k":"law","l":"住宅租賃定型化契約應記載及不得記載事項（內政部）","r":"住宅租賃定型化契約應記載事項第1點","m":"出租人應載明承租人攜回審閱契約的日期，審閱期間至少3日。","u":"https://www.ey.gov.tw/File/43BC094940995CFC?A=C"},{"k":"law","l":"消費者保護法","r":"消保法第17條第4項","m":"違反所公告應記載或不得記載事項的定型化契約，該條款無效，其餘部分效力依第16條判斷。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=J0170001"},{"k":"law","l":"消費者保護法","r":"消保法第16條","m":"條款部分無效或不構成契約內容時，除去該部分契約仍可成立者，其餘部分仍然有效；但對一方顯失公平者，整份契約無效。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=J0170001"}]}},{"id":"06-02-020","c":"06","t":"06-02","n":"20","q":"民事訴訟法所定調解，當事人雙方達成協議調解成立，調解筆錄送法院核定，其效力為何?","o":["一般民法的和解效力","未達成協議也會等同確定判決","不能聲請強制執行，還是得重新提告","等同法院確定判決"],"a":"D","ty":"gen","e":{"s":"ok","x":"依司法院民事調解說明，法院調解經雙方合意成立者，與法院確定判決有同一效力並具執行力（民事訴訟法第416條第1項準用和解效力，第380條第1項和解與確定判決同一效力），故選(D)。","b":[{"k":"law","l":"司法院全球資訊網－業務綜覽－民事－民事調解","r":"司法院民事調解說明","m":"法院調解原則上經雙方合意成立（財產權爭議另有法官依職權提方案、未異議即視為成立之例外）；調解成立者與法院確定判決同效力，有執行力，不得就同一爭議再起訴。","u":"https://www.judicial.gov.tw/tw/cp-1448-56928-185b3-1.html"},{"k":"law","l":"法律百科（Legispedia）問答：鄉鎮市委員會的調解如果審核不通過，就完全沒有法律效力了嗎？","r":"法律百科（說明民事訴訟法第416條第1項、第380條第1項）","m":"法院調解經合意成立者與訴訟上和解同效力，而和解成立者與確定判決同效力，故可持調解筆錄聲請強制執行；未經核定的私下和解僅有契約效力。","u":"https://www.legis-pedia.com/QA/653/download"}],"nt":"民事訴訟法第380條、第416條原文頁面無法取得，以司法院說明及法律百科（非官方）說明其要旨；題幹「送法院核定」用語屬鄉鎮市調解程序。"}},{"id":"06-02-021","c":"06","t":"06-02","n":"21","q":"下列何者具有法律的強制執行力?(甲)訴訟外和解(乙)調解委員會的調解書經法院核定後(丙)法庭上和解(丁)法院的確定判決(戊)私下和解","o":["乙丁戊","乙丙戊","乙丙丁","甲丁戊"],"a":"C","ty":"gen","e":{"s":"ok","x":"經法院核定之鄉鎮市調解與民事確定判決同一效力（鄉鎮市調解條例第27條第2項），屬強制執行法第4條第1項第6款之執行名義（乙）；依民事訴訟法成立之和解為同條項第3款執行名義（丙）；確定終局判決為同條項第1款執行名義（丁）；私下或訴訟外和解僅具契約效力（甲、戊），故乙丙丁具強制執行力，故選(C)。","b":[{"k":"law","l":"鄉鎮市調解條例","r":"鄉鎮市調解條例第27條第2項","m":"經法院核定的民事調解與民事確定判決效力相同；核定的刑事調解以給付金錢、代替物或有價證券為標的者，調解書得為執行名義。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=I0020003"},{"k":"law","l":"強制執行法","r":"強制執行法第4條第1項第1款","m":"已確定的終局判決為執行名義。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=B0010004"},{"k":"law","l":"強制執行法","r":"強制執行法第4條第1項第3款","m":"依民事訴訟法成立的和解或調解為執行名義。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=B0010004"},{"k":"law","l":"民法","r":"民法第737條","m":"和解使當事人拋棄的權利消滅，並使其取得和解契約所訂明的權利。","u":"https://mojlaw.moj.gov.tw/LawContent.aspx?LSID=FL001351&lawNumber=736&TypeSort=3"},{"k":"law","l":"法律百科（Legispedia）問答：鄉鎮市委員會的調解如果審核不通過，就完全沒有法律效力了嗎？","r":"法律百科（說明民事訴訟法第416條第1項、第380條第1項）","m":"法院調解經合意成立者與訴訟上和解同效力，而和解成立者與確定判決同效力，故可持調解筆錄聲請強制執行；未經核定的私下和解僅有契約效力。","u":"https://www.legis-pedia.com/QA/653/download"},{"k":"law","l":"強制執行法","r":"第4條第1項第6款","q":"六、其他依法律之規定，得為強制執行名義者。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=B0010004"}],"nt":"2026-10-24 補充：乙（核定調解書）之執行名義依據為第6款。"}},{"id":"06-03-001","c":"06","t":"06-03","n":"01","q":"租賃關係管理文件之保管方式中，下列對於文件檔案應如何處理之敘述何者較為妥適？","o":["應分類裝訂成冊","不分類裝訂成冊","不分類方便使用","不分類集中保管"],"a":"A","ty":"gen","e":{"s":"ok","x":"內政部公寓大廈規約範本附件六「公寓大廈文件之保管及閱覽管理規定」：「文件檔案應分類定期裝訂成冊」，並應列清冊、於檔案櫃架設置簡明標示以利檢索查驗；簡報（倫理規範）頁140亦將檔案保存、管理、移交及備查列為行政事務之「文件整備」，故選(A)。","b":[{"k":"law","l":"公寓大廈規約範本（內政部）","r":"附件六「公寓大廈文件之保管及閱覽管理規定」壹、五(二)","q":"文件檔案應分類定期裝訂成冊。","u":"https://www.nlma.gov.tw/uploads/files/64c9e005c5c80aef8f123b5944268e14.pdf"},{"k":"law","l":"公寓大廈規約範本（內政部）","r":"附件六「公寓大廈文件之保管及閱覽管理規定」壹、五(四)","q":"文件檔案應列清冊，以便檢索查閱，並應指定保管人，保管人異動時列入移交。","u":"https://www.nlma.gov.tw/uploads/files/64c9e005c5c80aef8f123b5944268e14.pdf"},{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－租賃住宅相關法規與實務（法5-1～法5-5）","r":"頁碼140（PDF第141頁）","q":"文件整備：如檔案保存、管理、移交及備查，向政府報備之文件。"}]}},{"id":"06-03-002","c":"06","t":"06-03","n":"02","q":"在租賃關係管理中，對於汽機車車輛進出大樓地下室停車場，應做何管制措施較佳？","o":["採取自由停放","以不影響其他車輛進出為原則","造冊登錄列管以利管制","視狀況而定"],"a":"C","ty":"gen","e":{"s":"ok","x":"內政部公寓大廈規約範本附件二「停車空間使用契約書」約定使用人應「事先向甲方登記使用該停車空間之車輛所有者、車輛號碼及車種等」，附件六並將「車位使用人名冊」（姓名、車籍、車位編號等）列為應保管並隨異動更新之名冊，可見停車場車輛應造冊登錄列管，故選(C)。","b":[{"k":"law","l":"公寓大廈規約範本（內政部）","r":"附件二「停車空間使用契約書」乙方應遵守事項","q":"事先向甲方登記使用該停車空間之車輛所有者、車輛號碼及車種等。","u":"https://www.nlma.gov.tw/uploads/files/64c9e005c5c80aef8f123b5944268e14.pdf"},{"k":"law","l":"公寓大廈規約範本（內政部）","r":"附件六「公寓大廈文件之保管及閱覽管理規定」壹、四 保管文件類別表 02名冊類第3項","m":"「車位使用人名冊」，檔案內容為姓名、車籍、車位編號、區分所有權單位、地址、電話，清理處置為異動更新。","u":"https://www.nlma.gov.tw/uploads/files/64c9e005c5c80aef8f123b5944268e14.pdf"}]}},{"id":"06-03-003","c":"06","t":"06-03","n":"03","q":"在租賃關係管理中，對於住戶之反應意見，需如何處置較佳？","o":["填寫意見反應單並彙整呈報處理","無填寫意見單者，不予理會","住戶只說說罷了","來電附帶提起"],"a":"A","ty":"gen","e":{"s":"ok","x":"簡報（倫理規範，公寓大廈行政管理實務）頁140：行政事務功能包括「意思表達：如住戶意見箱/表…」；頁142：應用表單將作業流程中各項處理內容作成紀錄，以提供追控、考核、分析及存查；頁141並要求處理相關事務應留下書面紀錄與報告。故住戶意見宜填寫意見反應單並彙整呈報處理，故選(A)。","b":[{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－租賃住宅相關法規與實務（法5-1～法5-5）","r":"頁碼140（PDF第141頁）","q":"意思表達：如住戶意見箱/表、滿意度調查、住戶訴願等。"},{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－租賃住宅相關法規與實務（法5-1～法5-5）","r":"頁碼142（PDF第143頁）","q":"利用表單或電腦Ｅ化(LINE群)，將作業流程中的各項處理內容作成紀錄，以提供追控、考核、分析及存查。"},{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－租賃住宅相關法規與實務（法5-1～法5-5）","r":"頁碼141（PDF第142頁）","q":"受任執行管理維護業務，處理相關事務應留下書面紀錄與報告，建議事項應以書面為之。"}]}},{"id":"06-03-004","c":"06","t":"06-03","n":"04","q":"對於5樓以上公寓大廈且已使用15年以上，所附屬昇降(電梯)設備安全檢查頻率敘述，下列何者是正確的?","o":["每半年1次","每年1次","每年2次","每年3次"],"a":"A","ty":"num","e":{"s":"ok","x":"建築物昇降設備設置及檢查管理辦法第5條第1項：除昇降送貨機、供個人住宅使用及供五層以下公寓大廈使用之昇降機另定頻率外，其他昇降設備安全檢查每年一次，建築物經竣工檢查合格屆滿十五年者每半年一次；題示公寓大廈電梯已使用15年以上，故選(A)。","b":[{"k":"law","l":"建築物昇降設備設置及檢查管理辦法","r":"第5條第1項","m":"安全檢查頻率：昇降送貨機每三年一次；供個人住宅使用之昇降機每三年一次，竣工檢查合格屆滿十五年者每年一次；供五層以下公寓大廈使用之昇降機每二年一次，屆滿十五年者每年一次；其他昇降設備每年一次，建築物竣工檢查合格屆滿十五年者每半年一次。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070147"}],"nt":"題目「5樓以上」若恰為五層，依同項屬「供五層以下公寓大廈使用之昇降機」（屆滿十五年每年一次）；題意應指六層以上（非五層以下）之公寓大廈。舊版（93年）第5條為一律每年一次，已修正。"}},{"id":"06-03-005","c":"06","t":"06-03","n":"05","q":"社區大廈污水管的顏色是何種顏色？","o":["橘紅色","藍色","綠色","白色"],"a":"A","ty":"gen","e":{"s":"ok","x":"下水道用戶排水設備標準第32條：「污水管渠管材為塑化類管者，應為橘紅色，其他管材應有橘紅色之顯著標示」，故選(A)。","b":[{"k":"law","l":"下水道用戶排水設備標準","r":"第32條","q":"污水管渠管材為塑化類管者，應為橘紅色，其他管材應有橘紅色之顯著標示。管材接合應為水密性之構造，接頭數應減至最少。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?media=print&pcode=D0070066"}]}},{"id":"06-03-006","c":"06","t":"06-03","n":"06","q":"對於高樓層住戶，為減少給水管路壓力，下列何種裝置為最佳選擇?","o":["閘閥","減壓閥","逆止閥","陽極鎖"],"a":"B","ty":"gen","e":{"s":"ok","x":"建築物給水排水設備設計技術規範第3.4.6點：建築物一般給水壓力超過3.5kg/cm2之限度時，「應設置中間水槽或減壓閥等，以調整給水壓力」；簡報（建3-1）頁5設備一覽表亦列減壓閥設於水壓超過3.5kg之當層管道或往上三個樓層，故選(B)。","b":[{"k":"law","l":"建築物給水排水設備設計技術規範（內政部）","r":"第3.4.6點","q":"建築物一般給水壓力，超過3.5kg/cm2之限度時，應設置中間水槽或減壓閥等，以調整給水壓力。","u":"https://www.nlma.gov.tw/uploads/files/7b5f02739dad0e121f246b4dc1b6006a.pdf"},{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－建物與室內裝修管理實務（建3-1～建3-3）","r":"頁碼5（PDF第6頁）","q":"水壓超過3.5kg，當層"}],"nt":"簡報頁5表格「減壓閥」列之常見位置欄為「水壓超過3.5kg，當層管道或往上三個樓層」。"}},{"id":"06-04-001","c":"06","t":"06-04","n":"01","q":"承租戶若負擔家計者入獄服刑，請問租賃住宅管理人員採取下列何種措施較為妥適？","o":["終止契約避免後續無法收取租金","建立關懷名冊必要時協請社會局介入","公告周知請大家小心","通知警方"],"a":"B","ty":"gen","e":{"s":"ok","x":"簡報（實2-2租戶關懷）頁68：對弱勢族群房客，業者可協助申請租金補貼並「轉介社福機構協助」；簡報（倫理規範）頁85包租代管請款須附「關懷訪視情形表」「轉介急難救助情形表」，可見家計負擔者入獄致陷困境之租戶，宜建立關懷名冊、必要時轉介社政單位。另依簡報頁21，須欠租兩期以上並經定期催告始得終止租約，不得逕行終止，故選(B)。","b":[{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－租賃管理與糾紛實務（實2-1～實2-2）","r":"頁碼68（PDF第69頁）","q":"轉介社福機構協助。"},{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－租賃住宅相關法規與實務（法5-1～法5-5）","r":"頁碼85（PDF第86頁）","q":"關懷訪視情形表(附件六之一)、轉介急難救助情形表(附件六之二)"},{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－租賃管理與糾紛實務（實2-1～實2-2）","r":"頁碼21（PDF第22頁）","q":"租賃住宅市場發展及管理條例第10條規定，房客要欠租兩期以上，並經房東定期催告，房東才能終止租約"}]}},{"id":"06-04-002","c":"06","t":"06-04","n":"02","q":"下列租賃住宅管理人員的管理手法，疑有租屋歧視之虞？","o":["提高有精神障礙成員承租戶押金","通報社會局介入承租戶家暴行為","以承租戶於其租賃住宅從事吸毒行為為由終止契約","高風險承租戶列冊管理"],"a":"A","ty":"gen","e":{"s":"ok","x":"身心障礙者權益保障法第16條第1項：身心障礙者之居住等權益「不得有歧視之對待」（同法第5條之身心障礙含精神、心智功能損傷者）。僅因承租戶有精神障礙成員即提高押金，屬以障礙身分給予不利之差別待遇，有租屋歧視之虞；通報社會局、列冊管理則屬簡報（實2-2）頁68所稱轉介社福機構協助之關懷措施，故選(A)。","b":[{"k":"law","l":"身心障礙者權益保障法","r":"第16條第1項","q":"身心障礙者之人格及合法權益，應受尊重及保障，對其接受教育、應考、進用、就業、居住、遷徙、醫療等權益，不得有歧視之對待。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?PCode=D0050046"},{"k":"law","l":"身心障礙者權益保障法","r":"第5條第1款","m":"神經系統構造及精神、心智功能損傷或不全，經鑑定並領有身心障礙證明者，屬本法所稱身心障礙者。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?PCode=D0050046"},{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－租賃管理與糾紛實務（實2-1～實2-2）","r":"頁碼68（PDF第69頁）","q":"轉介相關社福機構進行輔導協助。"}]}},{"id":"06-04-003","c":"06","t":"06-04","n":"03","q":"下列何者行為，租賃住宅管理人員不需要提高警覺或會同警方查訪租屋處？","o":["獨居老人多日未出家門","學齡兒童長時間未上學","年輕夫妻餐飲皆叫外送","承租戶爆發激烈爭吵後數週未出入"],"a":"C","ty":"neg","e":{"s":"ok","x":"簡報（實2-2租戶關懷）頁69提醒對獨居老年租戶應留緊急聯絡人並以監測等方式「避免孤獨死的悲劇發生」，頁68指出心理疾病及情感糾紛易致承租標的成為凶宅；兒童及少年福利與權益保障法第54條第1項並規定公寓大廈管理服務人員等知悉兒少有未獲適當照顧之虞者應通報主管機關。故(A)(B)(D)均需提高警覺，年輕夫妻餐飲皆叫外送屬一般生活型態，故選(C)。","b":[{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－租賃管理與糾紛實務（實2-1～實2-2）","r":"頁碼69（PDF第70頁）","q":"避免孤獨死的悲劇發生。"},{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－租賃管理與糾紛實務（實2-1～實2-2）","r":"頁碼68（PDF第69頁）","q":"租屋市場上，有許多因心理疾病及情感糾紛造成承租標的成為凶宅之社會案件"},{"k":"law","l":"兒童及少年福利與權益保障法","r":"第54條第1項","m":"醫事、社工、教育、警察人員、村（里）長、公寓大廈管理服務人員等，於執行業務時知悉兒童及少年家庭遭遇經濟、教養、婚姻、醫療或其他不利處境，致兒童及少年有未獲適當照顧之虞，應通報直轄市、縣（市）主管機關。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?PCode=D0050001"}]}},{"id":"06-05-001","c":"06","t":"06-05","n":"01","q":"颱風來臨前，住戶飲用水管理的注意事項，下列何者做法較佳?","o":["委託清洗業清洗消毒水池和水塔","於蓄水池投入消毒劑","公告提醒住戶儲水，並先將水塔手動補滿水","將蓄水池抽乾"],"a":"C","ty":"gen","e":{"s":"ok","x":"內政部消防署防颱宣導列颱風來襲前應「儲水備用，以防斷電停水」，台灣自來水公司亦呼籲「請務必提早儲水防颱」；故颱風前宜公告提醒住戶儲水並先將水塔補滿，其餘清洗消毒或抽乾水池均非颱風前之儲水準備，故選(C)。","b":[{"k":"web","l":"內政部消防署兒童版－消防小百科－防災宣導－颱風篇","r":"","q":"儲水備用，以防斷電停水。","u":"https://www.nfa.gov.tw/kid/index.php?code=list&flag=detail&ids=659&article_id=1290"},{"k":"web","l":"台灣自來水公司新聞稿（行政院全球資訊網消費資（警）訊轉載）","r":"","q":"請務必提早儲水防颱。","u":"https://www.ey.gov.tw/Page/88F151FFCE5C741E/5a409580-8e65-46fb-8d0d-8e8982bf07f6"},{"k":"web","l":"內政部消防署防颱手冊易讀版《大風吹，做好準備就不怕》","r":"","q":"可能會停水，要先把水桶都裝滿水。","u":"https://easy2do.ncdr.nat.gov.tw/disability/static/download/%E5%85%A7%E6%94%BF%E9%83%A8%E6%B6%88%E9%98%B2%E7%BD%B2%E5%A4%A7%E9%A2%A8%E5%90%B9%E5%81%9A%E5%A5%BD%E6%BA%96%E5%82%99%E5%B0%B1%E4%B8%8D%E6%80%95.pdf"}],"nt":"官方資料未直接提及「水塔手動補滿」，但明示颱風前應儲水備用；簡報未涉防颱內容。"}},{"id":"06-05-002","c":"06","t":"06-05","n":"02","q":"颱風季節遇豪大雨時，除了防洪閘門及擋水鋁板外，最有效且能阻擋大量雨水入侵或滲入，下列何者也是較佳的材料?","o":["沙包","地毯","鐵塊","木板"],"a":"A","ty":"gen","e":{"s":"ok","x":"內政部消防署防颱新聞稿：「大樓地下室應備妥自動抽水機，並於地下室入口加設防水閘門或沙包」；消防署防颱手冊易讀版亦提醒「一樓門口可以放沙包」，故選(A)。","b":[{"k":"web","l":"內政部消防署新聞稿「平均每年4.7次颱風侵臺 遠離災害要注意這10點」","r":"","q":"大樓地下室應備妥自動抽水機，並於地下室入口加設防水閘門或沙包","u":"https://www.nfa.gov.tw/pro/index.php?code=list&flag=detail&ids=1470&article_id=6131"},{"k":"web","l":"內政部消防署防颱手冊易讀版《大風吹，做好準備就不怕》","r":"","q":"一樓門口可以放沙包","u":"https://easy2do.ncdr.nat.gov.tw/disability/static/download/%E5%85%A7%E6%94%BF%E9%83%A8%E6%B6%88%E9%98%B2%E7%BD%B2%E5%A4%A7%E9%A2%A8%E5%90%B9%E5%81%9A%E5%A5%BD%E6%BA%96%E5%82%99%E5%B0%B1%E4%B8%8D%E6%80%95.pdf"}]}},{"id":"06-05-003","c":"06","t":"06-05","n":"03","q":"關於地震防範措施，在地震發生後，為了避免造成二次災害如火災等，在安全無虞的情況下，下列何種作法較佳？","o":["以軟墊保護頭部，尋找堅固的庇護所","把門扇打開，以免門扇被震歪卡緊影響逃生","檢查水電、瓦斯等管線，如有損壊馬上關掉開關暫停使用","勿湧向安全門、出口樓梯以免造成擁擠傷害"],"a":"C","ty":"gen","e":{"s":"ok","x":"中央氣象署地震測報中心「地震防護」：地震後應「檢查家中水電瓦斯管線，如瓦斯有損請輕開門窗，立即離開並通報」，以避免火災等二次災害，即選項(C)之作法，故選(C)。","b":[{"k":"web","l":"中央氣象署地震測報中心－地震防護","r":"","q":"檢查家中水電瓦斯管線，如瓦斯有損請輕開門窗，立即離開並通報。","m":"地震前應知道瓦斯、自來水及電源安全閥如何開關；防震守則口訣含「切斷電源關瓦斯」。","u":"https://scweb.cwa.gov.tw/zh-tw/page/intro/11/"}]}},{"id":"06-05-004","c":"06","t":"06-05","n":"04","q":"下列何者是防火門的主要目的?","o":["逃生用","防小偷","裝飾用","阻隔火煙"],"a":"D","ty":"gen","e":{"s":"ok","x":"內政部建築研究所指出防火區劃「主要功能在於侷限火勢，防止火災擴大延燒」，防火門若被開啟固定，將「造成火災時無法阻隔火煙造成危害」；新北市三峽區公所消防宣導亦說明防火門可將火災產生之煙與熱阻隔於門外。故防火門主要目的為阻隔火煙，故選(D)。","b":[{"k":"web","l":"內政部建築研究所《建築研究簡訊》第90期「建築防火設備設置法規研修及性能評估檢討」","r":"","q":"進而造成火災時無法阻隔火煙造成危害。","m":"建築防火區劃主要功能在於侷限火勢、防止火災擴大延燒；常時關閉式防火門常被開啟固定，致火災時無法阻隔火煙。","u":"https://www.abri.gov.tw/PeriodicalDetail.aspx?n=861&s=1751&key=69&isShowAll=false"},{"k":"web","l":"新北市三峽區公所－防災宣導－消防常識","r":"","q":"防火門可以暫時將火災所產生的煙與熱阻隔於防火門外，以確保安全梯內成為無火、煙危害的安全空間。","u":"https://www.sanxia.ntpc.gov.tw/home.jsp?id=83a06160854808fb&act=be4f48068b2b0031&dataserno=6eb1a24fc1d91140b4c10247e4a60541"},{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－建物與室內裝修管理實務（建3-1～建3-3）","r":"頁碼55（PDF第56頁）","q":"且在裝修範圍內以一小時以上防火時效之防火牆、防火門窗區劃分隔"}]}},{"id":"06-05-005","c":"06","t":"06-05","n":"05","q":"為了防止強風吹落傷人，應於何時將社區屋外各種懸掛物、招牌、工程鷹架或棚架立即取下或釘牢，並且修剪大型樹木及樹枝?","o":["颱風來臨前","颱風時","颱風過後","平時作為"],"a":"A","ty":"gen","e":{"s":"ok","x":"內政部消防署防颱宣導將下列列為颱風來襲前之準備：「房屋外、庭院內，各種懸掛物件應即取下或加強固定 (如廣告招牌、陽台花盆)，以免被風吹落」，並「修剪樹枝，以防折損傷人或壓壞建築物、車輛」，故選(A)。","b":[{"k":"web","l":"內政部消防署兒童版－消防小百科－防災宣導－颱風篇","r":"","q":"房屋外、庭院內，各種懸掛物件應即取下或加強固定 (如廣告招牌、陽台花盆)，以免被風吹落，變成傷人利器。","m":"同頁另載：「庭園樹木均應加支架保護。並修剪樹枝，以防折損傷人或壓壞建築物、車輛。」（均列於颱風來襲前之準備）","u":"https://www.nfa.gov.tw/kid/index.php?code=list&flag=detail&ids=659&article_id=1290"},{"k":"web","l":"內政部消防署新聞稿「颱風來襲 內政部呼籲民眾做好防颱準備」","r":"","q":"加強廣告招牌、懸掛物、盆栽、門窗、屋頂水塔的固定措施","u":"https://www.nfa.gov.tw/cht/index.php?code=list&flag=detail&ids=1468&article_id=6417"}],"nt":"官方資料未逐項提及「工程鷹架或棚架」，但懸掛物、招牌取下或固定及修剪樹枝均明列於颱風來襲前。"}},{"id":"06-05-006","c":"06","t":"06-05","n":"06","q":"房屋外、庭院內各種懸掛物件，應於何時間點取下(如廣告招牌應釘牢)避免掉落傷人?","o":["颱風前","颱風時","颱風後","平時作為"],"a":"A","ty":"gen","e":{"s":"ok","x":"內政部消防署防颱宣導（颱風來襲前）：「房屋外、庭院內，各種懸掛物件應即取下或加強固定 (如廣告招牌、陽台花盆)，以免被風吹落，變成傷人利器」，故選(A)。","b":[{"k":"web","l":"內政部消防署兒童版－消防小百科－防災宣導－颱風篇","r":"","q":"房屋外、庭院內，各種懸掛物件應即取下或加強固定 (如廣告招牌、陽台花盆)，以免被風吹落，變成傷人利器。","u":"https://www.nfa.gov.tw/kid/index.php?code=list&flag=detail&ids=659&article_id=1290"}]}},{"id":"06-06-001","c":"06","t":"06-06","n":"01","q":"下列關於證據保全之敘述，何者正確?","o":["向法院聲請保全證據時，不得聲請為鑑定","保全證據之聲請，必須在起訴後，向受訴法院為之","保全證據之聲請，釋明應保全證據之理由","保全證據應由當事人聲請，法院不得依職權為之"],"a":"C","ty":"gen","e":{"s":"ok","x":"民事訴訟法第370條：保全證據之聲請應表明「應保全證據之理由」，且該理由應釋明之。(A)錯，第368條第1項亦得聲請為鑑定、勘驗或保全書證；(B)錯，第369條第1項起訴前亦得向受訊問人住居地或證物所在地之地方法院聲請；(D)錯，第372條法院得於訴訟繫屬中依職權為保全證據之裁定，故選(C)。","b":[{"k":"law","l":"民事訴訟法","r":"第370條第1項第4款、第2項","q":"前項第一款及第四款之理由，應釋明之。","m":"第1項第4款：聲請應表明「四、應保全證據之理由。」","u":"https://laws.gov.taipei/law/LawSearch/LawChapterArticle/FL001362?chapterno=36"},{"k":"law","l":"民事訴訟法","r":"第368條第1項","q":"證據有滅失或礙難使用之虞，或經他造同意者，得向法院聲請保全；就確定事、物之現狀有法律上利益並有必要時，亦得聲請為鑑定、勘驗或保全書證。","u":"https://laws.gov.taipei/law/LawSearch/LawChapterArticle/FL001362?chapterno=36"},{"k":"law","l":"民事訴訟法","r":"第369條第1項","q":"保全證據之聲請，在起訴後，向受訴法院為之；在起訴前，向受訊問人住居地或證物所在地之地方法院為之。","u":"https://laws.gov.taipei/law/LawSearch/LawChapterArticle/FL001362?chapterno=36"},{"k":"law","l":"民事訴訟法","r":"第372條","q":"法院認為必要時，得於訴訟繫屬中，依職權為保全證據之裁定。","u":"https://laws.gov.taipei/law/LawSearch/LawChapterArticle/FL001362?chapterno=36"}]}},{"id":"06-06-002","c":"06","t":"06-06","n":"02","q":"下列關於保全程序之敘述，何者正確?","o":["假處分不屬保全程序","債權人就清償借款事件，欲保全強制執行時，得聲請假處分","關於假處分之規定，原則上於定暫時狀態之處分準用之","本案尚未繫屬者，債權人絕不得聲請假扣押"],"a":"C","ty":"gen","e":{"s":"ok","x":"民事訴訟法第538條之4：「除別有規定外，關於假處分之規定，於定暫時狀態之處分準用之」。(A)錯，假處分規定於第七編保全程序（第532條）；(B)錯，清償借款屬金錢請求，依第522條第1項應聲請假扣押；(D)錯，第529條第1項明定本案尚未繫屬者亦得命假扣押（法院得依債務人聲請命債權人限期起訴），故選(C)。","b":[{"k":"law","l":"民事訴訟法","r":"第538條之4","q":"除別有規定外，關於假處分之規定，於定暫時狀態之處分準用之。","u":"https://laws.gov.taipei/law/LawSearch/LawChapterArticle/FL001362?chapterno=49"},{"k":"law","l":"民事訴訟法","r":"第522條第1項","q":"債權人就金錢請求或得易為金錢請求之請求，欲保全強制執行者，得聲請假扣押。","u":"https://laws.gov.taipei/law/LawSearch/LawChapterArticle/FL001362?chapterno=49"},{"k":"law","l":"民事訴訟法","r":"第532條第1項","q":"債權人就金錢請求以外之請求，欲保全強制執行者，得聲請假處分。","m":"第532條至第538條之4（假處分、定暫時狀態處分）均列於第七編「保全程序」。","u":"https://laws.gov.taipei/law/LawSearch/LawChapterArticle/FL001362?chapterno=49"},{"k":"law","l":"民事訴訟法","r":"第529條第1項","q":"本案尚未繫屬者，命假扣押之法院應依債務人聲請，命債權人於一定期間內起訴。","u":"https://laws.gov.taipei/law/LawSearch/LawChapterArticle/FL001362?chapterno=49"}]}},{"id":"06-06-003","c":"06","t":"06-06","n":"03","q":"就民法而言租賃標的物之失火，承租人應負下列何種責任?","o":["無過失","具體輕過失","通常事變","重大過失"],"a":"D","ty":"gen","e":{"s":"ok","x":"民法第434條（簡報倫理規範頁68）：租賃物因承租人之重大過失致失火而毀損、滅失者，承租人對出租人負損害賠償責任；簡報頁62判決亦認承租人之失火責任以有重大過失者始負賠償責任，故選(D)。","b":[{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－租賃住宅相關法規與實務（法5-1～法5-5）","r":"頁碼68（PDF第69頁）","q":"租賃物因承租人之重大過失致失火而毀損、滅失者，承租人對於出租人負損害賠償責任。"},{"k":"law","l":"民法","r":"第434條","q":"租賃物因承租人之重大過失，致失火而毀損、滅失者，承租人對於出租人負損害賠償責任。","u":"https://mojlaw.moj.gov.tw/LawContent.aspx?LSID=FL001351&lawNumber=421&TypeSort=3"},{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－租賃住宅相關法規與實務（法5-1～法5-5）","r":"頁碼62（PDF第63頁）","q":"本件承租人之失火責任，依民法第434 條規定，以承租人有重大過失者始負租賃物失火毀損之賠償責任。"}]}},{"id":"06-06-004","c":"06","t":"06-06","n":"04","q":"不動產之租賃契約期限逾1年者，應以字據訂立之。若未以字據訂立者，其租賃契約將視為?","o":["租賃契約不成立","租賃契約無效","不定期限之租賃","1年期限之租賃"],"a":"C","ty":"gen","e":{"s":"ok","x":"民法第422條（簡報倫理規範頁66）：不動產之租賃契約，其期限逾一年者，應以字據訂立之，未以字據訂立者，視為不定期限之租賃，故選(C)。","b":[{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－租賃住宅相關法規與實務（法5-1～法5-5）","r":"頁碼66（PDF第67頁）","q":"不動產之租賃契約，其期限逾一年者，應以字據訂立之，未以字據訂立者，視為不定期限之租賃。"},{"k":"law","l":"民法","r":"第422條","q":"不動產之租賃契約，其期限逾一年者，應以字據訂立之，未以字據訂立者，視為不定期限之租賃。","u":"https://mojlaw.moj.gov.tw/LawContent.aspx?LSID=FL001351&lawNumber=421&TypeSort=3"}]}},{"id":"06-06-005","c":"06","t":"06-06","n":"05","q":"債權人向法院聲請發出支付命令後，債務人應於支付命令送達後幾日之不變期間內向法院提出異議，否則法院對於債務人逾期提出之異議，即應裁定予以駁回?","o":["10日","20日","30日","5日"],"a":"B","ty":"num","e":{"s":"ok","x":"民事訴訟法第516條第1項：債務人得於支付命令送達後二十日之不變期間內提出異議；第518條：逾二十日之不變期間始提出異議者，法院應以裁定駁回之，故選(B)。","b":[{"k":"law","l":"民事訴訟法","r":"第516條第1項","q":"債務人對於支付命令之全部或一部，得於送達後二十日之不變期間內，不附理由向發命令之法院提出異議。","u":"https://laws.gov.taipei/law/LawSearch/LawChapterArticle/FL001362?chapterno=48"},{"k":"law","l":"民事訴訟法","r":"第518條","q":"債務人於支付命令送達後，逾二十日之不變期間，始提出異議者，法院應以裁定駁回之。","u":"https://laws.gov.taipei/law/LawSearch/LawChapterArticle/FL001362?chapterno=48"}]}},{"id":"06-06-006","c":"06","t":"06-06","n":"06","q":"甲與乙簽訂2年期間之不動產租賃書面契約時，須依下列何種方式始生效力?","o":["須經公證","須親筆書寫書面契約","各自得以蓋章代替簽名","雙方皆須按捺指印"],"a":"C","ty":"gen","e":{"s":"ok","x":"2年期不動產租賃依民法第422條應以字據訂立；民法第3條：依法律有使用文字之必要者，得不由本人自寫，但必須親自簽名，「如有用印章代簽名者，其蓋章與簽名生同等之效力」（以指印代簽名者須經二人簽名證明）；簡報（實2-1）頁20亦說明一般租屋契約即具法律效力，公證非生效要件。故雙方各自得以蓋章代替簽名，故選(C)。","b":[{"k":"law","l":"民法","r":"第3條","q":"依法律之規定，有使用文字之必要者，得不由本人自寫，但必須親自簽名。如有用印章代簽名者，其蓋章與簽名生同等之效力。如以指印、十字或其他符號代簽名者，在文件上，經二人簽名證明，亦與簽名生同等之效力。","u":"https://mojlaw.moj.gov.tw/LawContent.aspx?LSID=FL001351&lawNumber=1&TypeSort=2"},{"k":"law","l":"民法","r":"第422條","q":"不動產之租賃契約，其期限逾一年者，應以字據訂立之，未以字據訂立者，視為不定期限之租賃。","u":"https://mojlaw.moj.gov.tw/LawContent.aspx?LSID=FL001351&lawNumber=421&TypeSort=3"},{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－租賃管理與糾紛實務（實2-1～實2-2）","r":"頁碼20（PDF第21頁）","q":"一般的租屋契約即具法律效力"},{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－租賃管理與糾紛實務（實2-1～實2-2）","r":"頁碼21（PDF第22頁）","q":"訂約時請務必詳細審閱契約條文，由雙方簽名、蓋章或按手印"}]}},{"id":"06-06-007","c":"06","t":"06-06","n":"07","q":"出租人將土地出租予承租人興建房屋，如承租人遲付租金時，出租人於何種情形下得主張終止租賃契約？","o":["承租人積欠租金達2期之租額時","承租人積欠租金達2期之租額時，並經出租人定一定期限之催告承租人給付租金，而承租人不於期限內繳納者","承租人積欠租金達2年之租額時","承租人積欠租金達2年之租額時，並經出租人定一定期限之催告承租人給付租金，而承租人不於期限內繳納者"],"a":"D","ty":"num","e":{"s":"ok","x":"民法第440條第1項：承租人遲付租金，出租人得定相當期限催告，承租人於期限內不為支付，出租人始得終止契約；同條第3項：「租用建築房屋之基地，遲付租金之總額，達二年之租額時，適用前項之規定」。故須積欠達2年租額並經定期催告仍不繳納，故選(D)。","b":[{"k":"law","l":"民法","r":"第440條第1項、第3項","q":"租用建築房屋之基地，遲付租金之總額，達二年之租額時，適用前項之規定。","m":"第1項：承租人租金支付有遲延者，出租人得定相當期限催告承租人支付租金，如承租人於期限內不為支付，出租人得終止契約。","u":"https://mojlaw.moj.gov.tw/LawContent.aspx?LSID=FL001351&lawNumber=421&TypeSort=3"},{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－租賃住宅相關法規與實務（法5-1～法5-5）","r":"頁碼69（PDF第70頁）","q":"租用建築房屋之基地，遲付租金之總額，達二年之租額時，適用前項之規定。"}]}},{"id":"06-06-008","c":"06","t":"06-06","n":"08","q":"請問租金的請求權時效為幾年？","o":["2年","5年","10年","15年"],"a":"B","ty":"num","e":{"s":"ok","x":"民法第126條：「利息、紅利、租金、贍養費、退職金及其他一年或不及一年之定期給付債權，其各期給付請求權，因五年間不行使而消滅」，故選(B)。","b":[{"k":"law","l":"民法","r":"第126條","q":"利息、紅利、租金、贍養費、退職金及其他一年或不及一年之定期給付債權，其各期給付請求權，因五年間不行使而消滅。","u":"https://mojlaw.moj.gov.tw/LawContent.aspx?LSID=FL001351&lawNumber=125&TypeSort=2"}]}},{"id":"06-06-009","c":"06","t":"06-06","n":"09","q":"下列何種請求得透過督促程序之支付命令為之？","o":["房東請求房客返還房屋","房東請求房客因房客之侵權行為致房東之損害，請求房客支付損害賠償金額新臺幣30萬元","房客請求房東交付租賃契約正本","房客請求房東修繕房屋。"],"a":"B","ty":"gen","e":{"s":"ok","x":"民事訴訟法第508條第1項：債權人之請求，以給付金錢或其他代替物或有價證券之一定數量為標的者，得聲請法院依督促程序發支付命令。(B)請求給付損害賠償金30萬元屬給付金錢之一定數量；返還房屋、交付契約正本、修繕房屋均非此類給付，故選(B)。","b":[{"k":"law","l":"民事訴訟法","r":"第508條第1項","q":"債權人之請求，以給付金錢或其他代替物或有價證券之一定數量為標的者，得聲請法院依督促程序發支付命令。","u":"https://laws.gov.taipei/law/LawSearch/LawChapterArticle/FL001362?chapterno=48"}]}},{"id":"06-06-010","c":"06","t":"06-06","n":"10","q":"房東甲出租房屋予房客未成年人乙，嗣房客乙於屋中自殺，如房東欲對房客乙之法定代理人丙進行民事侵權行為訴訟，請求房價減損之損害，請問下列何者不是房東甲應盡的舉證責任？","o":["乙明知或可得而之在他人家中自殺，會造成他人房價減損","房屋因房客乙的自殺導致房價減損","房價減損的金額","證明丙的監督並未鬆懈，或縱加以相當之監督仍不免發生損害"],"a":"D","ty":"neg","e":{"s":"ok","x":"民法第187條第1項：限制行為能力人不法侵害他人權利，以行為時有識別能力為限，與其法定代理人連帶負損害賠償責任；同條第2項：法定代理人如其監督並未疏懈，或縱加以相當之監督而仍不免發生損害者，不負賠償責任，此為法定代理人丙之免責事由。依民事訴訟法第277條，當事人主張有利於己之事實者負舉證責任，故證明監督未疏懈應由丙舉證，非房東甲之舉證責任，故選(D)。","b":[{"k":"law","l":"民法","r":"第187條第1項","q":"無行為能力人或限制行為能力人，不法侵害他人之權利者，以行為時有識別能力為限，與其法定代理人連帶負損害賠償責任。行為時無識別能力者，由其法定代理人負損害賠償責任。","u":"https://mojlaw.moj.gov.tw/LawContent.aspx?LSID=FL001351&lawNumber=184&TypeSort=4"},{"k":"law","l":"民法","r":"第187條第2項","q":"前項情形，法定代理人如其監督並未疏懈，或縱加以相當之監督，而仍不免發生損害者，不負賠償責任。","u":"https://mojlaw.moj.gov.tw/LawContent.aspx?LSID=FL001351&lawNumber=184&TypeSort=4"},{"k":"law","l":"民事訴訟法","r":"第277條","q":"當事人主張有利於己之事實者，就其事實有舉證之責任。但法律別有規定，或依其情形顯失公平者，不在此限。","u":"https://laws.gov.taipei/law/LawSearch/LawChapterArticle/FL001362?chapterno=30"}],"nt":"簡報（實2-2）頁37凶宅案例亦討論房東應如何舉證，但未涉法定代理人責任。"}},{"id":"06-07-001","c":"06","t":"06-07","n":"01","q":"債權人就金錢請求或得易為金錢之請求，欲保全強制執行者，得向管轄法院為下列何種聲請?","o":["假執行","假扣押","假處分","核發支付命令"],"a":"B","ty":"gen","e":{"s":"ok","x":"民事訴訟法第522條第1項：「債權人就金錢請求或得易為金錢請求之請求，欲保全強制執行者，得聲請假扣押」，故選(B)。","b":[{"k":"law","l":"民事訴訟法","r":"第522條第1項","q":"債權人就金錢請求或得易為金錢請求之請求，欲保全強制執行者，得聲請假扣押。","u":"https://laws.gov.taipei/law/LawSearch/LawChapterArticle/FL001362?chapterno=49"}]}},{"id":"06-07-002","c":"06","t":"06-07","n":"02","q":"債權人就金錢請求以外之請求，欲保全強制執行者得進行何種聲請?","o":["假處分","假執行","假扣押","訴訟救助"],"a":"A","ty":"gen","e":{"s":"ok","x":"民事訴訟法第532條第1項：「債權人就金錢請求以外之請求，欲保全強制執行者，得聲請假處分」，故選(A)。","b":[{"k":"law","l":"民事訴訟法","r":"第532條第1項","q":"債權人就金錢請求以外之請求，欲保全強制執行者，得聲請假處分。","u":"https://laws.gov.taipei/law/LawSearch/LawChapterArticle/FL001362?chapterno=49"}]}},{"id":"06-07-003","c":"06","t":"06-07","n":"03","q":"出租人甲主張承租人乙積欠半年之租金及修繕費用，但是乙否認積欠租金，認為是甲任意調漲租金並虛報修繕費用。甲聲請依督促程序對乙發支付命令，乙因為不懂法律，在支付命令送達後20日之不變期間內並未向發命令之法院提出異議，甲即對乙聲請強制執行。下列敘述，何者與現行民事訴訟法規定相符？","o":["支付命令之救濟僅適用再審程序。所以乙只能提再審救濟程序","支付命令不得為執行名義。故甲不可以拿執行命令聲請法院對乙強制執行","支付命令與確定判決無同一之效力，所以乙得提起確認債權不存在之訴","在執行程序中債務人乙不得提起確認債權不存在之訴"],"a":"C","ty":"gen","e":{"s":"ok","x":"現行民事訴訟法第521條第1項：債務人未於法定期間合法異議者，支付命令「得為執行名義」（(B)錯），條文未賦予其與確定判決同一之效力；同條第3項並明定債務人得主張支付命令所載債權不存在而提起確認之訴，法院得許其供擔保停止強制執行（(A)(D)錯）；強制執行法第14條第2項亦許債務人對無確定判決同一效力之執行名義提起異議之訴，故選(C)。","b":[{"k":"law","l":"民事訴訟法","r":"第521條第1項","q":"債務人對於支付命令未於法定期間合法提出異議者，支付命令得為執行名義。","u":"https://laws.gov.taipei/law/LawSearch/LawChapterArticle/FL001362?chapterno=48"},{"k":"law","l":"民事訴訟法","r":"第521條第3項","q":"債務人主張支付命令上所載債權不存在而提起確認之訴者，法院依債務人聲請，得許其提供相當並確實之擔保，停止強制執行。","u":"https://laws.gov.taipei/law/LawSearch/LawChapterArticle/FL001362?chapterno=48"},{"k":"law","l":"強制執行法","r":"第14條第2項","q":"執行名義無確定判決同一之效力者，於執行名義成立前，如有債權不成立或消滅或妨礙債權人請求之事由發生，債務人亦得於強制執行程序終結前提起異議之訴。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=B0010004"}],"nt":"選項(B)「執行命令」應係指支付命令。"}},{"id":"06-07-004","c":"06","t":"06-07","n":"04","q":"出租人甲與承租人乙簽訂租賃契約後，覺得房租太低因而心生後悔，因而向乙請求調漲租金，被乙拒絕後，甲片面終止租賃契約，並已找好鎖匠欲換鎖並聯絡搬家公司，欲逕自將乙之物品搬走，請問乙應為何種主張，才能「即時」獲得司法救濟，確保居住之權利？","o":["向法院聲請甲不得為妨礙其使用租賃物（即房屋）之假處分請求","向法院聲請假扣押甲之財產","向市政府聲請不動產糾紛調處","向鄉鎮市公所聲請調解"],"a":"A","ty":"gen","e":{"s":"ok","x":"民事訴訟法第532條第1項：債權人就金錢請求以外之請求，欲保全強制執行者，得聲請假處分；第538條第1項：於爭執之法律關係，為防止發生重大之損害或避免急迫之危險而有必要時，得聲請定暫時狀態之處分（依第538條之4準用假處分規定）。乙欲即時禁止甲換鎖搬物、妨礙其使用房屋，屬金錢以外之請求，應向法院聲請假處分；假扣押（第522條）係保全金錢請求，調處、調解則屬訴訟外紛爭解決機制（簡報實2-2頁55），故選(A)。","b":[{"k":"law","l":"民事訴訟法","r":"第532條第1項","q":"債權人就金錢請求以外之請求，欲保全強制執行者，得聲請假處分。","u":"https://laws.gov.taipei/law/LawSearch/LawChapterArticle/FL001362?chapterno=49"},{"k":"law","l":"民事訴訟法","r":"第538條第1項","q":"於爭執之法律關係，為防止發生重大之損害或避免急迫之危險或有其他相類之情形而有必要時，得聲請為定暫時狀態之處分。","u":"https://laws.gov.taipei/law/LawSearch/LawChapterArticle/FL001362?chapterno=49"},{"k":"law","l":"民事訴訟法","r":"第538條之4","q":"除別有規定外，關於假處分之規定，於定暫時狀態之處分準用之。","u":"https://laws.gov.taipei/law/LawSearch/LawChapterArticle/FL001362?chapterno=49"},{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－租賃管理與糾紛實務（實2-1～實2-2）","r":"頁碼55（PDF第56頁）","q":"還可以透過「調解」、「調處」或「仲裁」等訴訟以外的方式來解決，而這些方式就是「訴訟外紛爭解決機制」。"}]}},{"id":"06-08-001","c":"06","t":"06-08","n":"01","q":"甲無權占用乙所有土地，乙擬依不當得利之法則，向甲請求返還相當於租金之不當利益。該返還利益請求權之消滅時效期間為何?","o":["15年","5年","2年","1年"],"a":"B","ty":"num","e":{"s":"ok","x":"民法第126條：租金之各期給付請求權因五年間不行使而消滅；無權占有他人土地所獲相當於租金之利益，依最高法院65年6月8日第五次民庭總會決議（臺北市政府法規委員會94年函引述），如返還利益請求權已逾租金短期消滅時效期間，對相當於已罹時效之租金利益，不得依不當得利之法則請求返還，即同受5年時效限制，故選(B)。","b":[{"k":"law","l":"民法","r":"第126條","q":"利息、紅利、租金、贍養費、退職金及其他一年或不及一年之定期給付債權，其各期給付請求權，因五年間不行使而消滅。","u":"https://mojlaw.moj.gov.tw/LawContent.aspx?LSID=FL001351&lawNumber=125&TypeSort=2"},{"k":"web","l":"臺北市政府法規委員會94年5月25日北市法二字第09430885600號函","r":"","q":"無法律上原因而獲得相當於租金之利益，致他人受損害時，如該他人返還利益請求權已逾租金短期消滅時效之期間，對於相當於已罹消滅時效之租金之利益，不得依不當得利之法則，請求返還","m":"函文說明引最高法院61年台上字第1695號判例、民法第126條、第137條第2項及最高法院65年6月8日第五次民庭總會決議。","u":"https://laws.gov.taipei/law/Interpretation/Content/FE057389"}]}},{"id":"06-08-002","c":"06","t":"06-08","n":"02","q":"房東出租房屋予房客後，房客遲繳租金，房東因而欲終止契約並提起給付租金之訴訟，下列何者正確?","o":["房客遲繳租金達2個月可以直接終止","房客遲繳租金達2個月還需要催告才可以終止","房客遲繳租金達2個月還需要定期限催告，房客不繳後，才可以終止","房東無須催告，可以直接拿租賃契約書前往強制執行"],"a":"C","ty":"num","e":{"s":"ok","x":"民法第440條第1項、第2項：承租人遲付租金，出租人應定相當期限催告，承租人於期限內不為支付始得終止，且房屋遲付租金總額須達二個月之租額；租賃條例第10條第1項第2款亦規定須「經定相當期限催告仍拒繳」；簡報（倫理規範）頁177同此說明。一般租約亦非強制執行法所定執行名義，故選(C)。","b":[{"k":"law","l":"民法","r":"第440條第1項、第2項","q":"承租人租金支付有遲延者，出租人得定相當期限，催告承租人支付租金，如承租人於其期限內不為支付，出租人得終止契約。","m":"第2項：租賃物為房屋者，遲付租金之總額，非達二個月之租額，不得依前項規定終止契約。","u":"https://mojlaw.moj.gov.tw/LawContent.aspx?LSID=FL001351&lawNumber=421&TypeSort=3"},{"k":"law","l":"租賃住宅市場發展及管理條例","r":"第10條第1項第2款","q":"二、承租人遲付租金或費用，達二個月之租額，經定相當期限催告仍拒繳。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060125"},{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－租賃住宅相關法規與實務（法5-1～法5-5）","r":"頁碼177（PDF第178頁）","q":"必須房客所欠租金以押金扣抵尚欠二個月以上，還要經房東先催告房客給付租金，逾期不付房東才有終止租約的權利"},{"k":"law","l":"強制執行法","r":"第4條第1項","q":"強制執行，依左列執行名義為之：","m":"執行名義包括確定之終局判決、依民事訴訟法成立之和解或調解、依公證法規定得為強制執行之公證書及其他依法律之規定得為強制執行名義者等，未經公證之一般租約不在其列。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=B0010004"}],"nt":"簡報糾紛處理頁42引租賃條例第10條為「經催告仍拒繳」，112-02-08修正後為「經定相當期限催告仍拒繳」，與本題答案一致。"}},{"id":"06-08-003","c":"06","t":"06-08","n":"03","q":"房東出租房屋予房客，租約為1年，約定租約於民國106年12月31日屆期，屆期後房客沒有搬出去仍然按期交房租，房東收到租金後也沒表示反對的意思，此時租賃契約之效力為何？","o":["租約於107年1月1日起即失效","租約於107年3月1日起即失效","原租約視為以不定期限之租約繼續","租賃契約自動延長效力1年"],"a":"C","ty":"num","e":{"s":"ok","x":"民法第451條（簡報倫理規範頁70）：租賃期限屆滿後，承租人仍為租賃物之使用收益，而出租人不即表示反對之意思者，視為以不定期限繼續契約，故選(C)。","b":[{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－租賃住宅相關法規與實務（法5-1～法5-5）","r":"頁碼70（PDF第71頁）","q":"租賃期限屆滿後，承租人仍為租賃物之使用收益，而出租人不即表示反對之意思者，視為以不定期限繼續契約。"},{"k":"law","l":"民法","r":"第451條","q":"租賃期限屆滿後，承租人仍為租賃物之使用收益，而出租人不即表示反對之意思者，視為以不定期限繼續契約。","u":"https://mojlaw.moj.gov.tw/LawContent.aspx?LSID=FL001351&lawNumber=421&TypeSort=3"}]}},{"id":"06-08-004","c":"06","t":"06-08","n":"04","q":"依民事訴訟法規定，提起上訴，應於第一審判決送達後幾日之不變期間內為之?","o":["5日","10日","20日","30日"],"a":"C","ty":"num","e":{"s":"ok","x":"民事訴訟法第440條：「提起上訴，應於第一審判決送達後二十日之不變期間內為之」，故選(C)。","b":[{"k":"law","l":"民事訴訟法","r":"第440條","q":"提起上訴，應於第一審判決送達後二十日之不變期間內為之。但宣示或公告後送達前之上訴，亦有效力。","u":"https://laws.gov.taipei/law/LawSearch/LawChapterArticle/FL001362?chapterno=43"}]}},{"id":"06-08-005","c":"06","t":"06-08","n":"05","q":"房客欠繳租金逾半年，平常上班又遇不到，為了催討租金，下列何者方式正確?","o":["直接拿鐵鍊鎖住大門不讓房客進出","如果租賃標的是大樓社區，可以請管委會把房客進出的磁卡消磁，拒絕讓房客進出","可以向鄉鎮市、區公所調解委員會聲請調解","可以裝設攝影機，把鏡頭對準房客門口，以確認房客何時回家"],"a":"C","ty":"case","e":{"s":"ok","x":"鄉鎮市調解條例第1條：鄉、鎮、市公所應設調解委員會辦理民事事件之調解，第10條第1項當事人得以書面或言詞向調解委員會聲請調解，故催討欠租可聲請調解。簡報（倫理規範）頁177–178指出房東斷水斷電、換鎖等妨害房客行使租賃權利之行為會構成刑法強制罪（刑法第304條），以鐵鍊鎖門、消磁阻止進出亦屬此類自力救濟，故選(C)。","b":[{"k":"law","l":"鄉鎮市調解條例","r":"第1條","q":"鄉、鎮、市公所應設調解委員會，辦理下列調解事件：一、民事事件。二、告訴乃論之刑事事件。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=I0020003"},{"k":"law","l":"鄉鎮市調解條例","r":"第10條第1項","q":"聲請調解，由當事人向調解委員會以書面或言詞為之。言詞聲請者，應製作筆錄；書面聲請者，應按他造人數提出繕本。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=I0020003"},{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－租賃住宅相關法規與實務（法5-1～法5-5）","r":"頁碼178（PDF第179頁）","q":"此舉妨害房客行使租賃之權利，同樣會構成刑法上的強制罪。"},{"k":"law","l":"中華民國刑法","r":"第304條第1項","q":"以強暴、脅迫使人行無義務之事或妨害人行使權利者，處三年以下有期徒刑、拘役或九千元以下罰金。","u":"https://mojlaw.moj.gov.tw/LawContent.aspx?LSID=FL001424&lawNumber=296&TypeSort=2"}]}},{"id":"06-08-006","c":"06","t":"06-08","n":"06","q":"下列關於調解之敘述，何者正確?","o":["鄉鎮市區公所調解委員會所做成之民事調解經法院核定後，與民事確定判決有同一之效力","在區公所調解委員會所做成之民事調解經法院核定後，覺得不合理，可以直接再向法院提告","在區公所調解委員會所做成之民事調解經法院核定後，還是不得拿去聲請強制執行","在區公所調解委員會所做成之民事調解經法院核定後，覺得要賠的錢太多，可以主張被詐欺而撤銷調解筆錄"],"a":"A","ty":"gen","e":{"s":"ok","x":"鄉鎮市調解條例第27條第2項：「經法院核定之民事調解，與民事確定判決有同一之效力」，故(A)正確；(B)錯，同條第1項調解經法院核定後，當事人就該事件不得再行起訴；(C)錯，既與確定判決同一效力，得據以聲請強制執行（強制執行法第4條第1項第6款）；(D)錯，依第29條須有無效或得撤銷之原因，始得向原核定法院提起撤銷調解之訴，僅覺賠償過多並非撤銷原因，故選(A)。","b":[{"k":"law","l":"鄉鎮市調解條例","r":"第27條","q":"經法院核定之民事調解，與民事確定判決有同一之效力；經法院核定之刑事調解，以給付金錢或其他代替物或有價證券之一定數量為標的者，其調解書得為執行名義。","m":"第1項：「調解經法院核定後，當事人就該事件不得再行起訴、告訴或自訴。」","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=I0020003"},{"k":"law","l":"鄉鎮市調解條例","r":"第29條第1項","q":"因當事人聲請而成立之民事調解，經法院核定後有無效或得撤銷之原因者，當事人得向原核定法院提起宣告調解無效或撤銷調解之訴。","m":"第3項：應於法院核定之調解書送達後30日內為之。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=I0020003"},{"k":"law","l":"強制執行法","r":"第4條第1項第6款","q":"六、其他依法律之規定，得為強制執行名義者。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=B0010004"}]}},{"id":"06-08-007","c":"06","t":"06-08","n":"07","q":"房東就房客於租賃期間使用房屋導致房屋所受損害之損害賠償，在房東知悉後，請求權時效為幾年？","o":["6個月","1年","2年","5年"],"a":"C","ty":"num","e":{"s":"ok","x":"民法第456條（簡報倫理規範頁70）：出租人就租賃物所受損害對於承租人之賠償請求權，因二年間不行使而消滅，該期間於出租人自受租賃物返還時起算，故選(C)。","b":[{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－租賃住宅相關法規與實務（法5-1～法5-5）","r":"頁碼70（PDF第71頁）","q":"出租人就租賃物所受損害，對於承租人之賠償請求權、承租人之償還費用請求權、及工作物取回權，均因二年間不行使而消滅。"},{"k":"law","l":"民法","r":"第456條","q":"出租人就租賃物所受損害對於承租人之賠償請求權，承租人之償還費用請求權及工作物取回權，均因二年間不行使而消滅。","m":"第2項：前項期間，於出租人自受租賃物返還時起算；於承租人自租賃關係終止時起算。","u":"https://mojlaw.moj.gov.tw/LawContent.aspx?LSID=FL001351&lawNumber=421&TypeSort=3"}],"nt":"條文起算點為「自受租賃物返還時」，與題目「在房東知悉後」用語不同，但時效期間均為2年。"}},{"id":"06-08-008","c":"06","t":"06-08","n":"08","q":"關於法院管轄之規定，下列敘述何者正確?","o":["訴訟原則上由原告住所地之法院管轄","不動產之物權或其分割或經界涉訟者，專屬不動產所在地之法院管轄","兩造得以合意排除專屬管轄法院","定法院之管轄，以判決時為準"],"a":"B","ty":"gen","e":{"s":"ok","x":"民事訴訟法第10條第1項：「因不動產之物權或其分割或經界涉訟者，專屬不動產所在地之法院管轄」，故(B)正確；(A)錯，第1條第1項訴訟原則由被告住所地之法院管轄；(C)錯，第26條合意管轄之規定於專屬管轄之訴訟不適用；(D)錯，第27條定法院之管轄以起訴時為準，故選(B)。","b":[{"k":"law","l":"民事訴訟法","r":"第10條第1項","q":"因不動產之物權或其分割或經界涉訟者，專屬不動產所在地之法院管轄。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=B0010001"},{"k":"law","l":"民事訴訟法","r":"第1條第1項","q":"訴訟，由被告住所地之法院管轄。被告住所地之法院不能行使職權者，由其居所地之法院管轄。訴之原因事實發生於被告居所地者，亦得由其居所地之法院管轄。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=B0010001"},{"k":"law","l":"民事訴訟法","r":"第26條","q":"前二條之規定，於本法定有專屬管轄之訴訟，不適用之。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=B0010001"},{"k":"law","l":"民事訴訟法","r":"第27條","q":"定法院之管轄，以起訴時為準。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=B0010001"}]}},{"id":"06-08-009","c":"06","t":"06-08","n":"09","q":"21歲之在學生甲向乙續租房屋半年，不料開學前接獲被退學通知。甲、乙之租賃契約效力如何?","o":["有效","無效","得撤銷","效力未定"],"a":"A","ty":"gen","e":{"s":"ok","x":"民法第12條：「滿十八歲為成年」，21歲之甲已成年，有完全行為能力，其與乙訂立之續租契約有效；被退學屬甲自身事由，依民法第441條（簡報倫理規範頁69），承租人因自己之事由不能使用租賃物者，不得免其支付租金之義務，不影響契約效力，故選(A)。","b":[{"k":"law","l":"民法","r":"第12條","q":"滿十八歲為成年。","u":"https://mojlaw.moj.gov.tw/LawContent.aspx?LSID=FL001351&lawNumber=6&TypeSort=3"},{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－租賃住宅相關法規與實務（法5-1～法5-5）","r":"頁碼69（PDF第70頁）","q":"承租人因自己之事由，致不能為租賃物全部或一部之使用、收益者，不得免其支付租金之義務。"}],"nt":"簡報糾紛處理頁48仍以「未滿二十歲」為未成年（112-01-01前舊法）；無論依新舊法，21歲均已成年，結論相同。"}},{"id":"06-08-010","c":"06","t":"06-08","n":"10","q":"房客積欠房東租金，房東如欲委由租賃住宅管理人員代行訴訟程序，下列何者正確？","o":["由房東出具委任狀予租賃住宅管理人員，經審判長許可後，可由租賃住宅管理人員為該訴訟之房東代理人","直接去開庭即可","直接去開庭即可，如果審判長制止，再坐到旁聽席發言即可","房東委任的效力及於每個審級，租賃住宅管理人員一、二、三審都有代理權限"],"a":"A","ty":"case","e":{"s":"ok","x":"民事訴訟法第68條第1項：訴訟代理人應委任律師為之，「但經審判長許可者，亦得委任非律師為訴訟代理人」；第69條第1項：訴訟代理人應於最初為訴訟行為時提出委任書。故房東出具委任狀、經審判長許可後，租賃住宅管理人員得為訴訟代理人；(D)錯，第466條之1第1項對第二審判決上訴（第三審）應委任律師為訴訟代理人，故選(A)。","b":[{"k":"law","l":"民事訴訟法","r":"第68條第1項","q":"訴訟代理人應委任律師為之。但經審判長許可者，亦得委任非律師為訴訟代理人。","u":"https://laws.gov.taipei/law/LawSearch/LawChapterArticle/FL001362?chapterno=9"},{"k":"law","l":"民事訴訟法","r":"第69條第1項","q":"訴訟代理人，應於最初為訴訟行為時，提出委任書。但由當事人以言詞委任，經法院書記官記明筆錄，或經法院、審判長依法選任者，不在此限。","u":"https://laws.gov.taipei/law/LawSearch/LawChapterArticle/FL001362?chapterno=9"},{"k":"law","l":"民事訴訟法","r":"第466條之1第1項","q":"對於第二審判決上訴，上訴人應委任律師為訴訟代理人。但上訴人或其法定代理人具有律師資格者，不在此限。","u":"https://laws.gov.taipei/law/LawSearch/LawChapterArticle/FL001362?chapterno=44"}]}},{"id":"06-08-011","c":"06","t":"06-08","n":"11","q":"房東甲將房屋出租予房客乙，租約二年，然乙承租半年後即拒絕給付租金達3個月，房東多次前往租屋處均未遇到乙，詢問鄰居丙，丙告知很久沒看到乙了，大概是搬走了吧等語，但房東並無證據確認房客乙已搬離，請問您如果為租賃住宅管理人員，應為如何之建議？","o":["房客乙已經搬走，而且租金已超過2個月沒繳，可以直接進入屋內清掃租給下一個房客","房客乙已經搬走，而且租金已超過2個月沒繳，為求周全應該尋求管區員警及里長協助，強制開鎖進入","發存證信函定期限催繳，逾期限仍未繳者，再發存證信函終止租約後，強行開鎖進入","發存證信函定期限催繳，逾期限仍未繳者，再發存證信函終止租約後，向乙提出遷讓房屋之民事訴訟"],"a":"D","ty":"case","e":{"s":"ok","x":"依民法第440條及租賃條例第10條第1項第2款，承租人遲付租金達二個月之租額，須先定相當期限催告，逾期仍拒繳始得終止租約。簡報（倫理規範）頁177指出會同管區員警及里長進屋搬空物品「大有問題」，因二者「並沒有這樣的職權，租屋糾紛涉訟，依法只有法院可以處理」，未經房客同意進出房間會觸犯刑法侵入住居罪（刑法第306條）。故應以存證信函定期催告、終止租約後，提起遷讓房屋之民事訴訟，故選(D)。","b":[{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－租賃住宅相關法規與實務（法5-1～法5-5）","r":"頁碼177（PDF第178頁）","q":"管區員警及里長並沒有這樣的職權，租屋糾紛涉訟，依法只有法院可以處理。"},{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－租賃住宅相關法規與實務（法5-1～法5-5）","r":"頁碼177（PDF第178頁）","q":"房東未經房客同意，隨意進出房間，會觸犯刑法侵入住居罪。"},{"k":"law","l":"民法","r":"第440條第1項","q":"承租人租金支付有遲延者，出租人得定相當期限，催告承租人支付租金，如承租人於其期限內不為支付，出租人得終止契約。","u":"https://mojlaw.moj.gov.tw/LawContent.aspx?LSID=FL001351&lawNumber=421&TypeSort=3"},{"k":"law","l":"租賃住宅市場發展及管理條例","r":"第10條第1項第2款","q":"二、承租人遲付租金或費用，達二個月之租額，經定相當期限催告仍拒繳。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060125"},{"k":"law","l":"中華民國刑法","r":"第306條第1項","q":"無故侵入他人住宅、建築物或附連圍繞之土地或船艦者，處一年以下有期徒刑、拘役或九千元以下罰金。","u":"https://mojlaw.moj.gov.tw/LawContent.aspx?LSID=FL001424&lawNumber=296&TypeSort=2"}]}},{"id":"06-08-012","c":"06","t":"06-08","n":"12","q":"甲有A屋，出租且交付於乙。依民法之規定下列敘述何者正確？","o":["甲、乙間雖有反對轉租之約定，乙仍得將A屋一部出租於丙","乙租金支付遲延，甲即得終止契約","乙未經甲之承諾，將A屋全部轉租他人時，甲得終止契約","乙違反租賃物之約定使用方法者，甲即得終止契約"],"a":"C","ty":"gen","e":{"s":"ok","x":"民法第443條：承租人非經出租人承諾不得將租賃物轉租，房屋雖得一部轉租但以無反對之約定為限（(A)錯）；違反者「出租人得終止契約」，故(C)正確。(B)錯，依第440條須定相當期限催告且房屋遲付租金達二個月之租額；(D)錯，依第438條第2項須經出租人阻止而仍繼續為之始得終止，故選(C)。","b":[{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－租賃住宅相關法規與實務（法5-1～法5-5）","r":"頁碼69（PDF第70頁）","q":"承租人違反前項規定，將租賃物轉租於他人者，出租人得終止契約。"},{"k":"law","l":"民法","r":"第443條","q":"承租人非經出租人承諾，不得將租賃物轉租於他人。但租賃物為房屋者，除有反對之約定外，承租人得將其一部分轉租於他人。","m":"第2項：「承租人違反前項規定，將租賃物轉租於他人者，出租人得終止契約。」","u":"https://mojlaw.moj.gov.tw/LawContent.aspx?LSID=FL001351&lawNumber=421&TypeSort=3"},{"k":"law","l":"民法","r":"第438條第2項","q":"承租人違反前項之規定為租賃物之使用、收益，經出租人阻止而仍繼續為之者，出租人得終止契約。","u":"https://mojlaw.moj.gov.tw/LawContent.aspx?LSID=FL001351&lawNumber=421&TypeSort=3"},{"k":"law","l":"民法","r":"第440條第2項","q":"租賃物為房屋者，遲付租金之總額，非達二個月之租額，不得依前項之規定，終止契約。其租金約定於每期開始時支付者，並應於遲延給付逾二個月時，始得終止契約。","u":"https://mojlaw.moj.gov.tw/LawContent.aspx?LSID=FL001351&lawNumber=421&TypeSort=3"}]}},{"id":"06-08-013","c":"06","t":"06-08","n":"13","q":"關於民事訴訟制度，下列敘述，何者正確？","o":["民事訴訟原則上不需繳交裁判費","裁判費由被告先繳交","訴訟代理人一定要委任律師為之","並非所有民事訴訟均得提起第三審上訴"],"a":"D","ty":"gen","e":{"s":"ok","x":"民事訴訟法第466條第1項：財產權訴訟之第二審判決，上訴所得受之利益不逾新臺幣一百萬元者不得上訴；簡報（實2-2）頁53亦說明簡易訴訟事件原則上二審終結，故並非所有民事訴訟均得提起第三審上訴。(A)錯，簡報頁54列有因財產權起訴之裁判費徵收標準；(C)錯，第68條第1項但書經審判長許可得委任非律師為訴訟代理人，故選(D)。","b":[{"k":"law","l":"民事訴訟法","r":"第466條第1項","q":"對於財產權訴訟之第二審判決，如因上訴所得受之利益，不逾新臺幣一百萬元者，不得上訴。","u":"https://laws.gov.taipei/law/LawSearch/LawChapterArticle/FL001362?chapterno=44"},{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－租賃管理與糾紛實務（實2-1～實2-2）","r":"頁碼53（PDF第54頁）","q":"簡易訴訟事件原則上二審終結"},{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－租賃管理與糾紛實務（實2-1～實2-2）","r":"頁碼54（PDF第55頁）","q":"依民事訴訟法之規定，因財產權而起訴者，其訴訟標的之金額或價額："},{"k":"law","l":"民事訴訟法","r":"第68條第1項","q":"訴訟代理人應委任律師為之。但經審判長許可者，亦得委任非律師為訴訟代理人。","u":"https://laws.gov.taipei/law/LawSearch/LawChapterArticle/FL001362?chapterno=9"}],"nt":"簡報頁53所載簡易事件上訴第三審門檻為「逾新臺幣150萬元」。"}},{"id":"06-08-014","c":"06","t":"06-08","n":"14","q":"關於民事訴訟制度，下列敘述，何者正確？","o":["民事訴訟當事人一定要親自到庭","當事人如不到庭，法院得拘提之","民事訴訟不得為公示送達","民事訴訟當事人如果無法到庭，可以委託代理人到庭，經法院允許後就可以代理當事人為訴訟行為"],"a":"D","ty":"gen","e":{"s":"ok","x":"民事訴訟法第68條第1項：訴訟代理人應委任律師為之，但經審判長許可者，亦得委任非律師為訴訟代理人；故當事人無法到庭，可委任代理人經法院允許後代為訴訟行為，當事人並非一定要親自到庭（(A)錯）。(C)錯，第149條第1項應為送達之處所不明等情形，受訴法院得依聲請准為公示送達，故選(D)。","b":[{"k":"law","l":"民事訴訟法","r":"第68條第1項","q":"訴訟代理人應委任律師為之。但經審判長許可者，亦得委任非律師為訴訟代理人。","u":"https://laws.gov.taipei/law/LawSearch/LawChapterArticle/FL001362?chapterno=9"},{"k":"law","l":"民事訴訟法","r":"第149條第1項","q":"對於當事人之送達，有下列各款情形之一者，受訴法院得依聲請，准為公示送達：一、應為送達之處所不明者。二、於有治外法權人之住居所或事務所為送達而無效者。三、於外國為送達，不能依第一百四十五條之規定辦理，或預知雖依該條規定辦理而無效者。","u":"https://laws.gov.taipei/law/LawSearch/LawChapterArticle/FL001362?chapterno=18"}]}},{"id":"06-08-015","c":"06","t":"06-08","n":"15","q":"依民事訴訟法，下列何者不能作為執行名義聲請強制執行？","o":["訴訟上和解成立者","法院之調解成立者","到律師事務所簽訂並由律師見證的和解契約","支付命令，債務人未於法定期間對之合法提出異議者"],"a":"C","ty":"neg","e":{"s":"ok","x":"強制執行法第4條第1項列舉執行名義，包括「依民事訴訟法成立之和解或調解」（(A)(B)）、依公證法得為強制執行之公證書及其他依法律規定得為強制執行名義者；民事訴訟法第521條第1項：債務人未於法定期間合法異議之支付命令得為執行名義（(D)）。至律師事務所見證之和解契約，未經法院或公證，不在上述執行名義之列，故選(C)。","b":[{"k":"law","l":"強制執行法","r":"第4條第1項第3款、第4款","q":"三、依民事訴訟法成立之和解或調解。","m":"第4款：「四、依公證法規定得為強制執行之公證書。」；第6款：「六、其他依法律之規定，得為強制執行名義者。」","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=B0010004"},{"k":"law","l":"民事訴訟法","r":"第521條第1項","q":"債務人對於支付命令未於法定期間合法提出異議者，支付命令得為執行名義。","u":"https://laws.gov.taipei/law/LawSearch/LawChapterArticle/FL001362?chapterno=48"},{"k":"law","l":"民事訴訟法","r":"第380條第1項","q":"和解成立者，與確定判決有同一之效力。","u":"https://laws.gov.taipei/law/LawSearch/LawChapterArticle/FL001362?chapterno=37"},{"k":"law","l":"民事訴訟法","r":"第416條第1項","q":"調解經當事人合意而成立；調解成立者，與訴訟上和解有同一之效力。","u":"https://laws.gov.taipei/law/LawSearch/LawChapterArticle/FL001362?chapterno=39"}]}},{"id":"06-08-016","c":"06","t":"06-08","n":"16","q":"甲向乙承租房屋，供經營餐廳之用，租期為25年，另向丙承租土地一筆，於該土地上建造房屋一棟，租期為30年。下列敘述，何者正確？","o":["兩個租賃契約期限均超過20年，應縮短為20年，並不得更新之","甲乙間之租賃契約期限不受20年之限制，租期25年不受影響","甲丙間之租賃契約期限不受20年之限制，租期30年不受影響","兩個租賃契約期限均超過20年，應縮短為20年，但得更新之"],"a":"C","ty":"num","e":{"s":"ok","x":"民法第449條（簡報倫理規範頁70）：租賃契約之期限不得逾二十年，逾二十年者縮短為二十年，當事人得更新之；但「租用基地建築房屋者，不適用第一項之規定」。故甲乙間房屋租賃25年應縮短為20年（得更新），甲丙間租地建屋30年不受20年限制，故選(C)。","b":[{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－租賃住宅相關法規與實務（法5-1～法5-5）","r":"頁碼70（PDF第71頁）","q":"租用基地建築房屋者，不適用第一項之規定。"},{"k":"law","l":"民法","r":"第449條","q":"租賃契約之期限，不得逾二十年。逾二十年者，縮短為二十年。","m":"第2項：「前項期限，當事人得更新之。」第3項：「租用基地建築房屋者，不適用第一項之規定。」","u":"https://mojlaw.moj.gov.tw/LawContent.aspx?LSID=FL001351&lawNumber=421&TypeSort=3"}]}},{"id":"06-09-001","c":"06","t":"06-09","n":"01","q":"租賃契約已約定契約雙方不得提前終止契約，租賃期間若有發生下列何種情形，承租人仍得提前終止契約，出租人不得要求任何賠償？","o":["租賃住宅因地震而毀損致無法居住","租賃處附近的鄰居麻將聲太大聲","租賃處廁所管道間飄出煙味","承租後才發現對面是墓園"],"a":"A","ty":"neg","e":{"s":"ok","x":"條例第11條第1項第3款：因不可歸責於承租人之事由致租賃住宅一部滅失、存餘部分難以繼續居住者，承租人得提前終止且出租人不得要求賠償；地震毀損致無法居住即屬之，此為法定事由，不受「不得提前終止」約定排除，故選(A)。","b":[{"k":"law","l":"租賃住宅市場發展及管理條例","r":"條例第11條第1項第3款","q":"三、因不可歸責於承租人之事由，致租賃住宅之一部滅失，且其存餘部分難以繼續居住。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060125"},{"k":"law","l":"租賃住宅市場發展及管理條例","r":"條例第11條第1項","q":"租賃期間發生下列情形之一者，承租人得提前終止租賃契約，且出租人不得要求任何賠償：","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060125"},{"k":"law","l":"住宅租賃定型化契約應記載及不得記載事項（內政部）","r":"應記載事項第十四點第1項","q":"本契約於期限屆滿前，除依第十七點及第十八點規定得提前終止租約外","u":"https://www.ey.gov.tw/File/43BC094940995CFC?A=C"}]}},{"id":"06-09-002","c":"06","t":"06-09","n":"02","q":"甲向乙承租A屋，但樓下鄰居丙反映A屋浴室漏水至鄰居B屋。乙欲進行浴室漏水的修繕，但修繕期間甲將會無法使用廁所。請問下列敘述何者正確?","o":["甲有配合乙的義務，故無法做任何主張","甲必須配合修繕，乙應將不能使用的期間及部分換算金額折抵租金","是丙的B屋漏水，甲可以選擇不配合處理","甲不願配合處理，則乙不應該透過調解或訴訟而堅持進入"],"a":"B","ty":"gen","e":{"s":"ok","x":"條例第8條第4項：出租人為修繕租賃住宅所為之必要行為，承租人不得拒絕；應記載事項第九點第4項：修繕期間致租賃住宅全部或一部不能居住使用者，承租人得請求扣除該期間全部或一部之租金，故選(B)。","b":[{"k":"law","l":"租賃住宅市場發展及管理條例","r":"條例第8條第4項","q":"出租人為修繕租賃住宅所為之必要行為，承租人不得拒絕。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060125"},{"k":"law","l":"住宅租賃定型化契約應記載及不得記載事項（內政部）","r":"應記載事項第九點第4項","q":"前項出租人於修繕期間，致租賃住宅全部或一部不能居住使用者，承租人得請求出租人扣除該期間全部或一部之租金。","u":"https://www.ey.gov.tw/File/43BC094940995CFC?A=C"}]}},{"id":"06-09-003","c":"06","t":"06-09","n":"03","q":"甲出租其房屋於乙，契約並經公證，租賃物交付後，甲將房屋所有權移轉於丙，則下列敘述何者正確？","o":["因甲已出租於乙，故所有權之移轉無效","因乙丙間無契約關係，故乙對丙而言為無權占有","此時發生法定契約承擔，丙成為出租人","甲乙間之租賃契約若為不定期，無買賣不破租賃之適用"],"a":"C","ty":"gen","e":{"s":"ok","x":"民法第425條第1項（買賣不破租賃）：租賃物交付後、承租人占有中，出租人將所有權讓與第三人，租賃契約對受讓人仍繼續存在，丙依法承受出租人地位；第2項排除適用限於「未經公證」且期限逾五年或未定期限者，本題已公證，故D錯，故選(C)。","b":[{"k":"law","l":"民法","r":"民法第425條第1項","q":"出租人於租賃物交付後，承租人占有中，縱將其所有權讓與第三人，其租賃契約，對於受讓人仍繼續存在。","u":"https://mojlaw.moj.gov.tw/LawContent.aspx?LSID=FL001351"},{"k":"law","l":"民法","r":"民法第425條第2項","q":"前項規定，於未經公證之不動產租賃契約，其期限逾五年或未定期限者，不適用之。","u":"https://mojlaw.moj.gov.tw/LawContent.aspx?LSID=FL001351"}]}},{"id":"06-09-004","c":"06","t":"06-09","n":"04","q":"非房屋所有權人是否有出租房子的權利?","o":["雖非房屋所有權人，但只要是親人就可以任意出租給他人","非房屋所有權人無權將房屋出租給他人","非房屋所有權人若要將房屋出租給他人，需出示屋主同意書及代理文件","非房屋所有權人若要出租房屋給他人，需透過租賃管理服務業才可"],"a":"C","ty":"gen","e":{"s":"ok","x":"應記載事項第十一點第1項：出租人應出示有權出租本租賃住宅之證明文件及身分證明文件供承租人核對；非所有權人出租，須出示屋主同意或代理等有權出租之證明，故選(C)。","b":[{"k":"law","l":"住宅租賃定型化契約應記載及不得記載事項（內政部）","r":"應記載事項第十一點第1項","q":"出租人應出示有權出租本租賃住宅之證明文件及國民身分證或其他足資證明身分之文件，供承租人核對。","u":"https://www.ey.gov.tw/File/43BC094940995CFC?A=C"}]}},{"id":"06-09-005","c":"06","t":"06-09","n":"05","q":"簽約時，房客與房東約定好，應支付的押金3萬元將分3個月支付，並於合約中載明。但房客卻未依承諾繳付，請問房東能否依此終止租約?","o":["可以，因為是房客未依承諾履行，房東可以終止租約要求房客遷出","可以，押金是房屋出租之必要項目，未全額支付押金，契約即無法生效","可以，押金對房東是很重要的保障，若未照承諾支付當然可以終止租約","不可以，因押金與租金性質不同，未支付並非是契約不成立，不可以任意終止"],"a":"D","ty":"case","e":{"s":"ok","x":"押金依條例第3條第13款係擔保損害賠償及遺留物處理之預付金錢，與民法第421條作為使用收益對價之租金不同；條例第10條第1項所列出租人得提前終止之事由，係遲付「租金或費用」達二個月租額經催告仍拒繳等，未包括押金未付，故不得以此終止，故選(D)。","b":[{"k":"law","l":"租賃住宅市場發展及管理條例","r":"條例第3條第13款","q":"十三、押金：指承租人為擔保租賃住宅之損害賠償行為及處理遺留物責任，預為支付之金錢。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060125"},{"k":"law","l":"民法","r":"民法第421條第1項","q":"稱租賃者，謂當事人約定，一方以物租與他方使用收益，他方支付租金之契約。","u":"https://mojlaw.moj.gov.tw/LawContent.aspx?LSID=FL001351"},{"k":"law","l":"租賃住宅市場發展及管理條例","r":"條例第10條第1項第2款","q":"二、承租人遲付租金或費用，達二個月之租額，經定相當期限催告仍拒繳。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060125"}],"nt":"以條例第10條所列終止事由未包括押金未付為論據。"}},{"id":"06-09-006","c":"06","t":"06-09","n":"06","q":"租約1個月後即將到期，承租人已告知出租人期滿不再續約，但出租人就開始帶新房客來看屋，且未事前通知承租人。請問承租人能否拒絕出租人的帶看要求?","o":["可以，承租後使用權是在承租人，出租人不可以任意進出","不可，房子為出租人所有，出租人當然可以帶人進入看屋","不可以，因為拒絕會讓出租人不高興，所以最好還是配合，否則押金返還會被房東刁難","不可以，因為要好聚好散，不要因為這件事吵架"],"a":"A","ty":"case","e":{"s":"ok","x":"依民法第421條第1項，出租人將租賃物交與承租人使用收益，租期內使用權屬承租人；未經承租人同意無故進入住宅，可能構成刑法第306條第1項侵入住居，承租人得拒絕未事先通知之帶看，故選(A)。","b":[{"k":"law","l":"民法","r":"民法第421條第1項","q":"稱租賃者，謂當事人約定，一方以物租與他方使用收益，他方支付租金之契約。","u":"https://mojlaw.moj.gov.tw/LawContent.aspx?LSID=FL001351"},{"k":"law","l":"中華民國刑法","r":"刑法第306條第1項","q":"無故侵入他人住宅、建築物或附連圍繞之土地或船艦者，處一年以下有期徒刑、拘役或九千元以下罰金。","u":"https://mojlaw.moj.gov.tw/LawContent.aspx?LSID=FL001424&lawNumber=296&TypeSort=2"}]}},{"id":"06-09-007","c":"06","t":"06-09","n":"07","q":"租約期滿雙方會同點交時，出租人認為承租人沒有愛護房子讓牆壁有斑駁褪色，所以要從押金中扣除清潔及粉刷費，但承租人認為並未刻意破壞並已做好清潔工作，故出租人不得自押金中扣除清潔與粉刷費用。下列敘述何者正確?","o":["除非契約另有約定，否則承租人有返還原狀的義務，故油漆剥落都應該由承租人負責","承租人無刻意破壞房屋，且已回復原狀但牆面斑駁褪色是自然耗損，出租人不得要求承租人負擔清潔與粉刷費","這是出租要負擔的成本，當然是出租人要自己處理，但也可以要求承租人要回復原狀","承租人返還房屋時應以原狀返還，所以承租人應要先做好清潔及全室粉刷後才能退租"],"a":"B","ty":"neg","e":{"s":"ok","x":"民法第432條第2項但書及應記載事項第十二點第3項但書：依約定方法或依租賃住宅之性質使用、收益致有變更或毀損者，承租人不負賠償責任；牆面自然斑駁褪色屬正常使用之耗損，出租人不得要求承租人負擔粉刷費，故選(B)。","b":[{"k":"law","l":"民法","r":"民法第432條第2項","q":"但依約定之方法或依物之性質而定之方法為使用、收益，致有變更或毀損者，不在此限。","u":"https://mojlaw.moj.gov.tw/LawContent.aspx?LSID=FL001351"},{"k":"law","l":"住宅租賃定型化契約應記載及不得記載事項（內政部）","r":"應記載事項第十二點第3項","q":"但依約定之方法或依租賃住宅之性質使用、收益，致有變更或毀損者，不在此限。","u":"https://www.ey.gov.tw/File/43BC094940995CFC?A=C"}]}},{"id":"06-10-001","c":"06","t":"06-10","n":"01","q":"住宅租賃契約之修繕責任，若契約中無特別明訂，修繕責任是歸屬於哪一方?","o":["承租人","出租人","保證人","出租人及承租人一人一半"],"a":"B","ty":"gen","e":{"s":"ok","x":"民法第429條第1項：租賃物之修繕，除契約另有訂定或另有習慣外，由出租人負擔；應記載事項第九點第1項亦規定由出租人負責修繕，故選(B)。","b":[{"k":"law","l":"民法","r":"民法第429條第1項","q":"租賃物之修繕，除契約另有訂定或另有習慣外，由出租人負擔。","u":"https://mojlaw.moj.gov.tw/LawContent.aspx?LSID=FL001351"},{"k":"law","l":"住宅租賃定型化契約應記載及不得記載事項（內政部）","r":"應記載事項第九點第1項","q":"租賃住宅或附屬設備損壞時，應由出租人負責修繕。","u":"https://www.ey.gov.tw/File/43BC094940995CFC?A=C"}]}},{"id":"06-10-002","c":"06","t":"06-10","n":"02","q":"租賃期間下列何種情形，非出租人法定終止權?","o":["承租人遲繳租金1星期","承租人未經出租人同意，進行室內裝修","承租人未依租賃住宅使用規定，違法使用租賃物","承租人積欠管理費已達2個月租金，定相當期限催告仍不為給付"],"a":"A","ty":"gen","e":{"s":"ok","x":"條例第10條第1項第2款及民法第440條第2項：遲付租金須達二個月之租額並經定相當期限催告仍不支付，出租人始得終止；遲繳1星期不構成終止事由。未經同意室內裝修、違法使用、積欠管理費達2個月租金經催告不付，均列於應記載事項第十七點，故選(A)。","b":[{"k":"law","l":"租賃住宅市場發展及管理條例","r":"條例第10條第1項第2款","q":"二、承租人遲付租金或費用，達二個月之租額，經定相當期限催告仍拒繳。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060125"},{"k":"law","l":"民法","r":"民法第440條第2項","q":"租賃物為房屋者，遲付租金之總額，非達二個月之租額，不得依前項之規定，終止契約。","u":"https://mojlaw.moj.gov.tw/LawContent.aspx?LSID=FL001351"},{"k":"law","l":"住宅租賃定型化契約應記載及不得記載事項（內政部）","r":"應記載事項第十七點第1項第3款","q":"(三)承租人積欠管理費或其他應負擔之費用達二個月之租金額，經出租人定相當期限催告，仍不為支付。","u":"https://www.ey.gov.tw/File/43BC094940995CFC?A=C"},{"k":"law","l":"住宅租賃定型化契約應記載及不得記載事項（內政部）","r":"應記載事項第十七點第1項第8款","q":"(八)承租人違反第十點第一項規定，未經出租人同意，擅自進行室內裝修，經出租人阻止仍繼續為之。","u":"https://www.ey.gov.tw/File/43BC094940995CFC?A=C"}]}},{"id":"06-10-003","c":"06","t":"06-10","n":"03","q":"請問房東是否可將房子出租給未成年的大學生？","o":["不可以，一定要成年才能承租","可以，但須取得法定代理人之同意","可以，但除了法定代理人同意外，還要陪同簽約才可以","契約自由原則，誰都可以簽名"],"a":"B","ty":"case","e":{"s":"ok","x":"民法第12條滿十八歲為成年、第13條第2項滿七歲以上之未成年人有限制行為能力；依第77條，限制行為能力人為意思表示應得法定代理人之允許，故未成年大學生承租須經法定代理人同意，故選(B)。","b":[{"k":"law","l":"民法","r":"民法第12條","q":"滿十八歲為成年。","u":"https://mojlaw.moj.gov.tw/LawContent.aspx?LSID=FL001351"},{"k":"law","l":"民法","r":"民法第13條第2項","q":"滿七歲以上之未成年人，有限制行為能力。","u":"https://mojlaw.moj.gov.tw/LawContent.aspx?LSID=FL001351"},{"k":"law","l":"民法","r":"民法第77條","q":"限制行為能力人為意思表示及受意思表示，應得法定代理人之允許。","u":"https://mojlaw.moj.gov.tw/LawContent.aspx?LSID=FL001351"}]}},{"id":"06-10-004","c":"06","t":"06-10","n":"04","q":"甲向乙承租A屋，承租的第2年租約到期後並無重新訂契，至今已承租了10年。甲想要回鄉下生活，臨時向乙表示一個月後要搬走，但乙卻說提前終止須沒收2個月押金。下列敘述何者正確？","o":["租約到期後沒簽新約，乙當然不能扣除甲的押金","此租約已是不定期租約，甲可以依習慣終止合約，乙不能扣除違約金","依定型化契約規定，可以扣違約金一個月","甲提出租約終止需經乙的同意，所以押金乙可以沒收"],"a":"B","ty":"gen","e":{"s":"ok","x":"民法第451條：租期屆滿後承租人仍為使用收益、出租人不即表示反對者，視為以不定期限繼續契約；第450條第2項：未定期限者各當事人得隨時終止契約，有利於承租人之習慣從其習慣，並依第3項先期通知。甲依法終止，非違約，乙不得扣違約金，故選(B)。","b":[{"k":"law","l":"民法","r":"民法第451條","q":"租賃期限屆滿後，承租人仍為租賃物之使用收益，而出租人不即表示反對之意思者，視為以不定期限繼續契約。","u":"https://mojlaw.moj.gov.tw/LawContent.aspx?LSID=FL001351"},{"k":"law","l":"民法","r":"民法第450條第2項","q":"未定期限者，各當事人得隨時終止契約。但有利於承租人之習慣者，從其習慣。","u":"https://mojlaw.moj.gov.tw/LawContent.aspx?LSID=FL001351"},{"k":"law","l":"民法","r":"民法第450條第3項","q":"前項終止契約，應依習慣先期通知。","u":"https://mojlaw.moj.gov.tw/LawContent.aspx?LSID=FL001351"}]}},{"id":"06-10-005","c":"06","t":"06-10","n":"05","q":"房東經房客反映進行浴室漏水的修繕處理，但施工多日影響到房客的居住品質。下列敘述何者正確？","o":["房客有配合及容忍的義務，但可與房東協商不能居住得損失賠償","房客有配合及容忍的義務，不須做任何處理","工程期間難免造成這樣結果，忍耐幾天即可","房客要進行蒐證，但就算房東在修繕過程中導致自己的物品受損，也不能提出損壞賠償要求"],"a":"A","ty":"case","e":{"s":"ok","x":"民法第429條第2項：出租人為保存租賃物所為之必要行為，承租人不得拒絕（配合容忍義務）；應記載事項第九點第4項：修繕期間致全部或一部不能居住使用者，承租人得請求扣除該期間租金，故可就不能居住之損失與房東協商，故選(A)。","b":[{"k":"law","l":"民法","r":"民法第429條第2項","q":"出租人為保存租賃物所為之必要行為，承租人不得拒絕。","u":"https://mojlaw.moj.gov.tw/LawContent.aspx?LSID=FL001351"},{"k":"law","l":"住宅租賃定型化契約應記載及不得記載事項（內政部）","r":"應記載事項第九點第3項","q":"出租人為修繕租賃住宅所為之必要行為，應於相當期間先期通知，承租人無正當理由不得拒絕。","u":"https://www.ey.gov.tw/File/43BC094940995CFC?A=C"},{"k":"law","l":"住宅租賃定型化契約應記載及不得記載事項（內政部）","r":"應記載事項第九點第4項","q":"前項出租人於修繕期間，致租賃住宅全部或一部不能居住使用者，承租人得請求出租人扣除該期間全部或一部之租金。","u":"https://www.ey.gov.tw/File/43BC094940995CFC?A=C"}]}},{"id":"06-10-006","c":"06","t":"06-10","n":"06","q":"承租人因個人因素想要提前終止租約，但出租人表示要扣下2個月押金做為違約金。雙方查看當初簽訂的租約內容，並未約定有提前終止事項。下列敘述何者正確？","o":["未約定提前終止條文，代表雙方可隨時終止租約，且無任何罰則","未約定提前終止條文，需經雙方同意方能終止，或協商賠償金額","未約定提前終止，若想提前終止只要提前1個月告知，就可終止租約","未約定提前終止，但只要有提前1個月告知及賠償月的違約金，即可提前終止"],"a":"B","ty":"gen","e":{"s":"ok","x":"民法第450條第1項：定有期限之租賃於期限屆滿時消滅；依第453條，須約定一方於期限屆滿前得終止契約者始得提前終止（應記載事項第十四點亦由雙方約定得否任意終止）。未約定者，承租人無單方提前終止權，須經雙方同意或協商賠償，故選(B)。","b":[{"k":"law","l":"民法","r":"民法第450條第1項","q":"租賃定有期限者，其租賃關係，於期限屆滿時消滅。","u":"https://mojlaw.moj.gov.tw/LawContent.aspx?LSID=FL001351"},{"k":"law","l":"民法","r":"民法第453條","q":"定有期限之租賃契約，如約定當事人之一方於期限屆滿前，得終止契約者，其終止契約，應依第四百五十條第三項之規定，先期通知。","u":"https://mojlaw.moj.gov.tw/LawContent.aspx?LSID=FL001351"},{"k":"law","l":"住宅租賃定型化契約應記載及不得記載事項（內政部）","r":"應記載事項第十四點第1項","q":"租賃雙方□得□不得任意終止租約。","u":"https://www.ey.gov.tw/File/43BC094940995CFC?A=C"}]}},{"id":"06-10-007","c":"06","t":"06-10","n":"07","q":"簽約時，房東並未表示不可飼養寵物，但承租後卻向房客表示因為房客飼養寵物，故要終止租約。下列敘述何者正確？","o":["房客承租已有使用權利，且在簽約時未做聲明，因此房客當然可以養寵物，房東不得事後再禁止。（到期時房客要將房屋回復原狀返還）","除非房客出具承諾書會把寵物管好、弄乾淨，不然房東還是可以終止租約","房東要求雖然沒有不法，但契約沒有約定，房客應該容忍配合一下","契約簽定前房東雖未表明，但養寵物非普遍性可接受的範圍，在房客未先詢問下，不可因既成事實而要求房東配合容忍"],"a":"A","ty":"neg","e":{"s":"ok","x":"民法第438條第1項：承租人應依約定方法使用收益，無約定方法者依租賃物之性質；契約未禁止飼養寵物，條例第10條第1項及應記載事項第十七點所列出租人得提前終止事由亦不包括飼養寵物，房東不得事後據以終止。租期屆滿依民法第455條返還租賃物，故選(A)。","b":[{"k":"law","l":"民法","r":"民法第438條第1項","q":"承租人應依約定方法，為租賃物之使用、收益；無約定方法者，應以依租賃物之性質而定之方法為之。","u":"https://mojlaw.moj.gov.tw/LawContent.aspx?LSID=FL001351"},{"k":"law","l":"租賃住宅市場發展及管理條例","r":"條例第10條第1項","q":"租賃期間發生下列情形之一者，出租人得提前終止租賃契約，且承租人不得要求任何賠償：","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060125"},{"k":"law","l":"民法","r":"民法第455條","q":"承租人於租賃關係終止後，應返還租賃物","u":"https://mojlaw.moj.gov.tw/LawContent.aspx?LSID=FL001351"}],"nt":"以契約未約定禁止及法定終止事由未包括飼養寵物為論據；公寓大廈規約另有禁止者應另論。"}},{"id":"06-10-008","c":"06","t":"06-10","n":"08","q":"甲向乙承租A屋，但丙向甲出示相關證明表示自己才是A屋的所有權人，且無同意任何人出租A屋，並要求甲應於3日內遷出。下列敘述何者正確？","o":["甲須先向乙協商並確認乙有無出租之權利，如果乙真的沒有出租的權利，甲只能終止與乙的契約，再向乙求償","雖然丙出現，但乙已將權利轉租給甲，甲仍有權利住到租約期滿","甲必須於3日內立刻搬離，但丙應返還給甲當初所支付之押金","甲不用搬離，請丙找到乙再來談後續收回房屋之事，否則請丙支付給甲搬遷費用及返還押金"],"a":"A","ty":"gen","e":{"s":"ok","x":"條例第11條第1項第4款：因第三人就租賃住宅主張其權利，致承租人不能為約定之居住使用者，承租人得提前終止且不負賠償（民法第436條準用第435條）；出租人依民法第347條準用第349條負權利瑕疵擔保，不履行時承租人得依第353條請求損害賠償，故選(A)。","b":[{"k":"law","l":"租賃住宅市場發展及管理條例","r":"條例第11條第1項第4款","q":"四、因第三人就租賃住宅主張其權利，致承租人不能為約定之居住使用。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060125"},{"k":"law","l":"民法","r":"民法第436條","q":"前條規定，於承租人因第三人就租賃物主張權利，致不能為約定之使用、收益者準用之。","u":"https://mojlaw.moj.gov.tw/LawContent.aspx?LSID=FL001351"},{"k":"law","l":"民法","r":"民法第347條","q":"本節規定，於買賣契約以外之有償契約準用之。","u":"https://mojlaw.moj.gov.tw/LawContent.aspx?LSID=FL001351"},{"k":"law","l":"民法","r":"民法第349條","q":"出賣人應擔保第三人就買賣之標的物，對於買受人不得主張任何權利。","u":"https://mojlaw.moj.gov.tw/LawContent.aspx?LSID=FL001351"},{"k":"law","l":"民法","r":"民法第353條","q":"買受人得依關於債務不履行之規定，行使其權利。","u":"https://mojlaw.moj.gov.tw/LawContent.aspx?LSID=FL001351"}]}},{"id":"06-10-009","c":"06","t":"06-10","n":"09","q":"甲向乙承租一間雅房居住使用，雙方在契約中並未對轉租與否等內容做約定。乙後來發現甲帶朋友丙進來一起居住並收取租金，故乙向甲表示這算轉租，所以要求終止租約。請問下列敘述何者正確？","o":["法律規定，若沒有特別載明不能轉租，則乙無法依此終止租約","甲承租已有使用權利，乙不能干涉","甲承租後再與丙合住，並向丙收取租金，已為收益行為，在未告知房東下，已違反租賃住宅市場發展及管理條例規定，乙當然可以終止租約","乙可以要求漲租，但不能要求終止租約"],"a":"C","ty":"gen","e":{"s":"ok","x":"甲將承租房屋一部租與丙居住並收取租金，依條例第3條第9款屬「轉租」；條例第9條第1項規定轉租全部或一部均須經出租人書面同意，未經書面同意轉租者，出租人得依第10條第1項第3款提前終止，故選(C)。","b":[{"k":"law","l":"租賃住宅市場發展及管理條例","r":"條例第3條第9款","q":"九、轉租：指承租租賃住宅，以其全部或一部租與他人居住使用，他人支付租金之租賃行為。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060125"},{"k":"law","l":"租賃住宅市場發展及管理條例","r":"條例第9條第1項","q":"轉租人應經出租人書面同意，始得轉租其租用之住宅全部或一部。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060125"},{"k":"law","l":"租賃住宅市場發展及管理條例","r":"條例第10條第1項第3款","q":"三、承租人未經出租人書面同意，將租賃住宅轉租於他人。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060125"}],"nt":"民法第443條第1項但書允許房屋一部轉租，惟條例第9條要求書面同意，題目依條例。"}},{"id":"06-10-010","c":"06","t":"06-10","n":"10","q":"租約到期承租人欲點交返還住宅，但出租人一直說太忙沒空處理，依租賃住宅市場發展及管理條例規定，請問承租人可以下列何者方式處理？","o":["先通知出租人約定點交，屆期不出現就將鑰匙投入信箱或交管理員，請出租人自己去拿取，並請出租人返還押金","向出租人表示點交時間，如出租人點交時未到，經承租人定相當期限催告後，等期限到了，出租人仍藉故拒不點交，就直接視同完成點交","出租人不出面點交，什麼都不用作，而且鑰匙可先不必返還，等出租人退還押金後再返還鑰匙","發存證信函告知出租人已返還房屋，不必將鑰匙寄回，其他費用請出租人結算後限期返還押金"],"a":"B","ty":"gen","e":{"s":"ok","x":"條例第12條第1項：租賃住宅之返還應由雙方共同完成點交；一方未會同點交，經他方定相當期限催告仍不會同者，視為完成點交，故選(B)。","b":[{"k":"law","l":"租賃住宅市場發展及管理條例","r":"條例第12條第1項","q":"一方未會同點交，經他方定相當期限催告仍不會同者，視為完成點交。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060125"},{"k":"law","l":"住宅租賃定型化契約應記載及不得記載事項（內政部）","r":"應記載事項第十五點第2項","q":"前項租賃之一方未會同點交，經他方定相當期限催告仍不會同者，視為完成點交。","u":"https://www.ey.gov.tw/File/43BC094940995CFC?A=C"}]}},{"id":"06-10-011","c":"06","t":"06-10","n":"11","q":"點交完成後，房東表示因水電、瓦斯、管理費尚未結清，也擔心事後發現有任何問題無法找到房客負責，故要先扣下全部押金，待1個月後再做返還。但房客執意當下要拿回押金，請問雙方可以如何處理？","o":["一般出租都是這樣在處理租屋押金的，房客必須配合","若房屋點交後才發現問題，很難再找到房客負責，惟有先扣下押金才能掌握後續扣款","房東應該先還1個月押金給房客，等帳單來了結清後再做返還","房客可與房東以先請台水、台電及瓦斯公司進行水電瓦斯費的結算並結清，即可要求返還剩餘押金"],"a":"D","ty":"case","e":{"s":"ok","x":"條例第7條第2項：出租人應於租約消滅、承租人返還住宅及清償租約所生債務時，返還押金或抵充債務後之賸餘押金；應記載事項第十五點第1項亦規定出租人應即結算租金及相關費用。結清水電瓦斯等費用後即可要求返還剩餘押金，故選(D)。","b":[{"k":"law","l":"租賃住宅市場發展及管理條例","r":"條例第7條第2項","q":"出租人應於租賃契約消滅，承租人返還租賃住宅及清償租賃契約所生之債務時，返還押金或抵充債務後之賸餘押金。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060125"},{"k":"law","l":"住宅租賃定型化契約應記載及不得記載事項（內政部）","r":"應記載事項第十五點第1項","q":"租賃關係消滅時，出租人應即結算租金及第六點約定之相關費用","u":"https://www.ey.gov.tw/File/43BC094940995CFC?A=C"}]}},{"id":"06-10-012","c":"06","t":"06-10","n":"12","q":"出租人原則同意屋內設備等均由出租人負責修繕，但簽約時出租人另外加註若為消耗品則是由承租人自行負責。承租人入住1個月後發現馬桶止水軟墊磨損漏水，承租人告知出租人應進行修繕，但出租人表示這是消耗品，依約定應為承租人自行負責。請問下列敘述何者正確？","o":["止水軟墊並沒有寫在契約的設備清單中，當然算消耗品","是否為消耗品因無法認定，所以誰都不能進行修繕","消耗品認定無法律明文規定，雙方只能協商方式處理，並在協商時對物品修繕再做清楚責任釐清","承租人自行修繕後再從租金中直接扣除即可"],"a":"C","ty":"gen","e":{"s":"unclear","x":"","b":[],"f":"法規僅規定修繕原則由出租人負擔、契約另有約定從其約定（民法第429條、應記載事項第九點），對「消耗品」範圍無明文；答案「雙方協商釐清」屬實務建議，查無可直接支持之條文。","nt":"【2026-10-24簡報複查】查糾紛處理頁25–70及倫理規範頁112–113，並搜尋「消耗品／止水／馬桶／修繕責任」：簡報沒有消耗品的認定；頁21只建議在契約清楚載明修繕責任歸屬，不足以支持「無法律明文、只能協商」的答案，維持 unclear。"}},{"id":"06-10-013","c":"06","t":"06-10","n":"13","q":"承租人承租房屋後，能否未經出租人同意即自行更換鎖具？","o":["可以，承租人有使用權，為保障個人生命財產安全及隱私，有權利更換鎖具，但最好把原本的鎖具保留","不可以，房子非承租人所有，雖有使用權，但更換鎖具仍經由出租人同意","可以，但承租人換鎖後須將備份鑰匙留存一套給出租人","不可以，換鎖後出租人就無法隨時進入做維修，所以承租人不可任意換鎖"],"a":"A","ty":"gen","e":{"s":"unclear","x":"","b":[],"f":"查無明文規定承租人得否自行換鎖；相關者僅民法第421條（使用收益權）、第431條第2項（增設工作物得取回但應回復原狀），答案「可以換鎖、宜保留原鎖」屬推論，無直接依據。","nt":"【2026-10-24簡報複查】查糾紛處理頁25–70，並搜尋「換鎖／鎖具／門鎖／鑰匙」：只有倫理規範頁178談「房東」強制換鎖構成強制罪，沒有承租人可否自行換鎖、宜保留原鎖的內容；網路搜尋只有美國資料，維持 unclear。"}},{"id":"06-10-014","c":"06","t":"06-10","n":"14","q":"承租人在租約到期點退返還房屋後，一直未將戶籍自租賃地中遷出。請問房屋所有權人該如何處理？","o":["不用處理，等承租人自己找到房子後自然會遷走","房屋所有權人可親自到戶政事務所，舉證該承租人已無居住事實及簽切結書即可辦理承租人之戶籍遷出","房屋所有權人可親自到調解委員會，舉證該承租人已無居住事實及簽切結書即可辦理承租人之戶籍遷出","想辦法請承租人自己出面去戶政事務所辦理遷出"],"a":"B","ty":"gen","e":{"s":"ok","x":"戶籍法第50條第1項：全戶遷離戶籍地未於法定期間申請遷徙登記、無法催告，經房屋所有權人申請，戶政事務所得將其全戶戶籍暫遷至該戶政事務所；承租人依應記載事項第十五點第1項本應遷出戶籍，故選(B)。","b":[{"k":"law","l":"戶籍法","r":"戶籍法第50條第1項","q":"全戶遷離戶籍地，未於法定期間申請遷徙登記，無法催告，經房屋所有權人、管理機關、地方自治機關申請或無人申請時，戶政事務所得將其全戶戶籍暫遷至該戶政事務所。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0030006"},{"k":"law","l":"住宅租賃定型化契約應記載及不得記載事項（內政部）","r":"應記載事項第十五點第1項","q":"承租人應將租賃住宅返還出租人並遷出戶籍或其他登記。","u":"https://www.ey.gov.tw/File/43BC094940995CFC?A=C"}],"nt":"依戶籍法第50條實際係「暫遷至戶政事務所」，非一般遷出登記。"}},{"id":"06-10-015","c":"06","t":"06-10","n":"15","q":"甲向乙承租住家一間，於繳租日時延遲多日未繳，乙告知甲契約當中已簽下：「租金延遲繳交3日者，本租約自動失效，房客所有物品視為廢棄物處理。」甲已欠租超過3天，乙要求甲立刻搬離，否則將丟棄甲屋內物品，試問乙的處理方式是正確的嗎？","o":["可以，契約自由原則，甲承諾不延遲繳交，乙當可依契約執行","不可以，依民法規定，欠租須累計至2個月的租金額度，甲才能終止契約","不可以，房東應有容忍的義務，延遲付租非不付租金，要先通知房客繳租，房客若仍不付租金，才可終止租約。","可以，付租是應該的，房東收不到租金，自然無須再提供租賃物"],"a":"B","ty":"case","e":{"s":"ok","x":"民法第440條第2項：租賃物為房屋者，遲付租金總額非達二個月之租額，不得終止契約（條例第10條第1項第2款同旨，且須定相當期限催告）；「遲繳3日自動失效、物品視為廢棄物」之約定不得據以終止及丟棄物品，故選(B)。","b":[{"k":"law","l":"民法","r":"民法第440條第2項","q":"租賃物為房屋者，遲付租金之總額，非達二個月之租額，不得依前項之規定，終止契約。","u":"https://mojlaw.moj.gov.tw/LawContent.aspx?LSID=FL001351"},{"k":"law","l":"租賃住宅市場發展及管理條例","r":"條例第10條第1項第2款","q":"二、承租人遲付租金或費用，達二個月之租額，經定相當期限催告仍拒繳。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060125"}],"nt":"選項(B)文字「甲才能終止契約」應為出租人乙得終止，屬題目筆誤，不影響答案。"}},{"id":"06-10-016","c":"06","t":"06-10","n":"16","q":"甲向乙承租房屋居住使用，契約尚餘2個月到期，甲告知乙，直接自押金扣抵即可，日後就無須再返還押租金，請問甲的做法是正確的嗎？","o":["押金是可清償租賃契約所產生的債務，甲為押金支付者，當然有權決定扣抵","押金為承租人擔保承租期間損害賠償行為和處理遺留物責任，預先支付之金錢，房客不可任意主張扣抵","為避免甲在返還房屋時被乙隨意扣抵押金，甲為自保當然可以主張扣抵","甲若不支付租金，自然刑成債務，押金可做清償租賃期間所生之債務，因此，甲根本不用告知房東，直接扣抵即可"],"a":"B","ty":"neg","e":{"s":"ok","x":"條例第3條第13款：押金係承租人為擔保損害賠償及處理遺留物責任預為支付之金錢；依第7條第2項及應記載事項第五點第2項，押金於租約消滅、返還住宅時由出租人返還或抵充債務，承租人不得於租期中任意主張以押金扣抵租金，故選(B)。","b":[{"k":"law","l":"租賃住宅市場發展及管理條例","r":"條例第3條第13款","q":"十三、押金：指承租人為擔保租賃住宅之損害賠償行為及處理遺留物責任，預為支付之金錢。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060125"},{"k":"law","l":"租賃住宅市場發展及管理條例","r":"條例第7條第2項","q":"出租人應於租賃契約消滅，承租人返還租賃住宅及清償租賃契約所生之債務時，返還押金或抵充債務後之賸餘押金。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060125"},{"k":"law","l":"住宅租賃定型化契約應記載及不得記載事項（內政部）","r":"應記載事項第五點第2項","q":"出租人應於租期屆滿或租賃契約終止，承租人返還租賃住宅時，返還押金或抵充本契約所生債務後之賸餘押金。","u":"https://www.ey.gov.tw/File/43BC094940995CFC?A=C"}]}},{"id":"06-10-017","c":"06","t":"06-10","n":"17","q":"房東甲賣屋後，新屋主乙接手後告知現有承租戶丙，舊有租約雖然租期未達五年但已不適用，要重新簽定新約，若不簽約，丙將無權在此居住，請問下列敍述何者正確？","o":["依民法規定房屋轉讓，原有房客雖有居住權利，但租約仍應重新簽定","乙已成為新屋主，可自行決定是否要重新簽定租約","依民法規定，房屋經轉讓他人，原有契約對房客仍然有效","依土地法規定，房屋經轉讓他人，原有契約對房客仍然有效"],"a":"C","ty":"neg","e":{"s":"ok","x":"民法第425條第1項：出租人於租賃物交付後、承租人占有中將所有權讓與第三人，租賃契約對受讓人仍繼續存在（買賣不破租賃）；依據為民法而非土地法，故選(C)。","b":[{"k":"law","l":"民法","r":"民法第425條第1項","q":"出租人於租賃物交付後，承租人占有中，縱將其所有權讓與第三人，其租賃契約，對於受讓人仍繼續存在。","u":"https://mojlaw.moj.gov.tw/LawContent.aspx?LSID=FL001351"},{"k":"law","l":"住宅租賃定型化契約應記載及不得記載事項（內政部）","r":"應記載事項第十六點第1項","q":"出租人於租賃住宅交付後，承租人占有中，縱將其所有權讓與第三人，本契約對於受讓人仍繼續存在。","u":"https://www.ey.gov.tw/File/43BC094940995CFC?A=C"}]}},{"id":"07-01-001","c":"07","t":"07-01","n":"01","q":"住戶大門口若有懸掛張貼白底黑字之「避難器具」標示，則此住戶內部應有哪一種消防設備？","o":["自動撒水","火警自動警報","廣播喇叭","避難逃生設備如緩降機"],"a":"D","ty":"gen","e":{"s":"ok","x":"各類場所消防安全設備設置標準第166條：設置避難器具時，應於「避難器具或其附近明顯易見處」以白底黑字、「避難器具」字樣標示其設置位置及使用方法；同標準第10條第2款，避難器具指滑臺、避難梯、避難橋、救助袋、緩降機、避難繩索、滑杆等。故張貼「避難器具」標示之住戶內設有緩降機等避難逃生設備，故選(D)。","b":[{"k":"law","l":"各類場所消防安全設備設置標準","r":"第166條","q":"設置避難器具時，依下表標示其設置位置、使用方法並設置指標：","m":"表列「設置位置、使用方法」之標示，設置處所為「避難器具或其附近明顯易見處」，顏色為白底黑字，字樣為「避難器具」，每字五平方公分以上。","u":"https://lawplayer.com/act/6437d0bee800e5f0b9302304/17"},{"k":"law","l":"各類場所消防安全設備設置標準","r":"第10條第2款","q":"避難器具：指滑臺、避難梯、避難橋、救助袋、緩降機、避難繩索、滑杆及其他避難器具。","u":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0120029"}],"nt":"簡報屋況點交建3-1未提及避難器具標示。"}},{"id":"07-01-002","c":"07","t":"07-01","n":"02","q":"某具有撒水設備的住宅，若大門口任一側撒水管路有制水閥開關之設計，則該開關應保持何種狀態？","o":["該樓層所有住戶應共同協議開啟與否","應依照公寓大廈規約規定開啟與否","應保持關閉以防止漏水","應保持開啟狀態"],"a":"D","ty":"gen","e":{"s":"ok","x":"簡報（建3-1）頁25：自動撒水設備對火災初期抑制有顯著效果，「室內裝修行為中，亦不得將撒水閥件任意關閉」，並以照片標示「各戶消防撒水閘閥開關」；故撒水管路之制水閥應保持開啟狀態，故選(D)。","b":[{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－建物與室內裝修管理實務（建3-1～建3-3）","r":"頁碼25（PDF第26頁）","q":"同時室內裝修行為中，亦不得將撒水閥件任意關閉。"},{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－建物與室內裝修管理實務（建3-1～建3-3）","r":"頁碼25（PDF第26頁）","q":"各戶消防撒水閘閥開關"}]}},{"id":"07-01-003","c":"07","t":"07-01","n":"03","q":"RC表示為哪一種建築物之結構代號？","o":["磚造","加強磚造","鋼筋混凝土造","木構造"],"a":"C","ty":"gen","e":{"s":"ok","x":"苗栗縣政府建築管理科說明：「RC 結構（鋼筋混凝土）：主要建材為鋼筋混凝土…」；簡報（建3-1）頁6使用執照存根「構造種類」欄即載「RC造」。故RC為鋼筋混凝土造之代號，故選(C)。","b":[{"k":"web","l":"苗栗縣政府工商發展處建築管理科－建築小學堂「什麼是RC、SC及SRC建築結構呢？」","r":"","q":"RC 結構（鋼筋混凝土）：主要建材為鋼筋混凝土，為台灣業界施工技術最純熟的工法，10～15層中低層建築適用，9成的住宅就是以此結構構築","u":"https://www.miaoli.gov.tw/economic_development/News_Content.aspx?n=1028&s=743448"},{"k":"slide","l":"簡報：租賃住宅管理人員換證訓練教材－建物與室內裝修管理實務（建3-1～建3-3）","r":"頁碼6（PDF第7頁）","q":"構造種類 RC造"}]}},{"id":"07-01-004","c":"07","t":"07-01","n":"04","q":"SRC表示為哪一種建築物之結構代號？","o":["磚造","加強磚造","鋼骨鋼筋混凝土造","鋼筋混凝土造"],"a":"C","ty":"gen","e":{"s":"ok","x":"苗栗縣政府建築管理科說明：「SRC構造（鋼骨鋼筋混凝土）：由型鋼組樑柱構架後，鋼骨外組立鋼筋及灌混凝土的方式…」，故SRC為鋼骨鋼筋混凝土造之代號，故選(C)。","b":[{"k":"web","l":"苗栗縣政府工商發展處建築管理科－建築小學堂「什麼是RC、SC及SRC建築結構呢？」","r":"","q":"SRC構造（鋼骨鋼筋混凝土）：由型鋼組樑柱構架後，鋼骨外組立鋼筋及灌混凝土的方式，施工技術及品質要求高，分別綜合了RC及SC結構的耐震及住宅舒適度","u":"https://www.miaoli.gov.tw/economic_development/News_Content.aspx?n=1028&s=743448"}],"nt":"簡報屋況點交建3-1未列構造代號對照。"}},{"id":"07-01-005","c":"07","t":"07-01","n":"05","q":"B表示為哪一種建築物之結構代號？","o":["磚造","加強磚造","鋼骨鋼筋混凝土造","鋼筋混凝土造"],"a":"A","ty":"gen","e":{"s":"not_found","x":"","b":[],"f":"簡報屋況點交建3-1頁2–27（含頁6使用執照存根圖「RC造」、頁11謄本圖「鋼筋混凝土造」）均無構造代號對照，也沒有「磚造」字樣；三份簡報全文搜尋「磚造」「RB」無結果。官方網頁方面，苗栗縣政府建築管理科只說明RC、SC、SRC，沒有提到B、RB；臺北市建管處公安申報手冊中的「B」是用途類組（商業類）。稅務機關「房屋構造別代號一覽表」另成一套代碼，其中B代表鋼筋混凝土
